<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chama</title>
<meta name="theme-color" content="#0f7a4d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--g:#0f7a4d;--g2:#e6f4ec;--ink:#14231b;--mut:#5d6b63;--bg:#f4f7f5;--card:#fff;--line:#dfe7e2;--red:#c0392b;--amb:#b7791f;--blue:#2b6cb0}
@media(prefers-color-scheme:dark){:root{--g:#2fb877;--g2:#16362a;--ink:#e8f1ec;--mut:#9db0a6;--bg:#0e1511;--card:#17211b;--line:#27362d;--red:#ff7b6b;--amb:#f0b54a;--blue:#7bb0f0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;margin:0 -14px 14px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top .clogo{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff;flex:0 0 auto}.top h1{font-size:18px;margin:0;flex:1}.top .sub{font-size:12px;opacity:.85}
.top button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{margin:0 0 8px;font-size:15px}.hero{background:linear-gradient(135deg,var(--g),#0a5c3a);color:#fff;border:0}
.hero .big{font-size:25px;font-weight:800;letter-spacing:-.5px}.hero small{opacity:.85}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}.b{font-weight:700}.right{text-align:right}.center{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.stat{font-size:20px;font-weight:800}.lbl{font-size:12px;color:var(--mut)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--g2);color:var(--g)}
.chip.red{background:#fde8e5;color:var(--red)}.chip.amb{background:#fdf1d8;color:var(--amb)}.chip.blue{background:#e3eefb;color:var(--blue)}.chip.gray{background:var(--line);color:var(--mut)}
@media(prefers-color-scheme:dark){.chip.red{background:#3b1a16}.chip.amb{background:#3a2c10}.chip.blue{background:#14263d}}
button,.btn{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--g);color:#fff;font-weight:700;font-size:16px;text-align:center;text-decoration:none}
.btn.sec{background:var(--g2);color:var(--g)}.btn.red{background:var(--red)}.btn.sm{display:inline-block;width:auto;padding:8px 13px;font-size:14px;border-radius:10px}.btn[disabled]{opacity:.5}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav div{display:flex;max-width:640px;width:100%}.nav button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:11px;color:var(--mut);position:relative}
.nav button b{display:block;font-size:21px;line-height:1.1}.nav button.on{color:var(--g);font-weight:700}
.dot{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#14231b;color:#fff;padding:11px 16px;border-radius:12px;z-index:30;max-width:90%;font-size:14px}
.err{background:#fde8e5;color:var(--red);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.ok{background:var(--g2);color:var(--g);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.warn{background:#fdf1d8;color:var(--amb);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:12px}td.n,th.n{text-align:right}
.scroll{overflow-x:auto}.pills{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}.pills button{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font-size:14px}.pills button.on{background:var(--g);color:#fff;border-color:var(--g)}
.login{padding-top:8vh}.login .logo{width:76px;height:76px;border-radius:20px;display:block;margin:0 auto 12px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
@media print{.top,.nav,.noprint,.toast{display:none!important}body{background:#fff;color:#000}.card{border:0;box-shadow:none}#app{max-width:none;padding:0}th,td{border-color:#999}body.print-sheet #app{display:none!important}body.print-sheet .sheet{position:static;background:#fff;display:block}body.print-sheet .sheet>div{max-width:none;max-height:none;overflow:visible;border-radius:0;padding:0}.scroll{overflow:visible!important}table{page-break-inside:auto}tr{page-break-inside:avoid}thead{display:table-header-group}.pdate{display:block!important}}.pdate{display:none;color:#555;font-size:12px;margin:0 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kes = (c) => 'KES ' + (Math.round(Number(c) || 0) / 100).toLocaleString('en-KE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let CID = (new URLSearchParams(location.search).get('c') || '').trim();
if (CID) store.set('chama_c', CID); else CID = store.get('chama_c') || '';
let TOKEN = store.get('chama_t') || '';
const S = { home: null, tab: 'home', sub: '', stack: [], busy: false };
const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
async function api(action, body) {
  let r;
  try { r = await fetch('/api/chama?c=' + encodeURIComponent(CID), { method: 'POST', headers: { 'content-type': 'application/json', 'X-Chama-Token': TOKEN }, body: JSON.stringify({ ...(body || {}), action }) }); }
  catch (e) { const x = new Error('No internet. This app needs a connection to save your chama’s money records.'); x.offline = true; throw x; }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && TOKEN && action !== 'login') { TOKEN = ''; store.del('chama_t'); S.home = null; render(); const x = new Error('Please sign in again.'); x.auth = true; throw x; }
  if (!r.ok || j.ok === false) { const x = new Error(j.error || 'Something went wrong. Try again.'); x.code = j.code; x.status = r.status; throw x; }
  return j;
}
const go = (tab, sub) => { S.tab = tab; S.sub = sub || ''; S.stack = []; render(); window.scrollTo(0, 0); };
async function guard(fn, btn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { if (!e.auth) toast(e.message); return null; } finally { if (btn) btn.disabled = false; } }
function sheet(html, onMount) { closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sheet'; d.innerHTML = '<div>' + html + '</div>'; d.addEventListener('click', (e) => { if (e.target === d) closeSheet(); }); document.body.appendChild(d); if (onMount) onMount(d); return d; }
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }
const has = (p) => !!(S.home && S.home.me && (S.home.me.perms.includes('*') || S.home.me.perms.includes(p)));
const feat = (f) => !!(S.home && S.home.group.features[f]);
const chipFor = (st) => ({ complete: '<span class="chip">Complete</span>', partial: '<span class="chip amb">Partial</span>', not_started: '<span class="chip red">Not started</span>', pending: '<span class="chip amb">Waiting</span>', verified: '<span class="chip">Confirmed</span>', rejected: '<span class="chip red">Not confirmed</span>', overdue: '<span class="chip red">Overdue</span>', reversed: '<span class="chip gray">Reversed</span>' }[st] || '<span class="chip gray">' + esc(st) + '</span>');
const statusWord = (st) => ({ complete: 'Complete', partial: 'Partial', not_started: 'Not started', not_started_: '' }[st] || st);
const pct = (a, b) => (b > 0 ? Math.max(0, Math.min(100, Math.round(a / b * 100))) : 0);
const field = (id, label, val, type, extra) => `<label for="${id}">${esc(label)}</label><input id="${id}" type="${type || 'text'}" value="${esc(val == null ? '' : val)}" ${extra || ''}>`;
const val = (id) => { const e = $('#' + id); return e ? e.value : ''; };
function csv(name, columns, rows) { const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const t = [columns.map(q).join(',')].concat(rows.map((r) => r.map(q).join(','))).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + t], { type: 'text/csv' })); a.download = name; a.click(); }

/* ---------- shell ---------- */
function shell(title, inner, opts) {
  opts = opts || {};
  const back = S.stack.length ? '<button onclick="back()" aria-label="Back">←</button>' : '';
  return `<div class="top">${back}${logoImg('clogo')}<div style="flex:1"><h1>${esc(title)}</h1>${S.home && S.home.group.name !== title ? `<div class="sub">${esc(S.home.group.name)}</div>` : ''}</div>${opts.right || ''}</div>${inner}`;
}
function back() { const p = S.stack.pop(); if (p) { S.tab = p.tab; S.sub = p.sub; } render(); window.scrollTo(0, 0); }
function push(sub, data) { S.stack.push({ tab: S.tab, sub: S.sub }); S.sub = sub; S.data = data; render(); window.scrollTo(0, 0); }
function navHTML() {
  const h = S.home, n = h.member, st = h.staff;
  const items = [['home', '🏠', 'Home'], ['pay', '💸', 'Pay']];
  if (feat('meetings')) items.push(['meetings', '📅', 'Meetings']);
  if (feat('loans')) items.push(['loans', '🤝', 'Loans']);
  if (st) items.push(['staff', '🛠️', 'Staff']);
  items.push(['more', '☰', 'More']);
  return '<div class="nav"><div>' + items.map(([k, i, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="go('${k}')"><b>${i}</b>${l}${k === 'more' && n.unread ? `<span class="dot">${n.unread}</span>` : ''}${k === 'staff' && st && st.pendingReports ? `<span class="dot">${st.pendingReports}</span>` : ''}</button>`).join('') + '</div></div>';
}
// zip 232: SPEED — the home figures are kept for 20 s (every tap used to download them again) and the last copy is saved on the phone, so the app paints at once and refreshes behind the scenes. A save sets S.home = null, which forces a fresh read.
const homeKey = () => 'chama_home_' + CID + '_' + String(TOKEN).slice(-10);
async function loadHome(force) {
  if (!force && S.home && Date.now() - (S.homeAt || 0) < 20000) return S.home;
  S.home = await api('home'); S.homeAt = Date.now(); S.fromCache = false;
  if (!S.home.me.mustChangePin) store.set(homeKey(), JSON.stringify(S.home));
  syncLogo(S.home.group.logoV);
  return S.home;
}
async function render() {
  const app = $('#app');
  if (!CID) { app.innerHTML = '<div class="login card center"><h3>Open your chama link</h3><p class="mut">Use the link your chama admin sent you. It looks like <b>/chama/?c=…</b></p></div>'; return; }
  if (!TOKEN) return renderLogin();
  if (!S.home) { const c = store.get(homeKey()); if (c) { try { S.home = JSON.parse(c); S.homeAt = Date.now(); S.fromCache = true; } catch (e) { S.home = null; } } }
  if (S.fromCache) { S.fromCache = false; loadHome(true).then(() => { if (!document.getElementById('sheet') && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); }).catch(() => {}); }
  if (!S.home) { app.innerHTML = '<div class="empty">Loading…</div>'; try { await loadHome(); } catch (e) { if (e.auth) return; app.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="render()">Try again</button></div>`; return; } }
  if (S.home.me.mustChangePin) return renderPinChange(true);
  const v = VIEWS[S.sub] || VIEWS[S.tab] || VIEWS.home;
  let html; try { html = await v(); } catch (e) { if (e.auth) return; html = shell('Chama', `<div class="err">${esc(e.message)}</div><button class="btn" onclick="render()">Try again</button>`); }
  app.innerHTML = html + navHTML();
  if (v.after) v.after();
}

/* ---------- sign in / set-up ---------- */
async function renderLogin() {
  const app = $('#app'); app.innerHTML = '<div class="empty">Loading…</div>';
  let st; try { st = await api('status'); } catch (e) { app.innerHTML = `<div class="login card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="render()">Try again</button></div>`; return; }
  const logo = '<img class="logo" src="icons/icon-192.png" alt="">';
  if (st.setupNeeded) {
    app.innerHTML = `<div class="login">${logo}<h2 class="center" style="margin:0 0 4px">Set up your chama</h2><p class="center mut">You will be the admin. Everything else can be changed later in Settings.</p><div class="card">${field('s-g', 'Chama name', '', 'text', 'placeholder="e.g. Umoja Chama" autocomplete="off"')}${field('s-n', 'Your name', '', 'text', 'autocomplete="name"')}${field('s-p', 'Your phone number', '', 'tel', 'placeholder="0712 345 678" autocomplete="tel"')}${field('s-pin', 'Choose a PIN (4–6 digits)', '', 'password', 'inputmode="numeric" maxlength="6" autocomplete="new-password"')}<div id="s-e"></div><br><button class="btn" onclick="doSetup(this)">Create my chama</button></div></div>`;
    return;
  }
  app.innerHTML = `<div class="login">${logo}<h2 class="center" style="margin:0 0 4px">${esc(st.name || 'Chama')}</h2><p class="center mut">Sign in with your phone number and PIN</p><div class="card">${field('l-p', 'Phone number', store.get('chama_phone') || '', 'tel', 'placeholder="0712 345 678" autocomplete="tel"')}${field('l-pin', 'PIN', '', 'password', 'inputmode="numeric" maxlength="6" autocomplete="current-password"')}<label class="row" style="margin-top:12px;font-weight:500"><input type="checkbox" id="l-r" checked style="width:auto"> Remember this phone</label><div id="l-e"></div><br><button class="btn" id="l-b" onclick="doLogin(this)">Sign in</button><p class="mut center" style="margin:12px 0 0">Forgot your PIN? Ask your admin to reset it.</p></div></div>`;
  const pin = $('#l-pin'); if (pin) pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin($('#l-b')); });
}
function showErr(id, m) { const e = $('#' + id); if (e) e.innerHTML = m ? `<div class="err">${esc(m)}</div>` : ''; }
async function doSetup(b) { showErr('s-e', ''); b.disabled = true; try { const r = await api('setup', { groupName: val('s-g'), name: val('s-n'), phone: val('s-p'), pin: val('s-pin') }); TOKEN = r.token; store.set('chama_t', TOKEN); store.set('chama_phone', val('s-p')); S.home = null; S.tab = 'home'; render(); } catch (e) { showErr('s-e', e.message); } b.disabled = false; }
async function doLogin(b) { showErr('l-e', ''); b.disabled = true; try { const rem = $('#l-r').checked; const r = await api('login', { phone: val('l-p'), pin: val('l-pin'), remember: rem, label: (navigator.userAgent.match(/\(([^)]+)\)/) || [])[1] || 'Phone' }); TOKEN = r.token; if (rem) store.set('chama_t', TOKEN); else store.del('chama_t'); store.set('chama_phone', val('l-p')); S.home = null; S.tab = 'home'; render(); } catch (e) { showErr('l-e', e.message); } b.disabled = false; }
function renderPinChange(forced) {
  $('#app').innerHTML = `<div class="login"><h2 class="center">${forced ? 'Choose your own PIN' : 'Change PIN'}</h2><p class="center mut">${forced ? 'The PIN your admin gave you was temporary.' : ''}</p><div class="card">${field('p-o', 'Current PIN', '', 'password', 'inputmode="numeric" maxlength="6"')}${field('p-n', 'New PIN (4–6 digits)', '', 'password', 'inputmode="numeric" maxlength="6"')}<div id="p-e"></div><br><button class="btn" onclick="doPin(this)">Save PIN</button>${forced ? '' : '<br><button class="btn sec" onclick="render()">Cancel</button>'}</div></div>`;
}
async function doPin(b) { showErr('p-e', ''); b.disabled = true; try { await api('pin.change', { oldPin: val('p-o'), newPin: val('p-n') }); toast('PIN changed'); S.home = null; S.tab = 'home'; S.sub = ''; render(); } catch (e) { showErr('p-e', e.message); } b.disabled = false; }
async function signOut() { store.del(homeKey()); try { await api('logout'); } catch (e) {} TOKEN = ''; store.del('chama_t'); S.home = null; render(); }

/* ---------- member views ---------- */
const VIEWS = {};
const when = (m) => [m.dateText, m.timeText].filter(Boolean).join(' · ');
VIEWS.home = async () => {
  await loadHome(); const h = S.home, m = h.member, c = m.cycle;
  let x = `<div class="card hero"><div style="opacity:.9">Hello ${esc(m.firstName)} 👋</div>${c ? `<div style="opacity:.85;font-size:13px">${esc(c.label)} · due ${esc(c.dueText)}</div><div class="big">${kes(c.paidCents)} <small>of ${kes(c.requiredCents)}</small></div><div class="bar" style="background:rgba(255,255,255,.25)"><i style="width:${pct(c.paidCents, c.requiredCents)}%;background:#fff"></i></div><div class="row sp"><span>${c.remainingCents > 0 ? 'Remaining ' + kes(c.remainingCents) : 'All paid ✅'}</span><span class="chip" style="background:#fff;color:#0f7a4d">${statusWord(c.status)}</span></div>${c.extraCents > 0 ? `<div style="margin-top:6px">Paid ahead: ${kes(c.extraCents)}</div>` : ''}` : `<div class="big">${kes(m.totalContributedCents)}</div><small>Your total contributions</small>`}</div>`;
  x += `<div class="grid"><div class="card"><div class="lbl">Total contributed</div><div class="stat">${kes(m.totalContributedCents)}</div></div><div class="card"><div class="lbl">Arrears</div><div class="stat" style="color:${m.arrearsCents > 0 ? 'var(--red)' : 'inherit'}">${kes(m.arrearsCents)}</div></div>${m.penaltiesCents ? `<div class="card"><div class="lbl">Penalties owed</div><div class="stat">${kes(m.penaltiesCents)}</div></div>` : ''}${m.pendingReports ? `<div class="card"><div class="lbl">Waiting for confirmation</div><div class="stat">${m.pendingReports}</div></div>` : ''}</div><br>`;
  x += `<button class="btn" onclick="go('pay')">💸 Report a payment</button><br>`;
  if (m.guarantorRequests) x += `<div class="warn" onclick="go('loans')">🤝 ${m.guarantorRequests} loan guarantor request(s) waiting for you</div>`;
  if (m.nextMeeting) x += `<div class="card" onclick="go('meetings')"><h3>📅 Next meeting</h3><div class="b">${esc(m.nextMeeting.title)}</div><div class="mut">${esc(when(m.nextMeeting))} ${m.nextMeeting.location ? '· ' + esc(m.nextMeeting.location) : ''}</div></div>`;
  if (m.nextRecipient) x += `<div class="card" onclick="go('more','mgr')"><h3>🎁 Merry-go-round</h3><div>${m.nextRecipient.isMe ? '<b>It is your turn! 🎉</b>' : 'Next recipient: <b>' + esc(m.nextRecipient.name) + '</b>'}</div><div class="mut">Due ${esc(m.nextRecipient.dueText)} · your share ${kes(m.myTurnPerMemberCents)} · paid ${kes(m.myTurnPaidCents)}</div></div>`;
  (m.loans || []).forEach((l) => { x += `<div class="card" onclick="go('loans')"><h3>🤝 Loan · ${esc(l.status)}</h3><div class="row sp"><span>${kes(l.principalCents)}</span><span class="b">Owing ${kes(l.outstandingCents)}</span></div>${l.overdueCents > 0 ? `<div class="err">Overdue ${kes(l.overdueCents)}</div>` : ''}</div>`; });
  (m.fundraisers || []).forEach((f) => { x += `<div class="card" onclick="go('more','fund')"><h3>❤️ ${esc(f.title)}</h3><div class="bar"><i style="width:${pct(f.raisedCents, f.targetCents)}%"></i></div><div class="mut">${kes(f.raisedCents)} of ${kes(f.targetCents)}</div></div>`; });
  return shell(h.group.name, x);
};
VIEWS.pay = async () => {
  await loadHome();
  const rp = await api('report.mine'); const list = rp.reports || rp.items || [];
  const kinds = [['contribution', 'Contribution']]; if (feat('loans')) kinds.push(['loan', 'Loan repayment']); if (feat('mgr')) kinds.push(['mgr', 'Merry-go-round']); if (feat('fundraising')) kinds.push(['fundraiser', 'Fundraiser']); if (feat('penalties')) kinds.push(['penalty', 'Penalty']);
  let x = `<div class="card"><h3>1. Pay by M-Pesa</h3><div class="mut">${S.home.group.payInstructions ? esc(S.home.group.payInstructions) : 'Pay the way your chama agreed, then paste the M-Pesa confirmation message below.'}</div></div>`;
  x += `<div class="card"><h3>2. Paste the M-Pesa message</h3><textarea id="pm" placeholder="Paste the full M-Pesa message here…" oninput="parseNow()"></textarea><div id="pv"></div>
  <label for="pk">What is this payment for?</label><select id="pk" onchange="kindChanged()">${kinds.map((k) => `<option value="${k[0]}">${k[1]}</option>`).join('')}</select><div id="pt"></div>
  <br><button class="btn" id="psub" onclick="submitPay(this)" disabled>Send for confirmation</button><p class="mut center">The secretary will check it. Your M-Pesa balance and the link in the message are never saved.</p></div>`;
  x += `<div class="card"><h3>Your recent reports</h3>${list.length ? list.map((r) => `<div class="item row sp"><div><div class="b">${kes(r.amount_cents != null ? r.amount_cents : r.amountCents)}</div><div class="mut">${esc(r.mpesa_code || r.code || '')} · ${esc(r.kind || '')}</div>${r.note ? `<div class="mut">${esc(r.note)}</div>` : ''}</div>${chipFor(r.status)}</div>`).join('') : '<div class="empty">No reports yet.</div>'}</div>`;
  S.payInfo = null; return shell('Report payment', x);
};
let parseTimer = 0;
function parseNow() { clearTimeout(parseTimer); parseTimer = setTimeout(async () => { const t = val('pm'); const pv = $('#pv'), b = $('#psub'); if (!pv) return; if (t.trim().length < 15) { pv.innerHTML = ''; b.disabled = true; S.payInfo = null; return; } try { const r = await api('report.parse', { text: t }); if (!r.ok) { pv.innerHTML = `<div class="err">${esc(r.error || 'We could not read that message.')}</div>`; b.disabled = true; S.payInfo = null; return; } S.payInfo = r; pv.innerHTML = r.duplicate ? `<div class="err">${esc(r.duplicateMessage)}</div>` : `<div class="ok"><b>${kes(r.amountCents)}</b> · ${esc(r.code)}<br>${esc(r.dateText)} ${esc(r.timeText)}${r.recipient ? '<br>Sent to ' + esc(r.recipient) : ''}</div>`; b.disabled = !!r.duplicate; } catch (e) { pv.innerHTML = `<div class="err">${esc(e.message)}</div>`; } }, 350); }
async function kindChanged() {
  const k = val('pk'), pt = $('#pt'); pt.innerHTML = '';
  if (k === 'loan') { const r = await guard(() => api('loan.mine')); const ls = ((r && r.loans) || []).filter((l) => l.status === 'active'); pt.innerHTML = ls.length ? `<label>Which loan?</label><select id="ptarget">${ls.map((l) => `<option value="${l.id}">${kes(l.principalCents)} · owing ${kes(l.outstandingCents)}</option>`).join('')}</select>` : '<div class="warn">You have no active loan.</div>'; }
  if (k === 'fundraiser') { const r = await guard(() => api('fundraiser.list')); const fs = ((r && r.fundraisers) || []).filter((f) => f.status === 'active'); pt.innerHTML = fs.length ? `<label>Which fundraiser?</label><select id="ptarget">${fs.map((f) => `<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select><label class="row" style="font-weight:500"><input type="checkbox" id="panon" style="width:auto"> Give anonymously</label>` : '<div class="warn">No fundraiser is open.</div>'; }
}
async function submitPay(b) {
  if (!S.payInfo || S.payInfo.duplicate) return; const kind = val('pk'); const t = $('#ptarget');
  const r = await guard(() => dupAsk((force) => api('report.submit', { text: val('pm'), kind, targetId: t ? t.value : undefined, anonymous: !!($('#panon') && $('#panon').checked), requestId: S.payRid || (S.payRid = rid()), force })), b);
  if (r) { S.payRid = null; toast('Sent ✅ The secretary will confirm it.'); render(); }
}

/* ---------- admin: undo a payment, reset test payments (zip 235) ---------- */
function payBlock(id, name, pays) {
  const items = pays && pays.items ? pays.items.filter((i) => ['contribution', 'mgr_contribution', 'fundraising', 'penalty', 'loan_repayment'].includes(i.kind) || i.reversalOf) : [];
  return `<h4>Payments (admin)</h4><div class="mut" style="margin-bottom:6px">Recorded something twice? Tap <b>Undo</b> on it. The original stays in the history with a matching correction — nothing is erased.</div>${items.length ? items.map((i) => `<div class="item"><div class="row sp"><div class="b">${esc(i.kind.replace(/_/g, ' '))}${i.reversalOf ? ' (correction)' : ''}</div><b style="color:${i.amountCents < 0 ? 'var(--red)' : 'var(--g)'}">${kes(i.amountCents)}</b></div><div class="mut">${esc(i.dateText)} ${esc(i.reference)} ${esc(i.note)}</div>${!i.reversalOf && !i.reversed ? `<button class="btn sec sm" style="margin-top:6px" onclick="undoPay('${i.id}','${id}')">↩ Undo this payment</button>` : i.reversed ? '<span class="chip gray">Undone</span>' : ''}</div>`).join('') : '<div class="mut">No payments recorded yet.</div>'}<div class="row wrap" style="margin:10px 0"><button class="btn red sm" onclick="resetMember('${id}','${esc(name.replace(/'/g, ''))}')">🧹 Reset test payments for ${esc(name.split(' ')[0])}</button></div>`;
}
async function undoPay(id, memberId) {
  const reason = prompt('Undo this payment — why? (for example: recorded twice). The original stays in the history and a matching correction is added.'); if (!reason) return;
  const r = await guard(() => api('ledger.reverse', { id, reason })); if (r) { toast('Undone ✅'); S.homeAt = 0; store.del(homeKey()); try { await loadHome(true); } catch (e) { /* the next screen reloads it */ } memberView(memberId); }
}
async function undoTurn(id, name) {
  if (!confirm('Undo "' + name + ' has received"?\n\nThey go back to waiting. If a payout was recorded for them it is cancelled by a matching correction (nothing is erased).')) return;
  const r = await guard(() => api('mgr.undoTurn', { turnId: id, reason: 'Marked as received by mistake' })); if (r) { toast('Undone ✅ ' + name + ' is waiting again'); S.home = null; store.del(homeKey()); render(); }
}
async function resetMember(id, name) {
  if (!confirm('Clear ALL the payments recorded for ' + name + '?\n\nUse this when someone was only testing. Every payment of theirs is cancelled by a matching correction (nothing is erased from the history), and their waiting reports are cleared. Loans, payouts and expenses are not touched.')) return;
  const r = await guard(() => api('payments.reset', { memberId: id, reason: 'Test payments cleared' })); if (r) { toast(r.reversed ? r.reversed + ' payment' + (r.reversed === 1 ? '' : 's') + ' cleared ✅' : 'Nothing to clear'); S.home = null; closeSheet(); render(); }
}
async function resetAllTest() {
  const t = prompt('This clears EVERY member\'s recorded payments (use it once, after a test run). Nothing is erased: each payment is cancelled by a matching correction, and loans, payouts and expenses are not touched.\n\nType RESET to continue.'); if (!t) return;
  const r = await guard(() => api('payments.reset', { all: true, confirm: t, reason: 'Test payments cleared' })); if (r) { toast(r.reversed ? r.reversed + ' payment' + (r.reversed === 1 ? '' : 's') + ' cleared ✅' : 'Nothing to clear'); S.home = null; render(); }
}
// a payment that looks just like one recorded in the last 2 minutes: ask once, then record it if the person says it really is a second payment
async function dupAsk(call) {
  try { return await call(false); }

}

async function submitCash(b) {

function confirmCash(id, cents, name) {

function ccChanged(cents) { const w = $('#cc-w'); if (w) w.style.display = Math.round(Number(val('cc-a')) * 100) !== cents ? '' : 'none'; }
async function doConfirmCash(id, cents, b) {
  const a = Math.round(Number(val('cc-a')) * 100); showErr('cc-e', '');
  if (!(a > 0)) return showErr('cc-e', 'Type the amount you received.');

  if (r) { closeSheet(); toast('Confirmed ✅'); S.home = null; render(); }
}

/* ---------- the merry-go-round: status card, collection, schedule ---------- */
const cdText = (c) => (!c ? '' : c.today ? 'Today' : c.overdue ? c.text : c.days === 0 ? c.hours + ' hours' : c.text);

    x += `<div class="row wrap" style="gap:8px;margin-bottom:12px"><span class="chip">✔ ${r.completed} received</span><span class="chip blue">▶ 1 next</span><span class="chip gray">⏳ ${r.waiting} waiting</span></div>`;
    x += `<div class="card"><h3>Your share this turn</h3><div class="row sp"><span>Required</span><b>${kes(n.myShareCents)}</b></div><div class="row sp"><span>Paid</span><b>${kes(n.myPaidCents)}</b></div>${n.myPendingCents ? `<div class="row sp"><span>Waiting to be confirmed</span><b>${kes(n.myPendingCents)}</b></div>` : ''}<div class="row sp"><span>Remaining</span><b style="color:${n.myRemainingCents ? 'var(--red)' : 'inherit'}">${kes(n.myRemainingCents)}</b></div>${n.myRemainingCents ? `<br><button class="btn" onclick="S.payKind='mgr';go('pay')">💸 Report payment</button>` : '<div class="ok">You have paid your share ✅</div>'}</div>`;
  } else x += '<div class="card"><h3>Every turn is done 🎉</h3>' + (r.canManage ? '<button class="btn red" onclick="closeMgr()">Close this round</button>' : '') + '</div>';
  if (r.collection && n) {
    x += `<div class="card"><h3>Next payout collection</h3><div class="mut">${esc(n.name)} · expected ${kes(n.expectedCents)} · collected ${kes(n.collectedCents)} · outstanding ${kes(n.outstandingCents)}</div><div class="scroll"><table><tr><th>Member</th><th class="n">Required</th><th class="n">Paid</th><th class="n">Left</th><th></th></tr>${r.collection.map((m) => `<tr><td>${esc(m.name)}${m.pendingCents ? `<div class="mut">+${kes(m.pendingCents)} waiting</div>` : ''}</td><td class="n">${kes(m.requiredCents)}</td><td class="n">${kes(m.paidCents)}</td><td class="n">${kes(m.remainingCents)}</td><td>${STATUS_CHIP[m.status] || chipFor(m.status)}</td></tr>`).join('')}</table></div>${has('payments') ? '<br><button class="btn sec" onclick="mgrRecord()">➕ Record money received</button>' : ''}</div>`;
    x += `<div class="row wrap" style="gap:8px;margin-bottom:12px">${r.canPay ? `<button class="btn" style="flex:1" onclick="mgrPay('${n.turnId}')">Record payout</button>` : ''}<button class="btn sec" style="flex:1" onclick="mgrAdjust()">🗓 Adjust schedule</button></div>`;
  }
  x += `<div class="card"><h3>${esc(r.mgr.name)} · ${kes(r.mgr.perMemberCents)} each</h3><div class="mut">${r.mgr.everyMonths ? 'Every ' + (r.mgr.everyMonths === 1 ? 'month' : r.mgr.everyMonths + ' months') : 'Every ' + (r.mgr.everyDays === 7 ? 'week' : r.mgr.everyDays + ' days')}${r.mgr.lastPayoutText ? ' · last payout ' + esc(r.mgr.lastPayoutText) : ''}</div>${r.turns.map((t) => `<div class="item row sp"><span>${t.seq}. ${esc(t.name)}${t.isMe ? ' (you)' : ''}<div class="mut">${t.status === 'paid_out' ? (t.opening ? 'Received before the system' : 'Received ' + esc(t.paidText || t.dueText)) : 'Due ' + esc(t.dueText)}</div></span>${t.status === 'paid_out' ? '<span class="chip">Received</span>' + (has('*') ? ` <button class="btn sec sm" onclick="undoTurn('${t.id}', '${esc(t.name).replace(/'/g, '')}')">↩ Undo</button>` : '') : n && t.id === n.turnId ? '<span class="chip blue">Next</span>' : '<span class="chip gray">Waiting</span>'}</div>`).join('')}</div>`;
  S.mgr = r;
  return shell('Merry-go-round', x);
};
async function closeMgr() { if (!confirm('Close this round? You can start a new one afterwards.')) return; const r = await guard(() => api('mgr.close')); if (r) { toast('Closed'); render(); } }
const FREQ_CHOICES = [['7|0', 'Every week'], ['14|0', 'Every 2 weeks'], ['0|1', 'Every month'], ['0|2', 'Every 2 months'], ['0|3', 'Every 3 months'], ['0|6', 'Every 6 months']];
const freqParse = (v) => { const [d, m] = String(v).split('|').map(Number); return m > 0 ? { everyMonths: m } : { everyDays: d || 7 }; };
const addMonthsJs = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); if (isNaN(d)) return ''; const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); d.setUTCDate(Math.min(day, last)); return d.toISOString().slice(0, 10); };
const addDaysJs = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); if (isNaN(d)) return ''; d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
async function mgrForm(ongoing) {
  const n = await guard(() => api('members.names')); if (!n) return; S.mgrMembers = n.members; S.mgrRecv = []; S.mgrOngoing = !!ongoing;
  sheet(`<h3>${ongoing ? 'Take over a merry-go-round that is already running' : 'Start a merry-go-round'}</h3>${field('g-n', 'Name', 'Merry-go-round')}${field('g-a', 'Amount each member gives (KES)', '', 'number', 'inputmode="decimal"')}<label for="g-f">How often does someone receive?</label><select id="g-f" onchange="mgrCalc()">${FREQ_CHOICES.map((f) => `<option value="${f[0]}" ${f[0] === '0|1' ? 'selected' : ''}>${f[1]}</option>`).join('')}</select>
    <div id="g-new" style="${ongoing ? 'display:none' : ''}">${field('g-s', 'Date of the first turn', '', 'date')}</div>
    <div id="g-old" style="${ongoing ? '' : 'display:none'}"><label>Who has already received? <span class="mut">Tap in the order they received</span></label><div id="g-recv"></div>${field('g-l', 'Date the last member received money', '', 'date', 'onchange="mgrCalc()"')}<div id="g-next" class="ok" style="display:none"></div>${field('g-x', 'Next payout date (change only if it is different)', '', 'date')}
      <details style="margin-top:8px"><summary class="mut">Money already collected for the next recipient (optional)</summary><div id="g-open"></div></details></div>
    <div id="g-e"></div><br><button class="btn" onclick="saveMgr(this)">${ongoing ? 'Save the current position' : 'Start'}</button><br><button class="btn sec" onclick="closeSheet()">Cancel</button>`);
  mgrRecvDraw();
}
function mgrRecvDraw() {
  const box = $('#g-recv'); if (!box) return;
  box.innerHTML = '<div class="row wrap" style="gap:6px">' + S.mgrMembers.map((m) => { const i = S.mgrRecv.indexOf(m.id); return `<button type="button" class="btn sm ${i >= 0 ? '' : 'sec'}" onclick="mgrToggle('${m.id}')">${i >= 0 ? (i + 1) + '. ' : ''}${esc(m.name)}</button>`; }).join('') + '</div>';
  const left = S.mgrMembers.filter((m) => !S.mgrRecv.includes(m.id)); const o = $('#g-open');
  if (o) o.innerHTML = left.length ? `<p class="mut">For <b>${esc(left[0].name)}</b>, the next recipient. Type what each member has already given:</p>` + S.mgrMembers.map((m) => `<div class="row" style="margin:4px 0"><span style="flex:1">${esc(m.name)}</span><input class="g-op" data-m="${m.id}" type="number" inputmode="decimal" placeholder="0" style="width:110px"></div>`).join('') : '';
  mgrCalc();
}
function mgrToggle(id) { const i = S.mgrRecv.indexOf(id); if (i >= 0) S.mgrRecv.splice(i, 1); else S.mgrRecv.push(id); mgrRecvDraw(); }
function mgrCalc() {
  const l = val('g-l'), f = freqParse(val('g-f')), box = $('#g-next'); if (!box || !l) { if (box) box.style.display = 'none'; return; }
  const nx = f.everyMonths ? addMonthsJs(l, f.everyMonths) : addDaysJs(l, f.everyDays); if (!nx) return;
  box.style.display = ''; box.textContent = 'Next payout calculated: ' + new Date(nx + 'T00:00:00Z').toLocaleDateString('en-KE', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  const x = $('#g-x'); if (x && !x.dataset.touched) x.value = nx; if (x) x.oninput = () => { x.dataset.touched = '1'; };
}
async function saveMgr(b) {
  showErr('g-e', ''); const f = freqParse(val('g-f')), ongoing = !!S.mgrOngoing;
  const opening = {}; document.querySelectorAll('.g-op').forEach((e) => { if (Number(e.value) > 0) opening[e.dataset.m] = Number(e.value); });
  const body = { name: val('g-n'), perMember: Number(val('g-a')), ...f, ongoing, orderMode: 'fixed' };
  if (ongoing) { body.received = S.mgrRecv; body.lastPayoutDate = val('g-l'); body.nextDate = val('g-x') || undefined; body.opening = opening; } else body.startDate = val('g-s');
  const r = await guard(() => api('mgr.save', body), b); if (r) { closeSheet(); toast(ongoing ? `Saved — next: ${r.nextRecipient}` : 'Started ✅'); render(); }
}
function mgrAdjust() {
  const r = S.mgr; if (!r || !r.next) return; const open = r.turns.filter((t) => t.status === 'open');
  sheet(`<h3>Adjust the schedule</h3><p class="mut">Every change is recorded: who, when, the old value and your reason.</p><label for="ad-f">What do you want to change?</label><select id="ad-f" onchange="adForm()"><option value="nextDate">Next payout date</option><option value="recipient">Who is next</option><option value="frequency">How often</option><option value="perMember">Amount each member gives</option></select><div id="ad-b"></div>${field('ad-r', 'Reason (required)', '', 'text', 'placeholder="e.g. Members agreed to postpone the meeting"')}<div id="ad-e"></div><br><button class="btn" onclick="doAdjust(this)">Save change</button><br><button class="btn sec" onclick="closeSheet()">Cancel</button>`);

function adForm() {
  const f = val('ad-f'), r = S.mgr, b = $('#ad-b'); if (!b) return;
  b.innerHTML = f === 'nextDate' ? field('ad-v', 'New date for ' + r.next.name, r.next.dueDate, 'date') + '<label class="row" style="font-weight:500;color:var(--ink)"><input type="checkbox" id="ad-s" style="width:auto"> Move the later turns by the same dates too</label>'

    : f === 'frequency' ? `<label for="ad-v">How often</label><select id="ad-v">${FREQ_CHOICES.map((x) => `<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`
    : field('ad-v', 'Amount each member gives (KES)', r.mgr.perMemberCents / 100, 'number', 'inputmode="decimal"');
}
async function doAdjust(b) {
  const f = val('ad-f'), body = { field: f, reason: val('ad-r') }; showErr('ad-e', '');

const logoCache = () => { try { return JSON.parse(store.get('chama_logo_' + CID) || 'null'); } catch (e) { return null; } };
function logoImg(cls) { const l = logoCache(); return l && l.data ? `<img class="${cls || 'clogo'}" src="${l.data}" alt="" style="${cls === 'clogo' ? '' : 'width:40px;height:40px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:10px'}">` : ''; }
// fetch the picture only when its version stamp changed (the stamp comes with every status / home answer, the picture is a one-off download)
async function syncLogo(v) {
  v = Number(v) || 0; const have = logoCache();
  if (!v) { if (have) { store.del('chama_logo_' + CID); if (TOKEN) render(); } return; }
  if (have && have.v === v) return;
  try { const r = await api('logo.get'); if (r.logo) { store.set('chama_logo_' + CID, JSON.stringify({ v: r.v, data: r.logo })); if (!document.getElementById('sheet')) render(); } } catch (e) { /* the name shows without it */ }
}
// shrink a chosen picture to a small square (kept sharp, under ~40 KB) before it is sent
function shrinkLogo(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = () => rej(new Error('Could not read that picture.'));
    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('That is not a picture.')); im.onload = () => {
      const n = 192, c = document.createElement('canvas'); c.width = n; c.height = n; const x = c.getContext('2d'), k = Math.max(n / im.width, n / im.height), w = im.width * k, h = im.height * k;
      x.drawImage(im, (n - w) / 2, (n - h) / 2, w, h); res(c.toDataURL('image/png')); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function pickLogo(input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  const r = await guard(async () => api('logo.save', { logo: await shrinkLogo(f) }));
  if (r) { store.del('chama_logo_' + CID); await syncLogo(r.v); toast('Logo saved ✅'); render(); }
}
async function removeLogo() { const r = await guard(() => api('logo.remove')); if (r) { store.del('chama_logo_' + CID); toast('Logo removed'); render(); } }

  if (r.rules && r.rules.length) x += `<div class="card"><h3>📋 The rules in force</h3>${r.rules.map((u) => `<div class="item"><div class="b">${esc(u.title)}</div><div class="mut">${esc(u.text)}</div></div>`).join('')}<div class="mut" style="margin-top:6px">These come from the chama's settings and change when the admin changes them.</div></div>`;
  x += r.canEdit
    ? `<div class="card"><h3>📜 Terms and conditions</h3><p class="mut">Type your chama's rules and agreements. Every member can read this.</p><textarea id="tc-t" rows="14" style="width:100%;box-sizing:border-box;font-size:15px" placeholder="1. Contributions are due by the last day of each month.&#10;2. A late payment is fined as shown above.&#10;3. Members attend meetings on time…">${esc(r.text || '')}</textarea><div id="tc-e"></div><br><button class="btn" onclick="saveTerms(this)">Save terms</button>${r.updatedAt ? `<p class="mut center">Last changed ${new Date(r.updatedAt).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' })} by ${esc(r.updatedBy || '')}</p>` : ''}</div>`
    : `<div class="card"><h3>📜 Terms and conditions</h3>${r.text ? `<div style="white-space:pre-wrap;line-height:1.5">${esc(r.text)}</div>${r.updatedAt ? `<p class="mut" style="margin-top:10px">Last changed ${new Date(r.updatedAt).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' })}</p>` : ''}` : '<div class="empty">Your admin has not typed the terms yet.</div>'}</div>`;
  return shell('Terms & conditions', x);
};
async function saveTerms(b) { const r = await guard(() => api('terms.save', { text: $('#tc-t').value }), b); if (r) toast('Terms saved ✅'); }

/* ---------- start ---------- */
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
render();
</script>
</body>
