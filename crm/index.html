<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyDuka CRM</title>
<meta name="description" content="MyDuka CRM - leads, conversations and sales">
<meta name="theme-color" content="#075E54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="crm.css">
<script>
/* zip 161: start the one start-up request while the scripts are still downloading (signed-in visits only; anything unusual falls back to the normal requests). */
try {
  var m = localStorage.getItem('crm_mode'), t = m === 'owner' ? localStorage.getItem('pos_owner_session_token') : localStorage.getItem('crm_token');
  if (t && /^(#\/?(dashboard|inbox|leads|followups|calendar|products|campaigns|sales|reports|staff|settings|audit)?([\/?].*)?)?$/.test(location.hash) && !/[?&](invite|reset)=/.test(location.search)) {
    window.__crmBoot = fetch('/api/crm/boot', { headers: { Accept: 'application/json', Authorization: 'Bearer ' + t }, cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }
} catch (e) { /* no storage: the app boots the normal way */ }
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app" aria-live="polite"><div class="boot"><div class="spinner"></div></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript>MyDuka CRM needs JavaScript.</noscript>
<script src="crm-core.js"></script>
<script src="crm-leads.js"></script>
<script src="crm-inbox.js"></script>
<script src="crm-admin.js"></script>
<script src="crm-start.js"></script>
</body>
</html>
