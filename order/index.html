<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>Menu &amp; order</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1f2d3a; --muted: #6b7a88; --brand: #16a085; --line: #e3e7ec; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161b; --card: #1c232b; --ink: #e8edf2; --muted: #9aa7b4; --line: #2c3540; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  header .loc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  main { padding: 12px 16px 120px; max-width: 720px; margin: 0 auto; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 6px 12px; white-space: nowrap; font-size: 14px; }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  input, textarea { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font-size: 15px; }
  .item { display: flex; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--line); }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .desc { font-size: 13px; color: var(--muted); margin: 2px 0; }
  .price { font-weight: 700; }
  button { font: inherit; cursor: pointer; }
  .add { border: 0; background: var(--brand); color: #fff; border-radius: 8px; padding: 8px 14px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .bar .go { border: 0; background: var(--brand); color: #fff; border-radius: 10px; padding: 12px 18px; font-weight: 700; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet.open { display: flex; }
  .sheet .panel { background: var(--card); width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 16px; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .qty button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--bad); font-size: 14px; min-height: 18px; }
  .status { font-size: 20px; font-weight: 700; margin: 10px 0; }
  .center { text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<header><h1 id="biz">Menu</h1><div class="loc" id="loc"></div></header>
<main id="main"><p class="center muted">Loading the menu…</p></main>
<div class="bar" id="bar" hidden><span id="bar-sum"></span><button class="go" id="bar-go" type="button">View order</button></div>
<div class="sheet" id="sheet"><div class="panel" id="sheet-panel"></div></div>
<script src="app.js"></script>
</body>
</html>
