name = "mydukapos-wildcard-router"
main = "worker.js"
compatibility_date = "2024-09-01"

# This is what actually makes *.mydukapos.store work — Cloudflare Pages has
# no equivalent setting, which is why this Worker exists at all (see the
# comment at the top of worker.js). zone_name must match a domain that's
# already an active zone in this Cloudflare account (see the deploy guide).
[[routes]]
pattern = "*.mydukapos.store/*"
zone_name = "mydukapos.store"

# Registers the SyncRoom Durable Object class (see the bottom of worker.js)
# with THIS Worker — migrations belong in the wrangler.toml of whichever
# script actually defines the class, never in the consumer's (the mydukapos
# Pages project binds to it cross-script; see its own wrangler.toml). Run
# `wrangler deploy` from this directory after adding this so Cloudflare
# provisions the class before anything tries to bind to it.
#
# new_sqlite_classes (not the older new_classes) because Cloudflare no
# longer allows creating key-value-backed Durable Object namespaces on
# newer accounts — SQLite-backed is now the only option, and works exactly
# the same for SyncRoom's purposes here (it holds no durable storage of its
# own either way; see the class's own comment in worker.js).
[[migrations]]
tag = "v1-sync-room"
new_sqlite_classes = ["SyncRoom"]

# The per-shop database (see shop-store.js): one SQLite-backed Durable Object per shop. Deploy THIS Worker first, then
# redeploy the Pages project so its SHOP_STORE binding resolves. Nothing changes for any shop until the owner moves that
# shop to the database from the Owner Console (Storage tab).
[[migrations]]
tag = "v2-shop-store"
new_sqlite_classes = ["ShopStore"]

# Daily shop health check at 04:40 UTC (07:40 in Kenya) — see scheduled() in worker.js. Inert until HEALTH_URL and
# ROUTER_SHARED_SECRET are set on this Worker (Settings -> Variables), so deploying this changes nothing by itself.
# zip 186: a second firing every 6 hours, for the LEDGER SIZE WATCHDOG only (scheduled() in worker.js: it reads the ledger_audit figures and writes ledger_meta
# 'size_alert'). The shop health check above still runs only on the daily firing.
[triggers]
crons = ["40 4 * * *", "20 */6 * * *"]

# zip 186: the SAME D1 database as the Pages project (binding name LEDGER_DB) so the watchdog can read it. Remove this block and the watchdog is simply inert.
[[d1_databases]]
binding = "LEDGER_DB"
database_name = "mydukapos-ledger"
database_id = "12f9b35e-d4d9-468d-ac8c-2b3ff6b3848d"

# zip 129: Workers Logs for the router every shop's traffic passes through — each request's path, status and errors are kept
# (Cloudflare dashboard -> Workers -> mydukapos-wildcard-router -> Logs), so "the POS said Offline at 10:14" can be checked against
# what actually reached Cloudflare. Sampled at 5% to stay inside the free quota with every till polling; raise it while
# investigating a problem (1 = every request).
[observability]
enabled = true
head_sampling_rate = 0.05


# zip 188: MONTHLY AUDIT ARCHIVE. Create the bucket once (npx wrangler r2 bucket create mydukapos-audit-archive), then REMOVE the leading "# " from the 3 lines
# below and redeploy the router. Once a month the cron writes audit rows older than 90 days to this bucket as gzip files and only then deletes them.
# Without this block the router just trims audit rows older than 90 days (no archive). Needs the LEDGER_AUDIT_DB binding (tools\setup-audit-db.mjs).
[[r2_buckets]]
binding = "AUDIT_ARCHIVE"
bucket_name = "mydukapos-audit-archive"

# zip 194: weekly database backups (Sundays) and the daily cleanup also use R2. Optional separate bucket for the backups (otherwise AUDIT_ARCHIVE above is used,
# under the db-backups/ prefix). Example only - remove the leading "# " to activate, then redeploy the router:
[[r2_buckets]]
binding = "DB_BACKUPS"
bucket_name = "mydukapos-db-backups"
# The owner database can be bound here too so its weekly backup is taken by the cron (optional; example only):
[[d1_databases]]
binding = "OWNER_DB"
database_name = "mydukapos-owner"
database_id = "0042e3c7-b032-411e-9825-1c40227f2fb1"

# zip 187: the separate AUDIT database
[[d1_databases]]
binding = "LEDGER_AUDIT_DB"
database_name = "mydukapos-audit"
database_id = "755f7467-4d0e-461b-b852-641cc01f0bab"
