# STAGING copy of the router Worker: hosts the SyncRoom and ShopStore Durable Objects for the staging Pages project.
# Deliberately has NO [[routes]] — it must never take over the live *.mydukapos.store subdomains.
# Deploy with: npm run deploy:router:staging
name = "mydukapos-router-staging"
main = "worker.js"
compatibility_date = "2024-09-01"

[[migrations]]
tag = "v1-sync-room"
new_sqlite_classes = ["SyncRoom"]

[[migrations]]
tag = "v2-shop-store"
new_sqlite_classes = ["ShopStore"]

# zip 186: the ledger size watchdog (scheduled() in worker.js). INERT here: staging binds no LEDGER_DB to this Worker. Add a [[d1_databases]] block with
# binding = "LEDGER_DB" for the staging database to switch it on.
[triggers]
crons = ["20 */6 * * *"]
