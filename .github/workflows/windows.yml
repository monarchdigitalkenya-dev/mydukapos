# MyDukaPOS for Windows (zip 156: the 8 apps build IN PARALLEL, one runner each, then one job collects and tests) — builds the installers of the 8 apps (7 shop apps + the Owner Console) (NSIS .exe and .msi, x64) on a real Windows machine, records size and
# SHA-256 of each, then INSTALLS the Shop app silently, starts it, checks it is running, and uninstalls it.
# Code signing (optional, recommended — SmartScreen warns about unsigned installers): repository secrets CSC_LINK (base64 of the .pfx)
# and CSC_KEY_PASSWORD. Without them the installers are unsigned (they install; Windows shows "Unknown publisher").
name: windows
permissions:
  contents: read
on:
  push:
    branches: [ 'claude/**', 'main' ]
    paths: [ 'native/**', '.github/workflows/windows.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [ shop, hotel, hmis, production, pharmacy, services, aquapos, owner ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build tools
        working-directory: native/windows
        shell: pwsh
        # zip 167: works with or without a package-lock.json in the repo (the Windows copy step used to skip lock files), and no npm cache lookup
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { Write-Host 'npm ci failed - falling back to npm install'; npm install --no-audit --no-fund } } else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Build the installers (${{ matrix.app }})
        working-directory: native/windows
        env:
          CSC_LINK: '${{ secrets.CSC_LINK }}'
          CSC_KEY_PASSWORD: '${{ secrets.CSC_KEY_PASSWORD }}'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node build.mjs ${{ matrix.app }}
      - name: Keep only the installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/part | Out-Null
          Get-ChildItem native/windows/dist -Recurse -Include *.exe,*.msi | Where-Object { $_.DirectoryName -notmatch 'unpacked' -and $_.Name -notmatch '^__uninstaller' } | ForEach-Object { Copy-Item $_.FullName release/part/ }
          if ((Get-ChildItem release/part).Count -lt 2) { throw "expected the .exe and the .msi of ${{ matrix.app }}" }
      - uses: actions/upload-artifact@v4
        with: { name: 'part-${{ matrix.app }}', path: release/part, if-no-files-found: error, retention-days: 2 }

  collect:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'part-*', path: release/parts, merge-multiple: true }
      - name: Verify and collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/windows | Out-Null
          $rows = @()
          Get-ChildItem release/parts -Include *.exe,*.msi -Recurse | Where-Object { $_.Name -notmatch '^__uninstaller' } | ForEach-Object {
            Copy-Item $_.FullName release/windows/
            $sig = Get-AuthenticodeSignature $_.FullName
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $rows += [pscustomobject]@{ file = $_.Name; size = $_.Length; sha256 = $h; signature = "$($sig.Status)"; signer = "$($sig.SignerCertificate.Subject)"; arch = 'x64' }
            Write-Host "$($_.Name)  size=$($_.Length)  sha256=$h  signature=$($sig.Status)"
          }
          if ($rows.Count -lt 16) { throw "expected 16 installers (8 apps x .exe/.msi), got $($rows.Count)" }
          $rows | ConvertTo-Json | Set-Content release/windows/manifest.json
      - uses: actions/upload-artifact@v4
        with: { name: mydukapos-windows, path: release/windows, if-no-files-found: error, retention-days: 30 }
      - name: Install the Shop app (Setup.exe) silently, start it, check it runs, uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          # every wait has its own limit (Start-Process -Wait in PowerShell 7 also waits for child processes, and can hang)
          $setup = Get-ChildItem release/windows -Filter 'MyDukaPOS-*-Setup.exe' | Where-Object { $_.Name -match '^MyDukaPOS-\d' } | Select-Object -First 1
          Write-Host "installing $($setup.Name)"
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(240000)) { throw 'the installer did not finish within 4 minutes' }
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error' } -MaxEvents 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Message }
            throw "the installer failed (exit code $($p.ExitCode))"
          }
          ./native/windows/check-installed.ps1
      - name: Install the Shop app (.msi) silently, start it, check it runs, uninstall
        if: always()
        # zip 173: the .exe test above leaves the app behind for a moment (its uninstaller returns at once and finishes in the background), and
        # an .msi installed on top of that fails with 1603. The step now waits for the first install to be GONE, and when the .msi still
        # fails it prints the REAL reason from the install log (the old tail only showed the roll-back) and uploads the full log.
        # The installers themselves were already built, signed-checked and uploaded above, so this smoke test reports a warning
        # instead of turning the whole release red.
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 10
        run: |
          $msi = Get-ChildItem release/windows -Filter 'MyDukaPOS-*.msi' | Where-Object { $_.Name -match '^MyDukaPOS-\d' } | Select-Object -First 1
          # a clean machine for the .msi: stop and remove whatever the .exe test left
          Get-Process | Where-Object { $_.Path -and $_.Path -like '*\MyDukaPOS*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 30 -and (Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Directory -Filter 'MyDukaPOS*' -ErrorAction SilentlyContinue); $i++) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Directory -Filter 'MyDukaPOS*' -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          Write-Host "installing $($msi.Name)"
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', 'msi-install.log' -PassThru
          if (-not $p.WaitForExit(240000)) { throw 'msiexec did not finish within 4 minutes' }
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            # the line that matters is the first "Return value 3" / "Error 1xxx" - the end of the log is only the roll-back
            Select-String -Path msi-install.log -Pattern 'Return value 3', 'Error 1\d\d\d', 'Error 2\d\d\d', 'CustomAction .* returned actual error' -Context 12, 4 | Select-Object -First 3 | ForEach-Object { Write-Host $_.ToString() }
            Get-Content msi-install.log -Tail 20
            Write-Host "::warning::the .msi smoke test failed (exit code $($p.ExitCode)); the .exe installer passed. See the msi-install-log artifact."
            exit 1
          }
          ./native/windows/check-installed.ps1 -NoUninstaller
          $u = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn' -PassThru
          if ($u.WaitForExit(120000)) { Write-Host "MSI uninstall exit code: $($u.ExitCode)" } else { Write-Host 'WARNING: the MSI uninstall did not finish within 2 minutes' }
      - name: Keep the .msi install log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: msi-install-log, path: msi-install.log, if-no-files-found: ignore, retention-days: 7 }
