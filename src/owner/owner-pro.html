<!-- OWNER PRO (zip 304) ---------------------------------------------------------------------------------------------------------------
     Source of the block between the zip304-owner-pro markers in owner/index.html (tools/inject-owner-pro.mjs writes it; `npm run check` verifies it).
     1. The ONE money record in the console: a "Money (one record)" tab (Money & Billing folder) - overview with every figure defined, transactions
        (search, filters, pages, CSV export, details with "why this counts"), Record a payment, Permanent links and their payment status, Reconcile old
        records, and the audit trail. Everything comes from /api/owner-money (one calculation on the server); opening, refreshing or exporting writes nothing.
     2. The Dashboard is rebuilt on the same figures (no second calculation in the browser) plus links, demos, attention items and website shortcuts.
     3. The two old hand-entry forms (💰 per-link switch, Quote & Payments) are replaced by "Record a payment" (they pushed a second copy of the same money).
        "Make permanent" asks whether the link was paid or given free; "Confirm payment" asks for the M-Pesa code.
     4. A refined look: deep navy sidebar, clean bright workspace, blue and warm-orange accents.
     Owner-only actions are enforced on the server (owner session); staff sessions never receive these figures. Ids / names: op-*, opx*. -->

        return '<div class="op-card" style="margin:4px 0 10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">💰 Payments for ' + esc(groupLabel) + '</h3><button type="button" class="op-btn pri" onclick="openOwnerMoney({ view: \'record\', prefill: { kind: \'link_sale\', clientId: \'' + esc(String(first).replace(/'/g, '')) + '\' } }); if (typeof closeClientDetailModal === \'function\') closeClientDetailModal();">Record a payment</button></div>'
          + '<p class="op-note">From the one money record. A payment confirmed by M-Pesa or with Confirm payment is already here; enter only money received another way.</p><div id="op-client-money"><div class="op-skel" style="height:40px"></div></div></div>';
      };
      gi.__op = true; window.groupIncomeHtml = gi;
    }
    if (typeof window.revenueToggleHtml === 'function' && !window.revenueToggleHtml.__op) { var rt = function () { return ''; }; rt.__op = true; window.revenueToggleHtml = rt; }
    // "Make permanent": paid or given free?
    if (typeof window.requestMakePermanent === 'function' && !window.requestMakePermanent.__op) {
      var mp = async function (clientId, label) {
        var paid = confirm('Make "' + label + '" a permanent link.\n\nPress OK if the client PAID for it (it is recorded once as a permanent-link sale).\nPress Cancel to choose "given free".');
        var body = { c: clientId };
        if (paid) { var code = prompt('M-Pesa code or receipt number of the payment (helps stop it being counted twice). Leave empty for cash:', ''); if (code === null) return; body.receipt = code.trim(); }
        else { if (!confirm('Make "' + label + '" permanent as a FREE link (test, internal or complimentary)? No sale is recorded.')) return; body.complimentary = true; }
        try {
          var res = await fetch('/api/owner-confirm', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, headers()), body: JSON.stringify(body) });
          var data = await res.json();
          if (!res.ok || data.error) { toast(data.error || 'Could not make that link permanent.', true); return; }
          toast(paid ? '"' + label + '" is permanent and its sale is recorded once in Money.' : '"' + label + '" is permanent (free: no sale recorded).');
          try { ownerClientsCacheAt = 0; } catch (e) { /* cache */ }
          M.links = null;
          try { if (typeof closeClientDetailModal === 'function') closeClientDetailModal(); renderGroupedClientsList('demo', true); renderGroupedClientsList('permanent', true); if (typeof renderPendingUpgrades === 'function') renderPendingUpgrades(true); } catch (e) { /* lists refresh on open */ }
        } catch (e) { toast('Could not reach the server.', true); }
      };
      mp.__op = true; window.requestMakePermanent = mp;
    }
    if (typeof window.confirmDemoUpgrade === 'function' && !window.confirmDemoUpgrade.__op) {
      var cu = async function (clientId, label) {
        var code = prompt('Confirm the payment for "' + label + '".\nCheck it arrived on M-Pesa first.\n\nM-Pesa code (leave empty if paid in cash):', '');
        if (code === null) return;
        try {
          var res = await fetch('/api/owner-confirm', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, headers()), body: JSON.stringify({ c: clientId, receipt: code.trim() }) });
          var data = await res.json();
          if (!res.ok || data.error) { toast(data.error || 'Could not confirm that upgrade.', true); return; }
          toast('"' + label + '" is now permanent. Its payment is recorded once in Money - nothing else to enter.');
          M.links = null;
          try { renderPendingUpgrades(true); ownerClientsCacheAt = 0; renderGroupedClientsList('demo', true); renderGroupedClientsList('permanent', true); } catch (e) { /* lists refresh on open */ }
          refreshDash();
        } catch (e) { toast('Could not reach the server.', true); }
      };
      cu.__op = true; window.confirmDemoUpgrade = cu;
    }
    // the old money tabs say what they are now
    [['daily-sales-tab', 'This is the console’s <b>old sales book</b>. Since this update every payment is kept in <b>Money (one record)</b>, counted once. The figures here may include the same payment twice; use Money for your totals.'],
      ['profits-tab', 'Use this tab for your <b>expenses</b>. Its income figure comes from the old sales book; your income, counted once, is in <b>Money (one record)</b>.'],
      ['bills-tab', 'Old balances recorded with the 💰 switch or Quote &amp; Payments. To record money received on one of them, use <b>Money → Record a payment</b> (or settle it here and run Reconcile again: it is picked up once).']].forEach(function (x) {
      var t = $(x[0]); if (!t || t.querySelector('.op-legacy-note')) return;
      var n = document.createElement('div'); n.className = 'op-banner warn op-legacy-note'; n.innerHTML = '<span>ℹ️</span><div>' + x[1] + ' <a href="#" onclick="openOwnerMoney({ view: \'overview\' }); return false;">Open Money</a></div>';
      t.insertBefore(n, t.firstChild);
    });
    websitePro();
    var pl = $('permanent-links-tab');
    if (pl && !pl.querySelector('.op-links-note')) { var n2 = document.createElement('div'); n2.className = 'op-banner op-links-note op-legacy-note'; n2.innerHTML = '<span>📋</span><div>Want a table of every link with its payment status, amount paid and reference? <a href="#" onclick="openOwnerMoney({ view: \'links\' }); return false;">Open Money → Permanent links</a>. Creating or making a link permanent is not a payment; a link counts as a sale once, when its payment is confirmed.</div>'; pl.insertBefore(n2, pl.firstChild); }
  }
  /* ---------- Website content: section index, unsaved-changes guard, live-site link (the editing itself is unchanged) ---------- */
  var webDirty = false;
  function websitePro() {
    var tab = $('website-tab'); if (!tab || tab.querySelector('#op-web-nav')) return;
    var panel = tab.querySelector('.panel') || tab, heads = Array.prototype.slice.call(panel.querySelectorAll('h4')).filter(function (h) { return h.textContent.trim(); });
    if (!heads.length) return;
    heads.forEach(function (h, i) { if (!h.id) h.id = 'op-web-s' + i; });
    var nav = document.createElement('div'); nav.id = 'op-web-nav'; nav.className = 'op-card'; nav.style.margin = '0 0 14px';
    nav.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b>Jump to a section</b><a class="op-btn" href="https://mydukapos.store/" target="_blank" rel="noopener">🌐 Open the public site</a></div>'
      + '<div class="op-chips" style="margin-top:10px">' + heads.map(function (h) { return '<button type="button" class="op-chip" data-web="' + h.id + '">' + esc(h.textContent.replace(/\s+/g, ' ').trim().slice(0, 40)) + '</button>'; }).join('') + '</div>'
      + '<p class="op-note">Changes show on the public site after <b>Save &amp; Publish</b>. Only add testimonials that real customers gave you, with their permission.</p>';
    var h3 = panel.querySelector('h3'), after = h3 && h3.nextElementSibling && h3.nextElementSibling.tagName === 'P' ? h3.nextElementSibling : h3;
    if (after && after.parentNode === panel) panel.insertBefore(nav, after.nextSibling); else panel.insertBefore(nav, panel.firstChild);
    nav.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-web]'); if (b) { var t = $(b.getAttribute('data-web')); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); } });
    var bar = document.createElement('div'); bar.id = 'op-web-dirty'; bar.className = 'op-banner warn'; bar.style.cssText = 'position:sticky;bottom:10px;z-index:5;display:none;align-items:center;margin-top:12px;box-shadow:0 8px 24px rgba(0,0,0,.12)';
    bar.innerHTML = '<span>✏️</span><div style="flex:1">You have changes that are not published yet.</div><button type="button" class="op-btn pri" id="op-web-save">Save &amp; Publish</button>';
    panel.appendChild(bar);
    bar.querySelector('#op-web-save').addEventListener('click', function () { var b = $('website-save-btn'); if (b) b.click(); });
    var mark = function (e) { if (e.target && e.target.closest && e.target.closest('#op-web-nav')) return; webDirty = true; bar.style.display = 'flex'; };
    panel.addEventListener('input', mark); panel.addEventListener('change', mark);
    if (typeof window.saveWebsiteContent === 'function' && !window.saveWebsiteContent.__op) {
      var orig = window.saveWebsiteContent;
      var w2 = async function () { var r = await orig.apply(this, arguments); setTimeout(function () { var err = document.querySelector('#website-tab .settings-msg.error, #website-error'); if (!err || !err.textContent.trim()) { webDirty = false; bar.style.display = 'none'; } }, 300); return r; };
      w2.__op = true; window.saveWebsiteContent = w2;
    }
    window.addEventListener('beforeunload', function (e) { if (webDirty) { e.preventDefault(); e.returnValue = ''; } });
  }

  async function fillClientMoney(ids) {
    var el = $('op-client-money'); if (!el) return;
    var r = await api('list', { all: true, requests: true });
    if (!$('op-client-money')) return;
    if (!r.ok) { el.innerHTML = '<p class="op-note">Unavailable: ' + esc((r.j && r.j.error) || '') + '</p>'; return; }
    var rows = r.j.rows.filter(function (x) { return ids.indexOf(x.client_id) >= 0; });
    LAST_TX = LAST_TX.concat(rows);
    var s = rows.filter(function (x) { return x.status === 'success' && x.kind !== 'charge' && x.kind !== 'refund'; }).reduce(function (a, x) { return a + x.amount_c; }, 0);
    el.innerHTML = rows.length ? '<div class="op-scroll"><table class="op-t"><thead><tr><th>Date</th><th>Type</th><th>Status</th><th class="n">Amount</th></tr></thead><tbody>' + rows.map(function (x) { return '<tr class="op-click" data-ref="' + esc(x.ref) + '"><td>' + esc(day(x.created_at)) + '</td><td>' + esc(KIND[x.kind] || x.kind) + '</td><td>' + pill(x.status, x.kind) + '</td><td class="n">' + kes(x.amount_c) + '</td></tr>'; }).join('') + '</tbody><tfoot><tr><td colspan="3">Counted for this client</td><td class="n">' + kes(s) + '</td></tr></tfoot></table></div>' : '<p class="op-note">No payment recorded for this client yet.</p>';
    el.addEventListener('click', function (e) { var tr = e.target.closest && e.target.closest('tr[data-ref]'); if (tr) openDetail(tr.getAttribute('data-ref')); });
  }

  function boot() {
    var n = 0;
    (function tick() { try { ensureTab(); install(); } catch (e) { /* retried */ } if (++n < 40) setTimeout(tick, n < 10 ? 250 : 1000); })();
    setInterval(function () { try { ensureTab(); } catch (e) { /* cosmetic */ } }, 3000);
    // the dashboard is the first page: draw it as soon as the owner is signed in
    setTimeout(function () { try { var t = $('dashboard-tab'); if (t && t.classList.contains('active') && !staffMode() && headers().Authorization) renderDash(); } catch (e) { /* first open draws it */ } }, 900);
  }
  window.ownerPro = { renderMoney: renderMoney, renderDash: renderDash, api: api, state: M };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
