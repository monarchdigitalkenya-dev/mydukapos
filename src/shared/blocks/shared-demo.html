<!-- SHARED DEMO MODE (zip 262) ---------------------------------------------------------------------------------------------------
     The public demos are ONE fixed, pre-loaded shop per product (see functions/api/_shared-demos.js). Nobody gets a shop of their own:
     the server refuses to store anything for a shared demo, so this device keeps the visitor's edits locally and the next visitor on
     another device never sees them. This block only runs on a demo web address (demo-xxx.<domain>, or ?c=demo_xxx) AND after the
     server confirms "sharedDemo" - every normal shop is untouched and pays nothing for it (no request is made).
       * after the first pull of the sample data, saving to / reading from the server is switched off (no push, no poll, no socket)
       * a SAMPLE banner (light or dark like the app) explains it, shows the login password, has "Reset sample data" (clears THIS device's copy and reloads the fresh sample) and "Get my own link" (zip 263: name / phone / email, pay, and only then the visitor's own link is created: see functions/api/get-my-link.js)
       * nothing here can reach a real shop: the server enforces the rest (read-only license, simulated M-Pesa, no messaging). -->

<script>
(function () {
    'use strict';
    var host = String(location.hostname || '').toLowerCase();
    var cid = ''; try { cid = new URLSearchParams(location.search).get('c') || ''; } catch (e) { /* none */ }
    if (!(host.split('.')[0].indexOf('demo-') === 0 || cid.indexOf('demo_') === 0)) return;           // a normal shop: do nothing, ask nothing
    var DEMO = { on: false };
    window.SharedDemo = DEMO;

    // zip 263: three photos per row on a phone unless the visitor picked otherwise (the shop's own setting is Settings > Phone till)
    try { if (localStorage.getItem('pos_ptl_cols') === null) localStorage.setItem('pos_ptl_cols', '3'); } catch (e) { /* two per row */ }
    // zip 263: light AND dark. A visitor who never chose a theme gets the one their device uses; the Light / Dark switch (header and banner) still decides after that.
    try { if ((window.__mdpThemeSaved ? window.__mdpThemeSaved() === null : localStorage.getItem('mdp-theme') === null) && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { /* light */ }

    function wrap(name, fn) { try { if (typeof window[name] === 'function') { var orig = window[name]; window[name] = function () { return DEMO.on && DEMO.pulled ? fn.apply(this, arguments) : orig.apply(this, arguments); }; } } catch (e) { /* not in this app */ } }
    function noop() { return Promise.resolve(true); }
    function api(path) { return typeof apiUrl === 'function' ? apiUrl(path) : path + (cid ? '?c=' + encodeURIComponent(cid) : ''); }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function engage() {
        DEMO.on = true; window.__sharedDemo = true;
        document.documentElement.setAttribute('data-shared-demo', '1');
        // once the sample has been pulled, this device is on its own: no server traffic for state at all
        ['pullState', 'pullFromServer', 'pushNow', 'pushNowOrWarn', 'flushPendingPush'].forEach(function (n) { wrap(n, noop); });
        ['syncPollTick', 'startPolling', 'connectSyncSocket'].forEach(function (n) { wrap(n, function () { return undefined; }); });
        wrap('hasUnsyncedWork', function () { return false; });
        var t0 = Date.now();
        (function watch() {
            if (window.__pullOkOnce || window.__pulledOnce || (localStorage.getItem('pos_last_synced_at') || '') !== '' || Date.now() - t0 > 60000) {
                DEMO.pulled = true;
                // zip 320: the sample as it arrived is this device's baseline for the hourly reset (kept once; the hour starts now)
                try { if (window.DemoReset) setTimeout(function () { window.DemoReset.capture(); }, 1500); } catch (e) { /* no reset on this page */ }
                return;
            }
            setTimeout(watch, 400);
        })();
        bar();
    }

    function resetDemo() {
        if (!confirm('Reset the sample shop? Everything you changed on THIS device is cleared and the original sample data comes back.')) return;
        if (window.DemoReset && window.DemoReset.eligible() && window.DemoReset.restoreNow()) return;   // zip 320: same restore as the hourly one
        // zip 320: clearing ALL of this browser address's storage is only safe on the demo's own address (demo-<name>.<domain>); on a shared address
        // (a ?c=demo_ link) the same storage can hold a real shop, so nothing is cleared there
        if (host.split('.')[0].indexOf('demo-') !== 0) { alert('Open the sample shop from its own address (demo-...) to reset it.'); return; }
        var theme = null, ref = null; try { theme = localStorage.getItem('mdp-theme'); ref = localStorage.getItem('sd_buy_ref'); } catch (e) { /* none */ }
        try { localStorage.clear(); } catch (e) { /* ignore */ }
        try { if (theme) localStorage.setItem('mdp-theme', theme); if (ref) localStorage.setItem('sd_buy_ref', ref); } catch (e) { /* the choice is simply asked again */ }
        try { sessionStorage.clear(); } catch (e) { /* ignore */ }
        var done = function () { var u = location.pathname + (cid ? '?c=' + encodeURIComponent(cid) : ''); location.replace(u); };
        try {
            var jobs = [];
            if (window.indexedDB && indexedDB.databases) jobs.push(indexedDB.databases().then(function (l) { (l || []).forEach(function (d) { try { indexedDB.deleteDatabase(d.name); } catch (e) { /* ignore */ } }); }));
            Promise.all(jobs).then(done, done);
        } catch (e) { done(); }
    }
    DEMO.reset = resetDemo;

    function bar() {
        if (document.getElementById('sd-bar')) return;
        var el = document.createElement('div'); el.id = 'sd-bar'; el.setAttribute('role', 'region'); el.setAttribute('aria-label', 'Sample shop');
        el.innerHTML = '<b>SAMPLE</b><span class="sd-t">Sample data. Nothing is saved online and payments are simulated.</span><span>Password <code>0000</code></span>' +
            '<button type="button" class="sd-cta" id="sd-buy-open">Get my own link</button>' +
            '<button type="button" id="sd-theme" aria-label="Switch between light and dark" title="Light / Dark">\uD83C\uDF13</button>' +
            '<button type="button" id="sd-reset" title="Reset sample data">Reset</button><button type="button" class="sd-x" id="sd-hide" aria-label="Hide banner">&times;</button>';
        (document.body || document.documentElement).appendChild(el);
        document.body && document.body.classList.add('sd-on');
        var setH = function () { try { document.documentElement.style.setProperty('--sd-h', (el.style.display === 'none' ? 0 : el.offsetHeight) + 'px'); } catch (e) { /* cosmetic */ } };
        document.documentElement.classList.add('sd-bar-on'); setH(); window.addEventListener('resize', setH); setTimeout(setH, 600); setTimeout(setH, 2500);
        document.getElementById('sd-reset').onclick = resetDemo;
        document.getElementById('sd-theme').onclick = function () { if (typeof toggleAppTheme === 'function') toggleAppTheme(); };
        document.getElementById('sd-buy-open').onclick = openBuy;
        document.getElementById('sd-hide').onclick = function () { el.style.display = 'none'; document.documentElement.classList.remove('sd-bar-on'); if (document.body) document.body.classList.remove('sd-on'); };
    }

    /* ---------- Get my own link ---------- */
    var B = { terms: null, ref: null, timer: 0, box: null };
    function post(body) { return fetch(api('/api/get-my-link'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { j.__ok = r.ok; return j; }); }); }
    function refGet() { try { return JSON.parse(localStorage.getItem('sd_buy_ref') || 'null'); } catch (e) { return null; } }
    function refSet(r) { try { if (r) localStorage.setItem('sd_buy_ref', JSON.stringify(r)); else localStorage.removeItem('sd_buy_ref'); } catch (e) { /* kept in memory only */ } }
    function close() { clearTimeout(B.timer); if (B.box) B.box.classList.remove('on'); var o = document.getElementById('sd-buy-open'); if (o) o.focus(); }
    function shell() {
        if (B.box) return B.box;
        var d = document.createElement('div'); d.id = 'sd-buy'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'sd-buy-h');
        d.innerHTML = '<div class="sd-box"><button type="button" class="sd-close" aria-label="Close">&times;</button><div id="sd-buy-body"></div></div>';
        document.body.appendChild(d); B.box = d;
        d.querySelector('.sd-close').onclick = close;
        // zip 285: on the "Your link is ready" screen ONLY the X button closes the popup (a stray tap outside or Escape must never lose the link / licence)
        d.addEventListener('mousedown', function (e) { if (e.target === d && !B.locked) close(); });
        d.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !B.locked) close(); });
        return d;
    }
    function body(html) { B.locked = false; var b = document.getElementById('sd-buy-body'); b.innerHTML = html; return b; }
    function money(n) { return 'KES ' + Number(n || 0).toLocaleString('en-KE'); }
    // zip 267: a referral code arrives as ?ref=CODE (the public site adds it to the demo link); kept for this visit and sent with the request, where the SERVER checks it
    function myRef() {
        try { var q = new URLSearchParams(location.search).get('ref'); if (q && /^[A-Za-z0-9]{6,12}$/.test(q)) sessionStorage.setItem('sd_ref', q.toUpperCase()); return sessionStorage.getItem('sd_ref') || ''; } catch (e) { return ''; }
    }
    // the price box: every number comes from the server's quote (one pricing source), never from this page
    function priceBox(t) {
        var q = t.quote; if (!q) return '<p>Your own shop on your own web address, with your own data. One payment of <b>' + money(t.amount) + '</b>.</p>';
        var rows = q.lines.map(function (l) { return '<dt>' + esc(l.label) + ' <span class="sd-hint" style="display:inline">(paid once)</span></dt><dd>' + money(l.amount) + '</dd>'; }).join('');
        if (q.discount && q.discount.total) rows += '<dt>Discount' + (q.discount.offers.length ? ' (' + esc(q.discount.offers.map(function (o) { return o.name; }).join(', ')) + ')' : '') + '</dt><dd>- ' + money(q.discount.total) + '</dd>';
        return '<p>Your own shop on your own web address, with your own data. Your link is created as soon as the payment is confirmed.</p><div class="sd-sum" aria-live="polite"><dl>' + rows + '<dt><b>You pay now</b></dt><dd>' + money(q.total) + '</dd></dl>' + (q.recurringNote ? '<p class="sd-hint" style="margin:6px 0 0">' + esc(q.recurringNote.text) + '</p>' : '') + (t.referralApplied ? '<p class="sd-hint ok" style="margin:6px 0 0">\u2713 You were referred by a MyDukaPOS shop.</p>' : '') + '</div>';
    }
    function openBuy() {
        shell().classList.add('on');
        B.ref = refGet();
        if (B.ref && B.ref.paid && B.ref.link) { ready(B.ref); return; }
        if (B.ref && B.ref.id) {
            if (B.ref.method === 'claim' && !B.ref.claimed) {
                // zip 300: a saved "send the money yourself" request is checked against the gateway NOW - if the payment prompt works today, start fresh and use it
                body('<p><span class="sd-spin"></span>One moment&hellip;</p>');
                post({ action: 'options', ref: myRef() }).then(function (t) { if (t.__ok) B.terms = t; if (t.__ok && t.stk) { refSet(null); B.ref = null; form(); } else waiting('pay'); }).catch(function () { waiting('pay'); });
                return;
            }
            waiting(B.ref.method === 'claim' && !B.ref.claimed ? 'pay' : 'wait'); return;
        }
        body('<p><span class="sd-spin"></span>One moment&hellip;</p>');
        post({ action: 'options', ref: myRef() }).then(function (t) { if (!t.__ok) throw new Error(t.error || 'Not available right now.'); B.terms = t; form(); })
            .catch(function (e) { body('<h2 id="sd-buy-h">Get my own link</h2><p class="sd-err" role="alert">' + esc(e.message || 'Could not load. Please try again.') + '</p>'); });
    }
    function form() {
        var t = B.terms;
        body('<h2 id="sd-buy-h">Get your own link</h2><div id="sd-pricebox">' + priceBox(t) + '</div>' +
            '<label for="sd-n">Your name</label><input id="sd-n" autocomplete="name" maxlength="80">' +
            '<label for="sd-p">Phone number</label><input id="sd-p" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" maxlength="20">' +
            '<label for="sd-e">Email <span style="font-weight:500;color:var(--muted,#5b6d70)">(optional)</span></label><input id="sd-e" type="email" autocomplete="email" maxlength="120" placeholder="you@example.com">' +
            '<label for="sd-s">Your web address <span style="font-weight:500;color:var(--muted,#5b6d70)">(optional)</span></label><div class="sd-addr"><input id="sd-s" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" placeholder="your-shop"><span>.' + esc(t.root || 'mydukapos.store') + '</span></div>' +
            '<p class="sd-hint" id="sd-sm" role="status" aria-live="polite">Leave it empty and we use your name.</p>' +
            '<label for="sd-o">Discount code <span style="font-weight:500;color:var(--muted,#5b6d70)">(optional)</span></label><div class="sd-addr"><input id="sd-o" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="e.g. LAUNCH20"><button type="button" id="sd-oc" style="margin-left:6px;white-space:nowrap">Apply</button></div>' +
            '<p class="sd-err" id="sd-err" role="alert"></p>' +
            '<div class="sd-row"><button type="button" class="sd-go" id="sd-go">' + (t.stk ? 'Pay ' + money(t.amount) + ' with M-Pesa' : 'Continue') + '</button></div>');
        if (B.form) { document.getElementById('sd-o').value = B.form.offer || ''; document.getElementById('sd-n').value = B.form.name || ''; document.getElementById('sd-p').value = B.form.phone || ''; document.getElementById('sd-e').value = B.form.email || ''; document.getElementById('sd-s').value = B.form.slug || ''; }
        document.getElementById('sd-n').focus();
        document.getElementById('sd-go').onclick = function () { submit(''); };
        document.getElementById('sd-oc').onclick = function () {
            var code = (document.getElementById('sd-o').value || '').trim(), pb = document.getElementById('sd-pricebox'), go = document.getElementById('sd-go');
            B.form = B.form || {}; B.form.offer = code;
            post({ action: 'quote', offer: code, ref: myRef() }).then(function (r) {
                if (!r.__ok || !r.quote) return; B.terms = Object.assign({}, B.terms, { quote: r.quote, amount: r.amount, referralApplied: r.referralApplied });
                pb.innerHTML = priceBox(B.terms); if (go && B.terms.stk) go.textContent = 'Pay ' + money(r.amount) + ' with M-Pesa';
                var sm2 = document.getElementById('sd-sm'); if (code && sm2 && !r.offerApplied) { sm2.className = 'sd-hint no'; sm2.textContent = 'That code does not apply here.'; }
            });
        };
        var st = 0, box = document.getElementById('sd-s'), sm = document.getElementById('sd-sm');
        box.oninput = function () {
            clearTimeout(st); var v = box.value.trim();
            if (!v) { sm.className = 'sd-hint'; sm.textContent = 'Leave it empty and we use your name.'; return; }
            sm.className = 'sd-hint'; sm.textContent = 'Checking\u2026';
            st = setTimeout(function () {
                post({ action: 'slug', slug: v }).then(function (r) {
                    if (box.value.trim() !== v) return;                      // typed on since
                    if (!r.__ok || r.ok === false) { sm.className = 'sd-hint no'; sm.textContent = r.error || 'That address cannot be used.'; return; }
                    var root = (B.terms && B.terms.root) || 'mydukapos.store';
                    if (r.taken) { sm.className = 'sd-hint no'; sm.textContent = 'That address is taken, so you will get ' + r.slug + '.' + root; }
                    else { sm.className = 'sd-hint ok'; sm.textContent = '\u2713 ' + r.slug + '.' + root + ' is available'; }
                }).catch(function () { sm.textContent = ''; });
            }, 400);
        };
    }
    function submit(choice) {
        var g = document.getElementById('sd-go'), err = document.getElementById('sd-err');
        if (typeof choice !== 'string') choice = '';
        var v = B.form = B.form || {};
        if (document.getElementById('sd-n')) { v.name = document.getElementById('sd-n').value; v.phone = document.getElementById('sd-p').value; v.email = document.getElementById('sd-e').value; v.slug = document.getElementById('sd-s').value; v.offer = (document.getElementById('sd-o') || {}).value || ''; }
        if (err) err.textContent = ''; if (g) { g.disabled = true; g.textContent = 'Please wait\u2026'; }
        post({ action: 'start', name: v.name, phone: v.phone, email: v.email, slug: v.slug, choice: choice, branchProof: choice === 'branch' ? (B.branchProof || '') : '', offer: v.offer || '', ref: myRef() }).then(function (r) {
            if (r.needChoice) { return choose(r); }
            if (!r.__ok && r.code === 'branch_proof') { choose({ amount: (B.terms && B.terms.amount) || 0, branchAmount: (B.terms && B.terms.amount) || 0 }); var e4 = document.getElementById('sd-err'); if (e4) e4.textContent = r.error; return; }
            if (!r.__ok) { form(); var e2 = document.getElementById('sd-err'); if (e2) e2.textContent = r.error || 'Something went wrong. Please try again.'; return; }
            B.ref = { id: r.id, token: r.token, method: r.method, amount: r.amount, kind: r.kind, paymentUrl: r.paymentUrl || '', claimed: false, stkError: r.stkError || '' }; refSet(B.ref);
            waiting(r.method === 'claim' ? 'pay' : 'wait');
        }).catch(function () { form(); var e3 = document.getElementById('sd-err'); if (e3) e3.textContent = 'No connection. Please check your internet and try again.'; });
    }
    // the phone number or email already has a shop of this kind: never a refusal, a question
    function choose(r) {
        body('<h2 id="sd-buy-h">You may already have a shop with us</h2><p>We found a MyDukaPOS shop with this phone number or email. <b>Optional:</b> add this new link as a <b>branch</b> of it, so you can see both together. To prove the shop is yours, enter its <b>Admin password</b>. Or keep the new link separate.</p>' +
            '<label for="sd-bp">Admin password of your existing shop</label><input id="sd-bp" type="password" autocomplete="current-password" maxlength="80">' +
            '<p class="sd-err" id="sd-err" role="alert"></p>' +
            '<div class="sd-row" style="flex-direction:column"><button type="button" class="sd-go" id="sd-br">Add it as a branch &middot; ' + money(r.branchAmount) + '</button>' +
            '<button type="button" id="sd-sep">Keep it separate &middot; ' + money(r.amount) + '</button></div>');
        document.getElementById('sd-br').onclick = function () {
            var pw = document.getElementById('sd-bp').value, e = document.getElementById('sd-err');
            if (!pw) { e.textContent = 'Enter the Admin password of your existing shop.'; return; }
            // the password never leaves this device: only its SHA-256 is sent, the same fingerprint the apps already use to sign in
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw)).then(function (buf) {
                B.branchProof = Array.prototype.map.call(new Uint8Array(buf), function (x) { return x.toString(16).padStart(2, '0'); }).join('');
                submit('branch');
            });
        };
        document.getElementById('sd-sep').onclick = function () { B.branchProof = ''; submit('separate'); };
    }
    function waiting(mode) {
        var r = B.ref, phone = (B.terms && B.terms.paymentPhone) || '';
        if (mode === 'pay') {
            body('<h2 id="sd-buy-h">Pay ' + money(r.amount) + '</h2><p>Send <b>' + money(r.amount) + '</b> by M-Pesa' + (phone ? ' to <b>' + esc(phone) + '</b>' : '') + ', then tap the button below. We confirm the payment and your link appears here.</p>' +
                '<p class="sd-err" id="sd-err" role="alert">' + (r.stkError ? esc('The M-Pesa prompt could not be sent: ' + r.stkError) : '') + '</p><div class="sd-row" style="flex-direction:column"><button type="button" class="sd-go" id="sd-retry">Send the M-Pesa prompt to my phone</button><button type="button" id="sd-claim">I’ve made this payment</button></div>');
            document.getElementById('sd-retry').onclick = function () {
                var b = this, er = document.getElementById('sd-err'); b.disabled = true; b.textContent = 'Sending\u2026'; er.textContent = '';
                post({ action: 'retry', id: r.id, token: r.token }).then(function (j) {
                    if (!j.__ok) { er.textContent = j.error || 'The prompt could not be sent.'; b.disabled = false; b.textContent = 'Send the M-Pesa prompt to my phone'; return; }
                    r.method = 'stk'; r.stkError = ''; refSet(r); waiting('wait');
                }).catch(function () { er.textContent = 'No connection. Please try again.'; b.disabled = false; b.textContent = 'Send the M-Pesa prompt to my phone'; });
            };
            document.getElementById('sd-claim').onclick = function () {
                var b = this; b.disabled = true;
                post({ action: 'claim', id: r.id, token: r.token }).then(function (j) { if (!j.__ok) { document.getElementById('sd-err').textContent = j.error || 'Please try again.'; b.disabled = false; return; } r.claimed = true; refSet(r); waiting('wait'); });
            };
            return;
        }
        body('<h2 id="sd-buy-h">' + (r.method === 'stk' ? 'Check your phone' : 'Waiting for confirmation') + '</h2>' +
            '<p id="sd-msg" role="status" aria-live="polite"><span class="sd-spin"></span>' + (r.method === 'stk' ? 'Enter your M-Pesa PIN on the prompt. This page updates by itself.' : 'We are confirming your payment. This page updates by itself, so you can keep it open.') + '</p>' +
            (r.paymentUrl ? '<div class="sd-row"><a class="sd-go" href="' + esc(r.paymentUrl) + '" target="_blank" rel="noopener" style="flex:1;display:flex;align-items:center;justify-content:center;border-radius:12px;min-height:48px;color:#fff;background:var(--accent,#0b7a5f);text-decoration:none;font-weight:700">Open the payment page</a></div>' : '') +
            '<div class="sd-row"><button type="button" id="sd-new">Start again</button></div>');
        document.getElementById('sd-new').onclick = function () { refSet(null); B.ref = null; clearTimeout(B.timer); openBuy(); };
        poll(0);
    }
    // paid: the link and the licence (PDF). The reference stays on this device, so the licence can be downloaded again later.
    function ready(ref) {
        body('<h2 id="sd-buy-h">Your link is ready</h2><p class="sd-ok" role="status">Payment confirmed. Keep this link safe: it is your shop\u2019s address.</p>' +
            '<label for="sd-link">Your link</label><input id="sd-link" readonly value="' + esc(ref.link) + '">' +
            '<div class="sd-row"><button type="button" id="sd-lic">Download your licence (PDF)</button></div><p class="sd-err" id="sd-err" role="alert"></p>' +
            '<div class="sd-row" style="margin-top:0"><button type="button" id="sd-copy">Copy</button><a class="sd-go" href="' + esc(ref.link) + '" style="flex:1;display:flex;align-items:center;justify-content:center;border-radius:12px;min-height:48px;color:#fff;background:var(--accent,#0b7a5f);text-decoration:none;font-weight:700">Open my shop</a></div>' +
            '<div class="sd-row"><button type="button" id="sd-more" style="font-weight:600">Get another link</button></div>');
        B.locked = true; // zip 285: only the X button closes this screen
        document.getElementById('sd-lic').onclick = function () { licence(ref); };
        document.getElementById('sd-copy').onclick = function () { var i = document.getElementById('sd-link'); i.select(); try { navigator.clipboard.writeText(ref.link); } catch (e) { try { document.execCommand('copy'); } catch (x) { /* selected for a manual copy */ } } this.textContent = 'Copied'; };
        document.getElementById('sd-more').onclick = function () { refSet(null); B.ref = null; B.form = null; openBuy(); };
    }
    function licence(ref) {
        var e = document.getElementById('sd-err'), b = document.getElementById('sd-lic'); if (e) e.textContent = ''; b.disabled = true;
        fetch(api('/api/get-my-link'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'licence', id: ref.id, token: ref.token }) })
            .then(function (r) { if (!r.ok) throw new Error('x'); return r.blob(); })
            .then(function (blob) { var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'MyDukaPOS-licence.pdf'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); b.disabled = false; })
            .catch(function () { if (e) e.textContent = 'The licence could not be downloaded just now. Please try again.'; b.disabled = false; });
    }
    function poll(n) {
        clearTimeout(B.timer);
        if (!B.ref || !B.box || !B.box.classList.contains('on')) return;
        post({ action: 'status', id: B.ref.id, token: B.ref.token }).then(function (j) {
            var m = document.getElementById('sd-msg'); if (!m) return;
            if (j.status === 'paid' && j.link) { B.ref.paid = true; B.ref.link = j.link; refSet(B.ref); ready(B.ref); return; }
            if (j.status === 'failed' || j.status === 'rejected') {
                refSet(null);
                body('<h2 id="sd-buy-h">' + (j.status === 'failed' ? 'The payment did not go through' : 'We could not confirm the payment') + '</h2><p>' + esc(j.message || 'Nothing was charged for a link. You can try again.') + '</p><div class="sd-row"><button type="button" class="sd-go" id="sd-again">Try again</button></div>');
                document.getElementById('sd-again').onclick = function () { B.ref = null; openBuy(); };
                return;
            }
            B.timer = setTimeout(function () { poll(n + 1); }, n < 40 ? 3000 : 8000);
        }).catch(function () { B.timer = setTimeout(function () { poll(n + 1); }, 6000); });
    }

    var url = (typeof apiUrl === 'function' ? apiUrl('/api/license-status') : '/api/license-status' + (cid ? '?c=' + encodeURIComponent(cid) : ''));
    function ask() {
        fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
            // zip 320: the hourly reset (demo-reset block) only ever runs where the server has said "this address is a shared demo"
            if (d && typeof d.clientId === 'string' && d.clientId && window.DemoReset) window.DemoReset.confirm(d.clientId, !!d.sharedDemo);
            if (d && d.sharedDemo) engage();
        }).catch(function () { /* offline: behave as a normal app */ });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ask); else ask();
})();
</script>
