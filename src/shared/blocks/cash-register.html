<!-- CASH REGISTER (zip 234) ------------------------------------------------------------------------------------------------------
         Inside the EXISTING Sales Counter (no new tab): one cash session per device, shared by every employee who sells on it.
           * No open session  -> the counter shows "Open Cash Session": count the drawer, type the opening float, "Open Sales". Then selling starts.
           * Open session     -> the normal counter plus a slim bar: "Cash Register ▾" (and, for the admin / a manager, "Cash: KES 5,000 -> Expected: KES 18,450").
           * Cash Register    -> opening float, cash sales, cash refunds, cash expenses, expected cash; View Session, Cash In/Out, Close Sales.
           * Close Sales      -> count the drawer, the app shows Balanced / Short / Over very plainly, the session is closed for good (kept with who/when/figures).
           * The next day     -> "Start New Cash Session": the float is counted again, never carried over.
         The session lives in the DATABASE (functions/api/cash-register.js, tables cash_sessions / cash_movements / cash_audit), per shop link + device.
         This device keeps only a MIRROR of it (so the counter still works with no internet) and a queue of what has not reached the server yet; both are
         sent as soon as the connection is back (every request carries its own id, so a resend can never count twice). Each sale still records the
         employee who made it; the session only records who opened it, who closed it and the cash that moved.
         Expected cash = opening float + cash sales (this device, since the session opened) + cash put in - cash refunds - cash expenses / payouts.
         Settings > View: "Use the cash register in the Sales Counter" (ON). Not in Hospital (no cart counter), AquaPOS or the Owner console. -->
<style>

<script>
(function () {
    var CACHE = 'pos_cash_reg_cache', QUEUE = 'pos_cash_reg_outbox', FLAG = 'pos_cash_reg_on', SEEN = 'pos_cash_reg_seen';
    var S = { state: 'checking', session: null, pending: false, view: null, busy: false, lastClosed: null, err: '' };
    function $(i) { return document.getElementById(i); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function safe(f, d) { try { var v = f(); return v === undefined ? d : v; } catch (e) { return d; } }
    function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
    function kes(n) { n = r2(n); return 'KES ' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
    function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { /* none */ } }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* mirror only */ } }
    function clock(ms) { var d = new Date(ms); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function when(ms) { var d = new Date(ms); return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + clock(ms); }
    function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function devId() { return safe(function () { return getOrCreateDeviceId(); }, '') || 'dev_unknown'; }
    function devName() { return lsGet('pos_device_name') || ''; }
    function who() { return safe(function () { return activeServerName(); }, '') || 'Staff'; }
    function whoId() { return safe(function () { return currentServer && currentServer.id ? String(currentServer.id) : 'admin'; }, 'admin'); }
    function isAuth() {          // the admin, or a staff member marked as a Manager
        return safe(function () {
            if (typeof currentServer === 'undefined' || !currentServer) return true;
            var m = (typeof staff !== 'undefined' && Array.isArray(staff)) ? staff.find(function (x) { return x.id === currentServer.id; }) : null;
            return !!(m && m.isManager);
        }, true);
    }
    function enabled() { var v = lsGet(FLAG); return v === null ? true : v === '1'; }
    function offline() { return safe(function () { return navigator.onLine === false; }, false); }   // only the browser's own word: any other doubt is settled by trying the server
    function apiUrlOf(p) { return typeof apiUrl === 'function' ? apiUrl(p) : p; }

    window.__shopSwitches = window.__shopSwitches || {};
    window.__shopSwitches.cashRegister = { get: function () { var r = lsGet(FLAG); return r === null ? undefined : r === '1'; }, set: function (v) { lsSet(FLAG, v ? '1' : '0'); var c = $('cash-register-toggle'); if (c) c.checked = !!v; paint(); } };
    window.setCashRegister = function (v) {
        lsSet(FLAG, v ? '1' : '0'); try { if (typeof rxPush === 'function') rxPush(); } catch (e) { /* the next change sends it */ }
        paint(); toast(v ? 'The cash register is ON in the Sales Counter.' : 'The cash register is OFF. Sales are not tied to a cash session.');
        if (v) refresh(true);
    };

    /* ---------------- the mirror + queue kept on this device ---------------- */
    function readCache() { try { return JSON.parse(lsGet(CACHE) || 'null'); } catch (e) { return null; } }
    function saveCache() { lsSet(CACHE, JSON.stringify({ device: devId(), session: S.session, pending: S.pending, lastClosed: S.lastClosed, at: Date.now() })); }
    function queue() { try { var q = JSON.parse(lsGet(QUEUE) || '[]'); return Array.isArray(q) ? q : []; } catch (e) { return []; } }
    function saveQueue(q) { lsSet(QUEUE, JSON.stringify(q)); }
    function enqueue(item) { var q = queue(); q.push(item); saveQueue(q); }

    /* ---------------- talking to the server ---------------- */
    function CErr(code, msg, extra) { var e = new Error(msg); e.code = code; e.extra = extra || {}; return e; }
    async function post(body) {
        var res, j;
        try { res = await fetch(apiUrlOf('/api/cash-register'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ site: '', device: devId(), by: who(), byId: whoId() }, body)) }); }
        catch (e) { throw CErr('offline', 'No internet.'); }
        try { j = await res.json(); } catch (e) { throw CErr('offline', 'No answer from the server.'); }
        if (res.status === 503 || res.status >= 500) throw CErr(j && j.code === 'no_d1' ? 'no_d1' : 'offline', (j && j.error) || 'The server did not answer.');
        if (!j || j.ok === false) throw CErr((j && j.code) || 'error', (j && j.error) || 'Something went wrong.', j || {});
        return j;
    }

    /* ---------------- the figures (from this device's own records) ---------------- */
    function cashPart(s) {
        var c = Number(s.cashAmount) || 0, m = Number(s.mpesaAmount) || 0, k = Number(s.cardAmount) || 0;
        if (c > 0 || m > 0 || k > 0) return c;
        return String(s.paymentMethod || '') === 'cash' ? safe(function () { return reportSaleTotal(s); }, 0) : 0;
    }
    function fromHere(rec) { var d = rec && rec.ctx && rec.ctx.device; return !d || d === devId(); }
    function figures(s) {
        var from = s.openedAt, to = s.closedAt || Date.now() + 60000, f = { cashSales: 0, nonCashSales: 0, salesCount: 0, refunds: 0, expenses: 0, byStaff: {} };
        (safe(function () { return salesLog; }, []) || []).forEach(function (x) {
            if (!x || x.voided || x._deleted || x.paid === false || String(x.paymentMethod) === 'bill' || String(x.paymentMethod) === 'pod') return;
            var t = Date.parse(x.timestamp); if (!isFinite(t) || t < from || t > to || !fromHere(x)) return;
            var total = safe(function () { return reportSaleTotal(x); }, 0), c = cashPart(x);
            f.salesCount++; f.cashSales += c; f.nonCashSales += Math.max(0, total - c);
            var n = x.servedBy || 'Admin'; f.byStaff[n] = (f.byStaff[n] || 0) + c;
        });
        (safe(function () { return returns; }, []) || []).forEach(function (x) {
            if (!x || x._deleted) return; var t = Date.parse(x.timestamp); if (!isFinite(t) || t < from || t > to || !fromHere(x)) return;
            var amt = Number(x.refundAmount) || 0; if (amt > 0 && /cash/i.test(String(x.refundMethod || x.method || ''))) f.refunds += amt;
        });
        (safe(function () { return expenses; }, []) || []).forEach(function (x) {
            if (!x || x.voided || x._deleted) return; var t = Date.parse(x.timestamp); if (!isFinite(t) || t < from || t > to || !fromHere(x)) return;
            var m = String(x.paymentMethod || x.method || 'cash').toLowerCase(); if (m === 'cash') f.expenses += Number(x.amount) || 0;
        });
        f.cashSales = r2(f.cashSales); f.nonCashSales = r2(f.nonCashSales); f.refunds = r2(f.refunds); f.expenses = r2(f.expenses);
        Object.keys(f.byStaff).forEach(function (k) { f.byStaff[k] = r2(f.byStaff[k]); });
        return f;
    }
    function moveSums(s) { var t = { in: 0, refund: 0, expense: 0, payout: 0 }; (s.moves || []).forEach(function (m) { t[m.kind === 'cash_in' ? 'in' : m.kind] += Number(m.amount) || 0; }); return t; }
    function totals(s) {
        var f = figures(s), m = moveSums(s), refunds = r2(f.refunds + m.refund), expenses = r2(f.expenses + m.expense + m.payout), cashIn = r2(m.in);
        return { f: f, refunds: refunds, expenses: expenses, cashIn: cashIn, expected: r2(s.openingFloat + f.cashSales + cashIn - refunds - expenses) };
    }

    /* ---------------- refresh / flush ---------------- */
    var flushing = false, lastRefresh = 0;
    async function flush() {
        if (flushing) return; flushing = true;
        try {
            var q = queue();
            while (q.length) {
                var it = q[0];
                try {
                    var out = await post(it);
                    if (it.action === 'open' && out.session && out.session.id === it.sessionId) { S.pending = false; if (S.session && S.session.id === it.sessionId) S.session = Object.assign({}, out.session, { moves: S.session.moves }); }
                } catch (e) {
                    if (e.code === 'offline' || e.code === 'no_d1') break;                        // try again later; nothing is lost
                    if (e.code === 'already_open' && it.action === 'open' && e.extra && e.extra.session) {   // the server already has a session for this device: use that one
                        var sv = e.extra.session; for (var i = 1; i < q.length; i++) if (q[i].sessionId === it.sessionId) q[i].sessionId = sv.id;
                        if (S.session && S.session.id === it.sessionId) S.session = sv; S.pending = false;
                    }
                }
                q.shift(); saveQueue(q);
            }
        } finally { flushing = false; }
    }
    async function refresh(force) {
        if (!enabled()) { S.state = 'ready'; paint(); return; }
        if (!force && Date.now() - lastRefresh < 8000) return; lastRefresh = Date.now();
        if (offline()) { S.state = 'ready'; paint(); return; }
        await flush();
        if (queue().length) { S.state = 'ready'; paint(); return; }                              // something is still waiting to be sent: our copy is the newer one
        try {
            var r = await post({ action: 'status' });
            S.session = r.session || null; S.pending = false; S.state = 'ready'; S.err = ''; saveCache();
        } catch (e) {
            S.state = e.code === 'no_d1' ? 'unavailable' : 'ready';
            if (e.code === 'no_d1') S.err = 'The cash register needs the database (D1), which is not connected yet.';
        }
        paint();
    }

    /* ---------------- actions ---------------- */
    async function openSession() {
        var inp = $('cr-float'); if (!inp || S.busy) return;
        var raw = String(inp.value || '').replace(/,/g, '').trim(), v = Number(raw);
        if (!raw || !isFinite(v) || v < 0) { setErr('Count the cash in the drawer and type the amount (0 if there is none).'); return; }
        S.busy = true; setErr(''); var body = { action: 'open', sessionId: uid('cs'), openingFloat: r2(v), openedAt: Date.now(), deviceName: devName() };
        try {
            var r = await post(body); S.session = r.session; S.pending = false;
        } catch (e) {
            if (e.code === 'already_open' && e.extra && e.extra.session) { S.session = e.extra.session; toast('This register was already open — carrying on with that session.'); }
            else if (e.code === 'offline' || e.code === 'no_d1') {
                S.session = { id: body.sessionId, site: '', device: devId(), deviceName: devName(), status: 'open', openedBy: who(), openedById: whoId(), openedAt: body.openedAt, openingFloat: body.openingFloat, moves: [] };
                S.pending = true; enqueue(body); toast('Cash session opened on this device. It will reach the server when the internet is back.');
            } else { S.busy = false; setErr(e.message); return; }
        }
        S.busy = false; S.state = 'ready'; lsSet(SEEN, '1'); saveCache(); paint();
    }
    async function addMove() {
        var s = S.session; if (!s || S.busy) return;
        var kind = $('cr-mv-kind').value, raw = String($('cr-mv-amt').value || '').replace(/,/g, '').trim(), v = Number(raw), note = String($('cr-mv-note').value || '').trim();
        if (!raw || !isFinite(v) || v <= 0) { setErr('Type the amount (more than zero).'); return; }
        if (kind !== 'cash_in' && !note) { setErr('Add a short reason so the count can be explained later.'); return; }
        S.busy = true; setErr('');
        var body = { action: 'move', sessionId: s.id, moveId: uid('mv'), kind: kind, amount: r2(v), note: note, at: Date.now() };
        try { var r = await post(body); S.session = r.session; }
        catch (e) {
            if (e.code === 'offline' || e.code === 'no_d1') { s.moves = (s.moves || []).concat([{ id: body.moveId, at: body.at, kind: kind, amount: body.amount, note: note, by: who() }]); enqueue(body); }
            else { S.busy = false; setErr(e.message); return; }
        }
        S.busy = false; saveCache(); toast('Recorded.'); S.view = 'menu'; paint();
    }
    async function closeSession() {
        var s = S.session; if (!s || S.busy || !isAuth()) return;
        var raw = String($('cr-counted').value || '').replace(/,/g, '').trim(), v = Number(raw);
        if (!raw || !isFinite(v) || v < 0) { setErr('Count all the cash in the drawer and type the total.'); return; }
        var t = totals(s), note = String(($('cr-close-note') || {}).value || '').trim();
        S.busy = true; setErr('');
        var body = { action: 'close', sessionId: s.id, counted: r2(v), note: note, closedAt: Date.now(), snapshot: { cashSales: t.f.cashSales, nonCashSales: t.f.nonCashSales, salesCount: t.f.salesCount, refunds: t.f.refunds, expenses: t.f.expenses } };
        var closed;
        try { if (S.pending) await flush(); closed = (await post(body)).session; }
        catch (e) {
            if (e.code === 'offline' || e.code === 'no_d1') {
                closed = Object.assign({}, s, { status: 'closed', closedBy: who(), closedAt: body.closedAt, cashSales: t.f.cashSales, nonCashSales: t.f.nonCashSales, salesCount: t.f.salesCount, refunds: t.refunds, expenses: t.expenses, cashIn: t.cashIn, expected: t.expected, counted: body.counted, difference: r2(body.counted - t.expected), note: note });
                enqueue(body); toast('Closed on this device. It will reach the server when the internet is back.');
            } else { S.busy = false; setErr(e.message); return; }
        }
        S.busy = false; S.lastClosed = closed; S.session = null; S.pending = false; S.view = 'result'; lsSet(SEEN, '1'); saveCache(); paint();
    }
    function setErr(m) { S.err = m || ''; var e = $('cr-err'); if (e) e.textContent = S.err; }

    /* ---------------- drawing ---------------- */
    function salesTab() { return $('sales-tab'); }
    function blocked() { return enabled() && S.state !== 'unavailable' && !S.session; }
    function ensureBar() {
        var tab = salesTab(); if (!tab) return null;
        var bar = $('cr-bar'); if (!bar) { bar = document.createElement('div'); bar.id = 'cr-bar'; tab.insertBefore(bar, tab.firstChild); }
        return bar;
    }
    function paintBar() {
        var bar = $('cr-bar'), s = S.session;
        if (!enabled() || !s) { if (bar) bar.style.display = 'none'; return; }
        bar = ensureBar(); if (!bar) return; bar.style.display = '';
        var line;
        if (isAuth()) { var t = totals(s); line = 'Cash: ' + kes(s.openingFloat) + ' → Expected: ' + kes(t.expected); }
        else line = 'Cash Session Active';
        bar.innerHTML = '<div class="cr-st"><span class="cr-dot"></span><span>' + esc(line) + '</span><span class="cr-sub">since ' + esc(clock(s.openedAt)) + (S.pending ? ' · not yet sent to the server' : '') + '</span></div>'
            + '<button type="button" id="cr-menu-btn">💵 Cash Register ▾</button>';
        $('cr-menu-btn').onclick = function () { S.view = 'menu'; S.err = ''; paint(); };
    }
    function paintGate() {
        var tab = salesTab(); if (!tab) return;
        var g = $('cr-gate'), need = blocked();
        tab.classList.toggle('cr-locked', need);
        if (!need) { if (g) g.remove(); return; }
        if (!g) { g = document.createElement('div'); g.id = 'cr-gate'; var grid = tab.querySelector('.pos-grid'); tab.insertBefore(g, grid || null); }
        if (S.state === 'checking') { g.innerHTML = '<div class="cr-card"><div class="cr-ico">💵</div><h2>Checking the cash register…</h2><p>One moment.</p></div>'; return; }
        if (g.getAttribute('data-ready') === '1') return;                                         // keep what the person is typing
        g.setAttribute('data-ready', '1');
        var again = lsGet(SEEN) === '1';
        g.innerHTML = '<div class="cr-card"><div class="cr-ico">💵</div><h2>' + (again ? 'Start New Cash Session' : 'Open Cash Session') + '</h2>'
            + '<p>Count the physical cash currently in the drawer and enter the amount available as change.</p>'
            + '<label class="cr-lbl" for="cr-float">Opening Float</label><div class="cr-amt"><span>KES</span><input id="cr-float" type="text" inputmode="decimal" autocomplete="off" placeholder="0"></div>'
            + '<p class="cr-err" id="cr-err"></p><button type="button" class="cr-btn go" id="cr-open-btn">Open Sales</button>'
            + '<p class="cr-note">One cash session for this device. Everyone who sells here shares it, and each sale still records who made it.' + (offline() ? ' You are offline: it will be sent to the server when the internet is back.' : '') + '</p></div>';
        $('cr-open-btn').onclick = openSession;
        $('cr-float').onkeydown = function (e) { if (e.key === 'Enter') openSession(); };
        setTimeout(function () { var i = $('cr-float'); if (i && salesTab() && salesTab().classList.contains('active')) { try { i.focus(); } catch (e) { /* no focus */ } } }, 60);
    }
    function modal() { var m = $('cr-modal'); if (!m) { m = document.createElement('div'); m.id = 'cr-modal'; m.onclick = function (e) { if (e.target === m && S.view !== 'result') { S.view = null; paint(); } }; document.body.appendChild(m); } return m; }
    function row(a, b, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + '><span>' + a + '</span><b>' + b + '</b></div>'; }
    function figuresHtml(s, t) {
        return '<div class="cr-rows">' + row('Opening Float', kes(s.openingFloat)) + row('Cash Sales', kes(t.f.cashSales)) + (t.cashIn ? row('Cash Put In', kes(t.cashIn)) : '')
            + row('Cash Refunds', kes(t.refunds)) + row('Cash Expenses', kes(t.expenses)) + row('Expected Cash', kes(t.expected), 'tot') + '</div>';
    }
    function sheet(inner) { return '<div class="cr-sheet">' + inner + '</div>'; }
    function top(title) { return '<div class="cr-top"><h3>' + title + '</h3><button type="button" class="cr-btn cr-x" id="cr-x" aria-label="Close">✕</button></div>'; }
    function paintModal() {
        var m = modal(), v = S.view, s = S.session;
        if (!v || (!s && v !== 'result')) { m.classList.remove('on'); m.innerHTML = ''; return; }
        var h = '';
        if (v === 'menu') {
            var t = totals(s);
            h = top('💵 Cash Register') + '<div class="cr-small">Opened by ' + esc(s.openedBy) + ' at ' + esc(when(s.openedAt)) + (s.deviceName ? ' · ' + esc(s.deviceName) : '') + (S.pending ? ' · waiting to reach the server' : '') + '</div>'
                + (isAuth() ? figuresHtml(s, t) : '<div class="cr-res idle">Cash Session Active<small class="cr-small" style="display:block">The amounts are shown to the admin or a manager.</small></div>')
                + '<p class="cr-err" id="cr-err"></p><div class="cr-btns">' + (isAuth() ? '<button type="button" class="cr-btn sec" id="cr-view">View Session</button>' : '') + '<button type="button" class="cr-btn sec" id="cr-move">Cash In / Out</button>'
                + (isAuth() ? '<button type="button" class="cr-btn bad" id="cr-close">Close Sales</button>' : '') + '</div>';
        } else if (v === 'move') {
            h = top('Cash In / Out') + '<p class="cr-small" style="margin:0 0 8px">Money that physically goes into or out of the drawer outside a sale.</p>'
                + '<label class="cr-lbl">What for</label><select class="cr-sel" id="cr-mv-kind"><option value="expense">Cash expense (paid from the drawer)</option><option value="refund">Cash refund to a customer</option><option value="payout">Payout / cash taken out</option><option value="cash_in">Cash put into the drawer</option></select>'
                + '<label class="cr-lbl">Amount (KES)</label><input class="cr-txt" id="cr-mv-amt" inputmode="decimal" autocomplete="off" placeholder="0">'
                + '<label class="cr-lbl">Reason</label><input class="cr-txt" id="cr-mv-note" autocomplete="off" placeholder="e.g. tea for staff, refund for returned item">'
                + '<p class="cr-err" id="cr-err"></p><div class="cr-btns"><button type="button" class="cr-btn sec" id="cr-back">Back</button><button type="button" class="cr-btn go" id="cr-mv-save">Record</button></div>';
        } else if (v === 'close') {
            var tc = totals(s);
            h = top('Close Sales') + figuresHtml(s, tc)
                + '<label class="cr-lbl">Count Physical Cash</label><p class="cr-small" style="margin:0 0 4px">Count all physical cash currently in the drawer.</p>'
                + '<div class="cr-amt"><span>KES</span><input id="cr-counted" type="text" inputmode="decimal" autocomplete="off" placeholder="Counted cash"></div>'
                + '<div id="cr-diff" class="cr-res idle">Enter the counted cash to see the difference</div>'
                + '<input class="cr-txt" id="cr-close-note" autocomplete="off" placeholder="Note (optional)">'
                + '<p class="cr-err" id="cr-err"></p><div class="cr-btns"><button type="button" class="cr-btn sec" id="cr-back">Cancel</button><button type="button" class="cr-btn bad" id="cr-close-go">Close Sales</button></div>';
        } else if (v === 'view') {
            var tv = totals(s), staffRows = Object.keys(tv.f.byStaff).map(function (k) { return '<div><span>' + esc(k) + '</span><b>' + kes(tv.f.byStaff[k]) + '</b></div>'; }).join('');
            var mv = (s.moves || []).map(function (x) { return '<div><span>' + esc(clock(x.at)) + ' · ' + esc({ cash_in: 'Cash in', refund: 'Refund', expense: 'Expense', payout: 'Payout' }[x.kind]) + (x.note ? ' — ' + esc(x.note) : '') + ' <i>(' + esc(x.by) + ')</i></span><b>' + (x.kind === 'cash_in' ? '+' : '−') + kes(x.amount) + '</b></div>'; }).join('');
            h = top('Session details') + '<div class="cr-small">Opened by ' + esc(s.openedBy) + ' · ' + esc(when(s.openedAt)) + '</div>' + figuresHtml(s, tv)
                + '<div class="cr-small">Sales in this session: <b>' + tv.f.salesCount + '</b> · Non-cash sales: <b>' + kes(tv.f.nonCashSales) + '</b></div>'
                + '<h4 style="margin:12px 0 2px">Cash sales by employee</h4><div class="cr-list">' + (staffRows || '<div><span>No cash sales yet</span><b></b></div>') + '</div>'
                + '<h4 style="margin:12px 0 2px">Cash in / out</h4><div class="cr-list">' + (mv || '<div><span>None recorded</span><b></b></div>') + '</div>'
                + '<h4 style="margin:12px 0 2px">Earlier sessions</h4><div class="cr-list" id="cr-hist"><div><span>Loading…</span><b></b></div></div>'
                + '<div class="cr-btns"><button type="button" class="cr-btn sec" id="cr-back">Back</button></div>';
        } else if (v === 'result') {
            var c = S.lastClosed || {}, d = r2(c.difference), cls = Math.abs(d) < 0.005 ? 'ok' : d < 0 ? 'short' : 'over', word = cls === 'ok' ? 'Balanced' : cls === 'short' ? 'Short: ' + kes(-d) : 'Over: ' + kes(d);
            h = top('Cash session closed') + '<div class="cr-res ' + cls + '">' + (cls === 'ok' ? '✓ ' : '⚠ ') + word + '<span class="big">Difference: ' + (d < 0 ? '−' : d > 0 ? '+' : '') + kes(Math.abs(d)) + '</span></div>'
                + '<div class="cr-rows">' + row('Expected Cash', kes(c.expected)) + row('Counted Cash', kes(c.counted)) + row('Closed by', esc(c.closedBy || '')) + '</div>'
                + '<div class="cr-small">The session is recorded permanently. The next session starts with a new counted float.</div><div class="cr-btns"><button type="button" class="cr-btn go" id="cr-done">Done</button></div>';
        }
        m.innerHTML = sheet(h); m.classList.add('on');
        var x = $('cr-x'); if (x) x.onclick = function () { S.view = null; S.err = ''; paint(); };
        var b = $('cr-back'); if (b) b.onclick = function () { S.view = 'menu'; S.err = ''; paint(); };
        var dn = $('cr-done'); if (dn) dn.onclick = function () { S.view = null; paint(); };
        if ($('cr-view')) $('cr-view').onclick = function () { S.view = 'view'; paint(); loadHistory(); };
        if ($('cr-move')) $('cr-move').onclick = function () { S.view = 'move'; S.err = ''; paint(); };
        if ($('cr-close')) $('cr-close').onclick = function () { S.view = 'close'; S.err = ''; paint(); setTimeout(function () { var i = $('cr-counted'); if (i) i.focus(); }, 50); };
        if ($('cr-mv-save')) $('cr-mv-save').onclick = addMove;
        if ($('cr-close-go')) $('cr-close-go').onclick = closeSession;
        if ($('cr-counted')) $('cr-counted').oninput = function () {
            var n = Number(String(this.value).replace(/,/g, '')), box = $('cr-diff'), ex = totals(S.session).expected;
            if (!this.value.trim() || !isFinite(n)) { box.className = 'cr-res idle'; box.textContent = 'Enter the counted cash to see the difference'; return; }
            var d2 = r2(n - ex), k = Math.abs(d2) < 0.005 ? 'ok' : d2 < 0 ? 'short' : 'over';
            box.className = 'cr-res ' + k; box.innerHTML = (k === 'ok' ? '✓ Balanced' : k === 'short' ? '⚠ Short: ' + esc(kes(-d2)) : '⚠ Over: ' + esc(kes(d2))) + '<span class="big">Difference: ' + (d2 < 0 ? '−' : d2 > 0 ? '+' : '') + esc(kes(Math.abs(d2))) + '</span>';
        };
        var er = $('cr-err'); if (er) er.textContent = S.err || '';
        ['cr-counted', 'cr-mv-amt'].forEach(function (id) { var i = $(id); if (i) i.onkeydown = function (e) { if (e.key === 'Enter') (id === 'cr-counted' ? closeSession : addMove)(); }; });
    }
    async function loadHistory() {
        var box = $('cr-hist'); if (!box) return;
        try {
            var r = await post({ action: 'history', limit: 8, device: devId() });
            var rows = (r.sessions || []).filter(function (x) { return x.status === 'closed'; }).map(function (x) { var d = r2(x.difference); return '<div><span>' + esc(when(x.openedAt)) + ' · ' + esc(x.openedBy) + ' → ' + esc(x.closedBy || '') + '</span><b style="color:' + (Math.abs(d) < 0.005 ? '#27ae60' : d < 0 ? '#c0392b' : '#e67e22') + '">' + (Math.abs(d) < 0.005 ? 'Balanced' : (d < 0 ? 'Short ' : 'Over ') + esc(kes(Math.abs(d)))) + '</b></div>'; }).join('');
            box.innerHTML = rows || '<div><span>No closed sessions yet</span><b></b></div>';
        } catch (e) { box.innerHTML = '<div><span>Not available offline</span><b></b></div>'; }
    }
    function paint() {
        try { paintGate(); paintBar(); paintModal(); } catch (e) { try { console.warn('cash register', e); } catch (e2) { /* none */ } }
    }

    /* ---------------- the Sales Counter itself must not sell without a session ---------------- */
    var baseCheckout = window.checkoutCart;
    if (typeof baseCheckout === 'function') window.checkoutCart = function () {
        if (blocked()) { toast('Open a cash session first (count the drawer and tap Open Sales).', true); paint(); return Promise.resolve(); }
        var p = baseCheckout.apply(this, arguments);
        try { Promise.resolve(p).then(function () { setTimeout(paintBar, 400); }, function () { /* the sale reported its own error */ }); } catch (e) { /* cosmetic */ }
        return p;
    };
    var baseSwitch = window.performTabSwitch;
    if (typeof baseSwitch === 'function') window.performTabSwitch = function (btn, tabId) { var r = baseSwitch.apply(this, arguments); if (tabId === 'sales-tab') { setTimeout(function () { paint(); refresh(); }, 30); } return r; };

    function mount() {
        var sec = (window.__viewSection && window.__viewSection()) || document.getElementById('settings-section-general');
        if (!sec) return;
        var ex = $('cash-register-card');
        if (ex) { if (ex.parentNode !== sec) sec.insertBefore(ex, sec.children[1] || null); return; }
        var d = document.createElement('div');
        d.id = 'cash-register-card'; d.className = 'settings-row';
        d.style.cssText = 'flex-direction:column; align-items:stretch; gap:6px; margin:12px 0; padding:12px 14px; border-radius:12px; background:rgba(127,140,141,.12);';
        d.innerHTML = '<label style="display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer;"><input type="checkbox" id="cash-register-toggle" style="width:auto;" onchange="setCashRegister(this.checked)"> 💵 Use the cash register in the Sales Counter</label>'
            + '<p class="settings-hint" style="margin:0;">Each day (or shift) the drawer is counted when sales open and counted again when sales close, so any shortage or surplus shows. One cash session per device, shared by everyone who sells on it. Applies to every device of this shop.</p>';
        sec.insertBefore(d, sec.children[1] || null);
        $('cash-register-toggle').checked = enabled();
    }
    window.CashRegister = { state: function () { return S; }, refresh: refresh, flush: flush, totals: totals, figures: figures, paint: paint, blocked: blocked, open: openSession, queue: queue };
    function go() {
        mount(); setTimeout(mount, 900);
        var c = readCache();
        if (c && c.device === devId()) { S.session = c.session || null; S.pending = !!c.pending; S.lastClosed = c.lastClosed || null; S.state = 'ready'; }
        paint();
        setTimeout(function () { refresh(true); }, 1200);
        setTimeout(function () { if (S.state === 'checking') { S.state = 'ready'; paint(); } }, 6000);     // never leave the counter stuck on "checking"
        window.addEventListener('online', function () { setTimeout(function () { refresh(true); }, 1500); });
        setInterval(function () { var t = salesTab(); if (t && t.classList.contains('active') && S.session && !S.view) paintBar(); }, 20000);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
</script>
