<!-- STOCK PRO (zip 336) ----------------------------------------------------------------------------------------------------------
     The screens and checkout hooks on top of the Stock Engine (stock-engine block). Everything here is guarded: a module that lacks a piece
     (Aqua POS has no Store / no inventory list) simply does not get that piece.
       A. STORE <-> INVENTORY: stock coming back from the Store finds the SAME item (code, then the line it went to before, then one exact name + unit
          match) instead of making a second "Hospital gloves"; two or more look-alikes are held for a person to pick (never guessed), and only confirmed
          to the server once applied. "Move stock into the Store" in every module (the Shop already had it on each item), with the store line chosen
          up front. Store check: look-alike lines, stuck transfers, batches that do not add up, merge two lines (manager, audited).
       B. PACKAGING: carton > packet > piece levels per item (one stock figure in the smallest unit). Sell by any level at the Sales Counter (a chooser,
          or scan the package barcode), receive by package on Restock, see "2 Carton + 3 Packet" next to the quantity. Voids and returns convert back.
       C. BATCHES (Pharmacy + Hospital only): every batch's number, expiry, cost, supplier and status; quarantine / recall / release (manager); stock
          valued at batch cost; FEFO (default) or FIFO.
       D. COST & PROFIT: the cost check (costs that look wrong, sales at a loss, batches without a cost), a manager's cost correction (from now on, or
          also restating past sales - shown before it is saved), recalculate profit, a documented profit adjustment (e.g. to zero) and its reversal,
          books closed through a date. Corrections and adjustments are kept on the server (/api/cost-control), append-only.
     Ids / classes: spx-*. -->

<script id="spx-js">

        try { if (typeof stockMovementLog !== 'undefined') safeSetItem(key('pos_stock_movement_log'), JSON.stringify(stockMovementLog)); } catch (e) { /* saved by the next change */ }

    }

    /* ---------------- the pop-up ---------------- */
    var modalHandlers = {};
    function modal(title, html, opts) {

            document.body.appendChild(ov);

            ov.addEventListener('change', function (e) { if (modalHandlers.__change) modalHandlers.__change(e.target, e); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('spx-ov') && $('spx-ov').classList.contains('on')) close(); }, true);
        }

    }
    function close() { var ov = $('spx-ov'); if (ov) ov.classList.remove('on'); modalHandlers = {}; }
    function body() { return $('spx-body'); }
    function val(id) { var e = $(id); return e ? e.value : ''; }
    W.spxClose = close;

    /* ---------------- item picker (search the inventory) ---------------- */
    function pickItem(title, filter, done) {
        var list = (inv() || []).filter(function (p) { return p && p._deleted !== true && p.type !== 'service' && (!filter || filter(p)); });
        function rows(q) {
            q = String(q || '').trim().toLowerCase();
            var hit = list.filter(function (p) { return !q || String(p.name || '').toLowerCase().indexOf(q) >= 0 || String(p.code || '').toLowerCase().indexOf(q) >= 0; }).slice(0, 60);
            return hit.length ? hit.map(function (p) { return '<button type="button" data-spx="pick" data-code="' + esc(p.code) + '"><span><b>' + esc(p.name) + '</b><br><small>#' + esc(p.code) + '</small></span><small>' + esc(stockText(p)) + '</small></button>'; }).join('') : '<div class="spx-note">Nothing matches.</div>';
        }

            on: { pick: function (b) { var c = b.getAttribute('data-code'); close(); done(findP(c)); }, __input: function (t) { if (t.id === 'spx-pick-q') $('spx-pick-list').innerHTML = rows(t.value); } },
        });

    }
    function unitOf(p) { return (p && p.unit) || 'pcs'; }
    function stockText(p) {

        var t = (s ? s.r3(q) : q) + ' ' + unitOf(p) + (lbl ? ' (' + lbl + ')' : '');
        if (lotsOn() && s.lotTracked(p)) { var ls = s.lotSummary(p); if (ls.expired || ls.blocked) t += ' - ' + ls.usable + ' usable'; }

    }

    var LINKS = 'se_store_links', HELD = 'se_store_held';
    function links() { return lsGet(LINKS, {}); }
    function linkSet(storeItemId, code) { if (!storeItemId || code == null) return; var l = links(); l[storeItemId] = String(code); var k = Object.keys(l); if (k.length > 800) k.slice(0, k.length - 800).forEach(function (x) { delete l[x]; }); lsSet(LINKS, l); }
    function linkFor(code) { var l = links(); for (var k in l) { if (l[k] === String(code)) return k; } return null; }
    function heldList() { return lsGet(HELD, []); }
    function heldIds() { return heldList().map(function (h) { return h.w && h.w.movementId; }).filter(Boolean); }
    function heldAdd(w, m) {
        var h = heldList();
        if (h.some(function (x) { return x.w && x.w.movementId === w.movementId; })) return;
        h.push({ w: w, cands: (m.candidates || []).map(function (p) { return p.code; }), parent: m.parent ? m.parent.code : null, how: m.how, at: Date.now() });
        lsSet(HELD, h);
        setTimeout(renderStoreBar, 0);
    }
    function heldRemove(mid) { lsSet(HELD, heldList().filter(function (x) { return !(x.w && x.w.movementId === mid); })); }
    function linkCodeOnServer(storeItemId, code) {
        if (!storeItemId || code == null || navigator.onLine === false) return;

    }
    function movedWhy(w) { return w.fromBranch ? 'Transfer from ' + w.fromBranch : 'Transfer from Store'; }
    // credit stock that arrived (from the Store or another branch) to the item `m` (SE.matchLine result, or a person's choice)
    // zip 336 (fix): a transfer from the Store is applied ONCE however often it is offered (a refresh, a second device, a lost "received"
    // reply, a cleared claim list). Its stock-ledger entry gets a fixed id made from the transfer's own id, so (a) this till sees it was
    // already applied and does not add it again, and (b) the server, which stores every ledger id once, can never count it twice.

    }

            var m = SE().matchLine(inventory, w, links());

            return applyArrived(w, m);

            var origConfirm = W.storeConfirmReceived;
            var conf = function (list) { var held = heldIds(); return origConfirm.call(this, (list || []).filter(function (w) { return w && held.indexOf(w.movementId) < 0; })); };

        else { var p = findP(choice); if (!p) { toast('That item is no longer in Inventory.', true); return; } m = { kind: 'item', product: p, how: 'picked by ' + (who() || 'staff') }; }
        applyArrived(h.w, m);

        saveStock();
        try { if (typeof W.storeConfirmReceived === 'function') W.storeConfirmReceived([h.w]); } catch (e) { /* confirmed on the next Store visit */ }
        toast('Added ' + h.w.qty + ' ' + (h.w.unit || 'pcs') + ' of ' + h.w.name + (m.variant ? ' to "' + m.product.name + ' (' + m.variant.name + ')"' : m.product ? ' to "' + m.product.name + '"' : ' as a new item') + '.');

    }
    function openHeld() {
        var h = heldList();
        if (!h.length) { close(); renderStoreBar(); return; }
        var all = (inv() || []).filter(function (p) { return p && SE().stockable(p) && !p.hasVariants; });
        var html = '<div class="spx-note warn">These arrived from the Store, but more than one item here could be the one meant, so nothing was added yet. Pick the item each belongs to. (It is only marked "received" once you do.)</div>';
        html += h.map(function (x) {
            var c = x.cands.map(findP).filter(Boolean);
            var vpar = x.parent ? findP(x.parent) : null;

                + '<h4>Books closed through</h4><div class="spx-row"><div><input id="spx-close-d" type="date" value="' + esc(ct || '') + '"></div><div><button type="button" class="spx-btn sec" data-spx="setclose">Save closing date (manager)</button></div></div><p style="font-size:12.5px">After closing, sales up to that date cannot be restated and that period cannot be adjusted. Only the Admin can move the date back.</p>';
            modal('📚 Corrections, adjustments & audit', h, {
                wide: true,
                on: {
                    rev: function (b) {
                        var id = b.getAttribute('data-id'), why = (prompt('Why is this adjustment being reversed?') || '').trim(); if (why.length < 5) { if (why) toast('Write a reason of a few words.', true); return; }
                        withProof('Reversing a profit adjustment changes your reports, so a manager confirms it.', function (h2) { return post('/api/cost-control', { action: 'reverse', adjId: rid('rv-'), reverseOf: id, reason: why, servedBy: who() }, h2); }).then(function (r) { if (!r.ok) { if (!r.cancelled) toast(r.d.error || 'Not reversed.', true); return; } toast('Reversed (both entries are kept).'); loadCc(true).then(function () { rerenderReports(); history(); }); });
                    },
                    setclose: function () {
                        var d = val('spx-close-d'), why = (prompt(d ? 'Close the books through ' + d + '? Reason:' : 'Reopen the books? Reason:') || '').trim(); if (why.length < 5) { if (why) toast('Write a reason of a few words.', true); return; }
                        withProof('Closing the books is a manager decision.', function (h2) { return post('/api/cost-control', { action: 'setClosed', through: d, reason: why, servedBy: who() }, h2); }).then(function (r) { if (!r.ok) { if (!r.cancelled) toast(r.d.error || 'Not saved.', true); return; } toast(d ? 'Books closed through ' + d + '.' : 'Books reopened.'); loadCc(true).then(history); });
                    },
                },
            });
        });
    }

    /* ============================ install ============================ */
    function install() {
        if (!W.SE) return;
        try { installTransferHooks(); } catch (e) { /* none */ }
        try { installCartHooks(); } catch (e) { /* none */ }
        try { installValueHook(); } catch (e) { /* none */ }
        try { installProfitHook(); } catch (e) { /* none */ }
    }
    install();
    document.addEventListener('DOMContentLoaded', install);
    setTimeout(install, 1500);

    /* ---- zip 342: a Move button on every Inventory row (same dialog, four ways) ---- */
    function moveButtons() {
        var tab = $('inventory-list-tab'); if (!tab) return;
        var list = tab.querySelectorAll('button[onclick^="openInventoryEditModal("]');
        for (var i = 0; i < list.length; i++) {
            var b = list[i], nx = b.nextElementSibling; if (nx && nx.hasAttribute && nx.hasAttribute('data-spxmv')) continue;
            if (b.parentNode && b.parentNode.querySelector && b.parentNode.querySelector('.inv-move-btn, [data-spxmv]')) continue;   // the Shop already has its own Move button here
            var m = /openInventoryEditModal\('([^']*)'(?:\s*,\s*'([^']*)')?\)/.exec(b.getAttribute('onclick') || ''); if (!m) continue;
            var n = document.createElement('button'); n.type = 'button'; n.className = 'settings-small-btn'; n.setAttribute('data-spxmv', '1'); n.setAttribute('data-code', m[1].replace(/\\'/g, "'")); if (m[2]) n.setAttribute('data-vid', m[2]);
            n.style.cssText = 'font-size:12px;margin:0 0 4px 4px'; n.textContent = '↔ Move'; n.title = 'Move stock between this item, the Store and other branches';
            b.parentNode.insertBefore(n, b.nextSibling);
        }
    }
    document.addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-spxmv]') : null; if (!b) return; e.preventDefault(); W.openMoveStock(b.getAttribute('data-code'), b.getAttribute('data-vid') || undefined); });
    function tick() {
        try {
            var tab = document.querySelector('.tab-content.active'); var id = tab ? tab.id : '';
            if (id === 'store-tab') renderStoreBar();
            if (id === 'store-tab' || id === 'inventory-list-tab' || id === 'inventory-tab') { loadRequests(false); renderRequests(false); } else if ($('spx-req-bar')) renderRequests(false);
            if (id === 'restock-tab') renderRestockBar();
            if (id === 'inventory-list-tab') { inventoryBar(); moveButtons(); }
            if (id === 'profits-tab') { peWrap(); peDecorate(); }
            if (id === 'profits-tab' && !$('spx-profit-tools')) { loadCc(false).then(function () { try { if (typeof renderProfitReport === 'function') renderProfitReport(); } catch (e) { /* cosmetic */ } }); profitTools(); }
            if (id === 'stock-value-tab') lotValuePanel();
            editButtons();
            if (++labelTick % 2 === 0) decorate();
        } catch (e) { /* next tick */ }
    }
    setInterval(tick, 1200);
    // once after start (approved corrections are needed by the reports), then only when the Profits tab or a cost tool is opened - no polling
    setTimeout(function () { loadCc(false); }, 8000);
})();
</script>
