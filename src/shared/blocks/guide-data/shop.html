<!-- GUIDE DATA (shop) — generated by tools/build-guides.mjs; edit that file, not this one. -->
<script>window.__GUIDE_DATA = {"key":"shop","title":"Shop POS — User Guide","tagline":"Retail shops, supermarkets, hardware and general stores — selling, stock, bills and reports.","module":"Shop POS","version":"1.0.0","chapters":[{"id":"start","icon":"🚀","title":"Getting started","intro":"Shop POS works on a phone, tablet or computer, online or offline. Everything below applies on every device you use.","steps":["Open the link your provider gave you (or the app icon, once installed). The very first time on a new business, tap **Sign Up**, type the business name, your name and a **password** — you become the **Admin**. After that, tap **Log In**.","On **Who’s logging in?** pick **Admin** (type the password) or a staff member (type their PIN). Staff only see the tabs the Admin gave them.","Look at the small dot at the top: **green** = online and saved, **orange** = syncing, **black** = offline. Offline is fine — keep selling; everything is saved on the device and sent when the internet is back.","Tabs run across the top. **☰ More** holds the ones that do not fit. Tap the **📖** button at the top any time to open this guide.","Install it like an app: **⚙️ Settings ▸ 📱 Install App ▸ Install / Add to Home Screen**. After the first load it opens with no internet at all."],"tips":["Do the first load of the app **while online** on every device — that is what lets it open offline later.","Settings ▸ Install App ▸ Version shows the version and the build on this device, so you can confirm an update reached it."]},{"id":"setup","icon":"🧭","title":"Set up your business (first 20 minutes)","intro":"Do these once, in this order, as the Admin:","steps":["**⚙️ Settings ▸ General** — business name, logo, phone and address. They print on every receipt.","**Settings ▸ 🧾 Receipt Settings** — header and footer lines, paper width (58 mm or 80 mm), how many copies, whether to print the reference number and its barcode.","**Settings ▸ 🧾 Tax & Alerts** — VAT rates, and the **low-stock level** (items at or below it are flagged and offered as buttons when you restock).","**Settings ▸ 💳 Payment Gateway** — connect M-Pesa (Paystack, or Safaricom Daraja with your Till/Paybill) so you can send payment prompts to customers.","**Settings ▸ 🖨️ Hardware** — connect your receipt printer (see the **Printers & hardware** chapter).","Add your items (see **📦 Add New Items**), then **Settings ▸ 👥 Staff Accounts** to invite your staff.","**Settings ▸ 🗄️ Backups** — check that backups are on. **Settings ▸ 📥 Data Import** brings in data from another system."],"tips":["Settings ▸ 🔒 Security & Access lets the Admin lock tabs behind the management password.","Settings ▸ 🧾 eTIMS (KRA) is only for businesses registered for KRA eTIMS — leave it off otherwise."]},{"id":"items","icon":"📦","title":"Adding items","steps":["Open **📦 Add New Items**. Choose **Add One Item**: type the name, the **selling price**, the **buying (cost) price**, the starting **quantity** and the unit (pieces, kg, litres, box…). Save.","For many items at once use **Add Multiple Items (Bulk)**, or **⬆️ Import from Excel/CSV** on the Inventory tab (columns: Category, Code, Name, Price, Cost Price, Unit, Qty).","**📸 Capture List:** photograph a supplier invoice or handwritten stock list and the app reads the lines; check them and confirm.","Give each item a **code** or scan its barcode (📷) so it can be found by scanning. **🔖 Barcode** prints labels.","Items sold by the box **and** by the piece: tick **Dual unit**, enter pieces per box and the piece price. Bags sold whole **and** loose (cement in 50 kg bags and by the kilo): set the loose unit; one stock balance serves both."],"tips":["Edit any price or quantity later from the **📋 Inventory** tab (tap the item).","Set the **low-stock level** in Settings ▸ Tax & Alerts."]},{"id":"sale","icon":"🛒","title":"Making a sale (Sales Counter)","steps":["Open **🛒 Sales Counter**. Type part of a name or code in the search box (or scan a barcode, or tap a picture in the items grid). The item goes into the cart.","Change the quantity with **+ / −** or type it. For box/piece or bag/kg items, tap the unit toggle on the line.","Optional: type the customer’s phone to send a thank-you SMS, pick **Delivery** to add an address, zone, fee and driver.","Choose the **payment method** (see **Taking payment**) and tap **Complete**. The receipt preview opens — print or share it.","Stock is reduced automatically. To undo a sale, **void** it from Daily Sales."]},{"id":"gas","icon":"🔥","title":"Gas refills","steps":["Open **🔥 Gas Refill**. **➕ Add size** for each cylinder size (6 kg, 13 kg…) with its Full and Empty counts and the refill, full-cylinder and empty prices.","Sell: **🔄 Refill / Exchange** (customer returns an empty, gets a full: Full −1, Empty +1), **🛢️ Full cylinder** (to keep), **📦 Complete set** (cylinder plus ticked accessories like a regulator) or **⚪ Empty cylinder** on its own.","**Cylinders with the supplier:** send empties to the supplier and receive them back full — the Full / Empty / With supplier counts stay right.","Accessories are ordinary inventory items: mark them under **Mark as accessory** to offer them in sets."]},{"id":"delivery","icon":"🚚","title":"Deliveries","steps":["Set **Settings ▸ 🚚 Delivery Zones** (each zone’s fee and cost) and **🛵 Delivery Agents** (your drivers).","On the Sales Counter choose **Delivery**, fill the address, zone and agent, and pick **Paid Now** or **Pay on Delivery**.","The driver sees the order in **🚚 Deliveries** and moves it: Picked Up → On Route → Delivered."]},{"id":"more","icon":"🏬","title":"Store, branches, contracts and credits","steps":["**🏬 Store** is a separate warehouse list; take items from it into inventory when you move them to the shop.","**🔀 Cross-Branch Sales** — with branches linked (Settings ▸ Branches) you can sell an item another branch holds.","**📑 Contracts** — wholesale customers with agreed terms and a running balance.","**🤝 Trade Credits** — money you owe another business, or that they owe you."]},{"id":"payments","icon":"💳","title":"Taking payment: cash, M-Pesa, card, split, Pay Later","intro":"Choose the payment method under the cart, then complete the sale.","steps":["**Cash** — type the amount the customer gave; the change due shows at once. The amount must cover the total.","**M-Pesa** — enter the customer’s number and tap **Send M-Pesa Prompt** (the customer approves on their phone), or type the M-Pesa code if they paid to your till. The sale completes once it is confirmed.","**Card** — take the card payment on your machine, optionally type the slip reference, and complete.","**Split** — part cash, part M-Pesa: type both amounts. They must add up to the total exactly, or the sale is refused.","**Bill (Pay Later)** — for customers who pay later: type the customer’s name (and phone), optionally an amount paid now. The sale becomes a **bill** that you settle later from the **Bills** tab; it only counts in Daily Sales as money is paid."],"sections":[{"title":"Hold a sale (customer not ready to pay)","steps":["Build the customer’s cart, then tap **⏸️ Hold sale**. The cart clears so you can serve the next person; **one** sale can be held at a time.","When the customer is ready, finish the sale you are on, then tap the **held sale** button that appears where Hold sale was — the held cart comes back exactly as it was."]},{"title":"Record a past sale (forgot to record it)","steps":["On the Sales Counter tap **Record a Past Sale**, pick the item, date and time, quantity, price and payment method (cash, M-Pesa, card, split or Bill).","It is saved on that date and takes the stock off, like a normal sale."]}],"tips":["Nothing is deducted from stock while a sale is only being built or held.","A wrong sale can be **voided** from Daily Sales (stock comes back)."]},{"id":"receipts","icon":"🧾","title":"Receipts: print, share, reprint","steps":["When a sale completes a **receipt preview** opens. Tap **🖨️ Print** — it prints **once**, and the preview closes so it cannot be printed twice by accident.","The sale is **saved before the receipt appears** — the preview says \"✓ Sale saved\". **Cancel / Save** only closes the screen: it never cancels the sale (to reverse one, **void** it in Daily Sales).","Every receipt of the day carries a **Customer number** (Customer 1, 2, 3…) just above the reference number. It starts again at 1 each day, so the last receipt of the day tells you how many customers you served.","To print the same receipt again later, open it from **Daily Sales** and tap Print — the app asks \"already printed at 14:32 — print another copy?\" so copies are always deliberate.","**📤 Share** sends the receipt as a **PDF** (WhatsApp shows it as a document). On a phone it opens your apps. On computers and some browsers that cannot hand a file to another app, the PDF is **saved to Downloads** instead — attach it in WhatsApp or email yourself.","**⬇️ Download** always saves the PDF."],"tips":["If the print fails (printer off, paper out) the preview stays open so you can try again — the sale is already saved.","Settings ▸ 🧾 Receipt Settings controls what appears on the receipt."]},{"id":"bills","icon":"📒","title":"Bills (Pay Later) and Debts","steps":["A **Bill (Pay Later)** sale appears in the **🧾 Bills** tab with what is owed. Tap **Settle** to take a full or part payment (cash, M-Pesa, card or split). A partial payment reduces the balance; the bill stays open.","When a bill is paid in full it becomes **closed** and moves out of the open list. Tick **Show closed bills** to see paid bills too (closed bills are tidied away after 90 days).","**Save (no receipt)** in the settle window records the payment without printing a receipt.","**📒 Debts** is for money customers owe you outside a bill — add a debt with the customer’s name and amount, and settle it in parts or in full.","The Sales Counter has a small **Bills** panel for staff: green = money they collected on bills, red = still owed."],"tips":["Pay-Later sales are not counted as sales until money is paid on them."]},{"id":"stock","icon":"📥","title":"Restock, Orders and Stock Take","sections":[{"title":"📥 Restock: record stock you received","steps":["Open **📥 Restock**. Tap a **⚠️ low-stock button** to add that item to the form (with its last buying price), or start typing a name — a drop-down of your items appears; pick one to fill the code, unit and buying price, or keep typing a new name.","Enter the quantity and the buying price, then save. Stock goes up and an expense is logged automatically."]},{"title":"🛍️ Orders: order from suppliers","steps":["Open **Orders** ▸ **New Order**. Tap low-stock buttons to add what is running out, or type names (same drop-down). Enter quantities and prices and choose or type the supplier.","Tap **💬 Save & send on WhatsApp** to save the order and open WhatsApp addressed to the supplier with the order written out (their number is asked once and remembered). Or **Save Order** now and press **💬 WhatsApp** on it later.","Mark it **In Transit** when the supplier dispatches, and **Arrived** when the goods come — that adds the stock."]},{"title":"📋 Stock Take: correct the system to the shelf","steps":["Open **Stock Take**, count each item on the shelf and type the number next to it. Only items you type a count for are touched.","The screen shows each difference and its value at cost. Tap **✔ Update stock to my counts** — every change is recorded as a \"Stock take\" adjustment."]}],"tips":["Do a stock take after a stock delivery day or at the end of the month.","↩️ **Returned Goods** puts returned items back on the shelf (or into the faulty register) and can refund the customer."]},{"id":"reports","icon":"📊","title":"Reports and Daily Sales","steps":["**🧾 Daily Sales** lists every sale for Today, a Week, a Month or a Custom range, filtered by payment method. Print the day’s report from there, or void a wrong sale.","**📦 Stock Report** shows stock movement (opening, received, sold, closing) with values at cost and retail.","**💰 Profits & Expenses** — add expenses (rent, fuel, wages…) and see gross and net profit.","**📊 Reports** is the one place to generate everything: pick a **period** (Today … Last 90 days … Custom), then a report."],"sections":[{"title":"The reports in 📊 Reports","points":["**Sales** — total, number of sales, average sale, by payment method and the items sold, best first.","**Business insights** — busiest hour, best-earning hour, best day of the week, best worker; charts of sales by hour and by weekday; and a **trend line** you can switch between **daily, weekly (12 weeks) and monthly (12 months)**.","**Staff performance** — sales, average sale, share and sales per hour worked for each person.","**Stock** — stock value at cost and retail, low stock, out of stock and items that did not sell in the period.","**Bills & debts** — who owes what, oldest first, with ageing.","**Expenses & profit** — sales, cost of goods, gross profit, expenses by category and net profit."]}],"tips":["Every report can be **🖨️ printed / saved as PDF** or **⬇️ downloaded for Excel (CSV)**.","**📊 Dashboard** gives today’s figures the moment you open the app."]},{"id":"people","icon":"👥","title":"Staff, access and security","steps":["Open **⚙️ Settings ▸ 👥 Staff Accounts** (or the **👥 Staff** tab) and add a staff member’s name. Tick the tabs they may use — the Sales Counter too; a staff member sees only the tabs ticked for them. Tap **Generate invite link**.","Send the link to them. They open it, choose a **PIN** (4+ characters) and they are in — no shop password needed. The link then turns into their personal login link: they should bookmark it.","A staff member is listed once: a double tap on \"Create my account\" cannot make two copies.","**🕐 Attendance** — staff clock in and out; hours worked show in Reports ▸ Staff performance.","**Settings ▸ 🔒 Security & Access** — change the password, lock tabs behind the management password, and use fingerprint where the device supports it.","**Settings ▸ 🔐 Admin Activity Log** shows what was changed and by whom.","**⬇️ Sync to this device** (Settings ▸ 🔐 Devices & Security) sends this device's unsent sales first, then fetches everything the shop has on the server — step by step, with nothing deleted or duplicated.","**Settings ▸ 🔐 Devices & security** lists every device that syncs your shop (its till number, app release and last sync). Tap **🔒 Only paired devices may sync** so that knowing your shop link is no longer enough to see or change your data. Your devices pair themselves; a new one needs the shop password once, or a **6-digit pairing code** made here (so staff never need the password). Revoke a lost phone from the same list. Signing in and selling always work offline either way.","**👤 My Customers** keeps your customers and their purchases; **🎟️ Loyalty Tokens** (Settings) rewards repeat customers where enabled."],"tips":["To remove a staff member, remove them under Staff Accounts — their old sales stay in the records.","If someone forgets the Admin password, use **Forgot it? Email me a reset link** on the login screen (needs the recovery email set up)."]},{"id":"hardware","icon":"🖨️","title":"Printers & hardware","intro":"Open **⚙️ Settings ▸ 🖨️ Hardware** (or tap the small printer icon at the top). There are three ways to print:","sections":[{"title":"1. System print dialog (works with any installed printer)","steps":["Set **Printer mode** to **System print dialog**.","Print a receipt: the device’s print window opens — choose your receipt printer once. The receipt prints on a slip only as long as its lines (paper is not wasted).","Browsers never allow silent printing, so this mode always shows that window. Use Bluetooth or USB to avoid it."]},{"title":"2. USB thermal printer (computer or Android)","steps":["Plug the printer in and switch it on.","Set **Printer mode** to **USB**, tap **Connect USB Printer**, choose your printer and allow access.","From then on the app **reconnects by itself** whenever the printer is switched off and on, unplugged and replugged, or the app is reopened — it keeps checking every few seconds and prints the moment the printer is back. You do not go back to Settings."]},{"title":"3. Bluetooth thermal printer (phones and tablets)","steps":["Switch the printer on and pair it in the phone’s Bluetooth settings if it asks.","Set **Printer mode** to **Bluetooth**, tap **Connect Bluetooth Printer** and pick it from the list (once).","After a power cut or the printer going out of range, the app reopens the same printer by itself (no chooser). Some browsers cannot reopen a remembered Bluetooth printer after the page reloads — the screen then says **Tap Connect once**."]},{"title":"Paper, copies and the cash drawer","steps":["**Receipt Settings** sets the paper width (58 or 80 mm) and the number of copies.","The **cash drawer** plugs into the **printer** (RJ11/RJ12 port), not the computer; turn on \"open drawer on print\" in Hardware settings.","To check paper width and the drawer, print a small sale receipt, or reprint one from Daily Sales."]},{"title":"Barcode scanners","steps":["A USB or Bluetooth **scanner** works like a keyboard: click the search box on the Sales Counter and scan.","The 📷 button next to search scans with the phone camera."]}],"tips":["Printing waits up to 4 seconds for a printer that has just been switched on before saying it is not connected.","If a print fails half-way the receipt is **not** sent again automatically (so you never get a doubled half-receipt) — reprint from Daily Sales."]},{"id":"offline","icon":"📶","title":"Offline, sync, backups and importing data","steps":["**Offline:** the app keeps working with no internet. Sales, stock and receipts are saved on the device — and every completed sale is also kept in the device's own backup journal until the server has it, so it survives a restart or a full device.","**Sync:** when the internet returns the dot turns green and every device catches up. Several tills can work at once — stock changes from each add up correctly.","**Daily Sales shows each sale's sync state:** ✓ synced, ⏳ not sent yet, 🔄 sending, ⚠ retrying — unsent sales are always listed, and are sent again automatically until the server has them. **🔎 Check for missing sales** compares this device, its journal, its printed receipts and the server for the day, and puts back anything missing.","**Older sales always show:** Daily Sales and Reports fetch any sale of the chosen days that is not on this device — kept on the server, in the server's archive of old history, or in this device's own archive — and list it with a **📦 history** mark. Reprint or void it as usual.","Days follow **Kenya time** on every device, whatever the device's own time zone; a device whose clock is wrong is told so, and its sales are dated by the correct time.","**If the dot stays black** with internet, wait a few seconds (it checks the server itself and recovers without a refresh). If it stays black, check the device’s connection.","**Backups:** ⚙️ Settings ▸ 🗄️ Backups. Your data is also stored on the server, so a lost phone does not lose your business — log in on another device.","**Importing from Excel/CSV:** on the Inventory tab tap **⬆️ Import from Excel/CSV**. A \"please wait\" bar shows while the file is read. Check the review list, then **Batch Commit**. Tap **⬇️ Download Excel/CSV** to export.","**More than one branch:** Settings ▸ 🏢 Branches links branches so items and cross-branch sales work."],"tips":["Use **Settings ▸ Install App ▸ 🔄 Re-download for Offline Use** after an update if the app ever fails to open offline."]},{"id":"trouble","icon":"🛟","title":"When something is wrong","steps":["**Printer does not print:** check paper and power, then Settings ▸ Hardware ▸ status. Switch it off and on — the app finds it again by itself. As a fallback use the system print dialog.","**\"Only 0 available\" when selling:** the item has no stock. Record it in Restock, or run a Stock Take.","**A sale is missing from Daily Sales:** tap **🔎 Check for missing sales** under the list. Pay-Later bills only count when paid; check Bills. In Aqua POS check the site selected at the top.","**The login window appears again:** just log in; it will not reappear over a running session.","**Forgot the password:** tap **Forgot the password?** on the login screen and use **Email me a reset link**.","**Something looks out of date on a device:** wait for the green dot, then reload the page once.","**Still stuck:** the Owner sees errors from every shop in the Owner Console ▸ Errors tab — tell your provider what you were doing and roughly when."]},{"id":"alltabs","icon":"🗂️","title":"Every tab at a glance","intro":"The tabs of Shop POS, in the order they appear:","tabs":[["Sales Counter","Where every sale is made: search or scan items, build the cart, take payment, print the receipt."],["Gas Refill","Gas cylinders: refills/exchanges, full cylinders, empties and accessories, with a Full/Empty count per size."],["Dashboard","Today at a glance: sales, money in by payment method, low stock and what needs attention."],["Inventory","Everything you stock: search, edit prices and quantities, import/export Excel, opening stock."],["Add New Items","Add items one by one, many at once (bulk), or from a photo of a list (Capture List)."],["Restock","Record stock you received: quantity and buying price; low-stock buttons add items for you."],["Orders","Purchase orders to suppliers: create, send on WhatsApp, mark in transit, receive (stock goes up on arrival)."],["Stock Take","Count the shelf, type the counts, and correct the system to what is really there."],["Reports","Generate sales, insights (busiest hours, best workers, trends), staff, stock, bills & debts, expenses & profit reports. Includes X/Z Reports and an automatic scheduled Daily Sales Report."],["Audit","A searchable, read-only timeline of who did what and when — sales, voids, discounts, stock changes, X/Z Reports and KRA/eTIMS classification changes."],["Store","A separate warehouse list (not your selling stock); take items from it into inventory."],["Barcode","Save, generate and print barcodes for your items."],["Tables & Rooms","Set up tables, rooms and utensils (used by tabs and orders)."],["Returned Goods","Customer returns and exchanges: refund, swap, faulty items."],["Deliveries","Delivery orders assigned to drivers: picked up, on route, delivered."],["Cross-Branch Sales","Sell an item that another of your branches holds."],["Daily Sales","Every sale for a day / week / month / range, by payment method, with printing."],["Stock Report","Stock movement over a period: opening, received, sold, closing, with values."],["Profits & Expenses","Record expenses and see gross and net profit for any period."],["Demand Trends","What sells most, and when: best sellers and slow movers."],["Bills","Pay-Later sales still owing: settle in full or in part, see closed bills."],["Debts","Money customers owe you outside of bills; record and settle."],["Trade Credits","Money owed between you and another business (I owe them / they owe me)."],["My Customers","Your customer list with purchase history and loyalty."],["Contracts","Wholesale contracts and their outstanding balances."],["Staff","Add staff, choose which tabs each can use, send invite links, see who is serving."],["Attendance","Staff clock in / out and hours worked."],["Settings","Business details, receipts, tax, hardware, security, backups and more."],["More","The rest of the tabs that do not fit on the screen."]]}]};</script>
