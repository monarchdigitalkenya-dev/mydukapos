<!-- GUIDE DATA (hotel) — generated by tools/build-guides.mjs; edit that file, not this one. -->
<script>window.__GUIDE_DATA = {"key":"hotel","title":"Hotel POS — User Guide","tagline":"Restaurants, bars, hotels and lodges — dishes, kitchen, tabs for tables and rooms, bills and reports.","module":"Hotel POS","version":"1.0.0","chapters":[{"id":"start","icon":"🚀","title":"Getting started","intro":"Hotel POS works on a phone, tablet or computer, online or offline. Everything below applies on every device you use.","steps":["Open the link your provider gave you (or the app icon, once installed). The very first time on a new business, tap **Sign Up**, type the business name, your name and a **password** — you become the **Admin**. After that, tap **Log In**.","On **Who’s logging in?** pick **Admin** (type the password) or a staff member (type their PIN). Staff only see the tabs the Admin gave them.","Look at the small dot at the top: **green** = online and saved, **orange** = syncing, **black** = offline. Offline is fine — keep selling; everything is saved on the device and sent when the internet is back.","Tabs run across the top. **☰ More** holds the ones that do not fit. Tap the **📖** button at the top any time to open this guide.","Install it like an app: **⚙️ Settings ▸ 📱 Install App ▸ Install / Add to Home Screen**. After the first load it opens with no internet at all."],"tips":["Do the first load of the app **while online** on every device — that is what lets it open offline later.","Settings ▸ Install App ▸ Version shows the version and the build on this device, so you can confirm an update reached it."]},{"id":"setup","icon":"🧭","title":"Set up your business (first 20 minutes)","intro":"Do these once, in this order, as the Admin:","steps":["**⚙️ Settings ▸ General** — business name, logo, phone and address. They print on every receipt.","**Settings ▸ 🧾 Receipt Settings** — header and footer lines, **🔠 Adjust receipt size** (paper 58 mm, 80 mm or custom, and how big the letters are), how many copies, whether to print the reference number and its barcode.","**Settings ▸ 🧾 Tax & Alerts** — VAT rates, and the **low-stock level** (items at or below it are flagged and offered as buttons when you restock).","**Settings ▸ 💳 Payment Gateway** — connect M-Pesa (Paystack, or Safaricom Daraja with your Till/Paybill) so you can send payment prompts to customers.","**Settings ▸ 🖨️ Hardware** — connect your receipt printer (see the **Printers & hardware** chapter).","Add your items and dishes (see **📦 Add New Items**), then **Settings ▸ 👥 Staff Accounts** to invite your staff.","**Settings ▸ 🗄️ Backups** — check that backups are on. **Settings ▸ 📥 Data Import** brings in data from another system."],"tips":["Settings ▸ 🔒 Security & Access lets the Admin lock tabs behind the management password.","Settings ▸ 🧾 eTIMS (KRA) is only for businesses registered for KRA eTIMS — leave it off otherwise."]},{"id":"items","icon":"🍽️","title":"Adding your menu, drinks and ingredients","intro":"The Hotel has three kinds of thing. Pick the kind at the top of **📦 Add New Items**:","steps":["**📦 Item** — something you stock and count: a bottle of soda, a packet of sugar. It has a quantity and goes down when sold.","**🧂 Ingredient** — a raw material used in recipes (flour, cooking oil). Counted in kg / litres; it goes down when a dish made from it is sold.","**🍽️ Dish** — a menu item the kitchen makes (Tea, Rice, Beef Stew). A plain dish just has a **price**. Tick **Made from ingredients** to add a recipe so its ingredients are used up as it sells. **Dishes always sell — they are never blocked by stock.**","**Upload a whole menu:** on **📋 Inventory** tap **⬆️ Import from Excel/CSV**. A sheet with names and prices (or a column **Item Type = Dish**) is added as Dishes — the review says \"Add these as: Dishes\". Re-importing a menu updates prices and turns items that were imported by mistake into Dishes.","**Photograph a menu:** **📸 Capture List**, tick **This is a menu / price list — add it as Dishes**, take the photo, check the prices, confirm."],"tips":["Give dishes a category (Hot Beverages, Meals…) — the import keeps it.","The Inventory **Used** column shows how much of each ingredient the sales have consumed."]},{"id":"sale","icon":"🛒","title":"Making a sale — walk-in customers","steps":["Open **🛒 Sales Counter**, search or tap dishes and drinks to build the cart, set quantities.","Choose the **payment method** (cash tendered is optional but recommended) and **Complete**. A **kitchen / bar ticket** prints for the order and the receipt preview opens.","The order ticket prints as a short slip in pure black, the same width as the receipt."]},{"id":"categories","icon":"🏷️","title":"Categories and importing a list","intro":"Every kind of stock (Items, Ingredients, Dishes, Services, Utensils, Bar) has its own categories. \"Drinks\" under Dishes and \"Drinks\" under Items are two separate categories, and stock with no category is just **Uncategorized** — nothing is ever lost.","steps":["On **📋 Inventory** tap **🗂️ Categories & assign**, choose the kind, then create, rename, switch on/off, reorder or delete categories. Deleting asks where the stock goes (another category of the same kind, or Uncategorized) — the stock itself is never deleted.","To change many at once, tick the records and choose a category under **Assign selected**. A category can only be given to stock of its own kind.","On the **🛒 Sales Counter** and in **🍽️ Service Orders**, the categories are chips above the pictures: tap one to filter, **All** to clear. Search works inside the chosen category and **Show more** loads the next page.","Tap **⬆️ Import** for an Excel or CSV list: pick the file, check the columns, read the preview, then confirm. In **All** mode each row needs a type (a Type column, your choice, or the built-in suggestion).","New categories in a file are created only when you agree. Similar names (Beverage / Beverages) are never merged automatically — you decide. For records that already exist choose **Skip**, **Update** or **Create new**; quantities and pictures are only changed if you tick that box.","Rows with a problem are listed (you can download them) and the rest are imported."],"tips":["Only staff with Inventory or Add New Items access can manage categories or import.","A category you turn off disappears from the chips, but its stock is still sold under All."]},{"id":"opentabs","icon":"🧾","title":"Tabs: tables, rooms and guests who pay later","steps":["Set up tables and rooms once in **🍽️🛏️ Tables & Rooms** (**Generate Tables**, **Generate Rooms**).","Open **🧾 Tabs** ▸ **➕ Open New Tab**, choose the table, room or guest.","Each time they order, add the items to the tab: **every round prints its own kitchen/bar ticket**. The tab keeps a running total.","When they leave, **settle the tab** (cash, M-Pesa, card, split) — it becomes a normal sale and receipt. A tab can also be put on **Bill (Pay Later)**.","Voiding a tab gives its dishes and ingredients back."]},{"id":"kitchen","icon":"🍳","title":"Kitchen tab: prepared, sold, left","steps":["Open **🍳 Kitchen**. Without logging anything, each dish just shows how many it **sold today**.","To track portions, log **Servings Prepared** when the kitchen cooks a batch (optionally a batch with a **shelf life** in days). The tab then shows **Prepared / Sold / Left**.","Sales use up the prepared portions; a void gives a portion back. Two tills’ sales and preparations add up on both."],"tips":["A finished batch is closed so old sales never eat a new batch."]},{"id":"split","icon":"👥","title":"Splitting a bill","intro":"Guests at one table can pay separately. Open the order, tap **Settle**, then:","steps":["**👥 Split by person** — tick what this person had (e.g. 1 burger, 1 beer). Their share of the service charge is added. Choose cash, M-Pesa or card and **Take this payment**. They get their own receipt.","**➗ Pay a share (amount)** — type what this person pays, or tap **÷ equally** to split the balance between a number of people.","Repeat for each person. The order shows **paid so far** and the **balance**. The last payment closes it, or **Settle** takes the rest — its receipt lists what was not paid yet, less the shares already taken.","Items already paid for can’t be removed or moved to another table. A voided part puts its amount back on the balance."]},{"id":"bar","icon":"🍺","title":"Shots, doubles, bottles and draught kegs","intro":"Everything is in **🍺 Bar & Kegs**. Packaged drinks (a 500 ml Tusker bottle, a can) stay ordinary items: 1 sold = 1 off.","steps":["**A bottle sold by the shot:** in **⚙️ Set up a drink**, pick the bottle (e.g. Johnnie Walker Black), its size (750 ml), and tick the servings with their size and price — **Shot 30 ml KES 350**, **Double 60 ml KES 650** — and the price of the whole **Bottle**. The business default shot size is set once (e.g. 30 ml); a product can use its own (40 ml, 50 ml).","**Selling:** on the **🛒 Sales Counter** the bartender taps **SHOT**, **DOUBLE** or **BOTTLE** under the drink. Nobody types millilitres. A shot takes 30 ml from the open bottle; a new bottle is opened by itself; a whole bottle is always a sealed one. The till never sells more than is there (\"Only 20 ml left\").","**Stock:** each bottle shows **full bottles · 1 open (450 ml) · ml in all**. In **📋 Stock Take** count the full bottles and the ml in the open one — an open bottle is never counted as full.","**A keg:** set up the keg product (e.g. Tusker Lager Keg, **50 L**, low alert at **5 L**) with its servings (**300 ml**, **500 ml**, **1 L**) and prices. Receive kegs in **📥 Restock** (they are the sealed kegs in the store).","**Take a keg from the store** and connect it to a tap. Each keg has its own number, tap, status (Full, Active, Low, Empty, Disconnected, Closed, Spoiled) and history. Selling 500 ml takes 500 ml from the oldest active keg; when it runs dry the next full keg is connected by itself (you can switch that off).","**Replace** a keg (the old one is closed at what is left, written off with its history kept, and the next one goes on the same tap), record **💧 Wastage** (spillage, foam, leakage… — a reason is required), **📏 Measure** what is really in a keg, **Close** or mark **Spoiled**.","**🧮 Keg reconciliation:** opening − sold − wastage = expected; measured − expected = **variance**. **📈 Hospitality Reports** also show beverage sales by serving, shots, and kegs.","Keg and shot drinks work everywhere: tables, bar orders, room service, charge to a room, split bills, QR orders (only when there is stock). Two bartenders on two tills — even offline — always add up.","Only managers, supervisors and storekeepers (**bar.manage**) can set up drinks, change sizes or prices, take / replace / close kegs, record wastage or measure. Bartenders sell and see the kegs. Every action is in the **📜 Bar audit**."]},{"id":"levels","icon":"⭐","title":"Loyalty member levels","steps":["In **⚙️ Settings ▸ Loyalty**, under the spend brackets, add **member levels** (e.g. Silver from KES 20,000, Gold from KES 100,000) with a **token multiplier** and **perks**, and the period that counts (365 days, or 0 for ever).","A customer’s level comes from what they spent in that period — worked out from the sales, so every till agrees. Their sales earn tokens × the multiplier; reaching a level is announced.","When you settle an order for a member, their level and perks are shown. Paying an order (tab) now earns tokens too. Any discount stays your decision."]},{"id":"staffsessions","icon":"👤","title":"Staff sessions (the server checks who is working)","steps":["Staff still sign in with their PIN, even offline. When the device is online, the same PIN also starts a **server session** for that person.","Every new sale is signed with the serving staff member’s session, and the server checks it. **📈 Hospitality Reports ▸ Who made each sale** shows confirmed, waiting, not signed and ⚠ flagged sales (e.g. a waiter who may not take payments, or a sale changed after it was made). No sale is ever refused or hidden.","Signed in offline? The sales are signed once the device is back online (covering up to a day).","**⚙️ Settings ▸ 🔐 Devices & Security ▸ Staff sessions required** (Admin or a manager): the server then refuses QR codes, the online menu, bookings and M-Pesa checks without a confirmed staff member, and QR codes / the menu need a supervisor. Selling is never blocked."]},{"id":"closed","icon":"🧾","title":"Bills for hotels","steps":["Rooms and corporate customers often pay later: use **Bill (Pay Later)** or leave the tab open.","Settle from **🧾 Bills**. Paid bills stay under **Show closed bills** so you can look back."]},{"id":"payments","icon":"💳","title":"Taking payment: cash, M-Pesa, card, split, Pay Later","intro":"Choose the payment method under the cart, then complete the sale.","steps":["**Cash** — type the amount the customer gave and the change shows. In the Hotel the amount is **optional but recommended**: left empty it means the exact total.","**M-Pesa** — enter the customer’s number and tap **Send M-Pesa Prompt** (the customer approves on their phone), or type the M-Pesa code if they paid to your till. The sale completes once it is confirmed.","**Card** — take the card payment on your machine, optionally type the slip reference, and complete.","**Split** — part cash, part M-Pesa: type both amounts. They must add up to the total exactly, or the sale is refused.","**Bill (Pay Later)** — for customers who pay later: type the customer’s name (and phone), optionally an amount paid now. The sale becomes a **bill** that you settle later from the **Bills** tab; it only counts in Daily Sales as money is paid."],"sections":[{"title":"Hold a sale (customer not ready to pay)","steps":["Build the customer’s cart, then tap **⏸️ Hold sale**. The cart clears so you can serve the next person; **one** sale can be held at a time.","When the customer is ready, finish the sale you are on, then tap the **held sale** button that appears where Hold sale was — the held cart comes back exactly as it was."]},{"title":"Record a past sale (forgot to record it)","steps":["On the Sales Counter tap **Record a Past Sale**, pick the item, date and time, quantity, price and payment method (cash, M-Pesa, card, split or Bill).","It is saved on that date and takes the stock off, like a normal sale."]}],"tips":["Nothing is deducted from stock while a sale is only being built or held.","A wrong sale can be **voided** from Daily Sales (stock comes back)."]},{"id":"receipts","icon":"🧾","title":"Receipts: print, share, reprint","steps":["When a sale completes a **receipt preview** opens. Tap **🖨️ Print** — it prints **once**, and the preview closes so it cannot be printed twice by accident.","The sale is **saved before the receipt appears** — the preview says \"✓ Sale saved\". **Cancel / Save** only closes the screen: it never cancels the sale (to reverse one, **void** it in Daily Sales).","Every receipt of the day carries a **Customer number** (Customer 1, 2, 3…) just above the reference number. It starts again at 1 each day, so the last receipt of the day tells you how many customers you served.","To print the same receipt again later, open it from **Daily Sales** and tap Print — the app asks \"already printed at 14:32 — print another copy?\" so copies are always deliberate.","**📤 Share** sends the receipt as a **PDF** (WhatsApp shows it as a document). On a phone it opens your apps. On computers and some browsers that cannot hand a file to another app, the PDF is **saved to Downloads** instead — attach it in WhatsApp or email yourself.","**⬇️ Download** always saves the PDF."],"tips":["If the print fails (printer off, paper out) the preview stays open so you can try again — the sale is already saved.","Settings ▸ 🧾 Receipt Settings controls what appears on the receipt."]},{"id":"bills","icon":"📒","title":"Bills (Pay Later) and Debts","steps":["A **Bill (Pay Later)** sale appears in the **🧾 Bills** tab with what is owed. Tap **Settle** to take a full or part payment (cash, M-Pesa, card or split). A partial payment reduces the balance; the bill stays open.","When a bill is paid in full it becomes **closed** and moves out of the open list. Tick **Show closed bills** to see paid bills too (closed bills are tidied away after 90 days).","**Save (no receipt)** in the settle window records the payment without printing a receipt.","**📒 Debts** is for money customers owe you outside a bill — add a debt with the customer’s name and amount, and settle it in parts or in full.","The Sales Counter has a small **Bills** panel for staff: green = money they collected on bills, red = still owed."],"tips":["Pay-Later sales are not counted as sales until money is paid on them."]},{"id":"stock","icon":"📥","title":"Restock, Orders and Stock Take","sections":[{"title":"📥 Restock: record stock you received","steps":["Open **📥 Restock**. Tap a **⚠️ low-stock button** to add that item to the form (with its last buying price), or start typing a name — a drop-down of your items and dishes appears; pick one to fill the code, unit and buying price, or keep typing a new name.","Enter the quantity and the buying price, then save. Stock goes up and an expense is logged automatically."]},{"title":"🛍️ Orders: order from suppliers","steps":["Open **Orders** ▸ **New Order**. Tap low-stock buttons to add what is running out, or type names (same drop-down). Enter quantities and prices and choose or type the supplier.","Tap **💬 Save & send on WhatsApp** to save the order and open WhatsApp addressed to the supplier with the order written out (their number is asked once and remembered). Or **Save Order** now and press **💬 WhatsApp** on it later.","Mark it **In Transit** when the supplier dispatches, and **Arrived** when the goods come — that adds the stock."]},{"title":"📋 Stock Take: correct the system to the shelf","steps":["Open **Stock Take**, count each item on the shelf and type the number next to it. Only items you type a count for are touched.","The screen shows each difference and its value at cost. Tap **✔ Update stock to my counts** — every change is recorded as a \"Stock take\" adjustment."]}],"tips":["Do a stock take after a stock delivery day or at the end of the month.","↩️ **Returned Goods** puts returned items back on the shelf (or into the faulty register) and can refund the customer."]},{"id":"reports","icon":"📊","title":"Reports and Daily Sales","steps":["**🧾 Daily Sales** lists every sale for Today, a Week, a Month or a Custom range, filtered by payment method. Print the day’s report from there, or void a wrong sale.","**📦 Stock Report** shows stock movement (opening, received, sold, closing) with values at cost and retail.","**💰 Profits & Expenses** — add expenses (rent, fuel, wages…) and see gross and net profit.","**📊 Reports** is the one place to generate everything: pick a **period** (Today … Last 90 days … Custom), then a report."],"sections":[{"title":"The reports in 📊 Reports","points":["**Sales** — total, number of sales, average sale, by payment method and the items sold, best first.","**Business insights** — busiest hour, best-earning hour, best day of the week, best worker; charts of sales by hour and by weekday; and a **trend line** you can switch between **daily, weekly (12 weeks) and monthly (12 months)**.","**Staff performance** — sales, average sale, share and sales per hour worked for each person.","**Stock** — stock value at cost and retail, low stock, out of stock and items that did not sell in the period.","**Bills & debts** — who owes what, oldest first, with ageing.","**Expenses & profit** — sales, cost of goods, gross profit, expenses by category and net profit."]}],"tips":["Every report can be **🖨️ printed / saved as PDF** or **⬇️ downloaded for Excel (CSV)**.","**📊 Dashboard** gives today’s figures the moment you open the app."]},{"id":"people","icon":"👥","title":"Staff, access and security","steps":["Open **⚙️ Settings ▸ 👥 Staff Accounts** (or the **👥 Staff** tab) and add a staff member’s name. Tick the tabs they may use — the Sales Counter too; a staff member sees only the tabs ticked for them. Tap **Generate invite link**.","Send the link to them. They open it, choose a **PIN** (4+ characters) and they are in — no shop password needed. The link then turns into their personal login link: they should bookmark it.","A staff member is listed once: a double tap on \"Create my account\" cannot make two copies.","**🕐 Attendance** — staff clock in and out; hours worked show in Reports ▸ Staff performance.","**💼 Payroll** — add staff and their documents, run payroll (review ▸ approve ▸ pay) and give out payslips. Needs internet; a paid or approved run is never edited — corrections are a reversal run.","**Settings ▸ 🔒 Security & Access** — change the password, lock tabs behind the management password, and use fingerprint where the device supports it.","**Settings ▸ 🔐 Admin Activity Log** shows what was changed and by whom.","**⬇️ Sync to this device** (Settings ▸ 🔐 Devices & Security) sends this device's unsent sales first, then fetches everything the shop has on the server — step by step, with nothing deleted or duplicated.","**Settings ▸ 🔐 Devices & security** lists every device that syncs your shop (its till number, app release and last sync). Tap **🔒 Only paired devices may sync** so that knowing your shop link is no longer enough to see or change your data. Your devices pair themselves; a new one needs the shop password once, or a **6-digit pairing code** made here (so staff never need the password). Revoke a lost phone from the same list. Signing in and selling always work offline either way.","**👤 My Customers** keeps your customers and their purchases; **🎟️ Loyalty Tokens** (Settings) rewards repeat customers where enabled."],"tips":["To remove a staff member, remove them under Staff Accounts — their old sales stay in the records.","If someone forgets the Admin password, use **Forgot it? Email me a reset link** on the login screen (needs the recovery email set up)."]},{"id":"hardware","icon":"🖨️","title":"Printers & hardware","intro":"Open **⚙️ Settings ▸ 🖨️ Hardware** (or tap the small printer icon at the top). There are three ways to print:","sections":[{"title":"1. System print dialog (works with any installed printer)","steps":["Set **Printer mode** to **System print dialog**.","Print a receipt: the device’s print window opens — choose your receipt printer once. The receipt prints on a slip only as long as its lines (paper is not wasted).","Browsers never allow silent printing, so this mode always shows that window. Use Bluetooth or USB to avoid it."]},{"title":"2. USB thermal printer (computer or Android)","steps":["Plug the printer in and switch it on.","Set **Printer mode** to **USB**, tap **Connect USB Printer**, choose your printer and allow access.","From then on the app **reconnects by itself** whenever the printer is switched off and on, unplugged and replugged, or the app is reopened — it keeps checking every few seconds and prints the moment the printer is back. You do not go back to Settings."]},{"title":"3. Bluetooth thermal printer (phones and tablets)","steps":["Switch the printer on and pair it in the phone’s Bluetooth settings if it asks.","Set **Printer mode** to **Bluetooth**, tap **Connect Bluetooth Printer** and pick it from the list (once).","After a power cut or the printer going out of range, the app reopens the same printer by itself (no chooser). Some browsers cannot reopen a remembered Bluetooth printer after the page reloads — the screen then says **Tap Connect once**."]},{"title":"Paper, copies and the cash drawer","steps":["**Receipt Settings ▸ 🔠 Adjust receipt size** opens a window where you choose the paper (58 mm, 80 mm or custom) and the letter size in points (7 is the standard; try 9, 10, 11 if receipts look too small). A sample receipt with items changes as you tap **−** or **+**; press **🖨️ Print test receipt** to check it on your printer, then **Save** — that is how every receipt will print. **Cancel** throws the changes away, **Reset to standard** goes back to 7 pt. The number of copies is set in Receipt Settings too.","Each till can have a different printer: under **THIS device's printer paper** choose 58 mm or 80 mm for the printer on this device (or tap **58 mm / 80 mm** at the top of any receipt). **If words break or numbers jump to the next line, the printer is 58 mm on an 80 mm setting — choose 58 mm.** The receipt preview is exactly what will print.","**📏 Print a width test** (USB / Bluetooth) prints a 32- and a 48-character line: if the 48 one breaks in two, the printer is 58 mm.","The **cash drawer** plugs into the **printer** (RJ11/RJ12 port), not the computer; turn on \"open drawer on print\" in Hardware settings.","To check paper width and the drawer, print a small sale receipt, or reprint one from Daily Sales."]},{"title":"Barcode scanners","steps":["A USB or Bluetooth **scanner** works like a keyboard: click the search box on the Sales Counter and scan.","The 📷 button next to search scans with the phone camera."]}],"tips":["Printing waits up to 4 seconds for a printer that has just been switched on before saying it is not connected.","If a print fails half-way the receipt is **not** sent again automatically (so you never get a doubled half-receipt) — reprint from Daily Sales."]},{"id":"offline","icon":"📶","title":"Offline, sync, backups and importing data","steps":["**Offline:** the app keeps working with no internet. Sales, stock and receipts are saved on the device — and every completed sale is also kept in the device's own backup journal until the server has it, so it survives a restart or a full device.","**Sync:** when the internet returns the dot turns green and every device catches up. Several tills can work at once — stock changes from each add up correctly.","**Daily Sales shows each sale's sync state:** ✓ synced, ⏳ not sent yet, 🔄 sending, ⚠ retrying — unsent sales are always listed, and are sent again automatically until the server has them. **🔎 Check for missing sales** compares this device, its journal, its printed receipts and the server for the day, and puts back anything missing.","**Older sales always show:** Daily Sales and Reports fetch any sale of the chosen days that is not on this device — kept on the server, in the server's archive of old history, or in this device's own archive — and list it with a **📦 history** mark. Reprint or void it as usual.","Days follow **Kenya time** on every device, whatever the device's own time zone; a device whose clock is wrong is told so, and its sales are dated by the correct time.","**If the dot stays black** with internet, wait a few seconds (it checks the server itself and recovers without a refresh). If it stays black, check the device’s connection.","**Backups:** ⚙️ Settings ▸ 🗄️ Backups. Your data is also stored on the server, so a lost phone does not lose your business — log in on another device.","**Importing from Excel/CSV:** on the Inventory tab tap **⬆️ Import from Excel/CSV**. A \"please wait\" bar shows while the file is read. Check the review list, then **Batch Commit**. Tap **⬇️ Download Excel/CSV** to export.","**More than one branch:** Settings ▸ 🏢 Branches links branches so items and cross-branch sales work."],"tips":["Use **Settings ▸ Install App ▸ 🔄 Re-download for Offline Use** after an update if the app ever fails to open offline."]},{"id":"trouble","icon":"🛟","title":"When something is wrong","steps":["**Printer does not print:** check paper and power, then Settings ▸ Hardware ▸ status. Switch it off and on — the app finds it again by itself. As a fallback use the system print dialog.","**\"Only 0 available\" when selling:** the item has no stock. Record it in Restock, or run a Stock Take.","**A sale is missing from Daily Sales:** tap **🔎 Check for missing sales** under the list. Pay-Later bills only count when paid; check Bills. In Aqua POS check the site selected at the top.","**The login window appears again:** just log in; it will not reappear over a running session.","**Forgot the password:** tap **Forgot the password?** on the login screen and use **Email me a reset link**.","**Something looks out of date on a device:** wait for the green dot, then reload the page once.","**Still stuck:** the Owner sees errors from every shop in the Owner Console ▸ Errors tab — tell your provider what you were doing and roughly when."]},{"id":"alltabs","icon":"🗂️","title":"Every tab at a glance","intro":"The tabs of Hotel POS, in the order they appear:","tabs":[["Sales Counter","Where every sale is made: search or scan items, build the cart, take payment, print the receipt."],["Kitchen","Dishes prepared and sold today: log portions prepared, see sold and left, shelf life."],["Tabs","Open tabs for a table, room or guest: add rounds of orders over time, settle at the end."],["Service Orders","Waiters take orders here — no Sales Counter needed: pick the table or room (and a customer name if you like), tap the items, then POST ORDER: the kitchen and the bar each get their slip (no prices). Tap 📋 Orders to see your own orders: UPDATE ORDER to add, remove or exchange items (only the change prints), SETTLE to print the customer's bill with prices, the total and the shop's payment details — the cashier takes the payment. Cashiers and supervisors also see QR orders, move / split / merge and the station settings here."],["Kitchen & Bar Display","The screen for the kitchen, the bar, the bakery… each sees only its own items: New → Accepted → Preparing → Ready → Served, with the waiting time, late orders in red and rush orders first. Waiters are told when their items are ready."],["Bar & Kegs","Shots, doubles and bottles from open bottles; draught kegs (take from the store, connect, replace, wastage, measure), low-keg alerts, keg reconciliation and the bar audit."],["Facilities","Pool, pool / snooker tables, cabanas, conference rooms…: start, pause and end timed sessions, sell pool passes (with capacity and expiry), and book any facility without double booking. Time and passes go on the customer’s one bill with their food and drinks."],["Hotel","Rooms at a glance for the next 14 days, reservations (never sold twice), arrivals and check-in, housekeeping (dirty → cleaning → clean → inspected), service requests (towels, cot, decorations…) and room types with their nightly rates."],["Custom Orders & Events","Custom cakes, special meals and platters, catering and events: take the details (size, flavour, message, allergies, guests, menu…) and reference pictures, quote, record the customer’s approval, take the deposit (a real payment with a receipt), schedule, produce, quality-check, tell the customer it is ready, and collect the balance. Events can book their venue; packages (e.g. a family pool package) sell food, drinks and pool access as one priced item."],["Hospitality Reports","For a day or a period: sales, payments (cash, M-Pesa — with any not verified — card), what is still outstanding and the estimated profit, kept apart; by outlet, order type, source, waiter and table; top products and drinks; every order change with its reason; hotel occupancy and room revenue; pool passes and busiest hour; pool-table hours and use; custom orders and their balances."],["Dashboard","Today at a glance: sales, money in by payment method, low stock and what needs attention."],["Inventory","Everything you stock: search, edit prices and quantities, import/export Excel, opening stock."],["Add New Items","Add items one by one, many at once (bulk), or from a photo of a list (Capture List)."],["Restock","Record stock you received: quantity and buying price; low-stock buttons add items for you."],["Orders","Purchase orders to suppliers: create, send on WhatsApp, mark in transit, receive (stock goes up on arrival)."],["Stock Take","Count the shelf, type the counts, and correct the system to what is really there."],["Reports","Generate sales, insights (busiest hours, best workers, trends), staff, stock, bills & debts, expenses & profit reports. Includes X/Z Reports and an automatic scheduled Daily Sales Report."],["Audit","A searchable, read-only timeline of who did what and when — sales, voids, discounts, stock changes, X/Z Reports and KRA/eTIMS classification changes."],["Store","A separate warehouse list (not your selling stock); take items from it into inventory."],["Barcode","Save, generate and print barcodes for your items."],["Tables & Rooms","Set up your tables, rooms and utensils (generate Table 01… in one go)."],["Returned Goods","Customer returns and exchanges: refund, swap, faulty items."],["Deliveries","Delivery orders assigned to drivers: picked up, on route, delivered."],["Cross-Branch Sales","Sell an item that another of your branches holds."],["Daily Sales","Every sale for a day / week / month / range, by payment method, with printing."],["Stock Report","Stock movement over a period: opening, received, sold, closing, with values."],["Profits & Expenses","Record expenses and see gross and net profit for any period."],["Demand Trends","What sells most, and when: best sellers and slow movers."],["Bills","Pay-Later sales still owing: settle in full or in part, see closed bills."],["Debts","Money customers owe you outside of bills; record and settle."],["Trade Credits","Money owed between you and another business (I owe them / they owe me)."],["My Customers","Your customer list with purchase history and loyalty."],["Contracts","Wholesale contracts and their outstanding balances."],["Staff","Add staff, choose which tabs each can use, send invite links, see who is serving."],["Attendance","Staff clock in / out and hours worked."],["Payroll","Create Payroll: staff register and documents, pay runs, payslips. Admin / payroll rights only; a worker sees just their own payslips. Needs internet and a staff PIN sign-in."],["Settings","Business details, receipts, tax, hardware, security, backups and more."],["More","The rest of the tabs that do not fit on the screen."]]}]};</script>
