<!-- GUIDE DATA (water) — generated by tools/build-guides.mjs; edit that file, not this one. -->
<script>window.__GUIDE_DATA = {"key":"water","title":"Aqua POS — User Guide","tagline":"Water refill stations, bottled-water producers and distributors — refills, sealed bottles, bales, bulk tanks, production and deliveries.","module":"Aqua POS","version":"1.0.0","chapters":[{"id":"start","icon":"🚀","title":"Getting started","intro":"Aqua POS works on a phone, tablet or computer, online or offline. Everything below applies on every device you use.","steps":["Open the link your provider gave you (or the app icon, once installed). The very first time on a new business, tap **Sign Up**, type the business name, your name and a **password** — you become the **Admin**. After that, tap **Log In**.","On **Who’s logging in?** pick **Admin** (type the password) or a staff member (type their PIN). Staff only see the tabs the Admin gave them.","Look at the small dot at the top: **green** = online and saved, **orange** = syncing, **black** = offline. Offline is fine — keep selling; everything is saved on the device and sent when the internet is back.","Tabs run across the top. **☰ More** holds the ones that do not fit. Tap the **📖** button at the top any time to open this guide.","Install it like an app: **⚙️ Settings ▸ 📱 Install App ▸ Install / Add to Home Screen**. After the first load it opens with no internet at all."],"tips":["Do the first load of the app **while online** on every device — that is what lets it open offline later.","Settings ▸ Install App ▸ Version shows the version and the build on this device, so you can confirm an update reached it."]},{"id":"setup","icon":"🧭","title":"Set up your business (first 20 minutes)","intro":"Do these once, in this order, as the Admin:","steps":["**⚙️ Settings ▸ General** — business name, logo, phone and address. They print on every receipt.","**Settings ▸ 🧾 Receipt Settings** — header and footer lines, **🔠 Adjust receipt size** (paper 58 mm, 80 mm or custom, and how big the letters are), how many copies, whether to print the reference number and its barcode.","**Settings ▸ 🧾 Tax & Alerts** — VAT rates, and the **low-stock level** (items at or below it are flagged and offered as buttons when you restock).","**Settings ▸ 💳 Payment Gateway** — connect M-Pesa (Safaricom Daraja with your Till/Paybill, KCB Buni, Paywave Express, Pesapal or Co-op Bank) so you can send payment prompts to customers.","**Settings ▸ 🖨️ Hardware** — connect your receipt printer (see the **Printers & hardware** chapter).","Add your products and materials (see **📋 Inventory**), then **Settings ▸ 👥 Staff Accounts** to invite your staff.","**Settings ▸ 🗄️ Backups** — check that backups are on. **Settings ▸ 📥 Data Import** brings in data from another system."],"tips":["Settings ▸ 🔒 Security & Access lets the Admin lock tabs behind the management password.","Settings ▸ 🧾 eTIMS (KRA) is only for businesses registered for KRA eTIMS — leave it off otherwise."]},{"id":"sale","icon":"🧾","title":"Making a sale","steps":["Open **🧾 Sales Counter**. Use the filters **🧺 All / 🔄 Refill / 🍼 Sealed Bottles / 🚰 Dispensers & Accessories / 📦 Bales (Cases)** or search.","Tap a **refill size** to add it, or use **Custom Refill — Litres Needed** for any volume. Tap sealed bottles, dispensers or bales to add them.","Choose **🚶 Walk-In** or **🚚 Delivery** (address, zone, fee, driver). For delivery pick **💰 Paid Now** or **🧾 Pay on Delivery**.","Choose the payment method (see **Taking payment**) and **Complete**. Water is drawn from the site’s **bulk tank**; the app warns you if the tank is short."]},{"id":"sites","icon":"🏭","title":"Sites: Shop and Production","steps":["Aqua POS can run more than one **site** — for example the **Shop** and the **Production** plant. Pick the site you are working at from the switcher at the top.","Each site has **its own bulk tanks, refill sizes/prices and stock** — water at one site is never drawn down by a sale at another. **Both sites** is a way of *looking* at the reports; sales made while it is selected belong to the Shop."]},{"id":"sizes","icon":"💧","title":"Refill sizes and prices","steps":["Open **⚙️ Settings ▸ General**. Set the **Price per Litre (KES)**; every size on **Auto (× 1L rate)** follows it (a 20 L refill is 20 × the litre price).","Untick **Auto** on a size to type its own price. Tap **+ Add a Size Not Listed** to add a new size (a label, its volume in **millilitres** — 2.5 L is 2500 — and a price). It appears in the list and on the counter at once; a duplicate size is refused.","Set the VAT category per size, and the 🧩 **Recipe** (materials used per refill) so materials are tracked."]},{"id":"tank","icon":"🚰","title":"Bulk tanks","steps":["Open **🚰 Bulk Tank**. **+ Add Tank** for each tank at the site. When a water delivery arrives choose the tank, type the **litres added** (and cost and supplier if you like) ▸ **💾 Record Tank Refill**.","Every refill sale reduces the tank; **📜 Tank Refill History** lists all additions and corrections. A tank must be empty before you remove it, and each site keeps at least one."]},{"id":"prod","icon":"🏭","title":"Production","steps":["Open **🏭 Production**. Pick the item and how many you produced ▸ **💾 Record Production**; its saved **recipe** (set in Inventory ▸ 🏭 Recipe) deducts the materials and adds the finished stock.","For multi-stage products use **🧙 Multi-Step Production Wizard**. **Factory Floor Stock**, **Production History** and **Dispatch History** follow what was made and sent out."]},{"id":"bulk","icon":"📅","title":"Bulk orders","steps":["Open **📅 Bulk Orders**. Type the client, business, phone, **delivery date**, address, **deposit paid** and notes, add the products and quantities and **💾 Save Booking**.","On the delivery day fulfil the order; the deposit is counted against the total."]},{"id":"stocktakew","icon":"📋","title":"Stock Take (per site)","steps":["Pick the site you are counting at the top (a stock take counts **one site at a time**), then open **📋 Stock Take**. It lists that site’s products (a bottle-tracked bale is counted in **bottles**), its **tank litres** and its **materials**.","Type what you actually counted next to each line — lines left blank are not touched. Tap **💾 Update** on one line, or **✔ Update stock to my counts** for all of them.","Each change is recorded once as a **count** (\"there are 12\"), not as a +/−, so refreshing, going offline or opening another device can never apply it again. **Recent stock takes** shows Was / Counted / Now for every device, with ✓ applied or ⏳ waiting to sync."]},{"id":"stockw","icon":"📥","title":"Inventory and restocking","steps":["**📋 Inventory** holds bottled products, bales, accessories, materials and refill prices. Edit stock and prices by tapping an item.","**📥 Restocking** tops up a material or product (decimals are fine, e.g. 0.5 bale, 10.5 litres) — record the supplier and cost; **⬆️ Import Excel/CSV** loads a whole list; history shows below."]},{"id":"payments","icon":"💳","title":"Taking payment","steps":["**Cash** — type the amount the customer gave; the change shows.","**M-Pesa** — enter the customer’s number and tap **Send M-Pesa Prompt**, or type the M-Pesa code if they paid to your till.","**Split** — part cash, part M-Pesa; the two amounts must add up to the total.","**Bill (Pay Later)** — the customer’s name and phone; the sale waits in **🧾 Bills** until you **Settle** it.","**Delivery orders:** choose **💰 Paid Now** or **🧾 Pay on Delivery**; the driver collects and you settle from Bills or Deliveries."],"sections":[{"title":"Hold a sale","steps":["Tap **⏸️ Hold sale** to park the customer’s cart while you serve someone else (one held sale at a time); bring it back when they are ready."]}]},{"id":"receipts","icon":"🧾","title":"Receipts: print, share, reprint","steps":["When a sale completes a **receipt preview** opens. Tap **🖨️ Print** — it prints **once**, and the preview closes so it cannot be printed twice by accident.","The sale is **saved before the receipt appears** — the preview says \"✓ Sale saved\". **Cancel / Save** only closes the screen: it never cancels the sale (to reverse one, **void** it in Daily Sales).","Every receipt of the day carries a **Customer number** (Customer 1, 2, 3…) just above the reference number. It starts again at 1 each day, so the last receipt of the day tells you how many customers you served.","To print the same receipt again later, open it from **Daily Sales** and tap Print — the app asks \"already printed at 14:32 — print another copy?\" so copies are always deliberate.","**📤 Share** sends the receipt as a **PDF** (WhatsApp shows it as a document). On a phone it opens your apps. On computers and some browsers that cannot hand a file to another app, the PDF is **saved to Downloads** instead — attach it in WhatsApp or email yourself.","**⬇️ Download** always saves the PDF."],"tips":["If the print fails (printer off, paper out) the preview stays open so you can try again — the sale is already saved.","Settings ▸ 🧾 Receipt Settings controls what appears on the receipt."]},{"id":"bills","icon":"📒","title":"Bills, Pay on Delivery and Debts","steps":["**Pay Later / Pay on Delivery** sales wait in **🧾 Bills**. Tap **Settle** when the money is collected (full or part).","**📒 Debts** records other money customers owe.","A settled bill stays visible under **Show closed bills**."],"tips":["Pay-Later sales are not counted as sales until money is paid on them."]},{"id":"stock","icon":"📥","title":"Restocking and stock control","steps":["**📥 Restocking:** choose the material or product (or type a new name), type the quantity (decimals allowed) and the cost ▸ **💾 Record Restock**. Use **⬆️ Import Excel/CSV** for a list.","**📋 Inventory:** tap any item to correct its quantity or price. Materials used by refills and production are deducted automatically from their recipes.","**📦 Stock Report** shows movement for the period; **↩️ Returned Goods** puts returned bottles/bales back or records faulty ones."],"tips":["Check the **🚰 Bulk Tank** level regularly — refill sales draw from it."]},{"id":"change","icon":"🛠️","title":"Change things later, rename and search","steps":["**🔎 Search everything:** tap the **🔎** in the top bar (or press **Ctrl+K**) and type a name, code, barcode, phone number, receipt number or screen name. Items, services, customers, staff, suppliers, recent sales and every screen of the app are searched together. Use ↑ ↓ and **Enter**, or tap a result: an item can be **added to the sale** or **edited**, anything else opens the screen that holds it.","**Staff names:** **Settings ▸ Staff** (or the Staff tab) has a **✏️ Rename** button on every person. Their login link, PIN, roles and history stay the same."],"tips":["Every change is saved at once and reaches your other devices.","Searching never changes anything."]},{"id":"reports","icon":"📊","title":"Reports and Daily Sales","steps":["**📊 Daily Sales** lists every sale for Today, a Week, a Month or a Custom range, by payment method, for the **site you are in**. Print the report from there; a wrong sale can be voided (stock and tank litres come back).","On the same tab, **📋 X Report** gives an interim reading of today’s trading (transactions, sales, tax breakdown) that can be generated any number of times without closing anything; **🔒 Z Report** shows the same totals and lets the Admin **finalize** the trading day once, behind the management password.","**🔍 Audit** is a searchable, read-only timeline of sales, voids, discounts, stock changes, X/Z Reports and KRA/eTIMS classification changes — who did what, and when.","**📦 Stock Report** — movement of products and materials.","**💰 Profits & Expenses** — add expenses (fuel, wages, electricity…) and see profit.","**📈 Demand Trends** — which refill sizes and products sell most, and when.","**📊 Dashboard** — today’s figures the moment you open the app."]},{"id":"people","icon":"👥","title":"Staff, access and security","steps":["Open **⚙️ Settings ▸ 👥 Staff Accounts** (or the **👥 Staff** tab) and add a staff member’s name. Tick the tabs they may use — the Sales Counter too; a staff member sees only the tabs ticked for them. Tap **Generate invite link**.","Send the link to them. They open it, choose a **PIN** (4+ characters) and they are in — no shop password needed. The link then turns into their personal login link: they should bookmark it.","A staff member is listed once: a double tap on \"Create my account\" cannot make two copies.","**🕐 Attendance** — staff clock in and out; hours worked show in Reports ▸ Staff performance.","**💼 Payroll** — add staff and their documents, run payroll (review ▸ approve ▸ pay) and give out payslips. Needs internet; a paid or approved run is never edited — corrections are a reversal run.","**Settings ▸ 🔒 Security & Access** — change the password, lock tabs behind the management password, and use fingerprint where the device supports it.","**Settings ▸ 🔐 Admin Activity Log** shows what was changed and by whom.","**⬇️ Sync to this device** (Settings ▸ 🔐 Devices & Security) sends this device's unsent sales first, then fetches everything the shop has on the server — step by step, with nothing deleted or duplicated.","**Settings ▸ 🔐 Devices & security** lists every device that syncs your shop (its till number, app release and last sync). Tap **🔒 Only paired devices may sync** so that knowing your shop link is no longer enough to see or change your data. Your devices pair themselves; a new one needs the shop password once, or a **6-digit pairing code** made here (so staff never need the password). Revoke a lost phone from the same list. Signing in and selling always work offline either way.","**👤 My Customers** keeps your customers and their purchases; **🎟️ Loyalty Tokens** (Settings) rewards repeat customers where enabled."],"tips":["To remove a staff member, remove them under Staff Accounts — their old sales stay in the records.","If someone forgets the Admin password, use **Forgot it? Email me a reset link** on the login screen (needs the recovery email set up)."]},{"id":"hardware","icon":"🖨️","title":"Printers & hardware","intro":"Open **⚙️ Settings ▸ 🖨️ Hardware** (or tap the small printer icon at the top). There are three ways to print:","sections":[{"title":"1. System print dialog (works with any installed printer)","steps":["Set **Printer mode** to **System print dialog**.","Print a receipt: the device’s print window opens — choose your receipt printer once. The receipt prints on a slip only as long as its lines (paper is not wasted).","Browsers never allow silent printing, so this mode always shows that window. Use Bluetooth or USB to avoid it."]},{"title":"2. USB thermal printer (computer or Android)","steps":["Plug the printer in and switch it on.","Set **Printer mode** to **USB**, tap **Connect USB Printer**, choose your printer and allow access.","From then on the app **reconnects by itself** whenever the printer is switched off and on, unplugged and replugged, or the app is reopened — it keeps checking every few seconds and prints the moment the printer is back. You do not go back to Settings."]},{"title":"3. Bluetooth thermal printer (phones and tablets)","steps":["Switch the printer on and pair it in the phone’s Bluetooth settings if it asks.","Set **Printer mode** to **Bluetooth**, tap **Connect Bluetooth Printer** and pick it from the list (once).","After a power cut or the printer going out of range, the app reopens the same printer by itself (no chooser). Some browsers cannot reopen a remembered Bluetooth printer after the page reloads — the screen then says **Tap Connect once**."]},{"title":"Paper, copies and the cash drawer","steps":["**Receipt Settings ▸ 🔠 Adjust receipt size** opens a window where you choose the paper (58 mm, 80 mm or custom) and the letter size in points (7 is the standard; try 9, 10, 11 if receipts look too small). A sample receipt with items changes as you tap **−** or **+**; press **🖨️ Print test receipt** to check it on your printer, then **Save** — that is how every receipt will print. **Cancel** throws the changes away, **Reset to standard** goes back to 7 pt. The number of copies is set in Receipt Settings too.","Each till can have a different printer: under **THIS device's printer paper** choose 58 mm or 80 mm for the printer on this device (or tap **58 mm / 80 mm** at the top of any receipt). **If words break or numbers jump to the next line, the printer is 58 mm on an 80 mm setting — choose 58 mm.** The receipt preview is exactly what will print.","**📏 Print a width test** (USB / Bluetooth) prints a 32- and a 48-character line: if the 48 one breaks in two, the printer is 58 mm.","The **cash drawer** plugs into the **printer** (RJ11/RJ12 port), not the computer; turn on \"open drawer on print\" in Hardware settings.","To check paper width and the drawer, print a small sale receipt, or reprint one from Daily Sales."]},{"title":"Barcode scanners","steps":["A USB or Bluetooth **scanner** works like a keyboard: click the search box on the Sales Counter and scan.","The 📷 button next to search scans with the phone camera."]}],"tips":["Printing waits up to 4 seconds for a printer that has just been switched on before saying it is not connected.","If a print fails half-way the receipt is **not** sent again automatically (so you never get a doubled half-receipt) — reprint from Daily Sales."]},{"id":"offline","icon":"📶","title":"Offline, sync and backups","steps":["**Offline:** the app keeps working with no internet; sales, tank levels and receipts are saved on the device.","**Sync:** when the internet returns the dot turns green and every device catches up.","**Backups:** ⚙️ Settings ▸ 🗄️ Backups. Your data is also stored on the server, so a lost phone does not lose your business.","**Sites:** switching between the Shop and Production only changes what you look at and record; both are always saved."],"tips":["Use **Settings ▸ Install App ▸ 🔄 Re-download for Offline Use** after an update if the app ever fails to open offline."]},{"id":"trouble","icon":"🛟","title":"When something is wrong","steps":["**Printer does not print:** check paper and power, then Settings ▸ Hardware ▸ status. Switch it off and on — the app finds it again by itself. As a fallback use the system print dialog.","**\"Only 0 available\" when selling:** the product has no stock. Record it in Restocking, or correct it on the Inventory tab.","**A sale is missing from Daily Sales:** tap **🔎 Check for missing sales** under the list. Pay-Later bills only count when paid; check Bills. In Aqua POS check the site selected at the top.","**The login window appears again:** just log in; it will not reappear over a running session.","**Forgot the password:** tap **Forgot the password?** on the login screen and use **Email me a reset link**.","**Something looks out of date on a device:** wait for the green dot, then reload the page once.","**Still stuck:** the Owner sees errors from every shop in the Owner Console ▸ Errors tab — tell your provider what you were doing and roughly when."]},{"id":"alltabs","icon":"🗂️","title":"Every tab at a glance","intro":"The tabs of Aqua POS, in the order they appear:","tabs":[["Sales Counter","New sale: refills by size or custom litres, sealed bottles, dispensers, bales; walk-in or delivery."],["Dashboard","Today at a glance: sales, money in by payment method, low stock and what needs attention."],["Inventory","Products (bottled water, bales, accessories), materials and refill sizes with prices and recipes."],["Add New Items","Add items one by one, many at once (bulk), or from a photo of a list (Capture List)."],["Materials","Raw materials and their suppliers: stock levels, costs and restocking."],["Restocking","Top up a material or product (decimals allowed) and see restock history."],["Stock Take","Count what is really at this site — products, bottles, tank litres, materials — and correct the system to it."],["Bulk Tank","Your bulk water tanks: add water, and see each site’s level drop as refills are sold."],["Production","Nine simple steps: what, client, bottle, seal, cap, label, wrapping, water tank, extras. Only the materials you pick (and the tank water) are used."],["Dispatch","Under Logistics. Send stock and pre-filled refills from Production to a shop branch, see factory stock, shop requests and Dispatch History."],["Bulk Orders","Book large future orders with a deposit and delivery date."],["Returned Goods","Customer returns and exchanges: refund, swap, faulty items."],["Deliveries","Delivery orders assigned to drivers: picked up, on route, delivered."],["Daily Sales","Every sale for a day / week / month, filtered by payment method, for the site you are in."],["Price List & Invoices","Print a price list (standard or per client) and make invoices with payments; copy to WhatsApp."],["Audit","A searchable, read-only timeline of who did what and when — sales, voids, discounts, stock changes, X/Z Reports and KRA/eTIMS classification changes."],["Stock Report","Stock movement of products and materials."],["Expenses","A simple list of money you spent (rent, fuel, wages, electricity) with date, category and who paid."],["Profits & Expenses","Record expenses and see gross and net profit for any period."],["Tax & Returns","Sales grouped by tax class (standard, zero-rated, exempt, out of scope) with the VAT in each line, returns and voids, and CSV / PDF exports for preparing your return by hand. A review report, not a KRA filing or an eTIMS invoice."],["Demand Trends","Which sizes and products sell most, and when."],["Bills","Pay-Later sales still owing: settle in full or in part, see closed bills."],["Debts","Money customers owe you outside of bills; record and settle."],["My Customers","Your customer list with purchase history and loyalty."],["Staff","Add staff, choose which tabs each can use, send invite links, see who is serving."],["Attendance","Staff clock in / out and hours worked."],["Payroll","Create Payroll: staff register and documents, pay runs, payslips. Admin / payroll rights only; a worker sees just their own payslips. Needs internet and a staff PIN sign-in."],["Online Orders","Orders customers place from your public order page or barcode: accept, prepare, hand over or deliver, and turn them into sales."],["Purchases","Record what you bought from a supplier directly (items, quantity, cost, paid or on credit); stock and the supplier balance update."],["Invoicing","Make invoices in KES or another currency (the default can be changed), with tax on or off, print / save as PDF / share them, record payments, send client statements and reconcile payments against your bank or M-Pesa statement."],["Settings","Business details, receipts, tax, hardware, security, backups and more."],["More","The rest of the tabs that do not fit on the screen."]]}]};</script>
