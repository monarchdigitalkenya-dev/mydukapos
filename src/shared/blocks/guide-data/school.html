<!-- GUIDE DATA (school) — generated by tools/build-guides.mjs; edit that file, not this one. -->
<script>window.__GUIDE_DATA = {"key":"school","title":"School POS — User Guide","tagline":"Schools — students, classes, term fees and balances, stationery stock, bazaar fund, expenses and reports.","module":"School POS","version":"1.0.0","chapters":[{"id":"start","icon":"🚀","title":"Getting started","intro":"School POS works on a phone, tablet or computer, online or offline. Everything below applies on every device you use.","steps":["Open the link your provider gave you (or the app icon, once installed). The very first time on a new business, tap **Sign Up**, type the business name, your name and a **password** — you become the **Admin**. After that, tap **Log In**.","On **Who’s logging in?** pick **Admin** (type the password) or a staff member (type their PIN). Staff only see the tabs the Admin gave them.","Look at the small dot at the top: **green** = online and saved, **orange** = syncing, **black** = offline. Offline is fine — keep selling; everything is saved on the device and sent when the internet is back.","Tabs run across the top. **☰ More** holds the ones that do not fit. Tap the **📖** button at the top any time to open this guide.","Install it like an app: **⚙️ Settings ▸ 📱 Install App ▸ Install / Add to Home Screen**. After the first load it opens with no internet at all."],"tips":["Do the first load of the app **while online** on every device — that is what lets it open offline later.","Settings ▸ Install App ▸ Version shows the version and the build on this device, so you can confirm an update reached it."]},{"id":"setup","icon":"🧭","title":"Set up your business (first 20 minutes)","intro":"Do these once, in this order, as the Admin:","steps":["**⚙️ Settings ▸ General** — business name, logo, phone and address. They print on every receipt.","**Settings ▸ 🧾 Receipt Settings** — header and footer lines, paper width (58 mm or 80 mm), how many copies, whether to print the reference number and its barcode.","**Settings ▸ 🧾 Tax & Alerts** — VAT rates, and the **low-stock level** (items at or below it are flagged and offered as buttons when you restock).","**Settings ▸ 💳 Payment Gateway** — connect M-Pesa (Paystack, or Safaricom Daraja with your Till/Paybill) so you can send payment prompts to customers.","**Settings ▸ 🖨️ Hardware** — connect your receipt printer (see the **Printers & hardware** chapter).","Add your stationery items (see **➕ Add Stationery**), then **Settings ▸ 👥 Staff Accounts** to invite your staff.","**Settings ▸ 🗄️ Backups** — check that backups are on. **Settings ▸ 📥 Data Import** brings in data from another system."],"tips":["Settings ▸ 🔒 Security & Access lets the Admin lock tabs behind the management password.","Settings ▸ 🧾 eTIMS (KRA) is only for businesses registered for KRA eTIMS — leave it off otherwise."]},{"id":"setup2","icon":"🏫","title":"Set up the school: classes, subjects, students","steps":["**🏫 Classes:** Step 1 — type a name prefix and how many (for example \"Grade\" × 8) ▸ **Generate Classes**. Add **streams** (East, West) under a class if needed.","**📖 Subjects ▸ + Add Subject:** add every subject taught once (Mathematics, English…).","**🎓 Students ▸ Register New Student:** admission number, full name, class (and stream), guardian name and phone ▸ **Register Student**. Edit a student any time from the registry.","**At year end:** **🎓 Students ▸ Promote a Class** — move every student from one class to another in one action.","**📋 Take Whole-School Register** (Classes tab) marks who is present for the day."]},{"id":"fees","icon":"💰","title":"Fees: set, collect, balances, penalties","steps":["Open **💰 Fees & Payments**. Under **Term Fees**, add each term with its **fee amount** (**Generate** creates a year of terms quickly). Every registered student is billed that amount per term.","**Record a Payment:** pick the student, type the amount and date ▸ **+ Record Payment**. Choose cash or M-Pesa. A receipt prints or can be shared to the guardian.","**Fee Balances** lists every student with balance and last payment date; sort or filter (for example only those who owe), and **⬇️ Download CSV**.","**⚠️ Add Penalty:** apply a late fee to a class or term.","Review payments under **🧾 Fee Payment Records** (Daily / Weekly / Monthly / Custom range, by cash or M-Pesa) and **🖨️ Print Payment Report**."],"tips":["Use **Settings ▸ 📢 SMS Broadcast** to text guardians about balances."]},{"id":"stationery","icon":"📚","title":"Stationery: stock, restock, distribute","steps":["**➕ Add Stationery** to add books and supplies; **📚 Stationery Stock** shows what you have and its value.","**📥 Restock** when stock arrives (an expense is logged automatically); **📋 Stock Take** to count.","**📦 Distribute to Classes ▸ + Record Distribution:** choose the item, the class, the quantity and the date. Stock goes down but **nothing is charged**. The **Distribution Status by Class** table shows who has received what.","Stationery can also be sold at the counter where enabled."]},{"id":"bazaar","icon":"🎪","title":"Bazaar Fund and Expenses","steps":["**🎪 Bazaar Fund:** money a student gives you to hold (snacks, a bazaar day). Choose the student, type the amount and reason, then **➕ Deposit** or **➖ Withdrawal**. **💰 Balances Held** shows what you hold for each student. It never affects fees.","**💸 Expenses ▸ + Add Expense:** log food, transport, rent, deliveries. **🖨️ Print Expenses Report** for any period. **💰 Profit Report** compares income with expenses."]},{"id":"payments","icon":"💳","title":"Taking payment","intro":"The School POS collects **fees** and other money by **cash or M-Pesa**.","steps":["Fees: **💰 Fees & Payments ▸ Record a Payment** — pick the student, type the amount and date, choose **cash** or **M-Pesa**, then **+ Record Payment**. A receipt is made; print it or share it as a PDF.","For M-Pesa either type the M-Pesa code the guardian received, or use **Settings ▸ 💳 Payment Gateway** to send a payment prompt to the guardian’s phone.","A part-payment lowers the balance; the student stays on the **Fee Balances** list until fully paid.","Other money owed to the school (for example a stationery account) goes under **📒 Debts**."],"tips":["Print any receipt once; reprints ask \"already printed — another copy?\" so copies are always deliberate."]},{"id":"receipts","icon":"🧾","title":"Receipts: print, share, reprint","steps":["When a sale completes a **receipt preview** opens. Tap **🖨️ Print** — it prints **once**, and the preview closes so it cannot be printed twice by accident.","Every receipt of the day carries a **Customer number** (Customer 1, 2, 3…) just above the reference number. It starts again at 1 each day, so the last receipt of the day tells you how many customers you served.","To print the same receipt again later, open it from **Daily Sales** and tap Print — the app asks \"already printed at 14:32 — print another copy?\" so copies are always deliberate.","**📤 Share** sends the receipt as a **PDF** (WhatsApp shows it as a document). On a phone it opens your apps. On computers and some browsers that cannot hand a file to another app, the PDF is **saved to Downloads** instead — attach it in WhatsApp or email yourself.","**⬇️ Download** always saves the PDF."],"tips":["If the print fails (printer off, paper out) the preview stays open so you can try again — the sale is already saved.","Settings ▸ 🧾 Receipt Settings controls what appears on the receipt."]},{"id":"bills","icon":"📒","title":"Debts","steps":["**📒 Debts** records money owed to the school outside term fees (for example a stationery account). Add a debt with the name and amount; settle in parts or in full.","Fee balances are managed in **💰 Fees & Payments**, not here."],"tips":["Pay-Later sales are not counted as sales until money is paid on them."]},{"id":"stock","icon":"📥","title":"Restock, Orders and Stock Take","sections":[{"title":"📥 Restock: record stock you received","steps":["Open **📥 Restock**. Tap a **⚠️ low-stock button** to add that stationery item to the form (with its last buying price), or start typing a name — a drop-down of your stationery items appears; pick one to fill the code, unit and buying price, or keep typing a new name.","Enter the quantity and the buying price, then save. Stock goes up and an expense is logged automatically."]},{"title":"🛍️ Orders: order from suppliers","steps":["Open **Orders** ▸ **New Order**. Tap low-stock buttons to add what is running out, or type names (same drop-down). Enter quantities and prices and choose or type the supplier.","Tap **💬 Save & send on WhatsApp** to save the order and open WhatsApp addressed to the supplier with the order written out (their number is asked once and remembered). Or **Save Order** now and press **💬 WhatsApp** on it later.","Mark it **In Transit** when the supplier dispatches, and **Arrived** when the goods come — that adds the stock."]},{"title":"📋 Stock Take: correct the system to the shelf","steps":["Open **Stock Take**, count each item on the shelf and type the number next to it. Only items you type a count for are touched.","The screen shows each difference and its value at cost. Tap **✔ Update stock to my counts** — every change is recorded as a \"Stock take\" adjustment."]}],"tips":["Do a stock take after a stock delivery day or at the end of the month.","↩️ **Returned Goods** puts returned items back on the shelf (or into the faulty register) and can refund the customer."]},{"id":"reports","icon":"📊","title":"Reports and Daily Sales","steps":["**🧾 Daily Sales** lists every sale for Today, a Week, a Month or a Custom range, filtered by payment method. Print the day’s report from there, or void a wrong sale.","**📦 Stock Report** shows stock movement (opening, received, sold, closing) with values at cost and retail.","**💰 Profits & Expenses** — add expenses (rent, fuel, wages…) and see gross and net profit.","**📊 Reports** is the one place to generate everything: pick a **period** (Today … Last 90 days … Custom), then a report."],"sections":[{"title":"The reports in 📊 Reports","points":["**Sales** — total, number of sales, average sale, by payment method and the items sold, best first.","**Business insights** — busiest hour, best-earning hour, best day of the week, best worker; charts of sales by hour and by weekday; and a **trend line** you can switch between **daily, weekly (12 weeks) and monthly (12 months)**.","**Staff performance** — sales, average sale, share and sales per hour worked for each person.","**Stock** — stock value at cost and retail, low stock, out of stock and items that did not sell in the period.","**Bills & debts** — who owes what, oldest first, with ageing.","**Expenses & profit** — sales, cost of goods, gross profit, expenses by category and net profit."]}],"tips":["Every report can be **🖨️ printed / saved as PDF** or **⬇️ downloaded for Excel (CSV)**.","**📊 Dashboard** gives today’s figures the moment you open the app."]},{"id":"people","icon":"👥","title":"Staff, access and security","steps":["Open **⚙️ Settings ▸ 👥 Staff Accounts** (or the **👥 Staff** tab) and add a staff member’s name. Tick the tabs they may use (the Sales Counter is always allowed). Tap **Generate invite link**.","Send the link to them. They open it, choose a **PIN** (4+ characters) and they are in — no shop password needed. The link then turns into their personal login link: they should bookmark it.","A staff member is listed once: a double tap on \"Create my account\" cannot make two copies.","**🕐 Attendance** — staff clock in and out; hours worked show in Reports ▸ Staff performance.","**Settings ▸ 🔒 Security & Access** — change the password, lock tabs behind the management password, and use fingerprint where the device supports it.","**Settings ▸ 🔐 Admin Activity Log** shows what was changed and by whom.","**👤 My Customers** keeps your customers and their purchases; **🎟️ Loyalty Tokens** (Settings) rewards repeat customers where enabled."],"tips":["To remove a staff member, remove them under Staff Accounts — their old sales stay in the records.","If someone forgets the Admin password, use **Forgot it? Email me a reset link** on the login screen (needs the recovery email set up)."]},{"id":"hardware","icon":"🖨️","title":"Printers & hardware","intro":"Open **⚙️ Settings ▸ 🖨️ Hardware** (or tap the small printer icon at the top). There are three ways to print:","sections":[{"title":"1. System print dialog (works with any installed printer)","steps":["Set **Printer mode** to **System print dialog**.","Print a receipt: the device’s print window opens — choose your receipt printer once. The receipt prints on a slip only as long as its lines (paper is not wasted).","Browsers never allow silent printing, so this mode always shows that window. Use Bluetooth or USB to avoid it."]},{"title":"2. USB thermal printer (computer or Android)","steps":["Plug the printer in and switch it on.","Set **Printer mode** to **USB**, tap **Connect USB Printer**, choose your printer and allow access.","From then on the app **reconnects by itself** whenever the printer is switched off and on, unplugged and replugged, or the app is reopened — it keeps checking every few seconds and prints the moment the printer is back. You do not go back to Settings."]},{"title":"3. Bluetooth thermal printer (phones and tablets)","steps":["Switch the printer on and pair it in the phone’s Bluetooth settings if it asks.","Set **Printer mode** to **Bluetooth**, tap **Connect Bluetooth Printer** and pick it from the list (once).","After a power cut or the printer going out of range, the app reopens the same printer by itself (no chooser). Some browsers cannot reopen a remembered Bluetooth printer after the page reloads — the screen then says **Tap Connect once**."]},{"title":"Paper, copies and the cash drawer","steps":["**Receipt Settings** sets the paper width (58 or 80 mm) and the number of copies.","The **cash drawer** plugs into the **printer** (RJ11/RJ12 port), not the computer; turn on \"open drawer on print\" in Hardware settings.","To check paper width and the drawer, print a small sale receipt, or reprint one from Daily Sales."]},{"title":"Barcode scanners","steps":["A USB or Bluetooth **scanner** works like a keyboard: click the search box on the Sales Counter and scan.","The 📷 button next to search scans with the phone camera."]}],"tips":["Printing waits up to 4 seconds for a printer that has just been switched on before saying it is not connected.","If a print fails half-way the receipt is **not** sent again automatically (so you never get a doubled half-receipt) — reprint from Daily Sales."]},{"id":"offline","icon":"📶","title":"Offline, sync, backups and importing data","steps":["**Offline:** the app keeps working with no internet. Sales, stock and receipts are saved on the device.","**Sync:** when the internet returns the dot turns green and every device catches up. Several tills can work at once — stock changes from each add up correctly.","**If the dot stays black** with internet, wait a few seconds (it checks the server itself and recovers without a refresh). If it stays black, check the device’s connection.","**Backups:** ⚙️ Settings ▸ 🗄️ Backups. Your data is also stored on the server, so a lost phone does not lose your business — log in on another device.","**Importing from Excel/CSV:** on the Inventory tab tap **⬆️ Import from Excel/CSV**. A \"please wait\" bar shows while the file is read. Check the review list, then **Batch Commit**. Tap **⬇️ Download Excel/CSV** to export.","**More than one branch:** Settings ▸ 🏢 Branches links branches so items and cross-branch sales work."],"tips":["Use **Settings ▸ Install App ▸ 🔄 Re-download for Offline Use** after an update if the app ever fails to open offline."]},{"id":"trouble","icon":"🛟","title":"When something is wrong","steps":["**Printer does not print:** check paper and power, then Settings ▸ Hardware ▸ status. Switch it off and on — the app finds it again by itself. As a fallback use the system print dialog.","**\"Only 0 available\" when selling:** the item has no stock. Record it in Restock, or run a Stock Take.","**A sale is missing from Daily Sales:** Pay-Later bills only count when paid; check Bills. In Aqua POS check the site selected at the top.","**The login window appears again:** just log in; it will not reappear over a running session.","**Forgot the password:** tap **Forgot the password?** on the login screen and use **Email me a reset link**.","**Something looks out of date on a device:** wait for the green dot, then reload the page once.","**Still stuck:** the Owner sees errors from every shop in the Owner Console ▸ Errors tab — tell your provider what you were doing and roughly when."]},{"id":"alltabs","icon":"🗂️","title":"Every tab at a glance","intro":"The tabs of School POS, in the order they appear:","tabs":[["Fees & Payments","Set term fees, record payments, see every student’s balance, add penalties."],["Dashboard","Fees collected, balances outstanding and stock alerts at a glance."],["Students","Register students; promote a whole class at year end."],["Classes","Generate classes and streams; take the whole-school register."],["Subjects","The school-wide subject list."],["Stationery Stock","Stationery and books you stock, with stock valuation."],["Add Stationery","Add stationery items one by one or in bulk."],["Restock","Record stock you received: quantity and buying price; low-stock buttons add items for you."],["Orders","Purchase orders to suppliers: create, send on WhatsApp, mark in transit, receive (stock goes up on arrival)."],["Stock Take","Count the shelf, type the counts, and correct the system to what is really there."],["Reports","Generate sales, insights (busiest hours, best workers, trends), staff, stock, bills & debts, expenses & profit reports."],["Store","A separate warehouse list (not your selling stock); take items from it into inventory."],["Distribute to Classes","Give stationery out to a class: stock goes down, nothing is charged."],["Barcode","Save, generate and print barcodes for your items."],["Tables & Rooms","Set up tables, rooms and utensils (used by tabs and orders)."],["Fee Payment Records","Every fee payment by day / week / month with printing."],["Stock Report","Stock movement over a period: opening, received, sold, closing, with values."],["Profit Report","Income against expenses for any period."],["Demand Trends","What sells most, and when: best sellers and slow movers."],["Debts","Money owed to the school outside fees."],["Expenses","Day-to-day costs (food, transport, rent); restocking logs its own expense."],["Bazaar Fund","Money a student leaves with the school to hold; separate from fees."],["Staff","Add staff, choose which tabs each can use, send invite links, see who is serving."],["Attendance","Staff clock in / out and hours worked."],["Settings","Business details, receipts, tax, hardware, security, backups and more."],["More","The rest of the tabs that do not fit on the screen."]]}]};</script>
