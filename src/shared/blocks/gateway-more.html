<!-- PAYMENT GATEWAYS: PESAPAL + CO-OP BANK (zip 210) -------------------------------
     Settings > Payment Gateway gets two more options next to Paystack / Daraja / KCB / Paywave, and the till shows Pesapal's payment link.
     OPTION E  Pesapal: Consumer Key + Secret. Hosted checkout (M-Pesa, Airtel Money, card, bank): the till shows a link (open / copy / WhatsApp) and
               waits; the result is confirmed by asking Pesapal itself.
     OPTION F  Co-operative Bank: Consumer Key + Secret + the token address, STK address and shortcode from the shop's own Co-op API portal
               (Co-op only publishes them behind its login, so they are never guessed). M-Pesa phone prompt; result returns like Daraja's.
     Added by this block alone (the existing panels are untouched): it builds its own panels, adds the two choices to "Force a specific provider",
     and, when the STK request answers with a paymentUrl, shows the link under the status line.
     zip 249: it also adds the TILL NUMBER box to the Daraja panel. A Till (Buy Goods) shop has two numbers: the Store / Head Office number (the
     existing Shortcode box; goes into the password) and the Till number that receives the money (this box). Shown only when the type is Till. -->
<script>
(function () {
    'use strict';
    if (window.__gwMore) return; window.__gwMore = true;
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function api(path, opts) { return fetch(typeof apiUrl === 'function' ? apiUrl(path) : path, opts); }
    function msg(id, ok, text) { var m = $(id); if (m) { m.className = 'settings-msg ' + (ok ? 'success' : 'error'); m.textContent = text; } }
    var CARD = 'margin:14px 0; padding:14px; border-radius:14px; border:1px solid rgba(127,140,141,.35); background:rgba(127,140,141,.07);';
    var OKBOX = 'display:none; background:#eafaf1; border:1px solid #a9dfbf; border-radius:8px; padding:10px; color:#1e4d2b;';

    function panelsHtml() {
        return '<div id="gw-more">'
        + '<div style="' + CARD + '"><h4 style="margin:0 0 4px;">Option E — Pesapal <span id="pesapal-badge" class="settings-msg" style="display:inline;margin:0;"></span></h4>'
        + '<p class="settings-hint" style="margin:0 0 8px;">Pesapal’s hosted checkout: the customer pays by <b>M-Pesa, Airtel Money, card or bank</b> on a secure Pesapal page. At the till you get a link to open, copy or send by WhatsApp. Get your keys at <a href="https://developer.pesapal.com" target="_blank" rel="noopener">developer.pesapal.com</a> (sandbox) or from your live Pesapal merchant account.</p>'
        + '<div id="pesapal-fields"><div class="vat-inline-row"><label style="font-size:13px;font-weight:normal;margin:0;">Environment:</label><select id="pesapal-env"><option value="sandbox">Sandbox (testing)</option><option value="production">Production (real money)</option></select></div>'
        + '<input type="text" id="pesapal-key" placeholder="Consumer Key" autocomplete="off"><input type="password" id="pesapal-secret" placeholder="Consumer Secret" autocomplete="off">'
        + '<button type="button" class="btn-main settings-small-btn" id="pesapal-save">Save Pesapal Keys</button><p id="pesapal-msg" class="settings-msg"></p></div>'
        + '<div id="pesapal-done" style="' + OKBOX + '"><p class="settings-msg success" style="margin:0 0 8px;">✅ Pesapal is configured for this shop.</p><button type="button" class="settings-small-btn" style="background:var(--danger);color:white;" id="pesapal-reset">Reset Pesapal</button></div>'
        + '<label class="label" style="margin-top:10px;">Notification (IPN) address — registered with Pesapal automatically on the first payment; shown for reference</label><div class="invite-link-box"><input type="text" id="pesapal-ipn-url" readonly><button type="button" class="settings-small-btn" id="pesapal-ipn-copy">Copy</button></div></div>'
        + '<div style="' + CARD + '"><h4 style="margin:0 0 4px;">Option F — Co-operative Bank <span id="coop-badge" class="settings-msg" style="display:inline;margin:0;"></span></h4>'
        + '<p class="settings-hint" style="margin:0 0 8px;">M-Pesa STK prompt through Co-op Bank’s API gateway. Co-op shows the exact addresses only inside your own Co-op API portal (after login), so copy them from there: the <b>token</b> address and the <b>STK push</b> address of the Safaricom STK product (its API console / Try-Out tab), plus your Paybill/Till. Nothing is sent until all are saved. Use <b>Send test</b> in Co-op’s sandbox before real money.</p>'
        + '<div id="coop-fields"><input type="text" id="coop-key" placeholder="Consumer Key" autocomplete="off"><input type="password" id="coop-secret" placeholder="Consumer Secret" autocomplete="off">'
        + '<input type="text" id="coop-token-url" placeholder="Token address (https://…) — from the Co-op portal" autocomplete="off"><input type="text" id="coop-stk-url" placeholder="STK push address (https://…) — from the Co-op portal" autocomplete="off">'
        + '<input type="text" id="coop-shortcode" placeholder="Paybill / Till number" autocomplete="off"><input type="password" id="coop-passkey" placeholder="Passkey (only if your portal asks for one)" autocomplete="off">'
        + '<div class="vat-inline-row"><label style="font-size:13px;font-weight:normal;margin:0;">Type:</label><select id="coop-type"><option value="CustomerPayBillOnline">Paybill</option><option value="CustomerBuyGoodsOnline">Till Number</option></select></div>'
        + '<button type="button" class="btn-main settings-small-btn" id="coop-save">Save Co-op Bank Details</button><p id="coop-msg" class="settings-msg"></p></div>'
        + '<div id="coop-done" style="' + OKBOX + '"><p class="settings-msg success" style="margin:0 0 8px;">✅ Co-op Bank is configured for this shop.</p><button type="button" class="settings-small-btn" style="background:var(--danger);color:white;" id="coop-reset">Reset Co-op Bank</button></div>'
        + '<p class="settings-hint" style="margin-top:10px;">Co-op’s result arrives at the same callback address shown under Option B (Daraja).</p></div></div>';
    }

    function mount() {
        mountTill();
        var forced = $('gateway-forced-provider-input');
        if (!forced || $('gw-more')) return;
        var row = forced.closest('.settings-row') || forced.parentNode;
        var host = document.createElement('div'); host.innerHTML = panelsHtml();
        row.parentNode.insertBefore(host.firstChild, row.previousElementSibling && row.previousElementSibling.tagName === 'HR' ? row.previousElementSibling : row);
        [['pesapal', 'Always use Pesapal'], ['coop', 'Always use Co-operative Bank']].forEach(function (o) { var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; forced.appendChild(op); });
        $('pesapal-save').addEventListener('click', savePesapal); $('coop-save').addEventListener('click', saveCoop);
        $('pesapal-reset').addEventListener('click', function () { reset('pesapal', 'Pesapal'); }); $('coop-reset').addEventListener('click', function () { reset('coop', 'Co-operative Bank'); });
        $('pesapal-ipn-copy').addEventListener('click', function () { var i = $('pesapal-ipn-url'); try { i.select(); navigator.clipboard.writeText(i.value); showToast('Copied.'); } catch (e) { /* select-only */ } });
        refresh();
    }
    function post(payload) { return api('/api/gateway-config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); }
    async function savePesapal() {
        var p = { pesapalEnv: $('pesapal-env').value, pesapalConsumerKey: $('pesapal-key').value.trim(), pesapalConsumerSecret: $('pesapal-secret').value.trim() };
        if (!p.pesapalConsumerKey || !p.pesapalConsumerSecret) return msg('pesapal-msg', false, 'Both the Consumer Key and Secret are required.');
        try { var r = await post(p); if (!r.ok) throw 0; msg('pesapal-msg', true, 'Saved.'); $('pesapal-secret').value = ''; refresh(); } catch (e) { msg('pesapal-msg', false, 'Could not save — try again.'); }
    }
    async function saveCoop() {
        var p = { coopConsumerKey: $('coop-key').value.trim(), coopConsumerSecret: $('coop-secret').value.trim(), coopTokenUrl: $('coop-token-url').value.trim(), coopStkUrl: $('coop-stk-url').value.trim(), coopShortcode: $('coop-shortcode').value.trim(), coopTransactionType: $('coop-type').value };
        var pk = $('coop-passkey').value.trim(); if (pk) p.coopPasskey = pk;
        if (!p.coopConsumerKey || !p.coopConsumerSecret || !p.coopTokenUrl || !p.coopStkUrl || !p.coopShortcode) return msg('coop-msg', false, 'Key, secret, both addresses and the Paybill/Till number are all required.');
        try { var r = await post(p); if (!r.ok) { var d = {}; try { d = await r.json(); } catch (e) { /* none */ } throw new Error(d.error || ''); } msg('coop-msg', true, 'Saved.'); $('coop-secret').value = ''; $('coop-passkey').value = ''; refresh(); } catch (e) { msg('coop-msg', false, e.message || 'Could not save — try again.'); }
    }
    async function reset(which, label) {
        if (!confirm('Remove the saved ' + label + ' configuration? Payments via ' + label + ' will stop working until it is set up again.')) return;
        try { var r = await api('/api/gateway-config', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ which: which }) }); if (!r.ok) throw 0; showToast(label + ' configuration removed.'); refresh(); } catch (e) { showToast('Could not reset ' + label + ' — try again.', true); }
    }
    async function refresh() {
        if (!$('gw-more')) return;
        try {
            var cfg = await (await api('/api/gateway-config')).json();
            function sw(prefix, on) { $(prefix + '-fields').style.display = on ? 'none' : 'block'; $(prefix + '-done').style.display = on ? 'block' : 'none'; $(prefix + '-badge').textContent = on ? '✅ Saved' : ''; }
            sw('pesapal', !!cfg.hasPesapalConfig); sw('coop', !!cfg.hasCoopConfig);
            $('pesapal-env').value = cfg.pesapalEnv || 'sandbox'; $('pesapal-ipn-url').value = cfg.pesapalIpnUrl || '';
            if (!cfg.hasCoopConfig) { $('coop-token-url').value = cfg.coopTokenUrl || ''; $('coop-stk-url').value = cfg.coopStkUrl || ''; $('coop-shortcode').value = cfg.coopShortcode || ''; }
            $('coop-type').value = cfg.coopTransactionType || 'CustomerPayBillOnline';
            if ($('gateway-forced-provider-input')) $('gateway-forced-provider-input').value = cfg.forcedProvider || '';
            mountTill();
            if ($('gateway-mpesa-txn-type-input') && cfg.mpesaTransactionType) $('gateway-mpesa-txn-type-input').value = cfg.mpesaTransactionType;
            if ($('gateway-mpesa-partyb-input')) $('gateway-mpesa-partyb-input').value = cfg.mpesaPartyB || '';
            syncTill();
            var st = $('payment-gateway-status'), stk = await (await api('/api/mpesa-stkpush')).json();
            if (st && stk.provider === 'pesapal') st.innerHTML = '<p class="settings-msg success">✅ Using Pesapal (payment link) for card / mobile-money payments.</p>';
            if (st && stk.provider === 'coop') st.innerHTML = '<p class="settings-msg success">✅ Using Co-operative Bank for the M-Pesa STK prompt.</p>';
        } catch (e) { /* the panels stay as they are */ }
    }
    // zip 249: DARAJA TILL NUMBER (PartyB). Shown only when the transaction type is Till; sent with the Daraja save by the fetch hook below.
    function syncTill() {
        var sel = $('gateway-mpesa-txn-type-input'), w = $('gateway-mpesa-partyb-wrap'), sc = $('gateway-mpesa-shortcode-input');
        if (!sel || !w) return;
        var till = sel.value === 'CustomerBuyGoodsOnline';
        w.style.display = till ? 'block' : 'none';
        if (sc) sc.placeholder = till ? 'Store / Head Office number (for a Till)' : 'Shortcode (Paybill or Till Number)';
    }
    function mountTill() {
        var sel = $('gateway-mpesa-txn-type-input');
        if (!sel || $('gateway-mpesa-partyb-input')) return;
        var row = sel.closest('.vat-inline-row') || sel.parentNode;
        var wrap = document.createElement('div'); wrap.id = 'gateway-mpesa-partyb-wrap'; wrap.style.display = 'none';
        wrap.innerHTML = '<input type="text" id="gateway-mpesa-partyb-input" inputmode="numeric" placeholder="Till number (the number customers pay to)" autocomplete="off">'
            + '<p class="settings-hint" style="margin:4px 0 8px;">For a Till, the Shortcode box above must hold the <b>Store / Head Office number</b> from your Safaricom go-live email, and this box your <b>Till number</b>. If both are the same number, leave this one empty.</p>';
        row.parentNode.insertBefore(wrap, row.nextSibling);
        sel.addEventListener('change', syncTill);
        syncTill();
    }
    // keep the new panels in step whenever the app re-checks the gateway
    var orig = window.checkPaymentGatewayStatus;
    if (typeof orig === 'function' && !orig.__gwMore) {
        window.checkPaymentGatewayStatus = function () { var r = orig.apply(this, arguments); Promise.resolve(r).then(function () { mount(); refresh(); }); return r; };
        window.checkPaymentGatewayStatus.__gwMore = true;
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
    setTimeout(mount, 1500);

    // THE TILL: show Pesapal's payment link when the STK request answers with one
    function linkCard(url, phone) {
        var el = $('mpesa-status-line'); if (!el) return;
        var c = $('pesapal-link-card');
        if (!c) { c = document.createElement('div'); c.id = 'pesapal-link-card'; c.style.cssText = 'margin:8px 0;padding:12px;border-radius:12px;border:1px solid #a9dfbf;background:#eafaf1;color:#1e4d2b;font-size:14px;'; el.parentNode.insertBefore(c, el.nextSibling); }
        var dg = String(phone || '').replace(/\D/g, ''); if (/^0[17]\d{8}$/.test(dg)) dg = '254' + dg.slice(1); else if (/^[17]\d{8}$/.test(dg)) dg = '254' + dg;
        var wa = 'https://wa.me/' + dg + '?text=' + encodeURIComponent('Please pay here: ' + url);
        c.innerHTML = '<div style="font-weight:700;margin-bottom:6px;">🔗 Payment link ready</div><div style="margin-bottom:8px;">The customer opens this link and pays by M-Pesa, Airtel Money or card. This screen confirms by itself.</div>'
            + '<div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="' + esc(url) + '" target="_blank" rel="noopener" class="settings-small-btn" style="text-decoration:none;display:inline-block;">Open page</a>'
            + '<button type="button" class="settings-small-btn" id="pl-copy">Copy link</button><a href="' + esc(wa) + '" target="_blank" rel="noopener" class="settings-small-btn" style="text-decoration:none;display:inline-block;">WhatsApp</a></div>';
        $('pl-copy').addEventListener('click', function () { try { navigator.clipboard.writeText(url); showToast('Link copied.'); } catch (e) { /* manual copy */ } });
    }
    function clearCard() { var c = $('pesapal-link-card'); if (c) c.remove(); }
    var f0 = window.fetch;
    if (typeof f0 === 'function' && !f0.__gwMore) {
        window.fetch = function (input, init) {
            var u = typeof input === 'string' ? input : (input && input.url) || '';
            // zip 249: the Daraja save carries the Till number too (only when the type is Till and a number was typed)
            if (/\/api\/gateway-config(\?|$)/.test(u) && init && /POST/i.test(init.method || '') && typeof init.body === 'string') {
                try {
                    var b = JSON.parse(init.body), pb = $('gateway-mpesa-partyb-input');
                    if (b && b.mpesaTransactionType === 'CustomerBuyGoodsOnline' && pb && pb.value.trim()) { b.mpesaPartyB = pb.value.trim(); init = Object.assign({}, init, { body: JSON.stringify(b) }); }
                } catch (e) { /* send it as it was */ }
            }
            var p = f0.call(this, input, init);
            if (/\/api\/mpesa-stkpush(\?|$)/.test(u) && init && /POST/i.test(init.method || '')) {
                var phone = ''; try { phone = JSON.parse(init.body).phone || ''; } catch (e) { /* none */ }
                clearCard();
                p.then(function (r) { try { r.clone().json().then(function (d) { if (d && d.paymentUrl) linkCard(d.paymentUrl, phone); }).catch(function () {}); } catch (e) { /* none */ } }).catch(function () {});
            } else if (/\/api\/mpesa-status\?/.test(u)) {
                p.then(function (r) { try { r.clone().json().then(function (d) { if (d && (d.status === 'success' || d.status === 'failed')) clearCard(); }).catch(function () {}); } catch (e) { /* none */ } }).catch(function () {});
            }
            return p;
        };
        window.fetch.__gwMore = true;
    }
})();
</script>
