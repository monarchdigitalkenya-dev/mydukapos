<!-- DELIVERY POPUP (zip 293) ----------------------------------------------------------------------------------------------------
     Sales Counter: tapping "🚚 Delivery" opens the delivery form as a wide popup (client, address, zone, phone, fee, free-delivery, cost,
     agent, payment) instead of squeezing it into the cart column. The SAME fields/ids are used - nothing about how a delivery is recorded
     changes. "Done" closes the popup but keeps the sale a delivery (a summary bar with Edit stays under the toggle); "Walk-in" switches back.
     Guarded: a page without the delivery form does nothing. -->
<style id="dlv-css">
#delivery-details-group.dlv-pop{position:fixed !important;z-index:100001;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(96vw / var(--pos-z,1)),780px);max-height:calc(92vh / var(--pos-z,1));overflow:auto;margin:0 !important;padding:0 !important;border-radius:16px !important;background:var(--card,#fff) !important;color:var(--text,#2c3e50);box-shadow:0 16px 48px rgba(0,0,0,.4);display:block}
#delivery-details-group.dlv-pop.dlv-closed{display:none !important}
#delivery-details-group.dlv-pop .dlv-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:14px 16px;background:linear-gradient(135deg,#e67e22,#d35400);color:#fff;border-radius:16px 16px 0 0}
#delivery-details-group.dlv-pop .dlv-head h3{margin:0;flex:1;font-size:17px;color:#fff}
#delivery-details-group.dlv-pop .dlv-head button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
#delivery-details-group.dlv-pop .dlv-x{background:rgba(255,255,255,.2);color:#fff}
#delivery-details-group.dlv-pop .dlv-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 14px;padding:14px 16px 4px}
#delivery-details-group.dlv-pop .dlv-body>:not(.form-group){grid-column:1/-1}
#delivery-details-group.dlv-pop .dlv-body input,#delivery-details-group.dlv-pop .dlv-body select{width:100%;box-sizing:border-box}
#delivery-details-group.dlv-pop .dlv-foot{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;background:var(--card,#fff);border-top:1px solid #e5e8ea;border-radius:0 0 16px 16px}
#delivery-details-group.dlv-pop .dlv-foot button{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer}
@media (max-width:600px){
#delivery-details-group.dlv-pop{width:calc(100vw / var(--pos-z,1));max-height:calc(94vh / var(--pos-z,1));top:auto;bottom:0;left:0;transform:none;border-radius:16px 16px 0 0 !important}
#delivery-details-group.dlv-pop .dlv-head{padding:10px 14px;border-radius:16px 16px 0 0}
#delivery-details-group.dlv-pop .dlv-body{gap:0 10px;padding:8px 14px 2px}
#delivery-details-group.dlv-pop .dlv-body .form-group{margin-bottom:6px !important}
#delivery-details-group.dlv-pop .dlv-body label.label{margin:4px 0 2px !important;font-size:12.5px}
#delivery-details-group.dlv-pop .dlv-body input:not([type=checkbox]),#delivery-details-group.dlv-pop .dlv-body select{padding:9px 10px;font-size:15px;min-height:40px}
#delivery-details-group.dlv-pop .dlv-body .settings-hint,#delivery-details-group.dlv-pop .dlv-body #delivery-pod-hint{display:none}
#delivery-details-group.dlv-pop .dlv-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
#delivery-details-group.dlv-pop .dlv-foot button{flex:1}
}
#dlv-back{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.55);display:none}
#dlv-back.on{display:block}
#dlv-summary{display:none;align-items:center;gap:8px;margin:-6px 0 12px;padding:10px 12px;border-radius:10px;background:#fdf2e9;border-left:4px solid #e67e22;font-size:13px;color:#7e3a0b}
#dlv-summary.on{display:flex}
#dlv-summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dlv-summary button{border:0;border-radius:8px;background:#e67e22;color:#fff;font-weight:700;padding:7px 12px;cursor:pointer}
</style>
<script id="dlv-js">
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function build() {
    var g = $('delivery-details-group');
    if (!g || g.classList.contains('dlv-pop')) return !!g;
    g.classList.add('dlv-pop', 'dlv-closed');
    var body = document.createElement('div'); body.className = 'dlv-body';
    while (g.firstChild) body.appendChild(g.firstChild);
    var head = document.createElement('div'); head.className = 'dlv-head';
    head.innerHTML = '<h3>🚚 Delivery details</h3><button type="button" class="dlv-x" aria-label="Close" onclick="dlvDone()">✕</button>';
    var foot = document.createElement('div'); foot.className = 'dlv-foot';
    foot.innerHTML = '<button type="button" style="background:#ecf0f1;color:#2c3e50" onclick="dlvWalkin()">🚶 Walk-in instead</button><button type="button" style="background:#27ae60;color:#fff" onclick="dlvDone()">✅ Done</button>';
    g.appendChild(head); g.appendChild(body); g.appendChild(foot);
    // zip 298 - ROOT CAUSE of "the Delivery button does nothing": the form lived INSIDE the cart panel (overflow:hidden, its own stacking context),
    // so its z-index 100001 only counted inside that panel while the dark backdrop (a child of <body>, z-index 100000) was painted OVER the whole
    // panel - on top of the popup. Every tap on a field landed on the backdrop, whose click closes the popup. (jsdom has no layout, so the old test
    // could not see it.) The popup now lives directly under <body> like every other modal, so the backdrop is truly behind it.
    document.body.appendChild(g);
    var back = document.createElement('div'); back.id = 'dlv-back'; back.onclick = function () { window.dlvDone(); };
    document.body.appendChild(back);
    var sum = document.createElement('div'); sum.id = 'dlv-summary';
    sum.innerHTML = '<span id="dlv-sum-text"></span><button type="button" onclick="dlvOpen()">✏️ Edit</button>';
    var tg = $('order-type-toggle'); if (tg && tg.parentNode) tg.parentNode.insertBefore(sum, tg.nextSibling);
    return true;
  }
  function val(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
  function summary() {
    var s = $('dlv-summary'), t = $('dlv-sum-text'); if (!s || !t) return;
    var bits = [val('delivery-client-name-input') || 'No name yet', val('delivery-address-input'), val('delivery-phone-input')].filter(Boolean);
    var fee = val('delivery-fee-input');
    t.textContent = '🚚 Delivery · ' + bits.join(' · ') + (fee ? ' · fee KES ' + fee : '');
  }
  window.dlvOpen = function () { if (!build()) return; $('delivery-details-group').classList.remove('dlv-closed'); $('dlv-back').classList.add('on'); var s = $('dlv-summary'); if (s) s.classList.remove('on'); };
  window.dlvDone = function () {
    var g = $('delivery-details-group'); if (!g) return;
    g.classList.add('dlv-closed'); var b = $('dlv-back'); if (b) b.classList.remove('on');
    var s = $('dlv-summary'); var on = (typeof orderType !== 'undefined') && orderType === 'delivery';
    if (s) { summary(); s.classList.toggle('on', on); }
  };
  window.dlvWalkin = function () { window.dlvDone(); try { setOrderType('walkin'); } catch (e) { /* ignore */ } };
  try {
    var orig = window.setOrderType;
    if (typeof orig === 'function' && !orig.__dlv) {
      var w = function (type) {
        var r = orig.apply(this, arguments);
        if (!build()) return r;
        if (type === 'delivery') window.dlvOpen();
        else { $('delivery-details-group').classList.add('dlv-closed'); $('dlv-back').classList.remove('on'); var s = $('dlv-summary'); if (s) s.classList.remove('on'); }
        return r;
      };
      w.__dlv = true;
      window.setOrderType = w;
    }
  } catch (e) { /* ignore */ }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build); else build();
})();
</script>
