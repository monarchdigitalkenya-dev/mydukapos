<style id="svc-board-css">

<script>
/* ===== svc-ui-board: state + tiny helpers ===== */
var SVC_BD = { hosts: [], tab: '', focus: '', range: 'today', timer: 0, sched: 0, subscribed: false, draws: 0, touch: null, searchTimer: 0 };
var SVC_BD_LEGACY = { in_progress: 'in_progress', ready: 'ready', completed: 'completed', collected: 'collected' };
var SVC_BD_LEGACY_ORDER = ['received', 'in_progress', 'ready', 'completed', 'collected'];

function svcBdEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function svcBdNow() { try { if (typeof svcNow === 'function') return svcNow(); } catch (e) { /* use the clock */ } return Date.now(); }
function svcBdToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(String(msg), !!isErr); } catch (e) { /* toast is cosmetic */ } }
function svcBdMoneyOk() { try { if (typeof svcCan === 'function') return !!svcCan('svc:financials'); } catch (e) { /* allow */ } return true; }
function svcBdMoney(n) { try { if (typeof svcFormatMoney === 'function') return svcFormatMoney(n); } catch (e) { /* fall through */ } return 'KSh ' + (Math.round((Number(n) || 0) * 100) / 100); }
function svcBdType() { try { if (typeof svcBusinessType === 'function') { var t = svcBusinessType(); if (t) return String(t); } } catch (e) { /* default */ } return 'other'; }
function svcBdTpl(type) { try { if (typeof svcGetTemplate === 'function') return svcGetTemplate(type) || { terms: {}, statuses: [], queueGroups: [] }; } catch (e) { /* no templates */ } return { terms: {}, statuses: [], queueGroups: [] }; }
function svcBdTerm(tpl, key, dflt) { var v = tpl && tpl.terms && tpl.terms[key]; return v ? String(v) : (dflt || key); }
function svcBdStatus(tpl, key) {
  var l = (tpl && tpl.statuses) || [], i;
  for (i = 0; i < l.length; i++) if (l[i] && l[i].key === key) return l[i];
  return { key: key, label: String(key || '').replace(/_/g, ' '), color: '#7f8c8d', phase: 1 };
}
function svcBdClock(ms) {
  var d = new Date(Number(ms)); if (!isFinite(d.getTime())) return '';
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function svcBdDayLabel(ms, now) {
  var d = new Date(Number(ms)), n = new Date(now);
  if (d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate()) return svcBdClock(ms);
  var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
  return d.getDate() + ' ' + mon + ' ' + svcBdClock(ms);
}
function svcBdAgo(mins) {
  mins = Math.max(0, Math.round(mins));
  if (mins < 60) return mins + ' min';
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h < 24) return h + 'h' + (m ? ' ' + m + 'm' : '');
  return Math.floor(h / 24) + 'd';
}
function svcBdAllOfType(type) {
  try { if (typeof svcAllJobs === 'function') return svcAllJobs({ includeLegacy: true, types: [type] }) || []; } catch (e) { /* none */ }
  return [];
}
/* narrowing by the home search box: job ids found by the ranked search (+ jobs of a matched customer / vehicle) */
function svcBdFilter(type, q) {
  var jobs = svcBdAllOfType(type), res = [];
  try { if (typeof svcSearch === 'function') res = svcSearch(q, { types: [type], limit: 200, kinds: ['job', 'customer', 'asset'] }) || []; } catch (e) { res = []; }
  var ids = {}, custs = {}, assets = {};
  res.forEach(function (r) { if (r.kind === 'job') ids[r.id] = 1; else if (r.kind === 'customer') custs[r.id] = 1; else if (r.kind === 'asset') assets[r.id] = 1; });
  return jobs.filter(function (j) { return ids[j.id] || (j.customer && j.customer.id && custs[j.customer.id]) || (j.assetId && assets[j.assetId]); });
}

/* ===== cards ===== */
/* legal quick moves for a card: the real store helpers decide (svcAllowedNext + svcCanEnter). A move that only lacks a requirement is still offered (tapping explains what is missing). */
function svcBdMoves(job, tpl) {
  var out = [], cur = svcBdStatus(tpl, job.status), i, k, d;
  if (!job || job._deleted) return out;
  if (job._legacy) {
    var at = SVC_BD_LEGACY_ORDER.indexOf(job.status);
    if (at === -1) return out;
    for (i = at + 1; i < SVC_BD_LEGACY_ORDER.length && out.length < 2; i++) {
      k = SVC_BD_LEGACY_ORDER[i]; if (!SVC_BD_LEGACY[k]) continue;
      d = svcBdStatus(tpl, k); out.push({ key: k, label: d.label, legacy: true });
    }
    return out;
  }
  if (cur.terminal) return out;
  var keys = []; try { if (typeof svcAllowedNext === 'function') keys = svcAllowedNext(job) || []; } catch (e) { keys = []; }
  var curPhase = typeof cur.phase === 'number' ? cur.phase : 1, found = [];
  for (i = 0; i < keys.length; i++) {
    k = keys[i]; d = svcBdStatus(tpl, k);
    if (d.phase === 4 || (typeof d.phase === 'number' && d.phase < curPhase)) continue;      /* cancelling and going back live in the drawer, not on a one-tap button */
    var chk = { ok: true, code: '', missing: [] };
    try { if (typeof svcCanEnter === 'function') chk = svcCanEnter(job, k) || chk; } catch (e2) { chk = { ok: false, code: 'error' }; }
    if (chk.ok) found.push({ key: k, label: d.label, phase: d.phase });
    else if (chk.code === 'requires') found.push({ key: k, label: d.label, phase: d.phase, needs: chk.missing || [] });
  }
  found.sort(function (a, b) { return (a.phase || 0) - (b.phase || 0); });
  return found.slice(0, 2);
}
function svcBdCardHtml(j, tpl, type, now, money) {
  var snap = j.assetSnap || {}, cust = j.customer || {}, st = svcBdStatus(tpl, j.status), late = false, plate = '', title, sub = '';
  try { late = typeof svcJobOverdue === 'function' ? svcJobOverdue(j, now) : false; } catch (e) { late = false; }
  if (snap.plate) { try { plate = typeof svcNormPlate === 'function' ? svcNormPlate(snap.plate) : String(snap.plate); } catch (e2) { plate = String(snap.plate); } }
  title = plate || snap.label || cust.name || j.no || 'Job';
  if (plate) sub = [snap.make, snap.model, snap.color].filter(Boolean).join(' ') || (snap.label && snap.label !== plate ? String(snap.label).replace(plate, '').trim() : '');
  else if (snap.label) { var idn = snap.imei ? 'IMEI …' + String(snap.imei).replace(/\D/g, '').slice(-6) : (snap.serial ? 'S/N ' + snap.serial : ''); sub = idn; }
  var svcs = (j.jobServices || []).map(function (s) { return s && s.name; }).filter(Boolean), staffN = [];
  (j.jobStaff || []).forEach(function (s) { if (s && !s.removedAt && s.name && staffN.indexOf(s.name) === -1) staffN.push(s.name); });
  var open = !(j.closedAt != null || (typeof j.phase === 'number' && j.phase >= 3));
  var owner = svcBdTerm(tpl, 'customer', 'Customer'), staffLbl = svcBdTerm(tpl, 'staff', 'Staff');
  var h = '<article class="sqb-card' + (late ? ' is-overdue' : '') + '" role="button" tabindex="0" data-sqb-act="open" data-id="' + svcBdEsc(j.id) + '" data-status="' + svcBdEsc(j.status) + '" style="--sqb-s:' + svcBdEsc(st.color || '#7f8c8d') + '" aria-label="' + svcBdEsc(title + ', ' + st.label) + '">';
  h += '<div class="sqb-r1"><span class="sqb-plate">' + svcBdEsc(title) + '</span><span class="sqb-pill" style="background:' + svcBdEsc(st.color || '#7f8c8d') + '">' + svcBdEsc((st.icon ? st.icon + ' ' : '') + st.label) + '</span></div>';
  if (sub) h += '<div class="sqb-r2">' + svcBdEsc(sub) + '</div>';
  if (cust.name || cust.phone) h += '<div class="sqb-r3" data-sqb-f="owner">' + svcBdEsc(owner) + ': ' + svcBdEsc(cust.name || 'Walk-in') + (cust.phone ? ' · ' + svcBdEsc(cust.phone) : '') + '</div>';
  if (svcs.length) h += '<div class="sqb-r4" data-sqb-f="services">' + svcBdEsc(svcs.slice(0, 3).join(', ') + (svcs.length > 3 ? ' +' + (svcs.length - 3) : '')) + '</div>';
  if (staffN.length) h += '<div class="sqb-r5" data-sqb-f="staff">' + svcBdEsc(staffLbl) + ': ' + svcBdEsc(staffN.join(', ')) + '</div>';
  else if (open && tpl && tpl.staffAssignment) h += '<div class="sqb-r5" data-sqb-f="staff">' + svcBdEsc(staffLbl) + ': unassigned</div>';
  var tags = '';
  if (j.createdAt) tags += '<span class="sqb-tag" data-sqb-f="arrival">Arrived ' + svcBdEsc(svcBdDayLabel(j.createdAt, now)) + '</span>';
  if (j.dueAt && open) {
    if (late) tags += '<span class="sqb-tag late" data-sqb-f="eta">Overdue ' + svcBdEsc(svcBdAgo((now - Number(j.dueAt)) / 60000)) + '</span>';
    else tags += '<span class="sqb-tag eta" data-sqb-f="eta">ETA ' + svcBdEsc(svcBdDayLabel(j.dueAt, now)) + '</span>';
  }
  if (money) {
    var tot = null; try { tot = typeof svcTotals === 'function' ? svcTotals(j) : null; } catch (e3) { tot = null; }
    if (tot && tot.total > 0 && !(j._legacy && j.moneyKnown === false)) tags += tot.balance > 0.005 ? '<span class="sqb-tag bal">Balance ' + svcBdEsc(svcBdMoney(tot.balance)) + '</span>' : '<span class="sqb-tag paid">Paid</span>';
  }
  if (j._legacy) tags += '<span class="sqb-tag">Classic job</span>';
  if (tags) h += '<div class="sqb-r6">' + tags + '</div>';
  var moves = open ? svcBdMoves(j, tpl) : [];
  if (moves.length) {
    h += '<div class="sqb-moves">';
    moves.forEach(function (m, n) {
      h += '<button type="button" class="sqb-btn' + (n === 0 && !m.needs ? ' sqb-go' : '') + (m.needs ? ' sqb-needs' : '') + '" data-sqb-act="move" data-id="' + svcBdEsc(j.id) + '" data-key="' + svcBdEsc(m.key) + '"' + (m.needs ? ' data-needs="' + svcBdEsc(m.needs.join(',')) + '"' : '') + '>' + svcBdEsc(m.label) + ' ▸</button>';
    });
    h += '</div>';
  }
  return h + '</article>';
}

/* ===== the board ===== */
function svcBdColumns(qg) { return qg.filter(function (g) { return !g.apptOnly && (!g.hidden || g.count > 0) && (!g.extra || g.count > 0); }); }
function svcBdPickTab(cols) {
  var keys = cols.map(function (g) { return g.key; });
  if (SVC_BD.tab && keys.indexOf(SVC_BD.tab) !== -1) return SVC_BD.tab;
  var i;
  for (i = 0; i < cols.length; i++) if (!cols[i].closed && cols[i].count > 0) return cols[i].key;
  return keys[0] || '';
}
function svcBdBoardHtml(st) {
  var type = st.type, tpl = svcBdTpl(type), now = svcBdNow(), money = svcBdMoneyOk();
  var jobs; if (st.q) jobs = svcBdFilter(type, st.q);
  var qg = svcQueueGroups(type, { jobs: jobs, now: now }), cols = svcBdColumns(qg), tab = svcBdPickTab(cols); SVC_BD.tab = tab;
  var h = '<div class="sqb" data-sqb="board" data-type="' + svcBdEsc(type) + '">';
  h += '<div class="sqb-top"><span class="sqb-upd">Live · updated ' + svcBdEsc(svcBdClock(now)) + '</span><button type="button" class="sqb-btn" data-sqb-act="refresh" aria-label="Refresh board">⟳ Refresh</button></div>';
  h += '<div class="sqb-counts" role="list" aria-label="Queue counts">' + qg.counters.map(function (c) {
    return '<div class="sqb-chip' + (c.key === 'total' ? ' is-total' : '') + '" role="listitem" data-sqb-count="' + svcBdEsc(c.key) + '"><span>' + svcBdEsc(c.label) + '</span><b>' + c.value + '</b></div>';

/* ===== registration (home views). Labels follow the type's own words; the registry is refreshed whenever the config changes ===== */
function svcBdRegister() {
  if (typeof svcHomeViewRegister !== 'function') return false;
  var type = svcBdType(), tpl = svcBdTpl(type);
  var boardLabel = svcBdTerm(tpl, 'boardLabel', 'Board');
  svcHomeViewRegister('board', { label: boardLabel, order: 10, render: function (host, ctx) { return svcRenderBoard(host, ctx); }, visibleWhen: function (ctx) { svcBdRelabel(ctx); return true; } });
  svcHomeViewRegister('dashboard', { label: 'Dashboard', order: 20, render: function (host, ctx) { return svcRenderDashboardView(host, ctx); } });
  svcHomeViewRegister('search', { label: '🔍 Search', order: 30, render: function (host, ctx) { return svcRenderSearchView(host, ctx); } });
  return true;
}
function svcBdRelabel(ctx) {
  try {
    var tpl = svcBdTpl((ctx && ctx.type) || svcBdType()), want = svcBdTerm(tpl, 'boardLabel', 'Board');
    if (typeof SVC_UI !== 'undefined' && SVC_UI.views && SVC_UI.views.board && SVC_UI.views.board.label !== want) SVC_UI.views.board.label = want;
  } catch (e) { /* cosmetic */ }
}
svcBdRegister();
try { if (typeof svcOn === 'function') svcOn('config:changed', function () { svcBdRegister(); }); } catch (e) { /* events optional */ }
</script>
