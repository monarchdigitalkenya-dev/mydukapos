<!-- COUNTER PRO (zip 298) --------------------------------------------------------------------------------------------------------
     Sales Counter, desktop / laptop / tablet (wider than 700 px - the phone till has its own layout and is left alone):
       - a compact, dense product grid: 5-7 columns, a small picture strip (a small 📦 placeholder when there is none), two-line names, the full name on hover
       - ONE search field: icon inside, clear (x) inside, placeholder "Search products, barcode or SKU...", the camera button as a small icon button; the
         "Product Search" heading and the loose hint line are gone (the Sales / Bills buttons moved up beside the search box)
       - a compact one-row category bar (scrolls sideways, counts on every chip) - only where the app has no category bar of its own (the Hotel keeps its own
         chips, compacted) and only while the picture-tile mode (category-tiles) is off
       - [ Hold Sale ] [ Open Drawer ] [ COMPLETE SALE ] on ONE row at the bottom of the cart: the very same buttons (same ids, same handlers, same permissions),
         only moved. "Open Drawer" is the existing cash-drawer chip (the cash float panel); it is not a new button and nothing is simulated.
       - a tighter cart (less padding, shorter rows) and a tighter page, so the totals and the sale buttons stay in view
       - scanner readiness: a small "Scan ready" light, and window.__ccScanSkip() which tells the app's keyboard-wedge listener when a burst of keys belongs to a
         text box someone is deliberately typing in (a payment reference, a customer / delivery form, anything inside a dialog or the cart sheet) so it is NOT
         taken for a barcode. A scan with nothing focused, or with the cursor in the search box / a quantity / price / cash box, behaves exactly as before.
     Nothing here sells, stocks, prices or saves anything. It only moves existing buttons and styles existing elements. Keyboard: F2 = search, Esc in the search = clear,
     Enter / Space on a product card = add it. Classes / ids: ccp-*, cc-*. -->
