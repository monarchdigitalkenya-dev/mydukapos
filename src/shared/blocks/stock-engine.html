<!-- STOCK ENGINE (zip 336) --------------------------------------------------------------------------------------------------------
     One small calculation library every module uses for stock that has to add up the same way on every screen. No screens, no saving, no network:
     the screens (stock-pro, hmis-counter) and the existing checkout / restock / transfer code call it.
       1. IDENTITY  - which inventory item a stock line (a Store transfer, a branch transfer) belongs to: by code, then variant code, then ONE exact
                      name + unit match. Two or more look-alikes is "ambiguous" - never guessed, the person picks. (Fixes the duplicate item made when
                      stock came back from the Store with a code the item did not have.)
       2. PACKAGING - carton > packet > piece levels on top of ONE stock figure in the smallest unit. Levels only change how a quantity is typed and
                      shown, never the quantity itself. 1 carton = 10 packets, 1 packet = 20 pieces -> 2 cartons = 400 pieces; sell 3 packets = -60.
       3. LOTS      - Pharmacy and Hospital only (FIFO/FEFO stays out of the other modules): each batch keeps its own cost, received date, supplier,
                      expiry and status. A sale takes the earliest-expiring USABLE batch first (oldest received breaks a tie); expired, quarantined and
                      recalled batches are never used by an ordinary sale. The cost of the batches actually used is the cost of that sale.
       4. COST FIXES - corrections a manager approved (kept on the server, append-only) are laid OVER the sale lines when a report adds up cost; the
                      sale records themselves are never changed.
     Money is rounded to cents and quantities to 3 decimals at every step, like the rest of the app (stockRound3 / round2). -->
<script>
(function () {
    'use strict';
    if (window.SE && window.SE.__v) return;
    var r3 = function (n) { var v = Math.round((Number(n) || 0) * 1000) / 1000; return v === 0 ? 0 : v; };
    var r2 = function (n) { var v = Number(n) || 0; var x = v * 100; var r = Math.round(x + (x < 0 ? -1 : 1) * Math.max(1e-9, Math.abs(x) * 1e-12)) / 100; return r === 0 ? 0 : r; };
    var r6 = function (n) { return Math.round((Number(n) || 0) * 1e6) / 1e6; };
    var str = function (v) { return v == null ? '' : String(v); };
    var low = function (v) { return str(v).trim().toLowerCase(); };
    var normName = function (s) { return low(s).replace(/\s+/g, ' ').replace(/[^\p{L}\p{N} ]/gu, ''); };
    var todayIso = function (d) { var t = d ? new Date(d) : new Date(); var k = new Date(t.getTime() - t.getTimezoneOffset() * 60000); return k.toISOString().slice(0, 10); };
    var NOEXP = '9999-12-31';
    var uid = function (p) { try { if (typeof genSaleId === 'function') return (p || '') + genSaleId(); } catch (e) { /* fallback */ } return (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };

    /* ======================= 1. IDENTITY ======================= */
    // Is this inventory record something stock can be credited to (not a service, not archived, not deleted)?
    function stockable(p) { return !!p && p._deleted !== true && p.type !== 'service' && p.type !== 'set' && !(p.status === 2 || p.status === '2' || p.archived === true); }
    // "Grey fleece (30)" -> { parent: 'Grey fleece', variant: '30' }   (a Store line made from a variant is named "Item (Variant)")
    function splitVariantName(name) { var m = /^(.*\S)\s*\(([^()]+)\)\s*$/.exec(str(name)); return m ? { parent: m[1].trim(), variant: m[2].trim() } : null; }
    function parentByName(inv, parentName) {
        var n = normName(parentName); if (!n) return null;
        var hits = inv.filter(function (p) { return p && p._deleted !== true && p.hasVariants && Array.isArray(p.variants) && normName(p.name) === n; });
        return hits.length === 1 ? hits[0] : null;
    }
    // the variant of `par` a line means: by variant id, then the variant's code, its name, or the name typed after the item name in brackets
    function pickVariant(par, w, vid, vn) {
        var vs = par.variants || [];
        return (vid && vs.find(function (x) { return x && x.id === vid; }))
            || (w.variantCode && vs.find(function (x) { return x && x.code && low(x.code) === low(w.variantCode); }))
            || (w.variantName && vs.find(function (x) { return x && x.name && low(x.name) === low(w.variantName); }))
            || (vn && vs.find(function (x) { return x && x.name && low(x.name) === low(vn.variant); }))
            || null;
    }
    // Which item (and variant) does a moved line belong to?  w = { code, name, unit, variantCode, variantName, productCode (link) }
    // -> { kind: 'variant'|'item'|'new'|'ambiguous', product, variant, how, candidates }
    function matchLine(inv, w, links) {
        inv = Array.isArray(inv) ? inv : [];
        w = w || {};
        var code = str(w.code).trim(), name = str(w.name).trim();
        // a "PARENT::variantId" code goes back to exactly that variant
        // zip 338 (fix): when the variant id no longer matches (the item was edited / re-imported, so its variants got new ids) the line is still
        // found by the variant's code, its name, or the "(30)" at the end of the Store line's name ("Grey fleece (30)") - and when the item is
        // found but the variant is not, the person is asked which size it is. A "PARENT::id" line NEVER becomes a new item (that made a second
        // "Grey fleece (30)" on every Take, and every later Take then added to that copy: 2, 4, 6 ...).
        var vm = /^(.+)::([^:]+)$/.exec(code);
        var vn = splitVariantName(name);
        if (vm) {
            var par = inv.find(function (p) { return p && p._deleted !== true && str(p.code) === vm[1] && p.hasVariants && Array.isArray(p.variants); });
            if (!par && vn) par = parentByName(inv, vn.parent);
            var v = par && pickVariant(par, w, vm[2], vn);
            if (v) return { kind: 'variant', product: par, variant: v, how: 'variant id' };
            if (w.variantCode) {
                var any = inv.find(function (p) { return p && p.hasVariants && Array.isArray(p.variants) && p.variants.some(function (x) { return x && x.code && low(x.code) === low(w.variantCode); }); });
                if (any) return { kind: 'variant', product: any, variant: any.variants.find(function (x) { return x && x.code && low(x.code) === low(w.variantCode); }), how: 'variant code' };
            }
            if (par) return { kind: 'ambiguous', candidates: [par], parent: par, how: 'which size / variant of "' + par.name + '"?' };
            if (vn) { var dup = inv.filter(function (p) { return p && p._deleted !== true && p.hasVariants && normName(p.name) === normName(vn.parent); }); if (dup.length > 1) return { kind: 'ambiguous', candidates: dup, how: 'several items are called "' + vn.parent + '" - which one?' }; }
            code = '';          // the parent item is gone: match by name below, and never keep the "::" code as an item code
        }
        // a link remembered from an earlier transfer of this store item (store item id -> product code)
        if (links && w.storeItemId && links[w.storeItemId]) {
            var lk = inv.find(function (p) { return p && stockable(p) && str(p.code) === str(links[w.storeItemId]); });
            if (lk && !lk.hasVariants) return { kind: 'item', product: lk, how: 'linked' };      // a remembered link never points at an item that has sizes: the stock belongs to a size
        }
        if (code && !vm) {
            // the same code IS the same product (an archived item is still that product: crediting it never makes a second one)
            var byCode = inv.find(function (p) { return p && p._deleted !== true && p.type !== 'service' && low(p.code) === low(code); });
            if (byCode) return { kind: 'item', product: byCode, how: stockable(byCode) ? 'code' : 'code (archived item)' };
            // a barcode saved on the item, or on one of its variants
            var byBar = inv.filter(function (p) { return p && stockable(p) && (low(p.barcode) === low(code) || (Array.isArray(p.barcodes) && p.barcodes.some(function (b) { return low(b) === low(code); }))); });
            if (byBar.length === 1) return { kind: 'item', product: byBar[0], how: 'barcode' };
            var vByCode = null, vPar = null;
            inv.forEach(function (p) { if (!vByCode && p && p.hasVariants && Array.isArray(p.variants)) { var x = p.variants.find(function (q) { return q && q.code && low(q.code) === low(code); }); if (x) { vByCode = x; vPar = p; } } });
            if (vByCode) return { kind: 'variant', product: vPar, variant: vByCode, how: 'variant code' };
        }
        if (!name) return { kind: 'new', how: 'no name' };
        // a "Parent (Variant)" line (a Store line made from a variant) whose parent item has that variant: it goes to that variant
        var plainSame = vn && inv.some(function (p) { return p && stockable(p) && !p.hasVariants && normName(p.name) === normName(name); });   // a real item called "Coke (500ml)" is not a variant
        if (vn && !plainSame) {
            var vpar = parentByName(inv, vn.parent), vv = vpar && pickVariant(vpar, w, null, vn);
            if (vpar && vv) return { kind: 'variant', product: vpar, variant: vv, how: 'variant name' };
        }
        // the code did not match: fall back to ONE item with the same name AND the same unit. Several = ambiguous (asked, never guessed).
        var unit = low(w.unit || '');
        var same = inv.filter(function (p) { return p && stockable(p) && !p.hasVariants && normName(p.name) === normName(name); });
        if (unit) { var su = same.filter(function (p) { return !p.unit || low(p.unit) === unit; }); if (su.length) same = su; else if (same.length) return { kind: 'ambiguous', candidates: same, how: 'same name, different unit' }; }
        if (same.length === 1) {
            // a same-named item that carries a DIFFERENT code of its own is a different product only when the line's code is one of OUR item codes
            return { kind: 'item', product: same[0], how: code ? 'name (code not on this item)' : 'name' };
        }
        if (same.length > 1) return { kind: 'ambiguous', candidates: same, how: 'several items share this name' };
        return { kind: 'new', how: 'not found' };
    }

    /* ======================= 2. PACKAGING ======================= */
    // product.packs = [{ id, name, per, barcode, price, sell, buy }]  per = how many BASE units one of this package holds (integer for count units).
    // The stock figure product.qty is always in the base unit (product.unit). Levels are kept sorted largest first.
    var COUNT_UNITS = /^(pcs|pc|piece|pieces|unit|units|tab|tabs|tablet|tablets|cap|caps|capsule|capsules|sachet|sachets|packet|packets|pkt|box|boxes|bottle|bottles|vial|vials|amp|ampoule|ampoules|strip|strips|bag|bags|roll|rolls|pair|pairs|item|items|each|ea|carton|cartons|dozen|tin|tins|can|cans|mini|minis|mini-packet|mini-packets)$/i;
    function isCountUnit(u) { return !u || COUNT_UNITS.test(str(u).trim()); }
    function levels(p) {
        if (!p || !Array.isArray(p.packs)) return [];
        return p.packs.filter(function (x) { return x && x.id && Number(x.per) > 0 && !x.removed; }).slice().sort(function (a, b) { return Number(b.per) - Number(a.per); });
    }
    function levelOf(p, id) { return levels(p).find(function (x) { return x.id === id; }) || null; }
    function perOf(p, id) { if (!id || id === 'base') return 1; var l = levelOf(p, id); return l ? Number(l.per) : 0; }
    // validate an edited list: [{ name, parent ('base' | another level's id), count }] -> { ok, error, packs }
    //   count = how many of the PARENT one level holds is what people know ("1 packet holds 20 mini-packets"), so levels are typed that way and
    //   multiplied out here: carton -> 10 packets, packet -> 20 base  =>  carton.per = 200.
    function buildLevels(rows, baseUnit, existing) {
        rows = (rows || []).filter(function (r) { return r && (str(r.name).trim() || Number(r.count)); });
        var byId = {}, out = [], seen = {};
        existing = Array.isArray(existing) ? existing : [];
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i], nm = str(r.name).trim();
            if (!nm) return { ok: false, error: 'Give every package level a name (e.g. Carton, Packet).' };
            if (low(nm) === low(baseUnit)) return { ok: false, error: '"' + nm + '" is the base unit already - a package level must be bigger than one ' + baseUnit + '.' };
            if (seen[low(nm)]) return { ok: false, error: 'Two levels are both called "' + nm + '".' };
            seen[low(nm)] = 1;
            var c = Number(r.count);
            if (!(c > 0)) return { ok: false, error: 'How many does one ' + nm + ' hold? Type a number above 0.' };
            if (isCountUnit(baseUnit) && Math.abs(c - Math.round(c)) > 1e-9) return { ok: false, error: 'One ' + nm + ' must hold a whole number (' + c + ' is not), because ' + (baseUnit || 'pcs') + ' are counted.' };
            var id = r.id || (existing.find(function (e) { return e && low(e.name) === low(nm); }) || {}).id || uid('pk');
            byId[id] = { row: r, id: id, name: nm, count: c };
            out.push(byId[id]);
        }
        // resolve per (= base units) following the parent chain; a loop or an unknown parent is an error
        function per(node, depth) {
            if (depth > 12) return NaN;
            var par = node.row.parent || 'base';
            if (par === 'base') return node.count;
            var pn = byId[par] || out.find(function (o) { return low(o.name) === low(par); });
            if (!pn) return NaN;
            return node.count * per(pn, depth + 1);
        }
        var packs = [];
        for (var j = 0; j < out.length; j++) {
            var pr = per(out[j], 0);
            if (!(pr > 0) || !isFinite(pr)) return { ok: false, error: 'The level "' + out[j].name + '" points at a level that does not exist (or at itself).' };
            if (pr === 1) return { ok: false, error: 'One ' + out[j].name + ' would hold just one ' + (baseUnit || 'pcs') + ' - that is the base unit itself.' };
            var row = out[j].row, pid = row.parent || 'base';
            if (pid !== 'base' && !byId[pid]) { var named = out.find(function (o) { return low(o.name) === low(pid); }); if (named) pid = named.id; }
            packs.push({ id: out[j].id, name: out[j].name, parent: pid, count: out[j].count, per: r6(pr),
                barcode: str(row.barcode).trim() || null, price: Number(row.price) > 0 ? r2(row.price) : 0,
                sell: row.sell !== false, buy: row.buy !== false });
        }
        // two levels holding the same number of base units are the same size: refused (a scan could mean either)
        var sizes = {};
        for (var k = 0; k < packs.length; k++) { var key = String(packs[k].per); if (sizes[key]) return { ok: false, error: '"' + sizes[key] + '" and "' + packs[k].name + '" hold the same amount.' }; sizes[key] = packs[k].name; }
        return { ok: true, packs: packs.sort(function (a, b) { return b.per - a.per; }) };
    }
    // base qty -> [{ name, n }] largest level first, rest in the base unit. 400 pcs with carton 200 / packet 20 -> 2 carton.
    function split(p, base) {
        var q = r3(base), neg = q < 0; q = Math.abs(q);
        var out = [];
        levels(p).forEach(function (l) { var per = Number(l.per); if (per > 0 && q + 1e-9 >= per) { var n = Math.floor((q + 1e-9) / per); out.push({ name: l.name, n: n, id: l.id }); q = r3(q - n * per); } });
        if (q > 0 || !out.length) out.push({ name: (p && p.unit) || 'pcs', n: q, id: 'base' });
        if (neg) out.forEach(function (x) { x.n = -x.n; });
        return out;
    }
    function label(p, base) {
        if (!levels(p).length) return null;
        return split(p, base).filter(function (x) { return x.n !== 0; }).map(function (x) { return x.n + ' ' + x.name; }).join(' + ') || ('0 ' + ((p && p.unit) || 'pcs'));
    }
    function toBase(p, qty, levelId) { var per = perOf(p, levelId); return per > 0 ? r3(Number(qty) * per) : NaN; }
    // what one unit of a level costs, from the base cost (and the other way round)
    function levelCost(p, levelId, baseCost) { return r2(Number(baseCost || 0) * perOf(p, levelId)); }
    function baseCostFrom(p, levelId, packCost) { var per = perOf(p, levelId); return per > 0 ? r6(Number(packCost) / per) : NaN; }
    // a scanned code that is a PACKAGE barcode -> { product, level }
    function findPackBarcode(inv, code) {
        var c = low(code); if (!c) return null;
        for (var i = 0; i < (inv || []).length; i++) { var p = inv[i]; if (!p || p._deleted === true) continue; var l = levels(p).find(function (x) { return x.barcode && low(x.barcode) === c; }); if (l) return { product: p, level: l }; }
        return null;
    }
    // the cart line's multiplier: saleMode 'pack:<id>' (or line.packPer as recorded at the time of sale - a later edit of the level never
    // changes what an old line meant)
    function linePer(line, p) {
        if (!line) return 1;
        var m = /^pack:(.+)$/.exec(str(line.saleMode || line.variantSaleMode));
        if (!m) return 1;
        if (Number(line.packPer) > 0) return Number(line.packPer);
        var per = perOf(p, m[1]);
        return per > 0 ? per : 1;
    }

    /* ======================= 3. LOTS (Pharmacy + Hospital) ======================= */
    var LOT_STATUS = { ok: 'Usable', quarantine: 'Quarantined', recalled: 'Recalled', damaged: 'Damaged' };
    function lotNo(b) { return str(b && (b.batchNumber || b.batchNo)).trim(); }
    function lotExpired(b, today) { var e = str(b && b.expiryDate); return !!e && e !== NOEXP && e < (today || todayIso()); }
    function lotBlocked(b) { var s = b && b.status; return !!s && s !== 'ok'; }
    function lotUsable(b, today) { return !!b && (Number(b.qty) || 0) > 0 && !lotBlocked(b) && !lotExpired(b, today); }
    function lotTracked(p) { return !!p && Array.isArray(p.batches) && p.batches.length > 0 && !p.dualUnit; }
    function policy() { try { var v = localStorage.getItem('se_lot_policy'); return v === 'fifo' ? 'fifo' : 'fefo'; } catch (e) { return 'fefo'; } }
    // the order a sale takes stock in: FEFO = earliest expiry first (no expiry last), oldest received breaks a tie; FIFO = oldest received first
    function order(list, pol) {
        pol = pol || policy();
        var idx = new Map(); list.forEach(function (b, i) { idx.set(b, i); });
        var exp = function (b) { return str(b.expiryDate) || NOEXP; };
        var rec = function (b) { return Number(b.receivedAt) || 0; };
        return list.slice().sort(function (a, b) {
            if (pol === 'fifo') return (rec(a) - rec(b)) || exp(a).localeCompare(exp(b)) || (idx.get(a) - idx.get(b));
            return exp(a).localeCompare(exp(b)) || (rec(a) - rec(b)) || (idx.get(a) - idx.get(b));
        });
    }
    function usableQty(p, today) { if (!lotTracked(p)) return null; return r3(p.batches.reduce(function (s, b) { return s + (lotUsable(b, today) ? Number(b.qty) || 0 : 0); }, 0)); }
    function lotSummary(p, today) {
        var t = today || todayIso(), o = { usable: 0, expired: 0, blocked: 0, noCost: 0, lots: 0 };
        (p && Array.isArray(p.batches) ? p.batches : []).forEach(function (b) { var q = Number(b && b.qty) || 0; if (q <= 0) return; o.lots++; if (lotBlocked(b)) o.blocked = r3(o.blocked + q); else if (lotExpired(b, t)) o.expired = r3(o.expired + q); else o.usable = r3(o.usable + q); if (!(Number(b.cost) >= 0 && b.cost !== null && b.cost !== undefined && b.cost !== '')) o.noCost = r3(o.noCost + q); });
        return o;
    }
    // Make the batches add up to the item's quantity before using them. Stock with no batch on file (from before batches were kept, or added outside
    // the batch screens) becomes ONE "Stock before batches" batch with NO cost and no expiry (nothing invented: it shows as unknown in the cost check);
    // a shortfall made outside the engine (a stock count, an adjustment) comes off the soonest-expiring batch first - the same rule as stockAlignBatches
    // and the server (applyStockLedger), so all sides agree.
    function align(p) {
        if (!p) return;
        if (!Array.isArray(p.batches)) p.batches = [];
        var sum = r3(p.batches.reduce(function (s, b) { return s + (Number(b && b.qty) || 0); }, 0));
        var diff = r3((Number(p.qty) || 0) - sum);
        if (diff > 0) {
            var nb = { id: uid('pre-'), batchNumber: 'Stock before batches', expiryDate: NOEXP, qty: diff, cost: null, receivedAt: 0, src: 'untracked', status: 'ok' };
            if (p.batches.some(function (x) { return x && 'batchNo' in x; })) nb.batchNo = nb.batchNumber;
            p.batches.push(nb);
        } else if (diff < 0) {
            var sorted = p.batches.slice().sort(function (a, b) { return (str(a.expiryDate) || NOEXP).localeCompare(str(b.expiryDate) || NOEXP); });
            for (var i = 0; i < sorted.length && diff < 0; i++) { var t = Math.min(Number(sorted[i].qty) || 0, -diff); sorted[i].qty = r3((Number(sorted[i].qty) || 0) - t); diff = r3(diff + t); }
            p.batches = p.batches.filter(function (b) { return (Number(b.qty) || 0) > 0; });
        }
    }
    function snap(b) { return { id: b.id, b: lotNo(b) || null, e: str(b.expiryDate) || null, c: (b.cost === null || b.cost === undefined || b.cost === '') ? null : Number(b.cost), r: Number(b.receivedAt) || null, s: b.supplier || null }; }
    function refreshAgg(p) {
        p.batches = p.batches.filter(function (b) { return (Number(b.qty) || 0) > 0; });
        p.qty = r3(p.batches.reduce(function (s, b) { return s + (Number(b.qty) || 0); }, 0));
        var live = p.batches.filter(function (b) { return !lotBlocked(b); });
        var src = live.length ? live : p.batches;
        p.expiryDate = src.length ? src.reduce(function (mn, b) { var e = str(b.expiryDate) || NOEXP; return e < mn ? e : mn; }, str(src[0].expiryDate) || NOEXP) : (p.expiryDate || null);
    }
    // Take `qty` (base units) from the batches. opts: { today, pol, lotId (a chosen batch - an authorised override), force (use anything left
    // after the usable stock: only for stock that already physically left, e.g. a held bill released after a batch expired) }
    // -> { allocs: [{ id, b, e, c, r, s, q, forced? }], short, cost, unknownCost }
    function consume(p, qty, opts) {
        opts = opts || {};
        var need = r3(qty), allocs = [];
        if (!lotTracked(p) || !(need > 0)) return { allocs: allocs, short: need > 0 ? need : 0, cost: 0, unknownCost: 0 };
        align(p);
        var t = opts.today || todayIso();
        var list = order(p.batches.filter(function (b) { return lotUsable(b, t); }), opts.pol);
        // an authorised override (a manager chose this usable batch to go first, with a reason): only ever a USABLE batch
        var firstId = opts.lotId || (p.lotFirst && p.lotFirst.id) || null;
        if (firstId) { var pick = list.find(function (b) { return b.id === firstId; }); if (pick) list = [pick].concat(list.filter(function (b) { return b !== pick; })); else if (p.lotFirst && !opts.lotId && !p.batches.some(function (b) { return b && b.id === firstId && (Number(b.qty) || 0) > 0; })) delete p.lotFirst; }   // ends only when that batch is gone (a blocked batch is skipped meanwhile)
        var take = function (b, forced) { if (need <= 0) return; var q = Math.min(need, Number(b.qty) || 0); if (q <= 0) return; b.qty = r3((Number(b.qty) || 0) - q); need = r3(need - q); var a = snap(b); a.q = r3(q); if (forced) a.forced = true; allocs.push(a); };
        list.forEach(function (b) { take(b, false); });
        if (need > 0 && opts.force) order(p.batches.filter(function (b) { return (Number(b.qty) || 0) > 0 && b.status !== 'recalled'; }), 'fefo').forEach(function (b) { take(b, true); });
        refreshAgg(p);
        var cost = 0, unknown = 0;
        allocs.forEach(function (a) { if (a.c === null) unknown = r3(unknown + a.q); else cost += a.c * a.q; });
        return { allocs: allocs, short: need, cost: r2(cost), unknownCost: unknown };
    }
    // cost per unit of what a sale took: the batches' own costs; batches with no cost on file use `fallback` (the item's cost price at the time)
