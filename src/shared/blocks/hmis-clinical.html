<!-- HMIS CLINICAL (zip 259) ---------------------------------------------------------------------------------------------------------
     Hospital only. (1) ONE consolidated prescription per prescribing event: every medicine on it, with Availability (Available / NA),
     Prescribed, Dispensed and Outstanding. NA = this facility cannot supply it (not stocked, out of stock, or declined at the counter);
     availability is read from stock, dispensing is read from the charge - the two are kept apart. (2) A preloaded, configurable lab
     catalogue (small overrides are stored, the starter list lives in code) with a "Request Lab" picker and structured result forms
     (urinalysis etc.: draft -> final -> verified, printable). (3) Inpatient: one admission account (bed + lab + medicines + meals +
     services - deposits/payments = balance), bed transfer without double occupancy, meals with duplicate prevention, MAR with
     given/withheld/refused/missed, discharge statement. Nothing is preloaded with patient findings; every function is guarded. -->
<style id="hcl-css">

<script>
(function () {
  'use strict';
  if (typeof document === 'undefined') return;
  var W = window;
  function esc(s) { return (typeof escapeHtml === 'function') ? escapeHtml(String(s == null ? '' : s)) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { /* none */ } }
  function money(n) { return 'KES ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fdt(t) { return t ? new Date(t).toLocaleString('en-GB') : '—'; }
  function who() { try { return activeServerName(); } catch (e) { return ''; } }
  function uid() { try { return genSaleId(); } catch (e) { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); } }
  function save() {
    try { safeSetItem('pos_hmis_config', JSON.stringify(hmisConfig)); } catch (e) { /* storage full */ }
    try { queuePush(); } catch (e) { /* offline */ }
  }
  function audit(a, b, c) { try { logAudit(a, b, c); } catch (e) { /* best effort */ } }
  function can() { return true; }     // permission model: the app's tab locks / staff roles gate who reaches these screens (see docs/HMIS_ZIP_259.md)

  /* ======================================================================= 1. PRESCRIPTION ======================================== */
  function stockOf(product, mode) { try { return getAvailableStock(product, mode || undefined); } catch (e) { return product && product.stock != null ? Number(product.stock) : 0; } }
  // rows: [{name, qty, unit, dosage, avail:'Available'|'NA', why, dispensed, outstanding, state}]
  function rxRowsFromDraft() {
    var out = [];
    (typeof visitMedicationDraft !== 'undefined' ? visitMedicationDraft : []).forEach(function (r) {
      if (r.notStocked) {
        var nm = (r.freeName || '').trim(); if (!nm) return;
        out.push({ name: nm, qty: parseFloat(r.qty) || 1, unit: '', dosage: (r.dosage || '').trim(), avail: 'NA', why: 'Not stocked at this facility', dispensed: 0, state: 'external' });
      } else if (r.code) {
        var p = inventory.find(function (x) { return x.code === r.code; });
        var q = parseFloat(r.qty) || 1, mode = r.saleMode === 'piece' ? 'piece' : undefined;
        var have = p ? stockOf(p, mode) : 0;
        out.push({ name: p ? p.name : '(unknown medication)', qty: q, unit: p ? (r.saleMode === 'piece' ? 'pcs' : p.unit) : '', dosage: (r.dosage || '').trim(),
          avail: (p && have >= q) ? 'Available' : 'NA', why: !p ? 'Unknown item' : (have <= 0 ? 'Out of stock' : (have < q ? 'Only ' + have + ' in stock' : '')), dispensed: 0, state: 'planned' });
      }
    });
    return out;
  }
  function rxRowsFromVisit(ref) {
    var visit = visits.find(function (v) { return v.ref === ref; });
    var charges = patientCharges.filter(function (c) { return c.ref === ref && c.kind === 'medication'; });
    var out = [], used = {};
    ((visit && visit.medications) || []).forEach(function (m) {
      if (m.notStocked) { out.push({ name: m.name, qty: m.qty, unit: m.unit || '', dosage: m.dosage || '', avail: 'NA', why: 'Not stocked at this facility', dispensed: 0, state: 'external' }); return; }
      var c = charges.find(function (x) { return !used[x.id] && ((m.code && x.code === m.code) || x.name === m.name); });
      if (c) used[c.id] = 1;
      out.push(rowFromCharge(m, c));
    });
    charges.forEach(function (c) { if (!used[c.id]) out.push(rowFromCharge(c, c)); });
    return out;
  }
  function rowFromCharge(m, c) {
    var row = { name: m.name, qty: m.qty, unit: m.unit || (c && c.unit) || '', dosage: m.dosage || (c && c.dosage) || '', avail: 'Available', why: '', dispensed: 0, state: 'awaiting' };
    if (!c) { row.state = 'planned'; return row; }
    if (c.status === 'declined') { row.avail = 'NA'; row.why = c.declinedReason || 'Not carried today'; row.state = 'external'; return row; }
    if (c.dispensedAt || c.dispenseState === 'dispensed') { row.dispensed = c.qty; row.state = 'dispensed'; }
    else if (c.status === 'unpaid') row.state = 'awaiting payment';
    else row.state = 'awaiting dispensing';
    return row;
  }
  function renderRx(patient, rows, meta) {
    var na = rows.filter(function (r) { return r.avail === 'NA'; }).length;
    var body = rows.map(function (r) {
      var out = r.avail === 'NA' ? 0 : Math.max(0, (Number(r.qty) || 0) - (Number(r.dispensed) || 0));
      return '<tr><td>' + esc(r.name) + '</td><td>' + esc(String(r.qty)) + ' ' + esc(r.unit) + '</td><td>' + esc(r.dosage || '—') + '</td>' +
        '<td>' + (r.avail === 'NA' ? '<span class="hc-na">NA</span>' : '<span class="hc-av">Available</span>') + (r.why ? '<div style="font-size:11px;color:#7f8c8d">' + esc(r.why) + '</div>' : '') + '</td>' +
        '<td>' + esc(String(r.dispensed || 0)) + '</td><td>' + (r.avail === 'NA' ? '—' : esc(String(out))) + '</td></tr>';
    }).join('');
    var biz = (businessName || 'Clinic');
    document.getElementById('sales-report-body').innerHTML =
      '<h2>' + esc(biz.toUpperCase()) + '</h2><div class="report-meta">PRESCRIPTION<br>Patient: ' + esc(patient ? patient.name : '') + ' (' + esc(patient ? patient.id : '') + ')' +
      (patient ? ' — ' + esc(typeof hmisAgeText === 'function' ? hmisAgeText(patient) : String(patient.age || '?') + ' yrs') + ', ' + esc(patient.sex || '?') : '') + '<br>' + (meta.diagnosis ? 'Diagnosis: ' + esc(meta.diagnosis) + '<br>' : '') +
      (meta.ref ? 'Ref: ' + esc(meta.ref) + '<br>' : '') + 'Prescribed by: ' + esc(meta.by || who()) + '<br>Date: ' + esc(meta.when) + '</div>' +
      '<style>.hc-rx{width:100%;table-layout:auto}.hc-rx th,.hc-rx td{padding:6px 5px!important;font-size:12px!important;}.hc-rx th{white-space:nowrap;font-size:11px!important}.hc-rx td{word-break:break-word}</style><table class="hc-rx"><thead><tr><th>Medication</th><th>Prescribed</th><th>Dosage / Instructions</th><th>Availability</th><th>Dispensed</th><th>Outstanding</th></tr></thead><tbody>' + body + '</tbody></table>' +
      (na ? '<p style="margin-top:10px"><strong>NA</strong> = not available at this facility — buy from an outside pharmacy. The rest is dispensed here after payment.</p>' : '') +
      (patient && patient.allergies ? '<p style="margin-top:14px;font-weight:bold;color:#c0392b">⚠️ Known allergies: ' + esc(patient.allergies) + '</p>' : '');
    var sep = '-'.repeat(32);
    lastReportText = [biz.toUpperCase(), 'PRESCRIPTION', 'Patient: ' + (patient ? patient.name + ' (' + patient.id + ')' : ''), meta.diagnosis ? 'Diagnosis: ' + meta.diagnosis : '', 'Prescribed by: ' + (meta.by || who()), 'Date: ' + meta.when, sep]
      .concat(rows.map(function (r) { return r.name + ' — ' + r.qty + ' ' + r.unit + ' — ' + (r.dosage || '-') + ' — ' + (r.avail === 'NA' ? 'NA' : 'Available') + ' — dispensed ' + (r.dispensed || 0) + (r.avail === 'NA' ? '' : ' / outstanding ' + Math.max(0, (Number(r.qty) || 0) - (Number(r.dispensed) || 0))); }))
      .concat([sep, na ? 'NA = not available here; buy from an outside pharmacy.' : '', patient && patient.allergies ? 'ALLERGIES: ' + patient.allergies : '']).filter(Boolean).join('\n');
    document.getElementById('sales-report-modal').style.display = 'flex';
  }
  W.printPrescription = function () {
    if (!currentVisitPatientId) return;
    var patient = patients.find(function (p) { return p.id === currentVisitPatientId; }); if (!patient) return;
    var rows = rxRowsFromDraft();
    if (!rows.length) { toast('Add at least one medication before printing a prescription.', true); return; }
    var dx = ''; try { dx = document.getElementById('visit-diagnosis-input').value.trim(); } catch (e) { /* none */ }
    renderRx(patient, rows, { diagnosis: dx, when: new Date().toLocaleString('en-GB') });
  };
  W.printExternalPrescriptionForRef = function (ref) {
    var visit = visits.find(function (v) { return v.ref === ref; });
    var pid = visit ? visit.patientId : (patientCharges.find(function (c) { return c.ref === ref; }) || {}).patientId;
    var patient = patients.find(function (p) { return p.id === pid; });
    var rows = rxRowsFromVisit(ref);
    if (!rows.length) { toast('Nothing to print for this prescription.', true); return; }
    renderRx(patient, rows, { diagnosis: visit && visit.diagnosis, ref: ref, by: visit && visit.seenBy, when: new Date(visit ? (visit.timestamp || Date.now()) : Date.now()).toLocaleString('en-GB') });
  };
  W.hmisRxRows = { fromDraft: rxRowsFromDraft, fromVisit: rxRowsFromVisit };

  /* ======================================================================= 2. LAB CATALOGUE ======================================== */
  var NEG = ['Negative', 'Not seen', 'Normal', 'Nil'];
  var LVL = ['Negative', 'Trace', '+', '++', '+++', '++++'];
  function F(k, label, type, unit, ref, opts, group, normal) { return { k: k, label: label, type: type || 'text', unit: unit || '', ref: ref || '', opts: opts || null, group: group || '', normal: normal || null }; }
  var LABP = { urinalysis: 300, upt: 300, fbc: 800, hb: 300, esr: 300, bg: 400, mrdt: 300, mps: 300, rbs: 200, fbs: 200, rft: 1500, lft: 1800, lipid: 2000, gram: 500, hiv: 300, vdrl: 400, hbsag: 500, hpylori: 800, widal: 500, sputum: 600 };
  function T(id, name, cat, code, specimen, how, fields, tat) { return { id: 'lc_' + id, type: 'labtest', name: name, category: cat, code: code, specimen: specimen, instructions: how, fields: fields, price: LABP[id] || 500, available: true, tat: tat || '1 hour', verify: true, active: true, seed: true }; }
  var POSNEG = ['Negative', 'Positive'], REAC = ['Non-reactive', 'Reactive'];
  var SEED_TESTS = [
    T('urinalysis', 'Urinalysis (Urine R/E)', 'Urinalysis', 'URN', 'Urine', 'Clean-catch midstream urine in a sterile container; examine within 1 hour.', [
      F('colour', 'Colour', 'select', '', '', ['Straw', 'Yellow', 'Dark yellow', 'Amber', 'Red', 'Brown', 'Other'], 'Macroscopy', ['Straw', 'Yellow']),
      F('appearance', 'Appearance', 'select', '', '', ['Clear', 'Slightly turbid', 'Turbid', 'Bloody'], 'Macroscopy', ['Clear']),
      F('ph', 'pH', 'number', '', '5.0-8.0', null, 'Chemistry (dipstick)'),
      F('sg', 'Specific gravity', 'number', '', '1.005-1.030', null, 'Chemistry (dipstick)'),
      F('ketones', 'Ketones', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('leucocytes', 'Leucocytes', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('blood', 'Blood', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('nitrites', 'Nitrites', 'select', '', 'Negative', POSNEG, 'Chemistry (dipstick)', NEG),
      F('protein', 'Protein', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('glucose', 'Glucose', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('bilirubin', 'Bilirubin', 'select', '', 'Negative', LVL, 'Chemistry (dipstick)', NEG),
      F('urobilinogen', 'Urobilinogen', 'select', '', 'Normal', ['Normal', '+', '++', '+++'], 'Chemistry (dipstick)', ['Normal']),
      F('rbc', 'Red blood cells', 'text', '/hpf', '0-2', null, 'Microscopy (deposits)'),
      F('pus', 'Pus cells', 'text', '/hpf', '0-5', null, 'Microscopy (deposits)'),
      F('epith', 'Epithelial cells', 'select', '', 'Few', ['Nil', 'Few', 'Moderate', 'Many'], 'Microscopy (deposits)', ['Nil', 'Few']),
      F('casts', 'Casts', 'select', '', 'Not seen', ['Not seen', 'Hyaline', 'Granular', 'Cellular', 'Other'], 'Microscopy (deposits)', NEG),
      F('crystals', 'Crystals', 'select', '', 'Not seen', ['Not seen', 'Calcium oxalate', 'Uric acid', 'Phosphate', 'Other'], 'Microscopy (deposits)', NEG),
      F('yeast', 'Yeast cells', 'select', '', 'Not seen', ['Not seen', 'Seen'], 'Microscopy (deposits)', NEG),
      F('bacteria', 'Bacteria', 'select', '', 'Not seen', ['Not seen', 'Few', 'Moderate', 'Many'], 'Microscopy (deposits)', NEG),
      F('other', 'Other findings', 'text', '', '', null, 'Microscopy (deposits)')], '30 minutes'),
    T('upt', 'Urine Pregnancy Test', 'Urinalysis', 'UPT', 'Urine', 'First-morning urine preferred.', [F('result', 'Result', 'select', '', 'Negative', POSNEG, '', ['Negative'])], '15 minutes'),
    T('fbc', 'Full Blood Count (FBC)', 'Haematology', 'FBC', 'Whole blood (EDTA)', 'EDTA (lavender) tube; mix gently.', [
      F('hb', 'Haemoglobin', 'number', 'g/dL', '11.5-16.5'), F('wbc', 'White cell count', 'number', 'x10^9/L', '4.0-11.0'), F('plt', 'Platelets', 'number', 'x10^9/L', '150-450'),
      F('hct', 'Haematocrit', 'number', '%', '36-48'), F('rbc', 'Red cell count', 'number', 'x10^12/L', '3.8-5.8'), F('mcv', 'MCV', 'number', 'fL', '80-100'),
      F('neut', 'Neutrophils', 'number', '%', '40-70'), F('lymph', 'Lymphocytes', 'number', '%', '20-45')], '1 hour'),
    T('hb', 'Haemoglobin (Hb)', 'Haematology', 'HB', 'Whole blood (EDTA)', '', [F('hb', 'Haemoglobin', 'number', 'g/dL', '11.5-16.5')], '15 minutes'),
    T('esr', 'ESR', 'Haematology', 'ESR', 'Whole blood (EDTA)', '', [F('esr', 'ESR (1 hr)', 'number', 'mm/hr', '0-20')], '1 hour'),
    T('bg', 'Blood Group & Rhesus', 'Haematology', 'BG', 'Whole blood (EDTA)', '', [F('abo', 'ABO group', 'select', '', '', ['A', 'B', 'AB', 'O']), F('rh', 'Rhesus', 'select', '', '', ['Positive', 'Negative'])], '30 minutes'),
    T('mrdt', 'Malaria RDT', 'Malaria', 'MRDT', 'Whole blood (finger prick)', 'Finger-prick blood on the cassette; read at 15 minutes.', [F('result', 'Result', 'select', '', 'Negative', ['Negative', 'Positive (P. falciparum)', 'Positive (non-falciparum)', 'Positive (mixed)', 'Invalid'], '', ['Negative'])], '15 minutes'),
    T('mps', 'Malaria Blood Slide (BS)', 'Malaria', 'BS', 'Whole blood (finger prick)', 'Thick and thin film.', [F('result', 'Parasites', 'select', '', 'Not seen', ['Not seen', 'Seen'], '', NEG), F('species', 'Species', 'select', '', '', ['', 'P. falciparum', 'P. vivax', 'P. malariae', 'P. ovale', 'Mixed']), F('density', 'Parasite density', 'text', '/uL', '')], '1 hour'),
    T('rbs', 'Random Blood Sugar', 'Chemistry', 'RBS', 'Capillary / venous blood', '', [F('glu', 'Glucose', 'number', 'mmol/L', '3.9-7.8')], '15 minutes'),
    T('fbs', 'Fasting Blood Sugar', 'Chemistry', 'FBS', 'Venous blood (fasting 8h)', 'Patient fasting 8-12 hours.', [F('glu', 'Glucose', 'number', 'mmol/L', '3.9-5.6')], '30 minutes'),
    T('rft', 'Renal Function (U&E)', 'Chemistry', 'RFT', 'Serum', 'Plain/gel tube.', [F('urea', 'Urea', 'number', 'mmol/L', '2.5-7.8'), F('creat', 'Creatinine', 'number', 'umol/L', '45-110'), F('na', 'Sodium', 'number', 'mmol/L', '135-145'), F('k', 'Potassium', 'number', 'mmol/L', '3.5-5.1'), F('cl', 'Chloride', 'number', 'mmol/L', '98-107')], '2 hours'),
    T('lft', 'Liver Function (LFT)', 'Chemistry', 'LFT', 'Serum', 'Plain/gel tube.', [F('alt', 'ALT', 'number', 'U/L', '0-40'), F('ast', 'AST', 'number', 'U/L', '0-40'), F('alp', 'ALP', 'number', 'U/L', '40-130'), F('tbil', 'Total bilirubin', 'number', 'umol/L', '3-21'), F('alb', 'Albumin', 'number', 'g/L', '35-50')], '2 hours'),
    T('lipid', 'Lipid Profile', 'Chemistry', 'LIP', 'Serum (fasting)', 'Fasting 10-12 hours.', [F('chol', 'Total cholesterol', 'number', 'mmol/L', '0-5.2'), F('tg', 'Triglycerides', 'number', 'mmol/L', '0-1.7'), F('hdl', 'HDL', 'number', 'mmol/L', '1.0-2.2'), F('ldl', 'LDL', 'number', 'mmol/L', '0-3.4')], '3 hours'),
    T('stoolOP', 'Stool Microscopy (O&P)', 'Stool', 'STO', 'Stool', 'Fresh stool in a clean wide-mouth container.', [F('consistency', 'Consistency', 'select', '', '', ['Formed', 'Soft', 'Loose', 'Watery']), F('blood', 'Blood', 'select', '', 'Absent', ['Absent', 'Present'], '', ['Absent']), F('mucus', 'Mucus', 'select', '', 'Absent', ['Absent', 'Present'], '', ['Absent']), F('ova', 'Ova / cysts / parasites', 'text', '', 'None seen')], '1 hour'),
    T('stoolOB', 'Stool Occult Blood', 'Stool', 'SOB', 'Stool', '', [F('result', 'Result', 'select', '', 'Negative', POSNEG, '', ['Negative'])], '1 hour'),
    T('urineCS', 'Urine Culture & Sensitivity', 'Microbiology', 'UCS', 'Midstream urine (sterile)', 'Sterile container; deliver within 2 hours.', [F('growth', 'Growth', 'select', '', 'No growth', ['No growth', 'Growth'], '', ['No growth']), F('organism', 'Organism', 'text', '', ''), F('count', 'Colony count', 'text', 'CFU/mL', ''), F('sens', 'Sensitivity', 'text', '', '')], '48 hours'),

    T('woundCS', 'Wound / Swab Culture', 'Microbiology', 'WCS', 'Swab', '', [F('growth', 'Growth', 'select', '', 'No growth', ['No growth', 'Growth'], '', ['No growth']), F('organism', 'Organism', 'text', '', ''), F('sens', 'Sensitivity', 'text', '', '')], '48 hours'),
    T('hiv', 'HIV Screening', 'Serology', 'HIV', 'Blood / serum', 'Pre- and post-test counselling required.', [F('result', 'Result', 'select', '', 'Non-reactive', REAC, '', ['Non-reactive'])], '30 minutes'),

    T('sputum', 'Sputum AFB / GeneXpert', 'Other', 'AFB', 'Sputum', 'Early-morning sputum in a sterile container.', [F('result', 'Result', 'select', '', 'Not detected', ['Not detected', 'Detected', 'Detected (RIF resistance)', 'Invalid'], '', ['Not detected'])], '3 hours')
  ];
  /* zip 269: the rest of the tests a Kenyan laboratory offers (the KMLTTB laboratory classification schedule, Class B to F, plus the menus of the
     county, referral and private laboratories), so a clinician only types a few letters or picks from the list. Each has ONE result field; the
     reference ranges here are common adult figures - set your own laboratory's ranges in Lab catalogue. The 29 tests above keep their detailed result forms.
     line = Category | Test name | Specimen | kind | unit | reference | turnaround
     kind: n number, p negative/positive, r reactive/non-reactive, t short text, x free-text report, g culture (growth + organism + sensitivity) */
  var KE_TESTS = [

  function marPrice() {
