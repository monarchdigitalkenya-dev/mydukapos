<!-- HMIS CLINICAL (zip 259) ---------------------------------------------------------------------------------------------------------
     Hospital only. (1) ONE consolidated prescription per prescribing event: every medicine on it, with Availability (Available / NA),
     Prescribed, Dispensed and Outstanding. NA = this facility cannot supply it (not stocked, out of stock, or declined at the counter);
     availability is read from stock, dispensing is read from the charge - the two are kept apart. (2) A preloaded, configurable lab
     catalogue (small overrides are stored, the starter list lives in code) with a "Request Lab" picker and structured result forms
     (urinalysis etc.: draft -> final -> verified, printable). (3) Inpatient: one admission account (bed + lab + medicines + meals +
     services - deposits/payments = balance), bed transfer without double occupancy, meals with duplicate prevention, MAR with
     given/withheld/refused/missed, discharge statement. Nothing is preloaded with patient findings; every function is guarded. -->
<style id="hc-css">

<script>
(function () {
  'use strict';
  if (typeof document === 'undefined') return;
  var W = window;
  function esc(s) { return (typeof escapeHtml === 'function') ? escapeHtml(String(s == null ? '' : s)) : String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { /* none */ } }
  function money(n) { return 'KES ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fdt(t) { return t ? new Date(t).toLocaleString('en-GB') : '—'; }
  function who() { try { return activeServerName(); } catch (e) { return ''; } }
  function uid() { try { return genSaleId(); } catch (e) { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); } }
  function save() {
    try { safeSetItem('pos_hmis_config', JSON.stringify(hmisConfig)); } catch (e) { /* storage full */ }
    try { queuePush(); } catch (e) { /* offline */ }
  }
  function audit(a, b, c) { try { logAudit(a, b, c); } catch (e) { /* best effort */ } }
  function can() { return true; }     // permission model: the app's tab locks / staff roles gate who reaches these screens (see docs/HMIS_ZIP_259.md)

  /* ======================================================================= 1. PRESCRIPTION ======================================== */
  function stockOf(product, mode) { try { return getAvailableStock(product, mode || undefined); } catch (e) { return product && product.stock != null ? Number(product.stock) : 0; } }
  // rows: [{name, qty, unit, dosage, avail:'Available'|'NA', why, dispensed, outstanding, state}]
  function rxRowsFromDraft() {
    var out = [];
    (typeof visitMedicationDraft !== 'undefined' ? visitMedicationDraft : []).forEach(function (r) {
      if (r.notStocked) {
        var nm = (r.freeName || '').trim(); if (!nm) return;
        out.push({ name: nm, qty: parseFloat(r.qty) || 1, unit: '', dosage: (r.dosage || '').trim(), avail: 'NA', why: 'Not stocked at this facility', dispensed: 0, state: 'external' });
      } else if (r.code) {
        var p = inventory.find(function (x) { return x.code === r.code; });
        var q = parseFloat(r.qty) || 1, mode = r.saleMode === 'piece' ? 'piece' : undefined;
        var have = p ? stockOf(p, mode) : 0;
        out.push({ name: p ? p.name : '(unknown medication)', qty: q, unit: p ? (r.saleMode === 'piece' ? 'pcs' : p.unit) : '', dosage: (r.dosage || '').trim(),
          avail: (p && have >= q) ? 'Available' : 'NA', why: !p ? 'Unknown item' : (have <= 0 ? 'Out of stock' : (have < q ? 'Only ' + have + ' in stock' : '')), dispensed: 0, state: 'planned' });
      }
    });
    return out;
  }
  function rxRowsFromVisit(ref) {
    var visit = visits.find(function (v) { return v.ref === ref; });
    var charges = patientCharges.filter(function (c) { return c.ref === ref && c.kind === 'medication'; });
    var out = [], used = {};
    ((visit && visit.medications) || []).forEach(function (m) {
      if (m.notStocked) { out.push({ name: m.name, qty: m.qty, unit: m.unit || '', dosage: m.dosage || '', avail: 'NA', why: 'Not stocked at this facility', dispensed: 0, state: 'external' }); return; }
      var c = charges.find(function (x) { return !used[x.id] && ((m.code && x.code === m.code) || x.name === m.name); });
      if (c) used[c.id] = 1;
      out.push(rowFromCharge(m, c));
    });
    charges.forEach(function (c) { if (!used[c.id]) out.push(rowFromCharge(c, c)); });
    return out;
  }
  function rowFromCharge(m, c) {
    var row = { name: m.name, qty: m.qty, unit: m.unit || (c && c.unit) || '', dosage: m.dosage || (c && c.dosage) || '', avail: 'Available', why: '', dispensed: 0, state: 'awaiting' };
    if (!c) { row.state = 'planned'; return row; }
    if (c.status === 'declined') { row.avail = 'NA'; row.why = c.declinedReason || 'Not carried today'; row.state = 'external'; return row; }
    if (c.dispensedAt || c.dispenseState === 'dispensed') { row.dispensed = c.qty; row.state = 'dispensed'; }
    else if (c.status === 'unpaid') row.state = 'awaiting payment';
    else row.state = 'awaiting dispensing';
    return row;
  }
  function renderRx(patient, rows, meta) {
    var na = rows.filter(function (r) { return r.avail === 'NA'; }).length;
    var body = rows.map(function (r) {
      var out = r.avail === 'NA' ? 0 : Math.max(0, (Number(r.qty) || 0) - (Number(r.dispensed) || 0));
      return '<tr><td>' + esc(r.name) + '</td><td>' + esc(String(r.qty)) + ' ' + esc(r.unit) + '</td><td>' + esc(r.dosage || '—') + '</td>' +
        '<td>' + (r.avail === 'NA' ? '<span class="hc-na">NA</span>' : '<span class="hc-av">Available</span>') + (r.why ? '<div style="font-size:11px;color:#7f8c8d">' + esc(r.why) + '</div>' : '') + '</td>' +
        '<td>' + esc(String(r.dispensed || 0)) + '</td><td>' + (r.avail === 'NA' ? '—' : esc(String(out))) + '</td></tr>';
    }).join('');
    var biz = (businessName || 'Clinic');
    document.getElementById('sales-report-body').innerHTML =
      '<h2>' + esc(biz.toUpperCase()) + '</h2><div class="report-meta">PRESCRIPTION<br>Patient: ' + esc(patient ? patient.name : '') + ' (' + esc(patient ? patient.id : '') + ')' +
      (patient ? ' — ' + esc(String(patient.age || '?')) + ' yrs, ' + esc(patient.sex || '?') : '') + '<br>' + (meta.diagnosis ? 'Diagnosis: ' + esc(meta.diagnosis) + '<br>' : '') +
      (meta.ref ? 'Ref: ' + esc(meta.ref) + '<br>' : '') + 'Prescribed by: ' + esc(meta.by || who()) + '<br>Date: ' + esc(meta.when) + '</div>' +
      '<style>.hc-rx{width:100%;table-layout:auto}.hc-rx th,.hc-rx td{padding:6px 5px!important;font-size:12px!important;}.hc-rx th{white-space:nowrap;font-size:11px!important}.hc-rx td{word-break:break-word}</style><table class="hc-rx"><thead><tr><th>Medication</th><th>Prescribed</th><th>Dosage / Instructions</th><th>Availability</th><th>Dispensed</th><th>Outstanding</th></tr></thead><tbody>' + body + '</tbody></table>' +
      (na ? '<p style="margin-top:10px"><strong>NA</strong> = not available at this facility — buy from an outside pharmacy. The rest is dispensed here after payment.</p>' : '') +

    lastReportText = [biz.toUpperCase(), 'PRESCRIPTION', 'Patient: ' + (patient ? patient.name + ' (' + patient.id + ')' : ''), meta.diagnosis ? 'Diagnosis: ' + meta.diagnosis : '', 'Prescribed by: ' + (meta.by || who()), 'Date: ' + meta.when, sep]

      .concat([sep, na ? 'NA = not available here; buy from an outside pharmacy.' : '', patient && patient.allergies ? 'ALLERGIES: ' + patient.allergies : '']).filter(Boolean).join('\n');
    document.getElementById('sales-report-modal').style.display = 'flex';
  }

    var rows = rxRowsFromDraft();
    if (!rows.length) { toast('Add at least one medication before printing a prescription.', true); return; }
    var dx = ''; try { dx = document.getElementById('visit-diagnosis-input').value.trim(); } catch (e) { /* none */ }
    renderRx(patient, rows, { diagnosis: dx, when: new Date().toLocaleString('en-GB') });
  };
  W.printExternalPrescriptionForRef = function (ref) {
    var visit = visits.find(function (v) { return v.ref === ref; });
    var pid = visit ? visit.patientId : (patientCharges.find(function (c) { return c.ref === ref; }) || {}).patientId;
    var patient = patients.find(function (p) { return p.id === pid; });
    var rows = rxRowsFromVisit(ref);
    if (!rows.length) { toast('Nothing to print for this prescription.', true); return; }
    renderRx(patient, rows, { diagnosis: visit && visit.diagnosis, ref: ref, by: visit && visit.seenBy, when: new Date(visit ? (visit.timestamp || Date.now()) : Date.now()).toLocaleString('en-GB') });
  };
  W.hmisRxRows = { fromDraft: rxRowsFromDraft, fromVisit: rxRowsFromVisit };

  /* ======================================================================= 2. LAB CATALOGUE ======================================== */

  var LVL = ['Negative', 'Trace', '+', '++', '+++', '++++'];

      F('rbc', 'Red blood cells', 'text', '/hpf', '0-2', null, 'Microscopy (deposits)'),

    T('rbs', 'Random Blood Sugar', 'Chemistry', 'RBS', 'Capillary / venous blood', '', [F('glu', 'Glucose', 'number', 'mmol/L', '3.9-7.8')], '15 minutes'),
    T('fbs', 'Fasting Blood Sugar', 'Chemistry', 'FBS', 'Venous blood (fasting 8h)', 'Patient fasting 8-12 hours.', [F('glu', 'Glucose', 'number', 'mmol/L', '3.9-5.6')], '30 minutes'),

  }
  function ipMove() {

  function stmtHtml(a) {

    var txt = [biz.toUpperCase(), 'ADMISSION ACCOUNT STATEMENT', 'Patient: ' + pname(a), 'Admitted: ' + fdt(a.admittedAt), '-'.repeat(32), 'Bed & nursing: ' + money(A.bed)].concat(Object.keys(A.cat).map(function (k) { return (KIND[k] || k) + ': ' + money(A.cat[k].total); }), ['-'.repeat(32), 'Total: ' + money(A.total), 'Deposits/payments: ' + money(A.deposit), 'Paid at cashier: ' + money(A.chargePaid), (A.balance >= 0 ? 'Balance due: ' : 'Credit: ') + money(Math.abs(A.balance))]).join('\n');

  function ipStatement() { var a = adm(IP.id); if (!a) return; var s = stmtHtml(a); document.getElementById('sales-report-body').innerHTML = s.html; lastReportText = s.txt; document.getElementById('sales-report-modal').style.display = 'flex'; }
  W.hmisOpenInpatient = ipOpen;

  var _origConfirmDischarge = W.confirmDischarge;
  W.confirmDischarge = function () {
    var a = admissions.find(function (x) { return x.id === pendingDischargeAdmissionId; });

      var A = acct(a);

  };

    try { var s = stmtHtml(admission); document.getElementById('sales-report-body').insertAdjacentHTML('beforeend', '<hr>' + s.html.replace(/<h2[\s\S]*?<\/h3>/, '<h3>Admission account</h3>')); lastReportText += '\n' + '-'.repeat(32) + '\n' + s.txt.split('\n').slice(4).join('\n'); } catch (e) { /* summary still printed */ }
  };
  var _origAdmit = W.admitPatient;
  W.admitPatient = function () {

  };
  document.addEventListener('change', function (e) {

    var ward = bedTypes[e.target.value] || 'General', r = (policy().bedByWard || {})[ward]; if (!r) return;
    var b = document.getElementById('admit-bed-rate-input'), n = document.getElementById('admit-nursing-rate-input');
    if (b && r.bed != null && !parseFloat(b.value)) b.value = r.bed; if (n && r.nursing != null && !parseFloat(n.value)) n.value = r.nursing;
  });

  function visitSummary(pid) {
    var p = patients.find(function (x) { return x.id === pid; }); if (!p) return '';
    var vs = visits.filter(function (v) { return v.patientId === pid; }).sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
    var last = vs[0], labs = labResults.filter(function (l) { return l.patientId === pid && l.status === 'completed'; }).sort(function (a, b) { return (b.resultAt || 0) - (a.resultAt || 0); }).slice(0, 3);
    var ad = admissions.find(function (a) { return a.patientId === pid && a.status === 'admitted'; });
    var h = '<div class="hc-card" id="hc-vsum"><strong>📋 History at a glance</strong> <span class="hc-note" style="margin:0">(' + vs.length + ' previous visit' + (vs.length === 1 ? '' : 's') + ')</span>';
    if (p.allergies) h += '<div class="hc-ab">⚠️ Allergies: ' + esc(p.allergies) + '</div>';
    if (ad) h += '<div>🛏️ Currently admitted: ' + esc(ad.bedLabel) + ' since ' + fdt(ad.admittedAt) + '</div>';
    if (last) h += '<div>Last visit ' + fdt(last.timestamp) + (last.diagnosis ? ' — <b>' + esc(last.diagnosis) + '</b>' : '') + '</div>' + ((last.medications || []).length ? '<div>Last prescription: ' + last.medications.map(function (m) { return esc(m.name); }).join(', ') + '</div>' : '');
    else h += '<div class="hc-note" style="margin:0">First visit for this patient.</div>';
    if (labs.length) h += '<div>Recent results: ' + labs.map(function (l) { return esc(l.testName) + ' — ' + esc((l.resultText || '').slice(0, 60)) + (l.flag && l.flag !== 'normal' ? ' <span class="hc-ab">(' + esc(l.flag) + ')</span>' : ''); }).join('; ') + '</div>';
    return h + '<div style="margin-top:6px"><button type="button" class="hc-btn o" onclick="openPatientTimeline(\'' + esc(pid) + '\')">Full timeline</button></div></div>';
  }
  var _origOpenVisit = W.openPatientVisitModal;
  W.openPatientVisitModal = function (pid) {
    _origOpenVisit.apply(this, arguments);
    try { var old = document.getElementById('hc-vsum'); if (old) old.remove(); var warn = document.getElementById('patient-allergy-warning'); if (warn && currentVisitPatientId === pid) warn.insertAdjacentHTML('afterend', visitSummary(pid)); } catch (e) { /* summary is optional */ }
  };
  W.hmisVisitSummary = visitSummary;

  /* ---------- wiring ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target; if (!t || !t.closest) return; var b;
    if ((b = t.closest('[data-rl-cat]'))) { RL.cat = b.getAttribute('data-rl-cat'); rlRender(); }

    else if ((b = t.closest('[data-sr-act]'))) srAct(b.getAttribute('data-sr-act'));

    else if ((b = t.closest('[data-lc-edit]'))) { LC.edit = b.getAttribute('data-lc-edit'); lcRender(); }
    else if ((b = t.closest('[data-lc-toggle]'))) { var tid = b.getAttribute('data-lc-toggle'), cur = ofType('labtest').find(function (x) { return x.id === tid; }); if (cur) { putOverride(tid, { type: 'labtest', active: cur.active === false }); audit('Lab catalogue changed', cur.name, cur.active === false ? 'enabled' : 'disabled'); lcRender(); } }
    else if (t.closest('[data-lc-save]')) lcSave();
    else if (t.closest('[data-lc-back]')) { LC.edit = null; lcRender(); }

    else if (t.closest('[data-ip-refund]')) ipPay('refund');
    else if ((b = t.closest('[data-ip-rev]'))) ipReverse(b.getAttribute('data-ip-rev'));

    else if ((b = t.closest('[data-ip-discharge]'))) { document.getElementById('hc-ip').classList.remove('open'); openDischargeModal(b.getAttribute('data-ip-discharge')); }

    else if (t.closest('[data-ip-diet]')) { var a = adm(IP.id); if (a) { a.diet = val('ip-mdiet'); stampAdm(a); persistAdm(); ipRender(); toast('Diet saved.'); } }

  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'hc-rl-q') { RL.q = e.target.value; rlRender(); } if (e.target && e.target.closest && e.target.closest('#hc-sr')) srFlags(); });
  document.addEventListener('change', function (e) { if (e.target && e.target.closest && e.target.closest('#hc-sr')) srFlags(); });
  function inject() {
