<!-- M-PESA AGENT (zip 340) --------------------------------------------------------------------------------------------------------------
     A cash-and-float ledger for shops that are also M-PESA agents: Deposits, Withdrawals, Float Management, History, Reconciliation & Closing,
     Staff & Permissions and Settings, in one new tab ("📲 M-PESA Agent") under Money.

     WHAT THIS IS: the agent's OWN books. Two balances (cash in the till, e-float in the agent account) kept in whole shillings. Every entry is
     append-only: a mistake is undone by a REVERSAL entry (never by editing), and a count that does not match is fixed by a controlled ADJUSTMENT.
     WHAT THIS IS NOT: it does not talk to Safaricom, it does not check a transaction with M-PESA, and nothing here is a Safaricom receipt or
     confirmation. The slip it prints says so.

     DATA: three synced lists (mpesaAgentTx, mpesaAgentCfg, mpesaAgentClosings), merged per record by id like the cash drawer, so it works offline
     and entries made on two devices both survive. An entry's id comes from its operation id, so a double tap or a retry can never post twice.
     SERVER: functions/api/_perm-guard.js drops any entry that does not balance and holds reversals / adjustments / overrides / settings that a
     staff member has not been allowed to make. Ids and classes: mpa-*. -->

<script id="mpa-js">
(function () {
  'use strict';
  var ID = 'mpesa-agent-tab', BTN = 'mpesa-agent-tab-btn';
  var TYPES = {
    deposit: { label: 'Deposit', icon: '⬇️' }, withdrawal: { label: 'Withdrawal', icon: '⬆️' }, buy_float: { label: 'Buy float', icon: '🛒' }, sell_float: { label: 'Sell float', icon: '💱' },
    cash_in: { label: 'Cash in (replenish till)', icon: '💵' }, cash_out: { label: 'Cash out (bank / owner)', icon: '🏦' }, adjustment: { label: 'Adjustment', icon: '🛠️' }, reversal: { label: 'Reversal', icon: '↩️' }
  };
  var MAX_DEFAULT = 250000, S = { tab: 'dash', opId: '', busy: false, msg: '', f: { from: '', to: '', type: '', by: '', q: '', summary: false } };
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kes(n) { n = Number(n) || 0; return (n < 0 ? '-' : '') + 'KES ' + Math.abs(Math.round(n)).toLocaleString('en-KE'); }
  function signed(n) { n = Number(n) || 0; return (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('en-KE'); }
  function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { /* no toast */ } }
  function newOp() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function lists() { return { tx: (typeof mpesaAgentTx !== 'undefined' && Array.isArray(mpesaAgentTx)) ? mpesaAgentTx : null }; }

  /* ---------------- who is allowed what ---------------- */
  function isMgr() {
    try {
      if (typeof isAdminServing === 'function' && isAdminServing()) return true;
      var me = typeof currentServer !== 'undefined' && currentServer && staff.find(function (s) { return s.id === currentServer.id; });
      return !!(me && me.isManager);
    } catch (e) { return false; }
  }
  function meId() { try { return (typeof currentServer !== 'undefined' && currentServer && currentServer.id) || ''; } catch (e) { return ''; } }
  function meName() { try { return (typeof activeServerName === 'function' && activeServerName()) || 'Admin'; } catch (e) { return 'Admin'; } }
  function can(a) { if (isMgr()) return true; var g = (cfg().grants || {})[meId()] || []; return g.indexOf(a) >= 0; }

  /* ---------------- settings record ---------------- */
  var DEF = { id: 'cfg', openCash: 0, openFloat: 0, openAt: 0, lowCash: 5000, lowFloat: 20000, maxTx: MAX_DEFAULT, tariff: { deposit: [], withdrawal: [] }, grants: {}, setup: false };
  function cfg() {
    var arr = (typeof mpesaAgentCfg !== 'undefined' && Array.isArray(mpesaAgentCfg)) ? mpesaAgentCfg : [];
    var c = arr.find(function (x) { return x && x.id === 'cfg'; });
    return Object.assign({}, DEF, c || {}, { tariff: Object.assign({ deposit: [], withdrawal: [] }, (c && c.tariff) || {}), grants: (c && c.grants) || {} });
  }
  function saveCfg(next) {
    next = Object.assign({}, next, { id: 'cfg', updatedAt: Date.now() });
    var i = mpesaAgentCfg.findIndex(function (x) { return x && x.id === 'cfg'; });
    if (i >= 0) mpesaAgentCfg[i] = next; else mpesaAgentCfg.push(next);
    safeSetItem('pos_mpesa_agent_cfg', JSON.stringify(mpesaAgentCfg)); try { queuePush(); } catch (e) { /* the next change sends it */ }
  }
  function audit(what, detail) { try { logAudit(what, 'M-PESA Agent', detail); } catch (e) { /* optional */ } }

  /* ---------------- the ledger (pure maths) ---------------- */
  function balances(list, c) {
    var b = { cash: c.openCash || 0, float: c.openFloat || 0 };
    (list || []).forEach(function (e) { if (e && !e._deleted && !e.removed) { b.cash += e.cash || 0; b.float += e.float || 0; } });
    return b;
  }
  function parseAmount(raw, max) {
    var s = String(raw == null ? '' : raw).trim().replace(/,/g, '');
    if (!s) return { err: 'Enter the amount.' };
    if (!/^\d+$/.test(s)) return { err: 'Use whole shillings only: no decimals, signs or letters.' };
    var n = parseInt(s, 10);
    if (n <= 0) return { err: 'The amount must be more than zero.' };
    if (n > max) return { err: 'That is above the limit of ' + kes(max) + ' per transaction (Settings).' };
    return { n: n };
  }
  function deltas(type, amount, src) {
    if (type === 'deposit') return { cash: amount, float: -amount };
    if (type === 'withdrawal') return { cash: -amount, float: amount };
    if (type === 'buy_float') return { cash: src === 'cash' ? -amount : 0, float: amount };
    if (type === 'sell_float') return { cash: src === 'cash' ? amount : 0, float: -amount };
    if (type === 'cash_in') return { cash: amount, float: 0 };
    if (type === 'cash_out') return { cash: -amount, float: 0 };
    return null;
  }
  function feeFor(type, amount, c) {
    var rows = ((c.tariff || {})[type] || []).slice().sort(function (a, b) { return (a.upTo == null ? 1e15 : a.upTo) - (b.upTo == null ? 1e15 : b.upTo); });
    for (var i = 0; i < rows.length; i++) if (rows[i].upTo == null || amount <= rows[i].upTo) return Math.max(0, parseInt(rows[i].fee, 10) || 0);
    return 0;
  }
  // The one place an entry is posted. spec = { type, amount(raw), src, ref, cust, note, fee(raw), opId, override(bool), overrideReason }
  function post(spec) {
    var L = lists().tx; if (!L) return { err: 'The M-PESA ledger is not available in this app.' };
    var c = cfg();
    if (!spec.opId) return { err: 'Missing operation id.' };
    var id = 'mpa-' + spec.opId, dup = L.find(function (e) { return e && e.id === id; });
    if (dup) return { ok: true, duplicate: true, entry: dup };
    var a = parseAmount(spec.amount, c.maxTx || MAX_DEFAULT); if (a.err) return { err: a.err };
    var d = deltas(spec.type, a.n, spec.src); if (!d) return { err: 'Unknown operation.' };
    var feeRaw = spec.fee == null || spec.fee === '' ? feeFor(spec.type, a.n, c) : spec.fee, fee = parseInt(String(feeRaw).replace(/,/g, ''), 10);
    if (!(fee >= 0) || String(feeRaw).replace(/,/g, '').match(/[^\d]/)) return { err: 'The commission must be whole shillings (0 or more).' };
    var b = balances(L, c), nc = b.cash + d.cash, nf = b.float + d.float, short = [];
    if (nc < 0) short.push('cash (you have ' + kes(b.cash) + ')'); if (nf < 0) short.push('M-PESA float (you have ' + kes(b.float) + ')');
    var ov = null;
    if (short.length) {
      if (!spec.override) return { err: 'Not enough ' + short.join(' and ') + '. Top up first, or ask a manager to override.', needOverride: true };
      if (!can('override')) return { err: 'You are not allowed to post below zero. Ask a manager.' };
      if (!String(spec.overrideReason || '').trim()) return { err: 'Type the reason for posting below zero.' };
      ov = { by: meName(), reason: String(spec.overrideReason).trim().slice(0, 200), at: Date.now() };
    }
    var e = { id: id, opId: spec.opId, ts: Date.now(), type: spec.type, amount: a.n, cash: d.cash, float: d.float, fee: fee, src: spec.src || '', ref: String(spec.ref || '').trim().slice(0, 40), cust: String(spec.cust || '').trim().slice(0, 40), note: String(spec.note || '').trim().slice(0, 200), by: meName(), byId: meId(), status: 'posted', updatedAt: Date.now() };
    if (ov) e.override = ov;
    L.push(e); markPending(e.id); saveTx();
    audit('M-PESA ' + TYPES[e.type].label, kes(e.amount) + (ov ? ' (override: ' + ov.reason + ')' : ''));
    return { ok: true, entry: e };
  }
  function reverse(origId, reason, override, overrideReason) {
    var L = lists().tx, o = L.find(function (e) { return e && e.id === origId; }), c = cfg();
    if (!can('reverse')) return { err: 'Only a manager, or someone given the Reverse permission, can reverse an entry.' };
    if (!o) return { err: 'That entry was not found.' };
    if (o.type === 'reversal') return { err: 'A reversal cannot be reversed. Post the operation again instead.' };
    if (o.status === 'reversed') return { err: 'That entry is already reversed.' };
    if (!String(reason || '').trim()) return { err: 'Type the reason for the reversal.' };
    var id = 'mpa-rev-' + o.id;
    if (L.some(function (e) { return e && e.id === id; })) return { err: 'That entry is already reversed.' };
    var b = balances(L, c), nc = b.cash - o.cash, nf = b.float - o.float, ov = null;
    if (nc < 0 || nf < 0) {
      if (!override) return { err: 'Reversing this would take ' + (nc < 0 ? 'cash' : 'float') + ' below zero (' + kes(nc < 0 ? nc : nf) + ').', needOverride: true };
      if (!can('override')) return { err: 'You are not allowed to post below zero. Ask a manager.' };
      if (!String(overrideReason || '').trim()) return { err: 'Type the reason for posting below zero.' };
      ov = { by: meName(), reason: String(overrideReason).trim().slice(0, 200), at: Date.now() };
    }
    var r = { id: id, opId: id, ts: Date.now(), type: 'reversal', amount: o.amount, cash: -o.cash, float: -o.float, fee: 0, reversalOf: o.id, reason: String(reason).trim().slice(0, 200), by: meName(), byId: meId(), status: 'posted', updatedAt: Date.now() };
    if (ov) r.override = ov;
    o.status = 'reversed'; o.reversedBy = r.id; o.updatedAt = Date.now();
    L.push(r); markPending(r.id); markPending(o.id); saveTx();
    audit('M-PESA reversal', TYPES[o.type].label + ' ' + kes(o.amount) + ' (' + r.reason + ')');
    return { ok: true, entry: r };
  }
  function adjust(spec) {
    if (!can('adjust')) return { err: 'Only a manager, or someone given the Adjust permission, can post an adjustment.' };
    var L = lists().tx, cash = parseInt(String(spec.cash || '0').replace(/,/g, ''), 10), fl = parseInt(String(spec.float || '0').replace(/,/g, ''), 10);
    if (!/^-?\d+$/.test(String(spec.cash || '0').replace(/,/g, '')) || !/^-?\d+$/.test(String(spec.float || '0').replace(/,/g, ''))) return { err: 'Adjustments are whole shillings (use - for a decrease).' };
    if (!cash && !fl) return { err: 'Enter a cash and/or float change.' };
    if (!String(spec.reason || '').trim()) return { err: 'Type the reason for the adjustment.' };
    var id = 'mpa-' + spec.opId; if (L.some(function (e) { return e && e.id === id; })) return { ok: true, duplicate: true };
    var c = cfg(), b = balances(L, c), nc = b.cash + cash, nf = b.float + fl;
    var ov = null;
    if ((nc < 0 || nf < 0)) { if (!spec.override || !can('override')) return { err: 'This adjustment would take a balance below zero. A manager must tick the override and give a reason.', needOverride: true }; ov = { by: meName(), reason: String(spec.reason).trim().slice(0, 200), at: Date.now() }; }
    var e = { id: id, opId: spec.opId, ts: Date.now(), type: 'adjustment', amount: Math.abs(cash) + Math.abs(fl), cash: cash, float: fl, fee: 0, reason: String(spec.reason).trim().slice(0, 200), by: meName(), byId: meId(), status: 'posted', updatedAt: Date.now() };
    if (ov) e.override = ov;
    L.push(e); markPending(e.id); saveTx();
    audit('M-PESA adjustment', 'cash ' + signed(cash) + ', float ' + signed(fl) + ' (' + e.reason + ')');
    return { ok: true, entry: e };
  }
  function saveTx() { safeSetItem('pos_mpesa_agent_tx', JSON.stringify(mpesaAgentTx)); try { queuePush(); } catch (e) { /* the next change sends it */ } }
  function saveClosings() { safeSetItem('pos_mpesa_agent_closings', JSON.stringify(mpesaAgentClosings)); try { queuePush(); } catch (e) { /* next change sends it */ } }

  /* ---------------- pending-sync + review flags ---------------- */
  function pendingSet() { try { return JSON.parse(localStorage.getItem('pos_mpesa_pending') || '[]'); } catch (e) { return []; } }
  function markPending(id) { var p = pendingSet(); if (p.indexOf(id) < 0) { p.push(id); try { localStorage.setItem('pos_mpesa_pending', JSON.stringify(p.slice(-500))); } catch (e) { /* cosmetic */ } } }
  function isPending(e) {
    try { if (window.__extraSnapTaken && typeof extraSyncSnapshot !== 'undefined') return !extraSyncSnapshot['mpesaAgentTx:' + e.id]; } catch (x) { /* fall through */ }
    return pendingSet().indexOf(e.id) >= 0;
  }
  // entries whose running balance went below zero without an override (two offline tills can do this together), and reversals with no original
  function reviewFlags(list, c) {
    var flags = {}, run = { cash: c.openCash || 0, float: c.openFloat || 0 }, ids = {};
    list.forEach(function (e) { ids[e.id] = 1; });
    list.slice().sort(function (a, b) { return a.ts - b.ts; }).forEach(function (e) {

      if ((run.cash < 0 || run.float < 0) && !e.override) flags[e.id] = 'Balance went below zero here (two devices posting at once?). Count the till and post an adjustment if needed.';
      if (e.type === 'reversal' && !ids[e.reversalOf]) flags[e.id] = 'The entry this reverses is missing on this device.';
    });
    return flags;
  }
  function dayList(day) { return (lists().tx || []).filter(function (e) { return e && dayKey(e.ts) === day; }); }

  /* ---------------- rendering ---------------- */
  var TABS = [['dash', '📊 Dashboard'], ['deposit', '⬇️ Deposits'], ['withdrawal', '⬆️ Withdrawals'], ['float', '💱 Float Management'], ['history', '🧾 Transaction History'], ['recon', '✅ Reconciliation & Closing'], ['staff', '👥 Staff & Permissions'], ['settings', '⚙️ Settings']];
  function pill(e, flags) {
    var h = '';
    if (e.status === 'reversed') h += '<span class="mpa-pill bad">Reversed</span>';
    if (e.type === 'reversal') h += '<span class="mpa-pill">Reversal</span>';
    if (e.override) h += '<span class="mpa-pill bad" title="' + esc(e.override.reason) + '">Override</span>';
    h += isPending(e) ? '<span class="mpa-pill pend">Pending sync</span>' : '<span class="mpa-pill ok">Synced</span>';
    if (flags && flags[e.id]) h += '<span class="mpa-pill bad" title="' + esc(flags[e.id]) + '">⚠ Review</span>';
    return h;
  }
