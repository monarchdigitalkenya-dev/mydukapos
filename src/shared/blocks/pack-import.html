<!-- PACK IMPORT (zip 346) ----------------------------------------------------------------------------------------------------------
     "📥 Import boxes / packets / pieces": bring a stock list from Excel / CSV into Inventory WITH its package levels
     (box > packet > piece), so every item can be sold, restocked and counted at each level.
       - Reads TWO kinds of file:
           1. The ready-to-fill template (download it from the pop-up): one row per item with plain number columns.
           2. A supplier-style list with the text columns  "Whole/Carton/Bag | Pack/OUT/Dozen | Piece/Single"  with text like
              "1 case=6 bottles", "OUT= 6 pcs", "1 box of 12 pkts", "1 dozen"  (it is read as well as it can be; what the file does not say,
              for example how many packets are in a box, is shown in a table to type in - nothing is guessed).
       - A preview shows what will be created. Rows with something missing are listed first with boxes to fill in.
       - New items are created (stock = what was typed as opening boxes / loose packets / loose pieces). An item that already exists
         (same name or barcode) is left alone unless "update package sizes" is chosen - stock is NEVER changed for an existing item.
       - The package levels are the ones the Stock Engine already uses (product.packs), so selling at the counter by box / packet / piece,
         restock by package and the "x Box + y Packet" label all work with no other change.
     Ids / classes: pki-*. Logic is pure (window.__pki.*) so it can be tested without a screen. -->

<script id="pki-js">
(function () {
    'use strict';
    if (window.__pki) return;
    var W = window;

    /* ============================ 1. READING THE TEXT (pure) ============================ */
    function clean(s) { return String(s == null ? '' : s).replace(/[*]/g, ' ').replace(/\s+/g, ' ').trim(); }
    function isNone(s) { return !s || /^(na|n\/a|nil|none|-|--|\.)$/i.test(s); }
    function num(s) { var m = /(\d+(?:\.\d+)?)/.exec(String(s || '')); return m ? parseFloat(m[1]) : null; }
    function cap(s) { s = String(s || '').trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s; }
    function eq(a, b) { return String(a || '').toLowerCase() === String(b || '').toLowerCase(); }

    // the word for what is sold singly: "1 pc" -> pcs, "1 bottle" -> bottle, "1kg, 0.75kg" -> kg
    function pieceUnit(e) {
        e = clean(e).toLowerCase(); if (isNone(e)) return { unit: 'pcs', note: '' };
        if (/^\d*\.?\d*\s*kgs?\b/.test(e) || /\bkgs?\s*,/.test(e)) return { unit: 'kg', note: e.indexOf(',') >= 0 ? 'Sold by weight (' + e + ')' : '' };
        if (/pack of\s*\d/.test(e)) return { unit: 'pack', note: 'Sold as "' + e + '"' };
        var m = /^[\d.]*\s*([a-z`'\- ]+?)(?:\s*\(.*)?$/.exec(e); var w = m ? m[1].trim() : e;
        if (/^p?\s*pcs?$/.test(w) || /^(pc|pcs|piece|pieces|p pc)$/.test(w)) return { unit: 'pcs', note: '' };
        if (/^pack of/.test(w)) return { unit: 'pack', note: 'Sold as "' + e + '"' };
        if (/^(litre|litres|ltr|ltrs)$/.test(w)) return { unit: 'ltr', note: '' };
        if (/^(kg|kgs)$/.test(w)) return { unit: 'kg', note: '' };
        w = w.replace(/s$/, ''); if (!w) return { unit: 'pcs', note: '' };
        return { unit: w, note: '' };
    }
    function levelWord(s) {          // the name to show for a package
        s = String(s || '').toLowerCase();
        if (/dozen/.test(s)) return 'Dozen';
        if (/\bout/.test(s)) return 'Outer';
        if (/pkt|packet/.test(s)) return 'Packet';
        if (/roll/.test(s)) return 'Roll pack';
        if (/pack/.test(s)) return 'Pack';
        if (/jar/.test(s)) return 'Jar';
        return 'Packet';
    }
    function boxWord(s) {
        var m = /(box|boxes|bag|bale|bundle|jerrican|crate|case|tray|carton|sack|outers?|pack)/i.exec(String(s || ''));
        if (!m) return 'Box';
        var w = m[1].toLowerCase(); if (w === 'boxes') w = 'box'; if (/^outers?$/.test(w)) w = 'outer';
        return cap(w);
    }
    // text of the "pack / OUT / dozen" column -> { name, per } (per = pieces; null = the file does not say)
    function parsePacket(d) {
        d = clean(d); if (isNone(d)) return null;
        var low = d.toLowerCase();
        if (/^[\d,\s]+$/.test(d) || /multiples/.test(low)) return { name: 'Packet', per: null, why: 'Several packet sizes are listed (' + d + ') - type the one to use' };
        if (/dozen/.test(low)) { var n = num(low); return { name: 'Dozen', per: (n && n > 1 ? n : 1) * 12 }; }
        var m = /(?:=|\bof\b)\s*(\d+(?:\.\d+)?)/.exec(low);
        if (m) return { name: levelWord(low), per: parseFloat(m[1]) };
        m = /^(\d+(?:\.\d+)?)\s*(roll|pcs?|pieces?|sachets?|pairs?)\b/.exec(low);
        if (m && parseFloat(m[1]) > 1) return { name: levelWord(low), per: parseFloat(m[1]) };
        m = /^out\s*=?\s*(\d+(?:\.\d+)?)/.exec(low); if (m) return { name: 'Outer', per: parseFloat(m[1]) };
        return { name: levelWord(low), per: null, why: 'The file does not say how many pieces are in a ' + levelWord(low).toLowerCase() };
    }
    // text of the "whole / carton / bag" column -> { name, count, of: 'pieces' | 'packets' | null }
    function parseBox(c, pieceWord) {
        c = clean(c); if (isNone(c)) return null;
        var low = c.toLowerCase();
        var o = /^out\s*=?\s*(\d+(?:\.\d+)?)?\s*(.*)$/.exec(low);
        if (o) return { name: 'Outer', count: o[1] ? parseFloat(o[1]) : null, of: 'pieces', asPacket: true };
        var bag = /(?:bag|sack|jerrican)\s*of\s*(\d+(?:\.\d+)?)\s*kgs?/.exec(low) || /^(\d+(?:\.\d+)?)\s*kgs?\s*(bag|sack)/.exec(low);
        if (bag) return { name: /sack/.test(low) ? 'Sack' : 'Bag', count: parseFloat(bag[1]), of: 'pieces' };
        // "1 case=6 bottles", "1 box of 12 pkts", "1 box (24 pcs)", "1 tray= 30 eggs"
        var m = /^\s*\d*\s*([a-z ]+?)\s*(?:=|\bof\b|\()\s*(\d+(?:\.\d+)?)\s*([a-z`']*)/.exec(low);
        if (m) {
            var word = m[3] || '', kind = /^(pkts?|packets?|packs?|outers?|sachets?)$/.test(word) ? 'packets' : 'pieces';
            // "1 bottle = 18 litres": the same thing as the piece itself - no box level
            if (eq(m[1].replace(/s$/, ''), pieceWord) && !/^(pkts?|packets?|packs?)$/.test(word)) return { skip: true, note: 'A "' + c + '" is the piece itself' };
            return { name: boxWord(m[1]), count: parseFloat(m[2]), of: kind, word: word.replace(/s$/, '') };
        }
        // "1 box", "1 bag", "1 bale", "1 outers" - exists, size not said
        return { name: boxWord(low), count: null, of: null };
    }
    // the three text columns -> one item's structure
    function parseLegacy(c, d, e) {
        var pu = pieceUnit(e), issues = [], notes = []; if (pu.note) notes.push(pu.note);
        var pk = parsePacket(d), bx = parseBox(c, pu.unit);
        if (bx && bx.skip) { notes.push(bx.note); bx = null; }
        if (bx && bx.asPacket) {       // "OUT= 6 pcs" typed in the first column
            if (!pk) pk = { name: 'Outer', per: bx.count, why: bx.count ? '' : 'The file does not say how many pieces are in an outer' };
            bx = null;
        }
        if (pk && pk.name === 'Pack' && pu.unit === 'pack') { notes.push('The pack is the piece itself'); pk = null; }
        var r = { unit: pu.unit, pName: pk ? pk.name : '', pPer: pk ? pk.per : null, bName: bx ? bx.name : '', bPer: null, bPerOf: 'packets', notes: notes, orig: [clean(c), clean(d), clean(e)] };
        if (pk && pk.why) issues.push(pk.why);
        if (bx && pk && bx.of === 'pieces' && bx.word && pk.name.toLowerCase().indexOf(bx.word) >= 0) bx.of = 'packets';   // "1 case of 4 jars" + "1 jar of 72 pcs": the 4 counts jars
        if (bx) {
            if (bx.count == null) { issues.push('How many ' + (pk ? pk.name.toLowerCase() + 's' : r.unit) + ' in one ' + bx.name.toLowerCase() + '? The file does not say'); }
            else if (pk && bx.of === 'pieces') {       // the box count is in pieces and there is a packet level: convert
                if (pk.per && bx.count % pk.per === 0) r.bPer = bx.count / pk.per;
                else if (pk.per) { issues.push('One ' + bx.name.toLowerCase() + ' holds ' + bx.count + ' pieces, which is not a whole number of ' + pk.per + '-piece ' + pk.name.toLowerCase() + 's'); }
                else r.bPer = null;
            } else if (pk && bx.of === 'packets') r.bPer = bx.count;
            else if (!pk) { r.bPer = bx.count; r.bPerOf = 'pieces'; }   // no packet level: the box holds pieces
            else r.bPer = bx.count;
        }
        r.issues = issues; return r;
    }

    /* ============================ 2. READING THE FILE (pure) ============================ */
    function norm(h) { return String(h == null ? '' : h).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
    var COLS = {
        name: ['item name', 'item', 'name', 'product', 'product name', 'description'],
        category: ['category', 'group', 'type'],
        unit: ['piece unit', 'sold singly as', 'unit', 'base unit', 'piece'],
        pPer: ['pieces per packet', 'pieces in a packet', 'pieces in packet', 'packet size', 'per packet'],
        pName: ['packet name', 'packet word', 'pack name'],
        bPer: ['packets per box', 'packets in a box', 'packets in box', 'per box packets'],
        bPieces: ['pieces per box', 'pieces in a box', 'pieces in box', 'box size', 'per box'],
        bName: ['box name', 'box word', 'carton name'],
        boxPrice: ['box price', 'price per box', 'selling price box', 'box selling price'],
        pktPrice: ['packet price', 'price per packet', 'selling price packet', 'packet selling price'],
        pcPrice: ['piece price', 'price per piece', 'selling price piece', 'piece selling price', 'price'],
        boxCost: ['box cost', 'cost per box', 'buying price box', 'buying price per box'],
        pcCost: ['piece cost', 'cost per piece', 'buying price piece', 'buying price per piece', 'cost'],
        oBox: ['opening boxes', 'boxes', 'full boxes', 'boxes in stock'],
        oPkt: ['opening loose packets', 'loose packets', 'opening packets', 'packets'],
        oPc: ['opening loose pieces', 'loose pieces', 'opening pieces', 'pieces', 'quantity', 'qty'],
        barcode: ['barcode', 'piece barcode', 'code', 'sku'],
        pktBarcode: ['packet barcode'], boxBarcode: ['box barcode']
    };
    function findHeaderRow(rows) {
        for (var i = 0; i < Math.min(rows.length, 15); i++) {
            var r = (rows[i] || []).map(norm);
            var hasName = r.some(function (x) { return COLS.name.indexOf(x) >= 0; });
            var legacy = r.some(function (x) { return /whole|carton|bag/.test(x) && /\//.test(String((rows[i] || [])[r.indexOf(x)] || '')) || x === 'whole carton bag'; });
            var tmpl = r.some(function (x) { return COLS.pPer.indexOf(x) >= 0 || COLS.bPer.indexOf(x) >= 0 || COLS.bPieces.indexOf(x) >= 0; });
            if (hasName && (legacy || tmpl)) return { at: i, legacy: legacy && !tmpl };
        }
        return null;
    }
    function mapHeaders(hdr) {
        var map = {}, n = hdr.map(norm);
        function hit(k, h) { return COLS[k].some(function (al) { return h === al || (al.indexOf(' ') > 0 && h.indexOf(al + ' ') === 0); }); }   // "pieces per box (only if no packets)" counts as "pieces per box"
        Object.keys(COLS).forEach(function (k) { for (var j = 0; j < n.length; j++) { if (hit(k, n[j]) && map[k] === undefined && !Object.keys(map).some(function (o) { return map[o] === j; })) { map[k] = j; break; } } });
        return map;
    }
    function legacyCols(hdr) {     // S/No | Item Name | Whole/Carton/Bag | Pack/OUT/Dozen | Piece/Single
        var n = hdr.map(norm), m = { name: -1, c: -1, d: -1, e: -1 };
        n.forEach(function (h, i) {
            if (m.name < 0 && COLS.name.indexOf(h) >= 0) m.name = i;
            else if (m.c < 0 && /whole|carton|bag/.test(h)) m.c = i;
            else if (m.d < 0 && /pack|out|dozen/.test(h)) m.d = i;
            else if (m.e < 0 && /piece|single/.test(h)) m.e = i;
        });
        return m;
    }
    function cellNum(v) { if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(/[, ]/g, '')); return isFinite(n) ? n : null; }
    function mkRow(n, name) {
        return { n: n, include: true, name: name, category: '', unit: 'pcs', pName: '', pPer: null, bName: '', bPer: null, bPerOf: 'packets',
            price: { pc: null, pkt: null, box: null }, cost: { pc: null, box: null }, open: { box: null, pkt: null, pc: null }, barcode: '', pktBarcode: '', boxBarcode: '',
            notes: [], issues: [], orig: null, source: 'template' };
    }
    // rows (array of arrays) -> { format, rows: [...], skipped }
    function readSheet(rows) {
        rows = (rows || []).map(function (r) { return Array.isArray(r) ? r : []; });
        var h = findHeaderRow(rows);
        if (!h) return { format: null, rows: [], error: 'I could not find the column headings. The first row should say "Item name" and either "Whole/Carton/Bag, Pack/OUT/Dozen, Piece/Single" or the template columns.' };
        var hdr = rows[h.at], out = [], seen = 0;
        if (h.legacy) {
            var lc = legacyCols(hdr);
            for (var i = h.at + 1; i < rows.length; i++) {
                var r = rows[i], nm = clean(r[lc.name]); if (!nm) continue; seen++;
                var p = parseLegacy(r[lc.c], r[lc.d], r[lc.e]), row = mkRow(i + 1, nm);
                row.unit = p.unit; row.pName = p.pName; row.pPer = p.pPer; row.bName = p.bName; row.bPer = p.bPer; row.bPerOf = p.bPerOf; row.notes = p.notes; row.issues = p.issues.slice(); row.orig = p.orig; row.source = 'list';
                out.push(row);
            }
            return { format: 'list', rows: out, headerAt: h.at };
        }
        var mp = mapHeaders(hdr);
        for (var k = h.at + 1; k < rows.length; k++) {
            var q = rows[k], g = function (key) { return mp[key] === undefined ? '' : q[mp[key]]; };
            var name = clean(g('name')); if (!name) continue; seen++;
            if (/^(example|e\.g\.)/i.test(name) && /example/i.test(name)) continue;
            var t = mkRow(k + 1, name);
            t.category = clean(g('category')); var un = clean(g('unit')); if (un) t.unit = pieceUnit('1 ' + un).unit;
            t.pPer = cellNum(g('pPer')); t.pName = clean(g('pName')) || (t.pPer ? 'Packet' : '');
            var bp = cellNum(g('bPer')), bpc = cellNum(g('bPieces'));
            t.bName = clean(g('bName')) || ((bp || bpc) ? 'Box' : '');
            if (bp) { t.bPer = bp; t.bPerOf = 'packets'; }
            else if (bpc) { if (t.pPer) { if (bpc % t.pPer === 0) { t.bPer = bpc / t.pPer; t.bPerOf = 'packets'; } else t.issues.push('Pieces per box (' + bpc + ') is not a whole number of ' + t.pPer + '-piece packets'); } else { t.bPer = bpc; t.bPerOf = 'pieces'; } }
            t.price = { pc: cellNum(g('pcPrice')), pkt: cellNum(g('pktPrice')), box: cellNum(g('boxPrice')) };
            t.cost = { pc: cellNum(g('pcCost')), box: cellNum(g('boxCost')) };
            t.open = { box: cellNum(g('oBox')), pkt: cellNum(g('oPkt')), pc: cellNum(g('oPc')) };
            t.barcode = clean(g('barcode')); t.pktBarcode = clean(g('pktBarcode')); t.boxBarcode = clean(g('boxBarcode'));
            out.push(t);
        }
        return { format: 'template', rows: out, headerAt: h.at };
    }
    // minimal CSV reader (quotes, commas, newlines)
    function readCsv(text) {
        var rows = [], row = [], cell = '', q = false, i = 0; text = String(text || '').replace(/^﻿/, '');
        for (; i < text.length; i++) {
            var ch = text[i];
            if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
            else if (ch === '"') q = true;
            else if (ch === ',') { row.push(cell); cell = ''; }
            else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
            else if (ch !== '\r') cell += ch;
        }
        if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
        return rows;
    }

    /* ============================ 3. CHECK A ROW + BUILD ITS LEVELS ============================ */
    function perOfRow(r) {            // pieces in one box (null when unknown)
        if (!r.bPer) return null;
        if (r.bPerOf === 'pieces') return r.bPer;
        return r.pPer ? r.bPer * r.pPer : null;
    }
    function levelRows(r) {
        var rows = [], used = {};
        function uniq(nm) { var base = nm, k = 2; while (used[nm.toLowerCase()] || nm.toLowerCase() === String(r.unit).toLowerCase()) { nm = base + ' ' + k++; } used[nm.toLowerCase()] = 1; return nm; }
        var pn = null;
        if (r.pPer > 0) { pn = uniq(r.pName || 'Packet'); rows.push({ name: pn, parent: 'base', count: r.pPer, price: r.price.pkt || 0, barcode: r.pktBarcode }); }
        if (r.bPer > 0) {
            var bn = uniq(r.bName || 'Box');
            if (r.bPerOf === 'pieces' || !pn) rows.push({ name: bn, parent: 'base', count: r.bPerOf === 'pieces' ? r.bPer : r.bPer, price: r.price.box || 0, barcode: r.boxBarcode });
            else rows.push({ name: bn, parent: pn, count: r.bPer, price: r.price.box || 0, barcode: r.boxBarcode });
        }
        return rows;
    }
    // one row -> { issues[], packs[], baseQty, status }
    function check(r, SE) {
        var issues = (r.issues || []).slice(), packs = [];
        if (!r.name) issues.push('No item name');
        if (r.pPer != null && !(r.pPer > 0)) issues.push('Pieces per packet must be above 0');
        if (r.bPer != null && !(r.bPer > 0)) issues.push('Count per ' + (r.bName || 'box').toLowerCase() + ' must be above 0');
        // a packet / box word with no size: say so (the level is simply not created)
        if (r.pName && !(r.pPer > 0) && !issues.some(function (x) { return /packet|outer|dozen|pack|roll|jar|pieces are in|listed/i.test(x); })) issues.push('How many pieces in one ' + r.pName.toLowerCase() + '?');

    }
    function downloadTemplate() {
        getXLSX().then(function (X) {
            var wb = X.utils.book_new(), ws = X.utils.aoa_to_sheet([TEMPLATE_HEAD].concat(TEMPLATE_EXAMPLES)), hs = X.utils.aoa_to_sheet(TEMPLATE_HELP);
            ws['!cols'] = TEMPLATE_HEAD.map(function (h, i) { return { wch: i === 0 ? 32 : Math.max(12, Math.min(26, h.length + 2)) }; }); hs['!cols'] = [{ wch: 120 }];
            X.utils.book_append_sheet(wb, ws, 'Stock list'); X.utils.book_append_sheet(wb, hs, 'How to fill');
            X.writeFile(wb, 'Stock_import_template.xlsx');
        }).catch(function () {
            var csv = [TEMPLATE_HEAD].concat(TEMPLATE_EXAMPLES).map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
            try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'Stock_import_template.csv'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast('Could not make the template.', true); }
        });
    }

    /* ---- the button on Inventory ---- */
    function bar() {
        try {
            var tab = $('inventory-list-tab'); if (!tab || $('pki-bar')) return;
            var anchor = tab.querySelector('#inventory-search-input') || tab.querySelector('input[type="text"]');
            var host = anchor && anchor.closest ? (anchor.closest('.form-group') || anchor.parentNode) : null;
            if (!host || !host.parentNode) return;
            var d = document.createElement('div'); d.id = 'pki-bar';
            d.innerHTML = '<button type="button" class="settings-small-btn" data-pki-open="1" title="Bring in a stock list from Excel with its boxes, packets and pieces">📥 Import boxes &amp; packets (Excel)</button>';
            d.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-pki-open]')) open(); });
            host.parentNode.insertBefore(d, host);
        } catch (e) { /* the button is a convenience */ }
    }
    function install() {
        bar();
        try {
            var sw = W.switchTab;
            if (typeof sw === 'function' && !sw.__pki) { var w = function () { var r = sw.apply(this, arguments); setTimeout(bar, 60); return r; }; w.__pki = true; W.switchTab = w; }
        } catch (e) { /* the button then appears on the first bar() call */ }
        setTimeout(bar, 800); setTimeout(bar, 2500);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install); else install();

    W.pkiOpen = open;
    W.__pki = { parseLegacy: parseLegacy, parsePacket: parsePacket, parseBox: parseBox, pieceUnit: pieceUnit, readSheet: readSheet, readCsv: readCsv, check: check, levelRows: levelRows, productFor: productFor, apply: apply, perOfRow: perOfRow, TEMPLATE_HEAD: TEMPLATE_HEAD, TEMPLATE_EXAMPLES: TEMPLATE_EXAMPLES, TEMPLATE_HELP: TEMPLATE_HELP };
})();
</script>
