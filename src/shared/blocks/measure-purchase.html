<!-- MEASURE PURCHASE ----------------------------------------------------------
         zip 163. ONE conversion engine for buying, stocking and selling in different units. Written once here, synced into every app that has a
         Restock tab (all but Aqua POS, whose Restocking tab is a materials screen).

         WHAT IT ADDS (nothing existing is replaced - the stock of an item is still ONE number in the item's own unit, `item.unit`):
           1. Purchase packaging on Restock: under the Restock table every row gets a card "📦 Bought as ...": the unit it was bought in (the stock unit
              as-is, a pack such as Box / Carton / Sack with its contents, or another unit of the same kind: g<->kg, ml<->l, cm<->m), packs + loose
              pieces ("2 boxes + 5 loose" = 53), the TOTAL cost paid. The card fills the row's Quantity (in the STOCK unit) and its Cost (the effective
              unit cost = total / stock quantity, kept at full precision) - completeRestock() itself is unchanged and only ever sees stock-unit numbers,
              so a purchase can never be converted twice.
           2. Weighted-average costing: after a restock the item's buying price (`wholesalePrice`) is the weighted average of what was in stock and what
              just arrived (item.costMethod = 'last' keeps the old "last price" behaviour). The Orders tab "Arrived" path uses the same rule.
           3. A purchase history per item (`item.purchases`, newest last, 40 kept): purchase unit, purchased quantity, stock quantity, total cost, effective
              unit cost, reference, supplier, who. The stock-movement entry of the restock carries the same facts.
           4. Measured selling (opt-in per item, ⚙️ Units): "measure by price" (KES 250 of KES 1000/kg = 0.25 kg) or "by amount" in any unit of the same
              kind (500 ml of a KES 200/l item = KES 100), quick shortcuts, the quantity always lands on the sale line in the STOCK unit.
           5. 🧾 Purchases: every restock is ONE purchase record (supplier, reference, date, who, its lines and total) listed for any period, filterable by
              supplier or text, downloadable as CSV, with what was sold in the same period (zip 269 grouped the lines of a restock into one purchase).
         MONEY: amounts are shown in whole KES on these screens (msKes); every stored number keeps full precision.
         ------------------------------------------------------------------------ -->

<script>

// weighted-average unit cost of what is in stock + what just arrived (no stock / negative stock => the new cost)

            const pk = j.pu && j.pu.mode === 'pack';
            const rec = { id: genSaleId(), batch: batchId, at: new Date().toISOString(), ref, supplier, by: typeof activeServerName === 'function' ? activeServerName() : '', invUnit: j.unit,
                purchaseUnit: pk ? (j.pu.packName || 'Pack') : (j.pu && j.pu.mode !== 'inv' ? j.pu.mode : j.unit),
                purchaseQty: pk ? (msNum(j.pu.packs) || 0) : (j.pu && j.pu.mode !== 'inv' ? msNum(j.pu.amt) : j.qty),
                packSize: pk ? msNum(j.pu.packSize) || 0 : 0, loose: pk ? msNum(j.pu.loose) || 0 : 0, invQty: j.qty, totalCost: j.total, effUnitCost: j.cost };
            p.purchases = (Array.isArray(p.purchases) ? p.purchases : []).concat([rec]).slice(-40);
            if (pk && j.pu.packName && msNum(j.pu.packSize) > 0 && (j.pu.makeUsual || !p.purchasePackSize)) { p.purchaseUnit = j.pu.packName; p.purchasePackSize = msNum(j.pu.packSize); }
            p.updatedAt = Date.now();
            for (let k = stockMovementLog.length - 1; k >= logLen; k--) { const m = stockMovementLog[k]; if (m.code === p.code && m.delta === j.qty) { m.pu = rec.purchaseUnit; m.puQty = rec.purchaseQty; m.invQty = j.qty; m.cost = j.total; m.effCost = j.cost; m.ref = ref; break; } }
        });
        if (expenses.length > expLen) { const e = expenses[expenses.length - 1]; if (e && e.category === 'Restock') { e.amount = Math.round(exact * 100) / 100; try { saveExpenses(); } catch (x) { /* kept in memory */ } } }
        msSaveInventory();
        try { renderInventoryTable(); } catch (e) { /* tab not built yet */ }
        return res;
    };
    try { const rb = document.getElementById('restock-rows-tbody'); if (rb && restockDraft && restockDraft.length) msPaintCards(); } catch (e) { /* later */ }
})();

/* the Orders tab "Arrived" path averages cost the same way (see poApplyArrivedLine) */
function msApplyArrivedCost(product, oldQty, addQty, cost) {
    if (product.costMethod === 'last') { product.wholesalePrice = cost; return; }
    product.wholesalePrice = msWac(oldQty, product.wholesalePrice, addQty, cost);
}

/* ---------- ⚙️ Units & costing (per item) ---------- */
function msOpenItemConfig(code) {
    const p = msItem(code); if (!p) return;
    window.__msCfg = code;
    const unit = p.unit || 'pcs';
    msModal(`<h3>⚙️ Units & costing</h3><div style="font-size:13px; color:var(--text-muted,#667);">${msEsc(p.name)} · stock is counted in <b>${msEsc(unit)}</b>${msIsMeasured(unit) ? ' (measured)' : ''}</div>
        <label>Purchase pack name (what the supplier sells, e.g. Box, Carton, Sack)</label><input id="ms-c-pname" value="${msEsc(p.purchaseUnit || '')}" placeholder="optional">
        <label>${msEsc(unit)} in one pack</label><input id="ms-c-psize" inputmode="decimal" value="${p.purchasePackSize || ''}" placeholder="e.g. 24">
        <label>Cost method</label><select id="ms-c-method"><option value="avg"${p.costMethod === 'last' ? '' : ' selected'}>Weighted average (recommended)</option><option value="last"${p.costMethod === 'last' ? ' selected' : ''}>Last purchase price</option></select>
        ${msIsMeasured(unit) ? `<label style="display:flex; gap:8px; align-items:center;"><input type="checkbox" id="ms-c-measure" style="width:auto; min-height:0;" ${p.measureSale ? 'checked' : ''}> Ask “how much?” when selling this item (by price or by amount)</label>
        <label>Measurement precision (decimals kept on a sale quantity)</label><select id="ms-c-prec">${[0, 1, 2, 3, 4].map((d) => `<option value="${d}"${(p.measurePrecision == null ? 3 : p.measurePrecision) === d ? ' selected' : ''}>${d}</option>`).join('')}</select>` : ''}
        <div class="ms-btns"><button class="ms-btn-alt" onclick="msClose()">Cancel</button><button class="ms-btn-main" onclick="msSaveItemConfig()">Save</button></div>`);
}
function msSaveItemConfig() {
    const p = msItem(window.__msCfg); if (!p) return msClose();
    const v = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };
    const size = msNum(v('ms-c-psize'));
    p.purchaseUnit = v('ms-c-pname').trim().slice(0, 20); p.purchasePackSize = size > 0 ? size : 0;
    if (!p.purchaseUnit) { delete p.purchaseUnit; }
    if (!(p.purchasePackSize > 0)) delete p.purchasePackSize;
    p.costMethod = v('ms-c-method') === 'last' ? 'last' : 'avg';
    const mc = document.getElementById('ms-c-measure'); if (mc) { p.measureSale = !!mc.checked; p.measurePrecision = Math.min(4, Math.max(0, parseInt(v('ms-c-prec'), 10) || 0)); }
    p.updatedAt = Date.now();
    msSaveInventory(); msClose();
    try { renderInventoryTable(); } catch (e) { /* not built */ }
    showToast('Units & costing saved.');
}

/* ---------- measured selling ---------- */
function msOpenMeasureSale(code) {
    const p = msItem(code); if (!p) return;
    const unit = p.unit || 'pcs', price = Number(typeof getEffectivePrice === 'function' ? getEffectivePrice(p) : p.price) || 0;
    window.__msSale = { code, unit, price, by: 'price' };
    msPaintMeasureSale();
}
function msPaintMeasureSale() {
    const s = window.__msSale; if (!s) return;
    const p = msItem(s.code); if (!p) return msClose();
    const fam = msFamily(s.unit) || 'count', avail = typeof getAvailableStock === 'function' ? getAvailableStock(p) : p.qty;
    const units = msUnitsOfFamily(s.unit);
    const chips = s.by === 'price' ? [20, 50, 100, 200, 500, 1000].map((a) => `<button type="button" class="ms-chip" onclick="msSaleChip('price', ${a})">KES ${a}</button>`).join('')
        : (MS_SHORTCUTS[fam] || []).map((c) => `<button type="button" class="ms-chip" onclick="msSaleChip('amt', ${c.q}, '${c.u}')">${c.q} ${c.u}</button>`).join('');
    msModal(`<h3>📏 ${msEsc(p.name)}</h3><div style="font-size:13px; color:var(--text-muted,#667);">${msEsc(msKes(s.price))} per ${msEsc(s.unit)} · in stock: ${msEsc(msQtyStr(avail))} ${msEsc(s.unit)}</div>
        <div class="ms-chips"><button type="button" class="ms-chip${s.by === 'price' ? ' on' : ''}" onclick="msSaleMode('price')">By price</button><button type="button" class="ms-chip${s.by === 'amt' ? ' on' : ''}" onclick="msSaleMode('amt')">By amount</button></div>
        ${s.by === 'price' ? `<label>Customer pays (KES)</label><input id="ms-s-val" inputmode="decimal" oninput="msSaleCalc()" placeholder="e.g. 250">`
            : `<label>Amount</label><div style="display:flex; gap:8px;"><input id="ms-s-val" inputmode="decimal" oninput="msSaleCalc()" placeholder="e.g. 500" style="flex:2"><select id="ms-s-unit" onchange="msSaleCalc()" style="flex:1">${units.map((u) => `<option value="${u}"${u === s.unit ? ' selected' : ''}>${u}</option>`).join('')}</select></div>`}
        <div class="ms-chips">${chips}</div><div id="ms-s-out"></div>
        <div class="ms-btns"><button class="ms-btn-alt" onclick="msClose()">Cancel</button><button class="ms-btn-main" id="ms-s-add" onclick="msSaleAdd()">Add to sale</button></div>`);
    const el = document.getElementById('ms-s-val'); if (el) { if (s.val != null) el.value = s.val; if (s.u2 && document.getElementById('ms-s-unit')) document.getElementById('ms-s-unit').value = s.u2; el.focus(); }
    msSaleCalc();
}
function msSaleMode(by) { const s = window.__msSale; if (!s) return; s.by = by; s.val = null; s.u2 = null; msPaintMeasureSale(); }
function msSaleChip(kind, v, u) { const s = window.__msSale; if (!s) return; s.val = v; s.u2 = u || null; msPaintMeasureSale(); }
// -> { qty (stock unit), amount } or null
function msSaleCalc() {
    const s = window.__msSale, out = document.getElementById('ms-s-out'); if (!s || !out) return null;
    const p = msItem(s.code), raw = (document.getElementById('ms-s-val') || {}).value, v = msNum(raw), u = (document.getElementById('ms-s-unit') || {}).value || s.unit;
    let qty = NaN, amount = NaN;
    if (s.by === 'price') { amount = v; qty = msQtyForAmount(v, s.price, s.unit, s.unit); }
    else { qty = msConvert(v, u, s.unit); amount = isFinite(qty) ? qty * s.price : NaN; }
    const prec = p && p.measurePrecision != null ? p.measurePrecision : 3;
    if (isFinite(qty)) qty = s.by === 'price' ? Math.floor(qty * Math.pow(10, Math.max(prec, 3)) + 1e-9) / Math.pow(10, Math.max(prec, 3)) : Math.round(qty * Math.pow(10, prec)) / Math.pow(10, prec);
    s.res = isFinite(qty) && qty > 0 ? { qty, amount: s.by === 'price' ? v : amount } : null;
    const avail = typeof getAvailableStock === 'function' && p ? getAvailableStock(p) : Infinity;
    if (!s.res) out.innerHTML = '';
    else if (qty > avail + 1e-9) out.innerHTML = `<div class="ms-err">Only ${msEsc(msQtyStr(avail))} ${msEsc(s.unit)} in stock.</div>`;
    else out.innerHTML = `<div class="ms-result">${s.by === 'price' ? `${msEsc(msKes(v))} buys ${msEsc(msQtyStr(qty))} ${msEsc(s.unit)}` : `${msEsc(msQtyStr(v))} ${msEsc(u)} = ${msEsc(msKes(amount))}`}</div>`;
    return s.res;
}
function msSaleAdd() {
    const s = window.__msSale; if (!s) return;
    const res = msSaleCalc(); const p = msItem(s.code);
    if (!res || !p) { showToast('Enter an amount first.', true); return; }
    const avail = typeof getAvailableStock === 'function' ? getAvailableStock(p) : Infinity;
    const key = typeof cartKeyFor === 'function' ? cartKeyFor(p.code, undefined, undefined) : p.code;
    const inCart = currentCart[key] ? currentCart[key].qty : 0;
    if (inCart + res.qty > avail + 1e-9) { showToast(`Only ${msQtyStr(avail)} ${s.unit} of "${p.name}" available${inCart ? ' (' + msQtyStr(inCart) + ' already in the sale)' : ''}.`, true); return; }
    if (currentCart[key]) currentCart[key].qty = Math.round((currentCart[key].qty + res.qty) * 1e9) / 1e9;
    else currentCart[key] = { code: p.code, cartKey: key, name: p.name, price: typeof getEffectivePrice === 'function' ? getEffectivePrice(p) : p.price, wholesalePrice: typeof getServiceUnitCost === 'function' ? getServiceUnitCost(p) : (p.wholesalePrice || 0), unit: p.unit || 'pcs', isService: false, vatCategory: p.vatCategory || 'A', qty: res.qty };
    msClose();
    renderCart();
    try { document.getElementById('sales-search').value = ''; document.getElementById('search-results').style.display = 'none'; } catch (e) { /* no search box */ }
}
(function () {
    if (typeof addToCart !== 'function') return;
    const orig = addToCart;
    window.addToCart = addToCart = function (code, mode, priceTier, variantId) {
        const p = typeof inventory !== 'undefined' ? msItem(code) : null;
        if (p && p.measureSale && msIsMeasured(p.unit || 'pcs') && !p.dualUnit && !p.hasVariants && p.type !== 'service' && !variantId && !window.__msDirect) { msOpenMeasureSale(code); return; }
        return orig.apply(this, arguments);
    };
})();

/* ---------- 📊 Purchases report ---------- */
// zip 269: PURCHASES - every restock is ONE purchase (supplier, reference, date, who, the lines and the total); this screen lists them for any period and
// filters by supplier or text. The data is each item's own purchase history (item.purchases, 40 kept per item), so it syncs and follows the item.
// Restocks made before this release carry no purchase id: they are grouped by the minute, reference and supplier they share.
function msPurchaseDocs(days, supplier, q) {
    const since = Date.now() - days * 86400000, docs = {}, needle = String(q || '').trim().toLowerCase();
    inventory.forEach((p) => (Array.isArray(p.purchases) ? p.purchases : []).forEach((x) => {
        if (!(Date.parse(x.at) >= since)) return;
        const key = x.batch || (String(x.at || '').slice(0, 16) + '|' + (x.ref || '') + '|' + (x.supplier || ''));
        const d = docs[key] || (docs[key] = { key, at: x.at, supplier: x.supplier || '', ref: x.ref || '', by: x.by || '', lines: [], total: 0 });
        d.lines.push({ p, x }); d.total += Number(x.totalCost) || 0;
        if (Date.parse(x.at) > Date.parse(d.at)) d.at = x.at;
    }));
    return Object.keys(docs).map((k) => docs[k]).filter((d) => (!supplier || d.supplier === supplier) && (!needle || [d.supplier, d.ref, d.by].concat(d.lines.map((l) => l.p.name + ' ' + (l.p.code || ''))).join(' ').toLowerCase().indexOf(needle) >= 0))
        .sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
}
function msPurchasesCsv(docs) {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['Date', 'Supplier', 'Reference', 'By', 'Item', 'Code', 'Bought', 'Into stock', 'Paid', 'Per unit']];
    docs.forEach((d) => d.lines.forEach(({ p, x }) => rows.push([String(d.at).slice(0, 16).replace('T', ' '), d.supplier, d.ref, d.by, p.name, p.code || '', msQtyStr(x.purchaseQty) + ' ' + (x.purchaseUnit || '') + (x.loose ? ' + ' + msQtyStr(x.loose) : ''), msQtyStr(x.invQty) + ' ' + (x.invUnit || ''), Math.round((Number(x.totalCost) || 0) * 100) / 100, Math.round((Number(x.effUnitCost) || 0) * 100) / 100])));
    return rows.map((r) => r.map(q).join(',')).join('\r\n');
}
function msPurchasesDownload(days) {
    const f = window.__msPurFilter || {}, docs = msPurchaseDocs(days || f.days || 30, f.supplier, f.q);
    if (!docs.length) { try { showToast('Nothing to download for this period.', true); } catch (e) { /* no toast here */ } return; }
    try {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + msPurchasesCsv(docs)], { type: 'text/csv;charset=utf-8' }));
        a.download = 'purchases-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) { try { showToast('This browser could not save the file.', true); } catch (x) { /* ignore */ } }
}
function msPurchasesFilter(k, v) { window.__msPurFilter = Object.assign({}, window.__msPurFilter, { [k]: v }); msOpenPurchasesReport(); }
function msOpenPurchasesReport(days) {
    const f = window.__msPurFilter = Object.assign({ days: 30, supplier: '', q: '' }, window.__msPurFilter);
    if (days) f.days = days; days = f.days;
    const since = Date.now() - days * 86400000;
    const allDocs = msPurchaseDocs(days, '', ''), docs = msPurchaseDocs(days, f.supplier, f.q);
    const suppliers2 = Array.from(new Set(allDocs.map((d) => d.supplier).filter(Boolean))).sort();
    // what was sold in the same period (selling quantity, revenue, profit with the cost recorded on the sale line)
    const sold = {};
    try {
        (typeof salesLog !== 'undefined' ? salesLog : []).forEach((s) => {
            if (!s || s.voided || Date.parse(s.timestamp || s.date || 0) < since) return;
            (s.items || s.lines || []).forEach((l) => { const k = String(l.code); const o = sold[k] || (sold[k] = { qty: 0, rev: 0, cost: 0 }); const q = Number(l.qty) || 0; o.qty += q; o.rev += q * (Number(l.price) || 0); o.cost += (typeof moneyLineCost === "function" ? moneyLineCost(l, s) : q * (Number(l.wholesalePrice) || 0)); });
        });
    } catch (e) { /* no sales log in this app */ }
    const tot = docs.reduce((a, d) => a + d.total, 0), per = {};
    docs.forEach((d) => d.lines.forEach(({ p }) => { per[p.code] = p; }));
    const when = (iso) => { const t = new Date(iso); return isFinite(t) ? t.toISOString().slice(0, 10) + ' ' + t.toTimeString().slice(0, 5) : ''; };
    msModal(`<h3>🧾 Purchases</h3>
        <div class="ms-btns" style="margin:6px 0 0;"><button class="ms-btn-main" onclick="msClose(); var b = document.querySelector('.tab-link[data-tab=&quot;restock-tab&quot;]'); if (b) b.click();">＋ Record a purchase</button><button class="ms-btn-alt" onclick="msPurchasesDownload()">⬇ Download CSV</button></div>
        <div class="ms-chips">${[7, 30, 90, 365].map((d) => `<button class="ms-chip${d === days ? ' on' : ''}" onclick="msOpenPurchasesReport(${d})">${d === 365 ? '1 year' : d + ' days'}</button>`).join('')}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"><select aria-label="Supplier" style="flex:1; min-width:130px;" onchange="msPurchasesFilter('supplier', this.value)"><option value="">All suppliers</option>${suppliers2.map((s) => `<option value="${msEsc(s)}"${s === f.supplier ? ' selected' : ''}>${msEsc(s)}</option>`).join('')}</select>
            <input type="search" aria-label="Search purchases" placeholder="Search item, reference…" value="${msEsc(f.q)}" style="flex:2; min-width:150px;" onchange="msPurchasesFilter('q', this.value)"></div>
        <div class="ms-result" style="margin:10px 0;">${docs.length} purchase${docs.length === 1 ? '' : 's'} · ${msEsc(msKes(tot))} into stock</div>
        ${docs.length ? docs.map((d) => `<details style="border:1px solid var(--border,#cfd6dc); border-radius:10px; margin:6px 0; padding:8px 10px;"><summary style="cursor:pointer; font-weight:700; display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between;"><span>${msEsc(when(d.at))} · ${msEsc(d.supplier || 'No supplier')}${d.ref ? ' · ' + msEsc(d.ref) : ''}</span><span>${msEsc(msKes(d.total))}</span></summary>
            <div style="font-size:12px; color:#667; margin:4px 0;">${d.lines.length} item${d.lines.length === 1 ? '' : 's'}${d.by ? ' · by ' + msEsc(d.by) : ''}</div>
            <div style="overflow-x:auto;"><table class="ms-table"><thead><tr><th>Item</th><th>Bought</th><th>Into stock</th><th>Paid</th><th>Per unit</th></tr></thead><tbody>${d.lines.map(({ p, x }) => `<tr><td>${msEsc(p.name)}</td><td>${msEsc(msQtyStr(x.purchaseQty))} ${msEsc(x.purchaseUnit)}${x.loose ? ` + ${msEsc(msQtyStr(x.loose))}` : ''}</td><td>${msEsc(msQtyStr(x.invQty))} ${msEsc(x.invUnit)}</td><td>${msEsc(msKes(x.totalCost))}</td><td>${msEsc(msKes(x.effUnitCost))}</td></tr>`).join('')}</tbody></table></div></details>`).join('')
            : `<p style="color:#667; margin:14px 0;">${f.supplier || f.q ? 'No purchase matches this search.' : 'No purchases recorded in this period. Use “Record a purchase” to add stock you bought — it updates the stock and its cost.'}</p>`}
        ${Object.keys(per).length ? `<details style="margin-top:12px;"><summary style="cursor:pointer; font-weight:700;">Sold in the same period</summary><div style="overflow-x:auto;"><table class="ms-table"><thead><tr><th>Item</th><th>Sold</th><th>Revenue</th><th>Profit</th><th>Cost now</th></tr></thead><tbody>${Object.keys(per).map((k) => { const p = per[k], o = sold[k] || { qty: 0, rev: 0, cost: 0 }; return `<tr><td>${msEsc(p.name)}</td><td>${msEsc(msQtyStr(o.qty))} ${msEsc(p.unit || 'pcs')}</td><td>${msEsc(msKes(o.rev))}</td><td>${msEsc(msKes(o.rev - o.cost))}</td><td>${msEsc(msKes(p.wholesalePrice))}/${msEsc(p.unit || 'pcs')}</td></tr>`; }).join('')}</tbody></table></div></details>` : ''}
        <div class="ms-btns"><button class="ms-btn-main" onclick="msClose()">Close</button></div>`);
}
</script>
