     Services engine block "svc-appts". Written ONLY into services/index.html (tools/lib.mjs SHARED_BLOCKS `only`); never hand-edit it there.

<script>
/* ===================================================================================================================
   SVC APPOINTMENTS (B2-A): bookings + walk-ins. Pure part first (clashes, free slots, create / update / status / convert, quick intake),
   then the screens (day / week / list, booking form, detail, quick intake). Every state change goes through svcCommit('svcAppointments').
   Times are Kenya wall-clock (UTC+3, no DST); startAt / endAt are real instants in ms. Legacy bookings are read through
   svcAllApptsView and NEVER written: they take part in clash checks and can be converted to a job.
   =================================================================================================================== */
var SVC_AX_STATUSES = ['booked', 'confirmed', 'checked_in', 'completed', 'cancelled', 'no_show'];
var SVC_AX_OCCUPY = { booked: 1, confirmed: 1, checked_in: 1, completed: 1 };      /* statuses that hold the time slot (cancelled / no-show free it) */
var SVC_AX_OPEN = { booked: 1, confirmed: 1, checked_in: 1 };
var SVC_AX_NEXT = { booked: ['confirmed', 'checked_in', 'cancelled', 'no_show'], confirmed: ['booked', 'checked_in', 'cancelled', 'no_show'], checked_in: ['completed', 'cancelled'], completed: [], cancelled: [], no_show: [] };
var SVC_AX_LABELS = { booked: 'Booked', confirmed: 'Confirmed', checked_in: 'Checked in', completed: 'Completed', cancelled: 'Cancelled', no_show: 'No show' };
var SVC_AX_COLORS = { booked: '#95a5a6', confirmed: '#2980b9', checked_in: '#e67e22', completed: '#16a085', cancelled: '#c0392b', no_show: '#7f8c8d' };
var SVC_AX_TZ = 3 * 3600000;
var SVC_AX_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var SVC_AX_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var SVC_AX = { mounted: [], sub: false, busy: {}, regTimer: 0, tabObs: null };

/* ===== tiny helpers ===== */
function svcAxEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function svcAxArr(v) { return Array.isArray(v) ? v : []; }
function svcAxStr(v) { return v == null ? '' : String(v); }
function svcAxPad(n) { return n < 10 ? '0' + n : String(n); }
function svcAxNow() { try { if (typeof svcNow === 'function') return svcNow(); } catch (e) { /* use the clock */ } return Date.now(); }
function svcAxCan(perm) { try { return typeof svcCan === 'function' ? !!svcCan(perm) : true; } catch (e) { return true; } }
function svcAxActor() { try { if (typeof svcActor === 'function') { var a = svcActor(); if (a && a.name) return a; } } catch (e) { /* owner */ } return { id: 'owner', name: 'Owner' }; }
function svcAxType() { try { if (typeof svcBusinessType === 'function') { var t = svcBusinessType(); if (t) return String(t); } } catch (e) { /* default */ } return 'other'; }
function svcAxTpl(type) { try { if (typeof svcGetTemplate === 'function') return svcGetTemplate(type || svcAxType()) || {}; } catch (e) { /* no template */ } return {}; }
function svcAxTerm(key, type) { try { if (typeof svcTerm === 'function') return svcTerm(key, type || svcAxType()); } catch (e) { /* fall back */ } return key; }
function svcAxStripPlus(s) { return String(s || '').replace(/^\s*\+\s*/, ''); }
function svcAxToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(String(msg), !!isErr); } catch (e) { /* cosmetic */ } }
function svcAxMoney(n) { try { if (typeof svcFormatMoney === 'function') return svcFormatMoney(n); } catch (e) { /* fall back */ } return 'KSh ' + (Math.round(Number(n) || 0)).toLocaleString('en-US'); }
function svcAxLs(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { /* storage blocked */ } return null; }
function svcAxNewId(prefix) {
  try { if (typeof svcId === 'function') return svcId(prefix); } catch (e) { /* fall back */ }
  return prefix + Date.now() + '-' + Math.random().toString(36).slice(2, 12);
}
function svcAxBizCfg() { try { if (typeof svcBusinessConfig === 'function') return svcBusinessConfig() || {}; } catch (e) { /* defaults */ } return {}; }
function svcAxStaffList() {
  try { return typeof staff !== 'undefined' && Array.isArray(staff) ? staff.filter(function (s) { return s && s.id != null && !s.removed && !s._deleted && !s.disabled; }) : []; } catch (e) { return []; }
}
function svcAxStaffName(id) { var l = svcAxStaffList(), i; for (i = 0; i < l.length; i++) { if (String(l[i].id) === String(id)) return svcAxStr(l[i].name); } return ''; }

/* ===== dates (Kenya wall clock) ===== */
function svcAxIsDate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false; var d = new Date(s + 'T00:00:00Z'); return !isNaN(d.getTime()) && d.toISOString().slice(0, 10) === s; }
function svcAxIsTime(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s)); }
function svcApptMs(date, time) { if (!svcAxIsDate(date) || !svcAxIsTime(time)) return 0; var t = Date.parse(date + 'T' + time + ':00+03:00'); return isFinite(t) ? t : 0; }
function svcAxDateOf(ms) { return new Date(Number(ms) + SVC_AX_TZ).toISOString().slice(0, 10); }
function svcAxTimeOf(ms) { var d = new Date(Number(ms) + SVC_AX_TZ); return svcAxPad(d.getUTCHours()) + ':' + svcAxPad(d.getUTCMinutes()); }
function svcAxToday() { return svcAxDateOf(svcAxNow()); }
function svcAxAddDays(date, n) { var d = new Date(date + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function svcAxDow(date) { return new Date(date + 'T00:00:00Z').getUTCDay(); }
function svcAxMonday(date) { return svcAxAddDays(date, -((svcAxDow(date) + 6) % 7)); }
function svcAxMin(t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
function svcAxHM(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; return svcAxPad(Math.floor(min / 60)) + ':' + svcAxPad(min % 60); }
function svcAxPretty(date) { if (!svcAxIsDate(date)) return svcAxStr(date); var p = date.split('-'); return SVC_AX_DAYS[svcAxDow(date)] + ' ' + (+p[2]) + ' ' + SVC_AX_MONTHS[(+p[1]) - 1]; }
/* business hours for a date: cfg-business.hours = {open:'08:00', close:'19:00', closedDays:[0]} or per day {mon:{open,close,closed}, ...}; default 08:00-19:00 every day */
function svcAxHours(date) {
  var h = svcAxBizCfg().hours, open = '08:00', close = '19:00', closed = false, dow = svcAxDow(date);
  if (h && typeof h === 'object') {
    var d = h[dow] || h[SVC_AX_DAYS[dow].toLowerCase()], src = d && typeof d === 'object' ? d : h;
    if (src.open && svcAxIsTime(src.open)) open = src.open;
    if (src.close && svcAxIsTime(src.close)) close = src.close;
    if (d && typeof d === 'object' && d.closed === true) closed = true;
    if (Array.isArray(h.closedDays) && h.closedDays.indexOf(dow) !== -1) closed = true;
  }
  var o = svcAxMin(open), c = svcAxMin(close);
  if (c <= o) c = 24 * 60;
  return { open: o, close: c, closed: closed };
}

/* ===== reading appointments ===== */
function svcAxPool(opts) {
  if (opts && Array.isArray(opts.pool)) return opts.pool;
  try { if (typeof svcAllApptsView === 'function') return svcAllApptsView({ includeLegacy: true }); } catch (e) { /* fall back to the engine list */ }
  try { return typeof svcAppointments !== 'undefined' && Array.isArray(svcAppointments) ? svcAppointments.filter(function (a) { return a && !a._deleted; }) : []; } catch (e2) { return []; }
}
function svcAxFind(id) {
  var p = svcAxPool(), i;
  for (i = 0; i < p.length; i++) { if (p[i] && String(p[i].id) === String(id)) return p[i]; }
  return null;
}
function svcAxSpan(a) {
  a = a || {};
  var s = Number(a.startAt) || svcApptMs(a.date, a.start), e = Number(a.endAt) || 0;
  if (!e && s) { if (a.end && svcAxIsTime(a.end)) { e = svcApptMs(a.date, a.end); if (e && e <= s) e += 86400000; } else e = s + (Number(a.durationMin) || 30) * 60000; }
  return { s: s, e: e };
}
function svcAxDur(a) { var sp = svcAxSpan(a); return sp.s && sp.e > sp.s ? Math.round((sp.e - sp.s) / 60000) : (Number(a && a.durationMin) || 30); }

/* ===== svcApptClashes(appt, opts) -> [{withId, staffId, kind:'staff'|'resource', overlapMin, date, start, end, customerName, legacy, status}]
   Same staff (or same resource) at overlapping times. Touching ends (10:00-11:00 then 11:00-12:00) is NOT a clash. Cancelled / no-show bookings free their slot.
   Legacy bookings are always part of the pool. A template with doubleBookingCheck 'none' (laundry) skips the staff check. ===== */
function svcApptClashes(appt, opts) {
  opts = opts || {};
  var a = appt || {}, sp = svcAxSpan(a), out = [];
  if (!(sp.s > 0 && sp.e > sp.s)) return out;
  var tpl = svcAxTpl(a.serviceType), mode = opts.mode || (tpl.appointments && tpl.appointments.doubleBookingCheck) || 'staff';
  var mine = svcAxArr(a.staffIds).filter(function (x) { return x != null && x !== ''; }).map(String), res = a.resourceId ? String(a.resourceId) : '';
  svcAxPool(opts).forEach(function (b) {
    if (!b || b._deleted || String(b.id) === String(a.id) || !SVC_AX_OCCUPY[b.status]) return;
    if (opts.ignoreId && String(b.id) === String(opts.ignoreId)) return;
    var bs = svcAxSpan(b); if (!(bs.s > 0 && bs.e > bs.s)) return;
    var ov = Math.min(sp.e, bs.e) - Math.max(sp.s, bs.s);
    if (!(ov > 0)) return;
    var info = { withId: b.id, overlapMin: Math.round(ov / 60000), date: b.date, start: b.start, end: b.end, customerName: (b.customer && b.customer.name) || '', legacy: !!b._legacy, status: b.status };
    if (mode !== 'none') {
      svcAxArr(b.staffIds).map(String).forEach(function (sid) { if (sid && mine.indexOf(sid) !== -1) out.push(Object.assign({ staffId: sid, kind: 'staff' }, info)); });
    }
    if (res && b.resourceId && String(b.resourceId) === res) out.push(Object.assign({ staffId: '', kind: 'resource' }, info));
  });
  return out;
}

/* ===== svcFreeSlots(date, durationMin, staffId, opts) -> [{start, end, startAt, endAt, staffIds}]
   staffId given: free for that person. Empty / 'any': free when at least one bookable staff member is free (opts.staffIds overrides who is bookable); no staff at all: only the opening hours apply.
   Past slots of today are skipped unless opts.includePast; opts.ignoreId lets a booking being moved ignore itself. ===== */
function svcFreeSlots(date, durationMin, staffId, opts) {
  opts = opts || {};
  if (!svcAxIsDate(date)) return [];
  var tpl = svcAxTpl(opts.type), ap = tpl.appointments || {};
  var dur = Number(durationMin) > 0 ? Math.round(Number(durationMin)) : (Number(ap.defaultDurationMin) || 30);
  var step = Number(opts.stepMin) > 0 ? Number(opts.stepMin) : (Number(ap.slotStepMin) || 15);
  var hrs = svcAxHours(date); if (hrs.closed) return [];
  var base = svcApptMs(date, '00:00'), pool = svcAxPool(opts), busy = {}, i;
  var any = !staffId || staffId === 'any';
  var cands = any ? (Array.isArray(opts.staffIds) ? opts.staffIds.map(String) : svcAxStaffList().map(function (s) { return String(s.id); })) : [String(staffId)];
  pool.forEach(function (b) {
    if (!b || b._deleted || !SVC_AX_OCCUPY[b.status] || (opts.ignoreId && String(b.id) === String(opts.ignoreId))) return;
    var bs = svcAxSpan(b); if (!(bs.s > 0)) return;
    svcAxArr(b.staffIds).map(String).forEach(function (sid) { (busy[sid] = busy[sid] || []).push(bs); });
  });
  var now = svcAxNow(), out = [], t;
  for (t = hrs.open; t + dur <= hrs.close; t += step) {
    var s = base + t * 60000, e = s + dur * 60000;
    if (!opts.includePast && s < now) continue;
    var free = cands.filter(function (sid) { return !(busy[sid] || []).some(function (x) { return s < x.e && x.s < e; }); });
    if (cands.length && !free.length) continue;
    out.push({ start: svcAxHM(t), end: svcAxHM(t + dur), startAt: s, endAt: e, staffIds: free });
    i = 0;
  }
  return out;
}

/* ===== building / validating a record ===== */
function svcAxCleanServices(list) {
  var out = [];
  svcAxArr(list).forEach(function (s) {
    if (!s || typeof s !== 'object') return;
    var name = svcAxStr(s.name).trim(); if (!name) return;
    var price = Number(s.price), dur = Number(s.durationMin);
    var o = { catalogId: s.catalogId || null, name: name.slice(0, 80), price: isFinite(price) && price >= 0 ? Math.round(price * 100) / 100 : 0 };
    if (isFinite(dur) && dur > 0) o.durationMin = Math.round(dur);

/* ----- quick intake sheet (walk-ins): identifier + phone + service, big token at the end ----- */

/* ===== drawer tab: the booking a job came from ===== */

/* ===== registration ===== */
function svcAxRegister() {

    svcHomeViewRegister('appts', { label: label, order: 40, render: function (host, ctx) { host.__saxCtx = ctx; return svcRenderAppts(host, ctx); }, visibleWhen: function (ctx) { var t = (ctx && ctx.type) || svcAxType(), ap = svcAxTpl(t).appointments; return !!(ap && ap.mode && ap.mode !== 'off') || svcAxPool().some(function (a) { return a && (a._legacy || a.serviceType === t); }); } });
  }
  if (typeof svcDrawerRegister === 'function') {
    svcDrawerRegister('appointment', { label: '📅 Booking', order: 25, render: svcAxDrawerTab, visibleWhen: function (job) { return !!(job && job.appointmentId); } });

function svcAxSubscribe() {

        var a = svcAxFind(job.appointmentId); if (!a || a._legacy || a.status === 'completed') return;
        svcAxCommit(function (d) { if (d.status !== 'checked_in') return false; d.status = 'completed'; d.closedAt = d.closedAt || svcAxNow(); svcAxLogRow(d, 'completed', 'checked_in', 'completed', job.no); return d; }, a.id, false, 'appt:changed', 'completed');

/* ----- the classic Bookings tab: while the new screens are on and the type takes bookings, the same calendar is shown there too (classic list stays one tap away) ----- */

}

    tg.innerHTML = '<button type="button" class="sax-btn is-sm" id="svc-appts-classic-btn">Classic bookings list</button>';

function svcAxWatchTab() {

svcAxRegister();
try { if (typeof document !== 'undefined') { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', svcAxWatchTab); else svcAxWatchTab(); } } catch (e) { /* no DOM */ }
svcAxSubscribe();
