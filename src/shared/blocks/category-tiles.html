<!-- CATEGORY TILES ------------------------------------------------------------
         Category pictures for the Sales Counter. The owner (Settings, "Category images") gives each category a small picture and switches on "Show category
         image tiles on the Sales Counter". The counter then opens on a grid of big picture tiles (name + item count under each); tapping a tile opens that
         category - its sub-categories first where the app has them (Hotel), otherwise the product grid, filtered to that category. "All categories" brings
         the tiles back. Typing in the search box shows normal results exactly as before; clearing it returns to the tiles. The switch is OFF until the owner
         turns it on, so nothing changes by itself.
         HOW IT WORKS WITH THE APP: this block never filters or sells anything itself. The product grid is the app's own renderItemImageGrid: in Hotel the tile tap
         sets the very same state the category chips set (hospCatSelSet / the sub-category key) before the grid is drawn; in the other apps (no category state of
         their own) the first inventory.filter / forEach of that one render is limited to the chosen category, then removed again. Every render of the grid
         (a cart tap draws it again) re-draws the tiles from the remembered position, so adding an item never bounces the cashier back to the root. The old chip
         row stays in the page (the app keeps drawing it), it is only hidden while the tiles are on.
         DATA: localStorage pos_category_images = {"Category" or "Category > Sub": small JPEG data-URL} (max 60, each scaled to 240 px / ~20 KB) and
         pos_cat_tiles = "true"/"false". Both travel with the shop's settings (collectSyncPayload adds categoryImages + catTilesOn only once THIS device has
         its own copy; applyRemotePayload applies them). slimPayloadForPush leaves the pictures out of a push when the server already has the same set
         (once per change per session, not on every sale). Classes: ctl-*. Water has no product grid: this block does nothing there. -->
