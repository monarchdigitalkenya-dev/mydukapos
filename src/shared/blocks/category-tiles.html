<!-- CATEGORY TILES ------------------------------------------------------------
         Category pictures for the Sales Counter. The owner (Settings, "Category images") gives each category a small picture and switches on "Show category
         image tiles on the Sales Counter". The counter then opens on a grid of big picture tiles (name + item count under each); tapping a tile opens that
         category - its sub-categories first where the app has them (Hotel), otherwise the product grid, filtered to that category. "All categories" brings
         the tiles back. Typing in the search box shows normal results exactly as before; clearing it returns to the tiles. The switch is OFF until the owner
         turns it on, so nothing changes by itself.
         HOW IT WORKS WITH THE APP: this block never filters or sells anything itself. The product grid is the app's own renderItemImageGrid: in Hotel the tile tap
         sets the very same state the category chips set (hospCatSelSet / the sub-category key) before the grid is drawn; in the other apps (no category state of
         their own) the first inventory.filter / forEach of that one render is limited to the chosen category, then removed again. Every render of the grid
         (a cart tap draws it again) re-draws the tiles from the remembered position, so adding an item never bounces the cashier back to the root. The old chip
         row stays in the page (the app keeps drawing it), it is only hidden while the tiles are on.
         DATA: localStorage pos_category_images = {"Category" or "Category > Sub": small JPEG data-URL} (max 60, each scaled to 240 px / ~20 KB) and
         pos_cat_tiles = "true"/"false". Both travel with the shop's settings (collectSyncPayload adds categoryImages + catTilesOn only once THIS device has
         its own copy; applyRemotePayload applies them). slimPayloadForPush leaves the pictures out of a push when the server already has the same set
         (once per change per session, not on every sale). Classes: ctl-*. Water has no product grid: this block does nothing there. -->

            return '<input type="number" class="ctl-pos" inputmode="numeric" min="1" max="' + n + '" value="' + pos + '" data-ctl-pos="' + kind + '" data-k="' + esc(encodeURIComponent(key)) + '" aria-label="Position (1 to ' + n + ')" title="Position (1 to ' + n + ')"' + (ro ? ' disabled' : '') + '>';
        }
        function arrows(act, k, ro) {
            return '<button type="button" class="settings-small-btn" data-ctl-act="' + act + '" data-d="-1" data-k="' + k + '"' + (ro ? ' disabled' : '') + ' aria-label="Move up">▲</button><button type="button" class="settings-small-btn" data-ctl-act="' + act + '" data-d="1" data-k="' + k + '"' + (ro ? ' disabled' : '') + ' aria-label="Move down">▼</button>';
        }
        function moveBtns(key, sub, ro) {
            var o = ordGet(); if ((sub ? subMode(o) : o.mode) !== 'manual') return '';
            var parts = key.split(SEP), pos = 0, n = 0;
            try {
                if (!sub) { var l = categories(); n = l.length; pos = l.map(function (c) { return c.key; }).indexOf(key) + 1; }
                else { var c = categories().filter(function (x) { return x.key === parts[0]; })[0], names = c ? hotelSubs(c).map(function (x) { return String(x.name); }) : []; n = names.length; pos = names.indexOf(parts.slice(1).join(SEP)) + 1; }
            } catch (e) { /* the arrows still work */ }
            return (pos > 0 ? posBox(sub ? 'sub' : 'cat', key, pos, n, ro) : '') + arrows('mv', esc(encodeURIComponent(key)), ro);
        }
        // moves `item` inside `order` by d places, or to the 1-based position toPos; returns a NEW array (or the same one when nothing moves)
        function moveIn(order, item, d, toPos) {
            var i = order.indexOf(item); if (i < 0) return order;
            var j = toPos != null && isFinite(toPos) ? Math.max(0, Math.min(order.length - 1, Math.round(toPos) - 1)) : i + d;
            if (j < 0 || j >= order.length || j === i) return order;
            var a = order.slice(); a.splice(i, 1); a.splice(j, 0, item); return a;
        }
        function moveItem(key, d, toPos) {
            var o = ordGet(), parts = key.split(SEP), cat = parts[0], sub = parts.length > 1 ? parts.slice(1).join(SEP) : null, next;
            if (sub === null) {
                var cur = categories().map(function (c) { return c.label; });
                var arr = o.manual.length ? o.manual.slice() : cur.slice();
                cur.forEach(function (l) { if (arr.map(normCat).indexOf(normCat(l)) < 0) arr.push(l); });
                var order = cur.slice().sort(function (a, b) { var ia = arr.map(normCat).indexOf(normCat(a)), ib = arr.map(normCat).indexOf(normCat(b)); return ia - ib; });
                next = moveIn(order, cat, d, toPos); if (next === order) { renderPanel(); return; }
                o.manual = next;
            } else {
                var c = categories().filter(function (x) { return x.key === cat; })[0]; if (!c) return;
                var names = hotelSubs(c).map(function (x) { return String(x.name); });
                next = moveIn(names, sub, d, toPos); if (next === names) { renderPanel(); return; }
                o.subs[cat] = next;
            }
            ordSave(o);
        }
        function moveCatItem(catId, code, d, toPos) {      // the items of one category (Hotel)
            var o = ordGet(), codes = itemEntriesOrdered(catId).map(function (e) { return String(e.rec.code); });
            var next = moveIn(codes, String(code), d, toPos); if (next === codes) { renderPanel(); return; }
            o.items[catId] = next; ordSave(o);
        }
        function itemEditorHtml(ro) {
            var cats = categories().map(function (c) { return { id: c.id, label: c.label }; });
            try { if (hospScreenSet('sales').none > 0) cats.push({ id: 'none', label: 'Uncategorized' }); } catch (e) { /* none */ }
            if (!cats.length) return '';
            if (!cats.some(function (c) { return c.id === window.__ctlIordCat; })) window.__ctlIordCat = cats[0].id;
            var cur = window.__ctlIordCat, ents = itemEntriesOrdered(cur), n = ents.length;
            return '<div class="ctl-iord"><label class="ctl-ordlab" for="ctl-iord-cat">Arrange the items of</label><select id="ctl-iord-cat" class="ctl-ordsel">'
                + cats.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === cur ? ' selected' : '') + '>' + esc(c.label) + '</option>'; }).join('') + '</select>'
                + '<p class="ctl-note">' + n + (n === 1 ? ' item' : ' items') + ' — type a position number (1 = first) or use ▲ ▼. Items you have not placed yet follow in A-Z order. Sub-category screens use this same order.</p>'
                + ents.map(function (e, i) {
                    var k = esc(encodeURIComponent(String(e.rec.code)));
                    return '<div class="ctl-row ctl-subrow"><input type="number" class="ctl-pos" inputmode="numeric" min="1" max="' + n + '" value="' + (i + 1) + '" data-ctl-pos="item" data-k="' + k + '" aria-label="Position (1 to ' + n + ')"' + (ro ? ' disabled' : '') + '>'
                        + '<span class="ctl-rname"><b>' + esc(e.name) + '</b><small>' + esc(String(Number(e.rec.price) || 0)) + '</small></span><span class="ctl-racts">' + arrows('mvi', k, ro) + '</span></div>';
                }).join('') + '</div>';
        }
        window.__ctlSetOrderMode = function (m) {
            var o = ordGet(); if (MODES.indexOf(m) < 0) return;
            if (m === 'manual' && !o.manual.length) o.manual = categories().map(function (c) { return c.label; });   // start from the order on screen
            o.mode = m; if (m === 'manual' && subMode(o) === 'manual') seedSubs(o); ordSave(o);
        };
        function seedSubs(o) { categories().forEach(function (c) { if (!o.subs[c.key] || !o.subs[c.key].length) { var l = hotelSubs(c).map(function (x) { return String(x.name); }); if (l.length) o.subs[c.key] = l; } }); }
        window.__ctlSetSubMode = function (m) {
            var o = ordGet(); if (SMODES.indexOf(m) < 0) return;
            o.smode = m; if (subMode(o) === 'manual') seedSubs(o); ordSave(o);
        };
        window.__ctlSetItemMode = function (m) { var o = ordGet(); if (IMODES.indexOf(m) < 0) return; o.imode = m; ordSave(o); };
        function rowHtml(label, key, sub, count, ro) {
            var has = images()[key] !== undefined, k = esc(encodeURIComponent(key));
            return '<div class="ctl-row' + (sub ? ' ctl-subrow' : '') + '">' + thumb(label, key)
                + '<span class="ctl-rname"><b>' + esc(label) + '</b>' + (count != null ? '<small>' + count + (count === 1 ? ' item' : ' items') + '</small>' : '') + '</span>'
                + '<span class="ctl-racts"><button type="button" class="settings-small-btn" data-ctl-act="pick" data-k="' + k + '"' + (ro ? ' disabled' : '') + '>📷 ' + (has ? 'Change image' : 'Add image') + '</button>'
                + moveBtns(key, sub, ro) + (has ? '<button type="button" class="settings-small-btn" data-ctl-act="rm" data-k="' + k + '"' + (ro ? ' disabled' : '') + '>Remove</button>' : '') + '</span></div>';
        }
        function renderPanel() {
            var el = $('ctl-panel'); if (!el) return;
            var cats = categories(), ro = readOnlyBranch(), imgs = images(), used = Object.keys(imgs).length, listed = {}, rows = '';
            cats.forEach(function (c) {
                listed[c.key] = 1; rows += rowHtml(c.label, c.key, false, c.n, ro);
                hotelSubs(c).forEach(function (x) { var k = c.key + SEP + x.name; listed[k] = 1; rows += rowHtml(x.name, k, true, null, ro); });
            });
            var orphan = Object.keys(imgs).filter(function (k) { return !listed[k]; });
            if (orphan.length) rows += '<div class="ctl-row"><b>Pictures for categories that have no items now</b></div>' + orphan.map(function (k) { return rowHtml(k, k, false, null, ro); }).join('');
            el.innerHTML = ordHtml(cats, ro) + '<h3 style="margin-top:16px;">🖼️ Category images</h3>'
                + '<p class="ctl-note">Give each category a picture. With the switch below on, the Sales Counter opens on big picture tiles: tap a tile to see the items (or sub-categories) in it. Searching still works as always. Every till and phone follows these settings.</p>'
                + '<label class="ctl-sw"><input type="checkbox" id="ctl-switch"' + (enabled() ? ' checked' : '') + (ro ? ' disabled' : '') + '> Show category image tiles on the Sales Counter</label>'
                + '<label class="ctl-sw"><input type="checkbox" id="ctl-plain-switch"' + (plainOn() ? ' checked' : '') + (ro ? ' disabled' : '') + '> Categories and sub-categories without a picture stay plain buttons</label>'
                + '<p class="ctl-note">With this on, only the categories you gave a picture show as picture tiles; the others are ordinary buttons. Items always show their own pictures.</p>'
                + '<h3 style="margin-top:16px;">🙈 Hide the “All” buttons</h3><p class="ctl-note">With the tiles on, the Sales Counter normally starts with an “All items” button, and each category with sub-categories starts with an “All &lt;category&gt;” button. Hide them to show only the categories / sub-categories. Searching still finds every item. Every till and phone follows this.</p>'
                + '<label class="ctl-sw"><input type="checkbox" id="ctl-hide-items"' + (hideGet().items ? ' checked' : '') + (ro ? ' disabled' : '') + '> Hide the “All items” button</label>'
                + (hotelMode() ? '<label class="ctl-sw"><input type="checkbox" id="ctl-hide-cat"' + (hideGet().cat ? ' checked' : '') + (ro ? ' disabled' : '') + '> Hide the “All &lt;category&gt;” button inside a category (for example “All Milkshakes”) — show only its sub-categories</label>' : '')
                + '<p class="ctl-note">' + used + ' of ' + MAX_IMAGES + ' pictures used. Pictures are made small automatically.' + (ro ? ' Another branch is open: pictures can only be changed in your own branch.' : '') + '</p>'
                + (rows || '<p class="ctl-note">No categories yet. Give items a category in Inventory, then come back.</p>')
                + '<input type="file" id="ctl-file" class="ctl-hidden-file" accept="image/*" tabindex="-1" aria-hidden="true">'
                + '<p class="ctl-msg" id="ctl-msg" role="status"></p>';
        }
        function onPanelClick(ev) {
            var t = ev.target && ev.target.closest ? ev.target.closest('[data-ctl-act]') : null; if (!t || t.disabled) return;
            var act = t.getAttribute('data-ctl-act'), k = ''; try { k = decodeURIComponent(t.getAttribute('data-k') || ''); } catch (e) { k = ''; }
            if (act === 'pick') { pendingKey = k; var f = $('ctl-file'); if (f) { f.value = ''; f.click(); } }
            else if (act === 'rm') { removeImage(k); msg('Picture removed.'); }
            else if (act === 'mv') { moveItem(k, parseInt(t.getAttribute('data-d'), 10) || 0); }
            else if (act === 'mvi') { moveCatItem(window.__ctlIordCat, k, parseInt(t.getAttribute('data-d'), 10) || 0); }
        }
        function onPanelChange(ev) {
            var t = ev.target; if (!t) return;
            if (t.id === 'ctl-ord-mode') { window.__ctlSetOrderMode(t.value); return; }
            if (t.id === 'ctl-ord-smode') { window.__ctlSetSubMode(t.value); return; }
            if (t.id === 'ctl-ord-imode') { window.__ctlSetItemMode(t.value); return; }
            if (t.id === 'ctl-iord-cat') { window.__ctlIordCat = t.value; renderPanel(); return; }
            if (t.id === 'ctl-hide-items') { hideSet('items', !!t.checked); msg(t.checked ? 'The “All items” button is hidden.' : 'The “All items” button is back.'); return; }
            if (t.id === 'ctl-hide-cat') { hideSet('cat', !!t.checked); msg(t.checked ? 'The “All <category>” buttons are hidden.' : 'The “All <category>” buttons are back.'); return; }
            if (t.getAttribute && t.getAttribute('data-ctl-pos')) {          // a typed position number
                var kind = t.getAttribute('data-ctl-pos'), key = ''; try { key = decodeURIComponent(t.getAttribute('data-k') || ''); } catch (e) { key = ''; }
                var to = parseInt(t.value, 10); if (!isFinite(to)) { renderPanel(); return; }
                if (kind === 'item') moveCatItem(window.__ctlIordCat, key, 0, to); else moveItem(key, 0, to);
                return;
            }
            if (t.id === 'ctl-plain-switch') { setPlain(!!t.checked); msg(t.checked ? 'Categories without a picture are plain buttons.' : 'Categories without a picture show a coloured letter tile.'); return; }
            if (t.id === 'ctl-switch') { setEnabled(!!t.checked); msg(t.checked ? 'Category tiles are ON for the Sales Counter.' : 'Category tiles are OFF. The Sales Counter is back to the usual list.'); return; }
            if (t.id === 'ctl-file') {
                var file = t.files && t.files[0], key = pendingKey; if (!file || !key) return;
                msg('Preparing the picture…');

                    var r = setImage(key, u);
                    if (r.ok) { msg('Picture saved for "' + key + '".'); toast('Category picture saved.'); } else { msg(r.error, true); toast(r.error, true); }
                }, function (e) { var m = (e && e.message) || 'Could not use that picture.'; msg(m, true); toast(m, true); });
            }
        }
        function installPanel() {
            if ($('ctl-panel')) return true;
            var nav = $('settings-subnav'), gen = $('settings-section-general'), pay = $('pos-paymethods-panel');
            var panel = document.createElement('div'); panel.id = 'ctl-panel';
            if (nav && gen && gen.parentNode) {
                var sec = document.createElement('div'); sec.className = 'settings-section-content'; sec.id = 'settings-section-catimages';
                sec.appendChild(panel); gen.parentNode.appendChild(sec);
                var b = document.createElement('button'); b.type = 'button'; b.className = 'settings-subtab-btn'; b.setAttribute('data-section', 'settings-section-catimages');
                b.textContent = '🖼️ Category Images & Order'; b.setAttribute('onclick', "showSettingsSection('settings-section-catimages', this)");
                b.addEventListener('click', function () { renderPanel(); });
                var after = nav.querySelector('[data-section="settings-section-paymethods"]') || nav.querySelector('[data-section="settings-section-receipts"]');
                if (after && after.parentNode) after.parentNode.insertBefore(b, after.nextSibling); else nav.appendChild(b);
            } else if (pay && pay.parentNode) {
                panel.className = 'panel'; panel.style.marginBottom = '15px'; pay.parentNode.insertBefore(panel, pay.nextSibling);
            } else return false;
            panel.addEventListener('click', onPanelClick); panel.addEventListener('change', onPanelChange);
            renderPanel();
            return true;
        }

        /* ---------- start ---------- */
        function start() {
            try {
                if (!$('item-image-grid') || typeof window.renderItemImageGrid !== 'function') return;   // Water has no product grid: nothing to do
                loadOrig();
                try { var hc = window.hospScreenChips; if (typeof hc === 'function' && !hc.__ctl) { var hw = function () { return window.__ctlOrderChips(hc.apply(this, arguments)); }; hw.__ctl = true; window.hospScreenChips = hw; } } catch (e) { /* the chip bar keeps its own order */ }
                installRender(); installSync();
                document.addEventListener('input', onSearchInput, true);
                if (!installPanel()) { [600, 2500].forEach(function (ms) { setTimeout(function () { try { installPanel(); } catch (e) { /* later */ } }, ms); }); }
                else [1200].forEach(function (ms) { setTimeout(function () { try { renderPanel(); } catch (e) { /* later */ } }, ms); });
                if (enabled()) refresh();
            } catch (e) { /* the Sales Counter works without this block */ }
        }
        Object.assign(window.__catTiles, {
            version: 1, MAX_IMAGES: MAX_IMAGES, MAX_PX: MAX_PX,
            enabled: enabled, setEnabled: setEnabled, plainOn: plainOn, setPlain: setPlain, images: images, setImage: setImage, removeImage: removeImage, scaleFile: scaleFile,
            categories: categories, order: ordGet, setOrderMode: function (m) { window.__ctlSetOrderMode(m); }, state: function () { return { cat: S.cat && S.cat.key, sub: S.sub, mode: mode(categories()) }; },
            open: openCat, openSub: openSub, back: back, refresh: refresh, sync: function () { sync(); }, collect: collect, apply: applyRemote, renderPanel: renderPanel
        });
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    })();
    </script>
