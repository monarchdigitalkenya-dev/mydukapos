<!-- FIRST RUN & CUSTOMERS (zip 258) -------------------------------------------------------------------------------------------
     1. Empty states: an empty Inventory and an empty Sales Counter explain that products come first and offer "Add your first item" and
        (where the app supports it) the Excel/CSV import. After the first item is saved a short "what next" card appears on Add New Items.
     2. Checkout customer: ONE field that finds an existing customer by name or phone, or adds a new one without leaving the sale. The old
        phone box stays in the page (hidden) as the single source of truth the checkout already reads, so nothing about how a sale is saved
        changes. A new customer is only saved by the existing registerOrUpdateCustomer() AFTER the sale succeeded (the name rides along).
     3. My Customers: searchable, sortable, paged list; a tabbed profile (Overview / Transactions / Bills & balances / Loyalty) built only from
        records already saved (salesLog, bills, returns, customers). Nothing here invents history.
     4. Loyalty: tokens are matched by normalised phone (0712.. and +254712.. are one customer, like registerOrUpdateCustomer already treats them) and
        each award is stamped on the sale that earned it (tokensEarned) so the profile can show a dated ledger. Older balances show as one
        "before itemised history" line. Tokens are not redeemed anywhere in this POS and no reversal rule exists, so none is invented.
     Same block in Shop, Hotel, Pharmacy, Production, Services and Hospital. Every function is guarded: if a page lacks something it does nothing. -->

<script>
(function () {
    'use strict';
    if (window.__frCustomers) return;
    window.__frCustomers = true;

    /* ---------------- small helpers (all guarded: a page that lacks something just skips that piece) ---------------- */
    function $(id) { return document.getElementById(id); }
    function esc(s) {
        s = String(s == null ? '' : s);
        try { if (typeof escapeHtml === 'function') return escapeHtml(s); } catch (e) { /* fall through */ }
        return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
    }
    function np(p) {
        try { if (typeof normalizeKenyanPhone === 'function') return normalizeKenyanPhone(String(p || '')); } catch (e) { /* digits only */ }
        return String(p || '').replace(/\D/g, '');
    }
    /* direct reads of the page's own lists (they are top-level `let`s of the app script); a page that lacks one just gets an empty list */
    var GET = {
        customers: function () { return customers; }, inventory: function () { return inventory; }, salesLog: function () { return salesLog; },
        bills: function () { return bills; }, returns: function () { return returns; }, debts: function () { return debts; }
    };
    function arr(name) { try { var v = GET[name](); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
    function custs() { return arr('customers'); }
    function money(n) { return 'KES ' + (Number(n) || 0).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function dateOf(ts) { var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
    function dateTimeOf(ts) { var d = new Date(ts); return isNaN(d) ? '' : dateOf(ts) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }

    function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
    var IC = {
        box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',

        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',

        cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2.5l2.2 11h10.6L20 7H6.4"/></svg>',
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
    };

    /* Which phone is this sale/return/bill linked to? (a bill payment carries its bill's phone) */
    var billIdx = { n: -1, map: null };
    function billMap() {
        var bs = arr('bills');
        if (billIdx.map && billIdx.n === bs.length) return billIdx.map;
        var m = {}; bs.forEach(function (b) { if (b && b.id != null) m[b.id] = b; });
        billIdx = { n: bs.length, map: m }; return m;
    }
    function salePhone(s) {
        if (!s) return '';
        var p = s.customerPhone || s.mpesaPhone;
        if (p) return np(p);
        if (s.billId != null) { var b = billMap()[s.billId]; if (b) return np(b.customerPhone || b.mpesaPhone); }
        return '';
    }
    function findCust(phone) {
        var n = np(phone); if (!n) return null;
        var list = custs();
        for (var i = 0; i < list.length; i++) { if (list[i] && list[i].phone && np(list[i].phone) === n) return list[i]; }
        return null;
    }
    function salesOf(c) {
        var n = np(c.phone); if (!n) return [];
        return arr('salesLog').filter(function (s) { return s && salePhone(s) === n; });
    }
    function saleTotal(s) { return (Number(s.cashAmount) || 0) + (Number(s.mpesaAmount) || 0) + (Number(s.cardAmount) || 0); }
    function billsOf(c) {
        var n = np(c.phone); if (!n) return [];
        return arr('bills').filter(function (b) { return b && np(b.customerPhone || b.mpesaPhone) === n; });
    }
    function returnsOf(c) {
        var n = np(c.phone); if (!n) return [];
        return arr('returns').filter(function (r) { return r && r.customerPhone && np(r.customerPhone) === n; });
    }
    function billTotal(b) { try { if (typeof billTotalOf === 'function') return Number(billTotalOf(b)) || 0; } catch (e) { /* below */ } return Number(b.total) || 0; }

    /* One pass over the sales log: normalised phone -> { count, spend, last } (the list needs this for every customer, so it must not filter per row) */
    var statCache = { key: '', map: null, at: 0 };
    function statMap() {
        var log = arr('salesLog');
        var key = log.length + ':' + (log.length ? (log[log.length - 1] && log[log.length - 1].id) : '') + ':' + arr('bills').length;
        if (statCache.map && statCache.key === key && Date.now() - statCache.at < 3000) return statCache.map;   /* the short time limit also picks up a void, which changes neither length nor last id */
        var m = {};
        log.forEach(function (s) {
            if (!s || s.voided) return;
            var p = salePhone(s); if (!p) return;
            var e = m[p] || (m[p] = { count: 0, spend: 0, last: 0 });
            e.count++; e.spend += saleTotal(s);
            var t = Date.parse(s.timestamp) || 0; if (t > e.last) e.last = t;
        });
        statCache = { key: key, map: m, at: Date.now() }; return m;
    }
    function owedMap() {
        var m = {};
        arr('bills').forEach(function (b) {
            if (!b || b.voided || b.closed) return;
            var p = np(b.customerPhone || b.mpesaPhone); if (!p) return;
            var out = billTotal(b) - (Number(b.amountPaid) || 0);
            if (out > 0.004) m[p] = (m[p] || 0) + out;
        });
        arr('debts').forEach(function (d) {   /* zip 262: recorded debts are money owed too - same rule as the customer ledger */
            if (!d) return; var p = np(d.phone); if (!p) return;
            var out = (Number(d.amount) || 0) - (Array.isArray(d.payments) ? d.payments : []).reduce(function (t, x) { return t + (Number(x && x.amount) || 0); }, 0);
            if (out > 0.004) m[p] = (m[p] || 0) + out;
        });
        return m;
    }

    /* the old per-app helper compared phones with === ; this one treats 0712.. and +254712.. as the same person, like registration does */
    window.customerPurchaseCount = function (phone) { var e = statMap()[np(phone)]; return e ? e.count : 0; };

    /* ---------------- navigation ---------------- */
    function tabButton(id) { return document.querySelector('.tab-link[data-tab="' + id + '"]'); }
    function tabAllowed(id) { var b = tabButton(id); return !!(b && b.style.display !== 'none' && !b.hidden && !b.disabled); }
    function goTab(id) {
        var b = tabButton(id);
        if (!b) return false;
        try { b.click(); return true; } catch (e) { return false; }
    }

    /* ======================================================================================================================
       1. EMPTY STATES
       ====================================================================================================================== */
    function invCount() { return arr('inventory').length; }
    function sellableCount() {
        var inv = arr('inventory');
        try { if (typeof isSellableProduct === 'function') return inv.filter(function (p) { return isSellableProduct(p) && (p.type || 'item') !== 'ingredient'; }).length; } catch (e) { /* plain count */ }
        return inv.length;
    }
    function canImport() { return !!$('inventory-import-file-input') && typeof importInventoryCsv === 'function'; }

    function emptyCardHtml(kind) {
        var addOk = tabAllowed('add-item-tab');
        var title = kind === 'sales' ? 'Nothing to sell yet' : 'Your inventory is empty';
        var body = kind === 'sales'
            ? 'Add the products you sell, then search or tap them here to build a sale. You can still use <b>Sell Unlisted Item</b> for a one-off sale.'
            : 'Products need to be in your inventory before you can record a sale. Add them one at a time, or import a list you already keep.';

        if (addOk && canImport()) acts += '<button type="button" class="fr-btn" data-fr="import">' + IC.up + 'Import from Excel / CSV</button>';

            ? '<p class="fr-hint">Item name and selling price are enough to start. Cost, stock quantity, code and category can be added now or later.</p>'

    }
    function focusFirstField() {
        try { var t = $('add-item-tab'); var i = t && t.querySelector('input:not([type=hidden]):not([type=file]):not([type=checkbox]), select'); if (i && i.offsetParent !== null) i.focus({ preventScroll: false }); } catch (e) { /* cosmetic */ }

    var P = { id: null, tab: 'overview', txLimit: 15, opener: null };
    var TABS_ALL = [['overview', 'Overview'], ['tx', 'Transactions'], ['bills', 'Bills & balances'], ['acct', 'Statement'], ['loyalty', 'Loyalty']];
    var TABS = TABS_ALL;
    /* Production has no loyalty feature at all (no tiers, no award on a sale): its profile has no Loyalty tab rather than a tab pointing at settings that do not exist */
    function loyaltySupported() { try { return typeof computeTokensEarned === 'function' && typeof awardTokensForSale === 'function'; } catch (e) { return false; } }

    function ensureProfile() {
        if ($('fr-profile')) return;
        var d = document.createElement('div'); d.id = 'fr-profile'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'fr-p-name');
        d.innerHTML = '<div class="fr-sheet"><div class="fr-head"><span class="fr-av" id="fr-p-av" aria-hidden="true"></span><div style="flex:1;min-width:0"><h2 id="fr-p-name"></h2><small id="fr-p-meta"></small></div><button type="button" class="fr-x" id="fr-p-close" aria-label="Close customer profile">&times;</button></div>' +
            '<div class="fr-hact"><button type="button" class="fr-btn fr-primary" id="fr-p-sale">' + IC.cart + 'Start a sale</button><button type="button" class="fr-btn" id="fr-p-stmt">Statement</button><button type="button" class="fr-btn" id="fr-p-inv" title="Itemised invoice for everything this customer still owes">Generate invoice</button></div>' +
            '<div class="fr-tabs" role="tablist" aria-label="Customer sections" id="fr-p-tabs"></div><div class="fr-body" id="fr-p-body" role="tabpanel" tabindex="0"></div></div>';
        document.body.appendChild(d);
        $('fr-p-close').onclick = closeProfile;
        d.addEventListener('mousedown', function (e) { if (e.target === d) closeProfile(); });
        $('fr-p-sale').onclick = function () { var c = custById(P.id); closeProfile(); if (c) { goTab('sales-tab'); setTimeout(function () { if (els.q) attach(c); }, 120); } };
        $('fr-p-stmt').onclick = function () { if (typeof customerLedgerBuild === 'function') { P.tab = 'acct'; renderProfile(); $('fr-tab-acct').focus(); } else { var id = P.id; closeProfile(); if (origOpen) origOpen(id); } };
        $('fr-p-inv').onclick = function () { acctAct('invoice'); };
        d.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { e.preventDefault(); closeProfile(); return; }
            if (e.key === 'Tab') {
                var f = [].slice.call(d.querySelectorAll('button:not([disabled]), summary, [tabindex="0"], a[href]')).filter(function (x) { return x.offsetParent !== null; });
                if (!f.length) return; var a = f[0], z = f[f.length - 1];
                if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
            }
        });
    }
    function custById(id) { var l = custs(); for (var i = 0; i < l.length; i++) if (l[i] && String(l[i].id) === String(id)) return l[i]; return null; }
    function closeProfile() { var d = $('fr-profile'); if (d) d.classList.remove('fr-open'); P.id = null; try { if (P.opener && document.body.contains(P.opener)) P.opener.focus(); } catch (e) { /* cosmetic */ } }
    window.openCustomerProfileModal = function (id) {
        var c = custById(id); if (!c) return;
        TABS = (loyaltySupported() ? TABS_ALL : TABS_ALL.slice(0, 4)).filter(function (x) { return x[0] !== 'acct' || typeof window.customerLedgerBuild === 'function'; });   /* Services keeps its own statement */
        ensureProfile(); $('fr-p-inv').hidden = typeof window.printCustomerInvoice !== 'function'; P.id = id; P.tab = 'overview'; P.per = 'full'; P.txLimit = 15; P.opener = document.activeElement;
        $('fr-p-name').textContent = c.name || 'Unnamed customer';
        $('fr-p-av').textContent = ((c.name || '?').trim()[0] || '?').toUpperCase();
        $('fr-p-meta').textContent = c.phone + (c.createdAt > 946684800000 ? ' · customer since ' + dateOf(c.createdAt) : '');
        $('fr-profile').classList.add('fr-open');
        renderProfile(); $('fr-p-close').focus();
    };
    function renderTabs() {
        var t = $('fr-p-tabs');
        t.innerHTML = TABS.map(function (x) { return '<button type="button" role="tab" class="fr-tab" id="fr-tab-' + x[0] + '" data-t="' + x[0] + '" aria-selected="' + (P.tab === x[0]) + '" aria-controls="fr-p-body" tabindex="' + (P.tab === x[0] ? 0 : -1) + '">' + esc(x[1]) + '</button>'; }).join('');
        t.querySelectorAll('.fr-tab').forEach(function (b) {
            b.onclick = function () { P.tab = b.dataset.t; P.txLimit = 15; renderProfile(); $('fr-tab-' + P.tab).focus(); };
            b.onkeydown = function (e) {
                var i = TABS.findIndex(function (x) { return x[0] === P.tab; });
                if (e.key === 'ArrowRight') i = (i + 1) % TABS.length; else if (e.key === 'ArrowLeft') i = (i + TABS.length - 1) % TABS.length; else return;
                e.preventDefault(); P.tab = TABS[i][0]; renderProfile(); $('fr-tab-' + P.tab).focus();
            };
        });
        $('fr-p-body').setAttribute('aria-labelledby', 'fr-tab-' + P.tab);
    }
    function renderProfile() {
        var c = custById(P.id); if (!c) { closeProfile(); return; }
        renderTabs();
        var body = $('fr-p-body');
        body.innerHTML = P.tab === 'tx' ? txHtml(c) : P.tab === 'bills' ? billsHtml(c) : P.tab === 'acct' ? acctHtml(c) : P.tab === 'loyalty' ? loyaltyHtml(c) : overviewHtml(c);
        wireBody(body, c);
    }
    function saleStatus(s) {
        if (s.voided) return '<span class="fr-pill fr-bad">Voided</span>';
        if (s.billId != null || s.installment) return '<span class="fr-pill">Bill payment</span>';
        if (s.paid === false) return '<span class="fr-pill fr-warn">Unpaid</span>';
        return '<span class="fr-pill fr-good">Paid</span>';
    }
    function payParts(s) {
        var p = [];
        if (Number(s.cashAmount) > 0) p.push('Cash ' + money(s.cashAmount));
        if (Number(s.mpesaAmount) > 0) p.push('M-Pesa ' + money(s.mpesaAmount));
        if (Number(s.cardAmount) > 0) p.push('Card/bank ' + money(s.cardAmount));
        return p.join(' · ');
    }
    function saleCard(s) {
        var items = Array.isArray(s.items) ? s.items : [];
        var lines = items.map(function (i) {
            var q = Number(i.qty) || 0, pr = Number(i.price) || 0;
            return '<tr><td>' + esc(i.name || i.code || 'Item') + '</td><td>' + esc(q) + (i.unit && i.unit !== 'pcs' ? ' ' + esc(i.unit) : '') + '</td><td>' + esc(money(q * pr)) + '</td></tr>';
        }).join('');
        var summary = items.slice(0, 3).map(function (i) { return esc((Number(i.qty) || 1) + ' × ' + (i.name || i.code || 'Item')); }).join(', ') + (items.length > 3 ? ' +' + (items.length - 3) + ' more' : '');
        var disc = Number(s.totalDiscount) > 0 ? '<div class="fr-sub">Discount: ' + esc(money(s.totalDiscount)) + '</div>' : '';
        var tok = Number(s.tokensEarned) > 0 ? '<div class="fr-sub">Tokens earned: +' + esc(s.tokensEarned) + '</div>' : '';
        return '<div class="fr-card"><div class="fr-top"><b>' + esc(money(saleTotal(s))) + '</b><span>' + saleStatus(s) + '</span></div>' +
            '<div class="fr-sub">' + esc(dateTimeOf(s.timestamp)) + (s.refNumber ? ' · Receipt ' + esc(s.refNumber) : '') + (s.servedBy ? ' · Served by ' + esc(s.servedBy) : '') + '</div>' +
            '<div class="fr-sub">' + (summary || 'No item lines') + '</div>' + (payParts(s) ? '<div class="fr-sub">' + esc(payParts(s)) + '</div>' : '') + disc + tok +
            '<details><summary>Items and receipt</summary>' + (lines ? '<table class="fr-lines"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>' + lines + '</tbody></table>' : '<p class="fr-sub">No item lines were saved for this record.</p>') +
            '<button type="button" class="fr-btn" style="margin-top:8px" data-receipt="' + esc(s.id) + '">View receipt</button></details></div>';
    }
    function sortedSales(c) { return salesOf(c).sort(function (a, b) { return (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0); }); }

    function overviewHtml(c) {
        var sales = sortedSales(c); var live = sales.filter(function (s) { return !s.voided; });
        var spend = live.reduce(function (t, s) { return t + saleTotal(s); }, 0);
        var owed = owedMap()[np(c.phone)] || 0; var tok = Number(c.tokens) || 0; var credit = Number(c.storeCredit) || 0;
        var tiles = '<div class="fr-tiles"><div class="fr-tile"><b>' + esc(money(spend)) + '</b><span>Total spent</span></div><div class="fr-tile"><b>' + live.length + '</b><span>Purchases</span></div><div class="fr-tile"><b>' + (live.length ? esc(dateOf(live[0].timestamp)) : '&mdash;') + '</b><span>Last purchase</span></div><div class="fr-tile"><b>' + esc(money(owed)) + '</b><span>Balance owed (bills &amp; debts)</span></div>' +
            (credit > 0 ? '<div class="fr-tile"><b>' + esc(money(credit)) + '</b><span>Store credit</span></div>' : '') + (loyaltySupported() && (tok > 0 || loyaltyOn()) ? '<div class="fr-tile"><b>' + tok + '</b><span>Loyalty tokens</span></div>' : '') + '</div>';
        if (!sales.length && !billsOf(c).length) return tiles + '<div class="fr-empty"><div class="fr-ico">' + IC.cart + '</div><h4>No purchases yet</h4><p>Sales made for this customer will appear here with their receipts, payments and tokens. Start a sale and attach this customer to begin.</p></div>';
        return tiles + '<div class="fr-h5">Latest activity</div>' + sales.slice(0, 3).map(saleCard).join('') + (sales.length > 3 ? '<button type="button" class="fr-btn fr-more" data-goto="tx">See all ' + sales.length + ' transactions</button>' : '');
    }
    function txHtml(c) {
        var sales = sortedSales(c); var rets = returnsOf(c).sort(function (a, b) { return (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0); });
        var h = '';
        if (!sales.length) h += '<div class="fr-empty"><div class="fr-ico">' + IC.cart + '</div><h4>No transactions yet</h4><p>Completed sales for this customer will be listed here, newest first.</p></div>';
        else { h += sales.slice(0, P.txLimit).map(saleCard).join(''); if (sales.length > P.txLimit) h += '<button type="button" class="fr-btn fr-more" data-more="1">Show ' + Math.min(15, sales.length - P.txLimit) + ' more</button>'; }
        h += '<div class="fr-h5">Returns, exchanges and refunds</div>';
        h += rets.length ? rets.map(function (r) {
            var orig = r.linkedSaleId || '';
            return '<div class="fr-card"><div class="fr-top"><b>' + esc(r.type === 'exchange' ? 'Exchange' : 'Return') + ': ' + esc(r.itemName || 'item') + (r.qty ? ' × ' + esc(r.qty) : '') + '</b><span class="fr-pill">' + esc(dateOf(r.timestamp)) + '</span></div><div class="fr-sub">' +
                (r.refNumber ? 'Original receipt ' + esc(r.refNumber) + ' · ' : '') + (r.reason ? 'Reason: ' + esc(r.reason) + ' · ' : '') + (Number(r.returnCreditValue) > 0 ? 'Credit ' + esc(money(r.returnCreditValue)) + ' · ' : '') + (Number(r.storeCreditIssued) > 0 ? 'Store credit issued ' + esc(money(r.storeCreditIssued)) + ' · ' : '') + (r.servedBy ? 'By ' + esc(r.servedBy) : '') + '</div>' +
                (orig && arr('salesLog').some(function (s) { return s.id === orig; }) ? '<button type="button" class="fr-btn" style="margin-top:8px" data-receipt="' + esc(orig) + '">View linked receipt</button>' : '') + '</div>';
        }).join('') : '<p class="fr-note">No returns or exchanges are recorded for this customer. Returns made with this customer’s phone number appear here.</p>';
        return h;
    }
    function billsHtml(c) {
        var bs = billsOf(c).sort(function (a, b) { return (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0); });
        var dl = arr('debts').filter(function (d) { return d && np(d.phone) === np(c.phone); });
        if (!bs.length && !dl.length) return '<div class="fr-empty"><div class="fr-ico">' + IC.users + '</div><h4>No bills or credit</h4><p>Pay Later bills for this customer, with every part-payment and the balance still owed, will be listed here separately from completed sales.</p></div>';
        var nd = new Date(), today = nd.getFullYear() + '-' + ('0' + (nd.getMonth() + 1)).slice(-2) + '-' + ('0' + nd.getDate()).slice(-2);   /* the shop's own calendar day, not UTC */
        return bs.map(function (b) {
            var total = billTotal(b), paid = Number(b.amountPaid) || 0, out = Math.max(0, total - paid);
            var st = b.voided ? '<span class="fr-pill fr-bad">Voided</span>' : out <= 0.004 ? '<span class="fr-pill fr-good">Paid</span>' : paid > 0 ? '<span class="fr-pill fr-warn">Part-paid</span>' : '<span class="fr-pill fr-warn">Unpaid</span>';
            var overdue = !b.voided && out > 0.004 && b.dueDate && String(b.dueDate) < today ? ' <span class="fr-pill fr-bad">Overdue</span>' : '';
            var hist = (Array.isArray(b.paymentHistory) ? b.paymentHistory : []).map(function (p) { return '<tr><td>' + esc(dateOf(p.timestamp)) + '</td><td>' + esc(p.method || '') + '</td><td>' + esc(money(p.amount)) + '</td></tr>'; }).join('');
            return '<div class="fr-card"><div class="fr-top"><b>' + esc(money(total)) + ' bill</b><span>' + st + overdue + '</span></div><div class="fr-sub">' + esc(dateOf(b.timestamp)) + (b.refNumber ? ' · ' + esc(b.refNumber) : '') + (b.dueDate ? ' · Due ' + esc(b.dueDate) : ' · No due date') + '</div>' +
                '<div class="fr-sub">Paid ' + esc(money(paid)) + ' · <b>Balance ' + esc(money(out)) + '</b></div>' +
                '<details><summary>Payments (' + (Array.isArray(b.paymentHistory) ? b.paymentHistory.length : 0) + ')</summary>' + (hist ? '<table class="fr-lines"><thead><tr><th>Date</th><th>Method</th><th>Amount</th></tr></thead><tbody>' + hist + '</tbody></table>' : '<p class="fr-sub">No payments recorded yet.</p>') + '</details></div>';
        }).join('') + dl.map(function (d) {
            var paid = (Array.isArray(d.payments) ? d.payments : []).reduce(function (t, x) { return t + (Number(x && x.amount) || 0); }, 0), out = Math.max(0, (Number(d.amount) || 0) - paid);
            return '<div class="fr-card"><div class="fr-top"><b>' + esc(money(d.amount)) + ' debt</b><span>' + (out <= 0.004 ? '<span class="fr-pill fr-good">Paid</span>' : '<span class="fr-pill fr-warn">' + (paid > 0 ? 'Part-paid' : 'Unpaid') + '</span>') + '</span></div><div class="fr-sub">' + esc(dateOf(d.createdAt)) + (d.notes ? ' · ' + esc(d.notes) : '') + '</div><div class="fr-sub">Paid ' + esc(money(paid)) + ' · <b>Balance ' + esc(money(out)) + '</b></div></div>';
        }).join('') + '<button type="button" class="fr-btn fr-primary fr-more" data-act="invoice">Generate invoice for what is owed</button><button type="button" class="fr-btn fr-more" data-goto-tab="bills-tab">Open the Bills tab to take a payment</button>';
    }
    /* zip 262: the full account statement. The ledger itself lives in shared code (customerLedgerBuild); this tab only presents it. */
    function acctHtml(c) {
        if (typeof customerLedgerBuild !== 'function') return '<div class="fr-empty"><h4>Statement unavailable</h4></div>';
        var per = P.per || 'full', L = customerLedgerBuild(c, per);
        var pb = [['full', 'All activity'], ['month1', 'Last month'], ['month6', 'Last 6 months']].map(function (x) { return '<button type="button" class="fr-btn' + (per === x[0] ? ' fr-primary' : '') + '" data-per="' + x[0] + '">' + x[1] + '</button>'; }).join('');
        var out = L.outstandingTotal > 0.004 ? '<div class="fr-note"><b>Outstanding now: ' + esc(money(L.outstandingTotal)) + '</b> across ' + plural(L.open.length, 'unpaid item') + '. <span class="fr-sub">Generate invoice lists only these; the statement below also shows settled items.</span></div>' : '';
        return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' + pb + '</div>' + out +
            '<div style="overflow-x:auto">' + window.customerLedgerTableHtml(L, true) + '</div><div style="margin-top:12px">' + window.customerLedgerTotalsHtml(L) + '</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button type="button" class="fr-btn" data-act="print">Print statement</button><button type="button" class="fr-btn fr-primary" data-act="invoice">Generate invoice</button><button type="button" class="fr-btn" data-act="pdf">Download</button><button type="button" class="fr-btn" data-act="share">Share</button></div>';
    }
    function acctAct(a) {
        var c = custById(P.id); if (!c) return;
        try {
            currentCustomerProfileId = c.id; currentCustomerStatementPeriod = P.per || 'full';   /* the shared print/download/share helpers read these */
            if (a === 'invoice') { closeProfile(); if (typeof printCustomerInvoice === 'function') printCustomerInvoice(); }
            else if (a === 'print') { closeProfile(); printCustomerStatement(); }
            else if (a === 'pdf') downloadCustomerStatement();
            else if (a === 'share') shareCustomerStatementNative();
        } catch (e) { toast('Could not open the statement.', true); }
    }
    function loyaltyOn() { try { return typeof loyaltyEnabled !== 'undefined' && !!loyaltyEnabled; } catch (e) { return false; } }
    function loyaltyHtml(c) {
        var tok = Number(c.tokens) || 0; var tv = 1; try { tv = Number(tokenValueKES) || 1; } catch (e) { /* default */ }
        var tiers = []; try { tiers = Array.isArray(loyaltyTiers) ? loyaltyTiers : []; } catch (e) { /* none */ }
        var rules = !loyaltyOn() ? '<p class="fr-note">Loyalty tokens are switched off for this shop. Turn them on in Settings to start awarding tokens on payment.</p>' :
            (tiers.length ? '<div class="fr-note"><b>How tokens are earned:</b> ' + tiers.map(function (t) { return 'spend ' + esc(money(t.minSpend)) + (t.maxSpend == null ? ' or more' : ' to ' + esc(money(t.maxSpend))) + ' = ' + esc(t.tokens) + ' token' + (Number(t.tokens) === 1 ? '' : 's'); }).join('; ') + '. Tokens are added once a payment is made (for a bill, on each payment). One token is shown as ' + esc(money(tv)) + '.</div>' : '<p class="fr-note">Loyalty is on, but no earning tiers are set yet. Add them in Settings.</p>');
        var rows = salesOf(c).filter(function (s) { return Number(s.tokensEarned) > 0; }).sort(function (a, b) { return (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0); });
        var sum = rows.reduce(function (t, s) { return t + Number(s.tokensEarned); }, 0); var carried = tok - sum;
        var led = rows.map(function (s) {
            return '<tr><td>' + esc(dateOf(s.timestamp)) + '</td><td>' + esc(s.billId != null || s.installment ? 'Bill payment' : 'Sale') + (s.refNumber ? ' ' + esc(s.refNumber) : '') + (s.voided ? ' <span class="fr-pill fr-bad">voided, tokens not reversed</span>' : '') + '</td><td>+' + esc(s.tokensEarned) + '</td></tr>';
        }).join('');
        if (Math.abs(carried) > 0.0001) led += '<tr><td>&mdash;</td><td>Balance from before itemised history (and any other adjustments)</td><td>' + (carried > 0 ? '+' : '') + esc(Math.round(carried * 100) / 100) + '</td></tr>';
        return '<div class="fr-tiles"><div class="fr-tile"><b>' + tok + '</b><span>Token balance</span></div><div class="fr-tile"><b>' + esc(money(tok * tv)) + '</b><span>Display value</span></div></div>' + rules +
            '<div class="fr-h5">Token history</div>' + (led ? '<table class="fr-lines"><thead><tr><th>Date</th><th>Source</th><th>Tokens</th></tr></thead><tbody>' + led + '</tbody></table>' : '<div class="fr-empty"><h4>No token activity</h4><p>' + (loyaltyOn() ? 'Tokens appear here after this customer makes a payment that falls in an earning tier.' : 'Switch loyalty on in Settings to start earning tokens.') + '</p></div>') +
            '<p class="fr-note">Entries are read from the saved sales that earned them. Tokens are not redeemed at checkout in this POS, and voiding a sale does not take its tokens back.</p>';
    }
    function wireBody(body, c) {
        body.querySelectorAll('[data-receipt]').forEach(function (b) {
            b.onclick = function () {
                var id = b.dataset.receipt;
                try { closeProfile(); if (typeof reprintSale === 'function') reprintSale(id); else { var s = arr('salesLog').find(function (x) { return x.id === id; }); if (s && typeof renderReceipt === 'function') renderReceipt(s); } } catch (e) { toast('Could not open that receipt.', true); }
            };
        });
        body.querySelectorAll('[data-per]').forEach(function (b) { b.onclick = function () { P.per = b.dataset.per; var y = body.scrollTop; renderProfile(); body.scrollTop = y; }; });
        body.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { acctAct(b.dataset.act); }; });
        body.querySelectorAll('[data-goto]').forEach(function (b) { b.onclick = function () { P.tab = b.dataset.goto; renderProfile(); body.scrollTop = 0; }; });
        body.querySelectorAll('[data-goto-tab]').forEach(function (b) { b.onclick = function () { closeProfile(); goTab(b.dataset.gotoTab); }; });
        var more = body.querySelector('[data-more]'); if (more) more.onclick = function () { P.txLimit += 15; var y = body.scrollTop; renderProfile(); body.scrollTop = y; };
    }

    /* ---------------- start ---------------- */
    var ticks = 0;
    function tick() {
        try { updateInventoryEmpty(); } catch (e) { /* next tick */ }
        try { updateSalesEmpty(); } catch (e) { /* next tick */ }
        try { updateNextSteps(); } catch (e) { /* next tick */ }
        try { if (!els.q) buildField(); syncFromOrig(); } catch (e) { /* next tick */ }
        try { wrapRegister(); wrapAward(); } catch (e) { /* next tick */ }
        try { var ct = $('customers-tab'); if (ct && ct.classList.contains('active') && !ct.__fr) { ct.__fr = true; window.renderCustomersList(); } else if (ct && !ct.classList.contains('active')) ct.__fr = false; } catch (e) { /* next tick */ }
        ticks++;
    }
    function go() {
        try { watchInv(); } catch (e) { /* the tick covers it */ }
        tick(); setTimeout(tick, 400); setInterval(tick, 900);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
</script>
