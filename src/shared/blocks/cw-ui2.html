     Car Wash & Cleaning app, block "cw-ui2": Customers & Vehicles (profiles), Billing & Payments (invoices, deposits, part payments, refunds,
     M-Pesa prompts), Loyalty, SMS log, Staff & Teams, Reports (filters, Excel / CSV / PDF), Settings, Activity Log, and the job action dialogs
     (assign, cancel, release / deliver, payment, refund, complaint, edit). Written ONLY into carwash/index.html; never hand-edit it there.
     Plain global functions, ES2018 max, every global name starts with cw / Cw / CW_. After editing run `npm run sync`. -->

  #cw-app .cw-pl-car tr[data-pl] td:nth-child(1)::before { content: 'Service'; } #cw-app .cw-pl-car tr[data-pl] td:nth-child(2)::before { content: 'Section'; }
  #cw-app .cw-pl-car tr[data-pl] td:nth-child(3)::before { content: 'Price (KES)'; } #cw-app .cw-pl-car tr[data-pl] td:nth-child(4)::before { content: 'Duration (min)'; }
  #cw-app .cw-pl-car tr[data-pl] td:nth-child(5)::before { content: 'Loyalty'; } #cw-app .cw-pl-car tr[data-pl] td:nth-child(6)::before { content: 'Active'; }
  #cw-app .cw-pl-cl tr[data-pl] td:nth-child(1)::before { content: 'Service'; } #cw-app .cw-pl-cl tr[data-pl] td:nth-child(2)::before { content: 'Type'; }
  #cw-app .cw-pl-cl tr[data-pl] td:nth-child(3)::before { content: 'Price (KES)'; } #cw-app .cw-pl-cl tr[data-pl] td:nth-child(4)::before { content: 'Unit'; }
  #cw-app .cw-pl-cl tr[data-pl] td:nth-child(5)::before { content: 'Duration (min)'; } #cw-app .cw-pl-cl tr[data-pl] td:nth-child(6)::before { content: 'Loyalty'; } #cw-app .cw-pl-cl tr[data-pl] td:nth-child(7)::before { content: 'Active'; }
  #cw-app .cw-pl tr.cw-plper { display: block; } #cw-app .cw-pl tr.cw-plper td { display: block; }

}

<script>
/* ================================ CUSTOMERS ================================ */
CW_UI.cq = '';
CW_UI.pages.customers = function (me) {
  var q = cwStr(CW_UI.cq).trim().toLowerCase(), qp = q.replace(/\D/g, ''), qPlate = cwNormPlate(q);
  var plateOwners = {}; if (qPlate.length >= 2) cwVehicles.forEach(function (v) { if (v && !v._deleted && v.plate.indexOf(qPlate) !== -1) plateOwners[v.customerId] = true; });
  var list = cwLive(cwCustomers).filter(function (c) {
    if (!q) return true;
    return cwStr(c.name).toLowerCase().indexOf(q) !== -1 || (qp.length >= 3 && (cwStr(c.phone).indexOf(qp.charAt(0) === '0' ? '254' + qp.slice(1) : qp) !== -1)) || plateOwners[c.id];
  });
  var visits = {}, last = {};
  cwJobs.forEach(function (j) { if (!j || j._deleted || cwIsCancelled(j)) return; visits[j.customerId] = (visits[j.customerId] || 0) + 1; var t = cwNum(j.receivedAt); if (t > (last[j.customerId] || 0)) last[j.customerId] = t; });
  list.sort(function (a, b) { return (last[b.id] || cwNum(b.createdAt)) - (last[a.id] || cwNum(a.createdAt)); });
  var h = '<div class="cw-row" style="margin-bottom:12px"><input id="cw-cq" placeholder="Search name, phone or plate" value="' + cwEsc(CW_UI.cq) + '" style="max-width:340px"><span class="cw-sp"></span>' + (cwCan('customers.edit', me) ? '<button class="cw-btn" data-cw="custnew">＋ New customer</button>' : '') + '</div>';
  h += '<div class="cw-kpis">' + cwKpi('Customers', cwLive(cwCustomers).length) + cwKpi('Vehicles', cwLive(cwVehicles).length) + cwKpi('Returning', Object.keys(visits).filter(function (k) { return visits[k] > 1; }).length) + cwKpi('Showing', list.length) + '</div>';
  h += '<div class="cw-tblw"><table class="cw-tbl"><thead><tr><th>Customer</th><th>Phone</th><th>Type</th><th>Vehicles</th><th class="cw-num">Visits</th><th>Last visit</th></tr></thead><tbody>'
    + (list.length ? list.slice(0, 300).map(function (c) { var vs = cwVehiclesOf(c.id); return '<tr class="cw-click" data-cw="cust" data-id="' + cwEsc(c.id) + '"><td><b>' + cwEsc(c.name) + '</b>' + (c.migrated ? ' <span class="cw-small cw-mut">· imported</span>' : '') + '</td><td>' + cwEsc(cwFmtPhone(c.phone)) + '</td><td class="cw-small">' + cwEsc((CW_CUST_TYPES.filter(function (t) { return t.k === c.type; })[0] || { l: '' }).l) + '</td><td>' + vs.slice(0, 3).map(function (v) { return '<span class="cw-plate" style="font-size:11px;margin-right:4px">' + cwEsc(cwFmtPlate(v.plate)) + '</span>'; }).join('') + (vs.length > 3 ? ' +' + (vs.length - 3) : '') + '</td><td class="cw-num">' + (visits[c.id] || 0) + '</td><td class="cw-small">' + cwFmtDate(last[c.id]) + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="cw-empty"><b>👥</b>No customers match.</td></tr>')
    + '</tbody></table></div>' + (list.length > 300 ? '<p class="cw-small cw-mut">Showing the 300 most recent — search to narrow down.</p>' : '');
  return h;
};
function cwOpenCustomer(id, focusVehId) {
  var draw = function () { var c = cwFind(cwCustomers, id); if (!c) { cwCloseModal(); cwToast('Customer not found.', true); return; } cwOpenModal(cwCustomerHtml(c, focusVehId), false, draw); };
  draw();
}
function cwCustomerHtml(c, focusVehId) {
  var me = cwMe(), cfg = cwCfg(), vs = cwVehiclesOf(c.id), jobs = cwJobsOf(c.id), pays = cwPayments.filter(function (p) { return p && p.customerId === c.id; }).sort(function (a, b) { return cwNum(b.at) - cwNum(a.at); });
  var spent = 0; pays.forEach(function (p) { if (!p.reversedAt) spent += cwNum(p.amount); });
  var edit = cwCan('customers.edit', me);
  var h = cwPH('👤 ' + cwEsc(c.name), (cwCan('checkin', me) ? '<button class="cw-btn sm" data-cw="ckfor" data-id="' + cwEsc(c.id) + '">Check in a car</button><button class="cw-btn sm ghost" data-cw="cleanfor" data-id="' + cwEsc(c.id) + '">Cleaning job</button>' : '')) + '<div class="cw-pb">';
  h += '<div class="cw-kpis">' + cwKpi('Visits', jobs.filter(function (j) { return !cwIsCancelled(j); }).length) + cwKpi('Vehicles', vs.length) + (cwCan('dash.money', me) || me.owner ? cwKpi('Total paid', cwMoney(spent)) : '') + cwKpi('Customer since', cwFmtDate(c.createdAt)) + '</div>';
  h += '<div class="cw-card"><h3>Details</h3><div class="cw-form">'
    + cwFld('Name', 'cw-cu-name', c.name, edit) + cwFld('Primary phone', 'cw-cu-phone', cwFmtPhone(c.phone), edit) + cwFld('Alternative phone', 'cw-cu-alt', cwFmtPhone(c.altPhone), edit)
    + cwFld('Email', 'cw-cu-email', c.email, edit, 'email') + cwSel('Gender', 'cw-cu-gender', CW_GENDERS, c.gender, edit) + cwSel('Preferred contact method', 'cw-cu-pref', CW_CONTACT_PREFS, c.contactPref, edit)
    + '<div class="cw-f"><label>Customer type</label><select id="cw-cu-type"' + (edit ? '' : ' disabled') + '>' + CW_CUST_TYPES.map(function (t) { return '<option value="' + t.k + '"' + (c.type === t.k ? ' selected' : '') + '>' + t.l + '</option>'; }).join('') + '</select></div>'
    + cwFld('Location', 'cw-cu-loc', c.location, edit) + cwFld('Estate', 'cw-cu-estate', c.estate, edit) + cwFld('Town', 'cw-cu-town', c.town, edit) + cwFld('Building name', 'cw-cu-bld', c.building, edit) + cwFld('House number', 'cw-cu-house', c.house, edit) + cwFld('Floor', 'cw-cu-floor', c.floor, edit)
    + '<div class="cw-f full"><label>Notes</label><textarea id="cw-cu-notes"' + (edit ? '' : ' readonly') + '>' + cwEsc(c.notes || '') + '</textarea></div></div>'
    + (edit || cwCan('customers.delete', me) ? '<div class="cw-row" style="margin-top:10px">' + (cwCan('customers.delete', me) ? '<button class="cw-btn sm bad" data-cw="custdel" data-id="' + cwEsc(c.id) + '">🗑 Delete customer</button>' : '') + '<span class="cw-sp"></span>' + (edit ? '<button class="cw-btn" data-cw="custsave" data-id="' + cwEsc(c.id) + '">💾 Save details</button>' : '') + '</div>' : '') + '</div>';
  /* vehicles + loyalty per vehicle */
  h += '<div class="cw-card" style="margin-top:14px"><h3>🚗 Vehicles</h3>' + (vs.length ? vs.map(function (v) {
    var acc = cwLoyaltyAccount(cwLoyalty, cwLoyaltyKey({ kind: 'car', customerId: c.id }, c.phone, v.plate, cfg), cfg, cwJobs);
    var pct = Math.round(acc.current_cycle_count / acc.n * 100);
    return '<div style="padding:10px 0;border-bottom:1px solid #f1f5f9' + (focusVehId === v.id ? ';background:#ecfeff;border-radius:10px;padding:10px' : '') + '"><div class="cw-row"><span class="cw-plate">' + cwEsc(cwFmtPlate(v.plate)) + '</span><b>' + cwEsc([v.make, v.model, v.year ? '(' + v.year + ')' : ''].filter(Boolean).join(' ')) + '</b><span class="cw-mut cw-small">' + cwEsc(v.colour || '') + ' · ' + cwEsc(cwVehCatLabel(cfg, v.category)) + '</span><span class="cw-sp"></span>' + (edit ? '<button class="cw-btn sm sec" data-cw="vehedit" data-id="' + cwEsc(v.id) + '">Edit</button>' : '') + '</div>'
      + (cfg.loyalty.enabled !== false ? '<div class="cw-small" style="margin-top:6px">' + (acc.available > 0 ? '<span class="cw-free">🎁 ' + acc.available + ' FREE wash available</span>' : '⭐ ' + acc.current_cycle_count + '/' + acc.n + ' paid washes in this cycle') + ' · ' + acc.paid_visits + ' paid · ' + acc.free_visits_redeemed + ' free redeemed · last visit ' + cwFmtDate(acc.last_visit_date) + '</div><div class="cw-prog"><i style="width:' + (acc.available > 0 ? 100 : pct) + '%"></i></div>' : '')
      + (v.notes ? '<div class="cw-small cw-mut" style="margin-top:4px">' + cwEsc(v.notes) + '</div>' : '') + '</div>';
  }).join('') : '<div class="cw-mut">No vehicles registered.</div>') + (edit ? '<button class="cw-btn sm ghost" style="margin-top:10px" data-cw="vehnew" data-id="' + cwEsc(c.id) + '">＋ Register another vehicle</button>' : '') + '</div>';
  var clAcc = cwLoyaltyAccounts({ customers: [c], jobs: cwJobs, loyalty: cwLoyalty, cfg: cfg }).filter(function (a) { return a.kind === 'clean' && a.customerId === c.id; });
  if (clAcc.length) h += '<div class="cw-card" style="margin-top:14px"><h3>🧽 Cleaning loyalty</h3>' + clAcc.map(function (a) { return '<div class="cw-small" style="padding:4px 0">' + (a.cleanType ? cwEsc(cwCleanType(a.cleanType).l) + ': ' : 'All cleaning: ') + (a.available > 0 ? '<span class="cw-free">🎁 ' + a.available + ' FREE</span>' : a.current_cycle_count + '/' + a.n) + ' · ' + a.paid_visits + ' paid</div>'; }).join('') + '</div>';
  /* visits */
  h += '<div class="cw-card" style="margin-top:14px"><h3>🧾 Visits &amp; jobs <small>' + jobs.length + '</small></h3>' + (jobs.length ? '<div class="cw-tblw"><table class="cw-tbl"><thead><tr><th>Job</th><th>What</th><th>Status</th><th class="cw-num">Total</th><th>Payment</th></tr></thead><tbody>' + jobs.slice(0, 60).map(function (j) { var t = cwTotals(j); return '<tr class="cw-click" data-cw="job" data-id="' + cwEsc(j.id) + '"><td>' + cwEsc(j.no) + '<div class="cw-small cw-mut">' + cwFmtDT(j.receivedAt) + '</div></td><td>' + cwJobTitle(j) + '<div class="cw-small cw-mut">' + cwEsc(cwArr(j.items).map(function (i) { return i.name; }).join(' + ')) + '</div></td><td>' + cwStatusBadge(j) + '</td><td class="cw-num">' + cwMoney(t.total) + '</td><td>' + cwPayBadge(t) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="cw-mut">No visits yet.</div>') + '</div>';
  if (cwCan('payments', me) || me.owner) h += '<div class="cw-card" style="margin-top:14px"><h3>💳 Payment history</h3>' + (pays.length ? '<table class="cw-tbl"><tbody>' + pays.slice(0, 40).map(function (p) { return '<tr' + (p.reversedAt ? ' style="opacity:.5"' : '') + '><td>' + cwFmtDT(p.at) + '</td><td>' + cwEsc(p.jobNo || '') + '</td><td>' + cwEsc(cwMethodLabel(p.method)) + (p.ref ? ' · ' + cwEsc(p.ref) : '') + '</td><td class="cw-num">' + cwMoney(p.amount) + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="cw-mut">No payments yet.</div>') + '</div>';
  var sms = cwSms.filter(function (s) { return s && s.customerId === c.id; }).sort(function (a, b) { return cwNum(b.at) - cwNum(a.at); });
  if (cwCan('sms.view', me) || cwCan('sms.resend', me)) h += '<div class="cw-card" style="margin-top:14px"><h3>✉️ SMS history</h3>' + (sms.length ? sms.slice(0, 25).map(function (s) { return cwSmsRow(s, me); }).join('') : '<div class="cw-mut">No messages yet.</div>') + '</div>';
  var ks = cwComplaints.filter(function (k) { return k && k.customerId === c.id; });
  h += '<div class="cw-card" style="margin-top:14px"><h3>⚠️ Complaints &amp; notes</h3>' + (ks.length ? ks.map(function (k) { return '<div class="cw-small" style="padding:4px 0"><b>' + cwEsc(k.jobNo) + '</b> · ' + cwEsc(k.kind) + ' · ' + cwFmtDate(k.at) + ' — ' + cwEsc(k.text) + (k.resolved ? ' ✅' : '') + '</div>'; }).join('') : '<div class="cw-mut">None.</div>') + '</div>';
  return h + '</div>';
}
function cwSel(label, id, list, val, edit) { return '<div class="cw-f"><label>' + label + '</label><select id="' + id + '"' + (edit ? '' : ' disabled') + '>' + list.map(function (t) { return '<option value="' + cwEsc(t.k) + '"' + ((val || '') === t.k ? ' selected' : '') + '>' + cwEsc(t.l) + '</option>'; }).join('') + '</select></div>'; }
/* the vehicle-type options of this business, plus the vehicle's own type when it is an older one no longer on the list */
function cwCatOptions(cfg, cur) { var l = cfg.vehicleCats.slice(); if (cur && !l.some(function (x) { return x.k === cur; })) l.push({ k: cur, l: cwVehCatLabel(cfg, cur) }); return l; }
function cwFld(label, id, val, edit, type) { return '<div class="cw-f"><label>' + label + '</label><input id="' + id + '" value="' + cwEsc(val || '') + '"' + (type ? ' type="' + type + '"' : '') + (edit ? '' : ' readonly') + '></div>'; }
function cwOpenVehicle(custId, vehId) {
  var v = vehId ? cwFind(cwVehicles, vehId) : null, cfg = cwCfg();
  var h = cwPH(v ? '🚗 Edit ' + cwEsc(cwFmtPlate(v.plate)) : '🚗 Register a vehicle') + '<div class="cw-pb"><div class="cw-card"><div class="cw-form">'
    + cwFld('Registration number *', 'cw-ve-plate', v ? cwFmtPlate(v.plate) : '', true) + cwSel('Vehicle type', 'cw-ve-cat', cwCatOptions(cfg, v && v.category), v ? v.category : cwDefaultCat(cfg), true)
    + cwFld('Make', 'cw-ve-make', v && v.make, true) + cwFld('Model', 'cw-ve-model', v && v.model, true) + cwFld('Year', 'cw-ve-year', v && v.year, true) + cwFld('Colour', 'cw-ve-colour', v && v.colour, true)
    + '<div class="cw-f full"><label>Vehicle notes</label><textarea id="cw-ve-notes">' + cwEsc(v ? v.notes || '' : '') + '</textarea></div></div>'
    + '<div class="cw-row" style="margin-top:14px">' + (v ? '<button class="cw-btn sm bad" data-cw="vehdel" data-id="' + cwEsc(v.id) + '">🗑 Delete vehicle</button>' : '') + '<span class="cw-sp"></span><button class="cw-btn sec" data-cw="cust" data-id="' + cwEsc(custId) + '">Back</button><button class="cw-btn" data-cw="vehsave" data-id="' + cwEsc(vehId || '') + '" data-c="' + cwEsc(custId) + '">💾 Save vehicle</button></div></div></div>';
  cwOpenModal(h, true);
}
function cwOpenNewCustomer() {
  var h = cwPH('👤 New customer') + '<div class="cw-pb"><div class="cw-card"><div class="cw-form">' + cwFld('Name *', 'cw-nc-name', '', true) + cwFld('Phone *', 'cw-nc-phone', '', true) + cwFld('Alternative phone', 'cw-nc-alt', '', true)
    + cwFld('Email', 'cw-nc-email', '', true, 'email') + cwSel('Gender', 'cw-nc-gender', CW_GENDERS, '', true) + cwSel('Preferred contact method', 'cw-nc-pref', CW_CONTACT_PREFS, '', true)
    + '<div class="cw-f"><label>Customer type</label><select id="cw-nc-type">' + CW_CUST_TYPES.map(function (t) { return '<option value="' + t.k + '">' + t.l + '</option>'; }).join('') + '</select></div>'
    + cwFld('Location', 'cw-nc-loc', '', true) + cwFld('Estate', 'cw-nc-estate', '', true) + cwFld('Town', 'cw-nc-town', '', true) + cwFld('Building', 'cw-nc-bld', '', true) + cwFld('House number', 'cw-nc-house', '', true) + cwFld('Floor', 'cw-nc-floor', '', true)
    + '<div class="cw-f full"><label>Notes</label><textarea id="cw-nc-notes"></textarea></div></div><div class="cw-row" style="margin-top:14px"><span class="cw-sp"></span><button class="cw-btn sec" data-cw="close">Cancel</button><button class="cw-btn" data-cw="custcreate">💾 Save customer</button></div></div></div>';
  cwOpenModal(h, true);
}

/* ================================ BILLING & PAYMENTS ================================ */
CW_UI.payTab = 'due';
CW_UI.pages.payments = function (me) {
  var now = cwNow(), todayF = { from: cwDayStart(cwDayKey(now)), to: cwDayStart(cwDayKey(now)) + CW_DAY };
  var daily = cwReportDaily(cwState(), todayF);
  var due = cwJobs.filter(function (j) { return j && !j._deleted && !cwIsCancelled(j) && !j.free && cwTotals(j).balance > 0.009; }).sort(function (a, b) { return cwNum(a.receivedAt) - cwNum(b.receivedAt); });
  var refundDue = cwJobs.filter(function (j) { return j && !j._deleted && cwIsCancelled(j) && cwTotals(j).net > 0; });
  var dueTotal = 0; due.forEach(function (j) { dueTotal += cwTotals(j).balance; });
  var h = '<div class="cw-kpis">' + cwKpi('Collected today', cwMoney(daily.totals.cash + daily.totals.mpesa + daily.totals.other), '', '#16a34a') + cwKpi('Cash today', cwMoney(daily.totals.cash)) + cwKpi('M-Pesa today', cwMoney(daily.totals.mpesa)) + cwKpi('Other today', cwMoney(daily.totals.other)) + cwKpi('Outstanding', cwMoney(dueTotal), due.length + ' job(s)', '#dc2626') + (refundDue.length ? cwKpi('Refunds due', refundDue.length, 'cancelled jobs with money', '#dc2626') : '') + '</div>';
  h += '<div class="cw-chips" style="margin-bottom:12px">' + [['due', 'Awaiting payment'], ['today', 'Today\'s payments'], ['all', 'All payments']].map(function (t) { return '<button class="cw-chip ' + (CW_UI.payTab === t[0] ? 'on' : '') + '" data-cw="paytab" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
  if (CW_UI.payTab === 'due') {
    h += '<div class="cw-tblw"><table class="cw-tbl"><thead><tr><th>Job</th><th>Customer</th><th>Status</th><th class="cw-num">Total</th><th class="cw-num">Paid</th><th class="cw-num">Balance</th><th></th></tr></thead><tbody>'
      + (due.length ? due.map(function (j) { var c = cwJobCustomer(j) || {}, t = cwTotals(j); return '<tr><td class="cw-click" data-cw="job" data-id="' + cwEsc(j.id) + '">' + cwJobTitle(j) + '<div class="cw-small cw-mut">' + cwEsc(j.no) + '</div></td><td>' + cwEsc(c.name || '') + '<div class="cw-small cw-mut">' + cwEsc(cwFmtPhone(c.phone)) + '</div></td><td>' + cwStatusBadge(j) + '</td><td class="cw-num">' + cwMoney(t.total) + '</td><td class="cw-num">' + cwMoney(t.net) + '</td><td class="cw-num"><b>' + cwMoney(t.balance) + '</b></td><td>' + (cwCan('payments', me) ? '<button class="cw-btn sm ok" data-cw="pay" data-id="' + cwEsc(j.id) + '">💵 Pay</button>' : '') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="cw-empty"><b>🎉</b>Nothing outstanding.</td></tr>') + '</tbody></table></div>';
