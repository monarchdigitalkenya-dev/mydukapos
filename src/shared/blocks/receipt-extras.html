<!-- RECEIPT EXTRAS ------------------------------------------------------------
         zip 155. Four things every app gets from this ONE block:
           1. RECEIPT STAMP  - Settings > Receipts > "Receipt stamp": make a stamp from text (or upload a picture of the shop's own stamp);
              it prints slightly tilted, like a real ink stamp pressed by hand, just above the item lines. The layout is in
              src/shared/functions.js (buildReceiptDoc / the thermal builders call receiptStampBlockHtml / receiptStampRasterBytes here).
           2. BILLS LOCK     - an admin-only switch on the Bills tab. Off by default. While on, staff can only VIEW bills, and even the admin
              types the admin password to settle, edit or remove one.
           3. DELIVERY EXTRAS - optional "ID / Passport No." and "Directions" on the delivery form (printed on the two signed delivery receipts).
           4. EXTRA SETTINGS SYNC - extraSettingsCollect / extraSettingsApply: the settings above travel with the shop's other settings
              (every app's collectSyncPayload / applyRemotePayload call them), so a new phone, the Android app or the Windows app has them too.
         Nothing here is required for a sale: every entry point is wrapped so a failure only loses the extra. -->
    <style id="pos-ui-zoom-css">
        /* zip 182: on a desktop screen the whole app is drawn at 80% (what you used to get by pressing Ctrl and minus twice) — phones and tablets (under 1100px wide) and printing are untouched.
           Change it with ?zoom=90 (or 100 to switch it off) on the address once; the choice is remembered on that device. */
        @media screen and (min-width: 1100px) { html.pos-zoom { zoom: var(--pos-ui-zoom, .8); --pos-z: var(--pos-ui-zoom, .8); } }
    </style>
    <script>
    (function () {
        try {
            var root = document.documentElement, z = 0.8;
            try {
                var q = /[?&]zoom=(\d+)/.exec(location.search);
                if (q) { var pct = parseInt(q[1], 10); if (pct >= 50 && pct <= 120) localStorage.setItem('pos_ui_zoom', String(pct / 100)); }
                var v = parseFloat(localStorage.getItem('pos_ui_zoom')); if (v >= 0.5 && v <= 1.2) z = v;
            } catch (e) { /* default */ }
            if (Math.abs(z - 1) < 0.001 || !('zoom' in root.style)) return;
            root.style.setProperty('--pos-ui-zoom', String(z)); root.classList.add('pos-zoom');
            /* CSS zoom reports sizes in screen pixels but lays out in zoomed pixels — make the page's own measuring code see layout pixels, exactly like real browser zoom does */
            var f = 1, calc = function () { try { f = parseFloat(getComputedStyle(root).zoom) || 1; } catch (e) { f = 1; } };
            calc(); window.addEventListener('resize', calc); window.addEventListener('beforeprint', function () { f = 1; }); window.addEventListener('afterprint', calc);
            var grc = Element.prototype.getBoundingClientRect;
            Element.prototype.getBoundingClientRect = function () { var r = grc.call(this); return f === 1 ? r : new DOMRect(r.x / f, r.y / f, r.width / f, r.height / f); };
            ['innerWidth', 'innerHeight'].forEach(function (k) {
                var d = Object.getOwnPropertyDescriptor(window, k); if (!d || !d.get) return;
                Object.defineProperty(window, k, { configurable: true, enumerable: true, get: function () { return d.get.call(window) / f; } });
            });
        } catch (e) { /* the app simply stays at 100% */ }
    })();
    </script>
    <script>
    /* ---------- tiny safe storage helpers (localStorage can throw in private windows) ---------- */
    function rxGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function rxSet(k, v) { try { if (typeof safeSetItem === 'function') safeSetItem(k, v); else localStorage.setItem(k, v); } catch (e) { /* kept in memory for this session */ } }
    function rxDel(k) { try { localStorage.removeItem(k); } catch (e) { /* nothing to remove */ } }
    function rxToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(msg, !!isErr); } catch (e) { /* cosmetic */ } }
    function rxPush() { try { if (typeof queuePush === 'function') queuePush(); } catch (e) { /* the next change sends it */ } }
    function rxEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    /* ---------- settings this block owns (kept as one object so they sync with the shop's other settings) ---------- */
    var rxSettings = {
        stampSrc: rxGet('pos_receipt_stamp_src') || '',                     // an upright ink-coloured PNG on a transparent background
        stampAngle: (function () { var n = parseFloat(rxGet('pos_receipt_stamp_angle')); return isFinite(n) ? n : -8; })(),
        stampSize: (function () { var n = parseFloat(rxGet('pos_receipt_stamp_size')); return isFinite(n) ? n : 70; })(),
        showStamp: rxGet('pos_receipt_show_stamp') === 'true',
        paidMark: rxGet('pos_receipt_stamp_paid') === 'true',                // zip 215: print a PAID / UNPAID mark under the stamp
        billsLocked: rxGet('pos_bills_locked') === 'true',
        fontPt: (function () { var n = parseFloat(rxGet('pos_receipt_font_pt')); return isFinite(n) && n >= 5 && n <= 20 ? Math.round(n * 2) / 2 : 7; })(),   // zip 158: the receipt letter size, in points (7 = standard)
    };
    /* zip 158: the old receipt zoom setting no longer exists: whatever an old version stored under these two keys is dropped without a word. */
    rxDel('pos_receipt_scale'); rxDel('aqua_receipt_scale');
    function receiptFontPtSaved() { return rxSettings.fontPt; }
    function receiptFontPtStore(n) {
        n = Math.max(5, Math.min(20, Math.round(Number(n) * 2) / 2));
        if (!isFinite(n)) n = 7;
        rxSettings.fontPt = n;
        rxSet('pos_receipt_font_pt', String(n));
        return n;
    }
    function extraSettingsCollect() {
        var o = { receiptStampSrc: rxSettings.stampSrc, receiptStampAngle: rxSettings.stampAngle, receiptStampSize: rxSettings.stampSize, receiptShowStamp: rxSettings.showStamp, receiptStampPaid: rxSettings.paidMark, billsLocked: rxSettings.billsLocked };
        // the letter size travels only once THIS device has one of its own (chosen here or received): a fresh device's default 7 must never replace the shop's real size
        if (rxGet('pos_receipt_font_pt') !== null) o.receiptFontPt = rxSettings.fontPt;
        o.payMethods = posPayAccepted();                      // zip 163: which payment methods this shop accepts (every till shows only those)
        /* zip 217: every "hide this button" switch (Settings > General) is shop-wide: blocks register themselves in window.__shopSwitches = { name: { get, set } }.
           get() answers undefined until THIS device has its own choice, so a fresh device never overwrites the shop's real choice with its default. */
        try {
            var sw = window.__shopSwitches || {}, hv = {};
            Object.keys(sw).forEach(function (k) { try { var v = sw[k].get(); if (v !== undefined) hv[k] = v; } catch (e) { /* one switch never blocks the others */ } });
            if (Object.keys(hv).length) o.switches = hv;
        } catch (e) { /* optional */ }
        return o;
    }
    function extraSettingsApply(data) {
        if (!data || typeof data !== 'object') return;
        var changed = false;
        if (data.switches && typeof data.switches === 'object') {
            var sw2 = window.__shopSwitches || {};
            Object.keys(data.switches).forEach(function (k) { try { if (sw2[k] && JSON.stringify(sw2[k].get()) !== JSON.stringify(data.switches[k])) sw2[k].set(data.switches[k]); } catch (e) { /* one switch never blocks the others */ } });
        }
        if (Array.isArray(data.payMethods)) { var pm = JSON.stringify(posPayAccepted()); if (JSON.stringify(data.payMethods) !== pm) { posPaySetAccepted(data.payMethods, true); } }
        if (typeof data.receiptStampSrc === 'string' && data.receiptStampSrc !== rxSettings.stampSrc) {
            rxSettings.stampSrc = data.receiptStampSrc;
            if (data.receiptStampSrc) rxSet('pos_receipt_stamp_src', data.receiptStampSrc); else rxDel('pos_receipt_stamp_src');
            changed = true;
        }
        if (typeof data.receiptStampAngle === 'number' && isFinite(data.receiptStampAngle) && data.receiptStampAngle !== rxSettings.stampAngle) { rxSettings.stampAngle = data.receiptStampAngle; rxSet('pos_receipt_stamp_angle', String(data.receiptStampAngle)); changed = true; }
        if (typeof data.receiptStampSize === 'number' && isFinite(data.receiptStampSize) && data.receiptStampSize !== rxSettings.stampSize) { rxSettings.stampSize = data.receiptStampSize; rxSet('pos_receipt_stamp_size', String(data.receiptStampSize)); changed = true; }
        if (typeof data.receiptShowStamp === 'boolean' && data.receiptShowStamp !== rxSettings.showStamp) { rxSettings.showStamp = data.receiptShowStamp; rxSet('pos_receipt_show_stamp', String(data.receiptShowStamp)); changed = true; }
        if (typeof data.receiptStampPaid === 'boolean' && data.receiptStampPaid !== rxSettings.paidMark) { rxSettings.paidMark = data.receiptStampPaid; rxSet('pos_receipt_stamp_paid', String(data.receiptStampPaid)); changed = true; }
        var lockChanged = false;
        if (typeof data.billsLocked === 'boolean' && data.billsLocked !== rxSettings.billsLocked) { rxSettings.billsLocked = data.billsLocked; rxSet('pos_bills_locked', String(data.billsLocked)); lockChanged = true; }
        var fontChanged = false;
        if (typeof data.receiptFontPt === 'number' && isFinite(data.receiptFontPt) && data.receiptFontPt >= 5 && data.receiptFontPt <= 20 && Math.round(data.receiptFontPt * 2) / 2 !== rxSettings.fontPt) { receiptFontPtStore(data.receiptFontPt); fontChanged = true; }
        else if (typeof data.receiptFontPt === 'number' && isFinite(data.receiptFontPt) && data.receiptFontPt >= 5 && data.receiptFontPt <= 20 && rxGet('pos_receipt_font_pt') === null) receiptFontPtStore(data.receiptFontPt);
        if (fontChanged) { try { receiptApplyPaperVars(); syncDevicePaperWidthUI(); receiptRelayoutOpen(); } catch (e) { /* the settings page / a receipt may not be open */ } }
        if (changed) { window.__stampRaster = null; try { rxStampRefreshUI(); } catch (e) { /* the settings page may not be open */ } }
        if (lockChanged) { try { billsLockDecorate(); } catch (e) { /* the Bills tab may not be open */ } }
    }

    /* =====================================================================================================================
       1. RECEIPT STAMP
       ===================================================================================================================== */
    var RX_INKS = { blue: '#1a3fa8', purple: '#5b2a86', red: '#b3261e', black: '#1b1b1b', green: '#1e6b3a' };

    function rxCanvas(w, h) {
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = null; try { ctx = c.getContext('2d'); } catch (e) { ctx = null; }
        return ctx ? { c: c, ctx: ctx } : null;
    }
    function rxLoadImage(src) {
        return new Promise(function (resolve, reject) {
            var im = new Image();
            var t = setTimeout(function () { reject(new Error('the picture took too long to load')); }, 8000);
            im.onload = function () { clearTimeout(t); resolve(im); };
            im.onerror = function () { clearTimeout(t); reject(new Error('that file is not a readable picture')); };
            im.src = src;
        });
    }

    /* A stamp made from text: a rounded (or oval) double border with the lines inside, in ink colour, with the little gaps and speckles of a real stamp. */
    function rxStampFromText(lines, inkName, shape) {
        var ink = RX_INKS[inkName] || RX_INKS.blue;
        var W = 560, H = 280;
        var cv = rxCanvas(W, H);
        if (!cv) return '';
        var ctx = cv.ctx, i;
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        var path = function (inset) {
            ctx.beginPath();
            if (shape === 'oval') { ctx.ellipse(W / 2, H / 2, W / 2 - inset, H / 2 - inset, 0, 0, Math.PI * 2); }
            else {
                var r = 26, x = inset, y = inset, w = W - inset * 2, h = H - inset * 2;
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
            }
        };
        ctx.lineWidth = 9; path(12); ctx.stroke();
        ctx.lineWidth = 3; path(28); ctx.stroke();
        var txt = (lines || []).map(function (l) { return String(l || '').trim(); }).filter(Boolean).slice(0, 4);
        if (!txt.length) txt = ['STAMP'];
        var sizes = [54, 36, 30, 26];
        var inner = (shape === 'oval' ? W * 0.62 : W - 110);
        var total = 0; var fonts = [];
        for (i = 0; i < txt.length; i++) {
            var px = sizes[i] || 24, f;
            do { f = (i === 0 ? 'bold ' : '600 ') + px + 'px Georgia, "Times New Roman", serif'; ctx.font = f; px -= 2; } while (ctx.measureText(txt[i].toUpperCase()).width > inner && px > 12);
            fonts.push({ f: f, px: px + 2 }); total += (px + 2) * 1.25;
        }
        var y = H / 2 - total / 2;
        for (i = 0; i < txt.length; i++) {
            y += fonts[i].px * 0.625;
            ctx.font = fonts[i].f; ctx.fillText(txt[i].toUpperCase(), W / 2, y);
            y += fonts[i].px * 0.625;
            if (i === 0 && txt.length > 1) { ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W * 0.2, y + 2); ctx.lineTo(W * 0.8, y + 2); ctx.stroke(); y += 8; }
        }
        // the wear of a real stamp: tiny gaps in the ink
        ctx.globalCompositeOperation = 'destination-out';
        for (i = 0; i < 1300; i++) {
            ctx.globalAlpha = 0.25 + Math.random() * 0.65;
            ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, 0.5 + Math.random() * 1.9, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        try { return cv.c.toDataURL('image/png'); } catch (e) { return ''; }
    }

    /* A stamp made from a picture of the shop's own stamp (a photo or scan of it pressed on white paper): the white becomes transparent and
       the marks are recoloured to one ink colour, so it prints like a stamp, not like a photograph. */
    async function rxStampFromImage(dataUrl, inkName, recolor) {
        var im = await rxLoadImage(dataUrl);
        var nw = im.naturalWidth || im.width, nh = im.naturalHeight || im.height;
        if (!(nw > 0 && nh > 0)) throw new Error('the picture has no size');
        var scale = Math.min(560 / nw, 320 / nh, 1);
        var w = Math.max(16, Math.round(nw * scale)), h = Math.max(16, Math.round(nh * scale));
        var cv = rxCanvas(w, h);
        if (!cv) return dataUrl;                                          // no drawing available: keep the picture as it is
        cv.ctx.drawImage(im, 0, 0, w, h);
        var img = cv.ctx.getImageData(0, 0, w, h), d = img.data, ink = RX_INKS[inkName] || RX_INKS.blue;
        var ir = parseInt(ink.slice(1, 3), 16), ig = parseInt(ink.slice(3, 5), 16), ib = parseInt(ink.slice(5, 7), 16);
        for (var p = 0; p < d.length; p += 4) {
            var lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
            var a = Math.max(0, Math.min(1, (232 - lum) / (232 - 90)));       // white / paper -> transparent, dark marks -> solid
            a = Math.min(a, d[p + 3] / 255);
            if (recolor) { d[p] = ir; d[p + 1] = ig; d[p + 2] = ib; }
            d[p + 3] = Math.round(a * 255);
        }
        cv.ctx.putImageData(img, 0, 0);
        return cv.c.toDataURL('image/png');
    }

    function rxStampSave(dataUrl) {
        rxSettings.stampSrc = dataUrl || '';
        if (dataUrl) rxSet('pos_receipt_stamp_src', dataUrl); else rxDel('pos_receipt_stamp_src');
        if (dataUrl && !rxSettings.showStamp) { rxSettings.showStamp = true; rxSet('pos_receipt_show_stamp', 'true'); }
        window.__stampRaster = null;
        rxStampRefreshUI(); rxPush();
    }

    /* what the receipt (screen, browser print, PDF-less) shows: the stamp between the header and the item lines, tilted by the chosen angle */
    /* zip 215 - PAID / UNPAID: a second small stamp under the shop stamp that says whether THIS receipt is settled. A sale on credit (Pay Later / Pay on
       Delivery / a bill still owing) is UNPAID; everything else was paid at the till. Off by default (Settings > Receipts > Receipt Stamp). */
    function rxPaidStateOf(sale) {
        if (!rxSettings.paidMark || !sale || typeof sale !== 'object') return null;
        var credit = sale.paymentMethod === 'bill' || sale.paymentMethod === 'pod' || sale.paid === false;
        if (credit && sale.paid !== true) return 'unpaid';
        return 'paid';
    }
    var rxPaidImgCache = {};
    function rxPaidStampSrc(state) {
        if (!rxPaidImgCache[state]) rxPaidImgCache[state] = rxStampFromText([state === 'paid' ? 'PAID' : 'UNPAID'], state === 'paid' ? 'green' : 'red', 'rect');
        return rxPaidImgCache[state];
    }
    function rxCurrentSale() { try { return typeof currentReceiptSale !== 'undefined' ? currentReceiptSale : null; } catch (e) { return null; } }

    /* what the receipt (screen, browser print, PDF-less) shows: the stamp between the header and the item lines, tilted by the chosen angle */
    function receiptStampBlockHtml(sale) {
        var shop = !!(rxSettings.showStamp && rxSettings.stampSrc);
        var state = rxPaidStateOf(sale || rxCurrentSale());
        var paidSrc = state ? rxPaidStampSrc(state) : '';
        if (!shop && !paidSrc) return '';
        var size = Math.max(30, Math.min(100, rxSettings.stampSize || 70));
        var ang = Math.max(-45, Math.min(45, rxSettings.stampAngle || 0));
        var pad = Math.round(6 + Math.abs(Math.sin(ang * Math.PI / 180)) * 26);
        var img = function (src, w, a) { return '<img alt="" src="' + rxEsc(src) + '" style="width:' + w + '%; max-width:100%; height:auto; transform:rotate(' + a + 'deg); mix-blend-mode:multiply; opacity:.93; -webkit-print-color-adjust:exact; print-color-adjust:exact;">'; };
        return '<div class="rg-stamp" style="text-align:center; padding:' + pad + 'px 0; line-height:0;">'
            + (shop ? img(rxSettings.stampSrc, size, ang) : '')
            + (paidSrc ? '<div style="padding-top:' + (shop ? 6 : 0) + 'px;">' + img(paidSrc, Math.round(size * 0.55), ang) + '</div>' : '')
            + '</div>';
    }

    /* what a thermal printer gets: the same stamp, tilted on a canvas, then dithered to dots (like the logo). Prepared BEFORE the print (printReceipt awaits it). */
    function receiptStampRasterKey() {
        var d = String(rxSettings.stampSrc || '');
        var dots = 384; try { dots = receiptLogoDots(); } catch (e) { /* default */ }
        var shop = rxSettings.showStamp && rxSettings.stampSrc ? 1 : 0;
        return 'v2:' + dots + ':' + rxSettings.stampAngle + ':' + rxSettings.stampSize + ':' + shop + ':' + d.length + ':' + d.slice(-40) + ':' + (rxPaidStateOf(rxCurrentSale()) || '-');
    }
    async function prepareReceiptStampRaster() {
        try {
            var shop = !!(rxSettings.showStamp && rxSettings.stampSrc);
            var state = rxPaidStateOf(rxCurrentSale());
            if (!shop && !state) { window.__stampRaster = null; return null; }
            var key = receiptStampRasterKey();
            if (window.__stampRaster && window.__stampRaster.key === key) return window.__stampRaster.bytes;
            var dots = receiptLogoDots();
            var a = (rxSettings.stampAngle || 0) * Math.PI / 180;
            var pieces = [];
            var addPiece = async function (src, pct, maxH) {
                var im = await rxLoadImage(src);
                var nw = im.naturalWidth || im.width, nh = im.naturalHeight || im.height;
                var maxW = Math.max(64, Math.floor(dots * 0.8 * pct / 100 / 8) * 8);
                var sc = Math.min(maxW / nw, maxH / nh);
                var w = Math.max(16, Math.round(nw * sc)), h = Math.max(16, Math.round(nh * sc));
                var bw = Math.ceil(Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a))) + 8, bh = Math.ceil(Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a))) + 8;
                pieces.push({ im: im, w: w, h: h, bw: bw, bh: bh });
            };
            var pct = Math.max(30, Math.min(100, rxSettings.stampSize || 70));
            if (shop) await addPiece(rxSettings.stampSrc, pct, 220);
            if (state) await addPiece(rxPaidStampSrc(state), Math.round(pct * 0.55), 110);
            var W = Math.max.apply(null, pieces.map(function (p) { return p.bw; })), H = pieces.reduce(function (t, p) { return t + p.bh; }, 0);
            var cv = rxCanvas(W, H);
            if (!cv) { window.__stampRaster = null; return null; }

            var y = 0;
            pieces.forEach(function (p) {
                cv.ctx.save(); cv.ctx.translate(W / 2, y + p.bh / 2); cv.ctx.rotate(a); cv.ctx.drawImage(p.im, -p.w / 2, -p.h / 2, p.w, p.h); cv.ctx.restore();
                y += p.bh;
            });
            var bytes = receiptLogoRasterFromRgba(cv.ctx.getImageData(0, 0, W, H).data, W, H, dots);
            if (!bytes) { window.__stampRaster = null; return null; }
            window.__stampRaster = { key: key, bytes: bytes };
            return bytes;
        } catch (e) {
            window.__stampRaster = null;
            return null;                                                  // the receipt prints without the stamp
        }
    }
    function receiptStampRasterBytes() {
        try {
            if (!((rxSettings.showStamp && rxSettings.stampSrc) || rxPaidStateOf(rxCurrentSale()))) return null;
            var r = window.__stampRaster;
            return r && r.bytes && r.key === receiptStampRasterKey() ? r.bytes : null;
        } catch (e) { return null; }
    }

    /* ---- the settings card (added to Settings > Receipts, before "Item List Alignment") ---- */
    function rxStampInstallUI() {
        var section = document.getElementById('settings-section-receipts');
        if (!section || document.getElementById('receipt-stamp-card')) return;
        var card = document.createElement('div');
        card.id = 'receipt-stamp-card';
        card.innerHTML =
            '<hr class="settings-divider">'
            + '<h4>🔏 Receipt Stamp</h4>'
            + '<p style="font-size:13px; color:#555; margin:0 0 8px;">Prints a stamp just above the item list, slightly tilted like one pressed by hand. Make one from your shop details below, or upload a picture of your own stamp (press it on plain white paper and take a photo or scan). Thermal printers print it in black and white.</p>'
            + '<div class="settings-row" style="flex-direction:column; align-items:stretch; gap:8px;">'
            + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:normal;"><input type="checkbox" id="rx-stamp-show" style="width:auto;"> Print the stamp on receipts and bills</label>'
            + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:normal;"><input type="checkbox" id="rx-stamp-paid" style="width:auto;"> Also print <b style="color:#1e6b3a;">PAID</b> or <b style="color:#b3261e;">UNPAID</b> under the stamp (UNPAID for Pay Later / Pay on Delivery / bills still owing) — works even without a shop stamp</label>'
            + '<div id="rx-stamp-preview-wrap" style="display:none; text-align:center; padding:18px 0; background:#fff; border:1px dashed #cfd6dd; border-radius:8px;"><img id="rx-stamp-preview" alt="Stamp preview" style="max-width:70%; max-height:140px;"></div>'
            + '<p id="rx-stamp-status" class="settings-msg">No stamp yet.</p>'
            + '<div style="border:1px solid #e3e8ee; border-radius:8px; padding:10px; background:#fafbfc;">'
            + '<div style="font-weight:600; font-size:13px; margin-bottom:6px;">✍️ Make a stamp from text</div>'
            + '<input type="text" id="rx-stamp-l1" placeholder="Line 1 — shop name" maxlength="40" style="margin-bottom:6px;">'
            + '<input type="text" id="rx-stamp-l2" placeholder="Line 2 — e.g. PIN, address or PAID" maxlength="40" style="margin-bottom:6px;">'

    /* Runs `fn` only when this person may change a bill. Lock off: always. Lock on: staff never; the admin only after typing the admin password
       (that approval also covers the next 3 minutes, so "Settle" -> "Confirm" does not ask twice). */
    function billsLockGate(what, fn, args) {
        if (!billsLockActive()) return fn();
        if (!rxIsAdmin()) { rxToast('🔒 Bills are locked. Only the admin can ' + what + ' a bill.', true); return undefined; }
        if (billsLockPassValid()) return fn();
        if (typeof requireManagementApproval !== 'function') { rxToast('🔒 Bills are locked.', true); return undefined; }
        requireManagementApproval('Bills are locked. Enter the admin password to ' + what + ' this bill.', function () {
            window.__billsLockPassUntil = Date.now() + 3 * 60 * 1000;
            fn();
        });
        return undefined;
    }
    function billsLockSet(on) {

            billsLockDecorate(); rxPush();
            rxToast(on ? '🔒 Bills locked — staff can only view them.' : '🔓 Bills unlocked.');
        };

        apply();
