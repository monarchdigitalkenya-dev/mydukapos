<!-- RECEIPT EXTRAS ------------------------------------------------------------
         zip 155. Four things every app gets from this ONE block:
           1. RECEIPT STAMP  - Settings > Receipts > "Receipt stamp": make a stamp from text (or upload a picture of the shop's own stamp);
              it prints slightly tilted, like a real ink stamp pressed by hand, just above the item lines. The layout is in
              src/shared/functions.js (buildReceiptDoc / the thermal builders call receiptStampBlockHtml / receiptStampRasterBytes here).
           2. BILLS LOCK     - an admin-only switch on the Bills tab. Off by default. While on, staff can only VIEW bills, and even the admin
              types the admin password to settle, edit or remove one.
           3. DELIVERY EXTRAS - optional "ID / Passport No." and "Directions" on the delivery form (printed on the two signed delivery receipts).
           4. EXTRA SETTINGS SYNC - extraSettingsCollect / extraSettingsApply: the settings above travel with the shop's other settings
              (every app's collectSyncPayload / applyRemotePayload call them), so a new phone, the Android app or the Windows app has them too.
         Nothing here is required for a sale: every entry point is wrapped so a failure only loses the extra. -->
    <script>
    /* ---------- tiny safe storage helpers (localStorage can throw in private windows) ---------- */
    function rxGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function rxSet(k, v) { try { if (typeof safeSetItem === 'function') safeSetItem(k, v); else localStorage.setItem(k, v); } catch (e) { /* kept in memory for this session */ } }
    function rxDel(k) { try { localStorage.removeItem(k); } catch (e) { /* nothing to remove */ } }
    function rxToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(msg, !!isErr); } catch (e) { /* cosmetic */ } }
    function rxPush() { try { if (typeof queuePush === 'function') queuePush(); } catch (e) { /* the next change sends it */ } }
    function rxEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    /* ---------- settings this block owns (kept as one object so they sync with the shop's other settings) ---------- */
    var rxSettings = {
        stampSrc: rxGet('pos_receipt_stamp_src') || '',                     // an upright ink-coloured PNG on a transparent background
        stampAngle: (function () { var n = parseFloat(rxGet('pos_receipt_stamp_angle')); return isFinite(n) ? n : -8; })(),
        stampSize: (function () { var n = parseFloat(rxGet('pos_receipt_stamp_size')); return isFinite(n) ? n : 70; })(),
        showStamp: rxGet('pos_receipt_show_stamp') === 'true',
        billsLocked: rxGet('pos_bills_locked') === 'true',
        fontPt: (function () { var n = parseFloat(rxGet('pos_receipt_font_pt')); return isFinite(n) && n >= 5 && n <= 20 ? Math.round(n * 2) / 2 : 7; })(),   // zip 158: the receipt letter size, in points (7 = standard)
    };
    /* zip 158: the old receipt zoom setting no longer exists: whatever an old version stored under these two keys is dropped without a word. */
    rxDel('pos_receipt_scale'); rxDel('aqua_receipt_scale');
    function receiptFontPtSaved() { return rxSettings.fontPt; }
    function receiptFontPtStore(n) {
        n = Math.max(5, Math.min(20, Math.round(Number(n) * 2) / 2));
        if (!isFinite(n)) n = 7;
        rxSettings.fontPt = n;
        rxSet('pos_receipt_font_pt', String(n));
        return n;
    }
    function extraSettingsCollect() {
        var o = { receiptStampSrc: rxSettings.stampSrc, receiptStampAngle: rxSettings.stampAngle, receiptStampSize: rxSettings.stampSize, receiptShowStamp: rxSettings.showStamp, billsLocked: rxSettings.billsLocked };
        // the letter size travels only once THIS device has one of its own (chosen here or received): a fresh device's default 7 must never replace the shop's real size
        if (rxGet('pos_receipt_font_pt') !== null) o.receiptFontPt = rxSettings.fontPt;
        o.payMethods = posPayAccepted();                      // zip 163: which payment methods this shop accepts (every till shows only those)
        return o;
    }
    function extraSettingsApply(data) {
        if (!data || typeof data !== 'object') return;
        var changed = false;
        if (Array.isArray(data.payMethods)) { var pm = JSON.stringify(posPayAccepted()); if (JSON.stringify(data.payMethods) !== pm) { posPaySetAccepted(data.payMethods, true); } }
        if (typeof data.receiptStampSrc === 'string' && data.receiptStampSrc !== rxSettings.stampSrc) {
            rxSettings.stampSrc = data.receiptStampSrc;
            if (data.receiptStampSrc) rxSet('pos_receipt_stamp_src', data.receiptStampSrc); else rxDel('pos_receipt_stamp_src');
            changed = true;
        }
        if (typeof data.receiptStampAngle === 'number' && isFinite(data.receiptStampAngle) && data.receiptStampAngle !== rxSettings.stampAngle) { rxSettings.stampAngle = data.receiptStampAngle; rxSet('pos_receipt_stamp_angle', String(data.receiptStampAngle)); changed = true; }
        if (typeof data.receiptStampSize === 'number' && isFinite(data.receiptStampSize) && data.receiptStampSize !== rxSettings.stampSize) { rxSettings.stampSize = data.receiptStampSize; rxSet('pos_receipt_stamp_size', String(data.receiptStampSize)); changed = true; }
        if (typeof data.receiptShowStamp === 'boolean' && data.receiptShowStamp !== rxSettings.showStamp) { rxSettings.showStamp = data.receiptShowStamp; rxSet('pos_receipt_show_stamp', String(data.receiptShowStamp)); changed = true; }
        var lockChanged = false;
        if (typeof data.billsLocked === 'boolean' && data.billsLocked !== rxSettings.billsLocked) { rxSettings.billsLocked = data.billsLocked; rxSet('pos_bills_locked', String(data.billsLocked)); lockChanged = true; }
        var fontChanged = false;
        if (typeof data.receiptFontPt === 'number' && isFinite(data.receiptFontPt) && data.receiptFontPt >= 5 && data.receiptFontPt <= 20 && Math.round(data.receiptFontPt * 2) / 2 !== rxSettings.fontPt) { receiptFontPtStore(data.receiptFontPt); fontChanged = true; }
        else if (typeof data.receiptFontPt === 'number' && isFinite(data.receiptFontPt) && data.receiptFontPt >= 5 && data.receiptFontPt <= 20 && rxGet('pos_receipt_font_pt') === null) receiptFontPtStore(data.receiptFontPt);
        if (fontChanged) { try { receiptApplyPaperVars(); syncDevicePaperWidthUI(); receiptRelayoutOpen(); } catch (e) { /* the settings page / a receipt may not be open */ } }
        if (changed) { window.__stampRaster = null; try { rxStampRefreshUI(); } catch (e) { /* the settings page may not be open */ } }
        if (lockChanged) { try { billsLockDecorate(); } catch (e) { /* the Bills tab may not be open */ } }
    }

    /* =====================================================================================================================
       1. RECEIPT STAMP
       ===================================================================================================================== */
    var RX_INKS = { blue: '#1a3fa8', purple: '#5b2a86', red: '#b3261e', black: '#1b1b1b', green: '#1e6b3a' };

    function rxCanvas(w, h) {
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var ctx = null; try { ctx = c.getContext('2d'); } catch (e) { ctx = null; }
        return ctx ? { c: c, ctx: ctx } : null;
    }
    function rxLoadImage(src) {
        return new Promise(function (resolve, reject) {
            var im = new Image();
            var t = setTimeout(function () { reject(new Error('the picture took too long to load')); }, 8000);
            im.onload = function () { clearTimeout(t); resolve(im); };
            im.onerror = function () { clearTimeout(t); reject(new Error('that file is not a readable picture')); };
            im.src = src;
        });
    }

    /* A stamp made from text: a rounded (or oval) double border with the lines inside, in ink colour, with the little gaps and speckles of a real stamp. */
    function rxStampFromText(lines, inkName, shape) {
        var ink = RX_INKS[inkName] || RX_INKS.blue;
        var W = 560, H = 280;
        var cv = rxCanvas(W, H);
        if (!cv) return '';
        var ctx = cv.ctx, i;
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        var path = function (inset) {
            ctx.beginPath();
            if (shape === 'oval') { ctx.ellipse(W / 2, H / 2, W / 2 - inset, H / 2 - inset, 0, 0, Math.PI * 2); }
            else {
                var r = 26, x = inset, y = inset, w = W - inset * 2, h = H - inset * 2;
                ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
            }
        };
        ctx.lineWidth = 9; path(12); ctx.stroke();
        ctx.lineWidth = 3; path(28); ctx.stroke();
        var txt = (lines || []).map(function (l) { return String(l || '').trim(); }).filter(Boolean).slice(0, 4);
        if (!txt.length) txt = ['STAMP'];
        var sizes = [54, 36, 30, 26];
        var inner = (shape === 'oval' ? W * 0.62 : W - 110);
        var total = 0; var fonts = [];
        for (i = 0; i < txt.length; i++) {
            var px = sizes[i] || 24, f;
            do { f = (i === 0 ? 'bold ' : '600 ') + px + 'px Georgia, "Times New Roman", serif'; ctx.font = f; px -= 2; } while (ctx.measureText(txt[i].toUpperCase()).width > inner && px > 12);
            fonts.push({ f: f, px: px + 2 }); total += (px + 2) * 1.25;
        }
        var y = H / 2 - total / 2;
        for (i = 0; i < txt.length; i++) {
            y += fonts[i].px * 0.625;
            ctx.font = fonts[i].f; ctx.fillText(txt[i].toUpperCase(), W / 2, y);
            y += fonts[i].px * 0.625;
            if (i === 0 && txt.length > 1) { ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W * 0.2, y + 2); ctx.lineTo(W * 0.8, y + 2); ctx.stroke(); y += 8; }
        }
        // the wear of a real stamp: tiny gaps in the ink
        ctx.globalCompositeOperation = 'destination-out';
        for (i = 0; i < 1300; i++) {
            ctx.globalAlpha = 0.25 + Math.random() * 0.65;
            ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H, 0.5 + Math.random() * 1.9, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        try { return cv.c.toDataURL('image/png'); } catch (e) { return ''; }
    }

    /* A stamp made from a picture of the shop's own stamp (a photo or scan of it pressed on white paper): the white becomes transparent and
       the marks are recoloured to one ink colour, so it prints like a stamp, not like a photograph. */
    async function rxStampFromImage(dataUrl, inkName, recolor) {
        var im = await rxLoadImage(dataUrl);
        var nw = im.naturalWidth || im.width, nh = im.naturalHeight || im.height;
        if (!(nw > 0 && nh > 0)) throw new Error('the picture has no size');
        var scale = Math.min(560 / nw, 320 / nh, 1);
        var w = Math.max(16, Math.round(nw * scale)), h = Math.max(16, Math.round(nh * scale));
        var cv = rxCanvas(w, h);
        if (!cv) return dataUrl;                                          // no drawing available: keep the picture as it is
        cv.ctx.drawImage(im, 0, 0, w, h);
        var img = cv.ctx.getImageData(0, 0, w, h), d = img.data, ink = RX_INKS[inkName] || RX_INKS.blue;
        var ir = parseInt(ink.slice(1, 3), 16), ig = parseInt(ink.slice(3, 5), 16), ib = parseInt(ink.slice(5, 7), 16);
        for (var p = 0; p < d.length; p += 4) {
            var lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
            var a = Math.max(0, Math.min(1, (232 - lum) / (232 - 90)));       // white / paper -> transparent, dark marks -> solid
            a = Math.min(a, d[p + 3] / 255);
            if (recolor) { d[p] = ir; d[p + 1] = ig; d[p + 2] = ib; }
            d[p + 3] = Math.round(a * 255);
        }
        cv.ctx.putImageData(img, 0, 0);
        return cv.c.toDataURL('image/png');
    }

    function rxStampSave(dataUrl) {
        rxSettings.stampSrc = dataUrl || '';
        if (dataUrl) rxSet('pos_receipt_stamp_src', dataUrl); else rxDel('pos_receipt_stamp_src');
        if (dataUrl && !rxSettings.showStamp) { rxSettings.showStamp = true; rxSet('pos_receipt_show_stamp', 'true'); }
        window.__stampRaster = null;
        rxStampRefreshUI(); rxPush();
    }

    /* what the receipt (screen, browser print, PDF-less) shows: the stamp between the header and the item lines, tilted by the chosen angle */
    function receiptStampBlockHtml() {
        if (!(rxSettings.showStamp && rxSettings.stampSrc)) return '';
        var size = Math.max(30, Math.min(100, rxSettings.stampSize || 70));
        var ang = Math.max(-45, Math.min(45, rxSettings.stampAngle || 0));
        var pad = Math.round(6 + Math.abs(Math.sin(ang * Math.PI / 180)) * 26);
        return '<div class="rg-stamp" style="text-align:center; padding:' + pad + 'px 0; line-height:0;">'
            + '<img alt="" src="' + rxEsc(rxSettings.stampSrc) + '" style="width:' + size + '%; max-width:100%; height:auto; transform:rotate(' + ang + 'deg); mix-blend-mode:multiply; opacity:.93; -webkit-print-color-adjust:exact; print-color-adjust:exact;">'
            + '</div>';
    }

    /* what a thermal printer gets: the same stamp, tilted on a canvas, then dithered to dots (like the logo). Prepared BEFORE the print (printReceipt awaits it). */
    function receiptStampRasterKey() {
        var d = String(rxSettings.stampSrc || '');
        var dots = 384; try { dots = receiptLogoDots(); } catch (e) { /* default */ }
        return 'v1:' + dots + ':' + rxSettings.stampAngle + ':' + rxSettings.stampSize + ':' + d.length + ':' + d.slice(-40);
    }
    async function prepareReceiptStampRaster() {
        try {
            if (!(rxSettings.showStamp && rxSettings.stampSrc)) { window.__stampRaster = null; return null; }
            var key = receiptStampRasterKey();
            if (window.__stampRaster && window.__stampRaster.key === key) return window.__stampRaster.bytes;
            var im = await rxLoadImage(rxSettings.stampSrc);
            var dots = receiptLogoDots();
            var nw = im.naturalWidth || im.width, nh = im.naturalHeight || im.height;
            var maxW = Math.max(64, Math.floor(dots * 0.8 * Math.max(30, Math.min(100, rxSettings.stampSize || 70)) / 100 / 8) * 8);
            var sc = Math.min(maxW / nw, 220 / nh);
            var w = Math.max(16, Math.round(nw * sc)), h = Math.max(16, Math.round(nh * sc));
            var a = (rxSettings.stampAngle || 0) * Math.PI / 180;
            var bw = Math.ceil(Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a))) + 8, bh = Math.ceil(Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a))) + 8;
            var cv = rxCanvas(bw, bh);
            if (!cv) { window.__stampRaster = null; return null; }
            cv.ctx.fillStyle = '#fff'; cv.ctx.fillRect(0, 0, bw, bh);
            cv.ctx.translate(bw / 2, bh / 2); cv.ctx.rotate(a); cv.ctx.drawImage(im, -w / 2, -h / 2, w, h);
            var bytes = receiptLogoRasterFromRgba(cv.ctx.getImageData(0, 0, bw, bh).data, bw, bh, dots);
            if (!bytes) { window.__stampRaster = null; return null; }
            window.__stampRaster = { key: key, bytes: bytes };
            return bytes;
        } catch (e) {
            window.__stampRaster = null;
            return null;                                                  // the receipt prints without the stamp
        }
    }
    function receiptStampRasterBytes() {
        try {
            if (!(rxSettings.showStamp && rxSettings.stampSrc)) return null;
            var r = window.__stampRaster;
            return r && r.bytes && r.key === receiptStampRasterKey() ? r.bytes : null;
        } catch (e) { return null; }
    }

    /* ---- the settings card (added to Settings > Receipts, before "Item List Alignment") ---- */
    function rxStampInstallUI() {
        var section = document.getElementById('settings-section-receipts');
        if (!section || document.getElementById('receipt-stamp-card')) return;
        var card = document.createElement('div');
        card.id = 'receipt-stamp-card';
        card.innerHTML =
            '<hr class="settings-divider">'
            + '<h4>🔏 Receipt Stamp</h4>'
            + '<p style="font-size:13px; color:#555; margin:0 0 8px;">Prints a stamp just above the item list, slightly tilted like one pressed by hand. Make one from your shop details below, or upload a picture of your own stamp (press it on plain white paper and take a photo or scan). Thermal printers print it in black and white.</p>'
            + '<div class="settings-row" style="flex-direction:column; align-items:stretch; gap:8px;">'
            + '<label style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:normal;"><input type="checkbox" id="rx-stamp-show" style="width:auto;"> Print the stamp on receipts and bills</label>'
            + '<div id="rx-stamp-preview-wrap" style="display:none; text-align:center; padding:18px 0; background:#fff; border:1px dashed #cfd6dd; border-radius:8px;"><img id="rx-stamp-preview" alt="Stamp preview" style="max-width:70%; max-height:140px;"></div>'
            + '<p id="rx-stamp-status" class="settings-msg">No stamp yet.</p>'
            + '<div style="border:1px solid #e3e8ee; border-radius:8px; padding:10px; background:#fafbfc;">'
            + '<div style="font-weight:600; font-size:13px; margin-bottom:6px;">✍️ Make a stamp from text</div>'
            + '<input type="text" id="rx-stamp-l1" placeholder="Line 1 — shop name" maxlength="40" style="margin-bottom:6px;">'
            + '<input type="text" id="rx-stamp-l2" placeholder="Line 2 — e.g. PIN, address or PAID" maxlength="40" style="margin-bottom:6px;">'
            + '<input type="text" id="rx-stamp-l3" placeholder="Line 3 — e.g. phone (optional)" maxlength="40" style="margin-bottom:6px;">'
            + '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">'
            + '<select id="rx-stamp-ink" style="width:auto;"><option value="blue">Blue ink</option><option value="purple">Purple ink</option><option value="red">Red ink</option><option value="black">Black ink</option><option value="green">Green ink</option></select>'
            + '<select id="rx-stamp-shape" style="width:auto;"><option value="rect">Rounded box</option><option value="oval">Oval</option></select>'
            + '<button type="button" class="settings-small-btn" id="rx-stamp-make">Create stamp</button></div>'
            + '<div style="font-weight:600; font-size:13px; margin:4px 0 6px;">📷 …or upload a picture of your stamp</div>'
            + '<input type="file" id="rx-stamp-file" accept="image/*" style="font-size:13px;">'
            + '<label style="display:flex; align-items:center; gap:8px; font-size:12px; font-weight:normal; margin-top:6px;"><input type="checkbox" id="rx-stamp-recolor" checked style="width:auto;"> Print it in the ink colour chosen above (untick to keep the picture\'s own colour)</label>'
            + '</div>'
            + '<label class="label" style="margin-top:4px;">Tilt: <span id="rx-stamp-angle-val"></span>°</label>'
            + '<input type="range" id="rx-stamp-angle" min="-25" max="25" step="1" style="width:100%;">'
            + '<label class="label">Size: <span id="rx-stamp-size-val"></span>% of the paper width</label>'
            + '<input type="range" id="rx-stamp-size" min="30" max="100" step="5" style="width:100%;">'
            + '<button type="button" class="settings-small-btn" id="rx-stamp-remove" style="background:var(--danger); color:white; align-self:flex-start; display:none;">Remove stamp</button>'
            + '</div>';
        // before "Item List Alignment" when it is there, otherwise at the end of the editable area
        var anchor = null;
        var hs = section.querySelectorAll('h4');
        for (var i = 0; i < hs.length; i++) { if (/Item List Alignment/i.test(hs[i].textContent || '')) { anchor = hs[i]; break; } }
        if (anchor) {
            var before = anchor.previousElementSibling;                   // the divider above that heading
            var ref = before && before.tagName === 'HR' ? before : anchor;
            ref.parentNode.insertBefore(card, ref);
        } else {
            (document.getElementById('receipt-settings-editable-area') || section).appendChild(card);
        }
        var $ = function (id) { return document.getElementById(id); };
        $('rx-stamp-show').addEventListener('change', function () {
            rxSettings.showStamp = this.checked; rxSet('pos_receipt_show_stamp', String(this.checked)); window.__stampRaster = null; rxStampRefreshUI(); rxPush();
        });
        $('rx-stamp-angle').addEventListener('input', function () {
            rxSettings.stampAngle = parseFloat(this.value) || 0; rxSet('pos_receipt_stamp_angle', String(rxSettings.stampAngle)); window.__stampRaster = null; rxStampRefreshUI(true); rxPush();
        });
        $('rx-stamp-size').addEventListener('input', function () {
            rxSettings.stampSize = parseFloat(this.value) || 70; rxSet('pos_receipt_stamp_size', String(rxSettings.stampSize)); window.__stampRaster = null; rxStampRefreshUI(true); rxPush();
        });
        $('rx-stamp-make').addEventListener('click', function () {
            var lines = [$('rx-stamp-l1').value, $('rx-stamp-l2').value, $('rx-stamp-l3').value];
            if (!lines[0].trim()) lines[0] = (typeof businessName === 'string' && businessName) || '';
            var url = rxStampFromText(lines, $('rx-stamp-ink').value, $('rx-stamp-shape').value);
            if (!url) { rxToast('This device cannot draw the stamp — upload a picture of your stamp instead.', true); return; }
            rxStampSave(url); rxToast('🔏 Stamp saved.');
        });
        $('rx-stamp-file').addEventListener('change', async function () {
            var f = this.files && this.files[0]; if (!f) return;
            try {
                if (!/^image\//.test(f.type || '')) { rxToast('Choose a picture file (PNG or JPG).', true); return; }
                if (f.size > 6 * 1024 * 1024) { rxToast('That picture is too big — use one under 6 MB.', true); return; }
                var raw = await new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(new Error('the file could not be read')); }; r.readAsDataURL(f); });
                var out = await rxStampFromImage(String(raw), $('rx-stamp-ink').value, $('rx-stamp-recolor').checked);
                if (out.length > 600 * 1024) { rxToast('That picture is still too detailed after shrinking — try a simpler one.', true); return; }
                rxStampSave(out); rxToast('🔏 Stamp saved.');
            } catch (e) { rxToast('The stamp could not be made: ' + ((e && e.message) || 'unknown error'), true); }
            this.value = '';
        });
        $('rx-stamp-remove').addEventListener('click', function () { rxStampSave(''); rxToast('Stamp removed.'); });
        rxStampRefreshUI();
    }
    function rxStampRefreshUI(sliderOnly) {
        var $ = function (id) { return document.getElementById(id); };
        if (!$('receipt-stamp-card')) return;
        var has = !!rxSettings.stampSrc;
        if (!sliderOnly) {
            $('rx-stamp-show').checked = !!rxSettings.showStamp;
            $('rx-stamp-angle').value = String(rxSettings.stampAngle); $('rx-stamp-size').value = String(rxSettings.stampSize);
        }
        $('rx-stamp-angle-val').textContent = String(rxSettings.stampAngle); $('rx-stamp-size-val').textContent = String(rxSettings.stampSize);
        $('rx-stamp-preview-wrap').style.display = has ? 'block' : 'none';
        var img = $('rx-stamp-preview');
        if (img) { if (has && img.getAttribute('src') !== rxSettings.stampSrc) img.src = rxSettings.stampSrc; img.style.transform = 'rotate(' + rxSettings.stampAngle + 'deg)'; }
        $('rx-stamp-remove').style.display = has ? 'inline-block' : 'none';
        var st = $('rx-stamp-status');
        st.textContent = !has ? 'No stamp yet.' : (rxSettings.showStamp ? '✅ The stamp prints above the item list.' : 'A stamp is saved, but "Print the stamp" is off.');
        st.className = 'settings-msg' + (has && rxSettings.showStamp ? ' success' : '');
        if (!sliderOnly && !$('rx-stamp-l1').value && typeof businessName === 'string') $('rx-stamp-l1').value = businessName;
    }

    /* =====================================================================================================================
       2. BILLS LOCK
       ===================================================================================================================== */
    function billsLockActive() { return !!rxSettings.billsLocked; }
    function rxIsAdmin() { try { return typeof isAdminServing === 'function' ? !!isAdminServing() : true; } catch (e) { return true; } }
    function billsLockPassValid() { return (window.__billsLockPassUntil || 0) > Date.now(); }

    /* Runs `fn` only when this person may change a bill. Lock off: always. Lock on: staff never; the admin only after typing the admin password
       (that approval also covers the next 3 minutes, so "Settle" -> "Confirm" does not ask twice). */
    function billsLockGate(what, fn, args) {
        if (!billsLockActive()) return fn();
        if (!rxIsAdmin()) { rxToast('🔒 Bills are locked. Only the admin can ' + what + ' a bill.', true); return undefined; }
        if (billsLockPassValid()) return fn();
        if (typeof requireManagementApproval !== 'function') { rxToast('🔒 Bills are locked.', true); return undefined; }
        requireManagementApproval('Bills are locked. Enter the admin password to ' + what + ' this bill.', function () {
            window.__billsLockPassUntil = Date.now() + 3 * 60 * 1000;
            fn();
        });
        return undefined;
    }
    function billsLockSet(on) {
        if (!rxIsAdmin()) { rxToast('Only the admin can change this.', true); billsLockDecorate(); return; }
        var apply = function () {
            rxSettings.billsLocked = !!on; rxSet('pos_bills_locked', String(!!on)); window.__billsLockPassUntil = 0;
            billsLockDecorate(); rxPush();
            rxToast(on ? '🔒 Bills locked — staff can only view them.' : '🔓 Bills unlocked.');
        };
        if (!on && billsLockActive() && typeof requireManagementApproval === 'function') { requireManagementApproval('Enter the admin password to unlock bills.', apply); return; }
        apply();
    }
    /* the switch (admin only) and the read-only look for staff; called after every render of the Bills tab and when the lock changes */
    function billsLockDecorate() {
        var tab = document.getElementById('bills-tab');
        if (!tab) return;
        var admin = rxIsAdmin(), locked = billsLockActive();
        var bar = document.getElementById('bills-lock-bar');
        if (!bar) {
            bar = document.createElement('div'); bar.id = 'bills-lock-bar';
            bar.style.cssText = 'margin:0 0 10px; padding:9px 12px; border-radius:8px; font-size:13px; display:none; align-items:center; gap:10px; flex-wrap:wrap;';
            tab.insertBefore(bar, tab.firstChild);
        }
        if (admin) {
            bar.style.display = 'flex'; bar.style.background = locked ? '#fdecea' : '#f4f6f8'; bar.style.border = '1px solid ' + (locked ? '#f0b7b1' : '#dde3e9');
            bar.innerHTML = '<label style="display:flex; align-items:center; gap:8px; margin:0; font-weight:600; cursor:pointer;"><input type="checkbox" id="bills-lock-toggle" style="width:auto;"' + (locked ? ' checked' : '') + '> 🔒 Lock bills</label>'
                + '<span style="color:#5f6b76; flex:1; min-width:180px;">' + (locked ? 'Locked: staff can only view bills. You need the admin password to settle, edit or remove a bill.' : 'Off: when on, staff can only view bills, and settling, editing or removing a bill needs the admin password.') + '</span>';
            var cb = document.getElementById('bills-lock-toggle');
            if (cb) cb.addEventListener('change', function () { var want = this.checked; this.checked = !want; billsLockSet(want); });
        } else if (locked) {
            bar.style.display = 'flex'; bar.style.background = '#fdecea'; bar.style.border = '1px solid #f0b7b1';
            bar.innerHTML = '<span>🔒 Bills are locked by the admin — you can view them but not change them.</span>';
        } else { bar.style.display = 'none'; bar.innerHTML = ''; }
        // staff cannot see the buttons that change a bill (the gate above refuses them anyway if another path reaches the same functions)
        var hide = locked && !admin;
        tab.querySelectorAll('button, [onclick]').forEach(function (el) {
            var oc = el.getAttribute('onclick') || '';
            if (!/openBillSettleModal|markBillCarried|editBillDueDate|requestVoidSale|confirmBillSettle/.test(oc)) return;
            if (hide) { el.setAttribute('data-bl-hidden', '1'); el.style.display = 'none'; }
            else if (el.getAttribute('data-bl-hidden')) { el.removeAttribute('data-bl-hidden'); el.style.display = ''; }
        });
    }
    function billsLockInstall() {
        var wrap = function (name, what, only) {
            var orig = window[name];
            if (typeof orig !== 'function' || orig.__billsLockWrapped) return;
            var w = function () {
                var a = arguments, self = this;

                return billsLockGate(what, function () { return orig.apply(self, a); });
            };
            w.__billsLockWrapped = true;
            window[name] = w;
        };
        wrap('openBillSettleModal', 'settle');
        wrap('confirmBillSettle', 'settle');
        wrap('confirmBillSettleImpl', 'settle');
        wrap('editBillDueDate', 'edit');
        wrap('markBillCarried', 'edit');
        wrap('requestVoidSale', 'remove', function (id, source) { return source === 'bills'; });
        var render = window.renderBillsTab;
        if (typeof render === 'function' && !render.__billsLockWrapped) {
            var r2 = function () { var out = render.apply(this, arguments); try { billsLockDecorate(); } catch (e) { /* decoration only */ } return out; };
            r2.__billsLockWrapped = true; window.renderBillsTab = r2;
        }
        try { billsLockDecorate(); } catch (e) { /* the Bills tab may not exist in this app */ }
    }

    /* =====================================================================================================================

    function deliveryExtraFieldsInstall() {

        box.innerHTML = '<label class="label">ID / Passport No. <span style="font-weight:normal; color:#7f8c8d;">(optional — printed on the delivery receipt)</span></label>'
            + '<input type="text" id="delivery-id-input" placeholder="e.g. 12345678" autocomplete="off" maxlength="30">'
            + '<label class="label" style="margin-top:8px;">Directions / landmark <span style="font-weight:normal; color:#7f8c8d;">(optional)</span></label>'
            + '<input type="text" id="delivery-notes-input" placeholder="e.g. Blue gate, 2nd floor, call on arrival" maxlength="120">';

    function deliveryExtraFieldsRead() {

    /* ---------- start ---------- */
    (function rxStart() {
        var go = function () {

            try { billsLockInstall(); } catch (e) { /* the bills lock is an extra */ }

            // zip 156: instalment sales saved with four money lines are reshaped once (see repairInstallmentSales)

        };

    /* ---------- zip 163: PAYMENT METHODS THIS SHOP ACCEPTS + the sticky pay bar (every app's Sales Counter) ----------
       The cashier sees only the methods the owner accepts (default: all the app has). The setting syncs with the shop's other settings,
       so every till, phone and the Android/Windows apps agree. The total, the method buttons and Confirm live in ONE bar fixed to the
       bottom of the cart, so a long cart never needs scrolling to finish a sale. */
    var POS_PAY_ALL = [['cash', '💵 Cash'], ['mpesa', '📱 M-Pesa'], ['card', '💳 Card'], ['split', '➗ Split'], ['bill', '🧾 Bill (Pay Later)'], ['tab', '🍽️ Tab (Table/Room/Guest)']];
    function posPayPresent() { var out = []; POS_PAY_ALL.forEach(function (m) { if (document.getElementById('pay-' + m[0] + '-btn')) out.push(m[0]); }); return out; }
    function posPayAccepted() { var raw = rxGet('pos_pay_methods'); if (!raw) return POS_PAY_ALL.map(function (m) { return m[0]; }); try { var a = JSON.parse(raw); if (Array.isArray(a) && a.length) return a.filter(function (k) { return POS_PAY_ALL.some(function (m) { return m[0] === k; }); }); } catch (e) { /* default */ } return POS_PAY_ALL.map(function (m) { return m[0]; }); }
    function posPayShown() {
        var acc = posPayAccepted(), pres = posPayPresent(), out = pres.filter(function (k) { return acc.indexOf(k) !== -1; });
        return out.length ? out : (pres.length ? [pres[0]] : []);       /* a module can never be left with no way to pay */
    }
    function posPaySetAccepted(list, fromSync) {
        var a = (Array.isArray(list) ? list : []).filter(function (k) { return POS_PAY_ALL.some(function (m) { return m[0] === k; }); });
        if (!a.length) return false;
        if (a.length === POS_PAY_ALL.length) rxDel('pos_pay_methods'); else rxSet('pos_pay_methods', JSON.stringify(a));
        posApplyPayMethods();
        try { if (document.getElementById('pos-paymethods-panel')) posRenderPayMethodsPanel(); } catch (e) { /* cosmetic */ }
        if (!fromSync) rxPush();
        return true;
    }
    function posApplyPayMethods() {
        try {
            var shown = posPayShown();
            posPayPresent().forEach(function (k) { var b = document.getElementById('pay-' + k + '-btn'); if (b) b.style.display = shown.indexOf(k) !== -1 ? '' : 'none'; });
            if (typeof currentPaymentMethod !== 'undefined' && shown.length && shown.indexOf(currentPaymentMethod) === -1 && typeof setPaymentMethod === 'function') setPaymentMethod(shown[0]);
            if (typeof hospApplyPayMethods === 'function') hospApplyPayMethods();
        } catch (e) { /* cosmetic */ }
    }
    function posSavePayMethods() {
        var sel = Array.prototype.slice.call(document.querySelectorAll('.pos-paym:checked')).map(function (x) { return x.value; });
        if (!sel.length) { rxToast('Keep at least one payment method.', true); return; }
        posPaySetAccepted(sel, false); rxToast('Payment methods saved.');
    }
    function posRenderPayMethodsPanel() {
        var el = document.getElementById('pos-paymethods-panel'); if (!el) return;
        var pres = posPayPresent(), acc = posPayAccepted();
        el.innerHTML = '<h3 style="margin-top:0;">💳 Payment methods I accept</h3><div style="font-size:13px;color:#7f8c8d;margin:0 0 8px;">Only the ticked ones appear on the Sales Counter (and when settling). All are on by default. Every till and phone follows this.</div>'
            + POS_PAY_ALL.filter(function (m) { return pres.indexOf(m[0]) !== -1; }).map(function (m) { return '<label style="display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;"><input type="checkbox" class="pos-paym" value="' + m[0] + '" style="width:auto;"' + (acc.indexOf(m[0]) !== -1 ? ' checked' : '') + '> ' + rxEsc(m[1]) + '</label>'; }).join('')
            + '<button type="button" class="btn-main" style="min-height:44px;margin-top:6px;" onclick="posSavePayMethods()">Save payment methods</button>';
    }

    /* ---------- zip 166: RECEIPT KEYBOARD SHORTCUTS ----------
       While a receipt is on screen (and you are not typing in a box): P = print, D = download, S = share, C or Esc = close/cancel.
       Esc always closes. The four letters can be changed in Settings (kept on THIS device — keyboards differ). */
    var POS_RK_DEFAULT = { print: 'p', download: 'd', share: 's', cancel: 'c' };
    function posRkGet() {
        var o = {}; try { o = JSON.parse(rxGet('pos_receipt_keys') || '{}') || {}; } catch (e) { o = {}; }
        var out = {}; Object.keys(POS_RK_DEFAULT).forEach(function (k) { var v = String(o[k] || '').trim().toLowerCase().slice(0, 1); out[k] = v || POS_RK_DEFAULT[k]; });
        return out;
    }
    function posRkRender() {
        var host = document.getElementById('pos-receiptkeys-panel');
        if (!host) {
            var pm = document.getElementById('pos-paymethods-panel'); if (!pm) return;
            host = document.createElement('div'); host.className = 'panel'; host.id = 'pos-receiptkeys-panel'; host.style.marginBottom = '15px';
            pm.parentNode.insertBefore(host, pm.nextSibling);
        }
        var k = posRkGet();
        var row = function (id, label) { return '<label style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:15px;">' + label + '<input type="text" id="pos-rk-' + id + '" value="' + k[id] + '" maxlength="1" style="width:56px;text-align:center;font-weight:800;font-size:18px;text-transform:uppercase;"></label>'; };
        host.innerHTML = '<h3 style="margin-top:0;">⌨️ Receipt keyboard shortcuts</h3><div style="font-size:13px;color:#7f8c8d;margin:0 0 8px;">With a receipt on screen, press a key to act on it (not while typing in a box). <strong>Esc</strong> always closes it. Change the letters to suit you; they are kept on this device.</div>'
            + row('print', '🖨️ Print') + row('download', '⬇️ Download') + row('share', '📤 Share') + row('cancel', '✖ Cancel / close (also Esc)')
            + '<div style="display:flex;gap:8px;margin-top:6px;"><button type="button" class="btn-main" style="min-height:44px;" onclick="posRkSave()">Save shortcuts</button><button type="button" class="settings-small-btn" style="min-height:44px;" onclick="posRkReset()">Reset</button></div>';
    }
    function posRkSave() {
        var o = {}, seen = {};
        for (var k in POS_RK_DEFAULT) {
            var el = document.getElementById('pos-rk-' + k), v = el ? String(el.value || '').trim().toLowerCase().slice(0, 1) : '';
            if (!v) v = POS_RK_DEFAULT[k];
            if (!/^[a-z0-9]$/.test(v)) { rxToast('Use a single letter or number for each shortcut.', true); return; }
            if (seen[v]) { rxToast('Each shortcut needs its own key — "' + v.toUpperCase() + '" is used twice.', true); return; }
            seen[v] = 1; o[k] = v;
        }
        rxSet('pos_receipt_keys', JSON.stringify(o)); posRkRender(); rxToast('Shortcuts saved.');
    }
    function posRkReset() { try { localStorage.removeItem('pos_receipt_keys'); } catch (e) { /* default */ } posRkRender(); rxToast('Shortcuts reset to P / D / S / C.'); }
    function posRkOpen() { var m = document.getElementById('receipt-modal'); return !!m && getComputedStyle(m).display !== 'none' && getComputedStyle(m).visibility !== 'hidden'; }
    document.addEventListener('keydown', function (ev) {
        try {
            if (ev.defaultPrevented || ev.ctrlKey || ev.metaKey || ev.altKey || !posRkOpen()) return;
            var t = ev.target, tag = t && t.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) { if (ev.key !== 'Escape') return; }
            var key = String(ev.key || '').toLowerCase(), k = posRkGet(), act = null;
            if (key === 'escape') act = 'cancel'; else if (key === k.print) act = 'print'; else if (key === k.download) act = 'download'; else if (key === k.share) act = 'share'; else if (key === k.cancel) act = 'cancel';
            if (!act) return;
            ev.preventDefault(); ev.stopPropagation();
            if (act === 'print' && typeof printReceipt === 'function') printReceipt();
            else if (act === 'download' && typeof downloadReceiptPdf === 'function') downloadReceiptPdf();
            else if (act === 'share' && typeof shareReceiptNative === 'function') shareReceiptNative();
            else if (act === 'cancel' && typeof closeReceipt === 'function') closeReceipt();
        } catch (e) { /* a shortcut must never break the till */ }
    }, true);
    /* zip 168: on a desktop the checkout card is as tall as the screen allows (never more) — the cart list scrolls inside it */
    var posCkRaf = 0;
    function posCkFit() {
        if (posCkRaf) return;
        posCkRaf = requestAnimationFrame(function () {
            posCkRaf = 0;
            try {
                var p = document.querySelector('.pos-checkout'); if (!p) return;
                var tab = document.getElementById('sales-tab');
                if (window.innerWidth <= 900 || (tab && !tab.classList.contains('active'))) { p.style.maxHeight = ''; return; }
                p.style.maxHeight = '';
                var top = p.getBoundingClientRect().top;
                var room = innerHeight - Math.max(top, 8) - 10; if (room < 560) room = innerHeight - 18;   /* card sits low on the page (e.g. under the products): size it for when it is scrolled into view */
                var maxH = Math.max(room, 420); p.style.maxHeight = maxH + 'px';
                /* the payment details take what is left after the header, a minimum cart list and the total / methods / Confirm; they scroll inside */
                var wrap = p.querySelector('#cart-sticky-bar > .pos-pay-details'), cart = p.querySelector('.pos-cart-scroll'), bar = document.getElementById('cart-sticky-bar');
                if (wrap && cart && bar) {
                    wrap.style.maxHeight = '';
                    var topH = cart.getBoundingClientRect().top - p.getBoundingClientRect().top;
                    var barOther = bar.offsetHeight - wrap.offsetHeight + 12;
                    var avail = maxH - topH - 130 - barOther;
                    wrap.style.maxHeight = Math.max(avail, 90) + 'px';
                }
            } catch (e) { /* cosmetic */ }
        });
    }
    function posSyncCartBarOffset() {
        try {
            var bar = document.getElementById('cart-sticky-bar'), tab = document.getElementById('sales-tab'), r = bar && bar.getBoundingClientRect();
            var on = bar && tab && tab.classList.contains('active') && bar.offsetParent !== null && r.top < innerHeight - 4 && r.bottom > 0;
            document.documentElement.style.setProperty('--cartbar-h', on ? bar.offsetHeight + 'px' : '0px');
        } catch (e) { /* cosmetic */ }
    }
    (function () {
        try {
            var go = function () {
                // zip 166/168: the payment fields (customer phone, tendered, split, M-Pesa prompt, bill/tab details) live INSIDE the checkout footer,
                // and on a desktop the whole checkout card is bounded to the screen: the cart list scrolls inside it, the footer never leaves.
                try {

                    if (pb && panel) {

                            var kids = Array.prototype.slice.call(panel.children), bi = kids.indexOf(pb), start = -1, i;
                            for (i = 0; i < bi; i++) { if (kids[i].querySelector && (kids[i].classList.contains('table-scroll') || kids[i].id === 'cart-materials-preview')) start = i; }
                            if (start >= 0 && start + 1 < bi) { wrap = document.createElement('div'); wrap.className = 'payment-toggle-wrap'; panel.insertBefore(wrap, kids[start + 1]); for (i = start + 1; i < bi; i++) wrap.appendChild(kids[i]); }

                        var lab = wrap && wrap.querySelector('label.label'); if (lab && /Customer Phone/i.test(lab.textContent)) lab.innerHTML = 'Customer phone <span style="font-weight:normal;color:#7f8c8d;">(optional)</span>';
                        var h3 = panel.querySelector(':scope > h3');
                        if (h3) { h3.insertAdjacentHTML('beforeend', ' <span id="pos-ck-count" class="pos-ck-count"></span>'); }
                        var tb = document.getElementById('cart-table');
                        var upd = function () {
                            try {
                                var n = 0, q = 0; var rows = tb.querySelectorAll('tbody tr');
                                rows.forEach(function (r) { if (r.querySelector('.empty-state') || r.classList.contains('cart-empty-row')) return; n++; var qi = r.querySelector('input[type=number]'); q += qi ? (parseFloat(qi.value) || 0) : 1; });
                                var c = document.getElementById('pos-ck-count'); if (c) c.textContent = n ? n + (n === 1 ? ' item' : ' items') : '';
                            } catch (e) { /* cosmetic */ }
                            posCkFit();
                        };
                        if (tb && window.MutationObserver) new MutationObserver(upd).observe(tb, { childList: true, subtree: true });
                        if (window.ResizeObserver) new ResizeObserver(posCkFit).observe(pb);
                        window.addEventListener('resize', posCkFit);   /* zip 170: no scroll listener - it forced a full layout (max-height reset + measure) on every scroll frame */
                        upd();
                    }
                } catch (e) { /* the old layout still works */ }
                posApplyPayMethods(); posRenderPayMethodsPanel(); posRkRender(); posSyncCartBarOffset();
                var bar = document.getElementById('cart-sticky-bar');
                if (bar && window.ResizeObserver) new ResizeObserver(posSyncCartBarOffset).observe(bar);
                window.addEventListener('resize', posSyncCartBarOffset); window.addEventListener('scroll', posSyncCartBarOffset, { passive: true });
                document.addEventListener('click', function () { setTimeout(posSyncCartBarOffset, 60); }, true);
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(go, 300); }); else setTimeout(go, 300);
        } catch (e) { /* cosmetic */ }
    })();
