<!-- ACCOUNTS (zip 227) ------------------------------------------------------------------------------------------------------------
         A real set of books for the shop, built from what the till already records, plus the things only the owner can add.
         WHAT IT DOES. Every sale, Pay Later bill, bill payment, expense, trade credit and customer debt is turned into a balanced double-entry
         posting (debits = credits, always). Add your own opening balances, journals and fixed assets. From these it produces: General Ledger
         (per account, with running balance), Trial Balance, Income Statement, Balance Sheet, Cash Flow, Receivables and Payables ageing,
         Bank / M-Pesa reconciliation and a Fixed-assets register with monthly straight-line depreciation. Every report prints and exports to CSV.
         HOW THE BOOKS ARE KEPT. Accrual basis: a Pay Later bill is income and a receivable the day it is made; each payment moves money into
         Cash / M-Pesa / Bank and clears the receivable. Stock bought ("Restock" expenses) goes to Inventory and reaches Cost of goods sold as it is sold.
         Nothing in the till is changed or copied: the books are rebuilt from the till's own records every time, so they can never disagree with it.
         The owner's own entries (opening balances, journals, fixed assets, bank clearing) are kept on this device and travel with the shop's settings.
         Only the owner / admin sees the tab (a signed-in worker is locked out of it like every other management tab). -->

    function render() {
