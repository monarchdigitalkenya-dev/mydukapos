<!-- CW UI --------------------------------------------------------------------------------------------
     Car Wash & Cleaning app, block "cw-ui": the standalone application shell (sidebar, top bar, universal search, bottom bar on phones),
     the Dashboard, the Jobs board, Car Check-in, the Cleaning job form and the Job drawer. The other screens are in cw-ui2.
     Written ONLY into carwash/index.html; never hand-edit it there. Plain global functions, ES2018 max, every global name starts with cw / Cw / CW_.
     The shell sits over the page once someone has signed in (the sign-in screens of the system stay in front of it): there is no
     sales counter, cart or retail checkout in this app. After editing run `npm run sync`. -->
<style>
#cw-app{--cw-bg:#f3f6f9;--cw-card:#fff;--cw-ink:#0f172a;--cw-mut:#64748b;--cw-line:#e2e8f0;--cw-pri:#0e7490;--cw-pri2:#0891b2;--cw-acc:#f59e0b;--cw-ok:#16a34a;--cw-bad:#dc2626;--cw-warn:#d97706;--cw-side:#0b1d2e;--cw-r:14px;
  position:fixed;inset:0;z-index:4000;display:none;grid-template-columns:252px 1fr;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--cw-ink);
  background-color:var(--cw-bg);background-image:radial-gradient(rgba(14,116,144,.07) 1px,transparent 1.2px),linear-gradient(180deg,#f8fafc 0,#eef3f7 100%);background-size:18px 18px,100% 100%}
body.cw-on #cw-app{display:grid}
body.cw-on.cw-sys #cw-app{display:none}
#cw-app *,#cw-modal *{box-sizing:border-box}
#cw-modal{--cw-bg:#f3f6f9;--cw-card:#fff;--cw-ink:#0f172a;--cw-mut:#64748b;--cw-line:#e2e8f0;--cw-pri:#0e7490;--cw-pri2:#0891b2;--cw-acc:#f59e0b;--cw-ok:#16a34a;--cw-bad:#dc2626;--cw-warn:#d97706;--cw-r:14px;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--cw-ink)}
#cw-modal button{font:inherit;cursor:pointer}
#cw-app button{font:inherit;cursor:pointer}
html body:not(#cwz) #cw-app :is(input,select,textarea),html body:not(#cwz) #cw-modal :is(input,select,textarea){font:inherit;color:var(--cw-ink);background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;width:100%;min-height:40px;margin:0;box-shadow:none}
html body:not(#cwz) :is(#cw-app,#cw-modal) textarea{min-height:70px;resize:vertical}
html body:not(#cwz) :is(#cw-app,#cw-modal) :is(input,select,textarea):focus{outline:none;border-color:var(--cw-pri2);box-shadow:0 0 0 3px rgba(8,145,178,.18)}
html body:not(#cwz) :is(#cw-app,#cw-modal) :is(input[type=checkbox],input[type=radio]){width:auto;min-height:0;accent-color:var(--cw-pri)}
.cw-side{background:var(--cw-side);color:#cbd5e1;display:flex;flex-direction:column;min-height:0;overflow:auto;
  background-image:linear-gradient(160deg,rgba(14,116,144,.35) 0%,rgba(11,29,46,0) 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px)}
.cw-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.cw-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#0e7490);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(8,145,178,.4);overflow:hidden;flex:none}
.cw-logo img{width:100%;height:100%;object-fit:cover}
.cw-brand b{display:block;color:#fff;font-size:14.5px;line-height:1.2;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-brand small{color:#7dd3fc;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.cw-nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.cw-nav h6{margin:12px 10px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#64748b;font-weight:700}
.cw-nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#cbd5e1;padding:9px 11px;border-radius:10px;text-align:left;font-weight:550;transition:background .15s,color .15s}
.cw-nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.cw-nav button.on{background:linear-gradient(90deg,rgba(34,211,238,.22),rgba(34,211,238,.06));color:#fff;box-shadow:inset 3px 0 0 #22d3ee}
.cw-nav button .cw-cnt{margin-left:auto;background:#f59e0b;color:#1f1300;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.cw-ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cw-me{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.cw-av{width:34px;height:34px;border-radius:50%;background:#1e3a52;color:#7dd3fc;display:grid;place-items:center;font-weight:800;flex:none}
.cw-me b{color:#fff;font-size:13px;display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-me small{color:#94a3b8;font-size:11.5px}
.cw-me button{margin-left:auto;border:1px solid rgba(255,255,255,.15);background:transparent;color:#e2e8f0;border-radius:9px;padding:6px 9px;font-size:12px}
.cw-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.cw-top{display:flex;align-items:center;gap:12px;padding:12px 22px;color:var(--cw-ink);background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--cw-line);position:relative;z-index:3}
.cw-who{display:flex;align-items:center;gap:8px;border:1px solid var(--cw-line);background:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;max-width:200px;flex-shrink:0}
.cw-who .cw-av{width:30px;height:30px;font-size:13px;flex-shrink:0}
.cw-who span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.cw-who b{font-size:13px;color:var(--cw-ink);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-who small{font-size:10.5px;color:var(--cw-mut)}
.cw-top h1{color:var(--cw-ink);font-size:19px;margin:0;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.cw-burger{display:none;border:0;background:#e0f2fe;color:#0e7490;border-radius:10px;width:40px;height:40px}
.cw-search{position:relative;flex:1;max-width:520px;margin-left:auto}
html body:not(#cwz) .cw-search input{padding-left:36px!important;background:#f1f5f9!important;border-color:transparent!important}
.cw-search svg{position:absolute;left:11px;top:11px;width:17px;height:17px;stroke:#64748b}
.cw-sres{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--cw-line);border-radius:12px;box-shadow:0 18px 40px rgba(15,23,42,.16);max-height:380px;overflow:auto;display:none}
.cw-sres.on{display:block}
.cw-spk .cw-sres{top:100%;margin-top:4px;z-index:30;max-height:300px}
.cw-spk{display:contents}
.cw-spk-f{position:relative}
.cw-ej-row{flex-wrap:nowrap;margin-bottom:6px}.cw-ej-row .cw-ej-price{max-width:110px}.cw-ej-row .cw-ej-qty{max-width:70px}
.cw-sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;border-bottom:1px solid #f1f5f9}
.cw-sres button:hover,.cw-sres button.sel{background:#ecfeff}
.cw-sres small{color:var(--cw-mut);display:block}
.cw-sync{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none;box-shadow:0 0 0 3px rgba(148,163,184,.25)}
.cw-sync.ok{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.2)}.cw-sync.busy{background:#f59e0b}.cw-sync.off{background:#dc2626}
.cw-body{flex:1;overflow:auto;padding:22px;scroll-behavior:smooth}
.cw-wrap{max-width:1320px;margin:0 auto}
.cw-btn{border:0;border-radius:10px;padding:9px 15px;font-weight:650;background:var(--cw-pri);color:#fff;display:inline-flex;align-items:center;gap:7px;min-height:40px;transition:transform .08s,filter .15s;white-space:nowrap}
.cw-btn:hover{filter:brightness(1.07)}.cw-btn:active{transform:scale(.98)}
.cw-btn.sec{background:#e2e8f0;color:#0f172a}.cw-btn.ghost{background:transparent;color:var(--cw-pri);border:1px solid #bae6fd}
.cw-btn.ok{background:var(--cw-ok)}.cw-btn.bad{background:var(--cw-bad)}.cw-btn.warn{background:var(--cw-acc);color:#1f1300}
.cw-btn.sm{padding:6px 11px;min-height:32px;font-size:12.5px;border-radius:9px}
.cw-btn[disabled]{opacity:.5;cursor:not-allowed}
.cw-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cw-sp{flex:1}
.cw-grid{display:grid;gap:14px}
.cw-g2{grid-template-columns:repeat(2,minmax(0,1fr))}.cw-g3{grid-template-columns:repeat(3,minmax(0,1fr))}.cw-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cw-card{background:var(--cw-card);border:1px solid var(--cw-line);border-radius:var(--cw-r);padding:16px 18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.04)}
.cw-card h3{margin:0 0 12px;font-size:15px;font-weight:750;display:flex;align-items:center;gap:8px}
.cw-card h3 small{font-weight:500;color:var(--cw-mut);font-size:12.5px}
.cw-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.cw-kpi{background:#fff;border:1px solid var(--cw-line);border-radius:14px;padding:13px 15px;position:relative;overflow:hidden;animation:cwUp .35s ease both}
.cw-kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--k,#0891b2);opacity:.09}
.cw-kpi span{color:var(--cw-mut);font-size:12px;font-weight:600}
.cw-kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:3px;color:var(--k2,#0f172a)}
.cw-kpi i{font-style:normal;font-size:11.5px;color:var(--cw-mut)}
.cw-sec{margin:22px 0 10px;font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:#475569;display:flex;align-items:center;gap:8px}
.cw-sec::after{content:"";flex:1;height:1px;background:var(--cw-line)}
.cw-badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--b,#64748b) 13%,#fff);color:var(--b,#334155);border:1px solid color-mix(in srgb,var(--b,#64748b) 30%,#fff);white-space:nowrap}
.cw-free{background:linear-gradient(90deg,#fef3c7,#fde68a);color:#92400e;border:1px solid #f59e0b;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px}
.cw-tbl{width:100%;border-collapse:separate;border-spacing:0}
.cw-tbl th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#64748b;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--cw-line);background:#f8fafc;position:sticky;top:0}
.cw-tbl td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.cw-tbl tr.cw-click{cursor:pointer}.cw-tbl tr.cw-click:hover td{background:#f0fdff}
.cw-tblw{overflow:auto;border:1px solid var(--cw-line);border-radius:12px;background:#fff}
.cw-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cw-mut{color:var(--cw-mut)}.cw-small{font-size:12.5px}
.cw-empty{text-align:center;color:var(--cw-mut);padding:34px 10px}
.cw-empty b{display:block;font-size:30px;margin-bottom:6px}
.cw-chips{display:flex;gap:7px;flex-wrap:wrap}
.cw-chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:#334155}
.cw-chip.on{background:var(--cw-pri);border-color:var(--cw-pri);color:#fff}
.cw-chip small{opacity:.75;margin-left:3px}
.cw-board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start}
.cw-col{background:rgba(255,255,255,.55);border:1px dashed #cbd5e1;border-radius:14px;padding:10px;min-height:120px}
.cw-col>h4{margin:2px 4px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.cw-col>h4 span{margin-left:auto;background:#e2e8f0;border-radius:999px;padding:1px 8px;font-size:12px}
.cw-job{background:#fff;border:1px solid var(--cw-line);border-left:4px solid var(--b,#64748b);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:transform .12s,box-shadow .12s;animation:cwUp .3s ease both}
.cw-job:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(15,23,42,.08)}
.cw-job .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:750}
.cw-job .p{font-size:17px;letter-spacing:.03em}
.cw-job .m{font-size:12.5px;color:var(--cw-mut);margin-top:3px}
.cw-job.late{box-shadow:0 0 0 2px rgba(220,38,38,.35)}
.cw-plate{display:inline-block;background:#fde047;color:#111;border:2px solid #111;border-radius:6px;padding:0 7px;font-weight:800;letter-spacing:.06em;font-size:13px;line-height:1.5}
.cw-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.cw-form .full{grid-column:1/-1}
.cw-f label{display:block;font-size:12.5px;font-weight:650;color:#334155;margin-bottom:5px}
.cw-f label i{font-style:normal;color:var(--cw-mut);font-weight:500}
.cw-svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.cw-svc{border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff;text-align:left;position:relative;transition:border-color .12s,background .12s}
.cw-svc b{display:block;font-size:13.5px}.cw-svc span{color:var(--cw-pri);font-weight:750;font-size:13px}
.cw-svc.on{border-color:var(--cw-pri);background:#ecfeff;box-shadow:0 0 0 2px rgba(14,116,144,.15)}
.cw-svc.on::after{content:"✓";position:absolute;right:9px;top:7px;color:#fff;background:var(--cw-pri);border-radius:50%;width:19px;height:19px;font-size:12px;display:grid;place-items:center}
.cw-sum{background:linear-gradient(135deg,#0b1d2e,#0e4f63);color:#e2e8f0;border-radius:16px;padding:16px 18px;position:sticky;top:0}
.cw-sum h3{color:#fff;margin:0 0 10px}
.cw-sum .l{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px}
.cw-sum .tot{border-top:1px solid rgba(255,255,255,.18);margin-top:8px;padding-top:9px;font-size:20px;font-weight:800;color:#fff}
.cw-loy{border-radius:12px;padding:11px 13px;background:#f0f9ff;border:1px solid #bae6fd;color:#075985;font-size:13px}
.cw-loy.win{background:linear-gradient(90deg,#fffbeb,#fef3c7);border-color:#f59e0b;color:#78350f;font-weight:700;animation:cwPulse 1.6s ease-in-out 3}
.cw-prog{height:9px;background:#e0f2fe;border-radius:99px;overflow:hidden;margin-top:7px}
.cw-prog i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#0e7490);border-radius:99px;transition:width .4s}
.cw-dots{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}.cw-dots i{width:15px;height:15px;border-radius:50%;background:#e2e8f0;display:block}.cw-dots i.f{background:#0891b2}.cw-dots i.g{background:#f59e0b}
.cw-pick{display:flex;gap:8px;flex-wrap:wrap}
.cw-pick button{border:1.5px solid #cbd5e1;background:#fff;border-radius:10px;padding:7px 12px;font-weight:650}
.cw-pick button.on{border-color:var(--cw-pri);background:#ecfeff;color:var(--cw-pri)}
.cw-modal{position:fixed;inset:0;z-index:4100;background:rgba(15,23,42,.45);display:none;justify-content:flex-end;animation:cwFade .15s ease}
.cw-modal.on{display:flex}
.cw-panel{background:#f8fafc;width:min(760px,100%);height:100%;overflow:auto;box-shadow:-20px 0 60px rgba(15,23,42,.25);animation:cwIn .22s ease;display:flex;flex-direction:column}
.cw-panel.narrow{width:min(520px,100%)}
.cw-ph{display:flex;align-items:center;gap:10px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--cw-line);position:sticky;top:0;z-index:2}
.cw-ph h2{margin:0;font-size:18px;flex:1;min-width:0}
.cw-ph .x{border:0;background:#f1f5f9;border-radius:10px;width:38px;height:38px;font-size:18px}
.cw-pb{padding:18px 20px;flex:1}
.cw-steps{display:flex;gap:6px;flex-wrap:wrap}
.cw-steps button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 11px;font-weight:650;font-size:12.5px;display:flex;align-items:center;gap:6px}
.cw-steps button:hover{border-color:var(--b);color:var(--b)}
.cw-tl{position:relative;padding-left:18px}
.cw-tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#e2e8f0}
.cw-tl div{position:relative;padding:3px 0 9px}
.cw-tl div::before{content:"";position:absolute;left:-17px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--b,#94a3b8);box-shadow:0 0 0 3px #fff}
.cw-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cw-photos figure{margin:0;border-radius:10px;overflow:hidden;background:#e2e8f0;aspect-ratio:1;position:relative}
.cw-photos img{width:100%;height:100%;object-fit:cover;display:block}
.cw-photos figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);color:#fff;font-size:11px;padding:2px 6px}
.cw-alert{border-radius:12px;padding:11px 14px;font-size:13.5px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b}
.cw-alert.info{border-color:#bae6fd;background:#f0f9ff;color:#075985}.cw-alert.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}.cw-alert.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
.cw-bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.cw-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.cw-bars i{display:block;width:100%;max-width:42px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#22d3ee,#0e7490);min-height:3px;transition:height .5s}
.cw-bars small{font-size:11px;color:var(--cw-mut)}
.cw-hb{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:13px}
.cw-hb span{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-hb div{flex:1;height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}.cw-hb div i{display:block;height:100%;background:#0891b2;border-radius:99px}
.cw-feed div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.cw-feed div:last-child{border:0}.cw-feed time{color:var(--cw-mut);white-space:nowrap;font-size:12px;min-width:44px}
.cw-bottom{display:none}
.cw-blocked{display:grid;place-items:center;height:100%;text-align:center;padding:30px}
.cw-sysbar{position:fixed;right:18px;bottom:18px;z-index:4050;display:none;border:0;border-radius:999px;padding:12px 18px;background:linear-gradient(135deg,#0e7490,#22d3ee);color:#fff;font-weight:800;box-shadow:0 12px 30px rgba(8,145,178,.45);cursor:pointer}
body.cw-on.cw-sys .cw-sysbar{display:block}
body.cw-on.cw-sys .tab-link,body.cw-on.cw-sys #snav,body.cw-on.cw-sys #snav-fly{display:none!important}
/* the till's own chrome (sidebar, on-screen keyboard button, stock-alert prompt) never shows over the Car Wash app */
body.cw-on :is(#snav,#snav-fly,#snav-scrim,#floating-kb-toggle,#notif-prompt-banner,#barcode-scanner-video){display:none!important}
body.cw-on:not(.cw-sys){overflow:hidden}
body.cw-on #posnet-offline-pill{left:auto!important;right:12px!important;bottom:12px!important}
@media (max-width:860px){body.cw-on #posnet-offline-pill{bottom:76px!important}}
@keyframes cwUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes cwIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes cwFade{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion:reduce){#cw-app *{animation:none!important;transition:none!important}}
@media (max-width:1100px){.cw-board{grid-template-columns:repeat(2,minmax(220px,1fr))}.cw-g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  #cw-app{grid-template-columns:1fr}

  #cw-app.nav-open .cw-side{transform:none}

  .cw-burger{display:grid;place-items:center}
  .cw-top{padding:10px 12px;flex-wrap:wrap}
  .cw-top h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .cw-who{padding:3px 10px 3px 3px;max-width:150px}.cw-who b{max-width:84px}
  .cw-search{order:5;flex-basis:100%;max-width:none}
  .cw-body{padding:14px 12px 86px}
  .cw-g2,.cw-g3,.cw-g4,.cw-form{grid-template-columns:1fr}
  .cw-board{grid-template-columns:1fr}
  .cw-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--cw-line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -6px 20px rgba(15,23,42,.06)}

  .cw-bottom button.on{color:var(--cw-pri);background:#ecfeff}
  .cw-bottom .plus{background:linear-gradient(135deg,#0e7490,#22d3ee);color:#fff!important;border-radius:16px;margin-top:-18px;box-shadow:0 8px 20px rgba(8,145,178,.45);padding:9px 12px}
  .cw-panel{width:100%}
  .cw-tbl th,.cw-tbl td{padding:8px 7px}
  .cw-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cw-kpi b{font-size:19px}
  /* zip 363 phone polish */
  .cw-bottom .plus.on{background:linear-gradient(135deg,#0e7490,#22d3ee)}
  .cw-ph{flex-wrap:wrap;padding:12px 14px;gap:8px}
  .cw-ph h2{font-size:17px;flex:1 1 calc(100% - 56px);overflow-wrap:anywhere}
  .cw-ph .x{order:2}
  .cw-phx{order:3;flex-basis:100%;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .cw-phx .cw-btn{flex-shrink:0}
  .cw-ej-row{display:grid!important;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border:1px solid var(--cw-line);border-radius:12px;background:#f8fafc}
  .cw-ej-row .cw-ej-name{grid-column:1/-1}
  .cw-ej-row .cw-ej-price,.cw-ej-row .cw-ej-qty{max-width:none}
  table.cw-stack thead{display:none}
  table.cw-stack,table.cw-stack tbody{display:block;width:100%}
  table.cw-stack tr{display:block;background:#fff;border:1px solid var(--cw-line);border-radius:12px;margin:0 0 10px;padding:6px 12px;box-shadow:0 1px 2px rgba(15,23,42,.04)}

  table.cw-stack td:last-child{border-bottom:0}
  table.cw-stack td::before{content:attr(data-l);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#64748b;text-align:left;flex-shrink:0}
  table.cw-stack td[data-l=""]::before{content:none}
  table.cw-stack td[data-l=""]{justify-content:flex-end}
  table.cw-stack td[colspan]{display:block;text-align:center}
  table.cw-stack td[colspan]::before{content:none}
  .cw-tblw{overflow:visible}
  body.cw-on.cw-mopen #posnet-offline-pill{display:none!important}
  body.cw-on #posnet-offline-pill{display:none!important}   /* the dot in the top bar shows sync on a phone: tap it for the words */
  .cw-sync{width:14px;height:14px;cursor:pointer}
  #cw-app .cw-f>select,#cw-app .cw-f>input,#cw-modal .cw-f>select,#cw-modal .cw-f>input{width:100%;max-width:none}
}
@media (min-width:861px){.cw-ej-row{display:grid;grid-template-columns:1fr 110px 70px;gap:6px}}

function cwJobsVisible(me, kind) {

    if (!j || j._deleted) return false;
    if (kind && j.kind !== kind) return false;
    if (cwCan('jobs.all', me)) return true;
    return cwStaffOnJob(j).some(function (a) { return a.staffId === me.id; });
  });
}
