<!-- BORROW & LEND (zip 369) ------------------------------------------------------------------------------------------------------------
     Trade Credits only tracked MONEY between this shop and another business. Real shops lend each other ITEMS, and settle in whatever way
     is easiest: the same items back, other items instead, money, part of each - or never. This tab covers all of that in plain steps:
       📥 I borrowed items  - stock goes UP now, and the other shop is owed the value.
       📤 I lent items      - stock goes DOWN now, and the other shop owes me the value.
       Then, any time, on the loan:  ↩️ items come back (the same items)  ·  🔁 pay with other items  ·  💵 pay money  ·  ✍️ write off.
       Part payments, due dates, a statement to send on WhatsApp, an "undo this entry" that puts the stock back, and the history of each loan.
     The records are kept inside the existing Trade Credits list (kind "goods"), so syncing, the totals on the Trade Credits tab and staff
     roles work as they already did; the old Settle button on such an entry sends you here instead of closing it without the items.
     Stock moves go through the same stock log as Restock / Stock Take. Money paid here is only tracked (as Trade Credits always was);
     it is not added to Expenses. Ids: sl-*. -->

<script id="sl-js">
(function () {
  'use strict';
  var TAB = 'shop-loans-tab', BTN = 'shop-loans-tab-btn';
  var S = { view: 'main', dir: 'i_owe', id: null, mode: null, form: null, busy: false };
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kes(n) { return 'KES ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function r3(n) { return Math.round((Number(n) || 0) * 1000) / 1000; }
  function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function toast(m, bad) { try { if (typeof showToast === 'function') showToast(m, !!bad); } catch (e) { /* cosmetic */ } }
  function today() { return new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10); }
  function who() { try { return typeof activeServerName === 'function' ? activeServerName() : ''; } catch (e) { return ''; } }
  function uid() { try { return genSaleId(); } catch (e) { return 'sl-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8); } }
  function canWrite() { try { return !(typeof custReadOnlyView === 'function' && custReadOnlyView()); } catch (e) { return true; } }
  function isMgr() { try { return typeof custIsManager === 'function' ? !!custIsManager() : true; } catch (e) { return true; } }
  function ready() { try { return typeof tradeCredits !== 'undefined' && Array.isArray(tradeCredits) && typeof inventory !== 'undefined' && Array.isArray(inventory); } catch (e) { return false; } }
  function loans() { return ready() ? tradeCredits.filter(function (t) { return t && t.kind === 'goods' && !t._deleted; }) : []; }
  function openLoans() { return loans().filter(function (t) { return t.status !== 'settled'; }); }
  function byId(id) { return loans().filter(function (t) { return t.id === id; })[0] || null; }
  function saveCredits() { try { safeSetItem('pos_trade_credits', JSON.stringify(tradeCredits)); } catch (e) { /* kept in memory */ } try { queuePush(); } catch (e2) { /* sent with the next change */ } }
  function saveStock() { try { safeSetItem('pos_inventory', JSON.stringify(inventory)); } catch (e) { /* kept in memory */ } try { queuePush(); } catch (e2) { /* next change sends it */ } }

  /* ---------------------------------------------------------- stock helpers ---------------------------------------------------------- */
  function hasVariants(p) { try { return typeof restockParentHasVariants === 'function' ? !!restockParentHasVariants(p) : (Array.isArray(p.variants) && p.variants.length > 0); } catch (e) { return false; } }
  function findItem(text) {
    var t = String(text || '').trim().toLowerCase(); if (!t) return null;
    var list = inventory.filter(function (p) { return p && !p._deleted && p.type !== 'service'; });
    return list.filter(function (p) { return String(p.code || '').toLowerCase() === t; })[0] || list.filter(function (p) { return String(p.name || '').trim().toLowerCase() === t; })[0] || null;
  }
  function itemByCode(code) { return inventory.filter(function (p) { return p && !p._deleted && String(p.code) === String(code); })[0] || null; }
  function defaultValue(p) { return p ? (Number(p.wholesalePrice) > 0 ? Number(p.wholesalePrice) : Number(p.price) || 0) : 0; }
  function stockOf(code) { var p = itemByCode(code); return p ? Number(p.qty) || 0 : 0; }
  /* move stock for one tracked item and write it to the stock log (batch items follow through stockAlignBatches) */
  function moveStock(code, delta, reason) {
    var p = itemByCode(code); if (!p || !delta) return false;
    p.qty = r3((Number(p.qty) || 0) + delta);
    try { if (Array.isArray(p.batches) && typeof stockAlignBatches === 'function') stockAlignBatches(p); } catch (e) { /* qty is still right */ }
    try { if (typeof logStockMovement === 'function') logStockMovement(p.code, p.name, delta, reason); } catch (e2) { /* the stock itself changed */ }
    return true;
  }
  /* "out" moves need enough stock: sum the need per item first so the same item on two lines is counted once */
  function checkStock(moves) {
    var need = {};
    moves.forEach(function (m) { if (m.delta < 0) need[m.code] = r3((need[m.code] || 0) - m.delta); });
    for (var c in need) { if (need[c] > stockOf(c) + 0.0005) { var p = itemByCode(c); return 'Only ' + stockOf(c) + ' of "' + (p ? p.name : c) + '" in stock (you need ' + need[c] + ').'; } }
    return '';
  }
  function applyMoves(moves, reason) { moves.forEach(function (m) { moveStock(m.code, m.delta, reason); }); if (moves.length) saveStock(); }

  /* ---------------------------------------------------------- model helpers ---------------------------------------------------------- */
  function itemsText(t) {
    return (t.lines || []).map(function (l) { return r3(l.qty) + (l.unit && l.unit !== 'pcs' ? ' ' + l.unit : '') + '× ' + l.name; }).join(', ');
  }
  function describe(t) {
    var base = (t.lines || []).length ? (t.direction === 'i_owe' ? 'Borrowed' : 'Lent') + ': ' + itemsText(t) : (t.direction === 'i_owe' ? 'You owe them' : 'They owe you') + ' (' + (t.note || 'balance') + ')';
    return t.status === 'settled' ? (t.cancelled ? 'Cancelled - ' : '') + base : base + ' - ' + kes(t.amount) + ' still open';
  }
  function stamp(t) { t.updatedAt = Date.now(); t.description = describe(t); }
  function finishIfPaid(t) { if (t.amount <= 0.005) { t.amount = 0; t.status = 'settled'; t.settledAt = new Date().toISOString(); } }
  function addEvent(t, ev) { ev.id = uid(); ev.at = new Date().toISOString(); ev.by = who(); (t.events = t.events || []).push(ev); }
  function overdue(t) { return t.status !== 'settled' && t.dueDate && String(t.dueDate) < today(); }
  function parties() {
    var map = {}; loans().forEach(function (t) { var k = String(t.partyName || '').trim().toLowerCase(); if (!k) return; (map[k] = map[k] || { name: t.partyName, phone: '', open: [], done: 0 }); if (t.partyPhone) map[k].phone = t.partyPhone; if (t.status === 'settled') map[k].done++; else map[k].open.push(t); });
    return Object.keys(map).map(function (k) { return map[k]; }).filter(function (p) { return p.open.length; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function net(p) { return p.open.reduce(function (n, t) { return n + (t.direction === 'they_owe' ? 1 : -1) * (Number(t.amount) || 0); }, 0); }
  function knownParties() {
    var seen = {}, out = []; loans().concat(ready() ? tradeCredits.filter(function (t) { return t && t.partyName && t.kind !== 'goods'; }) : []).forEach(function (t) { var k = String(t.partyName).trim().toLowerCase(); if (k && !seen[k]) { seen[k] = 1; out.push(t); } });
    return out;
  }
  function phoneOf(name) { var k = String(name || '').trim().toLowerCase(); var hit = loans().filter(function (t) { return String(t.partyName || '').trim().toLowerCase() === k && t.partyPhone; })[0]; return hit ? hit.partyPhone : ''; }

  /* ---------------------------------------------------------- statement / WhatsApp ---------------------------------------------------------- */
  function statement(p) {
    var biz = ''; try { biz = (localStorage.getItem('pos_biz_name') || '').trim(); } catch (e) { biz = ''; }
    var lines = ['Hello ' + p.name + ',', 'Items between ' + (biz || 'our shop') + ' and you (' + new Date().toLocaleDateString('en-GB') + '):'];
    p.open.forEach(function (t) { lines.push((t.direction === 'i_owe' ? '- We owe you: ' : '- You owe us: ') + itemsText(t) + ' = ' + kes(t.amount) + (t.dueDate ? ' (due ' + t.dueDate + ')' : '')); });
    var n = net(p); lines.push(n > 0.005 ? 'Net: you owe us ' + kes(n) : n < -0.005 ? 'Net: we owe you ' + kes(-n) : 'Net: even');
    lines.push('Thank you.'); return lines.join('\n');
  }
  function shareStatement(name) {
    var p = parties().filter(function (x) { return x.name === name; })[0]; if (!p) return;
    var text = statement(p), ph = String(p.phone || '').replace(/[^\d]/g, ''); if (/^0\d{9}$/.test(ph)) ph = '254' + ph.slice(1);
    try { window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(text), '_blank'); } catch (e) { /* copy below */ }
    try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e2) { /* optional */ }
    toast('Statement ready - sent to WhatsApp (also copied).');
  }

  /* ---------------------------------------------------------- screens ---------------------------------------------------------- */
  function render() {
    var host = $(TAB); if (!host) return;
    var h = '<div class="sl-wrap sl-pop">';
    if (!ready()) h += '<div class="sl-card"><p class="sl-empty">Borrow & Lend is not available on this screen.</p></div>';
    else if (S.view === 'new') h += viewNew();
    else if (S.view === 'loan') h += viewLoan();
    else h += viewMain();
    host.innerHTML = h + '</div>';
    var dl = $('sl-names'); if (dl) dl.innerHTML = inventory.filter(function (p) { return p && !p._deleted && p.type !== 'service'; }).map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('');
  }
  function viewMain() {
    var ps = parties(), owe = 0, owed = 0, late = 0;
    openLoans().forEach(function (t) { if (t.direction === 'i_owe') owe += Number(t.amount) || 0; else owed += Number(t.amount) || 0; if (overdue(t)) late++; });
    var h = '<div class="sl-card"><h3>🔄 Borrow &amp; Lend</h3><p class="sl-sub">Items you borrow from, or lend to, other shops. Give them back, swap for other items, pay money, or part of each.</p>' +
      '<div class="sl-sum"><div class="sl-red"><b>' + kes(owe) + '</b><span>you owe other shops</span></div><div class="sl-green"><b>' + kes(owed) + '</b><span>other shops owe you</span></div>' + (late ? '<div class="sl-red"><b>' + late + '</b><span>overdue</span></div>' : '') + '</div>' +
      '<div class="sl-two"><button type="button" class="sl-big sl-in" data-sl="new" data-v="i_owe">📥 I borrowed items</button><button type="button" class="sl-big sl-out" data-sl="new" data-v="they_owe">📤 I lent items</button></div>' +
      '<datalist id="sl-names"></datalist></div>';
    if (!ps.length) return h + '<div class="sl-card"><p class="sl-empty">Nothing open. When you borrow from or lend to another shop, it shows here.</p></div>' + doneList();
    ps.forEach(function (p) {
      var n = net(p);
      h += '<div class="sl-card"><div class="sl-party"><b>' + esc(p.name) + '</b><span class="sl-owe ' + (n > 0.005 ? 'sl-g' : n < -0.005 ? 'sl-r' : '') + '">' + (n > 0.005 ? 'owes you ' + kes(n) : n < -0.005 ? 'you owe ' + kes(-n) : 'even') + '</span></div>';
      p.open.slice().sort(function (a, b) { return new Date(a.timestamp) - new Date(b.timestamp); }).forEach(function (t) {
        h += '<div class="sl-loan"><span class="sl-tag">' + (t.direction === 'i_owe' ? '📥 I borrowed' : '📤 I lent') + '</span>' + (overdue(t) ? '<span class="sl-tag sl-late">overdue ' + esc(t.dueDate) + '</span>' : t.dueDate ? '<span class="sl-tag">due ' + esc(t.dueDate) + '</span>' : '') +
          '<small>' + new Date(t.timestamp).toLocaleDateString('en-GB') + '</small><ul class="sl-items">' + (t.lines || []).map(function (l) { return '<li>' + r3(l.qty) + (l.unit && l.unit !== 'pcs' ? ' ' + esc(l.unit) : '') + '× ' + esc(l.name) + (l.out < l.qty ? ' <small>(' + r3(l.out) + ' still to return)</small>' : '') + '</li>'; }).join('') + '</ul>' +
          '<b>' + kes(t.amount) + '</b> still to settle <button type="button" class="sl-btn sl-main" data-sl="open" data-id="' + esc(t.id) + '">Settle</button></div>';
      });
      var both = p.open.some(function (t) { return t.direction === 'i_owe'; }) && p.open.some(function (t) { return t.direction === 'they_owe'; });
      h += '<div class="sl-btns">' + (both ? '<button type="button" class="sl-btn" data-sl="offset" data-v="' + esc(p.name) + '">⚖️ Cancel out what we owe each other</button>' : '') + '<button type="button" class="sl-link" data-sl="share" data-v="' + esc(p.name) + '">📲 Send statement on WhatsApp</button></div></div>';
    });
    return h + doneList();
  }
  function doneList() {
    var done = loans().filter(function (t) { return t.status === 'settled'; }).sort(function (a, b) { return new Date(b.settledAt || b.timestamp) - new Date(a.settledAt || a.timestamp); }).slice(0, 12);
    if (!done.length) return '';
    return '<details class="sl-card"><summary><b>Finished (' + done.length + (loans().filter(function (t) { return t.status === 'settled'; }).length > done.length ? '+' : '') + ')</b></summary>' + done.map(function (t) {
      return '<div class="sl-loan"><span class="sl-tag">' + (t.cancelled ? '✖ cancelled' : '✅ settled') + '</span><b>' + esc(t.partyName) + '</b> - ' + esc(t.description || '') + '<div class="sl-hist">' + histHtml(t) + '</div></div>'; }).join('') + '</details>';
  }
  function histHtml(t) {
    return (t.events || []).map(function (e) { return '<div>' + new Date(e.at).toLocaleDateString('en-GB') + ' · ' + esc(e.label || e.type) + (e.amount ? ' · ' + kes(e.amount) : '') + (e.by ? ' · ' + esc(e.by) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</div>'; }).join('');
  }

  /* ---------- new loan ---------- */
  function newForm(dir) { return { dir: dir, party: '', phone: '', due: '', note: '', addNew: true, lines: [{ name: '', qty: '', value: '' }] }; }
  function viewNew() {
    var f = S.form, bor = f.dir === 'i_owe';
    var h = '<button type="button" class="sl-link sl-back" data-sl="back">← Back</button><div class="sl-card"><h3>' + (bor ? '📥 I borrowed items' : '📤 I lent items') + '</h3><p class="sl-sub">' +
      (bor ? 'Your stock goes UP now. You owe the other shop the value.' : 'Your stock goes DOWN now. The other shop owes you the value.') + '</p>' +
      '<label class="sl-lab">Which shop?</label><input id="sl-party" list="sl-parties" autocomplete="off" placeholder="Shop name" value="' + esc(f.party) + '" data-sl-f="party"><datalist id="sl-parties">' + knownParties().map(function (t) { return '<option value="' + esc(t.partyName) + '">'; }).join('') + '</datalist>' +
      '<label class="sl-lab">Their phone (optional, for the WhatsApp statement)</label><input id="sl-phone" type="tel" inputmode="tel" placeholder="07..." value="' + esc(f.phone) + '" data-sl-f="phone">' +
      '<label class="sl-lab">Items</label><datalist id="sl-names"></datalist>' +
      f.lines.map(function (l, i) { return '<div class="sl-line"><input id="sl-n' + i + '" list="sl-names" autocomplete="off" placeholder="Item" value="' + esc(l.name) + '" data-sl-l="name" data-i="' + i + '"><input id="sl-q' + i + '" type="number" inputmode="decimal" min="0" step="any" placeholder="How many" value="' + esc(l.qty) + '" data-sl-l="qty" data-i="' + i + '"><input id="sl-v' + i + '" type="number" inputmode="decimal" min="0" step="any" placeholder="Value each" value="' + esc(l.value) + '" data-sl-l="value" data-i="' + i + '"><button type="button" class="sl-x" data-sl="rm" data-i="' + i + '" aria-label="Remove">×</button></div>'; }).join('') +
      '<button type="button" class="sl-link" data-sl="add">+ Add another item</button>' +
      '<div class="sl-note">Value each = what one is worth between you two (it is filled in from your price list when you pick an item - change it if you agreed another). <b id="sl-total">' + kes(formTotal()) + '</b> in total.</div>' +
      (bor ? '<label style="display:block; font-size:13px; margin:8px 0;"><input type="checkbox" id="sl-addnew" style="width:auto; min-height:0;" ' + (f.addNew ? 'checked' : '') + ' data-sl-f="addNew"> If an item is not in my stock list, add it (so I can sell it)</label>' : '') +
      '<label class="sl-lab">Give back by (optional)</label><input id="sl-due" type="date" value="' + esc(f.due) + '" data-sl-f="due">' +
      '<label class="sl-lab">Note (optional)</label><input id="sl-note" placeholder="e.g. their delivery was late, we covered" value="' + esc(f.note) + '" data-sl-f="note">' +
      '<button type="button" class="sl-save" data-sl="save-new">✅ Save</button></div>';
    return h;
  }
  function formTotal() { return S.form ? S.form.lines.reduce(function (t, l) { return t + (parseFloat(l.qty) || 0) * (parseFloat(l.value) || 0); }, 0) : 0; }
  function saveNew() {
    if (!canWrite()) { toast('You are viewing another branch - it is read-only.', true); return; }
    var f = S.form, bor = f.dir === 'i_owe', party = f.party.trim();
    if (!party) { toast('Type which shop it is.', true); return; }
    var used = f.lines.filter(function (l) { return (l.name || '').trim() || (parseFloat(l.qty) || 0) > 0; });
    if (!used.length) { toast('Add at least one item.', true); return; }
    var lines = [], moves = [], created = [];
    for (var i = 0; i < used.length; i++) {
      var l = used[i], nm = l.name.trim(), q = r3(parseFloat(l.qty)), p = findItem(nm);
      if (!nm) { toast('Every line needs an item name.', true); return; }
      if (!(q > 0)) { toast('"' + nm + '": type how many.', true); return; }
      var v = parseFloat(l.value); if (isNaN(v)) v = defaultValue(p);
      if (!(v >= 0)) { toast('"' + nm + '": type what one is worth.', true); return; }
      var tracked = false, code = '', unit = p && p.unit ? p.unit : 'pcs', name = p ? p.name : nm;
      if (p && !hasVariants(p)) { tracked = true; code = p.code; }
      else if (!p && bor && f.addNew) { tracked = true; created.push({ name: nm, qty: q, value: v, unit: unit }); }
      if (tracked && !p) code = '(new)';
      lines.push({ lid: uid(), code: code, name: name, unit: unit, qty: q, out: q, value: r2(v), tracked: tracked });
      if (tracked && p) moves.push({ code: p.code, delta: bor ? q : -q });
    }
    if (!bor) { var err = checkStock(moves); if (err) { toast(err, true); return; } }
