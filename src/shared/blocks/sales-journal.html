<!-- SALES JOURNAL (zip 127) ------------------------------------------------------------------------------------------------------
         A completed sale must never disappear. Found in the code (see CHANGES_ZIP_127.md):
           * The sales list lives in localStorage. When the device's storage was FULL (photos, long history) the save of a new sale
             failed silently: the sale existed only in memory, the receipt printed, and after the app was closed (offline, or before
             it reached the server) the sale was gone. Reproduced in tests/sales-journal.test.mjs.
           * A crash in the middle of saving a big list could make the whole list unreadable at the next start.
         So every completed sale (and every stock movement, return and expense) is ALSO written, the moment it is saved, to this
         device's journal: the browser's IndexedDB, a separate and much larger store, written with "strict" durability. The journal:
           * restores any sale this device completed that is missing from the sales list (after a restart, a failed save, a bad load);
           * knows each sale's sync state — waiting, sending, retrying, on the server — and shows it in Daily Sales;
           * marks a sale "on the server" only when the server has accepted THAT version of it (a push answered OK, or the server's
             copy seen in a pull), so nothing is taken off the list early; entries stay 45 days after that, then are tidied;
           * never restores a sale that was deliberately removed (reset, purge, delete voided — those call salesJournalForget);
           * logs ONE "Synced to the server" audit line per batch of NEW sales that reached the server (retries never add another);
           * dates a new sale by the server's clock when this device's clock is wrong by more than 5 minutes (and says so).
         Also here: Daily Sales sync badges + "Check for missing sales" (compares this device, its journal, the server and the
         printed receipts), the receipt's "saved" line, and "Sync to this device" (Settings ▸ Devices & Security).
         Nothing here is ever deleted because a request failed. Self-contained on purpose (same code in every app). -->
    <script>

            s.timestamp = new Date().toISOString();
            s.dateCorrectedAt = Date.now();
            try { localStorage.setItem(LOGKEYS.salesLog, JSON.stringify(a)); } catch (e) { /* in memory */ }
            try { if (typeof queuePush === 'function') queuePush(); } catch (e) { /* the poll */ }
            return true;
        };
        var RECOVER_KEY = 'pos_hidden_sales_recovery_v1';
        window.salesJournalRecoverHidden = async function (force) {
            var done = null; try { done = localStorage.getItem(RECOVER_KEY); } catch (e) { /* private mode */ }
            if (done && !force) return { skipped: true };
            var before = (arrOf('salesLog') || []).length;
            var repaired = repairRecords();
            if (window.posNetOffline && window.posNetOffline()) return { repaired: repaired, online: false };
            // a full fetch (not "changes since"): sales this device lost, that the server still has, come back into its list
            try { localStorage.setItem('pos_last_synced_at', '0'); } catch (e) { /* full pull anyway */ }
            var ok = false;
            try {
                if (typeof flushPendingPush === 'function') await flushPendingPush();
                window.__pullInFlight = false;
                if (typeof pullStateOnce === 'function') await pullStateOnce();
                else if (typeof pullFromServerOnce === 'function') await pullFromServerOnce();
                var dot = document.getElementById('sync-status');
                ok = !(dot && (dot.dataset.state === 'error' || dot.dataset.state === 'offline'));
            } catch (e) { ok = false; }
            if (window.__lastHotFrom && typeof hydrateOlderHistory === 'function') {
                try { localStorage.removeItem('pos_hydrated_v1'); localStorage.removeItem('aqua_hydrated_v1'); } catch (e) { /* optional */ }
                try { await hydrateOlderHistory(window.__lastHotFrom); } catch (e) { /* next session */ }
            }
            var after = (arrOf('salesLog') || []).length;
            if (ok) {
                try { localStorage.setItem(RECOVER_KEY, String(Date.now())); } catch (e) { /* tried again next start */ }
                if (after > before || repaired) {
                    auditAppend({ at: Date.now(), by: 'Device', kind: 'recovered', what: (after > before ? (after - before) + ' sale' + (after - before === 1 ? '' : 's') + ' that were missing on this device fetched from the server' : '') + (after > before && repaired ? '; ' : '') + (repaired ? repaired + ' sale' + (repaired === 1 ? '' : 's') + ' with a broken date or item list repaired' : ''), refs: [], device: deviceId() });
                }
                try { if (typeof renderAllViews === 'function') renderAllViews(); else if (typeof renderDailySales === 'function') renderDailySales(); } catch (e) { /* cosmetic */ }
            }
            return { repaired: repaired, fetched: after - before, ok: ok };
        };
        setInterval(function () {                                   // the sync state moves on by itself: keep the badges true
            if (dailyVisible() && document.getElementById('daily-sales-tab')) {
                Array.prototype.forEach.call(document.querySelectorAll('#daily-sales-table .sj-badge'), function (b) { b.remove(); });
                decorate();
            }
        }, 4000);

        /* ---- reconciliation: this device, its journal, the server, printed receipts ---- */
        window.salesJournalReconcile = async function (fromKey, toKey) {
            var today = bizDay(Date.now());
            fromKey = fromKey || today; toKey = toKey || fromKey;
            var inRange = function (ts) { var k = bizDay(ts); return k >= fromKey && k <= toKey; };
            var local = (arrOf('salesLog') || []).filter(function (s) { return s && inRange(s.timestamp); });
            var localIds = new Set(local.map(function (s) { return String(s.id); }));
            var rows = [];
            try { rows = await readAll(); } catch (e) { rows = []; }
            var jSales = rows.filter(function (r) { return r.field === 'salesLog'; });
            var journalMissing = jSales.filter(function (r) { return r.rec && inRange(r.rec.timestamp) && (r.status === 'pending' || r.status === 'unconfirmed') && !localIds.has(r.id); });
            var printedMissing = jSales.filter(function (r) { return r.printedAt && r.rec && !localIds.has(r.id) && r.status !== 'removed' && inRange(r.rec.timestamp); });
            // sales this device completed that carry a date outside the day (wrong clock at the time)
            var clockOdd = jSales.filter(function (r) { return r.rec && r.rec.deviceTimestamp && inRange(r.rec.deviceTimestamp) && !inRange(r.rec.timestamp); });
            var archived = [];
            try {
                if (typeof window.storageLocalArchives === 'function') {
                    var arch = await new Promise(function (res) {
                        var q = indexedDB.open('pos_local_archive', 1);
                        q.onupgradeneeded = function () { try { q.result.createObjectStore('archives', { keyPath: 'id' }); } catch (e) {} };
                        q.onsuccess = function () { try { var db = q.result, t = db.transaction('archives', 'readonly'), g = t.objectStore('archives').getAll(); g.onsuccess = function () { db.close(); res(g.result || []); }; g.onerror = function () { db.close(); res([]); }; } catch (e) { res([]); } };
                        q.onerror = function () { res([]); };
                    });
                    arch.forEach(function (a) { ((a.fields || {}).salesLog || []).forEach(function (s) { if (s && inRange(s.timestamp) && !localIds.has(String(s.id))) archived.push(s); }); });
                }
            } catch (e) { /* no archive */ }
            var server = null;
            try {
                var b = typeof bizDayBounds === 'function' ? { from: bizDayBounds(fromKey).from, to: bizDayBounds(toKey).to } : null;
                if (b && typeof serverDayCheck === 'function') server = await serverDayCheck(b.from, b.to, siteParam());
            } catch (e) { server = null; }
            var pending = local.filter(function (s) { var x = window.salesSyncStatus(s.id); return x === 'pending' || x === 'retrying' || x === 'syncing'; });
            return { from: fromKey, to: toKey, local: local.length, pending: pending.length, journalMissing: journalMissing, printedMissing: printedMissing, archived: archived, clockOdd: clockOdd, server: server };
        };
        window.salesJournalRecover = async function () {
            var rows = [];
            try { rows = await readAll(); } catch (e) { return 0; }
            return restoreMissing(rows);
        };
        window.salesJournalFetchFromServer = async function (ids) {
            // Sales the server holds for the day but this device does not (another till, or lost here): fetched with the normal pull.
            try { localStorage.setItem('pos_last_synced_at', '0'); } catch (e) { /* the next pull is a full one anyway */ }
            if (typeof pullStateOnce === 'function') await pullStateOnce();
            else if (typeof pullFromServerOnce === 'function') await pullFromServerOnce();
            else if (typeof pullState === 'function') await pullState();
            var have = new Set((arrOf('salesLog') || []).map(function (s) { return String(s && s.id); }));
            return (ids || []).filter(function (id) { return have.has(String(id)); }).length;
        };
        window.salesJournalShowArchived = function (list) {
            var a = arrOf('salesLog'); if (!Array.isArray(a) || !list || !list.length) return 0;
            var have = new Set(a.map(function (s) { return String(s && s.id); })), n = 0;
            list.forEach(function (s) { if (s && !have.has(String(s.id))) { a.push(s); n++; } });
            if (n) { try { localStorage.setItem(LOGKEYS.salesLog, JSON.stringify(a)); } catch (e) { /* in memory for this session */ } try { renderDailySales(); } catch (e) { /* cosmetic */ } }
            return n;
        };
        window.salesJournalReconcileUi = async function () {
            var table = document.getElementById('daily-sales-table');
            if (!table) return;
            var box = document.getElementById('sj-reconcile');
            if (!box) { box = document.createElement('div'); box.id = 'sj-reconcile'; var sum = document.getElementById('sj-summary'); (sum || table).parentNode.insertBefore(box, (sum || table).nextSibling); }
            box.innerHTML = '<p class="settings-hint">Checking this device, its journal, the server and the printed receipts…</p>';
            var range = null;
            try { if (typeof salesTablePeriodRange === 'function') range = salesTablePeriodRange(); else if (typeof salesPeriodRange === 'function') range = salesPeriodRange(); } catch (e) { range = null; }
            var fromKey = range && typeof range.from === 'string' ? range.from : range && range.from ? bizDay(range.from) : bizDay(Date.now());
            var toKey = range && typeof range.to === 'string' ? range.to : range && range.to ? bizDay(range.to) : fromKey;
            var r = await window.salesJournalReconcile(fromKey, toKey);
            var money = function (v) { return 'KES ' + (Math.round((Number(v) || 0) * 100) / 100).toLocaleString('en-US'); };
            var li = [];
            li.push('<li>This device lists <strong>' + r.local + '</strong> sale' + (r.local === 1 ? '' : 's') + ' for ' + (r.from === r.to ? r.from : r.from + ' – ' + r.to) + (r.pending ? ' (' + r.pending + ' not on the server yet — sent automatically)' : '') + '.</li>');
            if (r.journalMissing.length) li.push('<li style="color:#c0392b;"><strong>' + r.journalMissing.length + '</strong> sale' + (r.journalMissing.length === 1 ? '' : 's') + ' completed on this device ' + (r.journalMissing.length === 1 ? 'is' : 'are') + ' in its journal but missing from the list: ' + r.journalMissing.map(function (x) { return (x.ref || x.id) + ' ' + money(x.total); }).join(', ') + ' <button type="button" class="settings-small-btn" data-sj="recover">Put ' + (r.journalMissing.length === 1 ? 'it' : 'them') + ' back</button></li>');
            else li.push('<li>✓ Journal: every sale completed on this device is in the list.</li>');
            if (r.printedMissing.length) li.push('<li style="color:#c0392b;">Printed receipts with no sale in the list: ' + r.printedMissing.map(function (x) { return x.ref || x.id; }).join(', ') + ' (put back with the button above).</li>');
            else li.push('<li>✓ Every receipt printed on this device has its sale in the list.</li>');
            if (r.archived.length) li.push('<li>' + r.archived.length + ' older sale' + (r.archived.length === 1 ? ' was' : 's were') + ' moved to this device\'s archive to save space. <button type="button" class="settings-small-btn" data-sj="archived">Show ' + (r.archived.length === 1 ? 'it' : 'them') + ' here</button></li>');
            if (r.clockOdd.length) li.push('<li>' + r.clockOdd.length + ' sale' + (r.clockOdd.length === 1 ? ' was' : 's were') + ' made while this device\'s clock was wrong; ' + (r.clockOdd.length === 1 ? 'it is' : 'they are') + ' listed under the correct date instead: ' + r.clockOdd.map(function (x) { return (x.ref || x.id) + ' → ' + bizDay(x.rec.timestamp); }).join(', ') + '.</li>');
            var odd = window.salesJournalImpossibleDates();
            if (odd.length) li.push('<li style="color:#b9770e;">' + odd.length + ' sale' + (odd.length === 1 ? ' has' : 's have') + ' an impossible date (the device clock was wrong when ' + (odd.length === 1 ? 'it was' : 'they were') + ' made), so ' + (odd.length === 1 ? 'it shows' : 'they show') + ' on no normal day: '
                + odd.slice(0, 20).map(function (x) { return (x.refNumber || x.id) + ' (' + (x.timestamp ? String(x.timestamp).slice(0, 10) : 'no date') + ') <button type="button" class="settings-small-btn" data-sj="today" data-id="' + String(x.id).replace(/"/g, '') + '">Move to today</button>'; }).join(', ') + '</li>');
            if (!r.server) li.push('<li>Server check: not available (offline) — nothing is lost; it is checked again when online.</li>');
            else if (r.server.ok) li.push('<li>✓ Server: holds the same ' + r.server.srv.count + ' sale' + (r.server.srv.count === 1 ? '' : 's') + ' (' + money(r.server.srv.gross) + ').</li>');
            else {
                if (r.server.missingHere.length) li.push('<li style="color:#b9770e;">' + r.server.missingHere.length + ' sale' + (r.server.missingHere.length === 1 ? ' is' : 's are') + ' on the server but not on this device yet (another till, or not fetched yet). <button type="button" class="settings-small-btn" data-sj="fetch">Fetch ' + (r.server.missingHere.length === 1 ? 'it' : 'them') + '</button></li>');
                if (r.server.notOnServer.length) li.push('<li style="color:#b9770e;">' + r.server.notOnServer.length + ' sale' + (r.server.notOnServer.length === 1 ? '' : 's') + ' on this device ' + (r.server.notOnServer.length === 1 ? 'has' : 'have') + ' not reached the server yet — sent automatically. <button type="button" class="settings-small-btn" data-sj="send">Send now</button></li>');
            }
            box.innerHTML = '<div style="border:1px solid #d5dbdb; border-radius:8px; padding:8px 12px; background:#fff;"><strong>🔎 Missing-sales check</strong><ul style="margin:6px 0 0; padding-left:18px;">' + li.join('') + '</ul></div>';
            box.onclick = async function (ev) {
                var b = ev.target.closest && ev.target.closest('[data-sj]');
                if (!b) return;
                var what = b.getAttribute('data-sj');
                b.disabled = true;
                try {
                    if (what === 'recover') { var n = await window.salesJournalRecover(); if (typeof showToast === 'function') showToast(n ? n + ' record(s) put back.' : 'Nothing to put back.'); }
                    if (what === 'archived') { var k = window.salesJournalShowArchived(r.archived); if (typeof showToast === 'function') showToast(k + ' archived sale(s) shown.'); }
                    if (what === 'fetch') { var g = await window.salesJournalFetchFromServer(r.server.missingHere); if (typeof showToast === 'function') showToast(g + ' sale(s) fetched from the server.'); }
                    if (what === 'send' && typeof syncRetryNow === 'function') await syncRetryNow();
                    if (what === 'today') { window.salesJournalMoveToToday(b.getAttribute('data-id')); if (typeof showToast === 'function') showToast('Moved to today — the original date is kept on the sale.'); }
                } catch (e) { if (typeof showToast === 'function') showToast('Could not finish — try again.', true); }
                try { renderDailySales(); } catch (e) { /* cosmetic */ }
                window.salesJournalReconcileUi();
            };
        };

        /* ---- "Sync to this device" (Settings ▸ Devices & Security) ---- */
        var syncing = false, autoRetries = 0;
        window.syncToThisDevice = async function (onStep) {
            if (syncing) return { ok: false, error: 'Already syncing.' };
            syncing = true;
            var say = function (i, state, text) { try { if (onStep) onStep(i, state, text); } catch (e) { /* cosmetic */ } };
            var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
            var tries = async function (fn, n) { var last; for (var i = 0; i < n; i++) { try { var v = await fn(); if (v !== false) return v; } catch (e) { last = e; } await wait(2000 * Math.pow(2, i)); } if (last) throw last; return false; };
            var before = (arrOf('salesLog') || []).length;
            try {
                if (window.PosNet && (await window.PosNet.check('sync to this device')) === 'offline') throw new Error('This device is offline. Nothing was changed; try again when it is online.');
                say(0, 'run', 'Checking this device may sync…');
                var dp = null;
                try { var res = await fetch(typeof apiUrl === 'function' ? apiUrl('/api/device-pair') : '/api/device-pair'); dp = await res.json(); } catch (e) { dp = null; }
                if (dp && dp.mode === 'paired' && !(dp.me && dp.me.paired)) {
                    say(0, 'bad', 'This shop only syncs with paired devices, and this one is not paired yet.');
                    if (typeof window.showDevicePairScreen === 'function') window.showDevicePairScreen();
                    return { ok: false, error: 'Pair this device first (shop password or a pairing code), then tap Sync to this device again.' };
                }
                say(0, 'ok', dp ? 'This device may sync.' : 'Could not check pairing — continuing.');
                say(1, 'run', 'Sending this device\'s unsent sales and changes first…');
                var sent = await tries(async function () {
                    if (typeof flushPendingPush === 'function') return await flushPendingPush();
                    if (typeof doPush === 'function') { await doPush(); return !window.__pushFailed; }
                    if (typeof pushNow === 'function') return await pushNow();
                    return true;
                }, 3);
                if (!sent) throw new Error('The server did not accept this device\'s unsent changes (they are kept here). It tries again by itself.');
                say(1, 'ok', 'Everything on this device is on the server.');
                say(2, 'run', 'Fetching the shop from the server…');
                try { localStorage.setItem('pos_last_synced_at', '0'); } catch (e) { /* full pull anyway */ }
                await tries(async function () {
                    window.__pullInFlight = false;
                    if (typeof pullStateOnce === 'function') await pullStateOnce();
                    else if (typeof pullFromServerOnce === 'function') await pullFromServerOnce();
                    else if (typeof pullState === 'function') await pullState();
                    var dot = document.getElementById('sync-status');
                    return !(dot && (dot.dataset.state === 'error' || dot.dataset.state === 'offline'));
                }, 3);
                say(2, 'ok', 'Fetched.');
                say(3, 'run', 'Fetching older history…');
                if (window.__lastHotFrom && typeof hydrateOlderHistory === 'function') {
                    try { localStorage.removeItem('pos_hydrated_v1'); localStorage.removeItem('aqua_hydrated_v1'); } catch (e) { /* optional */ }
                    try { await hydrateOlderHistory(window.__lastHotFrom); } catch (e) { /* fetched again next session */ }
                }
                say(3, 'ok', 'Done.');
                say(4, 'run', 'Checking today\'s sales with the server…');
                var chk = null;
                try { var b = bizDayBounds(bizDay(Date.now())); chk = await serverDayCheck(b.from, b.to, siteParam()); } catch (e) { chk = null; }
                var after = (arrOf('salesLog') || []).length;
                var summary = (after - before > 0 ? (after - before) + ' sale' + (after - before === 1 ? '' : 's') + ' received. ' : 'No sales were missing. ')
                    + (chk ? (chk.ok ? 'Today matches the server (' + chk.srv.count + ' sale' + (chk.srv.count === 1 ? '' : 's') + ').' : 'Today: ' + chk.missingHere.length + ' on the server not here, ' + chk.notOnServer.length + ' here not on the server yet.') : '');
                say(4, chk && !chk.ok ? 'warn' : 'ok', summary);
                auditAppend({ at: Date.now(), by: (typeof activeServerName === 'function' ? activeServerName() : '') || 'Device', what: 'Synced to this device — ' + summary, refs: [], device: deviceId() });
                try { if (typeof renderAllViews === 'function') renderAllViews(); else if (typeof renderDailySales === 'function') renderDailySales(); } catch (e) { /* cosmetic */ }
                autoRetries = 0;
                return { ok: true, summary: summary };
            } catch (e) {
                if (autoRetries < 5) { autoRetries++; setTimeout(function () { if (!syncing) window.syncToThisDevice(); }, 30000); }   // tried again by itself (up to 5 times)
                return { ok: false, error: (e && e.message) || String(e) };
            } finally { syncing = false; }
        };

        seed();                                              // now: the app has loaded its lists; anything saved from here on is new
        try { repairRecords(); } catch (e) { /* never block the start */ }   // before the app first draws (a broken record used to stop it)
        function boot() {
            wrapRender();
            wrapProfits();
            clockBanner();
            start();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
