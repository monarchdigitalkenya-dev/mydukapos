<!-- SALES JOURNAL (zip 127) ------------------------------------------------------------------------------------------------------
         A completed sale must never disappear. Found in the code (see CHANGES_ZIP_127.md):
           * The sales list lives in localStorage. When the device's storage was FULL (photos, long history) the save of a new sale
             failed silently: the sale existed only in memory, the receipt printed, and after the app was closed (offline, or before
             it reached the server) the sale was gone. Reproduced in tests/sales-journal.test.mjs.
           * A crash in the middle of saving a big list could make the whole list unreadable at the next start.
         So every completed sale (and every stock movement, return and expense) is ALSO written, the moment it is saved, to this
         device's journal: the browser's IndexedDB, a separate and much larger store, written with "strict" durability. The journal:
           * restores any sale this device completed that is missing from the sales list (after a restart, a failed save, a bad load);
           * knows each sale's sync state — waiting, sending, retrying, on the server — and shows it in Daily Sales;
           * marks a sale "on the server" only when the server has accepted THAT version of it (a push answered OK, or the server's
             copy seen in a pull), so nothing is taken off the list early; entries stay 45 days after that, then are tidied;
           * never restores a sale that was deliberately removed (reset, purge, delete voided — those call salesJournalForget);
           * logs ONE "Synced to the server" audit line per batch of NEW sales that reached the server (retries never add another);
           * dates a new sale by the server's clock when this device's clock is wrong by more than 5 minutes (and says so).
         Also here: Daily Sales sync badges + "Check for missing sales" (compares this device, its journal, the server and the
         printed receipts), the receipt's "saved" line, and "Sync to this device" (Settings ▸ Devices & Security).
         Nothing here is ever deleted because a request failed. Self-contained on purpose (same code in every app). -->

                    + (chk ? (chk.ok ? 'Today matches the server (' + chk.srv.count + ' sale' + (chk.srv.count === 1 ? '' : 's') + ').' : 'Today: ' + chk.missingHere.length + ' on the server not here, ' + chk.notOnServer.length + ' here not on the server yet.') : '');
                say(4, chk && !chk.ok ? 'warn' : 'ok', summary);
                auditAppend({ at: Date.now(), by: (typeof activeServerName === 'function' ? activeServerName() : '') || 'Device', what: 'Synced to this device — ' + summary, refs: [], device: deviceId() });
                try { if (typeof renderAllViews === 'function') renderAllViews(); else if (typeof renderDailySales === 'function') renderDailySales(); } catch (e) { /* cosmetic */ }
                autoRetries = 0;
                return { ok: true, summary: summary };
            } catch (e) {
                if (autoRetries < 5) { autoRetries++; setTimeout(function () { if (!syncing) window.syncToThisDevice(); }, 30000); }   // tried again by itself (up to 5 times)
                return { ok: false, error: (e && e.message) || String(e) };
            } finally { syncing = false; }
        };

        seed();                                              // now: the app has loaded its lists; anything saved from here on is new
        function boot() {
            wrapRender();
            clockBanner();
            start();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
