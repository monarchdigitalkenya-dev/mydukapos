<!-- HMIS RX (zip 359) ------------------------------------------------------------------------------------------------------------
     Prescribing help on the consultation screen, all preloaded (works offline, nothing to configure):
       1. "Suggested medicines" for the diagnosis / ICD-10 code: tap a chip to add it (doctor can still pick any medicine manually).
       2. Safety checker under the medicine rows: allergy match (incl. drug-family cross-matches), drug-drug interactions, duplicate
          therapy, and pregnancy / child cautions. Serious alerts ask for a confirmation before the visit is saved.
     DECISION SUPPORT ONLY — not exhaustive, never replaces clinical judgement, the product label or a pharmacist.
     Suggested doses are common adult starting points: always adjust for age, weight, pregnancy, kidney and liver function.
------------------------------------------------------------------------------------------------------------------------------- -->

    var label = m[0].split('|')[0].replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    if (inDraft(item, label)) return;
    var blank = null;
    try { blank = visitMedicationDraft.find(function (r) { return !r.notStocked && !r.code && !(r.dosage || '').trim(); }); } catch (e) { /* ignore */ }
    var row = blank || { code: '', qty: '1', dosage: '', saleMode: 'piece', notStocked: false, freeName: '', give: 'take-home' };
    if (item) { row.code = item.code; row.notStocked = false; row.saleMode = 'piece'; }
    else { row.notStocked = true; row.code = ''; row.freeName = label; }
    row.dosage = m[1];
    if (!blank) visitMedicationDraft.push(row);
    try { renderVisitMedicationRows(); } catch (e) { /* ignore */ }
    var p = curPatient(); if (p && item && typeof cwAllergyCheck === 'function') { try { cwAllergyCheck(item.code); } catch (e) { /* ignore */ } }
    try { showToast('Added ' + (item ? item.name : label) + ' - set the quantity and check the dose.'); } catch (e) { /* ignore */ }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.hrx-chip'); if (!b) return;
    e.preventDefault(); addSuggestion(+b.getAttribute('data-d'), +b.getAttribute('data-i'));
  });

  var tmr = null;
  function later() { clearTimeout(tmr); tmr = setTimeout(function () { try { renderSuggestions(); renderAlerts(); } catch (e) { /* never break the screen */ } }, 120); }
  ['input', 'change'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var id = e.target && e.target.id;
      if (id === 'visit-diagnosis-input' || id === 'visit-icd10-input' || id === 'visit-soap-a-input') later();
    }, true);
  });

  // after every re-render of the medicine rows, refresh chips + safety panel
  (function wrap() {
    if (typeof renderVisitMedicationRows !== 'function') { setTimeout(wrap, 400); return; }
    var orig = renderVisitMedicationRows;
    renderVisitMedicationRows = function () { var r = orig.apply(this, arguments); try { renderAlerts(); renderSuggestions(); } catch (e) { /* ignore */ } return r; };
    window.renderVisitMedicationRows = renderVisitMedicationRows;
  })();

  // also re-run when a medicine input's value changes (combo pick triggers change on the select -> inline handler re-renders already)
  // and when a visit screen is opened with a restored draft
  setInterval(function () { if (document.getElementById('visit-medication-rows') && document.getElementById('visit-medication-rows').offsetParent) { var sig = (curPatient() || {}).id + '|' + (document.getElementById('visit-diagnosis-input') || {}).value + '|' + (document.getElementById('visit-icd10-input') || {}).value + '|' + (typeof visitMedicationDraft !== 'undefined' ? visitMedicationDraft.length : 0); if (sig !== analyse._sig) { analyse._sig = sig; later(); } } }, 1500);

  // serious alerts need a confirmation before the visit is saved
  (function wrapSave() {
    if (typeof saveVisit !== 'function') { setTimeout(wrapSave, 400); return; }
    var orig = saveVisit;
    saveVisit = function () {
      try {
        var r = analyse(), majors = r.alerts.filter(function (a) { return a.sev === 'major'; });
        if (majors.length) {
          var msg = '⛔ SERIOUS SAFETY ALERT' + (majors.length > 1 ? 'S (' + majors.length + ')' : '') + ' on this prescription:\n\n' + majors.slice(0, 5).map(function (a) { return '• ' + a.t + '\n  ' + a.d; }).join('\n\n') + '\n\nSave the visit anyway? (Cancel = go back and change the medicines)';
          if (!confirm(msg)) return;
          try { logAudit('Prescription safety alert overridden', (curPatient() || {}).name || '', majors.map(function (a) { return a.t; }).join(' | ').slice(0, 300)); } catch (e) { /* ignore */ }
        }
      } catch (e) { /* the checker must never block saving */ }
      return orig.apply(this, arguments);
    };
    window.saveVisit = saveVisit;
  })();

  window.hrx = { analyse: analyse, suggest: dxMatches, findItem: findItem, famsOf: famsOf, DX: DX, IX: IX, G: G, AL: AL, refresh: later };
})();
</script>
