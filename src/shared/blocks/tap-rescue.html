<!-- TAP RESCUE (zip 122) ----------------------------------------------------
         Every button works on the FIRST tap, even when the screen redraws under the finger.
           * A sync arriving (every few seconds, or live), or leaving a price / quantity box, redraws lists and carts. If that
             happens between the finger going down and coming up, the button that was pressed is replaced by an identical new
             one, and the browser drops the tap: the user has to tap again. This notices exactly that case and presses the new
             button once. The original was removed from the page, so it cannot receive the click as well.
           * Nothing is pressed when the finger moved (a scroll), was held (a long press), or something else now sits under it
             (e.g. a password box opened). The item-suggestion list acts on press already and is left alone.
           * `touch-action: manipulation` on controls: no double-tap-to-zoom wait before a tap counts (pinch-zoom still works).
         Self-contained on purpose (same code in every app and the Owner Console). -->
    <style>
        button, a[href], [onclick], [role="button"], .tab-link, summary, label, select, input[type="checkbox"], input[type="radio"] { touch-action: manipulation; }
        /* Settings on a phone (zip 125): one row that was wider than the screen (e.g. the Delivery Zones inputs) made the browser zoom
           the WHOLE page out — header covering part of the screen, everything tiny. Rows now wrap, fields never exceed the screen, and
           anything still too wide scrolls inside its own section instead of widening the page. */
        .settings-section-content.active { overflow-x: auto; }
        /* one look for every field in Settings (number and date boxes used to keep the browser's own dark border) */
        .settings-section-content input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]),
        .settings-section-content select, .settings-section-content textarea { border: 1px solid #ddd; border-radius: 6px; background-color: var(--bg-surface, #fff); color: inherit; }
        /* Narrow phones: slimmer tabs, so the Sales Counter tab stays on the bar next to whatever tab is open (it used to be pushed
           into "More" whenever a second tab was open on a 360 px phone). */
        @media (max-width: 420px) {
            nav.tabs > .tab-link { padding-left: 11px !important; padding-right: 11px !important; }
            .tabs-more-btn { min-width: 76px !important; }
        }
        @media (max-width: 700px) {
            .settings-section-content.active { max-width: 100%; }
            .settings-section-content input, .settings-section-content select, .settings-section-content textarea { max-width: 100%; min-width: 0; box-sizing: border-box; }
            .split-amounts-row, .settings-section-content .vat-inline-row { flex-wrap: wrap; }
            .split-amounts-row > * { flex: 1 1 140px; min-width: 0; }
            .settings-section-content .form-group { min-width: 0; max-width: 100%; }
            .settings-section-content .vat-inline-row select { flex: 1 1 160px; }
            /* 24 section buttons used to fill a whole phone screen: a compact two-column grid instead */
            .settings-subnav { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px !important; }
            .settings-subnav .settings-subtab-btn { font-size: 13px; padding: 9px 8px; text-align: left; margin: 0; white-space: normal; line-height: 1.25; }
            .tab-content input:not([type="checkbox"]):not([type="radio"]), .tab-content select, .tab-content textarea { max-width: 100%; box-sizing: border-box; }
            .tab-content .form-group { max-width: 100%; }
        }
    </style>
    <script>
    (function () {
        'use strict';
        if (window.__tapRescueInit) return;
        window.__tapRescueInit = true;
        var SEL = 'button, a[href], [onclick], [role="button"], .tab-link, summary';
        // Settings on a phone: after tapping a section button, scroll to that section (it opens below the list of buttons). (zip 125)
        document.addEventListener('click', function (e) {
            var b = e.target && e.target.closest && e.target.closest('.settings-subtab-btn');
            if (!b || window.innerWidth > 700) return;
            setTimeout(function () {
                var sec = document.getElementById(b.getAttribute('data-section'));
                if (sec && sec.classList.contains('active') && sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 60);
        });
        var down = null, rescued = null;
        function sig(el) {
            return el.tagName + '|' + (el.id || '') + '|' + (el.getAttribute('onclick') || '') + '|' + (el.getAttribute('data-tab') || '') + '|' + (el.getAttribute('href') || '') + '|' + String(el.textContent || '').trim().slice(0, 80);
        }
        function control(t) {
            var el = t && t.closest ? t.closest(SEL) : null;
            if (!el || el.closest('#item-suggest-box')) return null;
            return el;
        }
        document.addEventListener('pointerdown', function (e) {
            if (e.button || e.isPrimary === false) { down = null; return; }
            var el = control(e.target);
            down = el ? { el: el, sig: sig(el), x: e.clientX, y: e.clientY, t: Date.now(), hit: false } : null;
        }, true);
        document.addEventListener('click', function (e) {
            if (rescued && Date.now() - rescued.t < 700 && rescued.el.contains(e.target)) {   // a late click on the button already pressed for it
                e.preventDefault(); e.stopImmediatePropagation(); rescued = null; return;
            }
            if (!down) return;
            var c = control(e.target);
            if (down.el.contains(e.target) || (c && sig(c) === down.sig)) down.hit = true;
        }, true);
        document.addEventListener('pointerup', function (e) {
            var d = down;
            if (!d) return;
            if (Math.abs(e.clientX - d.x) > 12 || Math.abs(e.clientY - d.y) > 12 || Date.now() - d.t > 900) { down = null; return; }
            var x = e.clientX, y = e.clientY;
            setTimeout(function () {
                if (down === d) down = null;
                if (d.hit || d.el.isConnected) return;                     // the tap landed, or the button was never replaced
                var el = control(document.elementFromPoint(x, y));
                if (!el || el.disabled || sig(el) !== d.sig) return;       // something else is there now: do nothing
                el.click();
                rescued = { el: el, t: Date.now() };
            }, 60);
        }, true);
    })();
    </script>

<!-- INSTANT FEEDBACK (zip 207) -------------------------------------------
         A button answers the finger at once, even when the real work (the server, the printer) takes a moment.
           * pressed look on touch-down (no waiting for the click), so a tap never feels dead;
           * a button whose action is still working after ~0.2 s (a request on its way, a receipt being printed) shows a small spinner
             and ignores a second tap on itself until it is done, so nobody taps three times and gets three results;
           * never changes the button's text, never blocks anything else on the page, gives up after 25 s.
         Self-contained on purpose (same code in every app and the Owner Console). -->
<style>
    button:not(:disabled):active, .btn-main:not(:disabled):active, .tab-link:active, [role="button"]:active { transform: scale(.97); filter: brightness(.95); }
    button, .btn-main, .tab-link { transition: transform .08s ease, filter .12s ease, box-shadow .15s ease; }
    .mk-busy { position: relative; pointer-events: none; cursor: progress; opacity: .88; }
    .mk-busy::after { content: ""; position: absolute; right: 8px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: mk-spin .6s linear infinite; }
    @keyframes mk-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .mk-busy::after { animation-duration: 1.6s; } button:not(:disabled):active { transform: none; } }
</style>
<script>
(function () {
    try {
        if (window.__mkFeedback) return; window.__mkFeedback = true;
        var seq = 0, pending = {}, origFetch = window.fetch;
        if (typeof origFetch === 'function') {
            window.fetch = function (input) {
                var url = ''; try { url = String(typeof input === 'string' ? input : (input && input.url) || ''); } catch (e) { /* none */ }
                var background = /\/api\/(health|pos-sync|print-relay|messages|license|session|ping)|\/__/.test(url);   // the app's own chatter never counts as "the button is working"
                var id = background ? 0 : ++seq;
                if (id) pending[id] = 1;
                var done = function () { if (id) delete pending[id]; };
                var p; try { p = origFetch.apply(this, arguments); } catch (e) { done(); throw e; }
                try { p.then(done, done); } catch (e) { done(); }
                return p;
            };
        }
        function since(n) { for (var k in pending) if (Number(k) > n) return true; return false; }
        document.addEventListener('click', function (e) {
            var b = e.target && e.target.closest && e.target.closest('button, .btn-main, [role="button"]');
            if (!b || b.disabled || b.hasAttribute('data-nobusy') || b.type === 'file') return;
            if (b.closest('.kb-row, #pos-keyboard, [data-nobusy]')) return;
            var start = seq;
            setTimeout(function () {
                if (!b.isConnected || b.classList.contains('mk-busy')) return;
                var working = function () { return since(start) || window.__receiptPrinting === true; };
                if (!working()) return;
                b.classList.add('mk-busy');
                var t0 = Date.now(), iv = setInterval(function () {
                    if (!b.isConnected || !working() || Date.now() - t0 > 25000) { clearInterval(iv); b.classList.remove('mk-busy'); }
                }, 120);
            }, 200);
        }, true);
    } catch (e) { /* cosmetic only */ }
})();
</script>
<!-- POPUP FRONT (zip 356): the pop-up opened LAST is always in front.
     Pop-ups are plain fixed full-screen boxes with hand-picked z-index values. When one is opened from inside another (Reset password from a
     client's details in the Owner Console, a confirm or picker opened from a patient's page...) and both have the same (or a lower) z-index, the
     new one opened BEHIND the one already showing: it looked like the button did nothing. Now, when a full-screen box becomes visible, the
     topmost box at the centre of the screen is checked; if another box covers the new one, the new one is lifted just above it. Sign-in and
     lock screens are never covered by a pop-up. Nothing else changes (toasts and small menus keep their own order). -->
<script>
(function () {
    'use strict';
    if (window.__popFrontOn) return; window.__popFrontOn = true;
    var NEVER_COVER = /^(login-screen|registration-screen|boot-splash|app-lock-screen|lock-screen|pin-lock|license-lock|device-lock)$/;
    function big(el) {
        if (!el || el.nodeType !== 1 || el === document.body || el === document.documentElement) return false;
        var cs; try { cs = getComputedStyle(el); } catch (e) { return false; }
        if (cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden' || cs.pointerEvents === 'none' || Number(cs.opacity) === 0) return false;
        var r = el.getBoundingClientRect();
        return r.width >= innerWidth * 0.6 && r.height >= innerHeight * 0.6;
    }
    function rootOf(el) { while (el && el !== document.body) { if (big(el)) return el; el = el.parentElement; } return null; }
    function zOf(el) { var z = parseInt(getComputedStyle(el).zIndex, 10); return isFinite(z) ? z : 0; }
    var pending = new Set(), raf = 0, shown = new WeakSet();
    // the app's own page (its shell, a tab, the sidebar) is never "a pop-up": only boxes that were hidden and have just appeared are lifted
    function isShell(el) {
        if (/^(app|main|root|wrapper|page|layout|content|snav)|container$/i.test(el.id || '')) return true;
        try { return !!el.querySelector('.tab-content, nav, header, #sales-tab'); } catch (e) { return true; }
    }
    function lift(el) {
        if (!big(el)) { shown.delete(el); return; }
        if (shown.has(el)) return;                    // already showing: a style change on an open box is not "opening" it
        shown.add(el);
        if (NEVER_COVER.test(el.id || '') || isShell(el)) return;
        var cx = Math.round(innerWidth / 2), cy = Math.round(innerHeight / 2), stack;
        try { stack = document.elementsFromPoint(cx, cy); } catch (e) { return; }
        if (!stack || !stack.length || el.contains(stack[0])) return;          // already in front
        var cover = rootOf(stack[0]);
        if (!cover || cover === el || el.contains(cover) || cover.contains(el)) return;
        if (NEVER_COVER.test(cover.id || '')) return;                          // a sign-in / lock screen stays on top
        var z = Math.max(zOf(cover), zOf(el)) + 1;
        el.style.setProperty('z-index', String(z), 'important');
    }
    function flush() { raf = 0; var list = Array.from(pending); pending.clear(); list.forEach(function (el) { try { lift(el); } catch (e) { /* cosmetic */ } }); }
    function queue(el) { if (!el || el.nodeType !== 1) return; pending.add(el); if (!raf) raf = (typeof requestAnimationFrame === 'function' ? requestAnimationFrame : function (f) { return setTimeout(f, 16); })(flush); }
    function start() {
        // whatever is already on screen when the page starts is not "just opened"
        try { Array.prototype.forEach.call(document.body.children, function (c) { if (big(c)) shown.add(c); Array.prototype.forEach.call(c.children || [], function (g) { if (big(g)) shown.add(g); }); }); } catch (e) { /* none */ }
        try {
            // cheap filters first (no style lookups): a box is opened by setting its display, toggling an "open"-type class, or appending it to <body>
            var OPENISH = /(^|[\s_-])(on|open|opened|show|shown|active|visible|modal|overlay|popup|dialog|ov)([\s_-]|$)/i;
            new MutationObserver(function (muts) {
                if (typeof document.elementsFromPoint !== 'function') return;          // nothing to measure with (e.g. a test window): leave the order alone
                try { for (var i = 0; i < muts.length; i++) {
                    var m = muts[i], t = m.target;
                    if (m.type === 'attributes') {
                        if (!t || t.nodeType !== 1) continue;
                        if (m.attributeName === 'style') { var dsp = t.style && t.style.display; if (dsp === 'none') { shown.delete(t); continue; } if (!dsp && !(t.style && t.style.visibility)) continue; }
                        else if (m.attributeName === 'class' && !OPENISH.test(String(t.className && t.className.baseVal != null ? t.className.baseVal : t.className))) { shown.delete(t); continue; }
                        queue(t);
                    } else if (t === document.body) for (var j = 0; j < m.addedNodes.length; j++) queue(m.addedNodes[j]);
                } } catch (e) { /* cosmetic only: never disturb the page */ }
            }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['style', 'class', 'open'] });
        } catch (e) { /* old browser: pop-ups keep their own order */ }
    }
    if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
