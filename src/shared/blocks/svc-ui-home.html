function svcOpenTypeChooser(opts) {

    '<div class="svu-pbody"><div class="svu-types-mount"></div></div><div class="svu-pfoot"><button type="button" class="svu-btn" data-svc-act="close">Cancel</button><button type="button" class="svu-btn svu-primary svu-grow" data-svc-act="use"></button></div></div>');
  var mount = rec.el.querySelector('.svu-types-mount'), useBtn = rec.el.querySelector('[data-svc-act="use"]');

}

  return true;
}
