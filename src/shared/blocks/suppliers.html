<!-- SUPPLIERS (zip 321; grew out of zip 319's credit restock) ----------------------------------------------------------------------------
     Supplier management on the records the app already keeps and syncs - no new store, no new sync:
       * PROFILES: the existing `suppliers` list (merged per record), extended with contact, email, address, tax PIN, payment terms, notes,
         active / inactive. A supplier with history is deactivated, never deleted.
       * DOCUMENTS (what is owed): the existing `tradeCredits` list ("I owe them"), one record per event, never edited away:
           supplier_restock  a restock from this supplier (id rc-<restock expense id>): total, invoice no., purchase id, lines, due date
           supplier_opening  a balance brought forward (no stock, no purchase)
           supplier_return   goods returned (a credit; linked to the restock; the stock comes off)
           supplier_adjust   a correction up (sign +1, owed more) or down (sign -1, owed less), with a reason
       * PAYMENTS: a payment is ONE expense record (category Restock, supplierPay, allocations [{ id, amount }] to the documents it pays), and
         a copy on each document it pays (t.payments). The balance counts each payment once by id from either place, so a payment never
         counts twice and is never lost when two tills pay at once. A restock paid now (in full or part) is the restock's own expense, tagged
         as its payment: nothing is recorded twice.
       * BALANCES are always worked out from the records (documents - payments - returns - corrections). Nothing stores a balance to edit.
         Each document's outstanding = its amount - what was allocated to it - returns against it; a supplier's balance can go below 0 only
         through returns on paid stock (a credit with that supplier). A payment can never be more than what is outstanding.
       * MONEY: a credit restock moves stock and the payable only; cash moves when (and only when) a payment is recorded. The books (accounts
         block) post restock = Stock / Accounts payable, payment = Accounts payable / Cash-M-Pesa-Bank, return = Accounts payable / Stock,
         opening = Opening balance equity / Accounts payable. Profit sees stock only through cost of goods sold.
       * IDs are fixed per action (the restock's own id; a key made when a form opens), so a double tap, a retry or a second sync never adds
         a second document, payment or stock movement. -->

<script>
(function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var r2 = function (n) { return Math.round((Number(n) || 0) * 100) / 100; };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var kes = function (n) { var v = r2(n); return (v < 0 ? '-' : '') + 'KES ' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var toast = function (m, bad) { try { showToast(m, bad); } catch (e) { /* no toast */ } };
    var who = function () { try { return activeServerName(); } catch (e) { return ''; } };
    var newId = function () { try { return genSaleId(); } catch (e) { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); } };
    var newKey = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
    var SUP = function () { return typeof suppliers !== 'undefined' && Array.isArray(suppliers) ? suppliers : []; };
    var TC = function () { return typeof tradeCredits !== 'undefined' && Array.isArray(tradeCredits) ? tradeCredits : null; };
    var EX = function () { return typeof expenses !== 'undefined' && Array.isArray(expenses) ? expenses : []; };
    var dayKey = function (ts) { var d = new Date(ts); if (isNaN(d)) return ''; return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    var fmtDate = function (ts) { var d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-GB'); };
    var today = function () { return dayKey(Date.now()); };
    var METHODS = [['cash', 'Cash'], ['mpesa', 'M-Pesa'], ['bank', 'Bank'], ['other', 'Other']];
    var methodName = function (m) { var f = METHODS.filter(function (x) { return x[0] === m; })[0]; return f ? f[1] : (m || 'Cash'); };
    var TERMS = [['', 'No terms'], ['cod', 'Cash on delivery'], ['7', '7 days'], ['14', '14 days'], ['30', '30 days'], ['60', '60 days']];
    var termsName = function (t) { var f = TERMS.filter(function (x) { return x[0] === String(t || ''); })[0]; return f ? f[1] : (/^\d+$/.test(String(t)) ? t + ' days' : ''); };

    /* ======================= the ledger (pure reads of the records) ======================= */
    var KINDS = { supplier_restock: 1, supplier_opening: 1, supplier_return: 1, supplier_adjust: 1 };
    function isDoc(t) { return !!t && t.direction === 'i_owe' && KINDS[t.kind] === 1 && !t.voided; }
    function isPayable(t) { return t.kind === 'supplier_restock' || t.kind === 'supplier_opening' || (t.kind === 'supplier_adjust' && Number(t.sign) > 0); }
    function isCredit(t) { return t.kind === 'supplier_return' || (t.kind === 'supplier_adjust' && Number(t.sign) < 0); }
    function docs(supId) { return (TC() || []).filter(function (t) { return isDoc(t) && (supId == null || t.supplierId === supId); }); }
    function docById(id) { return (TC() || []).find(function (t) { return t && t.id === id; }) || null; }
    function supById(id) { return SUP().find(function (s) { return s && s.id === id; }) || null; }
    // every payment once by id: the expense record (authoritative) or, until it arrives, the copies on the documents
    function allPayments(supId) {
        var map = {}, voided = {};
        EX().forEach(function (x) { if (x && x.voided && x.id) voided[x.id] = 1; });
        EX().forEach(function (x) {
            if (!x || x.voided || !x.id || !(x.supplierPay || x.supplierDebtId)) return;
            var al = Array.isArray(x.allocations) && x.allocations.length ? x.allocations.map(function (a) { return { id: a.id, amount: r2(a.amount) }; }) : [{ id: x.supplierDebtId, amount: r2(x.amount) }];
            var d0 = docById(al[0].id);
            map[x.id] = { id: x.id, at: x.timestamp, amount: r2(x.amount), method: x.paymentMethod || 'cash', reference: x.reference || '', notes: x.notes || '', by: x.by || '', supplierId: x.supplierId || (d0 && d0.supplierId) || '', allocations: al, fromExpense: true };
        });
        (TC() || []).forEach(function (t) {
            if (!isDoc(t) || !Array.isArray(t.payments)) return;
            t.payments.forEach(function (p) {
                if (!p || !p.id || voided[p.id] || p.voided) return;
                var m = map[p.id];
                if (m && m.fromExpense) return;
                if (!m) m = map[p.id] = { id: p.id, at: p.at, amount: 0, method: p.method || 'cash', reference: p.reference || '', notes: '', by: p.by || '', supplierId: t.supplierId, allocations: [] };
                if (!m.allocations.some(function (a) { return a.id === t.id; })) { m.allocations.push({ id: t.id, amount: r2(p.amount) }); m.amount = r2(m.amount + r2(p.amount)); }
            });
        });
        return Object.keys(map).map(function (k) { return map[k]; }).filter(function (p) { return supId == null || p.supplierId === supId; })
            .sort(function (a, b) { return String(a.at).localeCompare(String(b.at)); });
    }
    function allocatedTo(docId, pays) { var s = 0; (pays || allPayments()).forEach(function (p) { p.allocations.forEach(function (a) { if (a.id === docId) s += r2(a.amount); }); }); return r2(s); }
    function returnsAgainst(docId) { return r2(docs().filter(function (t) { return t.kind === 'supplier_return' && t.appliesTo === docId; }).reduce(function (s, t) { return s + r2(t.amount); }, 0)); }
    function outstanding(t, pays) { if (!isPayable(t)) return 0; return Math.max(0, r2(r2(t.amount) - allocatedTo(t.id, pays) - returnsAgainst(t.id))); }
    // what was paid with the restock itself (its own expense; a zip 319 restock's id is rc-<that expense id>)
    function paidAtPurchase(t, pays) { var rid = t.restockExpenseId || (String(t.id).indexOf('rc-') === 0 ? String(t.id).slice(3) : null), s = 0; if (!rid) return 0; (pays || allPayments()).forEach(function (p) { if (p.id === rid) p.allocations.forEach(function (a) { if (a.id === t.id) s += a.amount; }); }); return r2(s); }
    function statusOf(t, pays) {
        var o = outstanding(t, pays);
        if (o <= 0.005) return { key: 'paid', label: 'Paid', cls: 'green' };
        var overdue = t.dueDate && t.dueDate < today();
        var part = o < r2(t.amount) - 0.005;
        return { key: overdue ? 'overdue' : (part ? 'part' : 'unpaid'), label: (overdue ? 'Overdue' : (part ? 'Part paid' : 'Unpaid')), cls: overdue ? 'red' : 'amber' };
    }
    // the supplier's balance: what is owed (+) minus what was paid / returned / corrected down. Below 0 = a credit with the supplier.
    function balanceOf(supId, pays) {
        pays = pays || allPayments(supId);
        var d = docs(supId), owed = 0;
        d.forEach(function (t) { if (isPayable(t)) owed += r2(t.amount); else if (isCredit(t)) owed -= r2(t.amount); });
        pays.forEach(function (p) { if (p.supplierId === supId) owed -= r2(p.amount); });
        return r2(owed);
    }
    // the statement: one line per event, oldest first, with the running balance (opening balance before `from` when a period is given)
    function ledger(supId, from, to) {
        var pays = allPayments(supId), rows = [];
        docs(supId).forEach(function (t) {
            var label = t.kind === 'supplier_restock' ? 'Purchase (restock)' : t.kind === 'supplier_opening' ? 'Opening balance' : t.kind === 'supplier_return' ? 'Goods returned' : (Number(t.sign) > 0 ? 'Correction (owed more)' : 'Correction (owed less)');
            var amt = r2(t.amount);
            rows.push({ at: t.timestamp, type: label, ref: t.reference || t.creditNote || '', note: t.kind === 'supplier_return' ? (t.reason || '') : (t.kind === 'supplier_adjust' ? (t.reason || '') : (t.notes || '')), owed: isPayable(t) ? amt : 0, paid: isCredit(t) ? amt : 0, id: t.id });
        });
        pays.forEach(function (p) { rows.push({ at: p.at, type: 'Payment (' + methodName(p.method) + ')', ref: p.reference || '', note: p.allocations.map(function (a) { var d = docById(a.id); return (d && (d.reference || d.kind.replace('supplier_', ''))) + ' ' + kes(a.amount); }).join(', '), owed: 0, paid: r2(p.amount), id: p.id }); });
        rows.sort(function (a, b) { var c = String(a.at).localeCompare(String(b.at)); return c !== 0 ? c : (b.owed - a.owed); });
        var bal = 0, opening = 0, out = [];
        rows.forEach(function (r) {
            bal = r2(bal + r.owed - r.paid); r.balance = bal;
            var k = dayKey(r.at);
            if (from && k < from) { opening = bal; return; }
            if (to && k > to) return;
            out.push(r);
        });
        var closing = out.length ? out[out.length - 1].balance : opening;
        return { opening: opening, rows: out, closing: closing, owed: r2(out.reduce(function (s, r) { return s + r.owed; }, 0)), paid: r2(out.reduce(function (s, r) { return s + r.paid; }, 0)) };
    }

    /* ======================= writing (each action once) ======================= */
    function saveAll(what) {
        try { if (what.indexOf('s') >= 0) safeSetItem('pos_suppliers', JSON.stringify(suppliers)); } catch (e) { /* kept in memory */ }
        try { if (what.indexOf('t') >= 0) safeSetItem('pos_trade_credits', JSON.stringify(tradeCredits)); } catch (e) { /* kept in memory */ }
        try { if (what.indexOf('x') >= 0) { if (typeof saveExpenses === 'function') saveExpenses(); else safeSetItem('pos_expenses', JSON.stringify(expenses)); } } catch (e) { /* kept in memory */ }
        try { queuePush(); } catch (e) { /* sent with the next change */ }
    }
    function dueFrom(sup, ts) {
        var t = sup && sup.terms; if (!t) return null;
        if (t === 'cod') return dayKey(ts);
        var n = parseInt(t, 10); if (!(n > 0)) return null;
        return dayKey(new Date(new Date(ts).getTime() + n * 86400000));
    }
    var norm = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); };
    var phoneKey = function (p) { var d = String(p || '').replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : ''; };
    function similar(p, exceptId) {
        var n = norm(p.name), ph = phoneKey(p.phone);
        return SUP().filter(function (s) { if (!s || s.id === exceptId) return false; var sn = norm(s.name); return (n && sn && (sn === n || (n.length >= 4 && (sn.indexOf(n) >= 0 || n.indexOf(sn) >= 0)))) || (ph && phoneKey(s.phone) === ph); });
    }
    // -> { ok, supplier } | { ok:false, error }
    function saveSupplierProfile(p, id) {
        var name = String(p.name || '').trim();
        if (!name) return { ok: false, error: 'Enter the supplier’s name.' };
        if (p.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(p.email).trim())) return { ok: false, error: 'That email address does not look right.' };
        var fields = { name: name, contact: String(p.contact || '').trim(), phone: String(p.phone || '').trim(), email: String(p.email || '').trim(), address: String(p.address || '').trim(), taxId: String(p.taxId || '').trim(), terms: String(p.terms || ''), notes: String(p.notes || '').trim(), active: p.active !== false };
        var s = id ? supById(id) : null, now = Date.now();
        if (s) { Object.keys(fields).forEach(function (k) { s[k] = fields[k]; }); s.updatedAt = now; }
        else { s = Object.assign({ id: 'sup-' + newId(), createdAt: now, updatedAt: now }, fields); suppliers.push(s); }
        saveAll('s');
        try { if (typeof renderSupplierDropdowns === 'function') renderSupplierDropdowns(); } catch (e) { /* not built */ }
        return { ok: true, supplier: s };
    }
    // oldest outstanding first (by date, then opening balances before purchases of the same day)
    function autoAllocate(supId, amount) {
        var pays = allPayments(), left = r2(amount), out = [];
        docs(supId).filter(isPayable).sort(function (a, b) { var c = String(a.timestamp).localeCompare(String(b.timestamp)); return c || (a.kind === 'supplier_opening' ? -1 : 1); })
            .forEach(function (t) { if (left <= 0.005) return; var o = outstanding(t, pays); if (o <= 0.005) return; var a = r2(Math.min(o, left)); out.push({ id: t.id, amount: a }); left = r2(left - a); });
        return { allocations: out, unallocated: left };
    }
    function settleIfPaid(ids) { var pays = allPayments(), now = new Date().toISOString(); ids.forEach(function (id) { var t = docById(id); if (t && isPayable(t) && t.status !== 'settled' && outstanding(t, pays) <= 0.005) { t.status = 'settled'; t.settledAt = now; t.updatedAt = Date.now(); } }); }
    // p: { supplierId, amount, date, method, reference, notes, allocations?, key } -> { ok, payment } | { ok:false, error }
    function recordPayment(p) {
        var sup = supById(p.supplierId); if (!sup || !TC()) return { ok: false, error: 'Choose a supplier.' };
        var id = 'sp-' + (p.key || newKey());
        var dup = EX().find(function (x) { return x && x.id === id; }); if (dup) return { ok: true, payment: dup, repeated: true };
        var amount = r2(p.amount); if (!(amount > 0)) return { ok: false, error: 'Enter the amount paid.' };
        var pays = allPayments(), alloc;
        if (Array.isArray(p.allocations) && p.allocations.length) {
            alloc = p.allocations.map(function (a) { return { id: a.id, amount: r2(a.amount) }; }).filter(function (a) { return a.amount > 0; });
            for (var i = 0; i < alloc.length; i++) {
                var d = docById(alloc[i].id);
                if (!d || !isDoc(d) || !isPayable(d) || d.supplierId !== sup.id) return { ok: false, error: 'One of the chosen invoices is not this supplier’s.' };
                if (alloc[i].amount > outstanding(d, pays) + 0.005) return { ok: false, error: (d.reference || 'An invoice') + ' has only ' + kes(outstanding(d, pays)) + ' outstanding.' };
            }
            if (Math.abs(r2(alloc.reduce(function (s, a) { return s + a.amount; }, 0)) - amount) > 0.005) return { ok: false, error: 'The amounts given to the invoices must add up to the payment (' + kes(amount) + ').' };
        } else {
            var aa = autoAllocate(sup.id, amount);
            if (aa.unallocated > 0.005) return { ok: false, error: 'That is more than what is owed to ' + sup.name + ' (' + kes(r2(amount - aa.unallocated)) + '). Advances to suppliers are not recorded.' };
            alloc = aa.allocations;
        }
        if (!alloc.length) return { ok: false, error: 'Nothing is outstanding with ' + sup.name + '.' };
        var ts = p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date) && p.date !== today() ? new Date(p.date + 'T12:00:00').toISOString() : new Date().toISOString();
        var method = METHODS.some(function (m) { return m[0] === p.method; }) ? p.method : 'cash';
        var x = { id: id, timestamp: ts, category: 'Restock', description: 'Paid ' + sup.name + ' (' + alloc.map(function (a) { var d = docById(a.id); return d.reference || (d.kind === 'supplier_opening' ? 'opening balance' : 'restock'); }).join(', ') + ')',
            amount: amount, paymentMethod: method, reference: String(p.reference || '').trim(), notes: String(p.notes || '').trim(), supplierPay: true, supplierId: sup.id, allocations: alloc, supplierDebtId: alloc[0].id, by: who(), auto: true };
        expenses.push(x);
        alloc.forEach(function (a) { var d = docById(a.id); d.payments = (Array.isArray(d.payments) ? d.payments : []).concat([{ id: id, at: ts, amount: a.amount, method: method, reference: x.reference, by: x.by }]); d.updatedAt = Date.now(); });
        settleIfPaid(alloc.map(function (a) { return a.id; }));
        saveAll('xt');
        return { ok: true, payment: x };
    }
    function pushDoc(d) { if ((TC() || []).some(function (t) { return t && t.id === d.id; })) return false; tradeCredits.push(d); return true; }
    function recordOpening(p) {
        var sup = supById(p.supplierId); if (!sup || !TC()) return { ok: false, error: 'Choose a supplier.' };
        var amount = r2(p.amount); if (!(amount > 0)) return { ok: false, error: 'Enter the amount already owed.' };
        if (!p.date || !/^\d{4}-\d{2}-\d{2}$/.test(p.date)) return { ok: false, error: 'Choose the date it was owed from.' };
        var id = 'so-' + (p.key || newKey());
        pushDoc({ id: id, kind: 'supplier_opening', direction: 'i_owe', supplierId: sup.id, partyName: sup.name, amount: amount, timestamp: new Date(p.date + 'T00:00:01').toISOString(), reference: 'OPENING BALANCE', description: 'Opening balance brought forward', notes: String(p.notes || '').trim(), status: 'open', settledAt: null, payments: [], linkedSaleId: null, by: who(), updatedAt: Date.now() });
        saveAll('t');
        return { ok: true, id: id };
    }
    function recordAdjust(p) {
        var sup = supById(p.supplierId); if (!sup || !TC()) return { ok: false, error: 'Choose a supplier.' };
        var amount = r2(p.amount); if (!(amount > 0)) return { ok: false, error: 'Enter the amount of the correction.' };

        var sec = $('sup-debts');
        if (!sec) {
            var old = $('crs-debts'); if (old) old.remove();
            var panel = tab.querySelector('.panel') || tab;
            sec = document.createElement('div'); sec.id = 'sup-debts'; sec.style.marginTop = '22px';
            panel.appendChild(sec);
        }
        var pays = allPayments(), q = String(($('debts-search-input') || {}).value || '').trim().toLowerCase(), showSettled = !!($('debts-show-settled-toggle') || {}).checked;
        var rows = SUP().map(function (s) { return { s: s, b: balanceOf(s.id, pays), open: docs(s.id).filter(function (t) { return isPayable(t) && outstanding(t, pays) > 0.005; }).length }; })
            .filter(function (x) { return (showSettled ? docs(x.s.id).length > 0 : x.b > 0.005) && (!q || [x.s.name, x.s.phone].join(' ').toLowerCase().indexOf(q) >= 0); })
            .sort(function (a, b) { return b.b - a.b; });
        var total = r2(SUP().reduce(function (a, s) { var b = balanceOf(s.id, pays); return a + (b > 0 ? b : 0); }, 0));
        sec.innerHTML = '<h3>🚚 Owed to suppliers <span style="font-weight:normal;font-size:14px;color:var(--text-muted,#7f8c8d)">(money this shop owes - kept apart from what customers owe above)</span></h3>' +
            '<div class="sales-summary-bar"><div class="summary-card"><div class="label">Suppliers owed</div><div class="value" id="sup-debts-count">' + rows.filter(function (x) { return x.b > 0.005; }).length + '</div></div><div class="summary-card"><div class="label">Total owed to suppliers</div><div class="value" id="sup-debts-total">' + kes(total) + '</div></div></div>' +
            '<div class="table-scroll"><table id="sup-debts-table"><thead><tr><th>Supplier</th><th>Phone</th><th class="sup-num">Unpaid invoices</th><th class="sup-num">Owed</th><th></th></tr></thead><tbody>' +
            (rows.length ? rows.map(function (x) { return '<tr><td>' + esc(x.s.name) + '</td><td>' + esc(x.s.phone || '—') + '</td><td class="sup-num">' + x.open + '</td><td class="sup-num">' + kes(x.b) + '</td><td><div class="sup-rowacts">' + (x.b > 0.005 ? '<button type="button" class="btn-main" data-sdp="' + esc(x.s.id) + '">💵 Pay</button> ' : '') + '<button type="button" class="settings-small-btn" data-sdo="' + esc(x.s.id) + '">Open</button></div></td></tr>'; }).join('') : '<tr><td colspan="5" class="empty-state">Nothing owed to suppliers. A restock "On credit" or "Part paid" shows here.</td></tr>') + '</tbody></table></div>';
        Array.prototype.forEach.call(sec.querySelectorAll('[data-sdp]'), function (b) { b.onclick = function () { openPayment(b.getAttribute('data-sdp')); }; });
        Array.prototype.forEach.call(sec.querySelectorAll('[data-sdo]'), function (b) { b.onclick = function () { var t = document.querySelector('.tab-link[data-tab="suppliers-tab"]'); if (t) t.click(); window.supOpenSupplier(b.getAttribute('data-sdo')); }; });
    }
    window.renderSupplierDebts = paintDebtsSection;
    function installOthers() {
        if (typeof renderDebtsTab === 'function' && !renderDebtsTab.__sup) {
            var od = renderDebtsTab, wd = function () { var r = od.apply(this, arguments); try { paintDebtsSection(); } catch (e) { console.warn('supplier debts', e); } return r; };
            wd.__sup = true; window.renderDebtsTab = renderDebtsTab = wd;
        }
        if (typeof renderTradeCreditsTab === 'function' && !renderTradeCreditsTab.__sup) {
            var ot = renderTradeCreditsTab, wt = function () {
                var all = TC(); if (!all) return ot.apply(this, arguments);
                // supplier documents live in the Suppliers tab (with their balances); this list keeps the other trade credits
                tradeCredits = all.filter(function (t) { return !isDoc(t); });
                try { return ot.apply(this, arguments); } finally { tradeCredits = all; try { var tab = $('trade-credits-tab'); if (tab && !$('sup-tc-note')) { var p = document.createElement('p'); p.id = 'sup-tc-note'; p.className = 'sup-note'; p.innerHTML = 'Money owed to suppliers for restocks is in <a href="javascript:void(0)" onclick="(document.querySelector(\'.tab-link[data-tab=&quot;suppliers-tab&quot;]\')||{click:function(){}}).click()">🚚 Suppliers</a>.'; (tab.querySelector('.panel') || tab).insertBefore(p, (tab.querySelector('.panel') || tab).children[1] || null); } } catch (e) { /* cosmetic */ } }
            };
            wt.__sup = true; window.renderTradeCreditsTab = renderTradeCreditsTab = wt;
        }
        if (typeof settleTradeCredit === 'function' && !settleTradeCredit.__sup) {
            var os = settleTradeCredit, ws = function (id) { var t = docById(id); if (isDoc(t)) { if (isPayable(t)) openPayment(t.supplierId, t.id); return; } return os.apply(this, arguments); };
            ws.__sup = true; window.settleTradeCredit = settleTradeCredit = ws;
        }
    }

    installRestock(); installSupplierList(); installOthers();
    if (!installChoice()) document.addEventListener('DOMContentLoaded', function () { installChoice(); });
    setTimeout(function () { installSupplierList(); installOthers(); installChoice(); }, 0);
})();
</script>
