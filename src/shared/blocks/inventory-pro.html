<!-- INVENTORY WORKSPACE, SERIAL UNITS, VARIANTS, IMPORT WIZARD (Shop, zip 292) ---------------------------------------------------------------
     Screens and checkout hooks on top of the tested engine in src/shared/functions.js (serial*, variant*, import*). Synced lists: serialUnits, importBatches
     (functions/api/_merge.js). Nothing here changes how a plain item is sold: only an item ticked "This item has a unique identifier per item" is affected.
       1. Product editor checkbox (kept through an edit - the editor rebuilds the item object, which would otherwise drop the flag).
       2. Receive serial units: scan / type / paste / file, "7 of 10 registered", row-numbered errors, idempotent batch.
       3. Checkout: the cashier must pick the REAL unit(s); the sale marks exactly those units sold. Void / unvoid / return follow the unit.
       4. Units screen: search by identifier, history, return, inspection, damage / repair / write-off, supplier return, identifier correction, conflicts.
       5. Inventory workspace: overview cards, searchable table, item detail, variant generator, stock adjustment, low stock.
       6. Import wizard: upload, type, mapping, preview, confirm, chunked run, results, rejected rows, templates.
     Event delegation only (data-ip-act). Every hook is guarded: a page lacking something does nothing. -->

    function srRemoveGo() {

    function srQtyChange(p, v, value) {

        var cur = Number((v || p).qty) || 0, delta = r3(q - cur); if (delta === 0) return false;
        if (Math.abs(delta - Math.round(delta)) > 1e-9) { toast('This item is counted in whole units (one serial number each).', true); srRefresh(); return true; }

    // ---------------------------------------------------------------- 4. purchases: identifiers BEFORE stock
    // A purchase line for an item that tracks a unique identifier cannot add stock without its identifiers. The arrival screen asks for them (one box per line, the
    // same checks as the receiving screen), keeps them, then runs the arrival again. Stock still goes up exactly once: the unit rows ARE the quantity.
    var POIDS = {};                    // purchase line id -> parsed rows
    function poTarget(item) {
        var vh = (typeof poFindVariant === 'function') ? poFindVariant(item.code, item.name) : null;
        if (vh && tracked(vh.p, vh.v)) return { p: vh.p, v: vh.v };

    function purchaseGate(order, picks) {
        var need = [];

            var t = poTarget(pk.item); if (!t) return;
            var rows = POIDS[pk.item.id];

        root.innerHTML = '<div class="modal-content" style="max-width:560px;width:94%;max-height:calc(90vh / var(--pos-z,1));overflow:auto;padding:16px;border-radius:14px;"><h3 style="margin:0 0 6px">🔢 Identifiers needed before stock goes up</h3>' +
            '<p style="font-size:13px;color:#7f8c8d;margin:0 0 8px">These items track an IMEI / serial number per unit. Enter one per line (two IMEIs on one phone: put both on one line with | between them). The stock is added only when the count matches what arrived.</p>' +
            need.map(function (n, i) { return '<div style="margin:8px 0"><b>' + esc(n.t.p.name + (n.t.v ? ' · ' + n.t.v.name : '')) + '</b> — ' + n.pk.qty + ' unit(s)<textarea data-ip-poids="' + i + '" rows="4" style="width:100%;font-family:monospace;padding:8px;box-sizing:border-box" placeholder="356938035643809"></textarea><div class="ip-err" data-ip-poerr="' + i + '"></div></div>'; }).join('') +
            '<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="ip-btn sec" data-ip-pocancel="1">Cancel</button><button type="button" class="ip-btn" data-ip-posave="1">Save identifiers &amp; receive</button></div></div>';
        document.body.appendChild(root);
