<!-- STOCK TAKE TAB -----------------------------------------------------------
         "📋 Stock Take": count what is really on the shelf, type the counts next to the items, and update the system's
         quantities in one go. Only items you type a count for are touched; every change is recorded as a "Stock take"
         stock adjustment (so it syncs and shows in the stock reports), and the differences are valued at cost.
         Logic: src/shared/functions.js (stockTake*, renderStockTake*). The tab button and access setting are in each app. -->
    <style>
        #stock-take-tab .st-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
        #stock-take-tab .st-tools input[type=text] { flex: 1; min-width: 180px; }
        #stock-take-tab .st-input { width: 92px; padding: 8px 10px; font-size: 16px; margin: 0 4px 4px 0; }
        #stock-take-tab .st-inputs { white-space: nowrap; }
        #stock-take-tab .st-muted { color: #95a5a6; font-size: 12px; }
        #stock-take-tab .st-bad { color: #c0392b; font-weight: 700; }
        #stock-take-tab .st-over { color: #2980b9; font-weight: 700; }
        #stock-take-tab .st-ok { color: #27ae60; font-weight: 700; }
        #stock-take-tab .st-mini { padding: 4px 10px; font-size: 12px; }
        #stock-take-tab .st-hist { margin: 6px 0; }
        #stock-take-tab .st-hist summary { cursor: pointer; font-size: 13px; }
    </style>
    <div id="stock-take-tab" class="tab-content">
        <div class="panel">
            <h3>📋 Stock Take</h3>
            <div id="stock-take-summary"></div>
            <div class="st-tools">
                <input type="text" id="stock-take-search" placeholder="Search items…" oninput="stockTakeState().q = this.value; renderStockTake()">
                <label style="display:flex; align-items:center; gap:6px; font-size:13px; margin:0;"><input type="checkbox" id="stock-take-diff-only" style="width:auto;" onchange="stockTakeState().diffOnly = this.checked; renderStockTake()"> Only differences</label>
                <button type="button" class="settings-small-btn" onclick="stockTakeClear()">Clear counts</button>
                <button type="button" class="btn-main" id="stock-take-apply-btn" style="width:auto; margin:0; padding:10px 20px; background:var(--success,#2ecc71);" onclick="stockTakeApply()">✔ Update stock to my counts</button>
            </div>
            <div class="table-scroll">
                <table id="stock-take-table">
                    <thead><tr><th>Item</th><th>System says</th><th>You counted</th><th>Difference</th><th></th></tr></thead>
                    <tbody><tr><td colspan="5" class="empty-state">Open this tab to load your items.</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="panel">
            <h4 style="margin:0 0 8px;">Recent stock takes</h4>
            <div id="stock-take-history"></div>
            <div style="margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <button type="button" class="settings-small-btn" onclick="stockIntegrityCheck('stock-integrity-result')" title="Sends anything unsent, then checks every figure on this device against the server and the server's figures against their history">🔍 Check stock against the server</button>
            </div>
            <div id="stock-integrity-result" style="margin-top:6px;"></div>
        </div>
    </div>
