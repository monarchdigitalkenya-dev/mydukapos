<style>

.svc-form{display:block;max-width:100%;color:var(--dark,#2C3E50)}
.svc-sec{margin:0 0 14px;border:1px solid var(--border-color,#e1e6ea);border-radius:10px;background:var(--bg-surface,#fff)}

.svc-sec>.svc-grid{padding:4px 14px 14px}
.svc-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

.svc-f{min-width:0}
.svc-lbl{display:block;margin:0 0 4px;font-size:14px;font-weight:600}
.svc-req{color:var(--danger,#E74C3C)}

.svc-ta{min-height:88px;resize:vertical}
.svc-k-plate,.svc-k-imei{text-transform:uppercase;letter-spacing:.04em}
.svc-in:focus-visible,.svc-btn:focus-visible{outline:3px solid var(--accent,#3498DB);outline-offset:1px}

.svc-hint,.svc-help{font-size:13px;opacity:.75;margin-top:3px}
.svc-err{min-height:0;font-size:13px;color:var(--danger,#E74C3C);margin-top:3px}
.svc-err:empty{display:none}
.svc-err-warn{color:var(--tint-warning-text,#7a5b00)}

.svc-btn-primary{background:var(--accent,#3498DB);border-color:var(--accent,#3498DB);color:#fff;font-weight:700}
.svc-check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.svc-check input,.svc-chip input,.svc-seg-o input{width:22px;height:22px;flex:none}
.svc-chips{display:flex;flex-wrap:wrap;gap:8px}
.svc-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--border-color,#e1e6ea);border-radius:22px;background:var(--bg-surface-alt,#f4f6f7)}
.svc-seg{display:inline-flex;gap:8px}
.svc-seg-o{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--border-color,#e1e6ea);border-radius:8px}
.svc-dt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.svc-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.svc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr)) 44px;gap:8px;align-items:end;padding:8px;border:1px solid var(--border-color,#e1e6ea);border-radius:8px;background:var(--bg-surface-alt,#f4f6f7)}
.svc-row-name{grid-column:1/-1;font-weight:600}
.svc-cell{display:block;min-width:0}.svc-cell-l{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.svc-add-bar{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.svc-add-bar{grid-template-columns:1fr 1fr auto}}

.svc-heading{margin:8px 0 0;font-size:16px}

.svc-dl{display:grid;grid-template-columns:minmax(90px,35%) 1fr;gap:4px 12px;margin:0}.svc-dl dt{font-weight:600;opacity:.8}.svc-dl dd{margin:0;overflow-wrap:anywhere}

/* ===== read-only summary rendered from the same schema ===== */
function svcFormJobValue(job, f) {
  var id = f.id, d = job.data || {}, c = job.customer || {}, a = (job.asset && job.asset.attrs) || {};
  if (d[id] !== undefined) return d[id];
  if (job[id] !== undefined) return job[id];
  if (SVC_FORM_CUSTOMER_KEYS[id] && c[SVC_FORM_CUSTOMER_KEYS[id]] !== undefined) return c[SVC_FORM_CUSTOMER_KEYS[id]];
  var ak = f.assetAttr || id.replace(/^[a-z]+_/, '');
  if (a[ak] !== undefined) return a[ak];
  if (id === 'services' && Array.isArray(job.services)) return job.services;
  return undefined;
}
function svcFormShow(f, v, ctx) {
  var kind = svcFormKind(f);
  if (kind === 'services') return (v || []).map(function (s) { return s.name + (s.qty > 1 ? ' x' + s.qty : '') + (s.price !== undefined ? ' @ ' + svcFormMoney(s.price) : ''); }).join(', ');
  if (kind === 'staff') return Array.isArray(v) ? v.map(function (s) { return (s.name || s.staffId) + (s.task ? ' (' + s.task + ')' : ''); }).join(', ') : String(v);
  if (kind === 'money') return isNaN(svcFormNum(v)) ? String(v) : svcFormMoney(v);
  if (kind === 'checkbox') return v === true ? 'Yes' : 'No';
  if (kind === 'yesno') return v === 'yes' || v === true ? 'Yes' : 'No';
  if (kind === 'datetime') return typeof v === 'number' ? svcFormDateStr(v) + ' ' + svcFormTimeStr(v) : String(v);
  if (kind === 'photo') return Array.isArray(v) ? v.length + ' photo' + (v.length === 1 ? '' : 's') : '';
  if (kind === 'chips') return Array.isArray(v) ? v.join(', ') : String(v);
  if (kind === 'repeater') return Array.isArray(v) ? v.map(function (r) { return Object.keys(r).map(function (k) { return r[k]; }).filter(function (x) { return x !== '' && x !== undefined; }).join(' '); }).join('; ') : String(v);
  if (kind === 'obj' || (svcFormIsObj(v) && !Array.isArray(v))) return Object.keys(v).map(function (k) { return k + ': ' + v[k]; }).join(', ');
  if (kind === 'dropdown') { var o = svcFormOptions(f, ctx, {}).filter(function (x) { return String(x.v) === String(v); })[0]; return o ? String(o.l) : String(v); }

}
function svcRenderJobSummary(job, tplOrMount, opts) {

  var src = mount ? (job.serviceType || job.typeKey || 'other') : (tplOrMount || job.serviceType || job.typeKey || 'other');
  var schema = svcFormResolve(src), ctx = { typeKey: schema.key || job.serviceType }, known = {}, h = '';
  svcFormPairs(schema).forEach(function (p) { known[p.field.id] = true; });
  (schema.sections || []).forEach(function (sec) {
    var rows = '';
    (sec.fields || []).forEach(function (f) {
      if (!f || !f.id || f.sensitive || svcFormKind(f) === 'heading') return;
      var v = svcFormJobValue(job, f);
      if (v === undefined || svcFormEmpty(v, f)) return;
      rows += '<dt>' + svcFormEsc(svcFormLabel(f, ctx.typeKey)) + '</dt><dd>' + svcFormEsc(svcFormShow(f, v, ctx)) + '</dd>';
    });
    if (rows) h += '<section class="svc-sum-sec"><h4>' + svcFormEsc(svcFormTokens(sec.title || '', ctx.typeKey)) + '</h4><dl class="svc-dl">' + rows + '</dl></section>';
  });
  var other = '', labels = (job.customFieldLabels || (opts && opts.labels)) || {};
  Object.keys(job.data || {}).forEach(function (k) {
    if (known[k] || svcFormEmpty(job.data[k])) return;
    other += '<dt>' + svcFormEsc(labels[k] || k.replace(/^cf_/, '').replace(/[_-]+/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); })) + '</dt><dd>' + svcFormEsc(typeof job.data[k] === 'object' ? JSON.stringify(job.data[k]) : job.data[k]) + '</dd>';
  });
  if (other) h += '<section class="svc-sum-sec"><h4>Other details</h4><dl class="svc-dl">' + other + '</dl></section>';
  h = '<div class="svc-summary">' + h + '</div>';
  if (mount) mount.innerHTML = h;
  return h;
