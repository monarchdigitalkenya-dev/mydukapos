<!-- TAX & RETURNS (zip 304) ------------------------------------------------------------------------------------------------------------
     A "🧾 Tax & Returns" tab in every POS app (after Profits & Expenses, in the sidebar's Reports folder). It COMPILES the records the app already keeps
     so the owner can review them and prepare a tax return BY HAND. It is NOT a KRA filing, NOT an eTIMS invoice and submits nothing anywhere.
     WHAT IT READS (never writes): salesLog (the same records as Daily Sales / Reports: voided sales are left out, the delivery fee is standard-rated),
     returns (Returned Goods), bills (open credit sales, shown apart), inventory (items whose tax class is not set are listed for review).
     TAX OF A LINE: its own vatCategory, stamped on the line when it went into the cart (so a later change to the item never rewrites an old sale) and the
     rate in force ON THE SALE'S DATE, from an append-only rate history (pos_tax_cfg.rates). A rate change is effective from the moment it is made and is
     never back-dated, so every past sale keeps the rate it was sold at. Prices in MyDuka INCLUDE VAT: tax = gross x rate / (100 + rate).
     ROUNDING: every line in whole cents (half away from zero); totals are sums of the rounded lines, so the register and the summary always add up.
     OFFLINE: works offline from this device's records; a sale this device has not yet sent to the server is marked "Not yet synced" (sales journal).
     Settings travel with the shop's other settings (extraSettingsCollect / Apply, newest wins; rate histories are merged). Visibility follows the
     Profits & Expenses tab (staff who cannot see Profits cannot see Tax). Ids / names: tx-*, txr*. -->

    t.innerHTML = '<div class="tx-wrap">'
      + '<div class="tx-banner" role="note"><span style="font-size:20px">🧾</span><div><b>For your review and manual filing.</b> These are MyDuka-generated summaries of the sales recorded in this app. They are <b>not</b> an official KRA tax return, <b>not</b> KRA electronic tax invoices (eTIMS) and nothing here is sent to KRA. Check the tax treatment of your goods and your filing duties against official KRA guidance before you file.</div></div>'

    d.lines.forEach(function (x) { var dt = new Date(x.t); rows.push([dt.toLocaleDateString('en-GB'), dt.toLocaleTimeString('en-GB'), x.s.refNumber || x.s.id, x.s.soldViaBranch || '', x.l.name || '', num(x.l.qty), plain(cents(x.l.price)), x.s.totalDiscount ? plain(cents(x.s.totalDiscount)) : '', CLASS[x.cat].label, x.reg === false ? 'n/a (not VAT-registered)' : x.rate, plain(x.net), plain(x.vat), plain(x.gross), payLabel(x.s), x.s.paid === false ? 'Unpaid' : 'Paid', x.isPay ? 'Payment towards a credit bill' : 'Completed sale', x.sync === 'pending' ? 'Not yet synced' : x.sync === 'synced' ? 'Synced' : 'Unknown', x.assumed ? 'No class on line: counted as standard-rated' : '']); });
    rows.push([]); rows.push(['Totals', '', '', '', '', '', '', '', '', '', plain(d.gross - d.vat), plain(d.vat), plain(d.gross)]);
    download('tax-register_' + R.fromS + '_' + R.toS + '.csv', rows);
  }
  function exportSummary() {
    var R = range(), d = compile(R.from, R.to), rows = head(R);
    rows.push(['Tax class', 'Rate(s) %', 'Lines', 'Gross (incl. VAT)', 'Net (excl. VAT)', 'VAT']);
    Object.keys(CLASS).forEach(function (c) { var b = d.byCat[c]; if (!b.lines) return; rows.push([CLASS[c].label, Object.keys(b.rates).join(' / ') || '0', b.lines, plain(b.gross), plain(b.net), plain(b.vat)]); });
    rows.push(['Total', '', d.lines.length, plain(d.gross), plain(d.gross - d.vat), plain(d.vat)]);
    rows.push([]); rows.push(['Returns (valid)', '', d.returns.length, plain(d.retGross), plain(d.retGross - d.retVat), plain(d.retVat)]);
    rows.push(['Net after returns', '', '', plain(d.gross - d.retGross), plain((d.gross - d.vat) - (d.retGross - d.retVat)), plain(d.vat - d.retVat)]);
    rows.push(['Voided sales (excluded from totals)', '', d.voided.length, plain(d.voidGross)]);
    rows.push(['Discounts given (already in line prices)', '', '', plain(d.discount)]);
    rows.push(['Sales not yet synced (included once)', '', d.unsynced]);
    rows.push([]); rows.push(['Output VAT is not VAT payable: input VAT on purchases and other adjustments are not included.']);
    rows.push(['Method: prices include VAT; per line VAT = gross x rate / (100 + rate), rounded to the cent; totals are sums of lines; rate in force on the sale date.']);
    download('tax-summary_' + R.fromS + '_' + R.toS + '.csv', rows);
  }
  function exportReturns() {
    var R = range(), d = compile(R.from, R.to), rows = head(R);
    rows.push(['Type', 'Date', 'Item', 'Quantity', 'Original receipt', 'Tax class', 'Rate %', 'Value incl. VAT', 'VAT', 'Reason / note']);
    d.returns.forEach(function (x) { rows.push(['Return', new Date(x.t).toLocaleString('en-GB'), x.r.itemName || '', num(x.r.qty), x.r.refNumber || 'Missing', x.cat ? CLASS[x.cat].label : 'Unknown', x.rate == null ? 'Unknown' : x.rate, x.gross == null ? 'Missing' : plain(x.gross), x.vat == null ? 'Missing' : plain(x.vat), x.r.reason || '']); });
    d.voided.forEach(function (x) { rows.push(['Voided sale (excluded)', new Date(x.t).toLocaleString('en-GB'), '', '', x.s.refNumber || x.s.id, '', '', plain(x.gross), '', x.s.voidReason || '']); });
    d.exchanges.forEach(function (x) { rows.push(['Exchange (already netted in sales)', new Date(x.t).toLocaleString('en-GB'), x.r.itemName || '', num(x.r.qty), x.r.refNumber || '', '', '', '', '', x.r.reason || '']); });
    download('tax-returns-adjustments_' + R.fromS + '_' + R.toS + '.csv', rows);
  }
  function printReport() {
    var R = range(), d = compile(R.from, R.to);
    var p = $('tx-print'); if (!p) { p = document.createElement('div'); p.id = 'tx-print'; document.body.appendChild(p); }
    var rows = Object.keys(CLASS).map(function (c) { var b = d.byCat[c]; return b.lines ? '<tr><td>' + esc(CLASS[c].label) + '</td><td class="n">' + esc(Object.keys(b.rates).join(' / ') || '0') + '%</td><td class="n">' + plain(b.gross) + '</td><td class="n">' + plain(b.net) + '</td><td class="n">' + plain(b.vat) + '</td></tr>' : ''; }).join('');
    p.innerHTML = '<h2 style="margin:0">' + esc(g('businessName') || 'Business') + ' - Sales tax summary</h2><p>KRA PIN: ' + esc(g('etimsPin') || 'Missing') + ' · Period ' + esc(R.fromS) + ' to ' + esc(R.toS) + ' · Printed ' + esc(new Date().toLocaleString('en-GB')) + '</p>'
      + '<p><b>MyDuka-generated report for review and manual filing. Not an official KRA tax return and not an eTIMS tax invoice.</b></p>'
      + '<table><tr><th>Tax class</th><th>Rate</th><th>Gross (KES, incl. VAT)</th><th>Net (KES)</th><th>VAT (KES)</th></tr>' + rows + '<tr><th>Total</th><th></th><th class="n">' + plain(d.gross) + '</th><th class="n">' + plain(d.gross - d.vat) + '</th><th class="n">' + plain(d.vat) + '</th></tr></table>'
      + '<p>Returns: ' + d.returns.length + ', value KES ' + plain(d.retGross) + ', VAT KES ' + plain(d.retVat) + '. Net sales after returns KES ' + plain(d.gross - d.retGross) + ', output VAT after returns KES ' + plain(d.vat - d.retVat) + '. Voided sales (excluded): ' + d.voided.length + ' (KES ' + plain(d.voidGross) + '). Not yet synced: ' + d.unsynced + '.</p>'
      + '<p>Output VAT is not the VAT payable: input VAT and other adjustments are not included. Method: prices include VAT; VAT per line = gross x rate / (100 + rate), rounded to the cent; rate in force on the sale date.</p>';
    document.body.classList.add('tx-printing');
    var done = function () { document.body.classList.remove('tx-printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    try { window.print(); } catch (e) { /* no print here */ }
    setTimeout(done, 60000);
  }
  function onClick(e) {
    var t = e.target.closest ? e.target.closest('[data-v],[data-tx]') : null; if (!t) return;
    if (t.hasAttribute('data-v')) { S.view = t.getAttribute('data-v'); S.page = 0; render(); return; }
    var a = t.getAttribute('data-tx');
    if (a === 'csv-register') exportRegister(); else if (a === 'csv-summary') exportSummary(); else if (a === 'csv-returns') exportReturns(); else if (a === 'print') printReport();
    else if (a === 'prev') { S.page = Math.max(0, S.page - 1); render(); } else if (a === 'next') { S.page++; render(); }
  }
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'tx-reg') return;
    var v = e.target.value, msg = $('tx-setup-msg');
    if (v === '') return;
    var on = v === 'yes', now = Date.now();
    C.vatRegistered = on; C.reg = mergeReg(C.reg, [{ from: now, on: on }]); save(true);
    if (msg) { msg.className = 'tx-msg ok'; msg.textContent = 'Saved. From now on sales are reported as ' + (on ? 'VAT-registered' : 'not VAT-registered') + '. Earlier sales are unchanged.'; }
  });

  /* ---------------- the tab ---------------- */
  function ensure() {
    var anchor = $('profits-tab'); if (!anchor) return false;
    if (!$(ID)) { var d = document.createElement('div'); d.id = ID; d.className = 'tab-content'; anchor.parentNode.insertBefore(d, anchor.nextSibling); }
    var pb = document.querySelector('.tab-link[data-tab="profits-tab"]');
    if (pb && !$(BTN)) {
      var nb = document.createElement('button'); nb.id = BTN; nb.className = 'tab-link'; nb.type = 'button'; nb.setAttribute('data-tab', ID);
      nb.setAttribute('onclick', "guardedSwitchTab(event, '" + ID + "')"); nb.textContent = '🧾 Tax & Returns';
      pb.parentNode.insertBefore(nb, pb.nextSibling);
      nb.addEventListener('click', function () { setTimeout(function () { if (isOpen()) render(); }, 0); });
    }
    // staff: the app's own role rules decide (applyServerVisibility / isTabLocked: Tax & Returns is a role of its own). The owner always sees it.
    var b = $(BTN), serving = false;
    try { serving = typeof currentServer !== 'undefined' && !!currentServer; } catch (e) { serving = false; }
    if (b && pb && !serving) { var want = (pb.classList.contains('ptl-tab-off')) ? 'none' : ''; if (b.style.display !== want) b.style.display = want; }
    return true;
  }
  // staff who had the FULL Profits role keep seeing these figures: Tax & Returns is added to their roles ONCE (flag txMigrated); the admin can untick it.
  // "Add expenses only" never gets it (it hides the figures).
  function migrate() {
    try {
      if (typeof staff === 'undefined' || !Array.isArray(staff)) return;
      var changed = false;
      staff.forEach(function (m) {
        if (!m || m.txMigrated) return;
        m.txMigrated = true; changed = true;
        if (Array.isArray(m.roles) && m.roles.indexOf('profits-tab') >= 0 && m.roles.indexOf(ID) < 0) { m.roles.push(ID); m.updatedAt = Date.now(); }
      });
      if (changed) { if (typeof safeSetItem === 'function') safeSetItem(window.__LOG_KEYS && /^aqua_/.test(window.__LOG_KEYS.salesLog || '') ? 'aqua_staff' : 'pos_staff', JSON.stringify(staff)); try { if (typeof queuePush === 'function') queuePush(); } catch (e) { /* next change sends it */ } }
    } catch (e) { /* ok */ }
  }
  function register2() {
    try {
      if (typeof LOCKABLE_TABS !== 'undefined' && Array.isArray(LOCKABLE_TABS) && !LOCKABLE_TABS.some(function (t) { return t.id === ID; })) {
        var i = LOCKABLE_TABS.findIndex(function (t) { return t.id === 'profits-tab'; });
        LOCKABLE_TABS.splice(i >= 0 ? i + 1 : LOCKABLE_TABS.length, 0, { id: ID, label: '🧾 Tax & Returns' });
      }
      if (typeof ROLE_TABS !== 'undefined' && Array.isArray(ROLE_TABS) && !ROLE_TABS.some(function (t) { return t.id === ID; })) ROLE_TABS.push({ id: ID, label: '🧾 Tax & Returns' });
      if (typeof lockedTabs !== 'undefined' && Array.isArray(lockedTabs) && localStorage.getItem('pos_tx_lock_init') !== '1') {
        localStorage.setItem('pos_tx_lock_init', '1');
        if (lockedTabs.indexOf('profits-tab') >= 0 && lockedTabs.indexOf(ID) < 0) { lockedTabs.push(ID); if (typeof safeSetItem === 'function') safeSetItem('pos_locked_tabs', JSON.stringify(lockedTabs)); }
      }
    } catch (e) { /* the tab still works for the admin */ }
  }
  window.taxReturns = { compile: compile, rateAt: rateAt, registeredAt: registeredAt, render: render, config: function () { return JSON.parse(JSON.stringify(C)); }, csvCell: csvCell, cents: cents, trackRates: trackRates };
  function boot() {
    var n = 0;
    try { migrate(); } catch (e) { /* ok */ }
    (function tick() { try { if (ensure()) { register2(); trackRates(); } } catch (e) { /* retried */ } if (++n < 40) setTimeout(tick, n < 10 ? 250 : 1000); })();
    setInterval(function () { try { ensure(); trackRates(); } catch (e) { /* cosmetic */ } }, 4000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
