<!-- PRINT WHITE ----------------------------------------------------------------------------------------------------------------------------
         zip 192. A receipt / order ticket always prints BLACK on WHITE, whatever theme the screen is in. In the dark theme the paper's background was the
         dark surface colour while its text is forced black: a browser's print dialog leaves backgrounds out (so the web print looked fine), but the Windows
         app prints backgrounds - a dark page with black letters, i.e. an empty-looking receipt. Backgrounds of the receipt and the ticket are now white
         in print, in every app and every theme (the print dialog setting "background graphics" no longer matters). Screen is untouched. -->
    <style>
    @media print {
        html, body { background: #fff !important; color-scheme: light; }
        body.printing-receipt #receipt-modal, body.printing-receipt #receipt-modal *,
        body.printing-kitchen-ticket #kitchen-ticket-modal, body.printing-kitchen-ticket #kitchen-ticket-modal * { background-color: #fff !important; box-shadow: none !important; }
        body.printing-receipt .receipt-paper, body.printing-kitchen-ticket .receipt-paper, body.printing-receipt .receipt-paper *, body.printing-kitchen-ticket .receipt-paper * { color: #000 !important; -webkit-text-fill-color: #000 !important; opacity: 1 !important; text-shadow: none !important; filter: none !important; }
        body.printing-receipt .receipt-paper img, body.printing-kitchen-ticket .receipt-paper img { filter: none !important; opacity: 1 !important; }
    }
    </style>
