<!-- MONEY TABS (zip 369) -----------------------------------------------------------------------------------------------------------------
     Two simple tabs that sit in plain view instead of being buried in bigger screens:
       💸 EXPENSES  - "money going out" in one small form: amount, tap a category, say what for, Save. Today's expenses are listed right under it.
                      It fills the Profits & Expenses form and presses ITS Add Expense, so the amount, the reports, the sync and the permissions
                      are the ones that were already there (nothing is counted twice, nothing is recorded differently).
       🛒 PURCHASES - "stock I bought": supplier, then each item with how many and what it cost, Save. It fills the Restock sheet and presses ITS
                      Complete Restock, so stock goes up, the cost is logged as an expense and the goods-received note prints exactly as before.
                      (Scanning, photo capture and spreadsheet import stay in the Restock tab.)
     The Water app keeps its own restocking screen: there the existing tab is simply renamed Purchases. Ids: mt-*. -->
<style id="mt-css">
.mt-wrap { max-width: 760px; }
.mt-card { background: var(--bg-surface, #fff); border: 1px solid var(--border-color, #e3e8ec); border-radius: 14px; padding: 14px; margin: 0 0 14px; }
.mt-card h3 { margin: 0 0 4px; }
.mt-sub { margin: 0 0 12px; font-size: 13px; opacity: .75; }
.mt-amount { width: 100%; box-sizing: border-box; font-size: 30px; font-weight: 800; padding: 10px 12px; border-radius: 12px; text-align: left; }
.mt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.mt-chip { width: auto; margin: 0; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border-color, #cfd8de); background: var(--bg-surface, #fff); color: inherit; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 42px; transition: transform .12s ease, background .12s ease, border-color .12s ease; }
.mt-chip:active { transform: scale(.95); }
.mt-chip.on { background: #16a085; border-color: #16a085; color: #fff; }
.mt-save { width: 100%; margin-top: 12px; min-height: 48px; font-size: 16px; font-weight: 800; border-radius: 12px; border: 0; background: #16a085; color: #fff; cursor: pointer; }
.mt-save:disabled { opacity: .55; }
.mt-save.mt-blue { background: #2980b9; }
.mt-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border-color, #eef1f3); font-size: 14px; }
.mt-row:last-child { border-bottom: 0; }
.mt-row .mt-what { flex: 1; min-width: 0; }
.mt-row .mt-what small { display: block; opacity: .65; font-size: 12px; }
.mt-row b { white-space: nowrap; }
.mt-del { width: auto; margin: 0; padding: 4px 9px; border-radius: 8px; border: 1px solid #e6b0aa; background: transparent; color: #b03a2e; cursor: pointer; min-height: 32px; }
.mt-totals { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.mt-total { flex: 1; min-width: 130px; border-radius: 12px; padding: 9px 12px; background: var(--bg-surface-alt, #f4f6f7); }
.mt-total b { display: block; font-size: 20px; }
.mt-total span { font-size: 12px; opacity: .7; }
.mt-line { display: grid; grid-template-columns: 1fr 70px 90px 100px 28px; gap: 6px; margin: 0 0 8px; align-items: center; }
.mt-line.mt-batch { grid-template-columns: 1fr 70px 90px 90px 100px 130px 28px; }
.mt-line input { min-height: 40px; box-sizing: border-box; width: 100%; }
.mt-x { width: auto; margin: 0; padding: 0; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #b03a2e; }
.mt-lab { font-size: 13px; font-weight: 700; display: block; margin: 10px 0 0; }
.mt-link { background: none; border: 0; color: #2980b9; font-weight: 700; cursor: pointer; padding: 4px 0; width: auto; margin: 0; }
.mt-empty { opacity: .65; font-size: 13px; padding: 6px 2px; }
.mt-pop { animation: mt-pop .22s ease-out; }
@keyframes mt-pop { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (max-width: 560px) { .mt-line, .mt-line.mt-batch { grid-template-columns: 1fr 1fr; } .mt-line .mt-x { justify-self: end; } }
@media (prefers-reduced-motion: reduce) { .mt-pop { animation: none; } .mt-chip { transition: none; } }
</style>

      '<div class="mt-chips" role="group" aria-label="What was it for">' + CATS.map(function (c) { return '<button type="button" class="mt-chip' + (S.cat === c[0] ? ' on' : '') + '" data-mt="cat" data-v="' + c[0] + '" aria-pressed="' + (S.cat === c[0]) + '">' + c[1] + ' ' + c[0] + '</button>'; }).join('') + '</div>' +

      '<details style="margin-top:8px;"><summary style="cursor:pointer; font-size:13px;">Add an M-Pesa / bank charge</summary><input id="mt-e-charge" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Charge (KES)" style="margin-top:6px; width:100%; box-sizing:border-box; min-height:42px;" value="' + esc(keep.c) + '"></details>' +
      '<button type="button" class="mt-save" data-mt="save-exp">✅ Save expense</button></div>' +
      '<div class="mt-card"><div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;"><h3 style="margin:0; flex:1;">' + (S.day === td ? 'Today' : esc(S.day)) + '</h3>' +

      '<div class="mt-totals"><div class="mt-total"><b id="mt-e-daytot">' + kes(dayTotal) + '</b><span>spent this day</span></div><div class="mt-total"><b id="mt-e-montot">' + kes(monTotal) + '</b><span>spent in ' + esc(mon) + '</span></div></div>' +

    }).join('') : '<p class="mt-empty">Nothing spent on this day yet.</p>';
  }
  function saveExpense() {

  }

  /* ======================================================= PURCHASES ======================================================= */
  function newLine() { return { name: '', qty: '', cost: '', price: '', batchNo: '', expiryDate: '' }; }
  function renderPurchases(force) {
    var host = $(PUR); if (!host) return;

    host.innerHTML = '<div class="mt-wrap mt-pop"><div class="mt-card"><h3>🛒 Purchases</h3><p class="mt-sub">Stock you bought. Add each item with how many you got and what one cost. Saving adds it to your stock and records the money spent.</p>' +
      '<label style="font-size:13px; font-weight:700;">Bought from (optional)</label><select id="mt-p-sup" style="width:100%; min-height:44px; margin:4px 0 10px;">' + (sup ? sup.innerHTML : '<option value="">— No supplier —</option>') + '</select>' +

      S.lines.map(function (l, i) {

          '<input id="mt-p-c' + i + '" type="number" inputmode="decimal" min="0" step="any" placeholder="KES" value="' + esc(l.cost) + '" data-mt-f="cost" data-i="' + i + '">' +
          '<input id="mt-p-s' + i + '" type="number" inputmode="decimal" min="0" step="any" placeholder="Sell (optional)" value="' + esc(l.price) + '" data-mt-f="price" data-i="' + i + '">' +
          (batch ? '<input id="mt-p-b' + i + '" type="text" placeholder="Batch" value="' + esc(l.batchNo) + '" data-mt-f="batchNo" data-i="' + i + '"><input id="mt-p-e' + i + '" type="date" value="' + esc(l.expiryDate) + '" data-mt-f="expiryDate" data-i="' + i + '">' : '') +

      }).join('') +

      '<input id="mt-p-ref" type="text" placeholder="Invoice / delivery note no. (optional)" style="width:100%; box-sizing:border-box; min-height:42px; margin-top:8px;" value="' + esc(ref) + '">' +
      (canPay() ? '<label class="mt-lab">Payment</label><div class="mt-chips">' + [['full', '💵 Paid in full'], ['part', '➗ Part paid'], ['credit', '📒 On credit (pay later)']].map(function (o) { return '<label class="mt-chip' + (S.pay === o[0] ? ' on' : '') + '"><input type="radio" name="mt-pay" value="' + o[0] + '" style="display:none"' + (S.pay === o[0] ? ' checked' : '') + '>' + o[1] + '</label>'; }).join('') + '</div>' +
        (S.pay === 'part' ? '<input id="mt-p-paid" type="number" inputmode="decimal" min="0" step="any" placeholder="Paid now (KES)" value="' + esc(S.paid || '') + '" style="width:100%; min-height:44px; box-sizing:border-box;">' : '') +
        (S.pay !== 'full' ? '<p class="mt-sub">What is not paid now is recorded as owed to the supplier you chose above. Pay it later in the Suppliers tab.</p>' : '') : '') +
      '<div class="mt-totals" style="margin-top:12px;"><div class="mt-total"><b id="mt-p-total">' + kes(total()) + '</b><span>total of this purchase</span></div></div>' +
      '<button type="button" class="mt-save mt-blue" data-mt="save-pur">✅ Save purchase</button>' +
      '<p class="mt-sub" style="margin-top:10px;">Have a delivery note photo, a barcode scanner or a spreadsheet? Use <button type="button" class="mt-link" data-mt="goto" data-v="restock-tab">Restock</button> - it does the same thing with more options.</p></div>' +
      '<div class="mt-card"><h3>Recent purchases</h3>' + (recent.length ? recent.map(function (e) { return '<div class="mt-row"><div class="mt-what">' + esc(e.description || 'Restock') + '<small>' + new Date(e.timestamp).toLocaleDateString('en-GB') + '</small></div><b>' + kes(e.amount) + '</b></div>'; }).join('') : '<p class="mt-empty">No purchases recorded yet.</p>') + '</div></div>';
    if (supVal && $('mt-p-sup')) $('mt-p-sup').value = supVal;
  }
  function total() { return (S.lines || []).reduce(function (t, l) { return t + (parseFloat(l.qty) || 0) * (parseFloat(l.cost) || 0); }, 0); }
  function canPay() { return !!$('sup-choice'); }      // the Restock tab's own Paid in full / Part paid / On credit choice (it keeps the supplier's account)
  function supplierName() {
    var id = ($('mt-p-sup') || {}).value || ''; if (!id) return '';
    try { var s = suppliers.find(function (x) { return x && String(x.id) === String(id); }); if (s) return s.name || ''; } catch (e) { /* fall through */ }
    var o = $('mt-p-sup') && $('mt-p-sup').selectedOptions && $('mt-p-sup').selectedOptions[0]; return o ? (o.textContent || '').trim() : '';

  function savePurchase() {

    var lines = (S.lines || []).filter(function (l) { return (l.name || '').trim() || (parseFloat(l.qty) || 0) > 0; });
    if (!lines.length) { toast('Add at least one item.', true); return; }
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (!(l.name || '').trim()) { toast('Every line needs an item name.', true); return; }

      if (!(parseFloat(l.cost) >= 0) || l.cost === '') { toast('"' + l.name + '": type what one cost.', true); return; }
    }

    restockDraft = lines.map(function (l, n) {
      var nm = l.name.trim(), hit = inv.find(function (p) { return p && !p._deleted && p.type !== 'service' && ((p.name || '').trim().toLowerCase() === nm.toLowerCase() || (p.code || '').toLowerCase() === nm.toLowerCase()); });

      var row = { rowId: (typeof restockRowSeq !== 'undefined' ? restockRowSeq++ : 9000 + n), code: vh ? (vh.variant.code || '') : (hit ? (hit.code || '') : ''), name: vh ? vh.item.name + ' (' + vh.variant.name + ')' : (hit ? hit.name : nm), unit: (vh ? vh.item.unit : (hit && hit.unit)) || 'pcs', qty: String(l.qty), cost: String(l.cost), wholesaleSell: '', sellPrice: String(l.price || '') };

      return row;
    });
    $('restock-supplier-select').value = ($('mt-p-sup') || {}).value || '';

    var mode = canPay() ? S.pay : 'full', owed = total(), paidNow = parseFloat(S.paid) || 0;
    if (mode !== 'full' && !supplierName()) { toast('Choose the supplier you owe (or pick "Paid in full").', true); return; }
    if (mode === 'part' && !(paidNow > 0 && paidNow < owed)) { toast('For "Part paid" type an amount more than 0 and less than the total (KES ' + owed.toFixed(2) + ').', true); return; }
    if (canPay()) {      // fill the Restock tab's own payment choice, then press its Complete Restock
      var rd = document.querySelector('[name="sup-pay"][value="' + mode + '"]'); if (rd) rd.checked = true;
      var pa = $('sup-paid-amount'); if (pa) pa.value = mode === 'part' ? String(paidNow) : '';
      try { if (typeof supPaintRestockChoice === 'function') supPaintRestockChoice(); } catch (e1) { /* the choice is read when Complete Restock runs */ }
    }

    try { if (typeof renderRestockRows === 'function') renderRestockRows(); } catch (e) { /* the sheet is redrawn by completeRestock */ }
    var res; try { res = completeRestock(); } catch (e) { toast('The purchase was not saved: ' + (e && e.message || 'unknown error'), true); return; }   // the app's own Complete Restock: stock, expense, goods-received note

      if (list().length > before) {
        S.pay = 'full'; S.paid = ''; S.lines = [newLine()]; renderPurchases(true); return;
      }
      if (++tries < 14) { setTimeout(settle, 150); return; }

  }

  /* ======================================================= events + tabs ======================================================= */
  function onClick(ev) {

    else if (a === 'save-exp') saveExpense();
    else if (a === 'del') { if (typeof deleteExpense === 'function') { deleteExpense(t.getAttribute('data-id')); renderExpenses(true); } }
    else if (a === 'goto') { var b = document.querySelector('.tab-link[data-tab="' + t.getAttribute('data-v') + '"]'); if (b) b.click(); }
