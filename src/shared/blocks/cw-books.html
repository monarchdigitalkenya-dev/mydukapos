<!-- CW BOOKS (zip 394) -------------------------------------------------------------------------------------------------------------------
     Car Wash & Cleaning: the money side of the business.
       Expenses        - record an expense (date, category, amount, how it was paid, note); the owner can void one (with a reason, never deleted).
       Daily cash-up   - for a day: opening float + cash received - cash refunds - cash expenses - supplies bought from the till = expected cash;
                         the cash counted is typed in and the surplus / shortage is kept.
       Supplies        - shampoo, wax, chemicals...: stock in (quantity, cost), use, count; the quantity is the sum of the movements, so every
                         device agrees; low-stock levels; the cost of what was used goes into Profit & Loss (average buying cost).
       Commission      - the owner sets each worker's commission (a % of the job or a fixed KSh per job, from a date); a job earns it when it is
                         finished and paid (a free loyalty job earns the fixed part); the job's commission is SPLIT equally between the workers
                         assigned to it.
       Profit & Loss   - collections - refunds - expenses - supplies used - commission = net profit; + cash-up surplus - shortage = final profit.
                         Printable.
     Money is whole shillings everywhere. Data: cwExpenses, cwCashups, cwSupplies, cwSupplyMoves (synced, merged per record by id), and the
     commission rates on each staff record (commissionHistory, the same field the other apps use). -->

.cw-on .cwb-low { background: #fef2f2; }

</style>
<script>
(function () {
  'use strict';
  if (window.CwBooks || typeof CW_NAV === 'undefined' || typeof CW_UI === 'undefined') return;

  /* ---------- menu, screens, permissions ---------- */
  var at = CW_NAV.findIndex(function (n) { return n.g === 'Management'; }); if (at < 0) at = CW_NAV.length;
  CW_NAV.splice(at, 0, { g: 'Money' },
    { r: 'expenses', l: 'Expenses', i: 'pay', p: 'expenses' },
    { r: 'cashup', l: 'Daily Cash-up', i: 'pay', p: 'cashup' },
    { r: 'supplies', l: 'Supplies Stock', i: 'tag', p: 'supplies' },
    { r: 'commission', l: 'Commission', i: 'staff', p: 'books' },
    { r: 'pnl', l: 'Profit & Loss', i: 'chart', p: 'books' });
  [['expenses', 'Expenses', 'expenses'], ['cashup', 'Daily Cash-up', 'cashup'], ['supplies', 'Supplies Stock', 'supplies'], ['commission', 'Commission', 'books'], ['pnl', 'Profit & Loss', 'books']].forEach(function (t) {
    if (!CW_TABS.some(function (x) { return x.r === t[0]; })) CW_TABS.push({ r: t[0], l: t[1], p: t[2] });
    CW_TITLES[t[0]] = t[1];
  });
  function grant(role, perms) { var l = CW_PERMS[role]; if (!l || l.indexOf('*') !== -1) return; perms.forEach(function (p) { if (l.indexOf(p) === -1) l.push(p); }); }
  grant('manager', ['expenses', 'cashup', 'supplies']);
  grant('cashier', ['expenses', 'cashup']);

  /* ---------- helpers ---------- */
  var DAY = CW_DAY;
  function W(n) { return Math.round(cwNum(n)); }
  function kes(n) { var v = W(n); return (v < 0 ? '-' : '') + 'KES ' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function live(r) { return r && !r._deleted && !r.voidedAt; }
  function inR(ms, a, b) { ms = cwNum(ms); return ms >= a && ms < b; }
  function today() { return cwDayKey(cwNow()); }
  function me() { return cwMe(); }
  function can(p) { return cwCan(p, me()); }
  var CATS = ['Water', 'Electricity', 'Rent', 'Fuel', 'Repairs & maintenance', 'Salaries & wages', 'Transport', 'Airtime & internet', 'Licences & permits', 'Equipment', 'Other'];
  var METHODS = [['cash', 'Cash'], ['mpesa', 'M-Pesa'], ['bank', 'Bank'], ['card', 'Card']];
  function methodL(k) { var m = METHODS.filter(function (x) { return x[0] === k; })[0]; return m ? m[1] : (typeof cwMethodLabel === 'function' ? cwMethodLabel(k) : k); }
  function amountOk(v) { var n = Number(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 && Math.round(n) === n ? n : null; }
  function qtyOk(v) { var n = Number(String(v).replace(/,/g, '')); return isFinite(n) && n > 0 ? Math.round(n * 1000) / 1000 : null; }

  /* ---------- periods ---------- */
  CW_UI.bk = CW_UI.bk || { per: 'month', from: '', to: '', day: '' };
  function period() {
    var p = CW_UI.bk.per, t = cwDayStart(today()), d = new Date(t + 3 * 3600000), a = t, b = t + DAY;
    if (p === 'week') { var dow = (d.getUTCDay() + 6) % 7; a = t - dow * DAY; }
    else if (p === 'month') a = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - 3 * 3600000;
    else if (p === 'lastmonth') { a = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1) - 3 * 3600000; b = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) - 3 * 3600000; }
    else if (p === 'custom' && CW_UI.bk.from && CW_UI.bk.to) { a = cwDayStart(CW_UI.bk.from); b = cwDayStart(CW_UI.bk.to) + DAY; }
    return { from: a, to: b, text: cwFmtDate(a) + ' to ' + cwFmtDate(b - 1) };
  }
  function perChips() {
    var c = [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['lastmonth', 'Last month'], ['custom', 'Custom']];
    return '<div class="cw-row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px"><div class="cw-chips">' + c.map(function (x) { return '<button class="cw-chip ' + (CW_UI.bk.per === x[0] ? 'on' : '') + '" data-cwb="per" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'
      + (CW_UI.bk.per === 'custom' ? '<input type="date" data-cwb-ch="from" value="' + cwEsc(CW_UI.bk.from) + '" style="width:auto"> <input type="date" data-cwb-ch="to" value="' + cwEsc(CW_UI.bk.to) + '" style="width:auto">' : '') + '</div>';
  }

  /* ---------- money in ---------- */
  function collections(a, b) {
    var out = { gross: 0, refunds: 0, net: 0, by: {}, count: 0 };
    cwPayments.forEach(function (p) {
      if (!p || p._deleted || p.reversedAt || !inR(p.at, a, b)) return;
      var v = Math.abs(cwNum(p.amount)), m = p.method || 'cash';
      if (p.type === 'refund') { out.refunds += v; out.by[m] = (out.by[m] || 0) - v; }
      else { out.gross += v; out.by[m] = (out.by[m] || 0) + v; out.count++; }
    });
    out.gross = W(out.gross); out.refunds = W(out.refunds); out.net = out.gross - out.refunds;
    Object.keys(out.by).forEach(function (k) { out.by[k] = W(out.by[k]); });
    return out;
  }
  /* ---------- expenses ---------- */
  function expensesIn(a, b) { return cwExpenses.filter(function (e) { return live(e) && inR(e.at, a, b); }); }
  function addExpense(o) {
    if (!can('expenses')) return { ok: false, error: 'You cannot record expenses.' };
    var amt = amountOk(o.amount); if (!amt) return { ok: false, error: 'Type the amount in whole shillings.' };
    var day = o.day || today(), at = cwDayStart(day) + (day === today() ? (cwNow() - cwDayStart(day)) : 12 * 3600000);
    var m = me(), r = { id: cwRid('cwx-'), at: at, day: day, category: cwStr(o.category) || 'Other', amount: amt, method: o.method || 'cash', note: cwStr(o.note).slice(0, 200), by: m.name, byId: m.id, createdAt: cwNow() };
    cwStamp(r); cwExpenses.push(r);
    cwCommit('cwExpenses', { act: 'expense.add', ref: r.category, detail: kes(amt) + ' ' + methodL(r.method) + (r.note ? ' - ' + r.note : '') });
    return { ok: true, rec: r };
  }
  function voidExpense(id, reason) {
    if (!me().owner) return { ok: false, error: 'Only the owner can void an expense.' };
    var e = cwFind(cwExpenses, id); if (!e || !live(e)) return { ok: false, error: 'Expense not found.' };
    if (!cwStr(reason).trim()) return { ok: false, error: 'Give a reason.' };
    e.voidedAt = cwNow(); e.voidedBy = me().name; e.voidReason = cwStr(reason).slice(0, 200); cwStamp(e);
    cwCommit('cwExpenses', { act: 'expense.void', ref: e.category, detail: kes(e.amount) + ' - ' + e.voidReason });
    return { ok: true };
  }
  /* ---------- supplies ---------- */
  function movesOf(id) { return cwSupplyMoves.filter(function (x) { return live(x) && x.supplyId === id; }); }
  function stockOf(sup) {
    var q = 0, inQ = 0, inC = 0;
    movesOf(sup.id).forEach(function (x) {
      if (x.type === 'in') { q += cwNum(x.qty); inQ += cwNum(x.qty); inC += cwNum(x.qty) * cwNum(x.unitCost); }
      else if (x.type === 'use') q -= cwNum(x.qty);
      else if (x.type === 'count') q += cwNum(x.delta);
    });
    q = Math.round(q * 1000) / 1000;
    var avg = inQ > 0 ? inC / inQ : 0;
    return { qty: q, avg: avg, value: W(Math.max(0, q) * avg) };
  }
  function addSupply(o) {
    if (!can('supplies')) return { ok: false, error: 'You cannot manage supplies.' };
    var name = cwStr(o.name).trim(); if (!name) return { ok: false, error: 'Type the supply name.' };
    if (cwSupplies.some(function (s) { return s && !s._deleted && cwStr(s.name).toLowerCase() === name.toLowerCase(); })) return { ok: false, error: 'That supply is already on the list.' };
    var r = { id: cwRid('cws-'), name: name.slice(0, 80), unit: cwStr(o.unit).trim().slice(0, 20) || 'litre', low: Math.max(0, cwNum(o.low)), createdAt: cwNow() };
    cwStamp(r); cwSupplies.push(r);
    cwCommit('cwSupplies', { act: 'supply.add', ref: r.name, detail: r.unit });
    return { ok: true, rec: r };
  }
  function editSupply(id, o) {
    if (!can('supplies')) return { ok: false, error: 'You cannot manage supplies.' };
    var s = cwFind(cwSupplies, id); if (!s || s._deleted) return { ok: false, error: 'Supply not found.' };
    if (o.name != null && cwStr(o.name).trim()) s.name = cwStr(o.name).trim().slice(0, 80);
    if (o.unit != null && cwStr(o.unit).trim()) s.unit = cwStr(o.unit).trim().slice(0, 20);
    if (o.low != null) s.low = Math.max(0, cwNum(o.low));
    cwStamp(s); cwCommit('cwSupplies', { act: 'supply.edit', ref: s.name, detail: '' });
    return { ok: true };
  }
  function moveSupply(id, type, o) {
    if (!can('supplies') && !(type === 'use' && can('cashup'))) return { ok: false, error: 'You cannot change supplies stock.' };
    var s = cwFind(cwSupplies, id); if (!s || s._deleted) return { ok: false, error: 'Supply not found.' };
    var st = stockOf(s), m = me(), r = { id: cwRid('cwm-'), supplyId: s.id, name: s.name, type: type, at: cwNow(), day: today(), note: cwStr(o.note).slice(0, 200), by: m.name, byId: m.id };
    if (type === 'in') {
      var q = qtyOk(o.qty); if (!q) return { ok: false, error: 'Type the quantity received.' };
      var tot = amountOk(o.total); if (!tot) return { ok: false, error: 'Type what it cost in total, in whole shillings.' };
      r.qty = q; r.total = tot; r.unitCost = tot / q; r.fromTill = !!o.fromTill;
    } else if (type === 'use') {
      var u = qtyOk(o.qty); if (!u) return { ok: false, error: 'Type the quantity used.' };
      if (u > st.qty + 1e-9) return { ok: false, error: 'Only ' + st.qty + ' ' + s.unit + ' in stock.' };
      r.qty = u; r.unitCost = st.avg; r.total = W(u * st.avg);
    } else if (type === 'count') {
      var c = Number(String(o.qty).replace(/,/g, '')); if (!isFinite(c) || c < 0) return { ok: false, error: 'Type the quantity counted.' };
      c = Math.round(c * 1000) / 1000;
      r.counted = c; r.delta = Math.round((c - st.qty) * 1000) / 1000; r.unitCost = st.avg; r.total = W(-r.delta * st.avg);
      if (!r.delta) return { ok: false, error: 'The count matches the stock - nothing to change.' };
    } else return { ok: false, error: 'Unknown movement.' };
    cwStamp(r); cwSupplyMoves.push(r);
    cwCommit('cwSupplyMoves', { act: 'supply.' + type, ref: s.name, detail: type === 'count' ? 'counted ' + r.counted + ' (' + (r.delta > 0 ? '+' : '') + r.delta + ')' : r.qty + ' ' + s.unit + (r.total ? ' ' + kes(r.total) : '') });
    return { ok: true, rec: r };
  }
  // the cost of supplies used in a period: what was used, and what a count found missing (a count that found MORE gives it back)
  function suppliesUsed(a, b) {
    var t = 0;
    cwSupplyMoves.forEach(function (x) {
      if (!live(x) || !inR(x.at, a, b)) return;
      if (x.type === 'use') t += cwNum(x.total);
      else if (x.type === 'count') t += cwNum(x.total);
    });
    return W(t);
  }
  function suppliesBoughtFromTill(a, b) { return W(cwSupplyMoves.reduce(function (t, x) { return t + (live(x) && x.type === 'in' && x.fromTill && inR(x.at, a, b) ? cwNum(x.total) : 0); }, 0)); }

  /* ---------- commission ---------- */
  function rateAt(st, at) {
    var h = cwArr(st && st.commissionHistory), best = null;
    h.forEach(function (r) { if (r && cwNum(r.at) <= at && (!best || cwNum(r.at) >= cwNum(best.at))) best = r; });
    if (!best || !(best.type === 'pct' || best.type === 'fixed') || !(cwNum(best.value) > 0)) return null;
    return { type: best.type, value: cwNum(best.value) };
  }
  function setRate(id, type, value, fromDay) {
    if (!me().owner) return { ok: false, error: 'Only the owner can set commission.' };
    var st = cwFind(cwStaffAll(), id); if (!st) return { ok: false, error: 'Worker not found.' };
    var v = type ? Number(value) : 0;
    if (type && !(v > 0)) return { ok: false, error: 'Type a commission above 0.' };
    if (type === 'fixed' && Math.round(v) !== v) return { ok: false, error: 'A fixed commission is whole shillings.' };
    if (type === 'pct' && v > 100) return { ok: false, error: 'A percent cannot be above 100.' };
    var at = fromDay ? cwDayStart(fromDay) : cwNow();
    var h = cwArr(st.commissionHistory).filter(function (r) { return cwNum(r.at) !== at; });
    h.push({ at: at, type: type || '', value: type ? v : 0, by: me().name });
    h.sort(function (x, y) { return x.at - y.at; });
    st.commissionHistory = h;
    var cur = rateAt(st, cwNow()); st.commission = cur ? { type: cur.type, value: cur.value } : { type: '', value: 0 };
    cwStamp(st);
    try { if (typeof cwSaveStaff === 'function') cwSaveStaff(); else if (typeof safeSetItem === 'function') safeSetItem('pos_staff', JSON.stringify(staff)); } catch (e) { /* */ }
    cwPush(); cwLogRow({ act: 'commission.rate', ref: st.name, detail: type ? (type === 'pct' ? v + ' %' : kes(v)) + ' per job from ' + (fromDay || today()) : 'none' }); cwSave('cwAudit'); cwEmit('cwStaff');
    return { ok: true };
  }
  // a job earns commission when it is finished and paid (or free); its commission is split equally between the workers on it
  function commission(a, b) {
    var rows = {}, jobs = 0;
    cwJobs.forEach(function (j) {
      if (!j || j._deleted || cwIsCancelled(j) || !j.completedAt || !inR(j.completedAt, a, b)) return;
      var t = cwTotals(j); if (!(t.status === 'paid' || t.free)) return;
      var who = cwStaffOnJob(j); if (!who.length) return;
      var counted = false;
      who.forEach(function (as) {
        var st = cwFind(cwStaffAll(), as.staffId); if (!st) return;
        var r = rateAt(st, cwNum(j.completedAt)); if (!r) return;
        var share = r.type === 'pct' ? cwNum(t.total) * r.value / 100 / who.length : r.value / who.length;
        var row = rows[st.id] || (rows[st.id] = { id: st.id, name: st.name || as.name || 'Worker', jobs: 0, value: 0, raw: 0 });
        row.jobs++; row.value += cwNum(t.total) / who.length; row.raw += share; counted = true;
      });
      if (counted) jobs++;
    });
    var out = Object.keys(rows).map(function (k) { var r = rows[k]; return { id: r.id, name: r.name, jobs: r.jobs, value: W(r.value), commission: W(r.raw) }; })
      .sort(function (x, y) { return y.commission - x.commission || cwStr(x.name).localeCompare(cwStr(y.name)); });
    return { rows: out, total: out.reduce(function (t, r) { return t + r.commission; }, 0), jobs: jobs };
  }

  /* ---------- daily cash-up ---------- */
  function cashFor(day) {
    var a = cwDayStart(day), b = a + DAY, inC = 0, outC = 0;
    cwPayments.forEach(function (p) {
      if (!p || p._deleted || p.reversedAt || (p.method || 'cash') !== 'cash' || !inR(p.at, a, b)) return;
      if (p.type === 'refund') outC += Math.abs(cwNum(p.amount)); else inC += Math.abs(cwNum(p.amount));
    });
    var exp = W(cwExpenses.reduce(function (t, e) { return t + (live(e) && e.method === 'cash' && inR(e.at, a, b) ? cwNum(e.amount) : 0); }, 0));
    return { received: W(inC), refunds: W(outC), expenses: exp, supplies: suppliesBoughtFromTill(a, b) };
  }
  function cashupOf(day) { return cwFind(cwCashups, 'cwcu-' + day); }
  function saveCashup(day, o) {
    if (!can('cashup')) return { ok: false, error: 'You cannot do the cash-up.' };
    var old = cashupOf(day), m = me();
    if (old && !old._deleted && !(m.owner || m.role === 'manager')) return { ok: false, error: 'This day is already cashed up. Ask the owner or a manager to change it.' };
    var fl = Number(String(o.float == null ? '' : o.float).replace(/,/g, '') || 0), cnt = Number(String(o.counted == null ? '' : o.counted).replace(/,/g, ''));
    if (!isFinite(fl) || fl < 0 || Math.round(fl) !== fl) return { ok: false, error: 'The opening float is whole shillings.' };
    if (o.counted === '' || o.counted == null || !isFinite(cnt) || cnt < 0 || Math.round(cnt) !== cnt) return { ok: false, error: 'Type the cash counted, in whole shillings.' };
    var c = cashFor(day), expected = fl + c.received - c.refunds - c.expenses - c.supplies;
    var r = old || { id: 'cwcu-' + day, day: day, createdAt: cwNow() };
    r.float = fl; r.received = c.received; r.refunds = c.refunds; r.expenses = c.expenses; r.supplies = c.supplies;
    r.expected = expected; r.counted = cnt; r.diff = cnt - expected; r.note = cwStr(o.note).slice(0, 200); r.by = m.name; r.byId = m.id; r.at = cwNow();
    delete r._deleted; cwStamp(r);
    if (!old) cwCashups.push(r);
    cwCommit('cwCashups', { act: 'cashup.save', ref: day, detail: 'expected ' + kes(expected) + ', counted ' + kes(cnt) + ' (' + (r.diff > 0 ? 'surplus ' : r.diff < 0 ? 'shortage ' : '') + kes(Math.abs(r.diff)) + ')' });
    return { ok: true, rec: r };
  }
  function cashDiffs(a, b) {
    var o = { surplus: 0, shortage: 0, count: 0 };
    cwCashups.forEach(function (c) { if (!c || c._deleted) return; var t = cwDayStart(c.day); if (!inR(t, a, b)) return; var d = cwNum(c.diff); if (d > 0) o.surplus += d; else if (d < 0) o.shortage += -d; o.count++; });
    o.surplus = W(o.surplus); o.shortage = W(o.shortage); return o;
  }

  /* ---------- profit & loss ---------- */
  function pnl(a, b) {
    var col = collections(a, b), ex = expensesIn(a, b), byCat = {};
    ex.forEach(function (e) { byCat[e.category] = (byCat[e.category] || 0) + cwNum(e.amount); });
    var expT = W(ex.reduce(function (t, e) { return t + cwNum(e.amount); }, 0)), sup = suppliesUsed(a, b), com = commission(a, b), cd = cashDiffs(a, b);
    var net = col.net - expT - sup - com.total;
    return { collections: col, expenses: expT, byCat: byCat, supplies: sup, commission: com.total, net: net, cash: cd, final: net + cd.surplus - cd.shortage };
  }

  /* ================= screens ================= */
  function tbl(head, rows, foot) {
    return '<div class="cw-tblw"><table class="cw-tbl"><thead><tr>' + head.map(function (h) { return '<th' + (h.n ? ' class="cw-num"' : '') + '>' + h.l + '</th>'; }).join('') + '</tr></thead><tbody>'
      + (rows.length ? rows.join('') : '<tr><td colspan="' + head.length + '" class="cw-empty">Nothing here yet.</td></tr>') + (foot || '') + '</tbody></table></div>';
  }
  CW_UI.pages.expenses = function () {
    var p = period(), list = expensesIn(p.from, p.to).sort(function (x, y) { return cwNum(y.at) - cwNum(x.at); }), tot = W(list.reduce(function (t, e) { return t + cwNum(e.amount); }, 0));
    var owner = me().owner, h = perChips();
    h += '<div class="cw-kpis">' + cwKpi('Expenses', kes(tot), p.text, '#b91c1c') + cwKpi('Entries', list.length, '', '#0891b2') + '</div>';
    h += '<div class="cw-card" style="margin-bottom:14px"><h3>Record an expense</h3><div class="cwb-inline">'
      + '<div class="cw-f"><label>Date</label><input type="date" id="cwb-x-day" value="' + today() + '" max="' + today() + '"></div>'
