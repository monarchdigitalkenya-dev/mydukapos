    if (!Array.isArray(data[n])) return;
    var next = data[n].filter(svcStIsRec);
    if (n === 'svcConfig') cfgChanged = JSON.stringify(next) !== JSON.stringify(svcConfig);
    svcStSetList(n, next); any = true;
  });
  if (!any) return false;
  svcStHealAll();
  SVC_LISTS.forEach(function (n) { if (Array.isArray(data[n])) svcSave(n); });
  if (cfgChanged) svcStEmit('config:changed', { reason: 'sync' });
  svcStEmit('render:home', { reason: 'sync' });
  return true;
}

/* ===== size budget + archive helpers ===== */
function svcStoreStats() {
  var out = { lists: {}, totalBytes: 0 };
  SVC_LISTS.forEach(function (n) {
    var a = svcStList(n) || [], s = 0;
    try { s = JSON.stringify(a).length; } catch (e) { s = 0; }
    out.lists[n] = { count: a.length, bytes: s }; out.totalBytes += s;
  });
  var big = 0; svcJobs.forEach(function (j) { if (svcJobBytes(j) > SVC_JOB_CAP) big++; });
  out.jobsOverCap = big; out.jobCap = SVC_JOB_CAP;
  return out;
}
/* closed, settled, old enough, never deleted-open: what the local archive may take. Open work (closedAt == null) never qualifies. */
function svcArchiveEligible(job, o) {
  o = o || {};
  if (!job || job._legacy || job._deleted || job.closedAt == null) return false;
  var cutoff = (o.now != null ? o.now : svcStNow()) - (o.keepDays != null ? o.keepDays : 90) * 86400000;
  if (!(Number(job.closedAt) < cutoff)) return false;
  if (o.requireSettled !== false && svcStTotalsOf(job).balance > 0.005) return false;
  return true;
}
function svcArchivePlan(o) {
  var ids = [], bytes = 0;
  svcJobs.forEach(function (j) { if (svcArchiveEligible(j, o)) { ids.push(j.id); bytes += svcJobBytes(j); } });
  return { ids: ids, bytes: bytes };
}
/* drop the listed CLOSED jobs from this device only (their asset-history entries are refreshed first, so previous visits survive). No push, no tombstone. */
function svcArchiveLocal(ids, o) {
  var set = {}; svcStArr(ids).forEach(function (x) { set[x] = 1; });
  var keep = [], moved = 0;
  svcJobs.forEach(function (j) {
    if (j && set[j.id] && svcArchiveEligible(j, Object.assign({}, o || {}, { keepDays: 0, now: (o && o.now != null ? o.now : svcStNow()) + 1 }))) {
      if (j.assetId) svcAssetTouchHistory(j);
      moved++; return;
    }
    keep.push(j);
  });
  if (moved) { svcStSetList('svcJobs', keep); svcSave('svcJobs'); }
  return { moved: moved };
}

try { svcLoad(); } catch (e) { /* storage blocked: the lists stay empty and the engine still works in memory */ }
</script>
