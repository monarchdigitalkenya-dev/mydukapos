     KIND: touches globals + DOM (drawer tab). Plain global functions (no IIFE), ES2018 max, every global name starts with svc / Svc / SVC_.

<script>
/* ===================================================================================================================
   SVC INVENTORY (B3-C): materials used on a job. Stock is taken from the shop's inventory through the SAME functions a sale uses
   (deductStockForSaleUnit / restoreStockForSaleUnit), the stock movements that call appended are re-tagged with the job (reason "Job <no>", jobId,
   materialId, staffId) and given deterministic ids (mv-<materialId>-<n>), so the stock ledger keeps one movement per id. Every record is appended
   through svcCommit; a material is never deleted: a reversal marks it (reversedAt) and puts the stock back.
   Exactly-once: a material id is minted by the caller (the form keeps one id per open form) or derived from the job service line + item (lineKey),
   and a repeat of either returns the existing record without touching the stock again.
   =================================================================================================================== */
var SVC_INV_GROUPS = { ml: ['v', 1], cl: ['v', 10], l: ['v', 1000], mg: ['m', 0.001], g: ['m', 1], kg: ['m', 1000], mm: ['n', 0.1], cm: ['n', 1], m: ['n', 100] };
var SVC_INV_ALIAS = { litre: 'l', litres: 'l', liter: 'l', liters: 'l', ltr: 'l', ltrs: 'l', lt: 'l', millilitre: 'ml', millilitres: 'ml', milliliter: 'ml', milliliters: 'ml', mls: 'ml',
  gram: 'g', grams: 'g', gm: 'g', gms: 'g', gr: 'g', kilogram: 'kg', kilograms: 'kg', kgs: 'kg', kilo: 'kg', kilos: 'kg', metre: 'm', metres: 'm', meter: 'm', meters: 'm', mtr: 'm', mtrs: 'm',
  centimetre: 'cm', centimetres: 'cm', centimeter: 'cm', centimeters: 'cm', piece: 'pcs', pieces: 'pcs', pc: 'pcs', pce: 'pcs', pcs: 'pcs', unit: 'pcs', units: 'pcs', each: 'pcs', item: 'pcs', items: 'pcs', nos: 'pcs' };
var SVC_INV_MAX_QTY = 1000000;
var SVC_INV_UI = { draftId: '' };

/* ===== tiny private helpers ===== */
function svcInvNow() { try { return typeof svcNow === 'function' ? svcNow() : Date.now(); } catch (e) { return Date.now(); } }
function svcInvEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function svcInvNum(v) { var n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function svcInvR2(n) { n = svcInvNum(n); return Math.round((n + (n < 0 ? -1 : 1) * 1e-9) * 100) / 100; }
function svcInvQty(n) { n = svcInvNum(n); var r = Math.round(n * 1e6) / 1e6; return r; }
function svcInvStr(v, max) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max || 200); }
function svcInvArr(v) { return Array.isArray(v) ? v : []; }
function svcInvSlug(v) { return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30); }
function svcInvCan(perm) { try { return typeof svcCan === 'function' ? !!svcCan(perm) : true; } catch (e) { return true; } }
function svcInvActor() { try { if (typeof svcActor === 'function') { var a = svcActor(); if (a && a.name) return a; } } catch (e) { /* owner */ } return { id: 'owner', name: 'Owner' }; }
function svcInvToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(String(msg), !!isErr); } catch (e) { /* toast is cosmetic */ } }
function svcInvMoney(n) { try { if (typeof svcFormatMoney === 'function') return svcFormatMoney(n); } catch (e) { /* fall through */ } return 'KSh ' + svcInvR2(n); }
function svcInvStock() { try { return typeof inventory !== 'undefined' && Array.isArray(inventory) ? inventory : []; } catch (e) { return []; } }
function svcInvLog() { try { return typeof stockMovementLog !== 'undefined' && Array.isArray(stockMovementLog) ? stockMovementLog : null; } catch (e) { return null; } }
function svcInvCfg() { try { return (typeof svcConfigGet === 'function' ? svcConfigGet('cfg-business') : null) || {}; } catch (e) { return {}; } }
function svcInvTpl(typeKey) { try { return typeof svcGetTemplate === 'function' ? svcGetTemplate(typeKey) : null; } catch (e) { return null; } }
function svcInvInvCfg(job) { var t = svcInvTpl(job && job.serviceType), c = t && t.inventory; return c && typeof c === 'object' ? c : { mode: 'optional', deductOn: 'record', chargeableDefault: false, unitChoices: ['pcs', 'ml', 'g'], partsLabel: 'Materials' }; }
function svcInvFail(code, msg, extra) { var r = { ok: false, code: code, error: msg, errors: [{ id: '', msg: msg }] }; var k; if (extra) for (k in extra) r[k] = extra[k]; return r; }
function svcInvHash(s) {                                 /* FNV-1a, 8 hex: a short stable id part for a job-line key */
  var h = 0x811c9dc5, i; s = String(s);
  for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; }
  return ('00000000' + h.toString(16)).slice(-8);
}
function svcInvShortId(prefix) {
  var r = '', i; for (i = 0; i < 5; i++) r += Math.floor(Math.random() * 36).toString(36);
  return prefix + svcInvNow().toString(36) + r;
}
function svcInvJob(id) { try { return typeof svcGetJob === 'function' ? (svcGetJob(id) || null) : null; } catch (e) { return null; } }
function svcInvJobTag(job) { return String(job && (job.no || job.id) || ''); }
function svcInvIsClosed(job) { return !!job && (job.closedAt != null || Number(job.phase) >= 3); }
function svcInvActive(job) { return svcInvArr(job && job.materials).filter(function (m) { return m && !m.reversedAt && !m.void; }); }
function svcInvStatusDef(job, key) {
  var t = svcInvTpl(job && job.serviceType), s = t && t.statuses, i;
  if (Array.isArray(s)) { for (i = 0; i < s.length; i++) { if (s[i] && s[i].key === key) return s[i]; } }
  return null;
}

/* ===== units ===== */
function svcInvNormUnit(u) {
  var s = String(u == null ? '' : u).toLowerCase().replace(/[.\s]+$/g, '').replace(/^\s+/, '');
  if (!s) return 'pcs';
  return SVC_INV_ALIAS[s] || s;
}
/* svcInvConvert(qty, fromUnit, toUnit) -> {ok, factor, qty}: qty expressed in toUnit. Only like units convert (ml/l, g/kg, mm/cm/m, counted pieces). */
function svcInvConvert(qty, from, to) {
  var a = svcInvNormUnit(from), b = svcInvNormUnit(to), ga = SVC_INV_GROUPS[a], gb = SVC_INV_GROUPS[b], f;
  if (a === b) return { ok: true, factor: 1, qty: svcInvQty(qty) };
  if (ga && gb && ga[0] === gb[0]) { f = ga[1] / gb[1]; return { ok: true, factor: f, qty: svcInvQty(svcInvNum(qty) * f) }; }
  return { ok: false, factor: 0, qty: 0 };
}
function svcInvIsPieceUnit(u) { return svcInvNormUnit(u) === 'pcs'; }

/* ===== inventory lookups ===== */
function svcInvLive(p) { return !!p && !p._deleted && !p.removed; }
/* a product by code, else by a UNIQUE name (never guesses between two). Services are returned too: callers check .type */
function svcInvFind(code, name) {
  var inv = svcInvStock(), i, p, nm = String(name == null ? '' : name).trim().toLowerCase();
  if (code != null && String(code) !== '') {
    for (i = 0; i < inv.length; i++) { p = inv[i]; if (svcInvLive(p) && String(p.code) === String(code)) return p; }
  }
  if (nm) {
    var hit = null, n = 0;
    for (i = 0; i < inv.length; i++) { p = inv[i]; if (svcInvLive(p) && p.type !== 'service' && String(p.name || '').trim().toLowerCase() === nm) { hit = p; n++; } }
    if (n === 1) return hit;
  }
  return null;
}
function svcInvAvailable(p, mode) {
  try { if (typeof getAvailableStock === 'function') { var v = getAvailableStock(p, mode); if (typeof v === 'number') return v; } } catch (e) { /* fall through */ }
  if (p.dualUnit && mode === 'piece') return (Number(p.pieceQty) || 0) + (Number(p.qty) || 0) * (Number(p.unitsPerBox) || 1);
  return Number(p.qty) || 0;
}
function svcInvLowLimit() { try { if (typeof LOW_STOCK_THRESHOLD !== 'undefined' && isFinite(Number(LOW_STOCK_THRESHOLD))) return Number(LOW_STOCK_THRESHOLD); } catch (e) { /* default */ } return 3; }
/* why a product cannot be used as a material (null = fine) */
function svcInvUnusable(p) {
  if (!p) return 'notfound';
  if (p.type === 'service') return 'service';
  if (p.hasVariants && svcInvArr(p.variants).length) return 'variants';
  if (p.type === 'set' || svcInvArr(p.productionRecipe).length) return 'composite';
  return null;
}
/* svcInvStockInfo(code, name, qty, unit) -> what the stock looks like for that use (no side effects). */
function svcInvStockInfo(code, name, qty, unit) {
  var out = { found: false, convertible: false, code: '', name: '', unit: '', mode: 'box', factor: 1, need: 0, left: 0, avail: 0, short: false, low: false, unusable: null };
  var p = svcInvFind(code, name);
  if (!p) return out;
  out.found = true; out.code = String(p.code); out.name = String(p.name || ''); out.unit = p.unit || 'pcs';
  out.unusable = svcInvUnusable(p);
  var mode = 'box', conv;
  if (p.dualUnit && svcInvIsPieceUnit(unit) && svcInvNormUnit(p.unit) !== 'pcs') { mode = 'piece'; conv = { ok: true, factor: 1, qty: svcInvQty(qty) }; }
  else conv = svcInvConvert(qty, unit || p.unit, p.unit || 'pcs');
  out.mode = mode; out.convertible = !!conv.ok; out.factor = conv.factor || 1;
  if (!conv.ok) return out;
  out.need = conv.qty;
  out.left = svcInvQty(svcInvAvailable(p, mode));
  out.avail = out.factor > 0 ? svcInvQty(out.left / out.factor) : out.left;          /* in the unit the caller asked in */
  out.short = out.need > out.left + 1e-9;
  out.low = !out.short && (out.left - out.need) <= svcInvLowLimit();
  out.price = svcInvNum(p.price) * out.factor; out.cost = svcInvNum(p.wholesalePrice != null ? p.wholesalePrice : p.cost) * out.factor;
  return out;
}

/* ===== persistence of the stock side (inventory + movement ledger) ===== */
function svcInvPersist() {
  try {
    if (typeof safeSetItem === 'function') {
      safeSetItem('pos_inventory', JSON.stringify(svcInvStock()));
      var lg = svcInvLog();
      if (lg) safeSetItem(typeof appStoreKey === 'function' ? appStoreKey('pos_stock_movement_log') : 'pos_stock_movement_log', JSON.stringify(lg));
    }
  } catch (e) { /* the next stock change saves them */ }
  try { if (typeof renderInventoryTable === 'function') renderInventoryTable(); } catch (e2) { /* not on screen */ }
}
function svcInvSnap(p) { var lg = svcInvLog(); return { qty: p.qty, hasPiece: p.pieceQty !== undefined, pieceQty: p.pieceQty, len: lg ? lg.length : 0 }; }
function svcInvRollback(p, s) {
  p.qty = s.qty; if (s.hasPiece) p.pieceQty = s.pieceQty; else delete p.pieceQty;
  var lg = svcInvLog(); if (lg && lg.length > s.len) lg.length = s.len;
}
function svcInvTag(rows, matId, job, o, suffix) {
  var ids = [];
  rows.forEach(function (r, i) {
    var id = 'mv-' + matId + '-' + (suffix || '') + (i + 1);
    r.id = id; r.reason = 'Job ' + svcInvJobTag(job) + (suffix === 'r' ? ' (material reversed)' : ' (material used)');
    r.jobId = job.id; r.materialId = matId;
    if (o && o.staffId) r.staffId = o.staffId;
    if (o && o.lineId) r.serviceLineId = o.lineId;
    ids.push(id);
  });
  return ids;
}
function svcInvTaken(rows, mode) {
  var unit = mode === 'piece' ? 'pieceQty' : 'qty', s = 0;
  rows.forEach(function (r) { if ((r.unit || 'qty') === unit) s += Number(r.delta) || 0; });
  return svcInvQty(-s);
}

/* ===== svcUseMaterial ===== */
/* svcUseMaterial(jobId, {code, name, qty, unit, serviceLineId, staffId, chargeable, price, cost, id, lineKey, untracked, note, auto, system, allowNegative})
   -> {ok, material, duplicate?, warn?, errors[]}. Tracked (code given): checks the stock, takes it through deductStockForSaleUnit, re-tags the movements.
   untracked (no code, or untracked:true): recorded with no stock effect and flagged. A repeat of the same id / lineKey returns the existing record. */
function svcUseMaterial(jobId, o) {
  o = o || {};
  if (!o.system && !svcInvCan('svc:inventory')) return svcInvFail('perm', 'You are not allowed to record stock use on jobs.');
  var job = svcInvJob(jobId);
  if (!job) return svcInvFail('notfound', 'That job could not be found.');
  if (job._legacy) return svcInvFail('legacy', 'Upgrade this classic job to a full job first.');
  if (job._deleted) return svcInvFail('deleted', 'That job was removed.');
  if (svcInvIsClosed(job)) return svcInvFail('closed', 'This job is closed: materials can no longer be added.');
  var code = svcInvStr(o.code, 60), name = svcInvStr(o.name, 80), qty = svcInvQty(o.qty);
  var untracked = o.untracked === true || !code;
  if (!(qty > 0)) return svcInvFail('qty', 'Enter a quantity above 0.');
  if (qty > SVC_INV_MAX_QTY) return svcInvFail('qty', 'That quantity is too large.');
  var prod = null;
  if (!untracked) {
    prod = svcInvFind(code, '');
    if (!prod) return svcInvFail('notfound', 'Item ' + code + ' is not in your inventory.');
    var un = svcInvUnusable(prod);
    if (un === 'service') return svcInvFail('service', prod.name + ' is a service, not stock. Pick a stock item.');
    if (un === 'variants') return svcInvFail('variants', prod.name + ' has variants. Record the specific variant item, or tick "Not in stock list".');
    if (un === 'composite') return svcInvFail('composite', prod.name + ' is made from other items. Record its parts instead.');
    if (!name) name = svcInvStr(prod.name, 80);
  } else if (!name) return svcInvFail('name', 'Enter what was used.');

  /* ids: caller minted, else derived from the job line + item (stable), else random */
  var lk = '', matId = '', existing = svcInvArr(job.materials), i, same = [];
  if (o.lk) lk = String(o.lk);
  else if (o.lineKey) lk = svcInvHash(o.lineKey);
  if (o.id) {
    matId = String(o.id).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60);
    if (matId.length < 4) return svcInvFail('id', 'Bad record id.');
    for (i = 0; i < existing.length; i++) { if (existing[i] && existing[i].id === matId) return { ok: true, duplicate: true, material: existing[i], errors: [] }; }
  } else if (lk) {
    for (i = 0; i < existing.length; i++) { if (existing[i] && existing[i].lk === lk) { same.push(existing[i]); if (!existing[i].reversedAt) return { ok: true, duplicate: true, material: existing[i], errors: [] }; } }
    matId = 'mt-' + lk + '-' + same.length;
  } else matId = svcInvShortId('mt-');

  var unit = svcInvStr(o.unit, 12) || (prod ? (prod.unit || '') : '');
  var cfg = svcInvCfg(), tcfg = svcInvInvCfg(job), actor = svcInvActor();
  var chargeable = o.chargeable != null ? o.chargeable === true : tcfg.chargeableDefault === true;
  var price = o.price != null && o.price !== '' ? Math.max(0, svcInvNum(o.price)) : 0, cost = o.cost != null && o.cost !== '' ? Math.max(0, svcInvNum(o.cost)) : 0;
  var mat = { id: matId, code: untracked ? null : String(prod.code), name: name, qty: qty, unit: unit, cost: 0, price: 0, chargeable: chargeable, at: svcInvNow(), by: actor.name, byId: actor.id };
  if (lk) mat.lk = lk;
  if (o.serviceLineId) mat.lineId = String(o.serviceLineId);
  if (o.staffId) mat.staffId = String(o.staffId);
  if (o.auto) mat.auto = true;
  if (o.note) mat.note = svcInvStr(o.note, 200);
  var warn = null, snap = null, rows = [], mode = 'box', taken = 0;

  if (untracked) {
    mat.untracked = true; mat.cost = svcInvR2(cost); mat.price = o.price != null && o.price !== '' ? svcInvR2(price) : 0;
    mat.movementIds = [];
  } else {
    var info = svcInvStockInfo(prod.code, '', qty, unit);
    if (!info.convertible) return svcInvFail('unit', prod.name + ' is counted in ' + (prod.unit || 'pcs') + '. Use ' + (prod.unit || 'pcs') + ' (or a matching unit such as ' + (svcInvNormUnit(prod.unit) === 'l' ? 'ml' : (svcInvNormUnit(prod.unit) === 'kg' ? 'g' : 'a like unit')) + ').');
    mode = info.mode;
    if (info.short && !(o.allowNegative === true || cfg.allowNegativeStock === true)) {
      return svcInvFail('stock', 'Only ' + info.avail + ' ' + (unit || prod.unit || 'pcs') + ' of ' + prod.name + ' left in stock.', { available: info.avail, need: qty, unit: unit || prod.unit || 'pcs' });
    }
    mat.cost = svcInvR2(o.cost != null && o.cost !== '' ? cost : info.cost);
    mat.price = o.price != null && o.price !== '' ? svcInvR2(price) : svcInvR2(info.price);
    if (typeof o.price === 'undefined' && !chargeable) mat.price = svcInvR2(info.price);

  var box = el.querySelector('[data-hint]'); if (!box) return;
  var v = svcInvFormVals(el), name = String(v.item || '').trim(), unitIn = el.querySelector('[data-f="unit"]');
  box.className = 'svci-hint'; box.textContent = '';
  if (!name || v.untracked) { if (name && v.untracked) box.textContent = 'Recorded without a stock change.'; return; }
  var p = svcInvFind('', name) || svcInvFind(name, '');
  if (!p) { box.className = 'svci-hint warn'; box.textContent = 'Not found in your stock list. Tick "Not in my stock list" to record it anyway.'; return; }
  if (svcInvUnusable(p)) { box.className = 'svci-hint bad'; box.textContent = p.type === 'service' ? p.name + ' is a service, not stock.' : p.name + ' cannot be used as a material (variants or made from other items).'; return; }
  if (unitIn && !unitIn.value) unitIn.value = p.unit || 'pcs';
  var q = svcInvNum(v.qty), u = (unitIn && unitIn.value) || p.unit || 'pcs', info = svcInvStockInfo(p.code, '', q > 0 ? q : 0, u);
  if (!info.convertible) { box.className = 'svci-hint bad'; box.textContent = p.name + ' is counted in ' + (p.unit || 'pcs') + '. Use that unit.'; return; }
  var cfg = svcInvCfg();
  if (q > 0 && info.short) { box.className = 'svci-hint bad'; box.textContent = (cfg.allowNegativeStock === true ? 'Warning: ' : 'Not enough: ') + 'only ' + info.avail + ' ' + u + ' of ' + p.name + ' in stock.'; return; }
  var after = info.left - (q > 0 ? info.need : 0);
  box.className = 'svci-hint' + (after <= svcInvLowLimit() ? ' warn' : '');
  box.textContent = 'In stock: ' + info.avail + ' ' + u + (after <= svcInvLowLimit() && q > 0 ? ' (low after this)' : '');
  var pr = el.querySelector('[data-f="price"]'); if (pr) pr.placeholder = 'KSh ' + svcInvR2(info.price) + ' per ' + u;
}
function svcInvShowErr(el, msg) { var e = el.querySelector('[data-err]'); if (!e) return; e.textContent = msg || ''; e.hidden = !msg; }
function svcInvAfter(el, jobId, toastMsg) {
  if (toastMsg) svcInvToast(toastMsg);
  var j = svcInvJob(jobId); if (j) svcInvRenderTab(j, el);
}
function svcInvBind(el) {
  if (el.__svciBound) return; el.__svciBound = true;
  el.addEventListener('input', function (ev) { var t = ev.target; if (t && t.matches && t.matches('[data-f="item"],[data-f="qty"],[data-f="unit"]')) svcInvUpdateHint(el); });
  el.addEventListener('change', function (ev) {
    var t = ev.target; if (!t || !t.matches) return;
    if (t.matches('[data-f="chargeable"]')) { var pb = el.querySelector('[data-priceBox]'); if (pb) pb.hidden = !t.checked; }
    if (t.matches('[data-f]')) svcInvUpdateHint(el);
  });
  el.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null; if (!b || !el.contains(b)) return;
    var act = b.getAttribute('data-act'), jobId = el.__svciJob, row = b.closest ? b.closest('[data-mid]') : null, mid = row ? row.getAttribute('data-mid') : '';
    if (act === 'add') svcInvDoAdd(el, jobId, b);
    else if (act === 'apply-sugg') svcInvDoApply(el, jobId, b);
    else if (act === 'ask-reverse' && row) {
      var ask = row.querySelector('[data-ask]'); ask.innerHTML = '<label class="svci-fld lbl" for="svci-rr-' + svcInvEsc(mid) + '" style="display:block;font-size:13px;font-weight:600">Reason</label><input class="svci-in" id="svci-rr-' + svcInvEsc(mid) + '" data-f="reason" placeholder="e.g. Entered by mistake" maxlength="120"><div style="margin-top:8px"><button type="button" class="svci-btn danger" data-act="do-reverse">Confirm reverse</button><button type="button" class="svci-btn" data-act="cancel-ask">Cancel</button></div>';
      var ri = ask.querySelector('input'); if (ri) { try { ri.focus(); } catch (e) { /* not focusable */ } }
    } else if (act === 'ask-change' && row) {
      var ask2 = row.querySelector('[data-ask]'), cur = svcInvActive(svcInvJob(jobId) || {}).filter(function (m) { return m.id === mid; })[0];
      ask2.innerHTML = '<label class="svci-fld lbl" for="svci-cq-' + svcInvEsc(mid) + '" style="display:block;font-size:13px;font-weight:600">New quantity (' + svcInvEsc(cur ? cur.unit : '') + ')</label><input class="svci-in" id="svci-cq-' + svcInvEsc(mid) + '" data-f="newqty" type="text" inputmode="decimal" value="' + svcInvEsc(cur ? cur.qty : '') + '"><div style="margin-top:8px"><button type="button" class="svci-btn primary" data-act="do-change">Update</button><button type="button" class="svci-btn" data-act="cancel-ask">Cancel</button></div>';
      var ci = ask2.querySelector('input'); if (ci) { try { ci.focus(); ci.select(); } catch (e2) { /* not focusable */ } }
    } else if (act === 'cancel-ask' && row) { row.querySelector('[data-ask]').innerHTML = ''; }
    else if (act === 'do-reverse' && row) {
      b.disabled = true;
      var rsn = row.querySelector('[data-f="reason"]'), r = svcReverseMaterial(jobId, mid, { reason: rsn ? rsn.value : '' });
      if (!r.ok) { b.disabled = false; svcInvToast(r.error || 'Could not reverse.', true); return; }
      svcInvAfter(el, jobId, 'Put back in stock.');
    } else if (act === 'do-change' && row) {
      b.disabled = true;
      var nq = row.querySelector('[data-f="newqty"]'), r2 = svcReplaceMaterial(jobId, mid, { qty: nq ? nq.value : 0 });
      if (!r2.ok) { b.disabled = false; svcInvToast(r2.error || 'Could not change the quantity.', true); svcInvAfter(el, jobId, ''); return; }
      svcInvAfter(el, jobId, r2.unchanged ? '' : 'Quantity updated.');
    }
  });
}
function svcInvDoAdd(el, jobId, btn) {
  var v = svcInvFormVals(el), name = String(v.item || '').trim();
  if (!el.__svciDraft) el.__svciDraft = svcInvShortId('mt-');
  var o = { id: el.__svciDraft, qty: v.qty, unit: String(v.unit || '').trim(), chargeable: v.chargeable, quiet: false };
  if (v.chargeable && String(v.price).trim() !== '') o.price = v.price;
  if (v.untracked) { o.untracked = true; o.name = name; }
  else {
    var p = svcInvFind('', name) || svcInvFind(name, '');
    if (!name) { svcInvShowErr(el, 'Pick the item that was used.'); return; }
    if (!p) { svcInvShowErr(el, 'That item is not in your stock list. Tick "Not in my stock list" to record it without a stock change.'); return; }
    o.code = String(p.code); o.name = String(p.name);
  }
  btn.disabled = true;
  var r = svcUseMaterial(jobId, o);
  if (!r.ok) { btn.disabled = false; svcInvShowErr(el, r.error || 'Could not add that.'); return; }
  el.__svciDraft = '';                                             /* a fresh id for the next material; a repeat tap of THIS one was already answered as a duplicate */
  svcInvAfter(el, jobId, r.duplicate ? 'Already recorded.' : (v.untracked ? 'Recorded.' : 'Taken from stock.'));
}
function svcInvDoApply(el, jobId, btn) {
  var keys = [], qty = {}, rows = el.querySelectorAll('[data-sugg] .svci-sug');
  Array.prototype.forEach.call(rows, function (r) {
    var on = r.querySelector('[data-sg="on"]'), q = r.querySelector('[data-sg="qty"]'), k = r.getAttribute('data-key');
    if (on && on.checked) { keys.push(k); qty[k] = q ? q.value : ''; }
  });
  if (!keys.length) { svcInvToast('Tick at least one item first.', true); return; }
  btn.disabled = true;
  var r = svcApplyConsumption(jobId, { keys: keys, qty: qty, includeUntracked: true });
  var msg = r.used.length ? r.used.length + ' item' + (r.used.length === 1 ? '' : 's') + ' taken from stock.' : '';
  if (r.failed.length) { svcInvToast(r.failed.map(function (f) { return f.name + ': ' + f.error; }).join(' '), true); }
  if (r.warns && r.warns.length) svcInvToast(r.warns[0].message, true);
  svcInvAfter(el, jobId, msg);
}

/* ===== Settings > Services > Stock use ===== */
function svcInvRenderSettings(el) {
  if (!el) return false;
  var cfg = svcInvCfg(), canEdit = svcInvCan('svc:manageConfig');
  el.innerHTML = '<div class="svci-set"><h3 style="font-size:18px;margin:0 0 10px">Stock use on jobs</h3>' +
    '<div class="svci-box"><label class="svci-chk"><input type="checkbox" data-s="autoConsume"' + (cfg.autoConsume === true ? ' checked' : '') + (canEdit ? '' : ' disabled') + '>Take stock automatically when work starts, for catalog services marked "auto-deduct"</label>' +
    '<div class="svci-hint">Off by default. Staff can always add or reverse materials on a job in its Materials tab.</div></div>' +
    '<div class="svci-box"><label class="svci-chk"><input type="checkbox" data-s="allowNegativeStock"' + (cfg.allowNegativeStock === true ? ' checked' : '') + (canEdit ? '' : ' disabled') + '>Allow using more than the stock on hand</label>' +
    '<div class="svci-hint">Off by default: staff are told when the shop has too little. When on, the stock stops at 0 and the job is marked "short by".</div></div>' +
    (canEdit ? '' : '<div class="svci-note warn">Only people allowed to manage the Services settings can change this.</div>') + '</div>';
  if (!el.__svciSetBound) {
    el.__svciSetBound = true;
    el.addEventListener('change', function (ev) {
      var t = ev.target; if (!t || !t.matches || !t.matches('[data-s]')) return;
      var key = t.getAttribute('data-s'), patch = {}; patch[key] = !!t.checked;
      var r = typeof svcConfigPatch === 'function' ? svcConfigPatch('cfg-business', patch, { what: key + ' ' + (t.checked ? 'on' : 'off') }) : { ok: false };
      svcInvToast(r && r.ok ? 'Saved.' : 'Could not save that setting.', !(r && r.ok));
      if (!(r && r.ok)) t.checked = !t.checked;
    });
  }
  return true;
}

/* registration (registries only; guarded because blocks load in order) */
try { if (typeof svcDrawerRegister === 'function') svcDrawerRegister('materials', { label: 'Materials', order: 40, render: svcInvRenderTab, visibleWhen: function (job) { if (!job || job._legacy || job._deleted) return false; var t = svcInvInvCfg(job); return t.mode !== 'off' || svcInvArr(job.materials).length > 0; } }); } catch (e) { /* registry not ready */ }
try { if (typeof svcSettingsRegister === 'function') svcSettingsRegister('stock', { label: 'Stock use', order: 25, render: svcInvRenderSettings }); } catch (e2) { /* registry not ready */ }
try { if (typeof svcOn === 'function') svcOn('job:status', svcInvOnStatus); } catch (e3) { /* events not ready */ }
</script>
