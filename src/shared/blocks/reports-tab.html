<!-- REPORTS TAB ---------------------------------------------------------------
         "📊 Reports": one place to generate the business's reports for any period — sales, business insights (busiest hours and days, best
         workers, daily / weekly / monthly trend lines), staff performance, stock, bills & debts, expenses & profit — with Print and Excel (CSV).
         Logic: src/shared/functions.js (report*, reports*). Drawn with plain SVG so it works offline. -->
    <style>
        #reports-tab .report-kind-btn { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccd1d6; background: var(--bg-surface, #fff); color: var(--dark, #2c3e50); font-weight: 600; cursor: pointer; }
        #reports-tab .report-kind-btn.active { background: #E67E22; color: #fff; border-color: #E67E22; }
        #reports-tab h4 { margin: 16px 0 6px; }
    </style>
    <div id="reports-tab" class="tab-content">
        <div class="panel">
            <h3>📊 Reports</h3>
            <p class="settings-hint" style="margin-top:-6px;">Pick a period, then a report. Print it, or download it for Excel.</p>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0;">
                <label for="reports-range-select" style="margin:0; font-weight:600;">Period:</label>
                <select id="reports-range-select" onchange="reportsRangeChanged()" style="max-width:220px;">
                    <option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This week</option><option value="last7">Last 7 days</option>
                    <option value="month">This month</option><option value="last30" selected>Last 30 days</option><option value="last90">Last 90 days</option><option value="year">This year</option><option value="custom">Custom…</option>
                </select>
                <span id="reports-custom-range" style="display:none; gap:6px; align-items:center;"><input type="date" id="reports-from-input" onchange="reportsRangeChanged()"> to <input type="date" id="reports-to-input" onchange="reportsRangeChanged()"></span>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;">
                <button type="button" class="report-kind-btn" data-kind="sales" onclick="reportsGenerate('sales')">💰 Sales</button>
                <button type="button" class="report-kind-btn" data-kind="insights" onclick="reportsGenerate('insights')">📈 Business insights</button>
                <button type="button" class="report-kind-btn" data-kind="staff" onclick="reportsGenerate('staff')">👥 Staff performance</button>
                <button type="button" class="report-kind-btn" data-kind="stock" onclick="reportsGenerate('stock')">📦 Stock</button>
                <button type="button" class="report-kind-btn" data-kind="bills" onclick="reportsGenerate('bills')">🧾 Bills &amp; debts</button>
                <button type="button" class="report-kind-btn" data-kind="expenses" onclick="reportsGenerate('expenses')">💸 Expenses &amp; profit</button>
            </div>
            <div id="reports-actions" style="display:none; gap:8px; margin:6px 0 10px;">
                <button type="button" class="settings-small-btn" onclick="reportsPrint()">🖨️ Print / Save as PDF</button>
                <button type="button" class="settings-small-btn" onclick="reportsCsv()">⬇️ Download for Excel (CSV)</button>
            </div>
            <div id="reports-output"><p class="settings-hint">Choose a report above.</p></div>
        </div>
        <div class="panel" id="reports-more-links">
            <h4 style="margin:0 0 8px;">More detailed reports in this app</h4>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="settings-small-btn" data-goto="daily-sales-tab" onclick="reportsGoto('daily-sales-tab')">Daily sales</button>
                <button type="button" class="settings-small-btn" data-goto="stock-report-tab" onclick="reportsGoto('stock-report-tab')">Stock movement report</button>
                <button type="button" class="settings-small-btn" data-goto="profits-tab" onclick="reportsGoto('profits-tab')">Profits &amp; expenses</button>
                <button type="button" class="settings-small-btn" data-goto="trends-tab" onclick="reportsGoto('trends-tab')">Trends</button>
                <button type="button" class="settings-small-btn" data-goto="bills-tab" onclick="reportsGoto('bills-tab')">Bills</button>
                <button type="button" class="settings-small-btn" data-goto="debts-tab" onclick="reportsGoto('debts-tab')">Debts</button>
                <button type="button" class="settings-small-btn" data-goto="attendance-tab" onclick="reportsGoto('attendance-tab')">Attendance</button>
                <button type="button" class="settings-small-btn" data-goto="customers-tab" onclick="reportsGoto('customers-tab')">Customers</button>
                <button type="button" class="settings-small-btn" data-goto="returns-tab" onclick="reportsGoto('returns-tab')">Returns</button>
                <button type="button" class="settings-small-btn" data-goto="kitchen-tab" onclick="reportsGoto('kitchen-tab')">Kitchen</button>
            </div>
        </div>
    </div>
