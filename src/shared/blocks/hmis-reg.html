<!-- HMIS REG (zip 345) ----------------------------------------------------------------------------------------------------------
     Patient registration, made quicker:
       - County, Sub-county and Ward / region are ONE box each that you can type in, search in, or open as a dropdown. Kenya's 47 counties, 290
         sub-counties and Nairobi's 85 wards are built in (works offline). Nairobi is listed first. Anything not on the list can still be typed.
       - Pick a county and the sub-county list shrinks to that county; pick a sub-county and the ward list shrinks to it.
       - The patient you just registered (or edited) is put in front of Reception straight away with the "Where are you going today?" buttons,
         and everyone registered in the last hours who has not been sent on yet sits under the search box as a tap-to-send chip.
       - The Edit button in the patient registry looks and works like Register: same form, same buttons, then the same "send them on" card.
     Classes / ids: hreg-*. Nothing here saves, prices or routes anything by itself. -->
<style id="hreg-css">
.hreg-cb { position: relative; display: block; }
.hreg-cb > input { width: 100%; box-sizing: border-box; padding-right: 44px; }
.hreg-caret { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted, #6b7f84); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.hreg-caret:hover { background: var(--tint-accent, #e4f3ee); color: var(--accent-strong, #0b6d55); }
.hreg-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; max-height: 280px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: var(--bg-surface, #fff); color: var(--dark, #10272a); border: 1px solid var(--border-color, #d6e2ea); border-radius: 12px; box-shadow: 0 12px 32px rgba(8, 24, 26, .22); -webkit-overflow-scrolling: touch; }
.hreg-list[hidden] { display: none; }
.hreg-opt { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 11px 12px; border-radius: 8px; font-size: 15px; cursor: pointer; line-height: 1.25; }
.hreg-opt small { font-size: 12px; color: var(--muted, #6b7f84); white-space: nowrap; }
.hreg-opt.on, .hreg-opt:hover { background: var(--tint-accent, #e4f3ee); }
.hreg-opt mark { background: transparent; color: var(--accent-strong, #0b6d55); font-weight: 800; }
.hreg-none { padding: 12px; font-size: 13.5px; color: var(--muted, #6b7f84); }
.hreg-head { padding: 6px 12px 4px; font-size: 12px; font-weight: 700; color: var(--muted, #6b7f84); }
#hreg-recent { margin: 10px 0 0; }
#hreg-recent:empty { display: none; }
#hreg-recent .hreg-rt { font-size: 13px; font-weight: 700; margin: 0 0 6px; color: var(--accent-strong, #0b6d55); }
#hreg-recent .hreg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
#hreg-recent button { border: 1px solid var(--accent, #0e8567); background: var(--tint-accent, #e4f3ee); color: var(--accent-strong, #0b6d55); border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
#hreg-recent button small { font-weight: 500; opacity: .8; margin-left: 4px; }
#hreg-recent button:hover { background: var(--accent, #0e8567); color: #fff; }
#reception-search-card.hreg-flash > .panel { animation: hregFlash 1.4s ease-out 1; }
@keyframes hregFlash { 0% { box-shadow: 0 0 0 0 rgba(14, 133, 103, .55); } 100% { box-shadow: 0 0 0 16px rgba(14, 133, 103, 0); } }
/* the registry's Edit button looks like the Register button */
#patients-table button[onclick^="editPatient"] { background: var(--accent, #0e8567); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; min-height: 38px; }
#patients-table button[onclick^="editPatient"]:hover { background: var(--accent-strong, #0b6d55); }
html body.hmu #reception-registration-panel > .form-group.hreg-loc { grid-column: auto; }
@media (prefers-reduced-motion: reduce) { #reception-search-card.hreg-flash > .panel { animation: none; } }
</style>

        input.addEventListener('input', function () { showAll = false; render(); });
        input.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) { showAll = !input.value; render(); } else if (items.length) { cur = (cur + 1) % items.length; paint(); } }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { cur = (cur - 1 + items.length) % items.length; paint(); } }
            else if (e.key === 'Enter') { if (!list.hidden && cur >= 0 && items[cur]) { e.preventDefault(); pick(items[cur]); } }
            else if (e.key === 'Escape') { close(); }
            else if (e.key === 'Tab') { if (!list.hidden && cur >= 0 && items[cur] && input.value.trim() && norm(items[cur].label).indexOf(norm(input.value)) === 0) pick(items[cur]); else close(); }
        });
        input.addEventListener('blur', function () { setTimeout(close, 160); });
        caret.addEventListener('mousedown', function (e) { e.preventDefault(); });
        caret.addEventListener('click', function () { if (!list.hidden) { close(); return; } input.focus(); showAll = true; render(); });
        list.addEventListener('mousedown', function (e) { e.preventDefault(); });          // keep the focus in the box
        list.addEventListener('click', function (e) { var li = e.target.closest && e.target.closest('.hreg-opt'); if (li) pick(items[+li.getAttribute('data-i')]); });
    }
    // ---- Reception: the patient who was just registered is right there
    function dayAgo() { return Date.now() - 12 * 3600 * 1000; }
    function waiting() {
        var out = [];
        try {
            patients.forEach(function (p) {
                if (!p || p._deleted || !(+p.registeredAt > dayAgo())) return;
                if (queue.some(function (q) { return q.patientId === p.id && q.status !== 'done'; })) return;          // already sent on
                out.push(p);
            });
        } catch (e) { return []; }
        return out.sort(function (a, b) { return b.registeredAt - a.registeredAt; }).slice(0, 8);
    }
    function recent() {
        var panel = $('reception-search-picker'); if (!panel) return;
        var box = $('hreg-recent');
        if (!box) { box = document.createElement('div'); box.id = 'hreg-recent'; panel.parentNode.insertBefore(box, panel.nextSibling); }
        var w = waiting(), sig = w.map(function (p) { return p.id + ':' + (p.name || '') + ':' + (p.updatedAt || ''); }).join('|');   // zip 356: an edited name shows at once (the chip kept the old name)
        if (box.getAttribute('data-sig') === sig) return;
        box.setAttribute('data-sig', sig);
        box.innerHTML = w.length ? '<div class="hreg-rt">🆕 Registered, not sent on yet - tap a name</div><div class="hreg-chips">' + w.map(function (p) {
            return '<button type="button" onclick="hregPick(\'' + String(p.id).replace(/[\\\']/g, '') + '\')">' + esc(p.name) + '<small>' + esc(p.id) + '</small></button>';
        }).join('') + '</div>' : '';
    }
    window.hregPick = function (id) {
        try { if (typeof onReceptionPatientPicked === 'function') onReceptionPatientPicked(id); } catch (e) { return; }
        var card = $('reception-search-card'); if (card) { card.classList.remove('hreg-flash'); void card.offsetWidth; card.classList.add('hreg-flash'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    };
    window.hregAfterSave = function (id, isNew) {
        if (!id) return;
        var btn = $('reception-tab-btn');
        recent();
        var panel = $('reception-search-picker'); if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        window.hregPick(id);
        void btn; void isNew;
    };
    function run() { try { ['patient-county-input', 'patient-subcounty-input', 'patient-ward-input'].forEach(build); recent(); } catch (e) { /* next tick */ } }
    run(); document.addEventListener('DOMContentLoaded', run); setInterval(run, 1500);
})();
