<!-- AQUA FLOW (zip 348) ---------------------------------------------------------------------------------------------------------------
     The simple Aqua screens, built ON TOP of the zip-333 materials engine (window.AquaMat) - nothing in the engine is rewritten.
       * a material is linked to ITEMS by key "<size ml>:<kind>" (kind = sealed | bale | custom) in material.forItems, e.g. "500:sealed".
         AquaFlow.syncRecipes() turns those links into the recipe lines the engine already understands, so a product created later is picked up
         automatically and every other screen (custom bale orders, production history, reversal) keeps working.
       * Materials tab: one 6-step add/edit form, CSV import / export, and client default bottles.
       * Production tab: 9 plain steps (what, client, bottle, seal, cap, label, wrapping, water tank, extras). Everything is checked first, then done
         in one go, and put back if anything fails. Water comes from a production tank (infinite or metered).
       * Price List & Invoices tab: price list (standard or per client) and invoices that print / share through the existing report window.
     Pure functions are on window.AquaFlow so tests can drive them without the screens. -->

<script>
(function () {

    var mats = function () { return (typeof rawMaterials !== 'undefined' && Array.isArray(rawMaterials)) ? rawMaterials : []; };
    var prods = function () { return (typeof products !== 'undefined' && Array.isArray(products)) ? products : []; };

    var tankList = function () { return (typeof tanks !== 'undefined' && Array.isArray(tanks)) ? tanks : []; };
    var AMx = function () { return window.AquaMat; };
    var nowIso = function () { return new Date().toISOString(); };
    var who = function () { try { return typeof activeServerName === 'function' ? activeServerName() : 'Admin'; } catch (e) { return 'Admin'; } };
    var siteNow = function () { try { return recordSiteId(); } catch (e) { return null; } };
    var isLive = function (m) { return !!m && !m.removed && !m._deleted; };
    var isActive = function (m) { return isLive(m) && m.active !== false; };
    var siteOf = function (m) { try { return matSiteId(m); } catch (e) { return m && m.siteId; } };
    var norm = function (s) { return String(s == null ? '' : s).toLowerCase().replace(/[‘’“”'"`]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); };
    var costPiece = function (m) { try { return typeof matPerPiece === 'function' ? matPerPiece(m) : Number(m.unitCost) || 0; } catch (e) { return Number(m && m.unitCost) || 0; } };
    var stockOf = function (m) { return q3(m && m.stockQty); };

    /* ---------------- sizes, kinds, item keys ---------------- */
    var STD_SIZES = [500, 1000, 1500, 5000, 10000, 18900, 20000];
    var KINDS = [['sealed', 'Sealed bottle'], ['bale', 'Normal bale / case'], ['custom', 'Custom bale / case']];
    var CATS = [['bottle', 'Bottle'], ['cap', 'Cap'], ['seal', 'Seal'], ['label', 'Label / sticker'], ['packaging', 'Wrapping'], ['other', 'Other']];
    var CAT_ICON = { bottle: '🍼', cap: '🧢', seal: '🔒', label: '🏷️', packaging: '📦', other: '🧩' };
    function sizeLabel(ml) { ml = Number(ml) || 0; if (ml <= 1500) return ml + 'ml'; return (Math.round(ml / 100) / 10) + 'L'; }
    function kindLabel(k) { var f = KINDS.filter(function (x) { return x[0] === k; })[0]; return f ? f[1] : k; }
    function catLabel(c) { var f = CATS.filter(function (x) { return x[0] === c; })[0]; return f ? f[1] : (c || 'Other'); }
    function itemLabel(key) { var a = String(key).split(':'); return sizeLabel(a[0]) + ' ' + kindLabel(a[1]).toLowerCase(); }
    function parseSize(s) {
        s = String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, '');
        var m = s.match(/^(\d+(?:\.\d+)?)(ml|l[a-z]*)?$/); if (!m) return 0;
        var n = parseFloat(m[1]), u = m[2];
        if (!u) return n <= 50 ? Math.round(n * 1000) : Math.round(n);        // "5" = 5 litres, "500" = 500 ml
        return u === 'ml' ? Math.round(n) : Math.round(n * 1000);
    }
    function parseKinds(s) {
        var out = [], t = String(s || '').toLowerCase();
        if (!t.trim()) return out;
        t.split(/[;,|\/&]+|\band\b/).forEach(function (part) {
            part = part.trim(); if (!part) return;
            if (part === 'all' || part === 'any') { ['sealed', 'bale', 'custom'].forEach(function (k) { if (out.indexOf(k) < 0) out.push(k); }); return; }
            var k = /custom|executive|brand/.test(part) ? 'custom' : /bale|case|carton/.test(part) ? 'bale' : /seal|bottle|piece/.test(part) ? 'sealed' : '';
            if (k && out.indexOf(k) < 0) out.push(k);

        return out;
    }
    function parseCat(s) {
        var t = norm(s); if (!t) return '';
        if (/^(bottle|bottles|preform)/.test(t)) return 'bottle'; if (/^cap/.test(t)) return 'cap'; if (/^seal|security/.test(t)) return 'seal';
        if (/^(label|sticker)/.test(t)) return 'label'; if (/^(wrap|packag|shrink)/.test(t)) return 'packaging'; if (/^other/.test(t)) return 'other'; return '';
    }
    /* the size (in ml) of a product: its own, its bottle's, or read from its name */
    function sizeOfProduct(p) {
        if (!p) return 0; var s = Number(p.sizeML) || 0;
        if (!s && p.linkedBottleCode) { var b = prods().filter(function (x) { return x.code === p.linkedBottleCode; })[0]; s = b ? Number(b.sizeML) || 0 : 0; }
        if (!s) { var m = String(p.name || '').match(/(\d+(?:\.\d+)?)\s*(ml|l|ltr|ltrs|litre|litres|liter|liters)\b/i); if (m) { var n = parseFloat(m[1]); s = /^ml$/i.test(m[2]) ? n : n * 1000; } }
        return Math.round(s);
    }
    function kindOfProduct(p) {
        if (!p || p.type === 'service' || p._deleted) return '';
        if (p.category === 'bottled') return 'sealed';
        if (p.category === 'bale') return p.baleKind === 'custom' ? 'custom' : 'bale';
        return '';
    }
    function keyOfProduct(p) { var s = sizeOfProduct(p), k = kindOfProduct(p); return (s && k) ? s + ':' + k : ''; }
    AF.sizeLabel = sizeLabel; AF.itemLabel = itemLabel; AF.parseSize = parseSize; AF.parseKinds = parseKinds; AF.keyOfProduct = keyOfProduct; AF.sizeOfProduct = sizeOfProduct; AF.kindOfProduct = kindOfProduct;
    function keysOf(m) { return Array.isArray(m && m.forItems) ? m.forItems : []; }
    function crossKeys(sizes, kinds) { var out = []; sizes.forEach(function (s) { kinds.forEach(function (k) { out.push(s + ':' + k); }); }); return out; }
    function sizesOfKeys(keys) { var o = []; keys.forEach(function (k) { var s = Number(String(k).split(':')[0]); if (s && o.indexOf(s) < 0) o.push(s); }); return o.sort(function (a, b) { return a - b; }); }
    function kindsOfKeys(keys) { var o = []; keys.forEach(function (k) { var x = String(k).split(':')[1]; if (x && o.indexOf(x) < 0) o.push(x); }); return KINDS.map(function (k) { return k[0]; }).filter(function (k) { return o.indexOf(k) >= 0; }); }
    function allSizes() { var o = STD_SIZES.slice(); prods().forEach(function (p) { var s = sizeOfProduct(p); if (s && o.indexOf(s) < 0) o.push(s); }); mats().forEach(function (m) { sizesOfKeys(keysOf(m)).forEach(function (s) { if (o.indexOf(s) < 0) o.push(s); }); }); return o.sort(function (a, b) { return a - b; }); }

    /* ---------------- links -> recipe lines (idempotent) ---------------- */
    var LINE_RULES = { bottle: { optional: false }, cap: { optional: false }, seal: { optional: true }, label: { optional: true }, packaging: { optional: false, perBale: true }, other: { optional: true } };
    function syncOne(p) {
        var key = keyOfProduct(p); if (!key) return false;
        var kind = key.split(':')[1], changed = false, linked = {}, newModel = {};
        mats().forEach(function (m) {
            if (!isLive(m) || !Array.isArray(m.forItems)) return;
            var cat = m.category || 'other'; newModel[m.id] = cat;
            if (m.forItems.indexOf(key) >= 0) (linked[cat] = linked[cat] || []).push(m.id);
        });
        if (!Array.isArray(p.productionRecipe)) { p.productionRecipe = []; }
        var cats = Object.keys(linked);
        p.productionRecipe.forEach(function (r) { if (r && r.lineId && cats.indexOf(r.category) < 0) cats.push(r.category); });
        cats.forEach(function (cat) {
            var ln = p.productionRecipe.filter(function (r) { return r && r.lineId && r.category === cat; })[0], want = linked[cat] || [];
            if (cat === 'bottle' && p.bottleOf && p.bottleMatId) want = [p.bottleMatId];      // zip 365: a bottle's own item uses only that bottle
            if (!ln) {

    /* ---------------- overlay ---------------- */

    /* ================= MATERIAL: 6 simple steps ================= */
    var MF = null;
    function chipRow(items, on, fn) { return items.map(function (it) { return '<button type="button" class="aqf-chip' + (on.indexOf(it[0]) >= 0 ? ' on' : '') + '" onclick="AquaFlow.' + fn + '(\'' + attr(it[0]) + '\')">' + (it[2] || '') + esc(it[1]) + '</button>'; }).join(''); }
    function matChips() {

        if (c1) c1.innerHTML = chipRow(CATS.map(function (c) { return [c[0], c[1], CAT_ICON[c[0]] + ' ']; }), [MF.cat], 'mCat');
        if (c2) c2.innerHTML = chipRow(allSizes().map(function (s) { return [String(s), sizeLabel(s)]; }), MF.sizes.map(String), 'mSize') + '<button type="button" class="aqf-chip" onclick="AquaFlow.mAllSizes()">All sizes</button>';
        if (c3) c3.innerHTML = chipRow(KINDS, MF.kinds, 'mKind');
        if (sm) {
            var ks = crossKeys(MF.sizes, MF.kinds);
            sm.innerHTML = ks.length ? '✔ Offered when producing: <b>' + ks.map(itemLabel).map(esc).join(', ') + '</b>' : 'Not linked to anything yet. Pick at least one size and one item type, or leave both empty and link it later.';
        }
    }
    AF.mCat = function (c) { MF.cat = c; matChips(); };
    AF.mSize = function (s) { s = Number(s); var i = MF.sizes.indexOf(s); if (i >= 0) MF.sizes.splice(i, 1); else MF.sizes.push(s); MF.sizes.sort(function (a, b) { return a - b; }); matChips(); };
    AF.mKind = function (k) { var i = MF.kinds.indexOf(k); if (i >= 0) MF.kinds.splice(i, 1); else MF.kinds.push(k); matChips(); };
    AF.mAllSizes = function () { MF.sizes = MF.sizes.length === allSizes().length ? [] : allSizes(); matChips(); };
