<!-- HMIS RECORDS (zip 351) ------------------------------------------------------------------------------------------------------
     Four things the hospital workflow was missing, added on top of what already exists (nothing here replaces or re-prices anything):
       1. BILLS POPUP        - the "Patient Bills" button opens a pop-up window instead of switching tab. It shows every unpaid patient charge grouped by
                               visit (with "Open in Cashier") and, below it, the normal Bills list (Pay Later bills, Record a Bill, search, closed bills).
       2. PATIENT DATABASE   - a searchable list of every patient (last visit, visits, balance, admitted, chronic conditions) and, for each patient, a
                               full profile: medical history (chronic conditions, past illness, surgery, family, social, current medicines, immunisation,
                               obstetric), the whole timeline, visits, labs, admissions, billing and clinical forms. Print a patient summary.
       3. CLINICAL FORMS     - Nursing Kardex, medication chart (MAR), observation chart, fluid balance chart, nursing notes, handover (SBAR), admission
                               record, discharge summary, referral, consent, blood transfusion record, pre-op checklist, operation notes, anaesthesia
                               record, sick note / medical certificate and death notification. Each is saved against the patient (it appears in the timeline
                               and syncs like any other patient note), can be edited and printed.
       4. WORKFLOW GAPS      - registration (file / card) fee, optionally charged automatically when a NEW patient is registered; waive or discount an
                               unpaid charge with a reason (kept in the audit log); sick note / medical certificate.
     Classes / ids: hrx-*. Patient history is stored on the patient record (patient.history); forms are stored as patient notes (kind 'form'). -->

<script id="hrx-js">
(function () {
    'use strict';
    if (window.__hrx) return; window.__hrx = true;
    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { try { alert(m); } catch (e2) { /* none */ } } }
    function money(n) { return 'KES ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
    function who() { try { return activeServerName() || ''; } catch (e) { return ''; } }
    function dt(ts) { var d = new Date(ts); return isFinite(d) ? d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
    function dd(ts) { var d = new Date(ts); return isFinite(d) ? d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : ''; }

    function nowLocal() { var d = new Date(); return today() + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
    function hospitalName() { var t = $('app-title'); var s = t ? (t.textContent || '') : ''; s = s.replace(/^[^A-Za-z0-9]+/, '').trim(); return s || 'Hospital'; }
    function P() { return (typeof patients !== 'undefined' && Array.isArray(patients)) ? patients : []; }
    function getP(id) { return P().find(function (p) { return p.id === id; }); }
    var GET = {
        visits: function () { return typeof visits !== 'undefined' ? visits : []; },
        queue: function () { return typeof queue !== 'undefined' ? queue : []; },
        labResults: function () { return typeof labResults !== 'undefined' ? labResults : []; },
        admissions: function () { return typeof admissions !== 'undefined' ? admissions : []; },
        patientCharges: function () { return typeof patientCharges !== 'undefined' ? patientCharges : []; },
        patientNotes: function () { return typeof patientNotes !== 'undefined' ? patientNotes : []; }
    };
    function arr(name) { try { var a = GET[name](); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
    function savePatients() { try { safeSetItem('pos_patients', JSON.stringify(patients)); queuePush(); } catch (e) { /* storage */ } }

    /* ---------- overlay helper ---------- */
    var stack = [];
    /* a pop-up that is really a page: its own tab (sidebar entry stays highlighted, other tabs switch normally) */
    function pagePane(id) {
        var p = $(id);
        if (p && p.classList.contains('tab-content')) return p;
        var ref = $('staff-tab') || document.querySelector('.tab-content'); if (!ref || !ref.parentNode) return null;
        if (p && p.parentNode) p.parentNode.removeChild(p);
        p = document.createElement('div'); p.id = id; p.className = 'tab-content';
        ref.parentNode.insertBefore(p, ref.nextSibling); return p;
    }
    function goTab(id) {
        var btn = document.querySelector('.tab-link[data-tab="' + id + '"]');
        try { if (typeof performTabSwitch === 'function') performTabSwitch(btn, id); else { Array.prototype.forEach.call(document.querySelectorAll('.tab-content'), function (x) { x.classList.remove('active'); }); var t = $(id); if (t) t.classList.add('active'); } } catch (e) { /* stay */ }
        try { window.scrollTo(0, 0); } catch (e2) { /* none */ }
    }
    function overlay(title, sub, bodyHtml, opts) {
        opts = opts || {};
        var ov = document.createElement('div'); ov.className = 'hrx-ov';
        var pane = opts.page ? pagePane(opts.page) : null;
        if (pane) ov.className = 'hrx-ov as-page';
        ov.innerHTML = '<div class="hrx-box' + (opts.narrow ? ' hrx-narrow' : '') + '" role="dialog" aria-modal="true"><div class="hrx-head"><h3>' + title + (sub ? '<small>' + sub + '</small>' : '') + '</h3><button type="button" class="hrx-x" aria-label="Close">✕</button></div><div class="hrx-body">' + (bodyHtml || '') + '</div></div>';
        var prev = null;
        if (pane) { var cur = document.querySelector('.tab-content.active'); prev = cur && cur !== pane ? cur.id : null; pane.innerHTML = ''; pane.appendChild(ov); }
        else document.body.appendChild(ov);
        var rec = { ov: ov, body: ov.querySelector('.hrx-body'), head: ov.querySelector('.hrx-head h3'), onClose: opts.onClose || null, pane: pane };
        function close() {
            var i = stack.indexOf(rec); if (i >= 0) stack.splice(i, 1); if (rec.onClose) { try { rec.onClose(); } catch (e) { /* ignore */ } }
            if (pane) {
                var wasOn = pane.classList.contains('active'); pane.innerHTML = '';
                if (wasOn) { var back = prev && document.getElementById(prev) ? prev : 'dashboard-tab'; if (!document.getElementById(back)) back = 'sales-tab'; goTab(back); }
                return;
            }
            if (ov.parentNode) ov.parentNode.removeChild(ov);
        }
        rec.close = close;
        rec.show = function () { if (pane) goTab(pane.id); };
        ov.querySelector('.hrx-x').addEventListener('click', close);
        if (!pane) { ov.addEventListener('mousedown', function (e) { if (e.target === ov && !opts.sticky) close(); }); stack.push(rec); }
        if (pane) rec.show();
        return rec;
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stack.length) { var t = stack[stack.length - 1]; if (t && !t.sticky) t.close(); } });

    /* ======================================================================================================================
       1. BILLS POPUP
       ====================================================================================================================== */
    function unpaidGroups() { try { return pendingBillGroups(''); } catch (e) { return []; } }
    function billsSummaryHtml() {
        var g = unpaidGroups(), total = g.reduce(function (s, x) { return s + x.total; }, 0);
        var html = '<div class="hrx-cards"><div class="hrx-card red"><b>' + g.length + '</b><span>Unpaid patient bills</span></div><div class="hrx-card red"><b>' + esc(money(total)) + '</b><span>Waiting at the cashier</span></div></div>';
        if (g.length) {
            html += '<div class="hrx-sec"><h4>🧾 Unpaid patient charges (by visit)</h4><div class="hrx-list">' + g.slice(0, 60).map(function (x) {
                return '<div class="hrx-item"><div class="grow"><b>' + esc(x.patientName || x.patientId || '') + '</b> <span class="hrx-muted">· ' + esc(x.ref) + ' · ' + esc(dt(x.createdAt)) + '</span><div class="hrx-muted">' + esc(x.charges.map(function (c) { return c.name; }).slice(0, 4).join(', ')) + (x.charges.length > 4 ? ' +' + (x.charges.length - 4) + ' more' : '') + '</div></div><b>' + esc(money(x.total)) + '</b><button type="button" class="hrx-btn sm" data-hrx-cashier="' + esc(x.ref) + '">Open in Cashier</button></div>';
            }).join('') + '</div></div>';
        } else html += '<div class="hrx-sec"><h4>🧾 Unpaid patient charges</h4><p class="hrx-muted" style="margin:0;">Nothing is waiting at the cashier right now.</p></div>';
        return html;
    }
    function billsClick(e) {
        var b = e.target.closest ? e.target.closest('[data-hrx-cashier]') : null;
        if (!b) return;
        var ref = b.getAttribute('data-hrx-cashier');
        try { if (typeof isTabLocked === 'function' && isTabLocked('sales-tab')) { var bt = $('sales-tab-btn'); if (bt) bt.click(); return; } performTabSwitch($('sales-tab-btn'), 'sales-tab'); } catch (e2) { /* stay */ }
        try { loadPatientBill(ref); } catch (e3) { /* shown in the cashier search */ }
    }
    /* Patient Bills is the normal Bills tab with the unpaid-charges summary on top (no pop-up) */
    function openBills() {
        var tab = $('bills-tab'); if (!tab) return;
        var top = $('hrx-bills-top');
        if (!top) { top = document.createElement('div'); top.id = 'hrx-bills-top'; top.className = 'hrx-bills-top'; tab.insertBefore(top, tab.firstChild); tab.addEventListener('click', billsClick); }
        top.innerHTML = billsSummaryHtml();
        goTab('bills-tab');
        try { if (typeof renderBillsTab === 'function') renderBillsTab(); } catch (e) { /* the list is rendered on the next change */ }
    }
    // The button (and the sidebar entry, which clicks the real button) opens the pop-up. A locked tab keeps its password prompt: then the old behaviour runs.
    document.addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('.tab-link[data-tab="bills-tab"]') : null;
        if (!b) return;
        try { if (typeof isTabLocked === 'function' && isTabLocked('bills-tab')) return; } catch (e1) { /* open it */ }
        e.preventDefault(); e.stopImmediatePropagation();
        openBills();
    }, true);
    window.hrxOpenBills = openBills;

    /* ======================================================================================================================
       2. PATIENT DATABASE
       ====================================================================================================================== */
    var CHRONIC = ['Hypertension', 'Diabetes', 'Asthma / COPD', 'HIV', 'Tuberculosis (past/current)', 'Epilepsy', 'Sickle cell disease', 'Heart disease', 'Kidney disease', 'Cancer', 'Arthritis', 'Peptic ulcer / gastritis', 'Mental health condition', 'Stroke', 'Hepatitis B/C'];
    var dbRec = null, dbState = { q: '', f: 'all', sort: 'recent', limit: 80 };
    function statsFor(p) {
        var vs = arr('visits').filter(function (v) { return v.patientId === p.id && !v.voided; });
        var last = vs.reduce(function (m, v) { return Math.max(m, v.timestamp || 0); }, 0);
        var lq = arr('queue').filter(function (q) { return q.patientId === p.id; }).reduce(function (m, q) { return Math.max(m, q.arrivedAt || 0); }, 0);
        var bal = arr('patientCharges').filter(function (c) { return c.patientId === p.id && c.status === 'unpaid'; }).reduce(function (s, c) { return s + (Number(c.price) || 0) * (Number(c.qty) || 0); }, 0);
        var adm = arr('admissions').some(function (a) { return a.patientId === p.id && !a.dischargedAt; });
        return { visits: vs.length, last: Math.max(last, lq), bal: bal, admitted: adm, chronic: (p.history && p.history.chronic) || [] };
    }
    function dbRows() {
        var q = dbState.q.trim().toLowerCase(), f = dbState.f, sod = new Date(); sod.setHours(0, 0, 0, 0);
        var rows = P().map(function (p) { return { p: p, s: statsFor(p) }; }).filter(function (r) {
            if (q) {
                var hay = [r.p.name, r.p.id, r.p.phone, r.p.altPhone, r.p.nationalId, r.p.sha, r.p.shaNumber, r.p.email].join(' ').toLowerCase();
                if (hay.indexOf(q) < 0) return false;
            }
            if (f === 'admitted') return r.s.admitted;
            if (f === 'balance') return r.s.bal > 0;
            if (f === 'chronic') return r.s.chronic.length > 0;
            if (f === 'today') return r.s.last >= sod.getTime();
            if (f === 'allergy') return !!(r.p.allergies && String(r.p.allergies).trim() && !/^(none|nil|no|n\/a)$/i.test(String(r.p.allergies).trim()));
            return true;
        });
        rows.sort(function (a, b) { return dbState.sort === 'name' ? String(a.p.name).localeCompare(String(b.p.name)) : dbState.sort === 'new' ? (b.p.registeredAt || 0) - (a.p.registeredAt || 0) : (b.s.last || b.p.registeredAt || 0) - (a.s.last || a.p.registeredAt || 0); });
        return rows;
    }
    function dbRender() {
        if (!dbRec) return;
        var all = P(), rows = dbRows(), host = $('hrx-db-rows');
        if (!host) return;
        var bal = 0, adm = 0, chr = 0;
        all.forEach(function (p) { var s = statsFor(p); bal += s.bal; if (s.admitted) adm++; if (s.chronic.length) chr++; });
        $('hrx-db-cards').innerHTML = '<div class="hrx-card"><b>' + all.length + '</b><span>Patients on file</span></div><div class="hrx-card"><b>' + adm + '</b><span>Currently admitted</span></div><div class="hrx-card"><b>' + chr + '</b><span>With chronic conditions</span></div><div class="hrx-card red"><b>' + esc(money(bal)) + '</b><span>Unpaid charges</span></div>';
        var shown = rows.slice(0, dbState.limit);
        host.innerHTML = shown.length ? shown.map(function (r) {
            var p = r.p, s = r.s, tags = '';
            if (s.admitted) tags += '<span class="hrx-pill blue">Admitted</span>';
            if (s.bal > 0) tags += '<span class="hrx-pill red">Owes ' + esc(money(s.bal)) + '</span>';
            if (p.allergies && !/^(none|nil|no|n\/a)$/i.test(String(p.allergies).trim())) tags += '<span class="hrx-pill amber">Allergy</span>';

            '<div class="hrx-bar"><label class="hrx-checks"><span><input type="checkbox" id="hrx-svc-arch"> Show archived</span></label><span class="hrx-muted" id="hrx-svc-count"></span><span style="margin-left:auto" class="hrx-bar"><input type="text" id="hrx-sb-pct" inputmode="decimal" placeholder="% e.g. 10 or -5" style="flex:0 1 130px"><button type="button" class="hrx-btn sec" id="hrx-sb-go">Change prices in this list</button><button type="button" class="hrx-btn sec" id="hrx-svc-csv">⬇ CSV</button></span></div>' +
            '<datalist id="hrx-svc-dl"></datalist><div class="hrx-tablewrap"><table class="hrx-tbl"><thead><tr><th>Code</th><th>Service</th><th>Category</th><th>Price (KES)</th><th>Unit</th><th></th></tr></thead><tbody id="hrx-svc-rows"></tbody></table></div><div style="text-align:center;margin-top:12px"><button type="button" class="hrx-btn sec" id="hrx-svc-more">Show more</button></div>',
            { page: 'hrx-svc', onClose: function () { svcRec = null; } });
        svcRec = rec; var b = rec.body;
        b.querySelector('#hrx-sn-add').addEventListener('click', svcAdd);
        b.querySelector('#hrx-sb-go').addEventListener('click', svcBulk);
        b.querySelector('#hrx-svc-csv').addEventListener('click', svcCsv);
        b.querySelector('#hrx-svc-q').addEventListener('input', function (e) { svcState.q = e.target.value; svcState.limit = 150; svcRenderRows(); });
        b.querySelector('#hrx-svc-cat').addEventListener('change', function (e) { svcState.cat = e.target.value; svcState.limit = 150; svcRenderRows(); });
        b.querySelector('#hrx-svc-arch').addEventListener('change', function (e) { svcState.archived = e.target.checked; svcRenderRows(); });
        b.querySelector('#hrx-svc-more').addEventListener('click', function () { svcState.limit += 200; svcRenderRows(); });
        b.querySelector('#hrx-svc-rows').addEventListener('change', function (e) {
            var inp = e.target.closest('[data-f]'), tr = e.target.closest('tr[data-code]'); if (!inp || !tr) return;
            var it = invList().find(function (x) { return x.code === tr.getAttribute('data-code') && x.type === 'service'; }); if (!it) return;
            var f = inp.getAttribute('data-f'), v = inp.value.trim();
            if (f === 'price') { var n = Number(v.replace(/,/g, '')); if (!isFinite(n) || n < 0) { toast('Enter a valid price.', true); inp.value = it.price; return; } it.price = n; }
            else if (f === 'name') { if (!v) { toast('A service needs a name.', true); inp.value = it.name; return; } if (invList().some(function (x) { return x !== it && x.type === 'service' && String(x.name).trim().toLowerCase() === v.toLowerCase(); })) { toast('Another service already has that name.', true); inp.value = it.name; return; } it.name = v; }
            else if (f === 'category') { it.category = v || 'General'; }
            else if (f === 'unit') { it.unit = v || 'use'; }
            it.updatedAt = Date.now(); svcSave();
            if (f === 'category') svcRender();
        });
        b.querySelector('#hrx-svc-rows').addEventListener('click', function (e) {
            var btn = e.target.closest('[data-sa]'), tr = e.target.closest('tr[data-code]'); if (!btn || !tr) return;
            var code = tr.getAttribute('data-code'), it = invList().find(function (x) { return x.code === code && x.type === 'service'; }); if (!it) return;
            if (btn.getAttribute('data-sa') === 'arch') { it.archived = !it.archived; it.updatedAt = Date.now(); svcSave(); toast(it.archived ? '"' + it.name + '" archived - it no longer appears for billing.' : '"' + it.name + '" restored.'); svcRender(); }
            else if (confirm('Delete "' + it.name + '" permanently?\n\n(Archive keeps it but hides it from billing.)')) { inventory = inventory.filter(function (x) { return !(x.code === code && x.type === 'service'); }); svcSave(); toast('Deleted "' + it.name + '".'); svcRender(); }
        });
        svcRender();
    }
    function svcRenderRows() { svcRender(); }   // the search box is never re-created, so typing keeps its focus
    window.hrxOpenServices = openServices;

    /* ---- Reception: the lab tests are chosen when the patient is sent to the laboratory ---- */
    function labFor(pid) { if (window.hmisOpenRequestLabFor) window.hmisOpenRequestLabFor(pid); }
    function wrapSend() {
        if (window.receptionSendTo && !window.receptionSendTo.__hrx) {
            var orig = window.receptionSendTo;
            window.receptionSendTo = function (pid, stationId) {
                var before = queue.length, r = orig.apply(this, arguments);
                try { var st = hmisStation(stationId); if (st && st.kind === 'lab') labFor(pid); } catch (e) { /* none */ }
                try { if (queue.length >= before) slipFor(pid, true); } catch (e) { /* none */ }
                return r;
            };
            window.receptionSendTo.__hrx = true;
        }
    }
    /* ---- patient slip: what the patient carries from Reception, so he can quote his number at triage, the lab or the cashier ---- */
    function slipFor(pid, ask) {
        var p = patients.find(function (x) { return x.id === pid; }); if (!p) return;
        var q = queue.filter(function (x) { return x.patientId === pid && hmisActive(x); }).sort(function (a, b) { return (b.stationAt || 0) - (a.stationAt || 0); })[0];
        if (ask && !confirm('Print a slip for ' + p.name + ' to carry (patient number, queue ticket and where to go)?')) return;
        var dest = q ? (function () { try { return pipelineStageLabel(hmisStationOf(q)); } catch (e) { return q.service || ''; } })() : 'Reception';
        var tk = q ? hmisTicket(q) : '-';
        printHtml('Patient slip', '<div style="text-align:center;border:3px solid #0050b8;border-radius:14px;padding:18px;margin-top:10px"><div style="font-size:13px;color:#555;letter-spacing:.08em">PATIENT NUMBER</div><div style="font-size:46px;font-weight:800;color:#0050b8;letter-spacing:.04em;word-break:break-all">' + esc(p.id) + '</div><div style="font-size:22px;font-weight:700;margin:4px 0 10px">' + esc(p.name) + '</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><div style="border:2px solid #de0a12;border-radius:12px;padding:8px 22px"><small style="color:#555">QUEUE TICKET</small><div style="font-size:36px;font-weight:800;color:#de0a12">' + esc(tk) + '</div></div><div style="border:2px solid #0050b8;border-radius:12px;padding:8px 22px"><small style="color:#555">PLEASE GO TO</small><div style="font-size:22px;font-weight:800;color:#0050b8;margin-top:8px">' + esc(dest) + '</div></div></div><p style="margin:14px 0 0;color:#444">Keep this slip. Quote your <b>patient number</b> at the triage desk, the laboratory, the pharmacy and the cashier.</p><p style="color:#777;font-size:11px;margin:6px 0 0">' + new Date().toLocaleString('en-GB') + (p.phone ? '' : '') + '</p></div>');
    }
    window.hmisPrintPatientSlip = slipFor;
    function labButton() {
        var card = document.getElementById('reception-search-card'); if (!card || card.querySelector('.hrx-labreq')) return;
        var oc = (card.querySelector('[onclick*="receptionSendTo"]') || {}).outerHTML || '', mm = /receptionSendTo\(\s*&?#?[a-z0-9]*;?'?([^',&]+)/i.exec(oc); var pid = mm && mm[1]; if (!pid || !card.querySelector('.panel')) return;
        var box = document.createElement('div'); box.className = 'hrx-labreq'; box.style.cssText = 'margin-top:10px;padding:10px 12px;border:2px dashed #1e6fd0;border-radius:10px;background:#eefaf5;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
        box.innerHTML = '<span style="flex:1;min-width:180px;font-size:13px;color:#14634f"><strong>🧪 Lab tests needed?</strong> Pick the tests now. The patient pays at the cashier, then goes to the lab.</span><button type="button" class="hrx-btn" style="width:auto">🧪 Request lab tests</button><button type="button" class="hrx-btn sec hrx-slipbtn" style="width:auto">🖨️ Print patient slip</button>';
        box.querySelector('button').onclick = function () { labFor(pid); };
        box.querySelector('.hrx-slipbtn').onclick = function () { slipFor(pid, false); };
        card.querySelector('.panel').appendChild(box);
    }
    setInterval(function () { try { wrapSend(); labButton(); } catch (e) { /* next tick */ } }, 700);

    /* ---- meals and nursing / procedure charges live in the inventory too, so they can be edited there ---- */
    var HM = [['mn_porridge', 'Meal: Porridge', 80, 'Meals & Diet', 'meal'], ['mn_tea', 'Meal: Tea & bread', 100, 'Meals & Diet', 'meal'], ['mn_lunch', 'Meal: Standard lunch', 250, 'Meals & Diet', 'meal'], ['mn_supper', 'Meal: Standard supper', 250, 'Meals & Diet', 'meal'], ['mn_soft', 'Meal: Soft diet meal', 200, 'Meals & Diet', 'meal'], ['mn_diab', 'Meal: Diabetic meal', 280, 'Meals & Diet', 'meal'], ['ct_nursing', 'Nursing care (per day)', 500, 'Nursing & Procedures', 'day'], ['ct_dressing', 'Dressing / procedure', 300, 'Nursing & Procedures', 'use'], ['ct_oxygen', 'Oxygen therapy (per day)', 1500, 'Nursing & Procedures', 'day']];
    function ensureMeals() {
        try {
            if (localStorage.getItem('pos_hrx_hm') === '1' || typeof inventory === 'undefined') return;
            var added = 0;
            HM.forEach(function (r) {
                var code = 'HM-' + r[0]; if (inventory.some(function (i) { return i && i.code === code; })) return;
                inventory.push({ type: 'service', code: code, name: r[1].replace(/^Meal: /, ''), price: r[2], wholesalePrice: 0, minimumPrice: 0, unit: r[4], qty: null, location: '', category: r[3], vatCategory: 'E', image: null, updatedAt: Date.now() }); added++;
            });
            if (added) { svcSave(); }
            localStorage.setItem('pos_hrx_hm', '1');
        } catch (e) { /* next start */ }
    }

    /* ======================================================================================================================
       6. PRICE LIST - every price in the hospital on one page
       ====================================================================================================================== */
    var prRec = null, PR = { tab: 'med', q: '', zero: false, limit: 150 };
    function prDefaultFee() { try { return Number(localStorage.getItem('pos_hrx_consultfee')) || 500; } catch (e) { return 500; } }
    window.hrxDefaultFee = prDefaultFee;
    function prWards() { var w = { General: 1 }; try { Object.keys(bedTypes || {}).forEach(function (b) { w[bedTypes[b] || 'General'] = 1; }); } catch (e) { /* General only */ } return Object.keys(w).sort(); }
    function prRows() {
        var t = PR.tab, q = PR.q.toLowerCase(), rows = [];
        if (t === 'med') rows = invList().filter(function (x) { return x && x.type === 'item' && !x.archived; }).map(function (x) { return { key: x.code, code: x.code, name: x.name, cat: x.category || '', price: Number(x.price) || 0, buy: Number(x.wholesalePrice) || 0, qty: x.qty }; });
        else if (t === 'svc') rows = invList().filter(function (x) { return x && x.type === 'service' && !x.archived; }).map(function (x) { return { key: x.code, code: x.code, name: x.name, cat: x.category || '', price: Number(x.price) || 0 }; });
        else if (t === 'lab') rows = (window.hmisLab ? window.hmisLab.tests() : []).filter(function (x) { return x.active !== false; }).map(function (x) { return { key: x.id, code: x.code || '', name: x.name, cat: x.category || '', price: Number(x.price) || 0 }; });
        if (q) rows = rows.filter(function (r) { return (r.name + ' ' + r.code + ' ' + r.cat).toLowerCase().indexOf(q) >= 0; });
        return rows;
    }
    function prCounts() {
        var med = invList().filter(function (x) { return x && x.type === 'item' && !x.archived; }), svc = invList().filter(function (x) { return x && x.type === 'service' && !x.archived; }), lab = window.hmisLab ? window.hmisLab.tests().filter(function (x) { return x.active !== false; }) : [];
        var z = function (a) { return a.filter(function (x) { return !(Number(x.price) > 0); }).length; };
        return { med: [med.length, z(med)], svc: [svc.length, z(svc)], lab: [lab.length, z(lab)] };
    }
    function prRender() {
        if (!prRec) return; var b = prRec.body, c = prCounts();
        var tabs = [['med', '💊 Medicines & items', c.med], ['svc', '🩺 Services', c.svc], ['lab', '🧪 Lab tests', c.lab], ['bed', '🛏️ Beds & wards'], ['fee', '🧾 Fees']];
        var h = '<div class="hrx-tabs">' + tabs.map(function (t) { return '<button type="button" class="hrx-tab' + (PR.tab === t[0] ? ' on' : '') + '" data-prt="' + t[0] + '">' + t[1] + (t[2] ? ' <span class="hrx-badge">' + t[2][0] + (t[2][1] ? ' · ' + t[2][1] + ' unpriced' : '') + '</span>' : '') + '</button>'; }).join('') + '</div>';
        if (PR.tab === 'med' || PR.tab === 'svc' || PR.tab === 'lab') {
            var rows = prRows(), shown = PR.zero ? rows.filter(function (r) { return !(r.price > 0); }) : rows, more = shown.length > PR.limit;
            h += '<div class="hrx-bar"><input type="search" id="hrx-pr-q" placeholder="Search name, code or category" value="' + esc(PR.q) + '"><label class="hrx-checks"><span><input type="checkbox" id="hrx-pr-z"' + (PR.zero ? ' checked' : '') + '> Only unpriced (0)</span></label><span class="hrx-muted">' + shown.length + ' shown</span></div>';
            h += '<div class="hrx-tablewrap"><table class="hrx-tbl"><thead><tr><th>Code</th><th>Name</th><th>Category</th>' + (PR.tab === 'med' ? '<th>Buying</th>' : '') + '<th>Selling (KES)</th>' + (PR.tab === 'med' ? '<th>In stock</th>' : '') + '</tr></thead><tbody>' + shown.slice(0, PR.limit).map(function (r) {
                return '<tr data-k="' + esc(r.key) + '"><td>' + esc(r.code) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.cat) + '</td>' + (PR.tab === 'med' ? '<td><input type="number" min="0" step="any" data-f="buy" value="' + r.buy + '" style="width:90px"></td>' : '') + '<td><input type="number" min="0" step="any" data-f="price" value="' + r.price + '" style="width:100px' + (r.price > 0 ? '' : ';border-color:#c0392b;background:#fdecea') + '"></td>' + (PR.tab === 'med' ? '<td><input type="number" min="0" step="any" data-f="qty" value="' + (r.qty == null ? 0 : esc(Number(r.qty) || 0)) + '" style="width:90px" title="Amount available - change it to correct the stock"></td>' : '') + '</tr>';
            }).join('') + '</tbody></table></div>' + (more ? '<div class="hrx-foot"><button type="button" class="hrx-btn sec" id="hrx-pr-more">Show more</button></div>' : '') +
                '<p class="hrx-muted">' + (PR.tab === 'med' ? 'Prices and the quantity in stock can be changed here (a changed quantity is recorded as a stock movement). Batches and expiry dates: Pharmacy &amp; Inventory &gt; Edit hospital list. New medicines: Add Item.' : (PR.tab === 'svc' ? 'Add, archive or change prices in bulk in the Services Catalogue.' : 'Tests are added or edited in the Lab Catalogue.')) + '</p>';
        } else if (PR.tab === 'bed') {
            var by = window.hmisPrice ? window.hmisPrice.bed() : {};
            h += '<div class="hrx-sec"><h4>🛏️ Daily rates per ward</h4><p class="hrx-muted">Used when a patient is admitted or moved to a bed in that ward.</p><div class="hrx-tablewrap"><table class="hrx-tbl"><thead><tr><th>Ward</th><th>Bed / day (KES)</th><th>Nursing / day (KES)</th></tr></thead><tbody>' + prWards().map(function (w) {
                var r = by[w] || {}; return '<tr data-w="' + esc(w) + '"><td>' + esc(w) + '</td><td><input type="number" min="0" data-f="bed" value="' + (r.bed != null ? r.bed : 1500) + '" style="width:110px"></td><td><input type="number" min="0" data-f="nur" value="' + (r.nursing != null ? r.nursing : 500) + '" style="width:110px"></td></tr>';
            }).join('') + '</tbody></table></div><p class="hrx-muted">Meals, nursing care, dressing and oxygen are in the Services tab (Meals & Diet, Nursing & Procedures).</p></div>';
        } else {
            var rf = regFeeCfg();
            h += '<div class="hrx-sec"><h4>🧾 Standard fees</h4><div class="hrx-grid"><div><label>Default consultation fee (KES)</label><input type="number" min="0" id="hrx-pf-consult" value="' + prDefaultFee() + '"></div><div><label>Registration / file fee (KES)</label><input type="number" min="0" id="hrx-pf-reg" value="' + rf.amt + '"></div></div><p class="hrx-muted">The consultation fee pre-fills the doctor\'s visit form (the doctor can still change it). Switch the registration fee on or off in the Patient Database.</p><div class="hrx-foot"><button type="button" class="hrx-btn" id="hrx-pf-save">💾 Save fees</button></div></div>';
        }
        b.innerHTML = h;
        var q = b.querySelector('#hrx-pr-q'); if (q) { q.addEventListener('input', function (e) { PR.q = e.target.value; PR.limit = 150; var pos = e.target.selectionStart; prRender(); var n = prRec.body.querySelector('#hrx-pr-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }
    }
    function prSaveRow(tr, inp) {
        var f = inp.getAttribute('data-f'), v = Number(String(inp.value).replace(/,/g, ''));
        if (!isFinite(v) || v < 0) { toast('Enter a valid price.', true); return; }
        if (PR.tab === 'bed') {
            var w = tr.getAttribute('data-w'), bd = Number(tr.querySelector('[data-f="bed"]').value) || 0, nu = Number(tr.querySelector('[data-f="nur"]').value) || 0;
            if (window.hmisPrice) window.hmisPrice.setBed(w, bd, nu); toast('Saved ' + w + ' rates.'); return;
        }
        var key = tr.getAttribute('data-k');
        if (f === 'qty') {                                              // zip 367: the quantity in stock, edited right in the price list (same rule as the stock list editor)
            if (typeof window.hmisStockSet === 'function') { if (window.hmisStockSet(key, v)) toast('Stock saved.'); else toast('Stock unchanged.'); }
            else toast('The stock editor is not ready yet - try again in a moment.', true);
            return;
        }
        if (PR.tab === 'lab') { if (window.hmisPrice) window.hmisPrice.setLab(key, v); }
        else { var it = invList().find(function (x) { return x.code === key; }); if (!it) return; if (f === 'buy') it.wholesalePrice = v; else it.price = v; it.updatedAt = Date.now(); svcSave(); }
        try { logAudit('Price changed', key, f + ' = ' + v); } catch (e) { /* none */ }
        inp.style.borderColor = ''; inp.style.background = ''; if (f === 'price' && !(v > 0)) { inp.style.borderColor = '#c0392b'; inp.style.background = '#fdecea'; }
        toast('Saved.');
    }
    function openPrices() {
        if (prRec) { prRec.show(); prRender(); return; }
        PR = { tab: 'med', q: '', zero: false, limit: 150 };
        prRec = overlay('💰 Price List', 'Everything the hospital charges, in one place - edit any price and it takes effect straight away', '', { page: 'hrx-price', onClose: function () { prRec = null; } });
        var b = prRec.body;
        b.addEventListener('click', function (e) {
            var t = e.target.closest('[data-prt]'); if (t) { PR.tab = t.getAttribute('data-prt'); PR.q = ''; PR.limit = 150; prRender(); return; }
            if (e.target.closest('#hrx-pr-more')) { PR.limit += 200; prRender(); return; }
            if (e.target.closest('#hrx-pf-save')) {
                var c = Number(b.querySelector('#hrx-pf-consult').value), r = Number(b.querySelector('#hrx-pf-reg').value);
                if (!(c >= 0) || !(r >= 0)) { toast('Enter valid amounts.', true); return; }
                try { localStorage.setItem('pos_hrx_consultfee', String(c)); localStorage.setItem('pos_hrx_regfee_amt', String(r)); } catch (x) { /* none */ }
                toast('Fees saved.');
            }
        });
        b.addEventListener('change', function (e) {
            if (e.target.id === 'hrx-pr-z') { PR.zero = e.target.checked; prRender(); return; }
            var inp = e.target.closest('[data-f]'), tr = e.target.closest('tr'); if (inp && tr) prSaveRow(tr, inp);
        });
        prRender();
    }
    window.hrxOpenPrices = openPrices;

    /* a single fixed pop-up that is toggled with a class (Edit hospital list, Lab Catalogue) becomes a page of its own: moved into a tab, shown there, and closing it returns to the tab you came from */
    window.hrxPageify = function (el, id, cls) {
        try {
            var pane = pagePane(id); if (!el || !pane) return;
            var cur = document.querySelector('.tab-content.active'); el.__prev = cur && cur !== pane ? cur.id : (el.__prev || 'dashboard-tab');
            if (el.parentNode !== pane) pane.appendChild(el);
            el.classList.add('hrx-page2');
            if (!el.__pg) { el.__pg = true; new MutationObserver(function () { if (!el.classList.contains(cls) && pane.classList.contains('active')) goTab(document.getElementById(el.__prev) ? el.__prev : 'dashboard-tab'); }).observe(el, { attributes: true, attributeFilter: ['class'] }); }
            goTab(id);
        } catch (e) { /* the pop-up still works where it is */ }
    };
    window.hrxUI = { overlay: overlay, esc: esc, toast: toast, who: who, dt: dt, dd: dd };
    /* ---- start-up ---- */
    function init() {
        addNavButton(); hookRegistration(); ensureMeals();
        // a reload on one of these pages: the page was empty, so build it again
        [['hrx-pdb', openDb], ['hrx-svc', openServices], ['hrx-price', openPrices]].forEach(function (x) { var p = $(x[0]); if (p && p.classList.contains('active') && !p.firstChild) { try { x[1](); } catch (e) { /* stay */ } } });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 300); }); else setTimeout(init, 300);
    setTimeout(init, 1500); setTimeout(init, 4000);
})();
</script>
