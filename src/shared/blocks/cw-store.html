<!-- CW STORE ---------------------------------------------------------------------------------------
     Car Wash & Cleaning app, block "cw-store". Written ONLY into carwash/index.html; never hand-edit it there.
     KIND: state + storage + network (NOT pure). Plain global functions, ES2018 max, every global name starts with cw / Cw / CW_.
     OWNS: the synced lists (cwCustomers cwVehicles cwJobs cwPayments cwLoyalty cwSms cwAudit cwComplaints cwConfig), their local copies
     (pos_cw_*), the sync hooks (cwSyncCollect / cwSyncApply, called from collectSyncPayload / applyRemotePayload), every mutation (customers,
     vehicles, jobs, status, assignments, payments, loyalty ledger, SMS queue, complaints, staff), photos, and the one-time import of the
     car wash jobs a shop kept in the Services app (cwMigrateFromServices).
     RULES: records are never hard-deleted; every write stamps updatedAt; money and loyalty are recomputed (cw-core) from the records.
     After editing run `npm run sync`; `npm run check` fails if carwash/index.html differs from this file. -->
<script>
/* ===================================================================================================================
   CAR WASH STORE
   =================================================================================================================== */
var CW_LISTS = ['cwCustomers', 'cwVehicles', 'cwJobs', 'cwPayments', 'cwLoyalty', 'cwSms', 'cwAudit', 'cwComplaints', 'cwConfig', 'cwExpenses', 'cwCashups', 'cwSupplies', 'cwSupplyMoves'];   // zip 394: expenses, daily cash-ups, supplies and their stock movements
var CW_KEYS = { cwCustomers: 'pos_cw_customers', cwVehicles: 'pos_cw_vehicles', cwJobs: 'pos_cw_jobs', cwPayments: 'pos_cw_payments', cwLoyalty: 'pos_cw_loyalty', cwSms: 'pos_cw_sms', cwAudit: 'pos_cw_audit', cwComplaints: 'pos_cw_complaints', cwConfig: 'pos_cw_config' , cwExpenses: 'pos_cw_expenses', cwCashups: 'pos_cw_cashups', cwSupplies: 'pos_cw_supplies', cwSupplyMoves: 'pos_cw_supply_moves' };
var CW_AUDIT_CAP = 5000;
var CW_SMS_MAX_TRIES = 4;
var CW_LISTENERS = [];
var CW_ST = { smsFlushing: false, smsCfg: null, smsCfgAt: 0, smsTimer: null, emitT: null, migrating: false, photoUrls: {} };

let cwCustomers = [];
let cwVehicles = [];
let cwJobs = [];
let cwPayments = [];
let cwLoyalty = [];
let cwSms = [];
let cwAudit = [];
let cwComplaints = [];
let cwConfig = [];
let cwExpenses = [];
let cwCashups = [];
let cwSupplies = [];
let cwSupplyMoves = [];

function cwList(n) {
  switch (n) {
    case 'cwCustomers': return cwCustomers; case 'cwVehicles': return cwVehicles; case 'cwJobs': return cwJobs; case 'cwPayments': return cwPayments;
    case 'cwLoyalty': return cwLoyalty; case 'cwSms': return cwSms; case 'cwAudit': return cwAudit; case 'cwComplaints': return cwComplaints; case 'cwConfig': return cwConfig;
    case 'cwExpenses': return cwExpenses; case 'cwCashups': return cwCashups; case 'cwSupplies': return cwSupplies; case 'cwSupplyMoves': return cwSupplyMoves;
    default: return null;
  }
}
function cwSetList(n, a) {
  switch (n) {
    case 'cwCustomers': cwCustomers = a; break; case 'cwVehicles': cwVehicles = a; break; case 'cwJobs': cwJobs = a; break; case 'cwPayments': cwPayments = a; break;
    case 'cwLoyalty': cwLoyalty = a; break; case 'cwSms': cwSms = a; break; case 'cwAudit': cwAudit = a; break; case 'cwComplaints': cwComplaints = a; break; case 'cwConfig': cwConfig = a; break;
    case 'cwExpenses': cwExpenses = a; break; case 'cwCashups': cwCashups = a; break; case 'cwSupplies': cwSupplies = a; break; case 'cwSupplyMoves': cwSupplyMoves = a; break;
    default: break;
  }
}
function cwIsRec(r) { return !!r && typeof r === 'object' && !Array.isArray(r) && r.id != null && r.id !== ''; }
function cwNow() { return Date.now(); }
function cwRid(prefix) {
  var r = '', i, b = null;
  try { if (typeof crypto !== 'undefined' && crypto.getRandomValues) { b = new Uint8Array(6); crypto.getRandomValues(b); } } catch (e) { b = null; }
  for (i = 0; i < 6; i++) r += ((b ? b[i] : Math.floor(Math.random() * 256)) % 36).toString(36);
  return prefix + Date.now().toString(36) + r;
}
function cwDevice() { try { return typeof getOrCreateDeviceId === 'function' ? String(getOrCreateDeviceId() || '') : ''; } catch (e) { return ''; } }
function cwStamp(r) { r.updatedAt = Math.max(cwNow(), cwNum(r.updatedAt) + 1); return r; }

/* ---- load / save / push ---- */
function cwSave(n) {
  if (n === undefined) { CW_LISTS.forEach(function (x) { cwSave(x); }); return true; }
  var k = CW_KEYS[n], a = cwList(n), s;
  if (!k || !Array.isArray(a)) return false;
  try { s = JSON.stringify(a); } catch (e) { return false; }
  try { if (typeof safeSetItem === 'function') return safeSetItem(k, s) !== false; localStorage.setItem(k, s); return true; } catch (e2) { return false; }
}
function cwLoad() {
  CW_LISTS.forEach(function (n) {
    var raw = [];
    try { if (typeof safeJSONParse === 'function') raw = safeJSONParse(CW_KEYS[n], []); else { var t = localStorage.getItem(CW_KEYS[n]); raw = t ? JSON.parse(t) : []; } } catch (e) { raw = []; }
    cwSetList(n, (Array.isArray(raw) ? raw : []).filter(cwIsRec));
  });
  cwJobs.forEach(function (j) { cwDerive(j); });
  return true;
}
function cwPush() { try { if (typeof queuePush === 'function') queuePush(); else if (typeof markLocalDirty === 'function') markLocalDirty(); } catch (e) { /* the record is saved on this device either way */ } }
function cwOn(fn) { if (typeof fn === 'function') CW_LISTENERS.push(fn); }
function cwEmit(why) {
  clearTimeout(CW_ST.emitT);
  CW_ST.emitT = setTimeout(function () { CW_LISTENERS.forEach(function (fn) { try { fn(why || 'change'); } catch (e) { /* a screen never breaks the store */ } }); }, 30);
}
/* the ONE write path: stamp, save the list(s), audit, push, tell the screens */
function cwCommit(names, auditRow) {
  if (auditRow) cwLogRow(auditRow);
  (Array.isArray(names) ? names : [names]).concat(auditRow ? ['cwAudit'] : []).forEach(function (n) { cwSave(n); });
  cwPush(); cwEmit(names);
}
function cwState() {
  return { customers: cwCustomers, vehicles: cwVehicles, jobs: cwJobs, payments: cwPayments, loyalty: cwLoyalty, complaints: cwComplaints, staff: cwStaffAll(), cfg: cwCfg() };
}

/* ---- sync hooks ---- */
function cwSyncCollect() {
  var out = {};
  CW_LISTS.forEach(function (n) { var a = cwList(n); if (Array.isArray(a) && a.length) out[n] = a.map(function (r) { if (!r || !r._s) return r; var c = Object.assign({}, r); delete c._s; return c; }); });
  return out;
}
/* merge what a pull carries into the local lists: per record, the newer updatedAt wins; records this device has that the pull lacks stay
   (they are on their way to the server). Jobs are re-derived after a merge. Also runs the one-time import from Services when the pull carries it. */
/* zip 362: the server never sends deleted records back (it strips tombstones from a pull), and a pull always carries the whole Car Wash list.
   So a record this device got from the server before (_s) that is missing from the server's list now was DELETED on another device: it becomes
   a local tombstone. A record the server has never had (created here, still on its way) has no _s and stays. */
function cwMergeList(local, incoming, full) {
  var by = {}, out = [], i, r, seen = {};
  for (i = 0; i < local.length; i++) { r = local[i]; if (cwIsRec(r)) by[String(r.id)] = r; }
  if (full) {
    for (i = 0; i < incoming.length; i++) { if (cwIsRec(incoming[i])) seen[String(incoming[i].id)] = 1; }
    Object.keys(by).forEach(function (k) { var x = by[k]; if (x._s && !seen[k] && x._deleted !== true) { var t = Object.assign({}, x, { _deleted: true, deletedAt: cwNow() }); delete t._s; by[k] = t; } });
  }
  for (i = 0; i < incoming.length; i++) {
    r = incoming[i]; if (!cwIsRec(r)) continue;
    var cur = by[String(r.id)];
    /* zip 362: a deletion is final (ids are never re-used): a newer stale copy from a device that had not seen it yet cannot bring the record back */
    if (cur && cur._deleted === true && r._deleted !== true) continue;
    if (!cur || r._deleted === true || cwNum(r.updatedAt) >= cwNum(cur.updatedAt)) { if (full && r._deleted !== true && !r._s) { r = Object.assign({}, r, { _s: 1 }); } by[String(r.id)] = r; }
    else if (full && !cur._s) { cur._s = 1; }
  }
  Object.keys(by).forEach(function (k) { out.push(by[k]); });
  return out;
}
function cwSyncApply(data) {
  if (!data || typeof data !== 'object') return false;
  var any = false;
  CW_LISTS.forEach(function (n) {
    if (!Array.isArray(data[n])) return;
    var merged = cwMergeList(cwList(n) || [], data[n], n !== 'cwAudit');   /* the audit log may be capped on the server: never infer deletions from it */
    if (n === 'cwJobs') merged.sort(function (a, b) { return cwNum(a.createdAt) - cwNum(b.createdAt); });
    cwSetList(n, merged); cwSave(n); any = true;
  });
  if (any) cwJobs.forEach(function (j) { cwDerive(j); });
  try { if (Array.isArray(data.svcJobs) && data.svcJobs.length) cwMigrateFromServices(data); } catch (e) { /* the import is retried on the next pull */ }
  if (any) cwEmit('sync');
  return any;
}

/* ---- configuration ---- */
function cwCfg() { var c = cwFind(cwConfig, 'cfg'); var out = cwCompleteConfig(c); if (!out.business.name) { try { out.business.name = typeof businessName !== 'undefined' && businessName ? String(businessName) : ''; } catch (e) { /* none */ } } return out; }
function cwSaveCfg(patch, what) {
  var cur = cwFind(cwConfig, 'cfg'), base = cwCompleteConfig(cur), next = Object.assign({}, base, patch || {});
  cwStamp(next);
  if (cur) cwConfig = cwConfig.map(function (r) { return r && r.id === 'cfg' ? next : r; }); else cwConfig = cwConfig.concat([next]);
  cwCommit('cwConfig', { act: 'settings', ref: what || 'Settings', detail: Object.keys(patch || {}).join(', ') });
  return next;
}

/* ---- who is using the app ---- */
function cwStaffAll() { try { return typeof staff !== 'undefined' && Array.isArray(staff) ? staff : []; } catch (e) { return []; } }
function cwMemberRole(m) {
  if (!m) return 'owner';
  if (m.cwActive === false || m.removed) return 'none';
  var r = String(m.cwRole || '');
  if (CW_PERMS[r] && r !== 'owner') return r;
  return m.isManager ? 'manager' : 'cashier';
}
function cwMe() {
  var cs = null; try { cs = typeof currentServer !== 'undefined' ? currentServer : null; } catch (e) { cs = null; }
  if (!cs) return { id: 'owner', name: 'Admin', role: 'owner', owner: true };
  var m = cwFind(cwStaffAll(), cs.id) || { id: cs.id, name: cs.name };
  return { id: String(cs.id), name: String(m.name || cs.name || 'Staff'), role: cwMemberRole(m), owner: false, member: m };
}
/* the staff member's own screens (null = the role's screens) */
function cwTabsOf(me) { if (!me || me.owner || !me.member || me.role === 'none') return null; return cwCleanTabs(me.member.cwTabs); }
function cwCan(perm, me) {
  me = me || cwMe();
  var list = CW_PERMS[me.role] || [];
  if (list.indexOf('*') !== -1) return true;
  var tabs = cwTabsOf(me);
  if (tabs) {
    var navPerm = CW_TABS.some(function (t) { return t.p === perm; });
    if (navPerm) return CW_TABS.some(function (t) { return t.p === perm && tabs.indexOf(t.r) !== -1; });
    if (perm === 'jobs.view') return tabs.indexOf('jobs') !== -1 || tabs.indexOf('cleaning') !== -1 || tabs.indexOf('myjobs') !== -1;
  }
  if (list.indexOf(perm) !== -1) return true;
  if (perm === 'jobs.view') return list.indexOf('jobs.all') !== -1 || list.indexOf('jobs.mine') !== -1;
  return false;
}
function cwStaffName(id) { var m = cwFind(cwStaffAll(), id); return m ? String(m.name || '') : ''; }
function cwActiveStaff() { return cwStaffAll().filter(function (m) { return m && !m.removed && m.cwActive !== false; }); }

/* ---- audit ---- */
function cwLogRow(o) {
  var me = cwMe();
  var row = { id: cwRid('cwa-'), at: cwNow(), by: me.name, byId: me.id, role: me.role, act: cwStr(o.act), ref: cwStr(o.ref).slice(0, 80), jobId: o.jobId || '', detail: cwStr(o.detail).slice(0, 300) };
  cwStamp(row);
  cwAudit.push(row);
  if (cwAudit.length > CW_AUDIT_CAP) cwAudit = cwAudit.slice(cwAudit.length - CW_AUDIT_CAP);
  return row;
}
function cwLog(act, ref, detail, jobId) { cwLogRow({ act: act, ref: ref, detail: detail, jobId: jobId }); cwSave('cwAudit'); cwPush(); }

/* ---- customers / vehicles ---- */
function cwCustomerByPhone(phone) { var p = cwNormPhone(phone); if (!p) return null; var i; for (i = 0; i < cwCustomers.length; i++) { var c = cwCustomers[i]; if (c && !c._deleted && c.phone === p) return c; } return null; }
function cwVehicleByPlate(plate) { var p = cwNormPlate(plate); if (!p) return null; var i; for (i = 0; i < cwVehicles.length; i++) { var v = cwVehicles[i]; if (v && !v._deleted && v.plate === p) return v; } return null; }
var CW_CUST_FIELDS = ['name', 'altPhone', 'email', 'gender', 'contactPref', 'type', 'location', 'estate', 'town', 'building', 'house', 'floor', 'notes'];
/* one customer per phone number: an existing number updates that customer (only the fields given), never a second record */
function cwUpsertCustomer(o, opts) {
  o = o || {}; opts = opts || {};
  var phone = cwNormPhone(o.phone), name = cwStr(o.name).trim();
  if (o.phone && !phone) return { ok: false, error: 'Enter a valid Kenyan mobile number (07XX or 01XX).' };
  if (o.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cwStr(o.email).trim())) return { ok: false, error: 'That email address does not look right.' };
  if (!phone && !name) return { ok: false, error: 'Enter the customer\'s name or phone number.' };
  var c = (o.id && cwFind(cwCustomers, o.id)) || (phone && cwCustomerByPhone(phone)) || null;
  if (c && phone && c.phone !== phone) { var other = cwCustomerByPhone(phone); if (other && other.id !== c.id) return { ok: false, error: 'That phone number already belongs to ' + (other.name || 'another customer') + '.' }; }
  var created = false;
  if (!c) { c = { id: cwRid('cwc-'), createdAt: cwNow(), createdBy: cwMe().name, type: CW_CUST_TYPES.some(function (t) { return t.k === o.defaultType; }) ? o.defaultType : 'car_owner' }; cwCustomers.push(c); created = true; }
  if (phone) c.phone = phone;
  CW_CUST_FIELDS.forEach(function (k) {
    if (o[k] === undefined) return;
    var v = k === 'altPhone' ? (cwNormPhone(o[k]) || cwStr(o[k]).trim()) : cwStr(o[k]).trim();
    if (k === 'type' && !CW_CUST_TYPES.some(function (t) { return t.k === v; })) return;
    if (k === 'gender' && !CW_GENDERS.some(function (t) { return t.k === v; })) return;
    if (k === 'contactPref' && !CW_CONTACT_PREFS.some(function (t) { return t.k === v; })) return;
    if (k === 'email') v = v.toLowerCase();
    if (v === '' && !created && opts.keepBlank !== false && (k === 'name')) return;   /* a blank name never wipes a known one */
    c[k] = v;
  });
  if (!c.name) c.name = phone ? cwFmtPhone(phone) : 'Walk-in';
  cwStamp(c);
  if (!opts.noCommit) cwCommit('cwCustomers', { act: created ? 'customer.add' : 'customer.edit', ref: c.name, detail: cwFmtPhone(c.phone) });
  return { ok: true, customer: c, created: created };
}
function cwUpsertVehicle(o, opts) {
  o = o || {}; opts = opts || {};
  var plate = cwNormPlate(o.plate);
  if (!cwValidPlate(plate)) return { ok: false, error: 'Enter the registration number (e.g. KDA 123X).' };
  var v = (o.id && cwFind(cwVehicles, o.id)) || cwVehicleByPlate(plate), created = false;
  if (v && v.plate !== plate) { var dup = cwVehicleByPlate(plate); if (dup && dup.id !== v.id) return { ok: false, error: cwFmtPlate(plate) + ' is already registered.' }; }
  if (v && o.customerId && v.customerId && v.customerId !== o.customerId) {
    if (!opts.transfer) return { ok: false, code: 'owner', vehicle: v, error: cwFmtPlate(plate) + ' is registered to another customer.' };
    v.ownerHistory = cwArr(v.ownerHistory).concat([{ id: cwRid('oh-'), from: v.customerId, to: o.customerId, at: cwNow(), by: cwMe().name }]);
  }
  if (o.year != null && o.year !== '' && !/^(19[5-9]\d|20\d\d)$/.test(cwStr(o.year).trim())) return { ok: false, error: 'Enter the year of manufacture as 4 digits (e.g. 2014).' };
  if (!v) { v = { id: cwRid('cwv-'), createdAt: cwNow(), category: cwDefaultCat(cwCfg()) }; cwVehicles.push(v); created = true; }
  v.plate = plate;
  ['make', 'model', 'year', 'colour', 'category', 'notes', 'customerId'].forEach(function (k) { if (o[k] !== undefined && (o[k] !== '' || k === 'notes' || k === 'year')) v[k] = cwStr(o[k]).trim(); });
  if (!v.category) v.category = cwDefaultCat(cwCfg());
  cwStamp(v);
  if (!opts.noCommit) cwCommit('cwVehicles', { act: created ? 'vehicle.add' : 'vehicle.edit', ref: cwFmtPlate(plate), detail: [v.make, v.model].filter(Boolean).join(' ') });
  return { ok: true, vehicle: v, created: created };
}
/* zip 362: remove a customer / a vehicle. The record stays as a tombstone (synced, so every device drops it) and every past job, payment,
   invoice and report keeps its name and plate. A customer or vehicle with a job still in progress cannot be removed. */
function cwOpenJobsOf(pred) { return cwJobs.filter(function (j) { return j && !j._deleted && pred(j) && !cwIsCancelled(j) && cwNum(j.phase) < 3 && !j.closedAt; }); }   /* phase 3 = collected / delivered / on-site done */
function cwDeleteCustomer(id) {
  var c = cwFind(cwCustomers, id); if (!c || c._deleted) return { ok: false, error: 'Customer not found.' };
  if (!cwCan('customers.delete')) return { ok: false, error: 'Only the owner or a manager can remove a customer.' };
  var open = cwOpenJobsOf(function (j) { return j.customerId === id; });
  if (open.length) return { ok: false, error: c.name + ' has ' + open.length + ' job(s) still in progress (' + open.slice(0, 3).map(function (j) { return j.no; }).join(', ') + '). Finish or cancel them first.' };
  var at = cwNow(), vs = cwVehiclesOf(id);
  c._deleted = true; c.deletedAt = at; c.deletedBy = cwMe().name; cwStamp(c);
  vs.forEach(function (v) { v._deleted = true; v.deletedAt = at; cwStamp(v); });
  cwSave('cwVehicles');
  cwCommit('cwCustomers', { act: 'customer.delete', ref: c.name, detail: cwFmtPhone(c.phone) + (vs.length ? ' · ' + vs.map(function (v) { return cwFmtPlate(v.plate); }).join(', ') : '') });
  return { ok: true, vehicles: vs.length };
}
function cwDeleteVehicle(id) {
  var v = cwFind(cwVehicles, id); if (!v || v._deleted) return { ok: false, error: 'Vehicle not found.' };
  if (!cwCan('customers.edit')) return { ok: false, error: 'You are not allowed to change customers.' };
  var open = cwOpenJobsOf(function (j) { return j.vehicleId === id; });
  if (open.length) return { ok: false, error: cwFmtPlate(v.plate) + ' has a job still in progress (' + open[0].no + ').' };
  v._deleted = true; v.deletedAt = cwNow(); cwStamp(v);
  cwCommit('cwVehicles', { act: 'vehicle.delete', ref: cwFmtPlate(v.plate), detail: [v.make, v.model].filter(Boolean).join(' ') });
  return { ok: true };
}
function cwVehiclesOf(customerId) { return cwVehicles.filter(function (v) { return v && !v._deleted && v.customerId === customerId; }); }
function cwJobsOf(customerId) { return cwJobs.filter(function (j) { return j && !j._deleted && j.customerId === customerId; }).sort(function (a, b) { return cwNum(b.receivedAt || b.createdAt) - cwNum(a.receivedAt || a.createdAt); }); }

/* ---- job numbers: <prefix>-YYMMDD-<n>, with the till number when the shop runs more than one till, never re-used ---- */
function cwNextNo(kind, at) {
  var cfg = cwCfg(), pre = cwStr(kind === 'clean' ? cfg.numbering.clean : cfg.numbering.car).replace(/[^A-Za-z0-9]/g, '').toUpperCase() || (kind === 'clean' ? 'CL' : 'CW');
  var day = cwDayKey(at || cwNow()).replace(/-/g, '').slice(2), till = 0;
  try { till = typeof tillNumber === 'function' ? Number(tillNumber()) || 0 : 0; } catch (e) { till = 0; }
  var stem = pre + '-' + day + '-' + (till > 1 ? till + '-' : ''), n = 0, taken = {};
  cwJobs.forEach(function (j) { if (j && j.no) { taken[j.no] = true; if (String(j.no).indexOf(stem) === 0) { var k = parseInt(String(j.no).slice(stem.length), 10); if (k > n) n = k; } } });
  var no = stem + cwPad(n + 1, 3);
  while (taken[no]) { n++; no = stem + cwPad(n + 1, 3); }
  return no;
}
function cwInvoiceNo(job) { var cfg = cwCfg(); return (cwStr(cfg.numbering.invoice).replace(/[^A-Za-z0-9]/g, '').toUpperCase() || 'INV') + '-' + cwStr(job.no).replace(/^[A-Za-z]+-/, ''); }

/* ---- loyalty for a job about to be created / an existing job ---- */
function cwLoyaltyFor(kind, customer, vehicle, cleanType) {
  var cfg = cwCfg(), fake = { kind: kind, customerId: customer && customer.id, cleaning: { type: cleanType } };
  var key = cwLoyaltyKey(fake, customer && customer.phone, vehicle && vehicle.plate, cfg);
  return cwLoyaltyAccount(cwLoyalty, key, cfg, cwJobs);
}

/* ---- jobs ---- */
function cwHist(job, s, note, at) {
  var me = cwMe();
  job.statusHistory = cwArr(job.statusHistory).concat([{ id: cwRid('sh-'), s: s, at: at || cwNow(), by: me.name, byId: me.id, note: cwStr(note).slice(0, 200) }]);
}
function cwItemLines(items) {
  return cwArr(items).map(function (it) {
    if (!it) return null;
    var name = cwStr(it.name).trim(); if (!name) return null;
    var price = cwNum(it.price), qty = it.qty == null || it.qty === '' ? 1 : cwNum(it.qty);
    return { id: it.id || cwRid('li-'), serviceId: it.serviceId || '', name: name, price: price < 0 ? 0 : cwRound(price), qty: qty > 0 ? qty : 1 };
  }).filter(Boolean);
}
/* input: {kind, customer{...}, vehicle{...}, items[], discount, staffIds[], teamId, estMinutes, receivedAt, dueAt, instructions, condition,
   cleaning{type, dims, qty, pickup{location, estate, building, house, floor, landmark}, scheduledAt, expectedAt, delivery}, useFree, transfer} */
function cwCreateJob(input) {
