<!-- UX POLISH (zip 298) ---------------------------------------------------------------------------------------------------------------
     One small stylesheet for every app: bigger tap targets on touch screens (the "Completed here today" / "Find a patient" folds were 23 px tall),
     a tidy "label + control" row that never squeezes a heading beside a button, and the look of the new date-of-birth picker. CSS only. -->
<style id="ux-polish-css">
details > summary { cursor: pointer; padding-block: 9px; }
@media (hover: none), (max-width: 820px) {
  details > summary { min-height: 40px; padding-block: 11px; box-sizing: border-box; }
  .settings-small-btn { min-height: 38px; }
}
.age-readout { margin-top: 6px; padding: 7px 10px; border-radius: 8px; background: var(--tint-info-bg, #eaf2f8); color: var(--dark, #2c3e50); font-size: 13px; line-height: 1.35; }
.age-readout.ok { background: #eafaf1; color: #1e6b45; font-weight: 700; }
.age-readout.bad { background: #fdecea; color: #b03a2e; font-weight: 700; }
.age-fallback { margin-top: 6px; font-size: 13px; }
.age-fallback > summary { color: var(--primary, #0b7a5f); font-weight: 600; }
.age-fallback-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
html[data-theme="dark"] .age-readout { background: rgba(255,255,255,.07); color: #dfe8e4; }
html[data-theme="dark"] .age-readout.ok { background: rgba(46,204,113,.16); color: #7be3a8; }
html[data-theme="dark"] .age-readout.bad { background: rgba(231,76,60,.18); color: #ff9d92; }
/* a heading / label that sits right after a button must start its own line (the visit form's "Procedures / Nursing / Other Fees" was squeezed beside + Add Medication) */
.ux-block-label { display: block; clear: both; margin-top: 14px; }
details.visit-fold { border-top: 1px solid var(--border-color, #e2ded1); margin-top: 6px; }
details.visit-fold > summary { font-weight: 700; font-size: 15px; }
details.visit-fold[open] > summary { margin-bottom: 6px; }
/* Laboratory tab: one tidy request row (was a broken stack with two Request buttons) + the lab-history card */
.lab-req-grid { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,2fr) auto; gap: 10px 14px; align-items: end; margin-bottom: 14px; }
.lab-req-grid .form-group { margin: 0; }
.lab-req-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-bottom: 2px; }
.lab-req-actions .btn-main { width: auto; margin: 0; padding: 11px 20px; }
@media (max-width: 820px) { .lab-req-grid { grid-template-columns: 1fr; } .lab-req-actions .btn-main { flex: 1 1 100%; } .lab-req-actions .settings-small-btn { flex: 1 1 calc(50% - 4px); } }
.lab-hist-card { border: 1px solid var(--border-color, #e2ded1); border-left: 4px solid #2980b9; border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; background: var(--bg-surface, #fff); }
.lab-hist-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.lab-hist-row { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1.5fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border-color, #eee); }
.lab-hist-row.crit { background: rgba(231,76,60,.07); border-left: 3px solid var(--danger, #c0392b); padding-left: 8px; }
.lab-hist-name { font-weight: 700; } .lab-hist-meta { font-size: 12px; color: #7f8c8d; }
@media (max-width: 640px) { .lab-hist-row { grid-template-columns: 1fr auto; } .lab-hist-result { grid-column: 1 / -1; order: 3; } }
/* zip 300: the Restock list (code | item | unit | qty | cost | wholesale | retail | total | delete) needed ~1250 px and ran off the right edge on a laptop, hiding Retail price and the delete button: slimmer cells on screens wide enough for a table */
@media (min-width: 1100px) {
  #restock-rows-table { table-layout: fixed; width: 100%; min-width: 0 !important; }
  #restock-rows-table th { min-width: 0 !important; padding: 8px 6px; font-size: 11px; white-space: normal; }
  #restock-rows-table td { padding: 5px 4px; }
  html body #restock-rows-table input, html body #restock-rows-table select { box-sizing: border-box; width: 100%; min-width: 0; max-width: 100%; padding: 8px 8px !important; font-size: 14px !important; }
  #restock-rows-table th:nth-child(1) { width: 110px; }
  #restock-rows-table th:nth-child(2) { width: 22%; }
  #restock-rows-table th:nth-child(3) { width: 88px; }
  #restock-rows-table th:last-child { width: 48px; }
  #restock-rows-table td:nth-child(1) > div > input[type=text] { flex: 1 1 auto; width: auto !important; min-width: 0; }
}
/* zip 300: the "N items need attention - Retry" strip and the app-update strip are not shown (records stay safe on the device and retry by themselves; the app updates itself the next time it opens) */
#sync-attention-bar, #native-update-bar { display: none !important; }
/* zip 387: no red banner on screen. "N sales not stored yet", "this device's storage is full" and "this device's clock is wrong" are not shown;
   the saving and resending behind them keeps running by itself (nothing is lost, nothing changes for the cashier). */
#unsaved-sales-bar, #storage-full-bar, #journal-clock-banner { display: none !important; }
</style>
