<!-- HIDE COUNTER BUTTONS (zip 217) --------------------------------------
         Settings > View: hide the 🧾 Bills button and/or the 💰 Sales button on the Sales Counter. Shop-wide (every device). Off by default = nothing changes.
         Only the buttons (and their panels) are hidden; no sale, bill or total changes, and the Bills / Daily Sales tabs still show everything. -->
<style>
    html.hide-ctr-bills #my-bills-toggle-btn, html.hide-ctr-bills #my-bills-panel { display: none !important; }
    html.hide-ctr-sales #my-sales-toggle-btn, html.hide-ctr-sales #my-sales-panel, html.hide-ctr-sales #pos-sq-panel { display: none !important; }
    html.hide-ctr-bills.hide-ctr-sales #my-bills-bar:not(:has(#grid-sort-btn)) { display: none !important; }   /* zip 356: the ⇅ Sort button lives in this bar */
</style>
<script>
(function () {
    var KB = 'pos_hide_ctr_bills', KS = 'pos_hide_ctr_sales';
    function on(k) { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } }
    function apply() { document.documentElement.classList.toggle('hide-ctr-bills', on(KB)); document.documentElement.classList.toggle('hide-ctr-sales', on(KS)); }
    apply();
    function rec(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function mk(k, id) { return { get: function () { var r = rec(k); return r === null ? undefined : r === '1'; }, set: function (v) { try { localStorage.setItem(k, v ? '1' : '0'); } catch (e) { /* this visit only */ } apply(); var c = document.getElementById(id); if (c) c.checked = !!v; } }; }
    /* zip 217: shop-wide - the choices travel to every device (see extraSettingsCollect / Apply) */
    window.__shopSwitches = window.__shopSwitches || {};
    window.__shopSwitches.hideCtrBills = mk(KB, 'hide-ctr-bills-toggle');
    window.__shopSwitches.hideCtrSales = mk(KS, 'hide-ctr-sales-toggle');
    window.setHideCounterBtn = function (which, v) {
        try { localStorage.setItem(which === 'bills' ? KB : KS, v ? '1' : '0'); } catch (e) { /* kept for this visit only */ }
        apply();
        try { if (typeof rxPush === 'function') rxPush(); } catch (e) { /* the next change sends it */ }
        try { showToast((which === 'bills' ? 'The Bills button' : 'Daily Sales on the counter') + (v ? ' is hidden.' : ' is back.')); } catch (e) { /* cosmetic */ }
    };
    var KP = 'pos_sales_pinned';
    /* zip 244: the Daily Sales pin is per device (not shop-wide); the Hotel has its own panel code, the other apps use receipt-extras' */
    window.setSalesPinned = function (on) {
        if (typeof window.mySalesSetPinned === 'function') window.mySalesSetPinned(on);
        else if (typeof window.posSqPin === 'function') window.posSqPin(on);
        else { try { localStorage.setItem(KP, on ? '1' : '0'); } catch (e) { /* this visit only */ } }
        try { showToast(on ? 'Daily Sales will stay open on the Sales Counter.' : 'Daily Sales is no longer pinned on the Sales Counter (Money > Daily Sales always has it).'); } catch (e) { /* cosmetic */ }
    };
    function mount() {
        var sec = (window.__viewSection && window.__viewSection()) || document.getElementById('settings-section-general');
        if (!sec) return;
        var ex = document.getElementById('hide-ctr-card');
        if (ex) { if (ex.parentNode !== sec) { var ad = document.getElementById('hide-adhoc-card'); sec.insertBefore(ex, ad && ad.parentNode === sec ? ad.nextSibling : (sec.children[1] || null)); } return; }   // zip 219: just move it into Settings > View
        var d = document.createElement('div');
        d.id = 'hide-ctr-card'; d.className = 'settings-row';
        d.style.cssText = 'flex-direction:column; align-items:stretch; gap:6px; margin:12px 0; padding:12px 14px; border-radius:12px; background:rgba(127,140,141,.12);';
        d.innerHTML = '<div style="font-weight:700; font-size:14px;">🙈 Sales Counter buttons</div>'
            + '<label id="hide-ctr-bills-row" style="display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer;"><input type="checkbox" id="hide-ctr-bills-toggle" style="width:auto;" onchange="setHideCounterBtn(\'bills\', this.checked)"> Hide the 🧾 Bills button</label>'
            + '<label style="display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer;"><input type="checkbox" id="hide-ctr-sales-toggle" style="width:auto;" onchange="setHideCounterBtn(\'sales\', this.checked)"> Hide Daily Sales on the Sales Counter</label>'
            + '<label style="display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer;"><input type="checkbox" id="sales-pin-toggle" style="width:auto;" onchange="setSalesPinned(this.checked)"> 📌 Keep the Daily Sales panel open (always visible)</label>'
            + '<p class="settings-hint" style="margin:0;">Daily Sales pin: ticked = the day\'s Total / Cash / M-Pesa stays on the Sales Counter all the time; unticked = it is not pinned (the 💰 Sales button is now the ⇅ Sort button; Money > Daily Sales always has the totals). This choice is for THIS device only.</p>'
            + '<p class="settings-hint" style="margin:0;">Applies to every device of this shop; untick to bring a button back. Nothing is deleted — the Bills and Daily Sales tabs still show everything.</p>';
        var after = document.getElementById('hide-adhoc-card');
        if (after && after.parentNode === sec) sec.insertBefore(d, after.nextSibling); else sec.insertBefore(d, sec.firstChild && sec.firstChild.nextSibling ? sec.firstChild.nextSibling : sec.firstChild);
        var pin = document.getElementById('sales-pin-toggle'); if (pin) pin.checked = rec(KP) === '1';
        document.getElementById('hide-ctr-bills-toggle').checked = on(KB);
        document.getElementById('hide-ctr-sales-toggle').checked = on(KS);
        if (!document.getElementById('my-bills-toggle-btn')) document.getElementById('hide-ctr-bills-row').style.display = 'none';   // only the Hotel has a Bills button here
    }
    function go() { mount(); setTimeout(mount, 900); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();
</script>
