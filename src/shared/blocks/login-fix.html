<!-- LOGIN FIX (zip 346) ------------------------------------------------------------------------------------------------------------
     "I reset the password in the Owner Console and it still says Incorrect password."
     The password is checked against the copy of the hash stored ON THE DEVICE. A reset is written on the server and only reaches a device when
     it syncs. These cases can end in "Incorrect password" with the right new password typed:
       1. The device had not synced yet (the app was just opened, or sat in the background: a hidden app only syncs every 5 minutes), so the old
          hash was still on the device.
       2. The temporary password was pasted from WhatsApp / SMS / an email with a space or a line break at the end.
       3. The device's own sync was stuck (unsent work it could not send), and a stuck device skips the pull that carries the reset.
     What this block does (nothing about how passwords are stored changes):
       - Before the login / management-password check runs, if the typed password does not match: try it without surrounding spaces, then fetch
         the server's own copy of the password and try again (this works even when the device's normal sync is stuck). If it matches, it is
         accepted; if not, the normal "Incorrect password" shows.
       - The password boxes tell phone keyboards not to capitalise or auto-correct.
     Ids: none. Pure helpers are in window.__loginFix. -->

    }

            .then(function (r) { return r.ok ? r.json() : null; })

            .catch(function () { return null; });

    // -> the typed form that is correct, or null.  A password that matches only the server's copy is saved on the device so the normal check passes.

    function boot() { install(); [400, 1500, 4000, 10000].forEach(function (ms) { setTimeout(install, ms); }); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); }); else setTimeout(boot, 0);
    W.__loginFix = { candidates: candidates, resolve: resolve, prep: prep, install: install, serverHashes: serverHashes };

</script>
