<!-- TILL PAYMENTS (zip 259) -------------------------------------------------------------------------------------------------------
     Sales Counter -> "Till Payments": money customers paid straight to the shop's M-PESA Till (Safaricom calls our server - nothing here polls
     Safaricom). Newest first, each with the name Safaricom supplied, the amount, the M-PESA code, the payment time and Unlinked / Applied.
     A cashier picks a payment and matches it to a BILL (the instalment goes through the app's own bill-settlement code, so the balance, status,
     receipt, tokens and e-TIMS behave exactly as when the cashier types the code) or to a SALE that was recorded as M-PESA without a proven
     receipt. The server links a code ONCE (functions/api/till-payments.js); the bill / sale carries the code back (tillCode) so it traces both ways.
     Nothing is applied until the cashier confirms the summary. Every function is guarded: a page lacking something does nothing. -->
<style id="tp-css">

<script>
(function () {
  'use strict';
  if (window.__tillPay) return;
  var TP = window.__tillPay = { rows: [], status: 'ALL', more: false, next: 0, loading: false, error: '', sel: null, kind: 'bill', pick: null, busy: false, unlinked: 0 };

  function esc(s) { try { if (typeof escapeHtml === 'function') return escapeHtml(s); } catch (e) { /* below */ } return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(m, bad) { try { if (typeof showToast === 'function') showToast(m, !!bad); } catch (e) { /* cosmetic */ } }
  function money(n) { return 'KES ' + (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function when(ms) { if (!ms) return ''; try { return new Date(ms).toLocaleString('en-KE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function url(p) { try { return typeof apiUrl === 'function' ? apiUrl(p) : p; } catch (e) { return p; } }
  function hasBills() { try { return typeof bills !== 'undefined' && Array.isArray(bills) && typeof getOpenBillsList === 'function' && typeof confirmBillSettleImpl === 'function'; } catch (e) { return false; } }
  function hasSales() { try { return typeof salesLog !== 'undefined' && Array.isArray(salesLog); } catch (e) { return false; } }
  function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  // ---------------------------------------------------------------- server calls
  function call(method, path, body) {
    return fetch(url(path), { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (d) { d.__status = res.status; return d; }); });
  }
  function load(more) {
    if (TP.loading) return Promise.resolve();
    TP.loading = true; TP.error = ''; render();
    var q = '/api/till-payments?limit=25' + (TP.status !== 'ALL' ? '&status=' + TP.status : '') + (more && TP.next ? '&before=' + TP.next : '');
    return call('GET', q).then(function (d) {
      if (d.__status >= 400 || !Array.isArray(d.payments)) throw new Error(d.error || 'Could not load');
      TP.rows = more ? TP.rows.concat(d.payments) : d.payments; TP.more = !!d.more; TP.next = d.next || 0;
      if (typeof d.unlinked === 'number') { TP.unlinked = d.unlinked; badge(); } else if ((TP.status === 'UNLINKED' || TP.status === 'ALL') && !more) { TP.unlinked = TP.rows.filter(function (r) { return r.status === 'UNLINKED'; }).length; badge(); }
    }).catch(function (e) { TP.error = (typeof netErrText === 'function' ? netErrText('Could not load Till Payments') : 'Could not load Till Payments. Check your connection and try again.'); })
      .then(function () { TP.loading = false; render(); });
  }
  function badge() { var b = document.getElementById('tp-badge'); if (b) { b.hidden = !TP.unlinked; b.textContent = TP.unlinked >= 25 ? '25+' : String(TP.unlinked); } }

  // ---------------------------------------------------------------- the button on the Sales Counter
  // zip 262: a compact "Till" button beside Hold sale in the checkout header (no banner). Shown ONLY when Safaricom Daraja is saved for this
  // business — read from the existing /api/gateway-config booleans (never a secret); any error leaves it hidden.
  var cfgBusy = false, CFG_KEY = 'pos_till_daraja', CFG_TTL = 3600000;   // cached on this device for an hour: one extra config read per hour at most, not per page load
  function cfgRead() { try { var o = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); return o && typeof o.at === 'number' ? o : null; } catch (e) { return null; } }
  function applyDaraja(on) { var b = document.getElementById('tp-open-btn'); if (b) b.hidden = !on; TP.daraja = !!on; if (on) startWatch(); else stopWatch(); }
  function refreshDaraja(force) {
    var c = cfgRead();
    if (!force && c && Date.now() - c.at < CFG_TTL) { applyDaraja(c.on); return; }
    if (cfgBusy) return;
    cfgBusy = true;
    fetch(typeof apiUrl === 'function' ? apiUrl('/api/gateway-config') : '/api/gateway-config').then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { var on = !!(j && j.hasDarajaConfig); try { localStorage.setItem(CFG_KEY, JSON.stringify({ at: Date.now(), on: on })); } catch (e) { /* not cached */ } applyDaraja(on); if (on) load(false); })
      .catch(function () { applyDaraja(false); }).then(function () { cfgBusy = false; });
  }
  TP.refreshDaraja = refreshDaraja; TP.applyDaraja = applyDaraja;
  /* opening Settings > Payment Gateway (or saving there) re-reads the config, so the button follows a change at once */
  try { var _cpgs = window.checkPaymentGatewayStatus; if (typeof _cpgs === 'function' && !_cpgs.__tp) { var w = function () { var r = _cpgs.apply(this, arguments); Promise.resolve(r).then(function () { refreshDaraja(true); }, function () {}); return r; }; w.__tp = 1; window.checkPaymentGatewayStatus = w; } } catch (e) { /* cosmetic */ }

  // ---------------------------------------------------------------- zip 283: live watch - a payment made straight to the Till shows up by itself
  // Every ~20 s (only while the page is visible and online, and only when Daraja is saved) the newest payments are read. A DIRECT payment this device has not
  // seen yet raises a banner + sound (+ a system notification when allowed) and puts its payer NAME and M-PESA CODE on the Till button. STK-push payments
  // are never announced here: the sale that sent the prompt already shows them. The first read on a device only records what is already there (no flood).
  var SEEN_KEY = 'pos_tp_seen_v1', seen = null, wTimer = 0, wBusy = false, toastT = 0, PEND = {}, PEND_LOOK_MS = 8000;   // PEND: seen once as direct, not announced yet (zip 287)
  TP.pendLookMs = function (ms) { PEND_LOOK_MS = ms; };
  function isDirect(r) { return r && r.status !== 'STK' && r.source !== 'stk'; }
  function seenLoad() { if (seen) return seen; try { var a = JSON.parse(localStorage.getItem(SEEN_KEY) || 'null'); seen = { primed: !!(a && a.primed), codes: (a && Array.isArray(a.codes)) ? a.codes : [] }; } catch (e) { seen = { primed: false, codes: [] }; } return seen; }
  function seenSave() { try { seen.codes = seen.codes.slice(-300); localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) { /* announced again next time at worst */ } }
  function paintBtn() {
    var b = document.getElementById('tp-open-btn'), lab = document.getElementById('tp-lab'); if (!b || !lab) return;
    var p = TP.latest;
    lab.textContent = 'Till';   // zip 358: the payer's name and code are no longer squeezed into the checkout header (tooltip + badge + snackbar carry them)
    b.title = p ? ('Direct Till payment from ' + (p.name || 'name not supplied') + ' - ' + money(p.amount) + ' - ' + p.code + '. Tap to match it to a bill or sale.') : 'Till Payments';
    b.classList.toggle('tp-has', !!p);
  }
  function beep() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var c = beep.c || (beep.c = new AC()), t = c.currentTime;
      [[880, 0], [1175, 0.16]].forEach(function (n) { var o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = n[0]; g.gain.setValueAtTime(0.0001, t + n[1]); g.gain.exponentialRampToValueAtTime(0.25, t + n[1] + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + 0.3); o.connect(g); g.connect(c.destination); o.start(t + n[1]); o.stop(t + n[1] + 0.32); });
    } catch (e) { /* silent is fine */ }
  }
  function sysNotify(p) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var title = 'Direct Till payment - ' + money(p.amount), opt = { body: (p.name || 'Name not supplied') + ' · ' + p.code, tag: 'tp-' + p.code, icon: '/favicon-32x32.png' };
      try { new Notification(title, opt); }
      catch (e) { if (navigator.serviceWorker) navigator.serviceWorker.ready.then(function (r) { r.showNotification(title, opt); }); }
    } catch (e) { /* cosmetic */ }
  }
  var QUEUE = [];
  function announce(p) {
    QUEUE.unshift(p); if (QUEUE.length > 20) QUEUE.length = 20;
    var t = document.getElementById('tp-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'tp-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t);
      t.addEventListener('click', function (e) {
        if (e.target.closest('.tp-tx2')) { t.classList.remove('on'); QUEUE = []; return; }
        var q = QUEUE[0]; t.classList.remove('on'); QUEUE = [];
        if (e.target.closest('.tp-tact') && q) { open(); setTimeout(function () { var r = TP.rows.filter(function (x) { return x.code === q.code; })[0]; if (r && r.status === 'UNLINKED') { TP.sel = r; TP.pick = null; TP.kind = hasBills() ? 'bill' : 'sale'; render(); } }, 900); }
        else open();
      });
      t.addEventListener('mouseenter', function () { clearTimeout(toastT); });
      t.addEventListener('mouseleave', function () { toastT = setTimeout(function () { t.classList.remove('on'); QUEUE = []; }, 4000); });
    }
    var more = QUEUE.length - 1;
    t.innerHTML = '<div class="tp-tbox"><div class="tp-tic">💰</div><div class="tp-tx"><b>DIRECT TILL PAYMENT' + (more > 0 ? ' · +' + more + ' more' : '') + '</b><strong>' + esc(p.name || 'Name not supplied') + '</strong><span>' + esc(p.code) + '</span></div><div class="tp-tamt">' + money(p.amount) + (more > 0 ? '<span class="tp-tmore">+' + more + ' more</span>' : '') + '</div><button type="button" class="tp-tact">Match</button><button type="button" class="tp-tx2" aria-label="Dismiss">✕</button></div>';
    t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); QUEUE = []; }, 9000);
    beep(); sysNotify(p);
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { /* no vibration */ }
    var b = document.getElementById('tp-open-btn'); if (b) { b.classList.add('tp-new'); setTimeout(function () { b.classList.remove('tp-new'); }, 20000); }
  }
  function watch() {
    if (wBusy || !TP.daraja || document.hidden || navigator.onLine === false) return;
    wBusy = true;
    call('GET', '/api/till-payments?limit=15').then(function (d) {
      if (d.__status >= 400 || !Array.isArray(d.payments)) return;
      var s = seenLoad(), fresh = [], later = false;
      // zip 287: Safaricom ALSO sends the Till message for a payment made by STK push, and it can arrive a few seconds BEFORE the STK result that tells us
      // so. A payment is therefore only announced as a DIRECT Till payment on its SECOND look (a few seconds later); if the STK result claims it meanwhile
      // it is never announced here. The very first read on a device still only records what is already there.
      d.payments.forEach(function (r) {
        if (!isDirect(r)) { delete PEND[r.code]; return; }
        if (s.codes.indexOf(r.code) >= 0) return;
        if (!s.primed) { s.codes.push(r.code); return; }
        if (!PEND[r.code]) { PEND[r.code] = 1; later = true; return; }
        delete PEND[r.code]; s.codes.push(r.code); fresh.push(r);
      });
      s.primed = true; seenSave();
      if (later) setTimeout(watch, PEND_LOOK_MS);
      var un = d.payments.filter(function (r) { return r.status === 'UNLINKED'; });
      TP.latest = un[0] || null;
      TP.unlinked = typeof d.unlinked === 'number' ? d.unlinked : un.length; badge(); paintBtn();
      if (fresh.length) {
        fresh.reverse().forEach(announce);
        var o = document.getElementById('tp-overlay'); if (o && o.classList.contains('open') && !TP.sel) load(false);
      }
    }).catch(function () { /* offline or busy: the next round tries again */ }).then(function () { wBusy = false; });
  }
  function startWatch() { if (wTimer) return; wTimer = setInterval(watch, 20000); watch(); }
  function stopWatch() { if (wTimer) { clearInterval(wTimer); wTimer = 0; } TP.latest = null; paintBtn(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) watch(); });
  window.addEventListener('online', watch);
  TP.watch = watch; TP._announce = announce; TP._paintBtn = paintBtn;

  function ensureBar() {
    if (document.getElementById('tp-open-btn')) return;
    var h3 = document.querySelector('.pos-checkout > h3') || document.querySelector('#active-checkout-cart-panel > h3') || document.querySelector('#cart-and-payment-panel > h3');
    if (!h3) return;
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'tp-open'; btn.id = 'tp-open-btn'; btn.hidden = true;
    btn.setAttribute('aria-haspopup', 'dialog'); btn.title = 'Till Payments';
    btn.innerHTML = '📲 <span class="tp-bl" id="tp-lab">Till</span> <span class="tp-badge" id="tp-badge" hidden aria-label="unlinked payments"></span>';
    var hold = document.getElementById('held-sale-bar'), cnt = document.getElementById('pos-ck-count');
    h3.insertBefore(btn, (hold && hold.parentNode === h3 ? hold.nextSibling : cnt) || null);
    btn.addEventListener('click', open);
  }

  // ---------------------------------------------------------------- the dialog
  function shell() {
    var o = document.getElementById('tp-overlay'); if (o) return o;
    o = document.createElement('div'); o.id = 'tp-overlay'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-labelledby', 'tp-title');
