<!-- PAST SALES MULTI (zip 232) ------------------------------------------------------------------------------------------------
         Record a Past Sale now takes MANY items in one go (each with its own quantity - whole or decimal - price and, optionally, its own time),
         instead of one item at a time, and can READ A PHOTO of a sales book / list with the AI Capture List (/api/ai-capture-list, mode "pastSales"):
         every line is matched to an item in Inventory (code, then name, then close spelling, with the written price as a tie-break), so stock comes off
         and the real price is recorded. A time written on the sheet is kept for that sale. Lines that share a date + time become ONE sale.
         MONEY: a sale total is rounded UP to a whole shilling (100.30 and 100.60 both become 101). The few cents added are saved as a visible
         "Rounding" line so the books still add up. Unmatched lines must be fixed or removed before saving. Nothing here changes a normal sale. -->
<style>
    #record-past-sale-modal .ps-cap { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
    #record-past-sale-modal .ps-cap button { flex: 1 1 140px; padding: 12px 10px; border: 0; border-radius: 10px; background: #8e44ad; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
    #record-past-sale-modal .ps-cap button.alt { background: #34495e; }
    #ps-status { font-size: 13px; min-height: 18px; margin-bottom: 6px; color: #2980b9; }
    #record-past-sale-modal .ps-add { width: 100%; padding: 11px; border: 2px dashed #16a085; background: rgba(22,160,133,.1); color: #16a085; border-radius: 10px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    #ps-lines { margin: 6px 0 4px; }
    .ps-row { border: 1.5px solid var(--border-color, #dfe6e9); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: rgba(127,140,141,.06); }
    .ps-row.bad { border-color: #e74c3c; background: rgba(231,76,60,.08); }
    .ps-row.warn { border-color: #f39c12; }
    .ps-row .ps-top { display: flex; align-items: center; gap: 8px; }
    .ps-row .ps-name { flex: 1; font-weight: 700; font-size: 14px; word-break: break-word; }
    .ps-row .ps-x { border: 0; background: rgba(231,76,60,.15); color: #c0392b; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; flex: 0 0 auto; }
    .ps-row .ps-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: rgba(39,174,96,.18); color: #1e8449; white-space: nowrap; }
    .ps-row .ps-badge.mid { background: rgba(243,156,18,.2); color: #b9770e; }
    .ps-row .ps-badge.low { background: rgba(231,76,60,.18); color: #c0392b; }
    .ps-row .ps-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
    .ps-row .ps-grid label { display: block; font-size: 11px; font-weight: 700; color: #7f8c8d; margin-bottom: 2px; }
    .ps-row .ps-grid input { width: 100%; box-sizing: border-box; min-width: 0; }
    .ps-row .ps-sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #7f8c8d; margin-top: 6px; gap: 8px; flex-wrap: wrap; }
    .ps-row .ps-pick { margin-top: 8px; }
    .ps-row .ps-pick input { width: 100%; box-sizing: border-box; }
    .ps-row .ps-res { border: 1px solid var(--border-color, #dfe6e9); border-radius: 8px; margin-top: 4px; max-height: 170px; overflow: auto; background: var(--bg-surface, #fff); }
    .ps-row .ps-res div { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid rgba(127,140,141,.15); }
    .ps-row .ps-res div:hover { background: rgba(22,160,133,.12); }
    .ps-row .ps-link { background: none; border: 0; color: #2980b9; font-weight: 700; cursor: pointer; padding: 0; font-size: 12px; }
    #ps-total { margin: 8px 0; padding: 12px; border-radius: 12px; background: rgba(22,160,133,.12); font-weight: 800; font-size: 16px; display: none; }
    #ps-total small { display: block; font-weight: 500; font-size: 12px; color: #7f8c8d; margin-top: 2px; }
    #ps-empty { text-align: center; color: #7f8c8d; font-size: 13px; padding: 8px; }
</style>
<script>
(function () {
    'use strict';
    if (window.__psMulti) return; window.__psMulti = true;
    function $(id) { return document.getElementById(id); }
    function safe(fn) { try { return fn(); } catch (e) { return undefined; } }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function toast(m, bad) { safe(function () { showToast(m, !!bad); }); }
    function inv() { return (typeof inventory !== 'undefined' && Array.isArray(inventory)) ? inventory : []; }
    function r2(n) { var x = (Number(n) || 0) * 100; return Math.round(x + (x < 0 ? -1 : 1) * 1e-9) / 100; }
    function kes(n) { return 'KES ' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function kes0(n) { return 'KES ' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); }
    // a sale total is rounded UP to a whole shilling: 100.30 -> 101, 100.60 -> 101, 100.00 stays 100 (cents of float dust are ignored)
    function wholeUp(n) { return Math.ceil(r2(n) - 1e-9); }
    window.psWholeUp = wholeUp;

    var lines = [], seq = 0, pickOpen = null;

    /* ---------- matching a written line to an item in Inventory ---------- */
    function norm(s) { return String(s || '').toLowerCase().replace(/(\d)\s*\/\s*(\d)/g, '$1over$2').replace(/(\d)\.(\d)/g, '$1point$2').replace(/(\d)\s+(kg|g|l|ltr|ltrs|ml|pcs|pc|cl)\b/g, '$1$2').replace(/[^a-z0-9]+/g, ' ').trim(); }
    function stem(t) { return t.length > 3 && /[^s]s$/.test(t) ? t.slice(0, -1) : t; }
    function toks(s) { return norm(s).split(' ').filter(Boolean).map(stem); }
    function lev(a, b) { return (typeof levenshteinDistance === 'function') ? levenshteinDistance(a, b) : (a === b ? 0 : Math.max(a.length, b.length)); }
    function sim(a, b) { if (!a || !b) return 0; return 1 - lev(a, b) / (Math.max(a.length, b.length) || 1); }
    function tokenHit(t, set) { for (var i = 0; i < set.length; i++) { var u = set[i]; if (u === t || (t.length >= 4 && u.length >= 4 && lev(t, u) <= 1)) return true; } return false; }
    function sellable(p) { return p && p.type !== 'combo' && !p.inactive && !p.archived; }
    // returns { item, score, cands: [{item, score}] } — best first
    function match(name, code, price) {
        var pool = inv().filter(sellable), c = String(code || '').trim().toLowerCase(), out = [];
        if (c) { var byCode = pool.filter(function (p) { return String(p.code || '').toLowerCase() === c; })[0]; if (byCode) return { item: byCode, score: 1, cands: [{ item: byCode, score: 1 }] }; }
        var n = norm(name), nt = toks(name);
        if (!n) return { item: null, score: 0, cands: [] };
        pool.forEach(function (p) {
            var pn = norm(p.name); if (!pn) return;
            var s;
            if (pn === n) s = 1;
            else {
                var pt = toks(p.name), hitA = 0, hitB = 0;
                nt.forEach(function (t) { if (tokenHit(t, pt)) hitA++; });
                pt.forEach(function (t) { if (tokenHit(t, nt)) hitB++; });
                var cover = nt.length <= pt.length ? hitA / (nt.length || 1) : hitB / (pt.length || 1);      // how much of the SHORTER name is found in the other
                var both = (hitA + hitB) / ((nt.length + pt.length) || 1);
                s = Math.max(sim(n, pn), 0.55 * both + 0.45 * sim(n, pn), (pn.indexOf(n) >= 0 || n.indexOf(pn) >= 0) ? 0.82 : 0, cover >= 1 ? 0.8 + 0.1 * both : 0);
                // sizes / numbers must agree: "sugar 2kg" is not "sugar 1kg"
                var na = nt.filter(function (t) { return /\d/.test(t); }), nb = pt.filter(function (t) { return /\d/.test(t); });
                if (na.length && nb.length && na.join(' ') !== nb.join(' ')) s *= 0.6;
            }
            var pr = Number(price) || 0;
            if (pr > 0 && s >= 0.5 && (Math.abs(pr - (Number(p.price) || 0)) < 0.01 || Math.abs(pr - (Number(p.wholesaleSellingPrice) || 0)) < 0.01)) s = Math.min(1, s + 0.08);
            out.push({ item: p, score: Math.min(1, s) });
        });
        out.sort(function (a, b) { return b.score - a.score; });
        // two different items almost equally close ("Sugar" with Sugar 1kg and Sugar 2kg on the shelf) -> do not guess: the person picks
        var top = out[0], ambiguous = top && out[1] && top.score < 0.97 && top.score - out[1].score < 0.04 && norm(top.item.name) !== norm(out[1].item.name);
        return { item: top && top.score >= 0.74 && !ambiguous ? top.item : null, score: top ? top.score : 0, cands: out.slice(0, 5) };
    }
    window.psMatch = match;

    /* ---------- the sale lines ---------- */
    function parseQty(raw) { return (typeof parsePastSaleQty === 'function') ? parsePastSaleQty(raw) : (isFinite(parseFloat(raw)) && parseFloat(raw) > 0 ? { qty: Math.round(parseFloat(raw) * 1000) / 1000 } : { error: 'Enter a valid quantity.' }); }
    function prodOf(l) { return l.code ? inv().find(function (p) { return p.code === l.code; }) : null; }
    function addLine(o) {
        var p = o.code ? inv().find(function (x) { return x.code === o.code; }) : null;
        lines.push({ id: ++seq, code: o.code || '', name: o.name || (p && p.name) || '', written: o.written || '', qty: String(o.qty == null ? 1 : o.qty), price: o.price == null ? '' : String(o.price), time: o.time || '', date: o.date || '', score: o.score == null ? 1 : o.score, cands: o.cands || [], list: p ? Number(p.price) || 0 : 0 });
    }
    function lineTotal(l) { var q = parseQty(l.qty); var pr = parseFloat(l.price); return (q.qty && isFinite(pr)) ? r2(q.qty * pr) : 0; }
    function modalStamp() { return { date: ($('past-sale-date-input') || {}).value || '', time: ($('past-sale-time-input') || {}).value || '' }; }
    function groups() {
        var m = modalStamp(), map = {}, order = [];
        lines.forEach(function (l) { var d = l.date || m.date, t = l.time || m.time, k = d + 'T' + t; if (!map[k]) { map[k] = { date: d, time: t, lines: [] }; order.push(k); } map[k].lines.push(l); });
        return order.map(function (k) { var g = map[k]; g.raw = r2(g.lines.reduce(function (s, l) { return s + lineTotal(l); }, 0)); g.total = wholeUp(g.raw); return g; });
    }
    function badge(l) { if (!l.code) return '<span class="ps-badge low">choose item</span>'; if (l.score >= 0.97) return ''; var pc = Math.round(l.score * 100); return '<span class="ps-badge ' + (l.score >= 0.88 ? '' : 'mid') + '">' + pc + '% match</span>'; }
    function render() {
        var box = $('ps-lines'); if (!box) return;
        if (!lines.length) { box.innerHTML = '<div id="ps-empty">No items yet — add one above, or capture a photo.</div>'; var t0 = $('ps-total'); if (t0) t0.style.display = 'none'; return; }
        var m = modalStamp();
        box.innerHTML = lines.map(function (l, i) {
            var p = prodOf(l), tot = lineTotal(l), bad = !l.code, warn = !bad && l.score < 0.88;
            var diff = p && l.list > 0 && parseFloat(l.price) > 0 && Math.abs(parseFloat(l.price) - l.list) > 0.5 ? '<span>List price ' + kes(l.list) + '</span>' : '<span></span>';
            var sug = (!l.code && l.cands && l.cands[0] && l.cands[0].score >= 0.5) ? '<div class="ps-sub"><span>Did you mean <b>' + esc(l.cands[0].item.name) + '</b>?</span><button type="button" class="ps-link" onclick="psUseCand(' + l.id + ',0)">Use it</button></div>' : '';
            return '<div class="ps-row' + (bad ? ' bad' : warn ? ' warn' : '') + '" data-id="' + l.id + '">' +
                '<div class="ps-top"><div class="ps-name">' + (i + 1) + '. ' + esc(l.name || l.written || 'Item') + '</div>' + badge(l) + '<button type="button" class="ps-x" onclick="psRemove(' + l.id + ')" aria-label="Remove">✕</button></div>' +
                (l.written && p && norm(l.written) !== norm(p.name) ? '<div class="ps-sub"><span>Written: “' + esc(l.written) + '”</span></div>' : '') + sug +
                '<div class="ps-grid"><div><label>Qty</label><input type="text" inputmode="decimal" autocomplete="off" value="' + esc(l.qty) + '" oninput="psSet(' + l.id + ',\'qty\',this.value)" placeholder="1 or 0.5"></div>' +
                '<div><label>Price each</label><input type="text" inputmode="decimal" autocomplete="off" value="' + esc(l.price) + '" oninput="psSet(' + l.id + ',\'price\',this.value)" placeholder="0"></div>' +
                '<div><label>Time' + (l.time ? '' : ' (opt.)') + '</label><input type="time" value="' + esc(l.time) + '" oninput="psSet(' + l.id + ',\'time\',this.value)"></div></div>' +
                '<div class="ps-sub">' + diff + '<span><b data-ps-line="' + l.id + '">' + kes(tot) + '</b>' + (l.date && l.date !== m.date ? ' · ' + esc(l.date) : '') + '</span></div>' +
                '<div class="ps-sub"><button type="button" class="ps-link" onclick="psPick(' + l.id + ')">' + (l.code ? '🔁 Change item' : '🔎 Choose the item') + '</button></div>' +
                (pickOpen === l.id ? '<div class="ps-pick"><input type="text" id="ps-pick-in" placeholder="Search by name or code…" oninput="psPickSearch(' + l.id + ',this.value)" autocomplete="off"><div class="ps-res" id="ps-pick-res"></div></div>' : '') + '</div>';
        }).join('');
        totals();
    }
    function totals() {
        var t = $('ps-total'); if (!t) return; var gs = groups(), raw = r2(gs.reduce(function (s, g) { return s + g.raw; }, 0)), tot = gs.reduce(function (s, g) { return s + g.total; }, 0);
        t.style.display = 'block';
        t.innerHTML = 'Total: ' + kes0(tot) + '<small>' + lines.length + ' line' + (lines.length === 1 ? '' : 's') + (gs.length > 1 ? ' · ' + gs.length + ' separate sales (different times)' : '') + (tot - raw > 0.004 ? ' · rounded up from ' + kes(raw) : '') + '</small>';
        lines.forEach(function (l) { var b = document.querySelector('[data-ps-line="' + l.id + '"]'); if (b) b.textContent = kes(lineTotal(l)); });
    }
    window.psSet = function (id, f, v) { var l = lines.filter(function (x) { return x.id === id; })[0]; if (!l) return; l[f] = v; if (f === 'time') render(); else totals(); };
    window.psRemove = function (id) { lines = lines.filter(function (x) { return x.id !== id; }); if (pickOpen === id) pickOpen = null; render(); };
    window.psPick = function (id) { pickOpen = pickOpen === id ? null : id; render(); if (pickOpen) { var i = $('ps-pick-in'); if (i) i.focus(); window.psPickSearch(id, ''); } };
    window.psPickSearch = function (id, q) {
        var res = $('ps-pick-res'); if (!res) return; var n = norm(q), l = lines.filter(function (x) { return x.id === id; })[0];
        var list = inv().filter(sellable);
        list = n ? list.filter(function (p) { return norm(p.name).indexOf(n) >= 0 || String(p.code || '').toLowerCase().indexOf(n) >= 0; }) : (l && l.cands.length ? l.cands.map(function (c) { return c.item; }) : list.slice(0, 8));
        res.innerHTML = list.slice(0, 12).map(function (p) { return '<div onclick="psChoose(' + id + ',\'' + String(p.code).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">' + esc(p.name) + ' <span style="color:#7f8c8d">· ' + kes(p.price || 0) + '</span></div>'; }).join('') || '<div style="cursor:default">No match</div>';
    };
    window.psChoose = function (id, code) {
        var l = lines.filter(function (x) { return x.id === id; })[0], p = inv().filter(function (x) { return x.code === code; })[0]; if (!l || !p) return;
        l.code = p.code; l.name = p.name; l.score = 1; l.list = Number(p.price) || 0; if (!(parseFloat(l.price) > 0)) l.price = String(p.price || 0); pickOpen = null; render();
    };
    window.psUseCand = function (id, i) { var l = lines.filter(function (x) { return x.id === id; })[0]; if (l && l.cands[i]) { window.psChoose(id, l.cands[i].item.code); } };

    /* ---------- adding by hand (the existing item box) ---------- */
    window.psAddManual = function (silent) {
        var err = $('past-sale-error'); if (err) err.textContent = '';
        var p = (typeof selectedPastSaleItem !== 'undefined') ? selectedPastSaleItem : null;
        if (!p) { if (!silent && err) err.textContent = 'Search and pick an item first.'; return false; }
        var q = parseQty(($('past-sale-qty-input') || {}).value); if (q.error) { if (err) err.textContent = q.error; return false; }
        var pr = parseFloat(($('past-sale-price-input') || {}).value); if (isNaN(pr) || pr < 0) { if (err) err.textContent = 'Enter a valid price.'; return false; }
        addLine({ code: p.code, name: p.name, qty: q.qty, price: pr });
        selectedPastSaleItem = null;
        var s = $('past-sale-selected-item'); if (s) s.textContent = '';
        ['past-sale-item-search', 'past-sale-price-input'].forEach(function (i) { var e = $(i); if (e) e.value = ''; }); var qe = $('past-sale-qty-input'); if (qe) qe.value = '1';
        render(); return true;
    };

    /* ---------- read a photo ---------- */
    function shrink(file) {
        return new Promise(function (res, rej) {
            var fr = new FileReader();
            fr.onerror = function () { rej(new Error('Could not read that picture.')); };
            fr.onload = function () {
                var img = new Image();
                img.onerror = function () { rej(new Error('That file is not a picture the phone can open.')); };
                img.onload = function () {
                    var max = 2200, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
                    var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
                    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
                    res(c.toDataURL('image/jpeg', 0.9));
                };
                img.src = fr.result;
            };
            fr.readAsDataURL(file);
        });
    }
    window.psPhoto = async function (input) {
        var file = input.files && input.files[0]; input.value = ''; if (!file) return;
        var st = $('ps-status'), err = $('past-sale-error'); if (err) err.textContent = '';
        try {
            if (!/^image\//.test(file.type)) throw new Error('Please choose a picture.');
            if (st) st.textContent = '🔎 Reading the photo… this can take up to half a minute.';
            var data = await shrink(file);
            var res = await fetch(apiUrl('/api/ai-capture-list'), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageDataUrl: data, mode: 'pastSales' }) });
            var j = await res.json().catch(function () { return {}; });
            if (!res.ok) throw new Error(j.error || 'Could not read that picture.');
            var items = Array.isArray(j.items) ? j.items : [];
            if (!items.length) { if (st) st.textContent = ''; toast('No sale lines were found — try a clearer, straighter photo.', true); return; }
            var unmatched = 0;
            items.forEach(function (it) {
                var qty = Number(it.quantity) > 0 ? Number(it.quantity) : 1;
                var price = Number(it.retail_price) > 0 ? Number(it.retail_price) : (Number(it.line_total) > 0 ? Math.round(Number(it.line_total) / qty * 100) / 100 : 0);
                var m = match(it.detected_name, it.detected_code, price);
                if (!m.item) unmatched++;
                addLine({ code: m.item ? m.item.code : '', name: m.item ? m.item.name : '', written: it.detected_name || it.detected_code || '', qty: qty, price: price > 0 ? price : (m.item ? (m.item.price || 0) : ''), time: it.sold_time || '', date: it.sold_date || '', score: m.item ? m.score : 0, cands: m.cands });
            });
            if (st) st.textContent = '';
            render();
            toast(items.length + ' line' + (items.length === 1 ? '' : 's') + ' read' + (unmatched ? ' — ' + unmatched + ' need an item chosen' : ' and matched') + '. Check them, then Record Sale.', unmatched > 0);
        } catch (e) { if (st) st.textContent = ''; toast(e.message || 'Could not read that picture.', true); }
    };

    /* ---------- the form: add the extra pieces once ---------- */
    function ensureUi() {
        var modal = $('record-past-sale-modal'); if (!modal || $('ps-lines')) return;
        var box = modal.querySelector('.popup-modal-box'), itemGroup = $('past-sale-item-search') && $('past-sale-item-search').closest('.form-group'), payGroup = $('past-sale-payment-select') && $('past-sale-payment-select').closest('.form-group');
        if (!box || !itemGroup || !payGroup) return;
        var intro = box.querySelector('p'); if (intro) intro.textContent = 'For sales that really happened but were never entered. Add as many items as you like (whole or decimal quantities), or take a photo of your sales book and let it read every line. Stock is deducted and the prices are recorded. Totals are rounded up to a whole shilling.';
        var cap = document.createElement('div');
        cap.innerHTML = '<div class="ps-cap"><button type="button" onclick="document.getElementById(\'ps-cam\').click()">📷 Take photo of sales</button><button type="button" class="alt" onclick="document.getElementById(\'ps-up\').click()">🖼 Upload picture</button></div><div id="ps-status"></div>' +
            '<input type="file" id="ps-cam" accept="image/*" capture="environment" style="display:none" onchange="psPhoto(this)"><input type="file" id="ps-up" accept="image/*" style="display:none" onchange="psPhoto(this)">';
        itemGroup.parentNode.insertBefore(cap, itemGroup);
        var lbl = itemGroup.querySelector('label'); if (lbl) lbl.textContent = 'Add an item by hand';
        var priceRow = $('past-sale-price-input').closest('.split-amounts-row');
        var addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'ps-add'; addBtn.textContent = '➕ Add to this sale'; addBtn.onclick = function () { window.psAddManual(false); };
        priceRow.parentNode.insertBefore(addBtn, priceRow.nextSibling);
        var list = document.createElement('div'); list.innerHTML = '<label class="label" style="margin-top:6px;">Items in this sale</label><div id="ps-lines"></div><div id="ps-total"></div><p class="settings-hint" style="margin:0 0 8px;">A line with no time uses the Date and Time at the top. Lines with the same time are recorded as one sale.</p>';
        addBtn.parentNode.insertBefore(list, addBtn.nextSibling);
        render();
    }
    function reset() { lines = []; pickOpen = null; var st = $('ps-status'); if (st) st.textContent = ''; render(); }

    /* ---------- saving ---------- */
    function consume(product, qty, ts) {
        // production: a made item / Set draws its parts exactly as a normal checkout; everything else is the shared past-sale deduction
        if (product.type !== 'service' && ((Array.isArray(product.productionRecipe) && product.productionRecipe.length > 0) || (product.type === 'set' && Array.isArray(product.setComponents) && product.setComponents.length > 0)) && typeof deductStockForSaleUnit === 'function') {
            return { componentsUsed: deductStockForSaleUnit(product, qty, null, null) };
        }
        return pastSaleConsume(product, qty, ts) || {};
    }
    window.saveRecordPastSale = function () {
        var err = $('past-sale-error'); if (err) err.textContent = '';
        function fail(m) { if (err) err.textContent = m; return; }
        if (typeof selectedPastSaleItem !== 'undefined' && selectedPastSaleItem) { if (window.psAddManual(true) === false) return; }
        if (!lines.length) return fail('Add at least one item, or capture a photo.');
        var m = modalStamp(); if (!m.date || !m.time) return fail('Enter both a date and time.');
        // 1. check every line
        var prepared = [];
        for (var i = 0; i < lines.length; i++) {
            var l = lines[i], p = prodOf(l), n = i + 1;
            if (!p) return fail('Line ' + n + (l.written ? ' (“' + l.written + '”)' : '') + ' has no item from your inventory. Choose the item or remove the line.');
            var q = parseQty(l.qty); if (q.error) return fail('Line ' + n + ' (' + p.name + '): ' + q.error);
            var pr = parseFloat(l.price); if (isNaN(pr) || pr < 0) return fail('Line ' + n + ' (' + p.name + '): enter a valid price.');
            prepared.push({ l: l, p: p, qty: q.qty, price: pr });
        }
        var gs = groups();
        for (var gi = 0; gi < gs.length; gi++) { var ts0 = new Date(gs[gi].date + 'T' + gs[gi].time + ':00'); if (isNaN(ts0.getTime())) return fail('One of the dates or times is not valid.'); gs[gi].ts = ts0.toISOString(); }
        var method = ($('past-sale-payment-select') || {}).value || 'cash';
        if (gs.length > 1 && (method === 'split' || method === 'bill')) return fail('These lines are at different times, so they are separate sales. Choose Cash, M-Pesa or Card (or give them all the same time) for ' + (method === 'bill' ? 'Pay Later' : 'Split') + '.');
        // 2. the payment for each sale (before touching any stock)
        for (var g = 0; g < gs.length; g++) { gs[g].payment = pastSalePaymentDetails(gs[g].total); if (gs[g].payment.error) return fail(gs[g].payment.error); }
        // 3. stock warning, once, for everything
        var need = {}, short = [];
        prepared.forEach(function (x) { need[x.p.code] = (need[x.p.code] || 0) + x.qty; });
        Object.keys(need).forEach(function (code) { var p = inv().filter(function (x) { return x.code === code; })[0], av = Math.round((Number(getAvailableStock(p)) || 0) * 1000) / 1000; if (av < need[code] - 1e-9) short.push({ name: p.name, av: av, qty: Math.round(need[code] * 1000) / 1000 }); });
        if (short.length && !confirm(short.length === 1 ? 'Only ' + short[0].av + ' in stock right now, but recording ' + short[0].qty + ' of ' + short[0].name + ' — this\'ll take stock negative. Continue anyway?' : 'Not enough stock for: ' + short.map(function (x) { return x.name + ' (have ' + x.av + ', recording ' + x.qty + ')'; }).join('; ') + '.\n\nRecording this will take stock negative. Continue anyway?')) return;
        var frac = prepared.filter(function (x) { return Math.abs(x.qty - Math.round(x.qty)) > 1e-9 && String(x.p.unit || 'pcs').toLowerCase() === 'pcs' && !x.p.dualUnit; });
        if (frac.length && !confirm(frac.map(function (x) { return x.p.name + ' × ' + x.qty; }).join(', ') + ' — sold by the piece but the quantity has decimals. Keep it?')) return;
        // 4. record
        var made = 0, lastDate = m.date;
        gs.forEach(function (g) {
            var items = g.lines.map(function (l) {
                var x = prepared.filter(function (pp) { return pp.l === l; })[0];
                var extra = consume(x.p, x.qty, g.ts);
                var line = { code: x.p.code, name: x.p.name, qty: x.qty, price: x.price, wholesalePrice: x.p.wholesalePrice || 0, unit: x.p.unit || 'pcs', vatCategory: x.p.vatCategory || 'A' };
                for (var k in extra) line[k] = extra[k];
                return line;
            });
            var diff = r2(g.total - g.raw);
            if (diff > 0.004) items.push({ name: 'Rounding', price: diff, qty: 1, unit: 'rounding', wholesalePrice: 0, vatCategory: 'A', isRounding: true });
            var rec = { id: genSaleId(), refNumber: generateReceiptRef(), timestamp: g.ts, servedBy: activeServerName(), recordedLate: true, items: items };
            for (var f in g.payment.fields) rec[f] = g.payment.fields[f];
            pastSaleStore(rec, g.payment); made++; lastDate = g.date;
        });
        safeSetItem('pos_inventory', JSON.stringify(inventory));
        if (typeof stockMovementLog !== 'undefined') safeSetItem('pos_stock_movement_log', JSON.stringify(stockMovementLog));
        queuePush();
        closeRecordPastSaleModal();
        safe(function () { var dp = $('sales-table-date-picker'); if (dp) { dp.value = lastDate; dp.dataset.auto = '0'; } if (typeof setSalesTablePeriod === 'function') setSalesTablePeriod('daily'); });
        showToast(made === 1 ? 'Past sale recorded for ' + new Date(gs[0].ts).toLocaleString('en-GB') + '.' : made + ' past sales recorded (' + prepared.length + ' items).');
        lines = [];
    };
    var baseOpen = window.openRecordPastSaleModal;
    window.openRecordPastSaleModal = function () { if (typeof baseOpen === 'function') baseOpen.apply(this, arguments); ensureUi(); reset(); };
    window.psTestState = function () { return { lines: lines, groups: groups() }; };
    window.psTestAdd = addLine; window.psTestRender = render;
})();
</script>
