<!-- PUBLIC ORDER (zip 368) ------------------------------------------------------------------------------------------------------------
     ONE public "order from home" barcode for every app (the hotel already had it; now the Shop, Water, Hospital, Production, Services, Pharmacy and
     Car Wash have it too) and a tab - "🛵 Online Orders" - to handle what customers order through it.

     HOW IT WORKS (nothing new on the server): it uses the same secure /api/qr-order service the hotel uses, with its ONE public code (kind "online").
       - The code holds only a random token. Customers scan it, see the items, pick, type name + phone + delivery address (or choose pickup) and send.
       - EVERYTHING you sell is published to that code by default (the menu is rebuilt from your items every minute: price and in-stock changes follow).
         Not published: items with no price, hidden / archived items, ingredients, and (pharmacy / hospital) items that need a prescription.
       - The order waits on the server until staff press Accept (one person owns it - two tills can never both take it). "Add to sale" puts it in
         the Sales Counter cart, the cashier checks out as usual (so stock, receipts, reports and the cash drawer are all the normal ones) and the
         order is then marked paid. Nothing here bypasses the till.
     Self-contained on purpose (own styles, own tab + button, colour fallbacks) so the identical block works in every app. Ids and classes: pubo-*.
     Needs the transaction database (D1) like every QR order; without it the tab says so in plain words. -->

    function v(id) { var e = $(id); return e ? String(e.value || '').trim() : ''; }
    cfg.open = !!($('pubo-open') && $('pubo-open').checked); cfg.note = v('pubo-note'); cfg.till = v('pubo-till'); cfg.paybill = v('pubo-paybill'); cfg.acc = v('pubo-acc'); cfg.accName = v('pubo-accname'); cfg.instr = v('pubo-instr'); cfg.touchedAt = Date.now(); saveCfg(cfg);
    S.openSet = true; publish(false);
  }
  function onClick(ev) {
    var t = ev.target.closest ? ev.target.closest('[data-pubo]') : null; if (!t) return;
    var a = t.getAttribute('data-pubo'), id = t.getAttribute('data-id');
    if (a === 'filter') { S.filter = id; render(); }
    else if (a === 'accept') accept(id); else if (a === 'reject') reject(id); else if (a === 'sale') toSale(id);
    else if (a.indexOf('st-') === 0) setStatus(id, a.slice(3));
    else if (a === 'req-yes' || a === 'req-no') call({ action: 'decideRequest', reqId: id, approve: a === 'req-yes' }).then(function () { toast(a === 'req-yes' ? 'Approved. If the order is already in the cart, change it there too.' : 'Declined.'); poll(); }).catch(function (e) { toast((e.data && e.data.message) || e.message, true); poll(); });
    else if (a === 'pay-no') { if (confirm('Mark this payment as NOT received? The customer is told to pay again.')) call({ action: 'rejectPayment', payId: id }).then(poll).catch(function (e) { toast(e.message, true); }); }
    else if (a === 'copy') { var u = S.code && urlFor(S.code.token); try { navigator.clipboard.writeText(u).then(function () { toast('Link copied.'); }, function () { toast(u); }); } catch (e) { toast(u); } }
    else if (a === 'wa') { if (S.code) window.open('https://wa.me/?text=' + encodeURIComponent('Order from ' + (localStorage.getItem('pos_biz_name') || 'us') + ' here: ' + urlFor(S.code.token)), '_blank'); }
    else if (a === 'png') { if (S.code) svgFor(S.code.token).then(function (s) { return drawPng(s, 1024); }).then(function (cv) { cv.toBlob(function (b) { b ? save(b, 'order-from-home-QR.png') : toast('Could not make the picture.', true); }, 'image/png'); }).catch(function (e) { toast(e.message, true); }); }
    else if (a === 'print') printSign(); else if (a === 'receipt') onReceipt(); else if (a === 'save') saveSettings();
    else if (a === 'publish') publish(false); else if (a === 'setup') setup(true); else if (a === 'unload') unload();
  }

  /* ---------- the tab + button (built here, registered for staff roles like every other tab) ---------- */
  function ensure() {
    var sales = $('sales-tab'), sb = $('sales-tab-btn') || document.querySelector('.tab-link[data-tab="sales-tab"]');
    if (!sales || !sb) return false;
    if (!$(ID)) { var d = document.createElement('div'); d.id = ID; d.className = 'tab-content'; sales.parentNode.insertBefore(d, sales.nextSibling); d.addEventListener('click', onClick); }
    if (!$(BTN)) {
      var nb = document.createElement('button'); nb.id = BTN; nb.className = 'tab-link'; nb.setAttribute('data-tab', ID); nb.setAttribute('onclick', "guardedSwitchTab(event, '" + ID + "')");
      nb.textContent = '🛵 Online Orders'; sb.parentNode.insertBefore(nb, sb.nextSibling);
      nb.addEventListener('click', function () { setTimeout(function () { S.fresh = {}; render(); poll(); setup(false); }, 0); });
    }
    return !!$(BTN);
  }
  function register() {
    try {
      if (typeof LOCKABLE_TABS !== 'undefined' && !LOCKABLE_TABS.some(function (t) { return t.id === ID; })) {
        var item = { id: ID, label: '🛵 Online Orders' }, i = LOCKABLE_TABS.findIndex(function (t) { return t.id === 'deliveries-tab'; });
        LOCKABLE_TABS.splice(i >= 0 ? i + 1 : LOCKABLE_TABS.length, 0, item);
        if (typeof ROLE_TABS !== 'undefined' && Array.isArray(ROLE_TABS) && !ROLE_TABS.some(function (t) { return t.id === ID; })) ROLE_TABS.push(item);
      }
    } catch (e) { /* the tab still works for the admin */ }
  }
  // staff who work the Sales Counter get this tab once in their roles (the admin can untick it later)
  function migrate() {
    try {
      if (typeof staff === 'undefined' || !Array.isArray(staff)) return; var changed = false;
      staff.forEach(function (m) { if (!m || m.puboMigrated) return; m.puboMigrated = true; changed = true; if (Array.isArray(m.roles) && m.roles.indexOf('sales-tab') >= 0 && m.roles.indexOf(ID) < 0) { m.roles.push(ID); m.updatedAt = Date.now(); } });
      if (changed) { safeSetItem('pos_staff', JSON.stringify(staff)); try { queuePush(); } catch (e) { /* next change sends it */ } }
    } catch (e) { /* ok */ }
  }
  function boot() {
    var n = 0;
    (function tick() { try { if (ensure()) { register(); wrapCheckout(); banner(); if (n === 3) migrate(); } } catch (e) { /* retried */ } if (++n < 40) setTimeout(tick, n < 10 ? 300 : 1500); })();
    setTimeout(function () { try { setup(true); } catch (e) { /* the interval retries */ } }, 7000);
    setInterval(function () { try { ensure(); badge(); banner(); } catch (e) { /* cosmetic */ } }, 3000);
    setInterval(function () { try { if (S.code || S.lastSetupTry) setup(false); } catch (e) { /* next time */ } }, 60000);
    setInterval(function () {      // live connection healthy: a new order already pokes this device, so this is only a backstop
      try {
        var sock = (typeof syncSocket !== 'undefined') ? syncSocket : null, now = Date.now(), live = !!(sock && sock.readyState === 1 && window.__wsPongSeen && now - (window.__wsLastRxAt || 0) < 45000);
        if (document.hidden && now - Math.max(S.lastOk, S.lastFail) < 60000) return;
        if (live && now - Math.max(S.lastOk, S.lastFail) < 30000) return;
      } catch (e) { /* any doubt: check */ }
      poll();
    }, 8000);
    // a poke from the server (something changed) also checks for online orders at once
    var tries = 0; (function hook() { if (typeof window.pullFreshAfterPoke === 'function' && !window.__puboPoke) { window.__puboPoke = true; var base = window.pullFreshAfterPoke; window.pullFreshAfterPoke = function () { try { poll(); } catch (e) { /* the timer still polls */ } return base.apply(this, arguments); }; } else if (!window.__puboPoke && ++tries < 20) setTimeout(hook, 1000); })();
  }
  window.PUBO = { __v: 368, flush: flush, outbox: outbox, buildMenu: buildMenu, publish: publish, poll: poll, setup: setup, state: S, cfg: function () { return cfg; }, parseNote: parseNote };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
