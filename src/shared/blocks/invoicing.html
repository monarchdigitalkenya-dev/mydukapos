<!-- INVOICING ------------------------------------------------------------------------------------------------------------------
     zip 373: an Invoicing tab in every app.
       - Invoices in any currency (KES is the default; the default can be changed in Invoicing > Settings), with an "include tax" choice per invoice
         (no tax / tax added on top / tax already in the prices), discount, notes and terms.
       - A presentable A4 invoice: print it, save it as a PDF, share it (WhatsApp, e-mail, the phone's share sheet), copy it as text.
       - Payments on each invoice (cash, M-Pesa, bank ...), part payments, a paid / part paid / overdue status.
       - Client statements (opening balance, invoices, payments, closing balance, ageing) and a receive-payment screen that settles the oldest invoice first.
       - Reconciliation: who owes what (ageing) and a bank / M-Pesa statement matcher that ticks the payments the bank really received.
       - "Also show sales in" (Settings): the Sales Counter shows the payable total in a second currency; the sales themselves stay in KES.
     The invoices are kept on this device and travel with the shop's settings, so every device sees the same invoices.
     Also: the payable total on the desktop Sales Counter cart is bigger.
     Shared by every app via `npm run sync`; never hand-edit it inside an app. -->

            r[b] += t.due; r.all += t.due;

        doCopy: function () { try { navigator.clipboard.writeText(SH.text).then(function () { toast('Copied.'); }, function () { toast('Could not copy.', true); }); } catch (e) { toast('Could not copy.', true); } },
        setStClient: function (k) { V.stClient = k; render(); }, setStCur: function (c) { V.stCur = c; render(); },

        stDoc: function () {

        receiveDlg: function () {

            overlay('<h3>Receive payment — ' + esc(cl.name) + '</h3><div style="color:#6b7280;font-size:13px">Owes now: <b>' + fmt(Math.max(0, st.closing), V.stCur) + '</b>. The money settles the oldest unpaid invoices first. Anything extra is kept as credit on the account.</div><label>Amount (' + esc(V.stCur) + ')</label><input id="vx-ra" type="number" step="any" min="0" value="' + Math.max(0, st.closing) + '"><label>Date</label><input id="vx-rd" type="date" value="' + today() + '"><label>Paid by</label><select id="vx-rm"><option>M-Pesa</option><option>Cash</option><option>Bank transfer</option><option>Cheque</option><option>Card</option><option>Other</option></select><label>Reference</label><input id="vx-rr"><div class="act"><button onclick="Invoicing.doReceive()">Save</button><button class="sec" onclick="Invoicing.closeDlg()">Cancel</button></div>');

    };

    /* ================= the Sales Counter: payable total also in a second currency ================= */
    function alsoRefresh() {
        try {
            var g = $('cart-grand-total'); if (!g) return; var code = S().salesAlso, old = $('vx-also');
            if (!code || !S().cur[code] || !(num(S().cur[code].rate) > 0)) { if (old && old.parentNode) old.parentNode.removeChild(old); return; }
            var m = /KES\s*([\d,]+(?:\.\d+)?)/i.exec(g.textContent || ''); if (!m) { if (old && old.parentNode) old.parentNode.removeChild(old); return; } var kes = num(m[1]); if (kes <= 0) { if (old && old.parentNode) old.parentNode.removeChild(old); return; }
            var sp = document.createElement('span'); sp.id = 'vx-also'; sp.textContent = '≈ ' + fmt(kes / num(S().cur[code].rate), code); if (old && old.textContent === sp.textContent && old.parentNode === g) return; if (old && old.parentNode) old.parentNode.removeChild(old); g.appendChild(sp);
        } catch (e) { /* cosmetic */ }
    }
    function watchTotal() { var g = $('cart-grand-total'); if (!g || g.__vx) return !!g; g.__vx = 1; if (window.MutationObserver) { var busy = false; new MutationObserver(function () { if (busy) return; busy = true; setTimeout(function () { busy = false; alsoRefresh(); }, 60); }).observe(g, { childList: true, characterData: true, subtree: false }); } alsoRefresh(); return true; }

    /* ================= tab, lock lists, sync ================= */
    function mount() {
        if ($('invoicing-tab')) return true;
        var anchor = $('settings-tab-btn') || $('payroll-tab-btn'), host = $('settings-tab'); if (!anchor || !host || !host.parentNode) return false;
        var btn = document.createElement('button'); btn.id = 'invoicing-tab-btn'; btn.className = 'tab-link'; btn.setAttribute('data-tab', 'invoicing-tab'); btn.setAttribute('onclick', "guardedSwitchTab(event, 'invoicing-tab')"); btn.textContent = '🧾 Invoicing';
        anchor.parentNode.insertBefore(btn, anchor);
        var p = document.createElement('div'); p.id = 'invoicing-tab'; p.className = 'tab-content'; p.innerHTML = '<div class="panel vx"><h3>🧾 Invoicing — ' + esc(bizName()) + '</h3><div id="vx-body"></div></div>';
        host.parentNode.insertBefore(p, host);
        return true;
    }
    function lockLists() { try { [typeof LOCKABLE_TABS !== 'undefined' ? LOCKABLE_TABS : null, typeof ROLE_TABS !== 'undefined' ? ROLE_TABS : null].forEach(function (a) { if (Array.isArray(a) && !a.some(function (t) { return t && t.id === 'invoicing-tab'; })) a.push({ id: 'invoicing-tab', label: '🧾 Invoicing' }); }); } catch (e) { /* the tab stays open to everyone who can see it */ } }
    function wire() { try { if (typeof performTabSwitch === 'function' && !performTabSwitch.__vx) { var _p = performTabSwitch; var w = function (btn, id) { var r = _p.apply(this, arguments); if (id === 'invoicing-tab') { try { render(); } catch (e) { var b = body(); if (b) b.innerHTML = '<div class="vx-warn">The invoices could not be shown: ' + esc(e && e.message) + '</div>'; } } return r; }; w.__vx = true; performTabSwitch = w; } } catch (e) { /* the button still opens the tab */ } }
    function hook() { var b = $('invoicing-tab-btn'); if (b && !b.__vx) { b.__vx = 1; b.addEventListener('click', function () { setTimeout(function () { try { if ($('invoicing-tab') && $('invoicing-tab').classList.contains('active')) render(); } catch (e) { /* shown on next click */ } }, 60); }); } }
    function start() { if (!mount()) { setTimeout(start, 700); return; } hook(); lockLists(); wire(); setTimeout(wire, 800); setTimeout(wire, 2500); watchTotal(); setTimeout(watchTotal, 1500); setInterval(function () { watchTotal(); lockLists(); }, 4000); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    window.addEventListener('load', function () { setTimeout(start, 400); });

    /* every device sees the same invoices: they ride along with the shop's settings and merge invoice by invoice (newest edit wins) */
    function mergeIn(inc) {
        if (!inc || typeof inc !== 'object') return false; var d = load(), changed = false;
        function uni(mine, theirs) { var m = {}; mine.forEach(function (x) { if (x && x.id) m[x.id] = x; }); (theirs || []).forEach(function (x) { if (!x || !x.id) return; var a = m[x.id]; if (!a || (x.updatedAt || 0) > (a.updatedAt || 0)) { m[x.id] = x; changed = true; } }); return Object.keys(m).map(function (k) { return m[k]; }); }
        d.invoices = uni(d.invoices, inc.invoices); d.credits = uni(d.credits, inc.credits);
        if ((inc.updatedAt || 0) > (d.updatedAt || 0) && inc.settings) { d.settings = Object.assign(d.settings, inc.settings); d.settings.cur = Object.assign(JSON.parse(JSON.stringify(BASE)), inc.settings.cur || {}); changed = true; }
        if (changed) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* kept in memory */ } if (V.view !== 'edit' && $('invoicing-tab') && $('invoicing-tab').classList.contains('active')) render(); alsoRefresh(); }

    }

    try { var ea = window.extraSettingsApply; if (typeof ea === 'function' && !ea.__vx) { var wa = function (data) { var r = ea.apply(this, arguments); safe(function () { if (data && data.invoicing) mergeIn(data.invoicing); }); return r; }; wa.__vx = true; window.extraSettingsApply = wa; } } catch (e) { /* local only */ }
})();
