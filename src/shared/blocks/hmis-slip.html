<!-- HMIS SLIP (zip 363) -------------------------------------------------------------------------------------------------------
     Visit summary slip for 80 mm thermal paper (58 mm follows the receipt paper setting), with an optional sick-off (excuse from duty / school) section.
     - Everything the patient got today on ONE slip: complaint, vitals, diagnosis, medicines, lab tests, services, what was charged / paid / still owed,
       referral, follow-up date, advice. Built only from records that already exist (visits, patientCharges, labResults, queue); nothing new is stored
       except the sick-off dates, which are written on the visit (and audited) when a slip with a sick-off is printed.
     - The CASHIER no longer skips a patient who owes nothing: "Take payment" opens the summary instead of a dead-end message, and "Send to..." suggests the
       Cashier as the last stop whenever the patient received anything, so every patient leaves with their slip.
     - A "Print visit summary" prompt appears after a payment is taken and after a visit is finished.
     Read-only over clinical data; every hook is guarded and falls back to the original behaviour. -->

#hslip-ov .hs-box{border:1px solid var(--border-color,#dde3e8);border-left:5px solid #1e6fd0;border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--bg-surface,#fff)}
#hslip-ov .hs-box.warn{border-left-color:#e67e22;background:#fff8ec;color:#5b3a00}
#hslip-ov .hs-box.ok{border-left-color:#27ae60;background:#eefaf3;color:#14532d}

#hslip-ov label input[type=checkbox]{width:auto;margin:0}

.hslip-paper{background:#fff;color:#000;margin:0 auto;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:10px 6px}

        if (adv) h += S('Advice / plan') + '<div>' + esc(adv) + '</div>';

        $('hso-x').onclick = function () { el.classList.remove('on'); };
        clearTimeout(offerT); offerT = setTimeout(function () { el.classList.remove('on'); }, 30000);
    }
    window.hslipOffer = offer;

    /* ------------------------------------------------------------------ hooks into the existing flow (each one falls back to the original) */
    function wrap(name, make) {
        var tries = 0;
        (function go() {
            var orig = window[name];
            if (typeof orig !== 'function') { if (++tries < 40) setTimeout(go, 500); return; }
            if (orig.__hslip) return;
            var f = make(orig); f.__hslip = true;
            try { window[name] = f; } catch (e) { /* not replaceable */ }
        })();
    }
    function hasUnpaid(pid) { try { return pendingBillGroups(pid).some(function (g) { return g.patientId === pid && Number(g.total) > 0; }); } catch (e) { return false; } }
    function anythingGiven(pid) {
        var d = dayStart();
        return arr('visits').some(function (v) { return v && !v.voided && v.patientId === pid && (v.timestamp || 0) >= d; })
            || arr('patientCharges').some(function (c) { return c && c.patientId === pid && c.status !== 'cancelled' && (c.createdAt || 0) >= d; })
            || arr('labResults').some(function (r) { return r && r.patientId === pid && (r.requestedAt || 0) >= d; });
    }
    function cashierOn() { try { return hmisStations().some(function (s) { return s.id === 'cashier'; }); } catch (e) { return false; } }
    function seenCashier(q) { try { return hmisStationOf(q) === 'cashier' || (q.stageHistory || []).some(function (h) { return h && h.stage === 'cashier'; }); } catch (e) { return false; } }

    function install() {
        // the buttons on every station card
        wrap('hmisStationActions', function (orig) {
            return function (q, st) {
                var html = orig.apply(this, arguments);
                try {
                    var id = q.id, pid = String(q.patientId).replace(/'/g, "\\'");
                    var btn = '<button type="button" class="settings-small-btn" style="background:#0e7490; color:#fff;" onclick="hslipOpen(\'' + pid + '\',\'' + id + '\',\'' + (st && st.kind === 'cashier' ? 'cashier' : '') + '\')">🧾 Visit summary (80 mm)</button>';
                    if (st && st.kind === 'cashier') {
                        if (!hasUnpaid(q.patientId)) html = html.replace('💳 Take payment at the counter', '💳 Open cashier — nothing to pay');
                        return btn + html;
                    }
                    return html + btn;
                } catch (e) { return html; }
            };
        });
        // the cashier opens a summary instead of a dead-end message when nothing is owed
        wrap('hmisUiCounter', function (orig) {
            return function (entryId) {
                try {
                    var q = hmisEntry(entryId);
                    if (q && !hasUnpaid(q.patientId)) { hmisStartService(entryId); open(q.patientId, entryId, 'cashier'); try { hmisRefreshBoards(); } catch (e) { /* later */ } return; }
                } catch (e) { /* fall through to the original */ }
                return orig.apply(this, arguments);
            };
        });
        // suggest the cashier as the last stop for anyone who received something, even when nothing is owed
        wrap('hmisSuggestNext', function (orig) {
            return function (q) {
                var r = orig.apply(this, arguments);
                try { if (r === 'discharge' && q && cashierOn() && !seenCashier(q) && anythingGiven(q.patientId)) return 'cashier'; } catch (e) { /* original answer */ }
                return r;
            };
        });
        wrap('hmisOpenFinish', function (orig) {
            return function (entryId) {
                var r = orig.apply(this, arguments);
                try {
                    var q = hmisEntry(entryId), b = $('hmis-modal-body');
                    if (q && b && !b.querySelector('#hs-fin-btn')) b.insertAdjacentHTML('beforeend', '<button type="button" id="hs-fin-btn" class="settings-small-btn" style="margin-top:8px; background:#0e7490; color:#fff;" onclick="hmisCloseModal(); hslipOpen(\'' + String(q.patientId).replace(/'/g, "\\'") + '\',\'' + q.id + '\',\'\')">🧾 Visit summary (80 mm)</button>');
                } catch (e) { /* the finish form works without it */ }
                return r;
            };
        });
        wrap('hmisConfirmFinish', function (orig) {
            return function () {
                var pid = '', eid = '';
                try { eid = $('hmis-finish-entry').value; var q = hmisEntry(eid); pid = q ? q.patientId : ''; } catch (e) { /* none */ }
                var r = orig.apply(this, arguments);
                try { if (pid) setTimeout(function () { offer(pid, eid); }, 300); } catch (e2) { /* none */ }
                return r;
            };
        });
        wrap('settleLoadedCharges', function (orig) {
            return function (sale, paid) {
                var r = orig.apply(this, arguments);
                try {
                    var pids = {}; (sale && sale.chargeIds || []).forEach(function (id) { var c = arr('patientCharges').find(function (x) { return x.id === id; }); if (c) pids[c.patientId] = 1; });
                    var list = Object.keys(pids); if (list.length === 1) setTimeout(function () { offer(list[0], ''); }, 900);
                } catch (e) { /* the payment is already complete */ }
                return r;
            };
        });
    }
    setTimeout(install, 1500);
})();
</script>
