<!-- CONNECTIVITY (zip 129) ---------------------------------------------------------------------------------------------------
         ONE place decides whether this device is online (window.PosNet). Nothing else sets "Offline".
           * Why: the dot used to turn "Offline" whenever the heaviest request (/api/pos-sync) was slow or failed — and a device that
             could not finish one push (its whole history on a slow line, a "too large" answer, a licence answer) never ran
             another pull, so nothing ever set it back: OFFLINE with working internet, "retrying… sending…" for ever.
           * States: online · checking · offline (this device has no internet) · backend_unavailable (internet works, the POS server
             did not answer in time — retried quietly; shown to people only as "saving on this device") · auth_required (the server answered 403: licence) · config_error (the server
             refused, e.g. shop too large). A failed sync request is NEVER taken as "offline" by itself: it asks for a check.
           * The check: GET /api/health (no licence, no data, never cached) — answered → reachable; then, only if that failed,
             an independent internet probe (no-cors, Cloudflare + Google) — reachable → backend_unavailable, else offline.
             navigator.onLine is used only as a hint (it is wrong on some phones and PCs).
           * zip 194: device pairing no longer exists. A 401 (an old server's 'device_not_paired') is IGNORED here: it never sets auth_required,
             never stops pulls or pushes; the next poll simply tries again. The scary bottom "Retry" bar is gone; offline /
             backend_unavailable show only a small, calm, non-blocking pill "Saving on this device - will sync automatically".
           * Recovery is automatic, without a refresh: the browser's online event, the app coming back to the screen, focus,
             pageshow / resume (PWA), a network change (Wi-Fi ⇄ mobile data), waking from sleep, a tap on the dot, and a steady
             retry with backoff (2 s, 4 s, 8 s, 15 s, then every 30 s) while not online. The moment it is online again, the
             waiting sales are sent and the shop is fetched (syncRetryNow).
         Self-contained on purpose (same code in every app and the owner console). -->
    <script>
    (function () {
        'use strict';
        if (window.PosNet) return;
        var HEALTH = '/api/health';
        var PROBES = ['https://www.gstatic.com/generate_204', 'https://1.1.1.1/cdn-cgi/trace'];
        // zip 147 — THIS SITE ITSELF is asked first. "No internet" was decided by two OUTSIDE sites: on a network that blocks or
        // intercepts them (some ISPs, office firewalls, DNS filters), one slow or blocked health check made the app say "no internet"
        // while the POS site itself was reachable. Any answer from our own site (even a 404) proves the device is online. /favicon.ico
        // is never served by the service worker (only the page, the manifest and the icons are), so this is a real network answer.
        var OWN_PROBE = '/favicon.ico';
        var BACKOFF = [2000, 3000, 5000, 8000, 12000];       // zip 170: was up to 30 s between checks while "offline" - a connection that came back waited that long to be noticed
        var S = { state: 'checking', detail: '', since: Date.now(), lastOk: 0, lastCheck: 0, fails: 0, nextAt: 0, checking: null, checkStarted: 0, lastTick: Date.now(), authIssue: '', lastSync: null, history: [] };
        var listeners = [];
        var MSG = {
            online: 'Online',
            checking: 'Checking the connection…',
            offline: 'Saving on this device - will sync automatically.',
            backend_unavailable: 'Saving on this device - will sync automatically.',
            auth_required: 'Connected — the shop\'s link needs attention before this device can sync. Selling works; contact support.',
            security_check: 'Connected — but Cloudflare\'s security check is holding back this browser\'s requests to the POS server. Tap the dot to clear it (the page reloads once; nothing is lost).',
            config_error: 'Connected — but the server refused the sync. Nothing is lost; support has been told.',
        };
        // What the last check actually saw (zip 147): shown when the dot is tapped, and sent to the Owner Console's Errors tab when this
        // device is shown anything but Online (see reportEpisode) — so a wrong "offline" on a real phone can be traced to its cause.
        S.diag = null;
        function note(kind, detail) { S.history.unshift({ at: Date.now(), kind: kind, detail: String(detail || '').slice(0, 120) }); if (S.history.length > 40) S.history.length = 40; }

        function set(state, detail) {
            var prev = S.state;
            S.detail = detail || '';
            if (state === 'online') { S.fails = 0; }
            if (state === prev) { paint(); return; }
            S.state = state; S.since = Date.now();
            note('state', prev + ' -> ' + state + (detail ? ' (' + detail + ')' : ''));
            listeners.forEach(function (fn) { try { fn(state, prev); } catch (e) { /* a listener never breaks the manager */ } });
            paint();
            // zip 186: the FIRST verdict of a session is the start-up one (the app's own start-up sync is running), whatever it is. It used to be
            // "the first time it goes online": a till opened with no signal (verdict: offline) had its first return to online swallowed as if it
            // were start-up, so nothing was sent and the socket was not reopened until the next 7 s poll happened to get through.
            var first = !S.settled; if (state !== 'checking') S.settled = true;
            if (state === 'online' && prev !== 'online') recover(prev, first);
        }
        // Back online: send what is waiting and fetch the shop — right away, no refresh.
        function recover(prev, first) {
            if (first && prev === 'checking') return;               // the first verdict at start-up: the app's own start-up sync is already running
            try { window.__pushBackoffUntil = 0; } catch (e) { /* none */ }
            setTimeout(function () {
                try { if (typeof window.syncRetryNow === 'function') window.syncRetryNow(); } catch (e) { /* the poll carries on */ }
                try { if (typeof window.connectSyncSocket === 'function') window.connectSyncSocket(); } catch (e) { /* optional */ }
            }, 0);
        }

        function timed(url, opts, ms) {
            var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
            var o = Object.assign({ cache: 'no-store', credentials: 'same-origin' }, opts || {});
            if (ctrl) o.signal = ctrl.signal;
            var t = setTimeout(function () { try { ctrl && ctrl.abort(); } catch (e) {} }, ms);
            return fetch(url, o).then(function (res) { clearTimeout(t); return { res: res }; }, function (err) { clearTimeout(t); return { err: err, timedOut: !!(err && err.name === 'AbortError') }; });
        }
        // -> { kind: 'ok' | 'http' | 'timeout' | 'neterr', status }
        function probeHealth(ms) {
            // (no ?deep=1: "is the server reachable?" must not wait on a storage read — a storage problem answers 503 on sync anyway)
            var t0 = Date.now();
            return timed(HEALTH + '?t=' + Date.now(), { method: 'GET' }, ms).then(function (r) {
                var out;
                if (r.res) {
                    var hd = r.res.headers;
                    out = { kind: r.res.ok ? 'ok' : 'http', status: r.res.status, ct: String(hd.get('content-type') || '').slice(0, 40), ray: hd.get('cf-ray') || '' };
                    // Cloudflare answered with a security challenge instead of the POS server (Bot Fight Mode / WAF / Security Level):
                    // a script cannot solve it — only loading the page can (see sw.js, which lets that page through). zip 147
                    if (isChallenge(r.res)) out.kind = 'challenge';
                } else {
                    out = { kind: r.timedOut ? 'timeout' : 'neterr', status: 0, err: r.err ? String(r.err.name || '') + ': ' + String(r.err.message || '').slice(0, 80) : '' };
                }
                out.ms = Date.now() - t0;
                return out;
            });
        }
        function isChallenge(res) {
            try { return String(res.headers.get('cf-mitigated') || '').toLowerCase() === 'challenge'; } catch (e) { return false; }
        }
        // Does THIS SITE answer at all (any status)? -> true / false. zip 147
        function probeOwnSite(ms) {
            if (window.__posNetOwnProbe) return window.__posNetOwnProbe();                    // (tests)
            return timed(OWN_PROBE + '?posnet=' + Date.now(), { method: 'GET' }, ms).then(function (r) { return !!r.res; });
        }
        // zip 186: does the POS's own SYNC endpoint answer? It is the request the app really depends on, so it is the best second opinion when
        // the health endpoint alone fails (blocked or filtered by a firewall / content filter / proxy, or just slow). A far-future ?since= makes
        // the answer the few-byte "unchanged". Only a 2xx JSON answer shaped like a sync reply counts (a captive portal's page does not). -> { kind: 'ok' | 'http' | 'other' | 'none' }
        function probeSync(ms) {
            if (window.__posNetSyncProbe) return window.__posNetSyncProbe();                  // (tests)
            var url = '/api/pos-sync?since=99999999999999';
            try { if (typeof window.apiUrl === 'function') url = window.apiUrl(url); } catch (e) { /* plain path */ }
            return timed(url, { method: 'GET' }, ms).then(function (r) {
                if (!r.res) return { kind: 'none' };
                if (!r.res.ok) return { kind: 'http', status: r.res.status };                    // the server answered, with a refusal
                if (!/json/i.test(String(r.res.headers.get('content-type') || ''))) return { kind: 'other', status: r.res.status };
                return r.res.json().then(function (b) { return { kind: b && typeof b === 'object' && (b.unchanged === true || typeof b.updatedAt === 'number') ? 'ok' : 'other', status: r.res.status }; }, function () { return { kind: 'other', status: r.res.status }; });
            });
        }
        // Does this device have internet at all? Opaque (no-cors) requests to two independent sites: any answer = yes.
        function probeInternet(ms) {
            if (window.__posNetInternetProbe) return window.__posNetInternetProbe();          // (tests)
            return new Promise(function (resolve) {
                var left = PROBES.length, done = false;
                PROBES.forEach(function (u) {
                    timed(u + (u.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now(), { mode: 'no-cors', credentials: 'omit' }, ms).then(function (r) {
                        if (done) return;
                        if (r.res) { done = true; resolve(true); return; }
                        if (--left === 0) resolve(false);
                    });
                });
            });
        }

        // zip 186: ANY answer from our own /api/ is news about the connection (the app's fetch wrapper in device-security.html calls this for every
        // API response). 2xx = the POS server is reachable and working: online again, at once, without waiting for the next check. Any other
        // answer proves the INTERNET works (the server answered), so a device shown "offline" is at least "server not answering". Pairing /
        // licence / security-check states are left to the code that set them.
        function seen(status, contentType) {
            try {
                status = Number(status) || 0;
                if (!status) return;
                if (/text\/html/i.test(String(contentType || ''))) return;          // a captive portal's login page is an answer from somebody else
                if (status >= 200 && status < 400) {
                    if (S.state === 'offline' || S.state === 'backend_unavailable' || S.state === 'checking') { S.lastOk = Date.now(); set('online'); S.nextAt = Date.now() + 60000; }
                } else if (S.state === 'offline') {
                    set('backend_unavailable', 'the server answered ' + status);
                }
            } catch (e) { /* never breaks a request */ }
        }

        function schedule() {
            if (S.state === 'online') S.nextAt = Date.now() + 60000;              // heartbeat (sync successes push it further)
            else { S.nextAt = Date.now() + BACKOFF[Math.min(S.fails, BACKOFF.length - 1)]; S.fails++; }
        }
        // The one check. Never throws, never hangs (each probe has its own time limit), never runs twice at once.
        function check(reason) {
            if (S.checking && Date.now() - S.checkStarted < 25000) return S.checking;
            S.checkStarted = Date.now();
            S.lastCheck = Date.now();
            note('check', reason);
            var started = S.checkStarted;
            S.checking = (async function () {
                // a sync that SUCCEEDED while this check was running is newer proof than a failed probe: it wins
                var stale = function () { return S.lastOk > started; };
                try {
                    var hinted = navigator.onLine === false;
                    // zip 145: the same patience whatever navigator.onLine says. Installed apps on some Android phones report "offline"
                    // with working internet; the shorter limits used then (4 s / 3 s) timed out on every check on a slow line, and the app
                    // stayed "Offline" for good. A phone that is REALLY offline fails at once anyway, so waiting longer costs it nothing.
                    var h = await probeHealth(12000);
                    S.diag = { at: Date.now(), reason: String(reason || ''), health: h, navOnLine: navigator.onLine, pwa: isStandalone(), sw: swState() };
                    if (h.kind === 'challenge') {
                        S.lastOk = Date.now();                                          // the network works: Cloudflare answered
                        set('security_check', 'Cloudflare security check (' + h.status + ')');
                    } else if (h.kind === 'ok') {
                        S.lastOk = Date.now();
                        set(S.authIssue ? 'auth_required' : 'online', S.authIssue);
                    } else if (stale()) {
                        set(S.authIssue ? 'auth_required' : 'online', S.authIssue);
                    } else if (h.kind === 'http' && h.status >= 500) {
                        // the server ANSWERED: this device has internet; the POS side is failing (5xx, overloaded, maintenance)
                        set('backend_unavailable', 'the server answered ' + h.status);
                    } else {
                        // The health check got no answer (or a refusal such as 403 / 404 from a filter). Before deciding, ask the other questions - ALL AT ONCE
                        // (zip 170: one after the other was up to 18 s of "Checking…" on a slow line):
                        //  * zip 186: if the health check only RAN OUT OF TIME, once more with the same patience (a slow mobile line is not "no internet");
                        //  * zip 186: does the POS's real sync endpoint answer? (health can be blocked or filtered while sync works);
                        //  * is this site itself reachable / does the internet work at all? Any "yes" is enough.
                        var h2P = h.kind === 'timeout' ? probeHealth(12000) : null;
                        var syncP = probeSync(12000);
                        var ownP = probeOwnSite(9000), netP = probeInternet(9000);
                        var h2 = h2P ? await h2P : null;
                        var sy = await syncP;
                        S.diag.second = h2 ? { kind: h2.kind, status: h2.status } : null; S.diag.sync = sy;
                        if ((h2 && h2.kind === 'ok') || sy.kind === 'ok' || stale()) {
                            S.lastOk = Date.now();
                            set(S.authIssue ? 'auth_required' : 'online', S.authIssue);
                        } else if (h.kind === 'http') {
                            set('backend_unavailable', 'the server answered ' + h.status);
                        } else {
                            var own = await ownP;
                            var net = own || await netP;
                            S.diag.ownSite = own; S.diag.internet = net;
                            if (stale()) set(S.authIssue ? 'auth_required' : 'online', S.authIssue);
                            else if (own || sy.kind === 'http') set('backend_unavailable', h.kind === 'timeout' ? 'the POS server did not answer in time (the site itself did)' : 'the POS server could not be reached (the site itself answered)');
                            else if (net) set('backend_unavailable', h.kind === 'timeout' ? 'the POS server did not answer in time' : 'the POS server could not be reached');
                            else set('offline', hinted ? 'the device reports no network' : 'no answer from the internet');
                        }
                    }
                    reportEpisode();
                } catch (e) {
                    set('backend_unavailable', 'check failed');
                } finally {
                    schedule();
                    S.checking = null;
                }
                return S.state;
            })();
            return S.checking;
        }

        // What the sync code tells it. A request that failed is only a reason to CHECK.
        function report(kind, info) {
            if (kind === 'ok') {
                S.lastOk = Date.now();
                S.authIssue = '';
                if (S.state !== 'online') set('online');
                else paint();
                S.nextAt = Date.now() + 60000;
                return;
            }
            // zip 194: pairing is gone. An old server's 401 / 'device_not_paired' is transient and ignorable: no state change, polls carry on.
            if (kind === 'auth' && (!info || /paired|^auth$/i.test(String(info)))) { note('ignored', 'auth ' + (info || '401')); return; }
            if (kind === 'auth') { S.authIssue = info || 'auth'; S.lastOk = Date.now(); set('auth_required', S.authIssue); return; }
            if (kind === 'challenge') { S.lastOk = Date.now(); set('security_check', info || 'Cloudflare security check'); reportEpisode(); return; }
            if (kind === 'config') { S.lastOk = Date.now(); set('config_error', info || ''); return; }
            if (kind === 'busy') {
                // one "busy, try again in 2 s" is normal traffic; only a server that stays failing is "unavailable"
                if (Date.now() - S.lastOk > 60000) check('server busy for a minute');
                return;
            }
            // 'neterr' / 'timeout': no answer to a sync request — find out why, but do not decide from it
            if (!S.checking) check(info || kind);                            // (one check at a time; each request failure may start one)
        }
        function reportHttp(status, code) {
            status = Number(status) || 0;
            if (status >= 200 && status < 400) return report('ok');
            if (status === 401) return;                                              // zip 194: transient / ignorable (old server's device_not_paired, expired staff token): never auth_required
            if (status === 403) return report('auth', code || 'licence');
            if (status === 413) return code === 'push_too_large' ? report('busy') : report('config', code || 'too large');
            if (code === 'shop_db_unavailable') return report('config', code);      // zip 147: not "busy" — the shop's database is down (see pos-sync)
            if (status === 507 || code === 'storage_full') return report('config', 'storage_full');      // zip 186: the server answered: the internet works, but its storage is full (not "busy", not "offline")
            if (status === 408 || status === 425 || status === 429 || status >= 500) return report('busy', status);
            return report('config', 'http ' + status);
        }

        /* ---- the dot: one picture of connectivity + sync, in plain words ---- */
        function effective(sync) {
            var net = S.state;
            if (net === 'offline' || net === 'backend_unavailable') return 'offline';       // zip 194: calm, never red
            if (net === 'auth_required' || net === 'config_error' || net === 'security_check') return 'error';
            if (sync === 'offline') return 'syncing';                        // a failed request is being checked, not "offline"
            if (net === 'checking' && sync !== 'synced') return 'syncing';
            return sync || 'syncing';
        }
        function message() {
            var net = S.state, sync = S.lastSync;
            if (net === 'online') {
                if (sync === 'synced') return 'Online — everything is on the server';
                if (sync === 'error') return 'Online — Sync problem: the last sync did not go through; retrying by itself (tap to sync now)';
                return 'Online — Syncing… (tap to sync now)';
            }
            if (net === 'auth_required') return S.authIssue === 'licence' ? 'Connected — the shop\'s link is not active. Selling works; contact support.' : MSG.auth_required;
            if (net === 'config_error' && S.detail === 'storage_full') return 'Connected — the server\'s storage is full, so it cannot save changes right now. Selling works and every sale is kept on this device; it is sent by itself once space is freed (support has been told).';
            if (net === 'config_error' && /^shop_db/.test(S.detail || '')) return 'Connected — the server\'s shop database is not responding, so this shop cannot sync yet. Selling works and every sale is kept on this device; it is sent by itself once the server is fixed.';
            return MSG[net] || MSG.checking;
        }
        var origSet = null;
        function paint() {
            try {
                var fn = origSet || window.setSyncStatus;
                if (typeof fn !== 'function') return;
                var eff = effective(S.lastSync);
                if (eff === 'offline' && S.painted !== 'offline') {
                    // black only if it lasts (a phone changing network, a blip): the same calm the dot always had. The timer is not
                    // restarted by later repaints, so it always fires.
                    if (!S.paintTimer) S.paintTimer = setTimeout(function () {
                        S.paintTimer = null;
                        if (effective(S.lastSync) === 'offline' && S.painted !== 'offline') { S.painted = 'offline'; fn('offline'); }
                    }, navigator.onLine === false ? 600 : (window.__syncDotOfflineMs || 3000));
                } else {
                    if (S.paintTimer) { clearTimeout(S.paintTimer); S.paintTimer = null; }
                    if (eff !== S.painted) { S.painted = eff; fn(eff); }         // redraw only on a real change (no flicker)
                }
                var el = document.getElementById('sync-status');
                if (el) { var m = message(); el.title = m; el.setAttribute('aria-label', m); el.dataset.net = S.state; }
            } catch (e) { /* cosmetic */ }
            retryBar();
        }

        /* ---- the calm pill (zip 194; was the "Retry now" bar of zip 186) ----
           While the device is offline / cannot reach the server for more than a few seconds, a SMALL unobtrusive pill says what is happening:
           the work is saved on this device and will sync by itself. No button, no red, never blocks a tap (pointer-events: none), and it
           never claims the server is not answering. It disappears by itself the moment the device is online.
           (window.PosNet.retryNow() still exists for code and tests that call it.) */
        var retryTimer = null, retrying = false;
        var PILL_TEXT = 'Saving on this device - will sync automatically';
        function retryBar() {
            try {
                var bad = S.state === 'offline' || S.state === 'backend_unavailable';
                var el = document.getElementById('posnet-offline-pill');
                var old = document.getElementById('posnet-retry-bar');                  // (an older copy of the page may have left one)
                if (old && old.parentNode) old.parentNode.removeChild(old);
                if (!bad) { if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; } if (el && el.parentNode) el.parentNode.removeChild(el); return; }
                if (el || retryTimer || !document.body) return;
                retryTimer = setTimeout(function () {
                    retryTimer = null;
                    if (S.state !== 'offline' && S.state !== 'backend_unavailable') return;
                    if (document.getElementById('posnet-offline-pill')) return;
                    var pill = document.createElement('div');
                    pill.id = 'posnet-offline-pill'; pill.className = 'no-print'; pill.setAttribute('role', 'status');
                    pill.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:99985;background:rgba(52,73,94,.85);color:#fff;padding:3px 10px;border-radius:999px;font:11px system-ui,sans-serif;pointer-events:none;max-width:calc(80vw / var(--pos-z,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
                    pill.textContent = PILL_TEXT;
                    document.body.appendChild(pill);
                }, window.__posNetRetryBarMs != null ? window.__posNetRetryBarMs : 8000);
            } catch (e) { /* cosmetic */ }
        }
        // window.PosNet.retryNow() (no button any more): check at once, then send + fetch. Never throws; resolves to the state it ended in.
        async function retryNow() {
            if (retrying) return S.state;
            retrying = true;
            try {
                S.checking = null; S.fails = 0; S.nextAt = 0;
                try { window.__pushBackoffUntil = 0; } catch (e) { /* none */ }
                await check('retry button');
                try { if (typeof window.syncRetryNow === 'function') await window.syncRetryNow(); } catch (e) { /* the automatic retry carries on */ }
                try { if (typeof window.connectSyncSocket === 'function') window.connectSyncSocket(); } catch (e) { /* optional */ }
            } catch (e) { /* never throws */ }
            finally {
                retrying = false;
            }
            return S.state;
        }
        function wrapDot() {
            if (typeof window.setSyncStatus !== 'function' || window.setSyncStatus.__posNet) return;
            origSet = window.setSyncStatus;
            var w = function (status) { S.lastSync = status; paint(); };
            w.__posNet = true;
            window.setSyncStatus = w;
        }

        function isStandalone() { try { return !!((window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone); } catch (e) { return false; } }
        function swState() { try { return navigator.serviceWorker && navigator.serviceWorker.controller ? 'controlled' : 'none'; } catch (e) { return 'n/a'; } }
        // DIAGNOSTICS (zip 147): anything but Online is reported ONCE per cause and per page session to the Owner Console's 🐞 Errors tab,
        // with the evidence (what the health check got, whether our own site and the outside sites answered, what the browser said).
        // Grouped by cause, so 50 phones with the same problem are one line with a count. A report made while offline is queued and
        // sent when the connection is back (see error-reporting.html).
        var reported = {};
        function reportEpisode() {
            try {
                if (S.state === 'online' || S.state === 'checking' || typeof window.__reportClientError !== 'function') return;
                var d = S.diag || {}, h = d.health || {};
                var cause = S.state + ' | health ' + (h.kind || '?') + (h.status ? ' ' + h.status : '') + (d.ownSite === undefined ? '' : ' | own site ' + (d.ownSite ? 'answered' : 'silent')) + (d.internet === undefined ? '' : ' | internet ' + (d.internet ? 'yes' : 'no'));
                if (reported[cause]) return;
                reported[cause] = 1;
                window.__reportClientError('Connectivity shown as ' + S.state.replace('_', ' ') + ' — ' + cause, JSON.stringify({ detail: S.detail, diag: d, ua: navigator.userAgent, release: window.__APP_RELEASE || '', history: S.history.slice(0, 8) }).slice(0, 1400));
            } catch (e) { /* diagnostics never break the app */ }
        }
        // Tap the dot while Cloudflare's check is holding requests: load the page once so the check can run (sw.js lets it through).
        document.addEventListener('click', function (ev) {
            try {
                var dot = ev.target && ev.target.closest && ev.target.closest('#sync-status');
                if (dot && S.state === 'security_check') { location.reload(); }
            } catch (e) { /* optional */ }
        });

        /* ---- when to check ---- */
        function tick() {
            var now = Date.now();
            var gap = now - S.lastTick, slept = gap > 20000;                 // timers paused: the device slept or the app was frozen
            S.lastTick = now;
            if (slept) { note('wake', Math.round(gap / 1000) + ' s'); S.nextAt = 0; }
            if (S.checking && now - S.checkStarted > 25000) S.checking = null;   // a hung check never blocks the next one
            if (document.visibilityState === 'hidden' && S.state === 'online') return;
            if (now >= S.nextAt) check(slept ? 'woke up' : 'timer');
        }
        function soon(reason) { S.fails = 0; S.nextAt = 0; check(reason); }
        window.addEventListener('online', function () { soon('network back'); setTimeout(function () { if (S.state !== 'online') soon('network back (settled)'); }, 3000); });
        window.addEventListener('offline', function () { soon('network lost'); });
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') soon('back on screen'); });
        window.addEventListener('focus', function () { if (S.state !== 'online' || Date.now() - S.lastOk > 30000) soon('focus'); });
        window.addEventListener('pageshow', function () { soon('page shown'); });
        document.addEventListener('resume', function () { soon('resumed'); });
        try { var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection; if (c && c.addEventListener) c.addEventListener('change', function () { soon('network changed'); }); } catch (e) { /* optional */ }

        window.PosNet = {
            get state() { return S.state; },
            get detail() { return S.detail; },
            get lastOk() { return S.lastOk; },
            check: check,
            seen: seen,
            retryNow: function () { return retryNow(); },
            report: report,
            reportHttp: reportHttp,
            message: message,
            online: function () { return S.state === 'online'; },
            offline: function () { return S.state === 'offline'; },
            subscribe: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (f) { return f !== fn; }); }; },
            history: function () { return S.history.slice(); },
            diagnostics: function () { return S.diag ? JSON.parse(JSON.stringify(S.diag)) : null; },
            _state: S,
        };
        // For feature code that only needs "is it worth trying the network?" — false only when the manager has CHECKED there is none.
        window.posNetOffline = function () { return S.state === 'offline'; };

        // zip 145: the service worker downloaded a newer version of the app while this (older) one was open — offer it. (Installed apps
        // used to stay on the copy they were installed with; see sw.js.)
        function showUpdateReady() {
            try {
                if (document.getElementById('posnet-update-ready')) return;
                var bar = document.createElement('div');
                bar.id = 'posnet-update-ready';
                bar.setAttribute('role', 'status');
                bar.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100000;background:#2c3e50;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);font:14px system-ui,sans-serif;display:flex;gap:10px;align-items:center;max-width:calc(94vw / var(--pos-z,1));';
                bar.innerHTML = '<span>A newer version of the app is ready.</span>';
                var b = document.createElement('button');
                b.type = 'button'; b.textContent = 'Update now';
                b.style.cssText = 'background:#27ae60;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;';
                b.onclick = function () { location.reload(); };
                bar.appendChild(b);
                (document.body || document.documentElement).appendChild(bar);
                // zip 232: shown for 3 seconds only - it must never sit on the screen over the till (the new version still loads on the next open)
                setTimeout(function () { try { if (bar.parentNode) bar.parentNode.removeChild(bar); } catch (e) { /* gone */ } }, 3000);
            } catch (e) { /* cosmetic */ }
        }
        try {
            if (navigator.serviceWorker && navigator.serviceWorker.addEventListener) {
                navigator.serviceWorker.addEventListener('message', function (e) { if (e && e.data && e.data.type === 'app-update-ready') showUpdateReady(); });
            }
        } catch (e) { /* no service worker */ }

        function boot() { wrapDot(); check('start'); }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
        setInterval(tick, 2000);
    })();
