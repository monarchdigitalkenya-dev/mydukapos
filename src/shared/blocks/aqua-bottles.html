<!-- AQUA BOTTLES -----------------------------------------------------------------------------------------------------------------------------------
     zip 365, Aqua POS. Finished water is kept PER BOTTLE: "500ml Bale (Case) - 24 pcs — Grip" has its own stock, price, stock take line and
     Sales Counter card, separate from "— Aqua clear". These are ordinary products (code = the plain item's code + a suffix) with:
       bottleOf    = the plain item they come from (e.g. the "500ml Sealed Bottle"), bottleMatId = the bottle material (Materials, category Bottle),
       clientId / clientName = set when that bottle is a client's own branded bottle (e.g. Jays Hexa): counted in Inventory and Stock Take,
                   but NOT shown on the Sales Counter or Price List.
     A bale is linked to its own sealed bottle (as the plain bale is linked to the plain bottle), so selling a bale or loose bottles of the same
     bottle draws on one pool. Production of the plain item goes to the bottle actually picked (created on first use). The plain item keeps any
     older stock and drops off the Sales Counter once it is empty and bottle items exist for it.
     📋 Paste stock balances (Production tab): paste a list like "500ml Aqua clear 38bales" - each line SETS that bottle's stock (like a stock
     take), after a preview you can correct. Read on the device (offline, free); lines it cannot read can be sent to the AI reader.
     Shared via `npm run sync` (Aqua POS only); never hand-edit it inside the app. -->

        var best = cands[0];

        r.sure = !!(best && best.s >= 0.75 && (!cands[1] || cands[1].s < best.s));
        var m = r.matId ? mats().filter(function (x) { return x.id === r.matId; })[0] : null;
        var named = clientIn(r.name);
        /* "Jays Hexa" names a client: a general "Hexa plain" bottle is not theirs - it becomes the client's own bottle */
        if (named && m && m.clientId !== named.id) { m = null; r.matId = ''; r.sure = false; }
        var c = m && m.clientId ? custs().filter(function (x) { return x.id === m.clientId; })[0] : named;
        r.clientId = m && m.clientId ? m.clientId : (c ? c.id : '');
        r.newName = r.name ? r.name.replace(/\s+/g, ' ') + ' ' + sizeLabel(r.size) : '';
        return r;
    };

    var P = null;           // the open paste: { text, plan, site }
    function ov(h) { $('aqb-box').innerHTML = h; $('aqb-ov').classList.add('on'); }
    AB.close = function () { $('aqb-ov').classList.remove('on'); $('aqb-box').innerHTML = ''; };
    AB.openPaste = function () {
        var site = siteNow();
        ov('<h3>📋 Paste stock balances</h3><p class="aqb-sub">Paste the balances exactly as you have them, one bottle per line, e.g. <b>500ml Aqua clear 38bales</b> or <b>1ltr Grip blue 26 bales</b>. Each bottle\'s stock is <b>set</b> to the number you paste (like a stock take). You see everything before anything changes.</p>' +
            (site ? '' : '<div class="aqb-err">Pick Production (or the Shop) at the top first: the balances are for one place.</div>') +
            '<textarea id="aqb-text" placeholder="Packaged Water balances as @ 04/5/2026&#10;&#10;1ltr Grip blue 26bales&#10;500ml Aqua clear 38bales&#10;1500ml Grip clear 4bales" spellcheck="false">' + esc(P && P.text || '') + '</textarea>' +
            '<div class="aqb-row"><button class="aqb-b go" onclick="AquaBottles.preview()"' + (site ? '' : ' disabled') + '>👀 Read and check</button><button class="aqb-b" onclick="AquaBottles.close()">Cancel</button></div>');
        setTimeout(function () { var t = $('aqb-text'); if (t) t.focus(); }, 30);
    };
    function bottleOptions(size, sel) {
        var list = bottlesOfSize(size);
        return '<option value="">➕ New bottle (name below)</option>' + list.map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === sel ? ' selected' : '') + '>' + esc(m.name) + (m.clientId ? ' (client)' : '') + '</option>'; }).join('');
    }
    function clientOptions(sel) {
        var cl = custs().filter(function (c) { return live(c) && c.name; }).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
        return '<option value="">No - general bottle</option><option value="__new">➕ New client…</option>' + cl.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
    }
    function curStockText(r) {
        if (!r.matId) return 'new';
        var m = mats().filter(function (x) { return x.id === r.matId; })[0]; if (!m) return '';
        var pl = plainOf(r.size, 'bale') || plainOf(r.size, 'sealed'); if (!pl) return '0';
        var v = AB.varietiesOf(pl.code).filter(function (x) { return x.bottleMatId === m.id; })[0]; if (!v) return '0';
        return String(Math.round(qtyNow(v) * 100) / 100) + (kindOf(v) === 'bale' ? ' bales' : ' bottles');
    }
    AB.preview = function () {
        var t = $('aqb-text'); P = P || {}; P.text = t ? t.value : P.text; P.site = siteNow();
        P.plan = AB.parse(P.text);
        renderPreview();
    };
    function renderPreview() {
        var pl = P.plan, rows = pl.rows;
        var sizes = {}; rows.forEach(function (r) { sizes[r.size] = 1; });
        var h = '<h3>👀 Check before saving</h3><p class="aqb-sub">' + rows.length + ' line' + (rows.length === 1 ? '' : 's') + ' read' + (pl.date ? ' · balances as at <b>' + esc(pl.date) + '</b>' : '') + '. Change anything that is wrong, then press Save.</p>';
        h += '<table class="aqb-t"><thead><tr><th>You typed</th><th>Size</th><th>Bottle</th><th>Client\'s bottle?</th><th>Set stock to</th><th>Now</th></tr></thead><tbody>';
        rows.forEach(function (r, i) {
            h += '<tr class="' + (r.clientId ? 'cl' : '') + (!r.matId && !r.newName ? ' bad' : '') + '"><td data-l="You typed" class="aqb-src">' + esc(r.text) + '</td>' +
                '<td data-l="Size"><b>' + esc(sizeLabel(r.size)) + '</b></td>' +
                '<td data-l="Bottle"><select onchange="AquaBottles.set(' + i + ',\'matId\',this.value)">' + bottleOptions(r.size, r.matId) + '</select>' +
                (r.matId ? (r.sure ? '' : '<div class="aqb-hint">⚠️ Best guess - please check</div>') : '<input style="margin-top:4px" value="' + esc(r.newName) + '" placeholder="new bottle name" onchange="AquaBottles.set(' + i + ',\'newName\',this.value)"><div class="aqb-hint"><span class="aqb-pill new">new</span> added to Materials as a bottle</div>') + '</td>' +
                '<td data-l="Client\'s bottle?"><select onchange="AquaBottles.set(' + i + ',\'clientId\',this.value)">' + clientOptions(r.clientId) + '</select>' + (r.clientId ? '<div class="aqb-hint"><span class="aqb-pill cl">client</span> counted, not on the Sales Counter</div>' : '') + '</td>' +
                '<td data-l="Set stock to"><div style="display:flex;gap:6px"><input type="number" min="0" step="any" value="' + esc(r.qty) + '" onchange="AquaBottles.set(' + i + ',\'qty\',this.value)" style="max-width:110px"><select onchange="AquaBottles.set(' + i + ',\'unit\',this.value)" style="max-width:110px"><option value="bales"' + (r.unit === 'bales' ? ' selected' : '') + '>bales</option><option value="bottles"' + (r.unit === 'bottles' ? ' selected' : '') + '>bottles</option></select></div></td>' +
                '<td data-l="Now" class="aqb-hint">' + esc(curStockText(r)) + '</td></tr>';
        });
        h += '</tbody></table>';
        if (!rows.length) h += '<div class="aqb-err">No line could be read. Each line needs a size (500ml, 1ltr…), the bottle name and a number (e.g. 38bales).</div>';
        if (pl.skipped.length) h += '<div style="margin-top:10px"><b>Lines not read (' + pl.skipped.length + ')</b>' + pl.skipped.map(function (s) { return '<div class="aqb-hint">Line ' + s.n + ': <span class="aqb-src">' + esc(s.text) + '</span> - ' + esc(s.why) + '</div>'; }).join('') + '<div class="aqb-row" style="margin-top:6px"><button class="aqb-b ai" id="aqb-ai" onclick="AquaBottles.ai()">✨ Read these lines with AI</button><span class="aqb-hint">Needs internet. Only these lines are sent.</span></div></div>';
        var plainSizes = Object.keys(sizes).map(Number).filter(function (s) { var a = plainOf(s, 'sealed'), b = plainOf(s, 'bale'); return (a && qtyNow(a) > 0) || (b && qtyNow(b) > 0 && !b.linkedBottleCode); });
        if (plainSizes.length) h += '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13.5px"><input type="checkbox" id="aqb-zero" checked style="width:20px;height:20px;flex:none"> <span>This list is the full balance: set the old stock that has <b>no bottle chosen</b> for ' + plainSizes.map(sizeLabel).join(', ') + ' to 0 (otherwise it would be counted twice).</span></label>';
        h += '<div class="aqb-err" id="aqb-err"></div><div class="aqb-row"><button class="aqb-b go" onclick="AquaBottles.apply()"' + (rows.length ? '' : ' disabled') + '>💾 Save balances</button><button class="aqb-b" onclick="AquaBottles.openPaste()">← Edit the text</button><button class="aqb-b" onclick="AquaBottles.close()">Cancel</button></div>';
        ov(h);
    }
    AB.set = function (i, k, v) {
        var r = P && P.plan && P.plan.rows[i]; if (!r) return;
        if (k === 'qty') r.qty = Math.max(0, Number(v) || 0);
        else if (k === 'matId') { r.matId = v; r.sure = true; var m = mats().filter(function (x) { return x.id === v; })[0]; if (m && m.clientId) r.clientId = m.clientId; renderPreview(); return; }
        else if (k === 'clientId') {
            if (v === '__new') {
                var nm = String(prompt('Name of the client (as in My Customers):', (words(r.name)[0] || '').replace(/^./, function (x) { return x.toUpperCase(); })) || '').trim();
                if (!nm) { renderPreview(); return; }
                var ex = custs().filter(function (c) { return live(c) && norm(c.name) === norm(nm); })[0];
                if (!ex) { ex = { id: 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: nm, phone: '', tokens: 0, createdAt: Date.now(), updatedAt: Date.now() }; custs().push(ex); P.newClients = (P.newClients || 0) + 1; }
                v = ex.id;
            }
            r.clientId = v;
            /* a general bottle never becomes a client's: this line gets its own client bottle */
            var mm = r.matId ? mats().filter(function (x) { return x.id === r.matId; })[0] : null;
            if (v && mm && mm.clientId !== v) { r.matId = ''; if (!r.newName) r.newName = (r.name || 'Client bottle') + ' ' + sizeLabel(r.size); }
            if (!v && mm && mm.clientId) { r.matId = ''; }
            renderPreview(); return;
        }
        else r[k] = v;
    };
    /* the lines the device could not read go to the AI reader (the same one as Import from Excel); its answers are matched here, on the device */
    AB.ai = function () {
        var sk = P && P.plan && P.plan.skipped; if (!sk || !sk.length) return;
        var b = $('aqb-ai'); if (b) { b.disabled = true; b.textContent = '✨ Reading…'; }
        var text = 'Item | Balance\n' + sk.map(function (s) { return s.text + ' | '; }).join('\n');
        var url = typeof apiUrl === 'function' ? apiUrl('/api/ai-capture-list') : '/api/ai-capture-list';
        fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stockDebtImport: { textDocument: text, itemsOnly: true } }) })
            .then(function (res) { return res.json().then(function (d) { if (!res.ok || d.error) throw new Error(d.error || 'The AI reader is not available right now.'); return d; }); })
            .then(function (d) {
                var got = 0, left = [];
                (d.stock_items || []).forEach(function (it) {
                    var t = (it.name + ' ' + (it.sku || '')).trim(), sz = readSize(t), q = Number(it.closing_qty) || Number(it.opening_qty) || 0;
                    if (!sz.size || !(q >= 0)) return;
                    var unit = /bottle|btl|pcs|piece/i.test(t) ? 'bottles' : 'bales';
                    P.plan.rows.push(AB.matchRow({ n: 0, text: '✨ ' + it.name + (it.sku ? ' ' + it.sku : '') + ' → ' + q, size: sz.size, name: sz.rest.replace(/\b(bales?|bottles?|pcs)\b/gi, '').trim(), qty: q, unit: unit })); got++;
                });
                if (got) P.plan.skipped = left;
                toast(got ? '✨ AI read ' + got + ' line(s). Check them, then Save.' : 'The AI could not read those lines either. Type them as: 500ml Aqua clear 38bales', !got);
                renderPreview();
            })
            .catch(function (e) { toast((e && e.message) || 'Could not reach the AI reader. Check the internet, or retype those lines.', true); if (b) { b.disabled = false; b.textContent = '✨ Read these lines with AI'; } });
    };
    function setQty(v, site, qty, note) {
        var before = 0;
        try { before = typeof stockAt === 'function' ? stockAt(v, site) : Number(v.qty) || 0; } catch (e) { before = Number(v.qty) || 0; }
        if (typeof setStockAt === 'function') setStockAt(v, site, qty); else { v.stock = v.stock || {}; v.stock[site] = qty; }
        try { if (typeof activeSiteId !== 'undefined' && activeSiteId === site) v.qty = qty; } catch (e) { v.qty = qty; }
        v.updatedAt = Date.now();
        var d = Math.round((qty - before) * 1000) / 1000;
        if (d) { try { logStockMovement(v.code, v.name, d, note, site); } catch (e2) { /* the stock is set either way */ } }
        return d;
    }
    function setTracked(v, site, bottles, note) {
        var before = 0; try { before = typeof bottleStockAt === 'function' ? bottleStockAt(v, site) : Number(v.bottleStock) || 0; } catch (e) { before = 0; }
        try { if (typeof setBottleStockAt === 'function') setBottleStockAt(v, site, bottles); } catch (e) { /* older build */ }
        try { if (activeSiteId === site) { v.bottleStock = bottles; if (typeof syncBaleTrackingFields === 'function') syncBaleTrackingFields(v); } } catch (e2) { v.bottleStock = bottles; }
        v.updatedAt = Date.now();
        var bpb = bpbOf(v, sizeOf(v)), d = (bottles - before) / (bpb || 1);
        if (d) { try { logStockMovement(v.code, v.name, Math.round(d * 1000) / 1000, note, site); } catch (e3) { /* logged best-effort */ } }
    }
    /* SET one bottle's stock: bales are stored as sealed bottles when the bale is linked to its bottle (one pool) */
    function setBalance(size, m, qty, unit, site, note) {
        var vs = AB.ensureFor(size, m); if (!vs) throw new Error('No item for ' + sizeLabel(size));
        var bale = vs.bale, sealed = vs.sealed, bpb = bpbOf(bale || sealed, size);
        var bottles = unit === 'bottles' ? qty : qty * bpb;
        if (bale && bale.trackBottles) { setTracked(bale, site, bottles, note); return; }
        if (bale && bale.linkedBottleCode && sealed && bale.linkedBottleCode === sealed.code) { setQty(sealed, site, bottles, note); return; }
        if (bale && unit !== 'bottles') { setQty(bale, site, qty, note); return; }
        if (sealed) { setQty(sealed, site, bottles, note); return; }
        if (bale) setQty(bale, site, bottles / (bpb || 1), note);
    }
    AB.apply = function () {
        var pl = P && P.plan, site = P && P.site, err = function (t) { var e = $('aqb-err'); if (e) e.textContent = t; };
        if (!pl || !pl.rows.length) return err('Nothing to save.');
        if (!site) return err('Pick Production (or the Shop) at the top first.');
        try { if (typeof isAdminServing === 'function' && !isAdminServing()) return err('Only the Admin can set stock balances.'); } catch (e) { /* allowed */ }
        var bad = pl.rows.filter(function (r) { return !r.matId && !String(r.newName || '').trim(); })[0];
        if (bad) return err('Line "' + bad.text + '": choose the bottle or type a name for the new one.');
        var seen = {}, dup = null;
        pl.rows.forEach(function (r) { var k = r.size + ':' + (r.matId || norm(r.newName)); if (seen[k]) dup = r; seen[k] = 1; });
        if (dup) return err('The bottle on "' + dup.text + '" is listed twice. Keep one line per bottle.');
        var zero = $('aqb-zero') && $('aqb-zero').checked;
        var note = 'Balances' + (pl.date ? ' as at ' + pl.date : '') + ' (pasted in Production)';
        var snap = JSON.stringify(prods()), msnap = JSON.stringify(mats()), done = 0, made = 0;
        try {
            if (typeof commitQtyView === 'function') commitQtyView(activeSiteId);
            pl.rows.forEach(function (r) {
                var m = r.matId ? mats().filter(function (x) { return x.id === r.matId; })[0] : null;
                if (!m) {
                    var res = AF().saveMaterial({ name: String(r.newName).trim(), cat: 'bottle', sizes: [r.size], kinds: ['sealed', 'bale'] });
                    if (!res.ok) throw new Error(res.error); m = res.material; made++;
                }
                var c = r.clientId ? custs().filter(function (x) { return x.id === r.clientId; })[0] : null;
                if ((m.clientId || '') !== (c ? c.id : '')) { m.clientId = c ? c.id : null; m.clientName = c ? c.name : null; m.updatedAt = Date.now(); AB.refreshBottle(m.id); }
                setBalance(r.size, m, Number(r.qty) || 0, r.unit, site, note); done++;
            });
            pl.rows.forEach(function (r) { ['sealed', 'bale'].forEach(function (k) { var p0 = plainOf(r.size, k); if (p0 && !p0.perBottle) { p0.perBottle = true; p0.updatedAt = Date.now(); } }); });
            if (zero) {
                var sizes = {}; pl.rows.forEach(function (r) { sizes[r.size] = 1; });
                Object.keys(sizes).map(Number).forEach(function (s) {
                    ['sealed', 'bale'].forEach(function (k) { var p = plainOf(s, k); if (!p) return; if (k === 'bale' && p.linkedBottleCode) return; if (p.trackBottles) setTracked(p, site, 0, note + ' - no bottle chosen'); else setQty(p, site, 0, note + ' - no bottle chosen'); });
                });
            }
            if (typeof syncQtyView === 'function') syncQtyView(activeSiteId);
            if (typeof syncLinkedBaleQuantities === 'function') syncLinkedBaleQuantities();
        } catch (e) {
            prods().length = 0; JSON.parse(snap).forEach(function (p) { prods().push(p); });
            mats().length = 0; JSON.parse(msnap).forEach(function (m) { mats().push(m); });
            try { if (typeof syncQtyView === 'function') syncQtyView(activeSiteId); } catch (e2) { /* restored */ }
            return err('Nothing was changed: ' + (e && e.message || e));
        }
        save();
        AB.close(); P = null;
        var unpriced = prods().filter(function (p) { return live(p) && p.bottleOf && !p.clientId && !(Number(p.price) > 0) && !(Array.isArray(p.priceTiers) && p.priceTiers.length); }).map(function (p) { return sizeLabel(sizeOf(p)); }).filter(function (x, i, a) { return a.indexOf(x) === i; });
        toast('✅ ' + done + ' bottle balance(s) saved' + (made ? ', ' + made + ' new bottle(s) added to Materials' : '') + '.' + (unpriced.length ? ' ' + unpriced.join(', ') + ' has no price yet: set it in Inventory before it shows on the Sales Counter.' : ''));
        refreshScreens();
    };
    function refreshScreens() {
        ['renderAllItemsGrid', 'renderInventoryTab', 'renderProductsTable', 'renderStockTakeTab', 'renderProductionTab'].forEach(function (f) { try { if (typeof window[f] === 'function') window[f](); } catch (e) { /* that screen redraws when opened */ } });
        try { if (AM()) AM().render(); } catch (e) { /* ok */ }
    }
    AB.refresh = refreshScreens;

    // ------------------------------------------------------------------ wiring
    var wired = false;
    function wire() {
        if (wired) return;
        var A = AM(), F = AF(); if (!A || !F || typeof F.renderFlow !== 'function') return;
        var oStatus = A.orderStatus;
        A.orderStatus = function (ref, code) {
            if (!ref || typeof productionLog === 'undefined') return oStatus.apply(this, arguments);
            var root = rootOf(code), produced = 0;
            productionLog.forEach(function (r) { if (r && r.orderRef === ref && rootOf(r.targetId) === root && !r.reversedBy && r.status !== 'reversed') produced += Number(r.qty) || 0; });
            return { produced: produced };
        };
        var oProduce = A.produce;
        A.produce = function (o) { var o2 = o; try { o2 = AB.redirect(o); } catch (e) { o2 = o; } return oProduce.call(this, o2); };
        var oFlow = F.renderFlow;
        F.renderFlow = function () {
            var r = oFlow.apply(this, arguments), root = $('aqf-root');
            if (root && !root.querySelector('.aqb-card')) root.insertAdjacentHTML('afterbegin', '<div class="aqb-card"><div style="flex:1;min-width:200px"><b>📋 Paste stock balances</b><div class="aqb-hint">Paste a list like “500ml Aqua clear 38bales” and each bottle\'s stock is set to it. Every bottle keeps its own stock.</div></div><button class="aqb-b go" onclick="AquaBottles.openPaste()">📋 Paste balances</button>' + (AB.anyOn() ? '<span class="aqb-hint" style="flex-basis:100%">🍼 Stock per bottle is on: each run goes to the bottle you pick.</span>' : '<button class="aqb-b" onclick="AquaBottles.switchOn(true)" title="Each run goes to the bottle picked (Grip, Aqua clear...) instead of one stock per size">🍼 Keep stock per bottle</button>') + '</div>');
            return r;
        };
        wired = true;
        try { F.renderFlow(); } catch (e) { /* drawn when the tab opens */ }
    }
    window.AquaBottles = AB;
    document.addEventListener('click', function (e) { if (e.target && e.target.id === 'aqb-ov') AB.close(); });
    wire(); document.addEventListener('DOMContentLoaded', wire); window.addEventListener('load', function () { wire(); setTimeout(wire, 900); setTimeout(wire, 2600); });
})();
</script>
