<!-- PRICE LIST (zip 381) ------------------------------------------------------------------------------------------------------------------
     Shop: one screen for every product and service with its selling price, buying price, quantity left and a monthly sales target - all
     editable in place - and how much of the target was achieved (from the sales of the month). Two parts: Items and Services.
     A service has no stock of its own: it is tracked by the material it uses. A service can use
       * ALL of a list of materials every time (the usual recipe), or
       * ONE of several materials (e.g. Printing on Matt OR Glossy paper): the cashier picks the material at the Sales Counter, that material's
         stock goes down, the sale line says which it was, and each material can carry its own price.
     Data: product.monthlyTargetAmount (KSh a month), product.moq (the least a customer can buy in one sale), product.priceAtCounter (no fixed
     price: the cashier types it), product.materialChoices [{ code, qtyPerUnit, price }], product.recipe (the "all of" list).
     Reports > Targets vs Achieved: the monthly targets spread over the report period against what was sold, by category (printable on A4).
     Reports > Sales by Category, and a Category picker beside the period that narrows both reports.
     Item form: Category, MOQ, sold as (whole packs / any number), monthly target. Variants share the item's MOQ and target.
     Import price list: an Excel / CSV price list (category, name, price, MOQ, target) - services added straight in, a preview first.
     Quantity changes are written as stock movements ("Price List count"), like a stock take. Only the admin edits; staff with the tab see it. -->
<style>

<div id="pl-ov" role="dialog" aria-modal="true"><div class="pl-dlg plw" id="pl-dlg"></div></div>
<script>
(function () {
    'use strict';
    if (window.PriceList) return;
    var V = { view: 'items', q: '', cat: '', month: '' };
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var num = function (v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
    var r2 = function (n) { return Math.round(Number(n) || 0); };   // money is whole shillings (no cents in Kenya)
    // the item list: `inventory` in every app; the Water app keeps its products in `products` (aqua_products)
    var waterApp = function () { try { return typeof inventory === 'undefined' && typeof products !== 'undefined' && Array.isArray(products); } catch (e) { return false; } };
    var inv = function () { try { if (typeof inventory !== 'undefined' && Array.isArray(inventory)) return inventory; } catch (e) { /* none */ } try { if (waterApp()) return products; } catch (e) { /* none */ } return []; };
    var sales = function () { try { return Array.isArray(salesLog) ? salesLog : []; } catch (e) { return []; } };
    var admin = function () { try { return typeof isAdminServing === 'function' ? isAdminServing() : true; } catch (e) { return true; } };
    var money = function (n) { return 'KES ' + Math.round(Number(n) || 0).toLocaleString('en-KE'); };
    var qtyTxt = function (n) { var x = Math.round((Number(n) || 0) * 1000) / 1000; return String(x); };
    var unitOf = function (p) { try { return typeof unitLabel === 'function' ? unitLabel(p.unit || 'pcs') : (p.unit || 'pcs'); } catch (e) { return p.unit || 'pcs'; } };
    var toast = function (m, bad) { try { showToast(m, !!bad); } catch (e) { /* none */ } };
    // the month in Nairobi time (the tills run on Kenya time)
    var monthOf = function (ts) { var t = typeof ts === 'number' ? ts : Date.parse(ts); if (!isFinite(t)) return ''; var d = new Date(t + 3 * 3600000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
    var thisMonth = function () { return monthOf(Date.now()); };
    var monthName = function (m) { var p = String(m).split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, 15)); return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }); };
    // what this app's till can do: sell by minimum order (the Shop), ask which material a service used (the Shop)
    var canMoq = function () { return typeof cartMoqOf === 'function'; };
    var canOneOf = function () { try { return typeof addToCart === 'function' && addToCart.length >= 5; } catch (e) { return false; } };
    var isLive = function (p) { return p && !p._deleted && !p.archived && p.code; };
    var isService = function (p) { return p.type === 'service'; };
    var isItem = function (p) { return !isService(p) && p.type !== 'set-placeholder'; };

    /* ---------------- the item lines of a sale, bill payments included ----------------
       zip 388: a payment on a bill (the part paid when the bill is opened, or a later instalment) is a sale whose line is just "Bill payment"
       (no item code): the goods are on the bill. Leaving those out made the Price List and Sales by Category add up to less than the Sales
       report. Each payment is now shared across the bill's own items in proportion to their value - whole shillings, the last item taking
       the remainder, so the parts add up to the payment exactly - and so are the pieces (a bill of 2 Beta paid half = 1 Beta sold).
       A payment whose bill cannot be found stays one line with no item ("Bill payments" in Sales by Category) so no shilling is dropped. */
    function billById(id) {
        try { return (typeof bills !== 'undefined' && Array.isArray(bills) ? bills : []).find(function (b) { return b && String(b.id) === String(id); }) || null; } catch (e) { return null; }
    }
    function saleLines(s) {
        var out = [];
        (s.items || []).forEach(function (l) {
            if (!l) return;
            var isPay = l.unit === 'payment' || l.isPayment;
            if (!isPay) { if (l.code) out.push({ code: l.code, qty: Number(l.qty) || 0, value: Math.round((Number(l.price) || 0) * (Number(l.qty) || 0)), variantId: l.variantId, unitPieces: l.unitPieces, material: l.material, materialName: l.materialName, saleMode: l.saleMode }); return; }
            var amount = Math.round((Number(l.price) || 0) * (Number(l.qty) || 1));
            var bill = s.billId != null ? billById(s.billId) : null;
            var goods = bill ? (bill.items || []).filter(function (x) { return x && x.code && x.unit !== 'payment' && !x.isPayment; }) : [];
            var tot = goods.reduce(function (t, x) { return t + (Number(x.price) || 0) * (Number(x.qty) || 0); }, 0);
            if (!(tot > 0)) { out.push({ code: null, qty: 0, value: amount, billPayment: true }); return; }
            var left = amount;
            goods.forEach(function (x, i) {
                var share = (Number(x.price) || 0) * (Number(x.qty) || 0) / tot;
                var v = i === goods.length - 1 ? left : Math.round(amount * share); left -= v;
                out.push({ code: x.code, qty: (Number(x.qty) || 0) * amount / tot, value: v, variantId: x.variantId, unitPieces: x.unitPieces, saleMode: x.saleMode, fromBill: true });
            });
        });
        return out;
    }

    /* ---------------- what sold in a month: units and money per product (and per variant, per material) ---------------- */
    function soldIn(month) {
        var out = {};
        sales().forEach(function (s) {
            if (!s || s.voided || s._deleted || s.isReturn || monthOf(s.timestamp) !== month) return;
            saleLines(s).forEach(function (l) {
                if (!l.code) return;
                var p = inv().find(function (x) { return x.code === l.code; });
                var q = (Number(l.qty) || 0) * (Number(l.unitPieces) > 1 ? Number(l.unitPieces) : 1);   // an MOQ pack / order line = its pieces
                if (p && p.dualUnit && l.saleMode === 'piece') q = q / (Number(p.unitsPerBox) || 1);   // pieces counted as part of a box
                var o = out[l.code] = out[l.code] || { qty: 0, value: 0, v: {}, m: {} };
                o.qty += q; o.value += l.value;
                if (l.variantId) { var vv = o.v[l.variantId] = o.v[l.variantId] || { qty: 0, value: 0 }; vv.qty += q; vv.value += l.value; }
                if (l.material) { var mm = o.m[l.material] = o.m[l.material] || { qty: 0, name: l.materialName || '' }; mm.qty += q; }
            });
        });
        // returned goods come off what was sold
        try {
            (typeof returns !== 'undefined' && Array.isArray(returns) ? returns : []).forEach(function (r) {
                if (!r || r._deleted || monthOf(r.timestamp || r.date) !== month) return;
                (r.items || [r]).forEach(function (l) { if (!l || !l.code || !out[l.code]) return; var q = Number(l.qty) || 0; out[l.code].qty -= q; out[l.code].value -= (Number(l.price) || 0) * q; });
            });
        } catch (e) { /* no returns list */ }
        return out;
    }
    // the monthly target is money (KSh a month); achieved = what was sold that month against it
    var tgtOf = function (p) { return Number(p && p.monthlyTargetAmount) > 0 ? Number(p.monthlyTargetAmount) : 0; };
    function progress(value, target) {
        if (!(target > 0)) return '<span style="color:#94a3b8;font-size:12.5px">No target</span>';
        var pc = Math.max(0, Math.round(value / target * 100));
        var cls = pc >= 100 ? '' : pc >= 50 ? 'mid' : 'low';
        return '<div class="pl-bar ' + cls + '"><i style="width:' + Math.min(100, pc) + '%"></i></div><div class="pl-pc">' + pc + '% · ' + money(Math.max(0, target - value)) + ' to go</div>';
    }

    /* ---------------- screen ---------------- */
    function cats(list) { var c = {}; list.forEach(function (p) { if (p.category) c[p.category] = 1; }); return Object.keys(c).sort(); }
    function matches(p) {
        var q = V.q.trim().toLowerCase();
        if (V.cat && String(p.category || '') !== V.cat) return false;
        if (!q) return true;
        return [p.name, p.code, p.category, p.barcode].some(function (x) { return String(x || '').toLowerCase().indexOf(q) >= 0; });
    }
    function inp(kind, code, vid, val, cls, extra) {
        var whole = kind !== 'qty';   // money and MOQ are whole numbers; only a stock quantity may be a fraction (kg, litres)
        return '<input class="pl-in' + (cls ? ' ' + cls : '') + '" type="number" min="0" step="' + (whole ? '1' : 'any') + '" inputmode="' + (whole ? 'numeric' : 'decimal') + '" value="' + esc(val) + '"' + (admin() ? '' : ' disabled') +
            ' data-pl="' + kind + '" data-code="' + esc(code) + '"' + (vid ? ' data-vid="' + esc(vid) + '"' : '') + (extra || '') + ' aria-label="' + esc(kind) + '">';
    }
    function itemsHtml(month, sold) {
        var all = inv().filter(isLive).filter(isItem);
        var list = all.filter(matches).sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
        var tot = { value: 0, stock: 0, target: 0, sold: 0, low: 0 };
        all.forEach(function (p) {
            var s = sold[p.code] || { qty: 0, value: 0 };
            tot.value += s.value; tot.stock += (Number(p.qty) || 0) * (Number(p.wholesalePrice) || 0);
            if (tgtOf(p) > 0) { tot.target += tgtOf(p); tot.sold += Math.max(0, Math.min(s.value, tgtOf(p))); }
            var lowAt = Number(p.minStock) > 0 ? Number(p.minStock) : 5; if ((Number(p.qty) || 0) <= lowAt) tot.low++;
        });
        var cards = '<div class="pl-cards"><div class="pl-card"><span>Items</span><b>' + all.length + '</b></div>' +
            '<div class="pl-card b"><span>Sales in ' + esc(monthName(month)) + '</span><b>' + money(tot.value) + '</b></div>' +
            '<div class="pl-card c"><span>Stock value (at buying price)</span><b>' + money(tot.stock) + '</b></div>' +
            '<div class="pl-card d"><span>Target achieved' + (tot.target > 0 ? ' of ' + money(tot.target) : '') + '</span><b>' + (tot.target > 0 ? Math.round(tot.sold / tot.target * 100) + '%' : '—') + '</b></div></div>';
        if (!list.length) return cards + '<div class="pl-box"><div class="pl-empty">' + (all.length ? 'No item matches the search.' : 'No items yet. Add them under Stock, Inventory.') + '</div></div>';
        var rows = list.map(function (p) {
            var s = sold[p.code] || { qty: 0, value: 0, v: {} };
            var lowAt = Number(p.minStock) > 0 ? Number(p.minStock) : 5, low = (Number(p.qty) || 0) <= lowAt;
            var h = '<tr><td class="pl-name"><b>' + esc(p.name) + '</b><small>' + esc(p.code) + (p.category ? ' · ' + esc(p.category) : '') + '</small></td>' +
                '<td class="r">' + inp('price', p.code, '', r2(p.price)) + atCounter(p) + '</td>' +
                '<td class="r">' + inp('cost', p.code, '', r2(p.wholesalePrice)) + '</td>' +
                (canMoq() ? '<td class="r">' + inp('moq', p.code, '', Number(p.moq) > 1 ? qtyTxt(p.moq) : '', 'narrow', ' placeholder="1"') + moqNote(Number(p.price) || 0, Number(p.moq) || 0) + moqMode(p) + '</td>' : '') +
                '<td class="r">' + (p.hasVariants && (p.variants || []).length ? '<span class="pl-note" style="margin:0">by size below</span>' : inp('qty', p.code, '', qtyTxt(p.qty), 'narrow') + ' <span' + (low ? ' class="pl-low"' : '') + '>' + esc(unitOf(p)) + '</span>') + '</td>' +
                '<td class="r">' + inp('target', p.code, '', tgtOf(p) ? r2(tgtOf(p)) : '', '', ' placeholder="0"') + '</td>' +
                '<td class="r"><b>' + qtyTxt(s.qty) + '</b></td><td>' + progress(s.value, tgtOf(p)) + '</td>' +
                '<td class="r">' + money(s.value) + '</td></tr>';
            if (p.hasVariants) (p.variants || []).forEach(function (v) {
                if (!v || v._deleted) return; var sv = (s.v || {})[v.id] || { qty: 0, value: 0 };
                h += '<tr class="sub"><td class="pl-name"><b>' + esc(v.name) + '</b><small>size of ' + esc(p.name) + '</small></td>' +
                    '<td class="r">' + inp('price', p.code, v.id, r2(v.price)) + '</td><td class="r">' + inp('cost', p.code, v.id, r2(v.wholesalePrice)) + '</td>' +
                    (canMoq() ? '<td class="r" style="font-size:11.5px;color:#64748b">' + (Number(p.moq) > 1 ? 'shared' : '') + '</td>' : '') + '<td class="r">' + inp('qty', p.code, v.id, qtyTxt(v.qty), 'narrow') + '</td><td class="r" style="font-size:11.5px;color:#64748b">' + (tgtOf(p) ? 'shared' : '') + '</td><td class="r">' + qtyTxt(sv.qty) + '</td><td style="font-size:11.5px;color:#64748b">' + (tgtOf(p) && tgtOf(p) > 0 ? Math.round(sv.value / tgtOf(p) * 100) + '% of the item target' : '') + '</td><td class="r">' + money(sv.value) + '</td></tr>';
            });
            return h;
        }).join('');
        return cards + '<div class="pl-box"><div class="pl-scroll"><table class="pl-t"><thead><tr><th>Item</th><th class="r">Selling price</th><th class="r">Buying price</th>' + (canMoq() ? '<th class="r">MOQ</th>' : '') + '<th class="r">Quantity left</th>' +
            '<th class="r">Target / month (KSh)</th><th class="r">Sold</th><th>Achieved</th><th class="r">Sales value</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    }
    function atCounter(p) { return p.priceAtCounter ? '<div style="font-size:11px;color:#b45309;font-weight:700;margin-top:2px">' + (p.priceNote ? esc(p.priceNote) : 'Price typed at the counter') + '</div>' : ''; }
    function materialsCell(p) {
        var mode = (Array.isArray(p.materialChoices) && p.materialChoices.length && !(p.recipe || []).length) ? 'one' : ((p.recipe || []).length ? 'all' : '');
        var list = mode === 'one' ? p.materialChoices.map(function (c) { return { code: c.code, per: c.qtyPerUnit, price: c.price }; }) : (p.recipe || []).map(function (r) { return { code: r.code, per: r.qtyPerUnit }; });
        if (!mode) return '<div class="pl-mat"><span style="background:#f1f5f9;color:#475569">No material linked</span></div>';

    function change(el) {

        var label = p.name + (vid ? ' (' + tgt.name + ')' : '');
        if (kind === 'price') { if (r2(tgt.price) === r2(v)) return; tgt.price = r2(v); if (!vid && v > 0 && p.priceAtCounter) { delete p.priceAtCounter; delete p.priceNote; } saved('Price of ' + label + ' saved: ' + money(v)); }
        else if (kind === 'cost') { if (r2(tgt.wholesalePrice) === r2(v)) return; tgt.wholesalePrice = r2(v); saved('Buying price of ' + label + ' saved: ' + money(v)); }
        else if (kind === 'target') { var t = raw === '' ? 0 : r2(v); if (tgtOf(p) === t) return; if (t > 0) p.monthlyTargetAmount = t; else delete p.monthlyTargetAmount; saved(t > 0 ? 'Target for ' + p.name + ': ' + money(t) + ' a month.' : 'Target for ' + p.name + ' removed.'); }
        else if (kind === 'moq') { var mq = raw === '' ? 0 : Math.round(v); if ((Number(p.moq) || 0) === (mq > 1 ? mq : 0)) return; if (mq > 1) p.moq = mq; else delete p.moq; saved(mq > 1 ? 'Minimum order for ' + p.name + ': ' + qtyTxt(mq) + '.' : 'Minimum order for ' + p.name + ' removed.'); }

            tgt.qty = after;

            if (vid) { try { p.qty = Math.round((p.variants || []).reduce(function (a, x) { return a + (Number(x && x.qty) || 0); }, 0) * 1000) / 1000; } catch (e) { /* none */ } }   // the item's total = its sizes, as everywhere else
            saved('Quantity of ' + label + ': ' + qtyTxt(before) + ' to ' + qtyTxt(after) + '.');

    /* ---------------- the cashier picks the material ---------------- */

    /* ---------------- import a price list (Excel / CSV) ----------------
       Reads any sheet laid out as rows: category, name, price, MOQ / quantities, target. The header row is found by its titles (it need not
       be the first row), a title row above it is skipped, a blank category carries the one above, a "total" row with no name is skipped.
       Price "KSh 1,200" / "1,200" / "20/="; a range "(30-45)" sets the lowest price and the cashier types the real one; "KSh 50" sitting in
       the quantities column with no price is taken as the price. "150 pcs" = the minimum order (MOQ); a plain number there = stock left.
       Target = KSh a month; a "target" smaller than three sales is left empty and shown (it looks like a unit price). Nothing is saved
       until the preview is confirmed; a name already in the shop is updated, never duplicated. */
    var normH = function (h) { return String(h == null ? '' : h).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/\b(ksh|kshs|kes)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim(); };
    var HDR = {
        name: ['service product', 'product service', 'service', 'services', 'service name', 'product', 'products', 'product name', 'item', 'items', 'item name', 'name', 'description', 'particulars', 'details'],
        code: ['code', 'sku', 'item code', 'product code', 'service code'],
        type: ['type', 'kind', 'item or service', 'product or service'],
        category: ['service category', 'category', 'categories', 'group', 'department', 'section', 'product category'],
        price: ['price list', 'price', 'prices', 'selling price', 'unit price', 'rate', 'rates', 'retail price', 'charge', 'charges', 'amount', 'sp'],
        cost: ['cost', 'cost price', 'buying price', 'purchase price', 'bp'],
        qty: ['quantities', 'quantity', 'qty', 'stock', 'quantity left', 'qty left', 'in stock', 'balance', 'opening stock', 'on hand'],
        moq: ['moq', 'min order', 'minimum order', 'min qty', 'minimum qty', 'min order qty', 'minimum order quantity', 'minimum quantity'],
        target: ['target amount', 'target', 'targets', 'monthly target', 'target per month', 'target month', 'sales target', 'target amount month'],
        unit: ['unit', 'units', 'uom']
    };
    function headerMap(row) {
        var map = {}, cells = (row || []).map(normH);
        Object.keys(HDR).forEach(function (f) {
            cells.forEach(function (c, i) { if (map[f] === undefined && c && HDR[f].indexOf(c) >= 0 && !Object.keys(map).some(function (k) { return map[k] === i; })) map[f] = i; });
        });
        Object.keys(HDR).forEach(function (f) {   // looser second pass: "Target Amount (KSh) per month", "Selling price each"
            if (map[f] !== undefined) return;
            cells.forEach(function (c, i) { if (map[f] === undefined && c && !Object.keys(map).some(function (k) { return map[k] === i; }) && HDR[f].some(function (s) { return s.length > 3 && (' ' + c + ' ').indexOf(' ' + s + ' ') >= 0; })) map[f] = i; });
        });
        return map;
    }
    var firstNum = function (s) { var m = String(s == null ? '' : s).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
    var isRange = function (s) { return /^\(?\s*(ksh|kes)?\s*\d[\d,]*(\.\d+)?\s*(-|–|to)\s*(ksh|kes)?\s*\d[\d,]*(\.\d+)?\s*\)?$/i.test(String(s).trim()); };
    var rangeOf = function (s) { var n = String(s).replace(/,/g, '').match(/\d+(\.\d+)?/g) || []; return [parseFloat(n[0]), parseFloat(n[1])]; };
    var isMoney = function (s) { return /\b(ksh|kshs|kes)\b|\/=|^\s*sh\.?\s*\d/i.test(String(s)); };
    var titleKey = function (s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); };
    var catKey = function (s) { return titleKey(s).replace(/&/g, ' and ').split(/[^a-z0-9]+/).filter(Boolean).sort().join(' '); };   // "Printing & branding" = "Branding & Printing"
    var moqNote = function (price, moq) { return moq > 1 ? '<div style="font-size:11px;color:#64748b;white-space:nowrap">' + money(price) + ' per ' + qtyTxt(moq) + ' pcs</div>' : ''; };
    // how an MOQ item is sold: whole packs only, or any number of pieces from the MOQ up (rounded to whole shillings)
    function moqMode(p) {
        if (!(Number(p.moq) > 1)) return '';
        var m = p.moqMode === 'from' ? 'from' : 'pack';
        return '<select data-plmode="' + esc(p.code) + '" style="width:auto;margin:4px 0 0;padding:4px 6px;font-size:11.5px;border-radius:8px"' + (admin() ? '' : ' disabled') + ' aria-label="How it is sold">' +
            '<option value="pack"' + (m === 'pack' ? ' selected' : '') + '>Whole packs only</option><option value="from"' + (m === 'from' ? ' selected' : '') + '>Any number from ' + qtyTxt(p.moq) + '</option></select>';
    }

    // sheets = [{ name, rows: [[cell,...], ...] }]  ->  { rows: [...], categories: [...], skipped: [...] }
    function planImport(sheets, invList) {
        invList = invList || inv();
        var out = [], skipped = [], seen = {}, catName = {};
        (sheets || []).forEach(function (sh) {
            var rows = sh.rows || [], h = -1, map = null;
            for (var i = 0; i < Math.min(rows.length, 25); i++) { var m = headerMap(rows[i]); if (m.name !== undefined && (m.price !== undefined || m.target !== undefined || m.moq !== undefined || m.qty !== undefined)) { h = i; map = m; break; } }
            if (h < 0) { if (rows.some(function (r) { return (r || []).some(function (c) { return String(c || '').trim(); }); })) skipped.push({ sheet: sh.name, n: 0, why: 'No price-list header found (needs a name column and a price, quantity or target column).' }); return; }
            var sheetSvc = /servic/i.test(sh.name || ''), section = null, lastCat = '';
            var cell = function (r, f) { return map[f] === undefined ? '' : String(r[map[f]] == null ? '' : r[map[f]]).trim(); };
            for (var j = h + 1; j < rows.length; j++) {
                var r = rows[j] || [], n = j + 1, filled = r.filter(function (c) { return String(c == null ? '' : c).trim(); });
                if (!filled.length) continue;
                var name = cell(r, 'name').replace(/\s+/g, ' ');
                if (!name) {
                    if (filled.length === 1 && firstNum(filled[0]) === null) { var t = String(filled[0]).trim(); if (/servic/i.test(t)) section = 'service'; else if (/\b(product|item|goods|stock)s?\b/i.test(t)) section = 'item'; else lastCat = t; continue; }
                    skipped.push({ sheet: sh.name, n: n, why: 'No name (a total or note row): ' + filled.join(' · ') }); continue;
                }
                var row = { n: n, sheet: sh.name, name: name, warns: [], include: true, code: cell(r, 'code') };
                var c = cell(r, 'category'); if (c) lastCat = c;
                var ck = catKey(lastCat); if (ck && !catName[ck]) catName[ck] = lastCat.trim(); row.category = ck ? catName[ck] : '';
                // price
                var pr = cell(r, 'price'), qx = cell(r, 'qty'), mq = cell(r, 'moq');
                row.price = null;
                if (pr && isRange(pr)) { var rg = rangeOf(pr); row.price = rg[0]; row.priceAtCounter = true; row.priceNote = 'Price ' + rg[0] + '–' + rg[1] + ', typed at the counter'; }
                else if (pr) { row.price = firstNum(pr); if (row.price === null) row.warns.push('Price "' + pr + '" is not a number.'); }
                // quantities column: MOQ ("150 pcs"), a price range, a price in the wrong column, or stock left
                row.moq = mq ? firstNum(mq) : null; row.qty = null;
                if (qx) {
                    if (isRange(qx)) { var rq = rangeOf(qx); if (row.price === null) { row.price = rq[0]; row.priceAtCounter = true; row.priceNote = 'Price ' + rq[0] + '–' + rq[1] + ', typed at the counter'; row.warns.push('"' + qx + '" read as a price range.'); } }
                    else if (isMoney(qx)) { if (row.price === null) { row.price = firstNum(qx); row.warns.push('Price taken from the quantities column (' + qx + ').'); } else row.warns.push('"' + qx + '" in the quantities column was ignored.'); }
                    else if (/[a-z]/i.test(qx) && firstNum(qx) !== null) { if (row.moq === null) row.moq = firstNum(qx); }
                    else if (firstNum(qx) !== null) row.qty = firstNum(qx);

    function hook() { var b = $('price-list-tab-btn'); if (b && !b.__pl) { b.__pl = 1; b.addEventListener('click', function () { setTimeout(function () { var t = $('price-list-tab'); if (t && t.classList.contains('active')) render(); }, 60); }); } }
    function start() { addReportButton(); setTimeout(addReportButton, 1500); addCategoryPicker(); setTimeout(addCategoryPicker, 1600); formStart(); setTimeout(formStart, 1500); setTimeout(formStart, 4000); if (!mount()) { setTimeout(start, 700); return; } hook(); lockLists(); wire(); setTimeout(wire, 800); setTimeout(wire, 2500); }
    $('pl-ov').addEventListener('mousedown', function (e) { if (e.target === $('pl-ov')) close(); });

    window.PriceList = {
        __v: 381, soldIn: soldIn, monthOf: monthOf, render: render, close: close, pickMaterial: pickMaterial,
        planImport: planImport, applyImport: applyImport, targetsReport: targetsReport, monthShare: monthShare, printTargets: function (rg) { return printTargets(rg); }, monthRange: monthRange, categoryReport: categoryReport,
        importOpen: function () {
            if (!admin()) { toast('Only the admin can import a price list.', true); return; }
            var f = document.createElement('input'); f.type = 'file'; f.accept = '.xlsx,.xls,.csv,.ods'; f.style.display = 'none';
            f.onchange = function () { var file = f.files && f.files[0]; f.remove(); if (file) PriceList.importFile(file); };
            document.body.appendChild(f); f.click();
        },
        importFile: function (file) {
            return readFile(file).then(function (sheets) { PriceList.importSheets(sheets, file.name); }).catch(function (e) { toast((e && e.message) || 'The file could not be read.', true); });
        },
        importSheets: function (sheets, fileName) {
            var plan = planImport(sheets);
            if (!plan.rows.length) { toast('No price-list rows found in "' + fileName + '". It needs a name column and a price, quantity or target column.', true); return false; }
            IMP = { file: fileName, plan: plan, updatePrices: true }; impDlg(); return true;
        },
        impSet: function (i, f, v) { if (!IMP || !IMP.plan.rows[i]) return; IMP.plan.rows[i][f] = v; impDlg(); },
        impUpd: function (v) { if (IMP) IMP.updatePrices = !!v; },
        impBulk: function (t) { if (!IMP) return; var c = ($('pl-imp-cat') || {}).value || ''; IMP.plan.rows.forEach(function (x) { if (!x.existing && (!c || x.category === c)) x.type = t; }); impDlg(); var s = $('pl-imp-cat'); if (s) s.value = c; },
        impGo: function () {
            if (!IMP) return; var n = IMP.plan.rows.filter(function (x) { return x.include; }).length;
            if (!n) { $('pl-err').textContent = 'Tick at least one row.'; return; }
            var r = applyImport(IMP.plan, { updatePrices: IMP.updatePrices });
            persist(); close();
            V.view = r.services >= r.items ? 'services' : 'items'; render();
            saved('Imported: ' + r.created + ' new (' + r.services + ' services, ' + r.items + ' items), ' + r.updated + ' updated.');
            toast('Price list imported: ' + r.created + ' new, ' + r.updated + ' updated.');
        },
        view: function (v) { V.view = v === 'services' ? 'services' : 'items'; V.cat = ''; render(); },
        pick: function (code, mat) { close(); try { addToCart(code, undefined, undefined, undefined, mat); } catch (e) { toast('Could not add it: ' + (e && e.message), true); } },
        editMaterials: function (code) {
            if (!admin()) { toast('Only the admin can change the materials.', true); return; }
            var p = inv().find(function (x) { return x.code === code; }); if (!p) return;
            var one = (p.materialChoices || []).length && !(p.recipe || []).length;
            M = { code: code, mode: !canOneOf() ? 'all' : (one ? 'one' : ((p.recipe || []).length ? 'all' : 'one')),
                rows: one ? p.materialChoices.map(function (c) { return { code: c.code, per: c.qtyPerUnit, price: c.price || '' }; }) : (p.recipe || []).map(function (r) { return { code: r.code, per: r.qtyPerUnit, price: '' }; }) };
            if (!M.rows.length) M.rows.push({ code: '', per: 1, price: '' });
            matDlg();
        },
        matMode: function (m) { if (!M) return; readRows(); M.mode = m === 'all' ? 'all' : 'one'; matDlg(); },
        matAdd: function () { if (!M) return; readRows(); M.rows.push({ code: '', per: 1, price: '' }); matDlg(); },
        matRow: function (i) { if (!M) return; readRows(); M.rows.splice(i, 1); matDlg(); },
        matClear: function () {
            if (!M) return; var p = inv().find(function (x) { return x.code === M.code; }); if (!p) return close();
            if (!confirm('Unlink every material from ' + p.name + '? Its sales will no longer take anything off the shelf.')) return;
            p.recipe = []; delete p.materialChoices; p.updatedAt = Date.now(); persist(); close(); render(); saved('Materials of ' + p.name + ' unlinked.');
        },
        matSave: function () {
            if (!M) return; readRows();
            var p = inv().find(function (x) { return x.code === M.code; }); if (!p) return close();
            var err = $('pl-err'), seen = {}, rows = [];
            for (var i = 0; i < M.rows.length; i++) {
                var r = M.rows[i]; if (!r.code && !String(r.per).trim()) continue;
                if (!r.code) { err.textContent = 'Choose the item on every line, or remove the line.'; return; }
                if (seen[r.code]) { err.textContent = 'The same item is listed twice.'; return; }
                var per = num(r.per); if (!(per > 0)) { err.textContent = 'Type how much of each item one service uses (more than 0).'; return; }
                seen[r.code] = 1; rows.push({ code: r.code, qtyPerUnit: Math.round(per * 1e6) / 1e6, price: num(r.price) > 0 ? r2(num(r.price)) : 0 });
            }
            if (!rows.length) { err.textContent = 'Add at least one item, or press Unlink all.'; return; }
            if (M.mode === 'one') { p.materialChoices = rows.map(function (r) { return r.price > 0 ? r : { code: r.code, qtyPerUnit: r.qtyPerUnit }; }); p.recipe = []; }
            else { p.recipe = rows.map(function (r) { return { code: r.code, qtyPerUnit: r.qtyPerUnit }; }); delete p.materialChoices; }
            p.updatedAt = Date.now(); persist(); var nm = p.name; close(); render(); saved('Materials of ' + nm + ' saved.');
        }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    window.addEventListener('load', function () { setTimeout(start, 400); });
})();
</script>
