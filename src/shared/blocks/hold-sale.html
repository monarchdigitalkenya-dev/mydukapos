<!-- HOLD SALE ----------------------------------------------------------------
         "⏸️ Hold sale" on the Sales Counter: a customer who is not ready to pay while there is a queue steps aside, the
         cashier serves the next person, then taps "▶️ Held¹" to bring the held sale back and complete it. ONE sale can be on
         hold at a time (per device). Logic: src/shared/functions.js (heldSale*, holdCurrentSale, resumeHeldSale,
         renderHeldSaleBar). This block only wires it into the page. -->
    <script>
    (function () {
        'use strict';
        try { if (typeof heldSaleInstall === 'function') heldSaleInstall(); } catch (e) { /* holding a sale is optional */ }
        // (also here: the ⚠️ low-stock buttons on Restock and Orders refresh when those tabs are opened)
        try { if (typeof authWatchInstall === 'function') authWatchInstall(); } catch (e) { /* only a helper */ }
        try { if (typeof itemSuggestInstall === 'function') itemSuggestInstall(); } catch (e) { /* the drop-down is an extra */ }
        try { if (typeof lowStockInstall === 'function') lowStockInstall(); } catch (e) { /* the buttons are an extra */ }
        try { if (typeof stockTakeInstall === 'function') stockTakeInstall(); } catch (e) { /* the Stock Take tab is an extra */ }
        // settled bills are kept (closed); the ones closed more than 90 days ago are tidied away a few seconds after start-up
        setTimeout(function () { try { if (typeof pruneClosedBills === 'function') pruneClosedBills(90); } catch (e) { /* housekeeping only */ } }, 8000);
    })();
    </script>
