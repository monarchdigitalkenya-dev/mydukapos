<!-- LEGAL LINKS (zip 273) ------------------------------------------------------------------------------------------------------
     Terms and Privacy always open the ONE canonical copy on the main domain (https://mydukapos.store/terms and /privacy), whichever host the app
     is running on: the apex, a client's own subdomain, the owner console. A relative "/terms" would resolve inside the current host (and used to
     serve a duplicate copy on every shop subdomain), so every legal link is written with the absolute address and marked data-legal.
     A preview (*.pages.dev), staging or localhost keeps links on its own origin, so they can still be tried before launch.
     This block also adds a small "Terms · Privacy" line to the lock screen, the sign-in screens and the owner sign-in, which had none.
     Self-contained on purpose (same code in every app). -->
    <script>
    (function () {
        'use strict';
        var PROD = 'https://mydukapos.store';
        var LINKS = '<p class="legal-foot" style="margin:12px 0 0;font-size:12px;text-align:center;opacity:.85;">'
            + '<a data-legal="/terms" href="' + PROD + '/terms" target="_blank" rel="noopener">Terms</a> &middot; '
            + '<a data-legal="/privacy" href="' + PROD + '/privacy" target="_blank" rel="noopener">Privacy</a></p>';
        function origin() {
            var h = location.hostname;
            return (h === 'mydukapos.store' || /\.mydukapos\.store$/.test(h)) ? PROD : location.origin;
        }
        function run() {
            try {
                ['#license-lock-screen .license-lock-box', '#login-screen .reg-box', '#owner-auth-screen .license-lock-box'].forEach(function (sel) {
                    var box = document.querySelector(sel);
                    if (box && !box.querySelector('.legal-foot')) box.insertAdjacentHTML('beforeend', LINKS);
                });
                var o = origin();
                Array.prototype.forEach.call(document.querySelectorAll('a[data-legal]'), function (a) { a.setAttribute('href', o + a.getAttribute('data-legal')); });
            } catch (e) { /* the links stay as written (absolute, main domain) */ }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
    })();
    </script>
