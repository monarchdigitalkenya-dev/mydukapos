<!-- VIEW SETTINGS (zip 219) ---------------------------------------------
         ONE Settings tab, "👁️ View", that holds every "hide this button / tab / panel" switch of the app (Sell Unlisted Item, Bills, Sales, the phone & till layout with its tab list).
         The blocks that own a switch call window.__viewSection() to get the tab's page; if this block is missing they fall back to Settings > General. Nothing is deleted by any switch. -->
<script>
(function () {
    var ID = 'settings-section-view';
    function ensure() {
        var sec = document.getElementById(ID);
        if (sec) return sec;
        var nav = document.getElementById('settings-subnav'), gen = document.getElementById('settings-section-general');
        if (!nav || !gen || !gen.parentNode) return null;
        sec = document.createElement('div'); sec.className = 'settings-section-content'; sec.id = ID;
        sec.innerHTML = '<h4>👁️ View</h4><p class="settings-hint" style="margin:0 0 6px;">Everything you can hide or show lives here — buttons, tabs and panels. Each switch applies to every device of this shop and saves at once. Nothing is deleted: untick a switch and the item is back.</p>';
        gen.parentNode.appendChild(sec);
        var b = document.createElement('button'); b.type = 'button'; b.className = 'settings-subtab-btn'; b.setAttribute('data-section', ID);
        b.textContent = '👁️ View'; b.setAttribute('onclick', "showSettingsSection('" + ID + "', this)");
        var after = nav.querySelector('[data-section="settings-section-general"]');
        if (after && after.parentNode) after.parentNode.insertBefore(b, after.nextSibling); else nav.appendChild(b);
        return sec;
    }
    window.__viewSection = ensure;
    function go() { try { ensure(); } catch (e) { /* the switches fall back to General */ } }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
    setTimeout(go, 600);
})();
</script>
