<!-- BUSINESS HQ ----------------------------------------------------------------------------------------------------------------------------------
         zip 309. ONE place for the owner to run the whole business: Branches (profile, code, manager, suspend / activate, add a branch), Staff across
         branches (one person, several branches: add a branch, move permanently, a temporary posting that ends by itself, end, deactivate everywhere),
         HQ administrators (explicit permissions, all or some branches) and the HQ audit trail.
           * Every action is checked on the SERVER (functions/api/org.js), never only here: the owner signs in with the main branch's management
             password, an HQ administrator with their own PIN. The session lives in this tab only (sessionStorage) and ends after 8 hours, when the
             password / PIN changes, or the moment the owner removes the access.
           * Needs the internet (the business-wide records are on the server). Selling, sign-in and everything else in the till keep working offline.
           * Opened from the Staff tab ("🏢 Business HQ") and from the branch switcher. Nothing here changes any sale or payment.
         zip 310: Dashboard (sales today / 7 days per branch, low stock, transfers waiting), Stock (stores per branch, receive, count, move between a
         store and the shop floor), Transfers between branches (request, approve, dispatch, receive with damaged / missing, settle, reverse a move),
         Reports (sales, stock, transfers, staff; one branch or consolidated; CSV) and Roles (templates and custom roles given per person per branch).
         Stock changes go through the branch's own stock ledger on the server, once each, so a retry or two people pressing at once never double it.
         zip 311: simpler. Tabs Overview / Stock / Transfers / Staff / Branches / Reports / More (roles, administrators, audit, approvals). Stock is ONE
         list per branch: each item shows its shop-floor and store quantities with Move, Send to branch and + Store right on it (a Main store is made
         for the branch). Sending goes out at once (approvals are off unless the owner turns them on). Every dialog keeps its title and ✕ at the top
         and its buttons at the bottom. The Staff-tab button no longer disappears. -->

<script>
(function () {
    'use strict';
    var TOKEN_KEY = 'bhq_token', tab = 'dash', data = { who: null, branches: [], people: null, admins: null, audit: null, perms: {} }, root = null;
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function tok() { try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return window.__bhqTok || ''; } }
    function setTok(t) { try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) { window.__bhqTok = t || ''; } }
    function api(body) {

        return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-HQ-Token': tok() }, body: JSON.stringify(body) })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.__status = r.status; if (r.status === 401 && j.code === 'hq_signin') { setTok(''); } return j; }); })
            .catch(function () { return { __status: 0, error: 'No connection. Business HQ needs the internet; the till keeps working offline.' }; });
    }
    function isAdminNow() { try { return typeof isAdminServing === 'function' ? !!isAdminServing() : true; } catch (e) { return true; } }   // zip 325: HQ is for the Admin only
    function sha(s) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s))).then(function (d) { return Array.from(new Uint8Array(d)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); }); }
    function when(t) { try { return new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return String(t); } }
    function can(p) { return !!data.who && (data.who.kind === 'owner' || (data.who.perms || []).indexOf(p) >= 0); }
    function bname(cid) { var b = data.branches.filter(function (x) { return x.clientId === cid; })[0]; return b ? (b.name + (b.code ? ' · ' + b.code : '')) : cid; }
    var ACTIONS = { 'hq.signin': 'Signed in to HQ', 'branch.profile': 'Branch profile created', 'branch.edit': 'Branch edited', 'branch.suspend': 'Branch suspended', 'branch.activate': 'Branch activated',
        'staff.assign.additional': 'Added to another branch', 'staff.assign.permanent': 'Moved to another branch', 'staff.assign.temporary': 'Temporary posting', 'staff.temporary.expired': 'Temporary posting ended',
        'staff.end': 'Assignment ended', 'staff.deactivate': 'Deactivated', 'staff.reactivate': 'Reactivated', 'person.edit': 'Details edited', 'person.add': 'Added to HQ', 'admin.add': 'Made HQ administrator', 'admin.edit': 'HQ administrator changed', 'admin.remove': 'HQ access removed',
        'location.create': 'Store added', 'location.receive': 'Stock received into a store', 'location.count': 'Store counted', 'move.create': 'Stock moved inside a branch', 'move.reverse': 'Move reversed',
        'transfer.create': 'Transfer requested', 'transfer.approve': 'Transfer approved', 'transfer.reject': 'Transfer rejected', 'settings.transfers': 'Approval rules changed',
        'report.view': 'Report viewed', 'role.create': 'Role created', 'role.edit': 'Role changed', 'role.archive': 'Role archived', 'staff.role': 'Role given at a branch' };

    function ensure() {
        if (root) return root;
        root = document.createElement('div'); root.id = 'bhq'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Business HQ');
        document.body.appendChild(root);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.classList.contains('open')) { var m = root.querySelector('.bhq-modal'); if (m) m.remove(); else close(); } });
        return root;
    }
    function close() { if (root) root.classList.remove('open'); document.body.style.overflow = ''; }
    window.openBusinessHQ = function () {
        if (!isAdminNow()) { try { if (typeof showToast === 'function') showToast('Business HQ is for the Admin only.', true); } catch (e) { /* ok */ } return; }
        ensure(); root.classList.add('open'); document.body.style.overflow = 'hidden';

    };
    var SUBS = { roles: 1, admins: 1, audit: 1, rules: 1 };
    function frame(inner) {
        var stockish = can('inventory.manage') || can('transfers.approve') || can('reports.view');
        var tabs = [['dash', 'Overview'], ['stock', 'Stock'], ['xfers', 'Transfers'], ['staff', 'Staff'], ['branches', 'Branches'], ['reports', 'Reports'], ['more', 'More']].filter(function (t) {
            return t[0] === 'dash' || t[0] === 'branches' || t[0] === 'more' || ((t[0] === 'stock' || t[0] === 'xfers') && stockish) || (t[0] === 'reports' && can('reports.view')) || (t[0] === 'staff' && (can('staff.manage') || can('staff.assign')));
        });
        var cur = SUBS[tab] ? 'more' : tab;
        if (data.who && !tabs.some(function (t) { return t[0] === cur; })) { tab = 'dash'; cur = 'dash'; }
        root.innerHTML = '<div class="bhq-top"><div class="bhq-bar"><h2>🏢 Business HQ</h2>' + (data.who ? '<span class="bhq-who">' + esc(data.who.kind === 'owner' ? 'Owner' : data.who.name) + '</span><button type="button" class="bhq-x" data-a="signout">Sign out</button>' : '') +
            '<button type="button" class="bhq-x" data-a="close" aria-label="Close Business HQ">✕ Close</button></div>' +
            (data.who ? '<nav class="bhq-tabs" role="tablist">' + tabs.map(function (t) { return '<button type="button" role="tab" aria-selected="' + (cur === t[0]) + '" class="' + (cur === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</nav>' : '') + '</div>' +
            '<div class="bhq-body">' + (SUBS[tab] ? '<button type="button" class="bhq-btn sm bhq-back" data-tab="more">‹ More</button>' : '') + inner + '</div>';

        var so = root.querySelector('[data-a="signout"]'); if (so) so.onclick = function () { setTok(''); data.who = null; close(); };
        Array.prototype.forEach.call(root.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { tab = b.getAttribute('data-tab'); paint(); }; });
    }
    // zip 325: no password. The Admin who is signed in on the till opens HQ directly; the server re-checks (main branch, and a live Admin session when staff sessions are required).
    function autoSignIn() {
        data.who = null; frame('<p class="bhq-sub">Opening Business HQ…</p>');
        api({ action: 'login', auto: true }).then(function (j) { if (j.token) { setTok(j.token); load(); } else paintLogin(j.error || 'Could not open Business HQ.'); });
    }
    function paintLogin(msg) {
        data.who = null;
        frame('<div class="bhq-card" style="max-width:520px;margin:20px auto"><h3>Business HQ</h3><p class="bhq-sub">' + (isAdminNow() ? 'Branches, staff across branches and the HQ audit trail for the whole business. Needs the internet.' : 'Business HQ is for the Admin only.') + '</p>' +
            (msg ? '<p class="bhq-msg err" role="alert">' + esc(msg) + '</p>' : '') +
            (isAdminNow() ? '<div class="bhq-row" style="margin-top:12px"><button class="bhq-btn pri" type="button" id="bhq-retry">Try again</button></div>' : '') + '</div>');
        var rb = document.getElementById('bhq-retry'); if (rb) rb.onclick = autoSignIn;
    }
    function load() {
        frame('<p class="bhq-sub">Loading…</p>');
        api({ action: 'overview' }).then(function (j) {
            if (!j.who) return paintLogin(j.__status === 401 || j.__status === 403 ? (j.error || '') : (j.error || 'Could not open Business HQ.'));
            data.who = j.who; data.branches = j.branches || []; data.perms = j.perms || {}; data.people = null; data.admins = null; data.audit = null; data.dash = null; data.locs = null; data.xfers = null; data.roles = null; data.items = null; data.xset = null;
            paint();
        });
    }
    function paint() {
        if (tab === 'staff' && !data.people) { frame('<p class="bhq-sub">Loading staff…</p>'); return api({ action: 'staff.list' }).then(function (j) { data.people = j.people || []; if (j.error) data.peopleErr = j.error; paint(); }); }
        if (tab === 'admins' && !data.admins) { frame('<p class="bhq-sub">Loading…</p>'); return api({ action: 'admin.list' }).then(function (j) { data.admins = j.admins || []; if (!data.people && can('staff.manage')) return api({ action: 'staff.list' }).then(function (k) { data.people = k.people || []; paint(); }); paint(); }); }
        if (tab === 'audit' && !data.audit) { frame('<p class="bhq-sub">Loading…</p>'); return api({ action: 'audit.list' }).then(function (j) { data.audit = j.audit || []; paint(); }); }
        if (tab === 'staff') return paintStaff();
        if (tab === 'admins') return paintAdmins();
        if (tab === 'audit') return paintAudit();
        if (tab === 'dash') return paintDash();
        if (tab === 'stock') return paintStock();
        if (tab === 'xfers') return paintXfers();
        if (tab === 'reports') return paintReports();
        if (tab === 'roles') return paintRoles();
        if (tab === 'more') return paintMore();
        if (tab === 'rules') return paintRules();
        if (tab === 'branches') return paintBranches();
        return paintDash();
    }

    /* ---------------- branches ---------------- */
    function paintBranches() {
        var bs = data.branches, active = bs.filter(function (b) { return b.status !== 'suspended'; }).length;
        var h = '<div class="bhq-row" style="margin-bottom:10px"><div class="bhq-sp"><h3 style="margin:0">' + bs.length + ' branch' + (bs.length === 1 ? '' : 'es') + ' · ' + active + ' active</h3><p class="bhq-sub" style="margin:2px 0 0">' + bs.reduce(function (n, b) { return n + (b.staffCount || 0); }, 0) + ' staff in total</p></div>' +
            (can('branches.manage') ? '<button type="button" class="bhq-btn pri" data-a="add">＋ Add a branch</button>' : '') + '</div><div class="bhq-grid">';
        bs.forEach(function (b) {
            h += '<div class="bhq-card"><div class="bhq-row"><h3 class="bhq-sp">' + esc(b.name) + '</h3>' + (b.code ? '<span class="bhq-tag">' + esc(b.code) + '</span>' : '') + (b.isMain ? '<span class="bhq-tag main">Main</span>' : '') +
                '<span class="bhq-tag ' + (b.status === 'suspended' ? 'off' : 'ok') + '">' + (b.status === 'suspended' ? 'Suspended' : 'Active') + '</span></div>' +
                '<p class="bhq-sub">' + (b.staffCount || 0) + ' staff' + (b.location ? ' · ' + esc(b.location) : '') + (b.phone ? ' · ' + esc(b.phone) : '') + (b.slug ? '<br>' + esc(b.slug) : '') + (!b.hasProfile ? '<br><b>Give this branch a code and name (Edit).</b>' : '') + '</p>' +
                '<div class="bhq-row" style="margin-top:8px">' + (can('branches.manage') ? '<button type="button" class="bhq-btn" data-edit="' + esc(b.clientId) + '">Edit</button>' + (b.isMain ? '' : '<button type="button" class="bhq-btn ' + (b.status === 'suspended' ? '' : 'bad') + '" data-status="' + esc(b.clientId) + '">' + (b.status === 'suspended' ? 'Activate' : 'Suspend') + '</button>') : '') +
                '<button type="button" class="bhq-btn" data-staff="' + esc(b.clientId) + '">Staff</button>' + (typeof window.branchSwitcherUrl === 'function' && window.branchSwitcherUrl(b) ? '<a class="bhq-btn" style="display:inline-flex;align-items:center;text-decoration:none" href="' + esc(window.branchSwitcherUrl(b)) + '">Open ↗</a>' : '') + '</div></div>';
        });
        frame(h + '</div><p class="bhq-sub">Each branch is its own shop with its own stock, sales and devices. Suspending a branch pauses it; nothing is deleted.</p>');
        var add = root.querySelector('[data-a="add"]'); if (add) add.onclick = addBranch;
        Array.prototype.forEach.call(root.querySelectorAll('[data-edit]'), function (x) { x.onclick = function () { editBranch(x.getAttribute('data-edit')); }; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-status]'), function (x) { x.onclick = function () { branchStatus(x.getAttribute('data-status')); }; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-staff]'), function (x) { x.onclick = function () { tab = 'staff'; data.staffBranch = x.getAttribute('data-staff'); paint(); }; });
    }
    // zip 311: every dialog has its title and an ✕ at the top, and its main buttons (the .bhq-acts row) pinned at the bottom - no scrolling to close.
    // The html's first <h3> becomes the title; the last button row becomes the pinned actions.
    function modal(html, onReady) {
        var title = 'Business HQ', mm = /^\s*<h3[^>]*>([\s\S]*?)<\/h3>/.exec(html);
        if (mm) { title = mm[1]; html = html.slice(mm[0].length); }
        var m = document.createElement('div'); m.className = 'bhq-modal';
        m.innerHTML = '<div class="bhq-sheet" role="dialog" aria-modal="true"><div class="bhq-mhead"><h3>' + title + '</h3><button type="button" class="bhq-mx" data-mx aria-label="Close">✕</button></div><div class="bhq-mbody">' + html + '</div></div>';
        var body = m.querySelector('.bhq-mbody');
        var acts = body.querySelector('form > .bhq-row:last-child') || body.querySelector(':scope > .bhq-row:last-child');
        if (acts && acts.querySelector('button')) acts.classList.add('bhq-acts');
        m.addEventListener('click', function (e) { if (e.target === m) m.remove(); });
        root.appendChild(m);
        var done = function () { m.remove(); };
        m.querySelector('[data-mx]').onclick = function () { var x = m.querySelector('[data-x]'); if (x && x.onclick) x.onclick(); else done(); };
        onReady(m, done);
        var f = body.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea'); if (f && innerWidth > 640) setTimeout(function () { try { f.focus(); } catch (e) { /* ok */ } }, 30);
    }
    function formMsg(m, text, ok) { var el = m.querySelector('.bhq-msg'); el.className = 'bhq-msg ' + (ok ? 'ok' : 'err'); el.textContent = text; }
    function addBranch() {
        modal('<h3>Add a branch</h3><p class="bhq-sub">A new branch is its own shop under this business, with its own stock, sales and devices. Its staff start empty: add people to it from Staff.</p>' +
            '<form><label class="bhq-l" for="bhq-nb-name">Branch name</label><input id="bhq-nb-name" required maxlength="80" placeholder="e.g. Westlands">' +
            '<label class="bhq-l" for="bhq-nb-code">Short code</label><input id="bhq-nb-code" required maxlength="12" placeholder="e.g. WLD" style="text-transform:uppercase">' +
            '<label class="bhq-l" for="bhq-nb-why">Note (optional)</label><input id="bhq-nb-why" maxlength="200">' +
            '<p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn pri" type="submit">Create branch</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            m.querySelector('form').onsubmit = function (e) {
                e.preventDefault(); var name = m.querySelector('#bhq-nb-name').value.trim(), code = m.querySelector('#bhq-nb-code').value.trim();
                if (data.branches.some(function (b) { return (b.code || '').toLowerCase() === code.toLowerCase() || b.name.toLowerCase() === name.toLowerCase(); })) return formMsg(m, 'A branch with that name or code already exists.');
                formMsg(m, 'Creating…', true);
                api({ action: 'branch.create', name: name, code: code, reason: m.querySelector('#bhq-nb-why').value }).then(function (j) { if (j.ok) { done(); load(); } else formMsg(m, j.error || 'Could not create the branch.'); });
            };
        });
    }
    function editBranch(cid) {
        var b = data.branches.filter(function (x) { return x.clientId === cid; })[0] || {};
        var mgrOpts = '<option value="">No manager set</option>';
        (data.people || []).forEach(function (p) { if (p.branches.some(function (x) { return x.clientId === cid && x.active; })) mgrOpts += '<option value="' + esc(p.personId) + '"' + (p.personId === b.managerPersonId ? ' selected' : '') + '>' + esc(p.name) + '</option>'; });
        modal('<h3>Edit ' + esc(b.name) + '</h3><form>' +
            '<label class="bhq-l" for="bhq-b-name">Name</label><input id="bhq-b-name" required maxlength="80" value="' + esc(b.name) + '">' +
            '<label class="bhq-l" for="bhq-b-code">Code (unique in the business)</label><input id="bhq-b-code" required maxlength="12" style="text-transform:uppercase" value="' + esc(b.code || '') + '">' +
            '<label class="bhq-l" for="bhq-b-mgr">Branch manager</label><select id="bhq-b-mgr">' + mgrOpts + '</select>' + (data.people ? '' : '<p class="bhq-sub">Open Staff once to choose a manager.</p>') +
            '<label class="bhq-l" for="bhq-b-loc">Location</label><input id="bhq-b-loc" maxlength="160" value="' + esc(b.location || '') + '">' +
            '<div class="bhq-row"><div class="bhq-sp"><label class="bhq-l" for="bhq-b-ph">Phone</label><input id="bhq-b-ph" maxlength="30" value="' + esc(b.phone || '') + '"></div><div class="bhq-sp"><label class="bhq-l" for="bhq-b-em">Email</label><input id="bhq-b-em" type="email" maxlength="120" value="' + esc(b.email || '') + '"></div></div>' +
            '<label class="bhq-l" for="bhq-b-notes">Notes (opening hours, etc.)</label><textarea id="bhq-b-notes" rows="2" maxlength="160">' + esc(b.notes || '') + '</textarea>' +
            '<p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn pri" type="submit">Save</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            m.querySelector('form').onsubmit = function (e) {
                e.preventDefault(); formMsg(m, 'Saving…', true);
                api({ action: 'branch.save', clientId: cid, name: m.querySelector('#bhq-b-name').value, code: m.querySelector('#bhq-b-code').value, managerPersonId: m.querySelector('#bhq-b-mgr').value || null, location: m.querySelector('#bhq-b-loc').value, phone: m.querySelector('#bhq-b-ph').value, email: m.querySelector('#bhq-b-em').value, notes: m.querySelector('#bhq-b-notes').value })
                    .then(function (j) { if (j.ok) { done(); load(); } else formMsg(m, j.error || 'Could not save.'); });
            };
        });
    }
    function branchStatus(cid) {
        var b = data.branches.filter(function (x) { return x.clientId === cid; })[0] || {}, suspend = b.status !== 'suspended';
        modal('<h3>' + (suspend ? 'Suspend ' : 'Activate ') + esc(b.name) + '?</h3><p class="bhq-sub">' + (suspend ? 'Its tills stop working until you activate it again. Nothing is deleted: its sales, stock, staff and history are kept.' : 'Its tills start working again; anything waiting on its devices is sent.') + '</p>' +
            '<form><label class="bhq-l" for="bhq-s-why">Reason' + (suspend ? '' : ' (optional)') + '</label><input id="bhq-s-why" maxlength="200"' + (suspend ? ' required' : '') + '><p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn ' + (suspend ? 'bad' : 'pri') + '" type="submit">' + (suspend ? 'Suspend branch' : 'Activate branch') + '</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            m.querySelector('form').onsubmit = function (e) { e.preventDefault(); api({ action: 'branch.status', clientId: cid, status: suspend ? 'suspended' : 'active', reason: m.querySelector('#bhq-s-why').value }).then(function (j) { if (j.ok) { done(); load(); } else formMsg(m, j.error || 'Could not change it.'); }); };
        });
    }

    /* ---------------- staff ---------------- */
    function paintStaff() {
        var q = (data.staffQ || '').toLowerCase(), fb = data.staffBranch || '', fs = data.staffStatus || '';
        var list = (data.people || []).filter(function (p) {
            if (q && (p.name + ' ' + (p.employeeNo || '') + ' ' + (p.phone || '')).toLowerCase().indexOf(q) < 0) return false;
            if (fb && !p.branches.some(function (b) { return b.clientId === fb && b.active; })) return false;
            if (fs && p.status !== fs) return false;
            return true;
        });
        var h = '<div class="bhq-card"><div class="bhq-row"><div class="bhq-sp" style="min-width:200px"><label class="bhq-l" for="bhq-q">Search name, employee number or phone</label><input id="bhq-q" value="' + esc(data.staffQ || '') + '"></div>' +
            '<div style="min-width:160px"><label class="bhq-l" for="bhq-fb">Branch</label><select id="bhq-fb"><option value="">All branches</option>' + data.branches.map(function (b) { return '<option value="' + esc(b.clientId) + '"' + (fb === b.clientId ? ' selected' : '') + '>' + esc(bname(b.clientId)) + '</option>'; }).join('') + '</select></div>' +
            '<div style="min-width:140px"><label class="bhq-l" for="bhq-fs">Status</label><select id="bhq-fs"><option value="">Any</option><option value="active"' + (fs === 'active' ? ' selected' : '') + '>Active</option><option value="deactivated"' + (fs === 'deactivated' ? ' selected' : '') + '>Deactivated</option><option value="inactive"' + (fs === 'inactive' ? ' selected' : '') + '>No branch now</option></select></div></div>' +
            '<p class="bhq-sub" style="margin:8px 0 0">' + list.length + ' of ' + (data.people || []).length + ' people. New staff are added in their branch\'s Staff tab (their PIN is set there); here you place them across branches.</p></div>';
        h += '<div class="bhq-card" style="padding:4px 8px"><table><thead><tr><th>Person</th><th>Branches</th><th class="bhq-hide-sm">Status</th><th></th></tr></thead><tbody>';
        list.forEach(function (p) {
            h += '<tr><td><b>' + esc(p.name) + '</b>' + (p.employeeNo ? '<br><span class="bhq-sub">No. ' + esc(p.employeeNo) + '</span>' : '') + (p.hqAdmin ? '<br><span class="bhq-tag">HQ administrator</span>' : '') + '</td><td>' +
                p.branches.map(function (b) { return '<span class="bhq-chip' + (b.active ? '' : ' gone') + '" title="' + esc(b.roles.length ? b.roles.length + ' screens' : 'no screens set') + '">' + esc(bname(b.clientId)) + (b.isManager && b.active ? ' · manager' : '') + (b.kind === 'temporary' && b.active ? ' <span class="bhq-tag tmp">until ' + esc(when(b.endsAt)) + '</span>' : '') + '</span>'; }).join('') +
                '</td><td class="bhq-hide-sm">' + (p.status === 'deactivated' ? '<span class="bhq-tag off">Deactivated</span>' : p.status === 'inactive' ? '<span class="bhq-tag off">No branch</span>' : '<span class="bhq-tag ok">Active</span>') + '</td><td style="white-space:nowrap">' +
                (can('staff.assign') && p.status !== 'deactivated' ? '<button type="button" class="bhq-btn" data-move="' + esc(p.personId) + '">Assign / move</button> ' : '') +
                (can('staff.manage') ? '<button type="button" class="bhq-btn" data-more="' + esc(p.personId) + '">More</button>' : '') + '</td></tr>';
        });
        frame(h + '</tbody></table>' + (list.length ? '' : '<p class="bhq-sub" style="padding:10px">Nobody matches.</p>') + '</div>');
        var qi = root.querySelector('#bhq-q'); qi.oninput = function () { data.staffQ = qi.value; var pos = qi.selectionStart; paintStaff(); var n = root.querySelector('#bhq-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ok */ } };
        root.querySelector('#bhq-fb').onchange = function (e) { data.staffBranch = e.target.value; paintStaff(); };
        root.querySelector('#bhq-fs').onchange = function (e) { data.staffStatus = e.target.value; paintStaff(); };
        Array.prototype.forEach.call(root.querySelectorAll('[data-move]'), function (x) { x.onclick = function () { assign(x.getAttribute('data-move')); }; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-more]'), function (x) { x.onclick = function () { more(x.getAttribute('data-more')); }; });
    }
    function person(pid) { return (data.people || []).filter(function (p) { return p.personId === pid; })[0]; }
    function assign(pid) {
        var p = person(pid), at = p.branches.filter(function (b) { return b.active; }), not = data.branches.filter(function (b) { return b.status !== 'suspended' && !at.some(function (x) { return x.clientId === b.clientId; }); });
        if (!at.length) return modal('<h3>' + esc(p.name) + '</h3><p class="bhq-sub">This person is not at any branch right now. Add them again from a branch\'s Staff tab, then place them here.</p><div class="bhq-row"><button class="bhq-btn" data-x>Close</button></div>', function (m, done) { m.querySelector('[data-x]').onclick = done; });
        if (!not.length) return modal('<h3>' + esc(p.name) + '</h3><p class="bhq-sub">Already at every active branch.</p><div class="bhq-row"><button class="bhq-btn" data-x>Close</button></div>', function (m, done) { m.querySelector('[data-x]').onclick = done; });
        var tomorrow = new Date(Date.now() + 7 * 86400000); var dv = tomorrow.toISOString().slice(0, 16);
        modal('<h3>Assign ' + esc(p.name) + '</h3><p class="bhq-sub">Works at: ' + at.map(function (b) { return esc(bname(b.clientId)); }).join(', ') + '. The same person and PIN are used: no second account is made, and their past sales stay with the branch where they made them.</p><form>' +
            '<label class="bhq-l" for="bhq-a-from">From (their current branch, whose screens they keep)</label><select id="bhq-a-from">' + at.map(function (b) { return '<option value="' + esc(b.clientId) + '">' + esc(bname(b.clientId)) + '</option>'; }).join('') + '</select>' +
            '<label class="bhq-l" for="bhq-a-to">To</label><select id="bhq-a-to">' + not.map(function (b) { return '<option value="' + esc(b.clientId) + '">' + esc(bname(b.clientId)) + '</option>'; }).join('') + '</select>' +
            '<div class="bhq-radio" role="radiogroup" aria-label="Kind of assignment"><label><input type="radio" name="bhq-k" value="additional" checked><span><b>Also works there</b><br><span class="bhq-sub">Keeps the current branch and adds this one.</span></span></label>' +
            '<label><input type="radio" name="bhq-k" value="permanent"><span><b>Move permanently</b><br><span class="bhq-sub">Leaves the current branch and works only at the new one.</span></span></label>' +
            '<label><input type="radio" name="bhq-k" value="temporary"><span><b>Temporary posting</b><br><span class="bhq-sub">Works there until the date below, then that access ends by itself.</span></span></label></div>' +
            '<div id="bhq-a-endw" hidden><label class="bhq-l" for="bhq-a-end">Until</label><input id="bhq-a-end" type="datetime-local" value="' + dv + '"></div>' +
            '<label class="bhq-l"><input type="checkbox" id="bhq-a-mgr" style="width:auto;min-height:0"> Branch manager at the new branch</label>' +
            '<label class="bhq-l" for="bhq-a-why">Reason</label><input id="bhq-a-why" maxlength="200" placeholder="e.g. covering weekends">' +
            '<p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn pri" type="submit">Confirm</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            Array.prototype.forEach.call(m.querySelectorAll('[name="bhq-k"]'), function (r) { r.onchange = function () { m.querySelector('#bhq-a-endw').hidden = m.querySelector('[name="bhq-k"]:checked').value !== 'temporary'; }; });
            m.querySelector('form').onsubmit = function (e) {
                e.preventDefault(); var kind = m.querySelector('[name="bhq-k"]:checked').value, endsAt = kind === 'temporary' ? new Date(m.querySelector('#bhq-a-end').value).getTime() : 0;
                if (kind === 'temporary' && !(endsAt > Date.now())) return formMsg(m, 'Choose an end date in the future.');

                    .then(function (j) { if (j.ok) { done(); data.people = null; data.audit = null; if (j.partial) alert(j.partial); load(); tab = 'staff'; } else formMsg(m, j.error || 'Could not save.'); });
            };
        });
    }
    function more(pid) {
        var p = person(pid), at = p.branches.filter(function (b) { return b.active; });
        modal('<h3>' + esc(p.name) + '</h3><form id="bhq-pe"><div class="bhq-row"><div class="bhq-sp"><label class="bhq-l" for="bhq-p-name">Name</label><input id="bhq-p-name" maxlength="80" value="' + esc(p.name) + '"></div><div class="bhq-sp"><label class="bhq-l" for="bhq-p-no">Employee number</label><input id="bhq-p-no" maxlength="30" value="' + esc(p.employeeNo || '') + '"></div></div>' +
            '<label class="bhq-l" for="bhq-p-ph">Phone</label><input id="bhq-p-ph" maxlength="20" value="' + esc(p.phone || '') + '"><div class="bhq-row" style="margin-top:10px"><button class="bhq-btn pri" type="submit">Save details</button>' + (can('staff.manage') && at.length ? '<button class="bhq-btn" type="button" data-role>🎭 Role at a branch</button>' : '') + '</div></form>' +

            '<h3 style="margin-top:16px">' + (p.status === 'deactivated' ? 'Reactivate' : 'Deactivate') + '</h3><p class="bhq-sub">' + (p.status === 'deactivated' ? 'Lets them be placed at a branch again.' : 'Removes them from every branch at once and ends their sessions and any HQ access. Their past sales, shifts and payroll stay as they are.') + '</p>' +
            '<label class="bhq-l" for="bhq-p-why">Reason</label><input id="bhq-p-why" maxlength="200"><p class="bhq-msg" role="alert"></p><div class="bhq-row"><button type="button" class="bhq-btn ' + (p.status === 'deactivated' ? 'pri' : 'bad') + '" data-deact>' + (p.status === 'deactivated' ? 'Reactivate' : 'Deactivate everywhere') + '</button><button class="bhq-btn" type="button" data-x>Close</button></div>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            var after = function (j) { if (j.ok) { done(); data.people = null; data.audit = null; paint(); } else formMsg(m, j.error || (j.failed && j.failed.length ? 'Some branches did not answer; try again.' : 'Could not save.')); };
            var gr = m.querySelector('[data-role]'); if (gr) gr.onclick = function () { done(); giveRole(pid); };

    function openXfer(id) {

                    var probs = (l.qty_damaged ? qty(l.qty_damaged) + ' damaged ' : '') + (l.qty_missing ? qty(l.qty_missing) + ' missing' : '');

        var msg = function (t, ok) { var e = f.querySelector('.bhq-msg'); e.className = 'bhq-msg ' + (ok ? 'ok' : 'err'); e.textContent = t; };
        f.onsubmit = function (e) { e.preventDefault(); msg('Loading…', true); api(q(false)).then(function (j) { if (!j.ok) return msg(j.error || 'Could not load it.'); msg('');
            var t = j.totals || {}, sum = j.head[0] === 'Date' ? 'Total ' + money(t.total) + ' · ' + (t.n || 0) + ' sales · gross profit ' + money((t.total || 0) - (t.cost || 0)) : t.value != null ? 'Value at cost ' + money(t.value) + ' · ' + (t.low || 0) + ' low · ' + (t.out || 0) + ' out' : t.transfers != null ? t.transfers + ' transfers · ' + t.discrepancies + ' with discrepancies' : (t.people || 0) + ' people';
            var html = '<div class="bhq-card"><h3>' + esc(j.scope) + ' · ' + esc(j.from) + ' to ' + esc(j.to) + '</h3><p class="bhq-sub">' + sum + (j.rows.length >= 5000 ? ' · first 5,000 lines shown; the CSV has them all' : '') + '</p>' +
                (t.perBranch && t.perBranch.length > 1 ? '<p class="bhq-sub">' + t.perBranch.map(function (p) { return esc(p.branch) + ': ' + money(p.total); }).join(' · ') + '</p>' : '') + '</div>' +
                '<div class="bhq-card" style="padding:4px 8px;overflow-x:auto"><table><thead><tr>' + j.head.map(function (x) { return '<th>' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' + j.rows.slice(0, 500).map(function (row) { return '<tr>' + row.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>' + (j.rows.length > 500 ? '<p class="bhq-sub" style="padding:8px">' + j.rows.length + ' lines: the first 500 are shown. Download the CSV for all.</p>' : '') + (j.rows.length ? '' : '<p class="bhq-sub" style="padding:8px">Nothing in this period.</p>') + '</div>';
            data.rep.html = html; root.querySelector('#bhq-rout').innerHTML = html; }); };
        f.querySelector('[data-a="csv"]').onclick = function () { msg('Preparing…', true); var body = q(true); api(body).then(function (j) { if (!j.csv) return msg(j.error || 'Could not prepare it.');
            var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + j.csv], { type: 'text/csv;charset=utf-8' })); a.download = body.action.replace('report.', '') + '-' + (body.clientId === 'all' ? 'all-branches' : bname(body.clientId).replace(/[^\w]+/g, '-')) + '-' + body.from + '-to-' + body.to + '.csv';
            document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); msg('Downloaded.', true); }); };
    }

    /* ---------------- roles ---------------- */
    function appTabs() { var t = []; try { if (typeof ROLE_TABS !== 'undefined') t = ROLE_TABS; else if (typeof LOCKABLE_TABS !== 'undefined') t = LOCKABLE_TABS; } catch (e) { t = []; } return (t || []).filter(function (x) { return x && x.id && x.id !== 'staff-tab'; }); }
    function paintRoles() {
        if (!data.roles) { frame('<p class="bhq-sub">Loading roles…</p>'); return api({ action: 'role.list' }).then(function (j) { data.roles = j.roles || []; data.templates = j.templates || []; paint(); }); }
        var man = can('staff.manage'), tabs = appTabs(), lab = function (id) { var x = tabs.filter(function (t) { return t.id === id; })[0]; return x ? x.label : id; };
        var h = '<div class="bhq-card"><h3>Roles</h3><p class="bhq-sub">A role is a set of screens (and, for a manager, the manager rights) you give a person <b>at one branch</b>. The same person can have a different role at another branch. Give a role from Staff → ⋯ More.</p>' +
            (man ? '<div class="bhq-row" style="margin-top:8px">' + data.templates.map(function (t) { return '<button type="button" class="bhq-btn" data-tpl="' + esc(t.key) + '" title="' + esc(t.about) + '">＋ ' + esc(t.name) + '</button>'; }).join('') + '<button type="button" class="bhq-btn pri" data-tpl="">＋ Custom role</button></div>' : '') + '</div>';
        h += '<div class="bhq-grid">' + data.roles.map(function (r) { return '<div class="bhq-card"><div class="bhq-row"><h3 class="bhq-sp">' + esc(r.name) + '</h3>' + (r.isManager ? '<span class="bhq-tag main">Manager</span>' : '') + '</div><p class="bhq-sub">' + esc(r.about || '') + '</p><div>' + r.tabs.map(function (t) { return '<span class="bhq-chip">' + esc(lab(t)) + '</span>'; }).join('') + '</div>' +
            (man ? '<div class="bhq-row" style="margin-top:8px"><button type="button" class="bhq-btn" data-red="' + esc(r.roleId) + '">Edit</button><button type="button" class="bhq-btn bad" data-rarc="' + esc(r.roleId) + '">Archive</button></div>' : '') + '</div>'; }).join('') + '</div>' + (data.roles.length ? '' : '<p class="bhq-sub">No roles yet. Start from a template above.</p>');
        frame(h);
        Array.prototype.forEach.call(root.querySelectorAll('[data-tpl]'), function (b) { b.onclick = function () { roleForm(null, b.getAttribute('data-tpl')); }; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-red]'), function (b) { b.onclick = function () { roleForm(b.getAttribute('data-red')); }; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-rarc]'), function (b) { b.onclick = function () { if (!confirm('Archive this role? People who have it keep their screens until you change them.')) return; api({ action: 'role.archive', roleId: b.getAttribute('data-rarc') }).then(function () { data.roles = null; paint(); }); }; });
    }
    function roleForm(roleId, tplKey) {
        var r = (data.roles || []).filter(function (x) { return x.roleId === roleId; })[0], tpl = (data.templates || []).filter(function (t) { return t.key === tplKey; })[0], tabs = appTabs();
        var pre = r ? r.tabs : tpl ? tabs.filter(function (t) { return new RegExp(tpl.match).test(t.id) && !(tpl.not && new RegExp(tpl.not).test(t.id)); }).map(function (t) { return t.id; }) : [];
        modal('<h3>' + (r ? 'Edit ' + esc(r.name) : tpl ? 'New role: ' + esc(tpl.name) : 'New custom role') + '</h3><form><label class="bhq-l" for="bhq-rn">Name</label><input id="bhq-rn" maxlength="40" required value="' + esc(r ? r.name : tpl ? tpl.name : '') + '">' +
            '<label class="bhq-l" for="bhq-ra">Description</label><input id="bhq-ra" maxlength="160" value="' + esc(r ? r.about : tpl ? tpl.about : '') + '">' +
            '<label class="bhq-l"><input type="checkbox" id="bhq-rm" style="width:auto;min-height:0"' + ((r ? r.isManager : tpl && tpl.isManager) ? ' checked' : '') + '> Branch manager rights</label>' +
            '<div class="bhq-perms"><label class="bhq-l">Screens</label>' + (tabs.length ? tabs.map(function (t) { return '<label><input type="checkbox" value="' + esc(t.id) + '"' + (pre.indexOf(t.id) >= 0 ? ' checked' : '') + '> ' + esc(t.label) + '</label>'; }).join('') : '<p class="bhq-sub">Open HQ from the app to choose screens.</p>') + '</div>' +
            '<p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn pri" type="submit">Save role</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            m.querySelector('form').onsubmit = function (e) { e.preventDefault(); var t = Array.prototype.map.call(m.querySelectorAll('.bhq-perms input:checked'), function (x) { return x.value; }); if (!t.length) return formMsg(m, 'Choose at least one screen.');
                api({ action: 'role.save', roleId: roleId || undefined, name: m.querySelector('#bhq-rn').value, about: m.querySelector('#bhq-ra').value, isManager: m.querySelector('#bhq-rm').checked, tabs: t, template: tplKey || (r && r.template) || null }).then(function (j) { if (j.ok) { done(); data.roles = null; paint(); } else formMsg(m, j.error || 'Could not save.'); }); };
        });
    }
    function giveRole(pid) {
        var p = person(pid), at = p.branches.filter(function (b) { return b.active; });
        var go = function () { modal('<h3>Role for ' + esc(p.name) + '</h3><form><label class="bhq-l" for="bhq-gb">At branch</label><select id="bhq-gb">' + at.map(function (b) { return '<option value="' + esc(b.clientId) + '">' + esc(bname(b.clientId)) + '</option>'; }).join('') + '</select>' +
            '<label class="bhq-l" for="bhq-gr">Role</label><select id="bhq-gr">' + (data.roles || []).map(function (r) { return '<option value="' + esc(r.roleId) + '">' + esc(r.name) + (r.isManager ? ' (manager)' : '') + '</option>'; }).join('') + '</select>' +
            '<label class="bhq-l" for="bhq-gw">Reason</label><input id="bhq-gw" maxlength="200"><p class="bhq-msg" role="alert"></p><div class="bhq-row"><button class="bhq-btn pri" type="submit">Give role</button><button class="bhq-btn" type="button" data-x>Cancel</button></div></form>', function (m, done) {
            m.querySelector('[data-x]').onclick = done;
            m.querySelector('form').onsubmit = function (e) { e.preventDefault(); if (!(data.roles || []).length) return formMsg(m, 'Create a role first (Roles tab).'); api({ action: 'staff.role', personId: pid, clientId: m.querySelector('#bhq-gb').value, roleId: m.querySelector('#bhq-gr').value, reason: m.querySelector('#bhq-gw').value }).then(function (j) { if (j.ok) { done(); data.people = null; data.audit = null; paint(); } else formMsg(m, j.error || 'Could not save.'); }); };
        }); };
        if (data.roles) go(); else api({ action: 'role.list' }).then(function (j) { data.roles = j.roles || []; data.templates = j.templates || []; go(); });
    }

    /* ---------------- entry points: the Staff tab and the branch switcher ---------------- */
    // zip 311: the button stays put. It used to follow "is the Admin serving right now" every 2.5 s, so it vanished whenever a staff member was
    // checked in on the device, and it vanished when the Staff tab redrew itself. Anyone who can open the Staff tab sees it (HQ asks for the owner's
    // password or an administrator's PIN anyway), and it is put back the moment the tab redraws.
    function placeButton() {
        var st = document.getElementById('staff-tab'); if (!st) return;
        if (!isAdminNow()) { var ob = document.getElementById('bhq-open'); if (ob) ob.remove(); return; }   // zip 325: only the Admin sees it
        if (st.querySelector('#bhq-open')) return;
        var b = document.getElementById('bhq-open');
        if (!b) { b = document.createElement('button'); b.type = 'button'; b.id = 'bhq-open'; b.className = 'bhq-open-btn'; b.innerHTML = '🏢 Business HQ <span style="font-weight:500;opacity:.8">stock across branches, transfers, reports</span>'; b.onclick = function () { window.openBusinessHQ(); }; }
        st.insertBefore(b, st.firstChild);
    }
    function watchStaffTab() {
        var st = document.getElementById('staff-tab'); if (!st) return false;
        placeButton();
        try { new MutationObserver(function () { if (!st.querySelector('#bhq-open')) placeButton(); }).observe(st, { childList: true }); } catch (e) { /* the timer below */ }
        return true;
    }
    if (!watchStaffTab()) document.addEventListener('DOMContentLoaded', watchStaffTab);
    // zip 313: a permanent "Business HQ" line in the side menu, just above the signed-in person - always there, on every page, whoever is
    // signed in on the till (HQ itself asks for the owner's password or an administrator's PIN). The side menu redraws its list often and can be
    // rebuilt when the window is resized, so this line sits OUTSIDE the list and is put back the moment it is missing.
    function placeSideEntry() {
        var a = document.getElementById('snav'); if (!a) return;
        if (!isAdminNow()) { var os = document.getElementById('bhq-snav'); if (os) os.remove(); return; }   // zip 325: only the Admin sees it
        if (a.querySelector('#bhq-snav')) return;
        var foot = a.querySelector('.sn-foot'); if (!foot) return;
        var d = document.createElement('div'); d.id = 'bhq-snav'; d.style.cssText = 'flex:0 0 auto;padding:6px 10px;border-top:1px solid var(--border-color,#e1e6ea);';
        d.innerHTML = '<button type="button" class="sn-item" title="Business HQ"><span class="sn-ic">🏢</span><span class="sn-tx">Business HQ</span></button>';
        d.querySelector('button').onclick = function () { try { if (document.body.classList.contains('snav-open')) document.body.classList.remove('snav-open'); } catch (e) { /* ok */ } window.openBusinessHQ(); };
        a.insertBefore(d, foot);
    }
    placeSideEntry();
    setInterval(function () { placeButton(); placeSideEntry(); }, 1500);
    try { new MutationObserver(function () { if (!document.getElementById('bhq-snav')) placeSideEntry(); }).observe(document.body, { childList: true }); } catch (e) { /* the timer */ }
    // the branch switcher's menu gets a "Business HQ" line
    document.addEventListener('click', function () { setTimeout(function () {
        var menu = document.getElementById('branch-menu'); if (!menu || !menu.classList.contains('open') || menu.querySelector('[data-bhq]') || !isAdminNow()) return;
        var btn = document.createElement('button'); btn.type = 'button'; btn.setAttribute('data-bhq', '1'); btn.innerHTML = '<span class="bm-tick"></span><span>🏢 Business HQ<span class="bm-sub">Dashboard, transfers, reports, staff</span></span>';
        btn.onclick = function () { menu.classList.remove('open'); window.openBusinessHQ(); };
        menu.appendChild(btn);
    }, 0); }, true);
})();
</script>
