<!-- DARK MODE FIX (zip 247) ------------------------------------------------------------------------------------------------------
         Dark mode (Settings > theme) changes the page and the inputs, but many small notes, tips, tinted boxes and grey captions were written with
         fixed light colours (a pale yellow / green / red / grey box with the page's now-LIGHT text on it, or dark-grey text on the dark page),
         so parts of the screen were unreadable. This one rule set only applies in dark mode: pale boxes become dark tinted boxes, dark text
         that sat on them becomes light, and grey captions are lifted to a readable grey. Light mode is untouched. -->

    <script>
    /* zip 247 - DARK MODE CONTRAST GUARD. Whatever the stylesheet or an inline style says, in dark mode every piece of text is checked against the colour
       it actually sits on (the nearest solid background behind it): when the two are too close (dark text on the dark page, light text on a pale box) the text
       colour is switched to a readable one. It only touches text that is already unreadable, runs after every screen change, and is undone completely when
       dark mode is switched off. It never changes backgrounds, sizes, layout or any data. */

        function lum(c) { function f(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); } return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); }

    })();
