    function fileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
            if (!file) { reject(PErr('no_file', 'Choose a file first.')); return; }
            if (!/\.pdf$/i.test(file.name || '') && file.type !== 'application/pdf') { reject(PErr('bad_file', 'Only PDF files are accepted. Save or scan the document as a PDF and upload that.')); return; }
            var rd = new FileReader();
            rd.onerror = function () { reject(PErr('bad_file', 'That file could not be read.')); };
            rd.onload = function () { resolve(String(rd.result || '').replace(/^data:[^;,]*/, 'data:application/pdf')); };      // the server still checks the real content
            rd.readAsDataURL(file);
        });
    }
