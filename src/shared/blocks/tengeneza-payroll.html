<!-- TENGENEZA PAYROLL ---------------------------------------------------------
     "💼 Payroll": the staff register, staff documents, pay runs and payslips (zip 216). Same block in every app.
     Everything is kept on the server in the shop's D1 database (functions/api/payroll.js) and the SERVER decides who may see or do what:
     the Admin everything; a staff member the Admin has given payroll access exactly that; every other staff member only their OWN payslips.
     This page only displays what the server returns. It needs the internet (salaries and ID copies are never kept on the device).
     Flow for the user:  Add staff -> add salary -> Run payroll -> Review -> Approve -> Mark paid -> Payslip (print / PDF / share). -->

    :is(#payroll-tab, #prl-modal, #prl-dash-card) .prl-chip.adj { background: #efe0f7; color: #6b2c8a; }

    :is(#payroll-tab, #prl-modal, #prl-dash-card) .prl-steps span.done { background: #d9f2e7; color: #146c4e; } :is(#payroll-tab, #prl-modal, #prl-dash-card) .prl-steps span.now { background: #1f8a70; color: #fff; }

<div id="payroll-tab" class="tab-content">
    <div class="panel prl">
        <div class="prl-head"><h3>💼 Create Payroll</h3><span id="prl-who" class="prl-muted"></span></div>
        <div id="prl-body"><p class="prl-muted">Opening payroll…</p></div>
    </div>
</div>
<div id="prl-modal" role="dialog" aria-modal="true"><div class="prl-modal-in" id="prl-modal-in"></div></div>
<script>
(function () {
    'use strict';
    var S = { view: 'overview', who: null, me: null, sub: 'overview', emps: [], types: null, runs: [], busy: false, q: '', lastErr: '', runId: null, empId: null, ready: false };
    var STEPS = ['draft', 'reviewed', 'approved', 'paid'];
    var CATS = { national_id: 'National ID copy', passport: 'Passport', certificate: 'Certificate', academic: 'Academic certificate', professional: 'Professional certificate', contract: 'Employment contract', appointment: 'Appointment letter', other: 'Other document' };
    var FREQ = { monthly: 'Monthly', biweekly: 'Every 2 weeks', weekly: 'Weekly', daily: 'Daily' };
    var ESTAT = { active: 'Active', on_leave: 'On leave', suspended: 'Suspended', former: 'Former employee' };
    var PERM_LABEL = { view: 'See salaries & payslips', staff: 'Add / edit staff & documents', run: 'Run payroll (prepare & review)', approve: 'Approve & pay payroll', settings: 'Payroll settings & audit log' };

    function $(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function kes(n) { var v = Math.round((Number(n) || 0) * 100) / 100; return 'KES ' + v.toLocaleString('en-KE', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
    function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
    function dshow(d) { if (!d) return '—'; var t = new Date(String(d).slice(0, 10) + 'T00:00:00Z'); return isNaN(t) ? String(d) : t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }); }
    function today() { return new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10); }
    function toast(m, bad) { try { if (typeof showToast === 'function') { showToast(m, !!bad); return; } } catch (e) { /* fall through */ } }
    function has(p) { return !!(S.who && (S.who.admin || (S.who.perms || []).indexOf(p) !== -1)); }
    function anyPerm() { return !!(S.who && (S.who.admin || (S.who.perms || []).length)); }
    function canSeeMoney() { return anyPerm(); }
    function sidNow() { try { return typeof currentServer !== 'undefined' && currentServer && currentServer.id ? String(currentServer.id) : 'admin'; } catch (e) { return 'admin'; } }
    function apiUrlOf(p) { return typeof apiUrl === 'function' ? apiUrl(p) : p; }
    function isOffline() { try { return typeof window.posNetOffline === 'function' ? !!window.posNetOffline() : navigator.onLine === false; } catch (e) { return false; } }

    /* ---------------- server calls ---------------- */
    function PErr(code, msg, problems) { var e = new Error(msg); e.code = code; e.problems = problems; return e; }
    async function api(action, body) {
        var res;
        try { res = await fetch(apiUrlOf('/api/payroll'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: action }, body || {})) }); }
        catch (e) { throw PErr('offline', 'No internet. Payroll needs a connection — salaries and ID copies are never stored on this device.'); }
        if (action === 'doc.file' && res.ok) return res;
        var d = await res.json().catch(function () { return {}; });
        if (!res.ok || d.ok === false) throw PErr(d.code || ('http_' + res.status), d.error || 'Something went wrong. Nothing was changed.', d.problems);
        return d;
    }
    async function sessionReady() {
        var s = typeof window.staffSessionFor === 'function' ? window.staffSessionFor(sidNow()) : null;
        if (!(s && s.token) && typeof window.staffSessionEnsure === 'function' && !isOffline()) { try { await window.staffSessionEnsure(sidNow()); } catch (e) { /* ask below */ } s = window.staffSessionFor(sidNow()); }
        return !!(s && s.token);
    }

    /* ---------------- who am I / button visibility ---------------- */
    async function loadWho() {
        S.who = (await api('whoami')); S.me = null;
        try { S.me = await api('me'); } catch (e) { S.me = { employee: null, payslips: [] }; }
        try { localStorage.setItem('pr_vis_' + sidNow(), (anyPerm() || (S.me && S.me.employee)) ? '1' : '0'); } catch (e) { /* not remembered */ }
        paintBtn();
    }
    function paintBtn() {
        var b = $('payroll-tab-btn'); if (!b) return;
        var sid = sidNow(), show;
        if (S.who && S.who.sid === sid) show = anyPerm() || !!(S.me && S.me.employee);
        else { var c = null; try { c = localStorage.getItem('pr_vis_' + sid); } catch (e) { /* none */ } show = sid === 'admin' ? c !== '0' : c === '1'; }
        b.style.display = show ? '' : 'none';
    }
    async function refreshAccess() {
        try { if (!(await sessionReady()) || isOffline()) { paintBtn(); return; } await loadWho(); } catch (e) { paintBtn(); }
    }

    /* ---------------- shell ---------------- */
    function nav() {
        var items = [];
        if (anyPerm()) items.push(['overview', '🏠 Overview'], ['staff', '👥 Staff'], ['runs', '🧾 Payroll']);
        if (S.me && S.me.employee) items.push(['mine', '🧾 My payslips']);
        if (has('settings') || has('view') || has('staff')) items.push(['settings', '⚙️ Settings']);
        return '<div class="prl-nav">' + items.map(function (i) { return '<button type="button" class="' + (S.view === i[0] ? 'on' : '') + '" onclick="Payroll.go(\'' + i[0] + '\')">' + i[1] + '</button>'; }).join('') + '</div>';
    }
    function body(html) { $('prl-body').innerHTML = html; }
    function errBox(e) {
        var msg = esc(e && e.message || 'Something went wrong.');
        var probs = e && e.problems ? '<ul>' + e.problems.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '';
        return '<div class="prl-err">⚠️ ' + msg + probs + '</div>';
    }
    function unlockCard(why) {
        var admin = sidNow() === 'admin';
        return '<div class="prl-box"><h4>🔐 Sign in to open payroll</h4><div class="prl-tip">Payroll holds salaries and ID copies, so it opens only after the server has checked who you are. ' + esc(why || '') + '</div>' +
            '<div class="prl-form"><div><label>' + (admin ? 'Admin / management password' : 'Your PIN') + '</label><input id="prl-unlock" type="password" autocomplete="current-password" inputmode="' + (admin ? 'text' : 'numeric') + '"></div></div>' +
            '<div class="prl-actions"><button type="button" onclick="Payroll.unlock()">Unlock payroll</button></div><div id="prl-unlock-msg" class="prl-muted"></div></div>';
    }
    async function unlock() {
        var el = $('prl-unlock'), msg = $('prl-unlock-msg'); if (!el || !el.value) return;
        try {
            if (isOffline()) { msg.textContent = 'You are offline. Connect to the internet first.'; return; }
            msg.textContent = 'Checking…';
            var proof = typeof hashPassword === 'function' ? await hashPassword(el.value) : '';
            var sid = sidNow(), body2 = sid === 'admin' ? { admin: true, proof: proof } : { staffId: sid, proof: proof };
            var res = await fetch(apiUrlOf('/api/staff-session'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body2) });
            var d = await res.json().catch(function () { return {}; });
            if (!res.ok || !d.ok) { msg.textContent = d.error || 'That did not work.'; return; }
            if (typeof window.staffSessionStart === 'function') { window.staffSessionStart(sid, proof); await new Promise(function (r) { setTimeout(r, 900); }); }
            if (!(await sessionReady())) { msg.textContent = 'Could not start the session. Try again.'; return; }
            open();
        } catch (e) { msg.textContent = e.message; }
    }

    async function open() {
        if (isOffline()) { body('<div class="prl-warnbox">📴 You are offline. Payroll needs the internet — salaries, ID copies and payslips are never kept on this device.</div>'); return; }
        if (!(await sessionReady())) { body(unlockCard('(This device could not confirm your sign-in with the server yet.)')); return; }
        body('<p class="prl-muted">Loading…</p>');
        try {
            await loadWho();
            if (!anyPerm() && !(S.me && S.me.employee)) { body('<div class="prl-empty"><b>🔒 No payroll access</b>You have not been given access to payroll. Ask the Admin.</div>'); return; }
            if (!anyPerm()) S.view = 'mine'; else if (S.view === 'mine' && !(S.me && S.me.employee)) S.view = 'overview';
            S.ready = true; render();
        } catch (e) {
            if (e.code === 'staff_session_required') body(unlockCard(e.message)); else body(errBox(e));
        }
        $('prl-who').textContent = S.who ? S.who.name + (S.who.admin ? ' · Admin' : '') : '';
    }
    function go(v) { S.view = v; S.empId = null; S.runId = null; S.sub = 'overview'; render(); }
    async function render() {
        try {
            var v = S.view, html = '';
            if ((v === 'overview' || v === 'staff') && !S.empId) await autoSyncPos();      // zip 245: POS staff are in the register without being added a second time
            if (v === 'overview') html = await vOverview();
            else if (v === 'staff') html = S.empId ? await vEmployee() : await vStaff();
            else if (v === 'runs') html = S.runId ? await vRun() : await vRuns();
            else if (v === 'mine') html = vMine();
            else if (v === 'settings') html = await vSettings();
            body(nav() + html);
        } catch (e) {
            if (e.code === 'staff_session_required') { body(unlockCard(e.message)); return; }
            body((S.who ? nav() : '') + errBox(e));
        }
    }
    function empty(t, s) { return '<div class="prl-empty"><b>' + t + '</b>' + (s || '') + '</div>'; }

    async function ensureTypes() { if (!S.types) { try { S.types = (await api('types.list')).types || []; } catch (e) { S.types = []; } } return S.types; }

    /* ---------------- overview ---------------- */
    async function vOverview() {
        var d = (await api('dashboard', {}));
        var exp = (d.expiring || []).map(function (x) { var late = x.expiry_date < today(); return '<div class="prl-row" onclick="Payroll.openEmp(\'' + x.emp_id + '\')"><div class="l"><b>' + esc(x.title) + '</b><span>' + esc(x.name) + '</span></div><div class="r"><span class="prl-chip ' + (late ? 'late' : 'reviewed') + '">' + (late ? 'Expired ' : 'Expires ') + dshow(x.expiry_date) + '</span></div></div>'; }).join('');
        return '<div class="prl-cards">' +
            '<div class="prl-card info"><small>Employees</small><b>' + d.employees + '</b></div>' +
            '<div class="prl-card good"><small>This month\'s payroll</small><b>' + kes(d.monthTotal) + '</b></div>' +
            '<div class="prl-card warn"><small>Pending approval</small><b>' + d.pendingApproval + '</b></div>' +
            '<div class="prl-card good"><small>Paid</small><b>' + d.paid + '</b></div>' +
            '<div class="prl-card info"><small>Upcoming payroll</small><b style="font-size:17px">' + dshow(d.upcoming) + '</b></div></div>' +
            '<div class="prl-actions">' + (has('staff') ? '<button type="button" onclick="Payroll.newEmp()">➕ Add staff</button>' : '') + (has('run') ? '<button type="button" class="sec" onclick="Payroll.go(\'runs\');Payroll.newRun()">▶ Run payroll</button>' : '') + '</div>' +

                var url = String(rd.result || '');
                if (file.type.indexOf('image/') === 0 && file.size > 1.8 * 1024 * 1024) {              // a big phone photo: shrink it (the limit is 2.5 MB)
                    var im = new Image();

            rd.readAsDataURL(file);
        });

    }
    async function perm(sid, name) {

    }
    async function template() { try { await api('types.template'); toast('Added — switched off until you review them'); render(); } catch (e) { toast(e.message, true); } }
    function typeEdit(id, kind) {
        var t = (S.types || []).filter(function (x) { return x.type_id === id; })[0] || { kind: kind || 'earning', calc: 'fixed', rate: 0, amount: 0, active: 1, cfg: {} }; S.typeCur = t;
        var cfg = t.cfg || {};
        modal('<h4>' + (id ? 'Edit' : 'New') + ' ' + (t.kind === 'earning' ? 'pay type' : 'deduction type') + '</h4><div class="prl-form"><div><label>Name</label><input id="ty-label" value="' + esc(t.label || '') + '"></div>' +
            '<div><label>How it is worked out</label><select id="ty-calc" onchange="Payroll.tyCalc()"><option value="fixed"' + (t.calc === 'fixed' ? ' selected' : '') + '>A fixed amount</option><option value="percent_basic"' + (t.calc === 'percent_basic' ? ' selected' : '') + '>% of basic pay</option><option value="percent_gross"' + (t.calc === 'percent_gross' ? ' selected' : '') + '>% of total pay (basic + additions)</option><option value="bands"' + (t.calc === 'bands' ? ' selected' : '') + '>Tax bands (like PAYE)</option></select></div>' +
            '<div id="ty-amt"><label>Amount (KES)</label><input id="ty-amount" type="number" min="0" step="0.01" value="' + (t.amount || 0) + '"></div><div id="ty-rate"><label>Percent (%)</label><input id="ty-r" type="number" min="0" max="100" step="0.01" value="' + (t.rate || 0) + '"></div>' +
            '<div><label>Smallest amount (optional)</label><input id="ty-min" type="number" min="0" step="0.01" value="' + (cfg.min || '') + '"></div><div><label>Largest amount (optional)</label><input id="ty-max" type="number" min="0" step="0.01" value="' + (cfg.max || '') + '"></div><div><label>Only count pay up to (optional)</label><input id="ty-cap" type="number" min="0" step="0.01" value="' + (cfg.base_cap || '') + '"></div></div>' +
            '<div id="ty-bands" style="display:none"><div class="prl-form"><div><label>Tax relief taken off (KES)</label><input id="ty-relief" type="number" min="0" step="0.01" value="' + (cfg.relief || 0) + '"></div><div><label>Pay before tax is reduced by these deduction types (their ids, comma separated)</label><input id="ty-less" value="' + esc((cfg.lessTypeIds || []).join(',')) + '"></div></div><label class="prl-muted">Bands — one per line as: upper limit, percent  (leave the limit empty for “everything above”)</label><textarea id="ty-b" rows="6" style="width:100%">' + esc((cfg.bands || []).map(function (b) { return (b.upTo == null ? '' : b.upTo) + ',' + b.rate; }).join('\n')) + '</textarea></div>' +

            '<label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:normal"><input id="ty-on" type="checkbox" style="width:auto"' + (t.active ? ' checked' : '') + '> Switched on</label><div id="prl-mmsg"></div><div class="prl-actions"><button type="button" onclick="Payroll.tySave()">Save</button><button type="button" class="sec" onclick="Payroll.closeModal()">Cancel</button></div>');

    function tyCalc() { var c = $('ty-calc').value; $('ty-amt').style.display = c === 'fixed' ? '' : 'none'; $('ty-rate').style.display = (c === 'percent_basic' || c === 'percent_gross') ? '' : 'none'; $('ty-bands').style.display = c === 'bands' ? '' : 'none'; }
    async function tySave() {
        try {
            var t = S.typeCur, cfg = {}, g = function (id) { return $(id).value; };
            if (g('ty-min')) cfg.min = num(g('ty-min')); if (g('ty-max')) cfg.max = num(g('ty-max')); if (g('ty-cap')) cfg.base_cap = num(g('ty-cap'));
            if (g('ty-calc') === 'bands') { cfg.relief = num(g('ty-relief')); cfg.lessTypeIds = g('ty-less').split(',').map(function (x) { return x.trim(); }).filter(Boolean); cfg.bands = g('ty-b').split('\n').map(function (l) { var p = l.split(','); return p.length >= 2 ? { upTo: p[0].trim() === '' ? null : num(p[0]), rate: num(p[1]) } : null; }).filter(Boolean); }

            card.innerHTML = '<h4 style="margin:0 0 8px">💼 Create Payroll</h4><div class="prl-cards" style="margin:0"><div class="prl-card info"><small>Employees</small><b>' + d.employees + '</b></div><div class="prl-card good"><small>This month</small><b style="font-size:18px">' + kes(d.monthTotal) + '</b></div><div class="prl-card warn"><small>Pending approval</small><b>' + d.pendingApproval + '</b></div><div class="prl-card good"><small>Paid</small><b>' + d.paid + '</b></div><div class="prl-card info"><small>Upcoming payroll</small><b style="font-size:16px">' + dshow(d.upcoming) + '</b></div></div><div class="prl-actions" style="margin-bottom:0"><button type="button" class="sec" onclick="var b=document.getElementById(\'payroll-tab-btn\');if(b)b.click()">Open payroll</button></div>';
        } catch (e) { /* the dashboard simply has no payroll card */ }
    }
    var _refresh = refreshAccess; refreshAccess = async function () { await _refresh(); dashCard(); };

    /* ---------------- wiring into the app ---------------- */
    // Payroll is never "locked" by the tab-role list: the SERVER decides what each person may see inside it.
    // (This block sits in the middle of the page, before the app's own script defines performTabSwitch / isTabLocked, so it hooks them once the page has loaded.)
    var wiredLock = false, wiredSwitch = false;
    function wire() {
        try { if (!wiredLock && typeof isTabLocked === 'function') { var _lock = isTabLocked; isTabLocked = function (id) { return id === 'payroll-tab' ? false : _lock.apply(this, arguments); }; wiredLock = true; } } catch (e) { /* the app has its own tab rules */ }
        try {
            if (!wiredSwitch && typeof performTabSwitch === 'function') {
                var _perf = performTabSwitch;
                performTabSwitch = function (btn, id) { var r = _perf.apply(this, arguments); if (id === 'payroll-tab') { S.view = anyPerm() ? S.view : 'mine'; open(); } return r; };
                wiredSwitch = true;
            }
        } catch (e) { /* the tab opens by its button anyway */ }
    }
    wire(); document.addEventListener('DOMContentLoaded', wire); window.addEventListener('load', function () { wire(); setTimeout(wire, 300); setTimeout(wire, 1500); });

    setInterval(refreshAccess, 45000); setTimeout(refreshAccess, 2500); setTimeout(paintBtn, 600);

    window.Payroll = { __t: { S: S, autoSyncPos: autoSyncPos }, importPos: importPos, go: go, open: open, unlock: unlock, newEmp: newEmp, saveNew: saveNew, saveEmp: saveEmp, openEmp: openEmp, search: search, sub: sub, addLine: addLine, delLine: delLine,
        docPicked: docPicked, docUpload: docUpload, docView: docView, docReplace: docReplace, docReplaceGo: docReplaceGo, docArchive: docArchive, docDelete: docDelete, closeModal: closeModal,
        newRun: newRun, nrFreq: nrFreq, createRun: createRun, openRun: openRun, step: step, delRun: delRun, addEmpToRun: addEmpToRun, addEmpGo: addEmpGo, payForm: payForm, payGo: payGo, adjustForm: adjustForm, adjustPick: adjustPick, adjustGo: adjustGo,
