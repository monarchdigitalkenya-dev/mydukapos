<!-- DEVICES (zip 120, pairing REMOVED in zip 194) -------------------------------------------------
         Pairing is NOT required any more: every device that has the shop link can sync. Nothing here ever blocks or interrupts a sale or a sync.
           - Every call to the shop's server (and the live WebSocket) carries this device's id (X-Device-Id) so the shop's device list can show it;
             a stored token, if an older release made one, is still sent (harmless).
           - There is NO 'Pair this device' screen and no 'keep working offline' prompt. If an OLD server deployment still answers
             401 device_not_paired, that is treated as a transient condition: ignored by the connectivity state machine, and this device
             quietly registers itself in the background (at most once every 10 minutes) so the next poll goes through.
           - Settings keeps a "Devices & Security" section: sync-to-this-device, and an informational list of the shop's devices.
         Self-contained on purpose (same code in every app). -->
    <script>
    (function () {
        'use strict';
        if (window.__deviceSecurityInit) return;
        window.__deviceSecurityInit = true;
        window.__APP_RELEASE = 'zip-216';           // bump each release: shown per device in Settings and the Owner Console

        var LS = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private mode */ } return null; };
        function deviceId() {
            var id = LS('pos_device_id');
            if (!id) { id = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); LS('pos_device_id', id); }
            return id;
        }
        function token() { return LS('pos_device_token') || ''; }
        function isApi(url) {
            try { var u = new URL(url, location.href); return u.origin === location.origin && u.pathname.indexOf('/api/') !== -1; } catch (e) { return false; }
        }
        function apiPath(p) { return typeof apiUrl === 'function' ? apiUrl(p) : p; }
        async function sha256(text) {
            if (typeof hashPassword === 'function') return hashPassword(text);
            var d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(d)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

        /* ---- every API call carries the device's credentials ---- */
        var realFetch = window.fetch;
        if (typeof realFetch === 'function' && !realFetch.__deviceWrapped) {
            var wrapped = function (input, init) {
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                if (!isApi(url)) return realFetch.apply(this, arguments);
                init = init || {};
                var headers = new Headers(init.headers || (typeof input !== 'string' && input.headers) || {});
                headers.set('X-Device-Id', deviceId());
                if (token()) headers.set('X-Device-Token', token());
                var args = typeof input === 'string' ? [input, Object.assign({}, init, { headers: headers })] : [new Request(input, Object.assign({}, init, { headers: headers }))];
                return realFetch.apply(this, args).then(function (res) {
                    // zip 143: remember how the last API call failed, so a message can say what really happened (see netErrText)
                    try { if (res && !res.ok) window.__apiLastFail = { kind: 'http', status: res.status, at: Date.now(), challenge: String(res.headers.get('cf-mitigated') || '').toLowerCase() === 'challenge' }; } catch (e) { /* cosmetic */ }
                    // zip 147: Cloudflare's security check answered instead of the POS server — that is not "refused" nor "offline"
                    try { if (res && window.__apiLastFail && window.__apiLastFail.challenge && window.__apiLastFail.at === Date.now() && window.PosNet) window.PosNet.report('challenge', 'Cloudflare security check (' + res.status + ')'); } catch (e) { /* cosmetic */ }
                    // zip 186: any answer from our own API is evidence about the connection (see PosNet.seen): a 2xx brings an "offline" /
                    // "server not answering" device back online at once; a refusal at least proves the internet works. Not for the security check.
                    try { if (res && window.PosNet && window.PosNet.seen && !(window.__apiLastFail && window.__apiLastFail.challenge && window.__apiLastFail.at === Date.now())) window.PosNet.seen(res.status, res.headers.get('content-type')); } catch (e) { /* cosmetic */ }
                    if (res && res.status === 401) {
                        // zip 194: an old server deployment may still say "not paired": never shown to the user, never blocks - register quietly and carry on
                        res.clone().json().then(function (b) { if (b && b.code === 'device_not_paired') quietRegister(); }).catch(function () {});
                    }
                    return res;
                }, function (err) {
                    try { window.__apiLastFail = { kind: err && err.name === 'AbortError' ? 'timeout' : 'network', at: Date.now() }; } catch (e) { /* cosmetic */ }
                    throw err;
                });
            };
            wrapped.__deviceWrapped = true;
            window.fetch = wrapped;
        }
        var RealWS = window.WebSocket;
        if (typeof RealWS === 'function' && !RealWS.__deviceWrapped) {
            var WS = function (url, protocols) {
                try {
                    if (String(url).indexOf('/api/sync-ws') !== -1) {
                        var u = new URL(url, location.href);
                        u.searchParams.set('di', deviceId());
                        if (token()) u.searchParams.set('dt', token());
                        url = u.toString();
                    }
                } catch (e) { /* leave the url alone */ }
                return protocols === undefined ? new RealWS(url) : new RealWS(url, protocols);
            };
            WS.prototype = RealWS.prototype;
            ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { WS[k] = RealWS[k]; });
            WS.__deviceWrapped = true;
            window.WebSocket = WS;
        }

        /* ---- quiet registration (old servers only) ---- */
        // Registers this device in the shop's device list with the password hash it already holds. Never shows anything, never throws.
        async function register(body) {
            var res = await fetch(apiPath('/api/device-pair'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ action: 'pair', deviceId: deviceId(), name: LS('pos_device_name') || '' }, body)) });
            var out = {};
            try { out = await res.json(); } catch (e) { /* no body */ }
            if (res.ok && out.token) { LS('pos_device_token', out.token); LS('pos_device_token_at', String(Date.now())); return { ok: true }; }
            return { ok: false };
        }
        var quietBusy = null, quietAt = 0;
        async function quietRegister() {
            if (quietBusy) return quietBusy;
            if (Date.now() - quietAt < 10 * 60000) return;                 // at most once every 10 minutes
            if (window.posNetOffline && window.posNetOffline()) return;
            var h = LS('pos_pw_hash') || LS('aqua_pw_hash');
            if (!h) return;
            quietAt = Date.now();
            quietBusy = (async function () { try { await register({ proof: h }); } catch (e) { /* tried again later */ } finally { quietBusy = null; } })();
            return quietBusy;
        }
        window.devicePairNow = quietRegister;                              // kept so older callers do not break
        // When this device first ran this release line (zip-121+): salted hashes wait a few days so older tills catch up (hashSealGateCheck).
        if (!LS('pos_release_since')) LS('pos_release_since', String(Date.now()));
        // Tap the sync dot = send and fetch now (zip 123). Sending again after a failure is automatic anyway (see trackPush); this is
        // for someone who wants it this second.
        document.addEventListener('click', function (ev) {
            var dot = ev.target && ev.target.closest && ev.target.closest('#sync-status');
            if (!dot || typeof syncRetryNow !== 'function') return;
            try { if (window.PosNet) window.PosNet.check('tap on the dot'); } catch (e) { /* optional */ }
            syncRetryNow();
            try { if (typeof showToast === 'function' && dot.dataset.state !== 'synced') showToast(window.PosNet ? window.PosNet.message() : 'Syncing now…'); } catch (e) { /* cosmetic */ }
        });
        // Opening Daily Sales starts on today, unfiltered (zip 124 — see dailySalesOpenOnToday). Capture phase: before the tab's own code.
        document.addEventListener('click', function (ev) {
            var t = ev.target && ev.target.closest && ev.target.closest('[data-tab="daily-sales-tab"]');
            if (t && typeof dailySalesOpenOnToday === 'function') dailySalesOpenOnToday();
        }, true);
        (function styleDot() { var d = document.getElementById('sync-status'); if (d) { d.style.cursor = 'pointer'; if (!d.getAttribute('role')) d.setAttribute('role', 'button'); } else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', styleDot); })();
        function seal() { try { if (typeof sealStoredHashes === 'function') sealStoredHashes(); } catch (e) { /* next tick */ } }
        setTimeout(seal, 5000);
        setInterval(seal, 2 * 60000);

        // zip 194: there is no pairing screen any more. Kept as a harmless no-op so nothing that still calls it can break.
        window.showDevicePairScreen = function () { /* pairing is not required */ };

        /* ---- Settings ▸ Devices & Security (informational) ---- */
        function ago(t) {
            if (!t) return '—';
            var m = Math.round((Date.now() - t) / 60000);
            return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago';
        }
        async function post(body) {
            var res = await fetch(apiPath('/api/device-pair'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            var out = {}; try { out = await res.json(); } catch (e) { /* none */ }
            if (!res.ok) throw new Error(out.error || ('The server answered ' + res.status));
            return out;
        }
        // "Sync to this device" (zip 127) and the technical sync record — shown whatever the connection.
        function syncBoxHtml() {
            var pend = typeof window.salesJournalPendingCount === 'function' ? window.salesJournalPendingCount() : 0;
            var diag = [];
            try { diag = JSON.parse(LS('pos_sync_journal_v1') || '[]').slice(0, 30); } catch (e) { diag = []; }
            return '<div id="ds-sync-box" style="margin:0 0 12px; padding:10px 12px; border:1px solid #aed6f1; background:#f4f9fd; border-radius:8px;">'
                + '<strong>⬇️ Sync to this device</strong>'
                + '<p class="settings-hint" style="margin:4px 0 8px;">Sends this device\'s unsent sales and changes first, then fetches everything this shop has on the server. Nothing on this device is deleted or duplicated; newer changes made here are kept.</p>'
                + (pend ? '<p style="margin:0 0 8px; font-size:13px; color:#b9770e;">⏳ ' + pend + ' sale' + (pend === 1 ? '' : 's') + ' on this device ' + (pend === 1 ? 'is' : 'are') + ' waiting to be sent (retried automatically).</p>' : '')
                + '<button type="button" class="settings-small-btn" data-ds="syncdown" style="background:#2980b9; color:#fff; font-weight:700;">⬇️ Sync to this device</button>'
                + '<ol id="ds-sync-steps" style="margin:8px 0 0; padding-left:20px; font-size:13px; line-height:1.5;"></ol>'
                + '<details style="margin-top:8px;"><summary style="cursor:pointer; font-size:12px; color:#7f8c8d;">Sync diagnostics (technical — failed sends and retries are listed here, not in the Audit)</summary>'
                + (diag.length ? '<ul style="margin:6px 0 0; padding-left:18px; font-size:12px; color:#566573;">' + diag.map(function (e) { return '<li>' + esc(new Date(e.at).toLocaleString('en-GB')) + ' — ' + esc(e.kind) + ': ' + esc(e.detail) + '</li>'; }).join('') + '</ul>' : '<p class="settings-hint">Nothing recorded.</p>')
                + '</details></div>';
        }
        async function runSyncDown(btn) {
            if (typeof window.syncToThisDevice !== 'function') return;
            var list = document.getElementById('ds-sync-steps');
            var labels = ['Check the connection', 'Send this device\'s unsent sales', 'Fetch the shop from the server', 'Fetch older history', 'Check today with the server'];
            var icons = { run: '⏳', ok: '✅', bad: '⛔', warn: '⚠️' };
            if (list) list.innerHTML = labels.map(function (l, i) { return '<li id="ds-step-' + i + '" style="color:#95a5a6;">' + esc(l) + '</li>'; }).join('');
            if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
            var r = await window.syncToThisDevice(function (i, state, text) {
                var li = document.getElementById('ds-step-' + i);
                if (li) { li.style.color = state === 'bad' ? '#c0392b' : state === 'warn' ? '#b9770e' : state === 'run' ? '#2c3e50' : '#1e8449'; li.textContent = (icons[state] || '') + ' ' + labels[i] + ' — ' + text; }
            });
            if (btn) { btn.disabled = false; btn.textContent = '⬇️ Sync to this device'; }
            if (list) {
                var done = document.createElement('li');
                done.style.cssText = 'list-style:none; margin-left:-20px; margin-top:4px; font-weight:700; color:' + (r.ok ? '#1e8449' : '#c0392b');
                done.textContent = r.ok ? '✓ This device is up to date. ' + (r.summary || '') : '✗ Not finished: ' + r.error + (/offline/i.test(r.error) ? '' : ' It tries again by itself in 30 seconds.');
                list.appendChild(done);
            }
        }
        async function renderPanel() {
            var box = document.getElementById('device-security-body');
            if (!box) return;
            if (window.posNetOffline && window.posNetOffline()) { box.innerHTML = syncBoxHtml() + '<p class="settings-hint">Offline — the device list needs a connection. This device keeps working normally.</p>'; return; }
            var data;
            try { var res = await fetch(apiPath('/api/device-pair')); data = await res.json(); } catch (e) { box.innerHTML = syncBoxHtml() + '<p class="settings-hint">Could not reach the server — try again when online.</p>'; return; }
            var html = syncBoxHtml() + (data.serverWarning === 'db_outdated' ? '<div style="background:#fdecea; color:#922b21; border:1px solid #e6b0aa; border-radius:8px; padding:10px; margin:0 0 10px; font-size:14px;">⚠️ <strong>This shop\'s server needs an update.</strong> Till numbers, the device list and some stock protections are off until it is updated. Please tell MyDukaPOS support ("the shop database needs deploy:router"). Selling and syncing still work.</div>' : '')
                + '<p style="margin:0 0 8px;">This device: <strong>' + esc(LS('pos_device_name') || deviceId()) + '</strong>'
                + (typeof tillNumber === 'function' && tillNumber() ? ' · till ' + tillNumber() : '') + ' · release ' + esc(window.__APP_RELEASE) + '</p>'
                + '<p class="settings-hint" id="ds-no-pairing" style="margin:0 0 8px;">Pairing is no longer needed - every device with the shop link can sync.</p>'
                + '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">'
                + '<button type="button" class="settings-small-btn" data-ds="rename">✏️ Name this device</button>'
                + '<button type="button" class="settings-small-btn" data-ds="refresh">↻ Refresh</button></div><div id="device-security-msg" class="settings-hint" style="margin:0 0 8px;"></div>';
            if (data.devices && data.devices.length) {
                html += '<div class="table-scroll"><table><thead><tr><th>Device</th><th>Till</th><th>App release</th><th>Last sync</th></tr></thead><tbody>'
                    + data.devices.filter(function (d) { return !d.revoked; }).map(function (d) {
                        return '<tr><td>' + esc(d.name || d.id) + (d.me ? ' <em>(this one)</em>' : '') + '</td><td>' + (d.till || '—') + '</td><td>' + esc(d.version || '—')
                            + (d.version && d.version !== window.__APP_RELEASE ? ' <span title="Older than this device — it updates when reopened" style="color:#e67e22;">⚠</span>' : '') + '</td><td>' + ago(d.lastSeen) + '</td></tr>';
                    }).join('') + '</tbody></table></div>';
            }
            box.innerHTML = html;
        }
        async function onPanelClick(ev) {
            var b = ev.target.closest('[data-ds]');
            if (!b) return;
            var msg = document.getElementById('device-security-msg');
            var say = function (t, bad) { if (msg) { msg.textContent = t; msg.style.color = bad ? '#c0392b' : ''; } };
            try {
                var what = b.getAttribute('data-ds');
                if (what === 'refresh') return renderPanel();
                if (what === 'syncdown') return runSyncDown(b);
                if (what === 'rename') { var n = window.prompt('Name for this device (e.g. "Till 1 — front counter"):', LS('pos_device_name') || ''); if (n === null) return; LS('pos_device_name', n.trim()); await post({ action: 'rename', name: n.trim() }); return renderPanel(); }
            } catch (e) { say(e.message || String(e), true); }
        }
        // Its own Settings section (zip 125) — a "🔐 Devices & Security" button next to "Security & Access", opening a section of its
        // own, instead of a panel stuck under whichever other section happened to be open.
        function injectPanel() {
            var tab = document.getElementById('settings-tab');
            if (!tab || document.getElementById('settings-section-devices')) return;
            var subnav = document.getElementById('settings-subnav');
            var sec = document.createElement('div');
            sec.id = 'settings-section-devices';
            sec.innerHTML = '<h4>🔐 Devices &amp; Security</h4><p class="settings-hint" style="margin-top:-4px;">The devices of this shop, and a button to bring this device up to date. Signing in and selling always work offline. Pairing is no longer needed - every device with the shop link can sync.</p><div id="device-security-body"><p class="settings-hint">Loading…</p></div>';
            if (subnav && typeof showSettingsSection === 'function') {
                sec.className = 'settings-section-content';
                var btn = document.createElement('button');
                btn.type = 'button'; btn.className = 'settings-subtab-btn'; btn.setAttribute('data-section', 'settings-section-devices');
                btn.textContent = '🔐 Devices & Security';
                btn.addEventListener('click', function () { showSettingsSection('settings-section-devices', btn); if (sec.classList.contains('active')) renderPanel(); });
                var after = subnav.querySelector('[data-section="settings-section-security"]');
                if (after && after.nextSibling) subnav.insertBefore(btn, after.nextSibling); else subnav.appendChild(btn);
                var secAfter = document.getElementById('settings-section-security');
                if (secAfter && secAfter.parentNode) secAfter.parentNode.insertBefore(sec, secAfter.nextSibling); else subnav.parentNode.appendChild(sec);
            } else {
                sec.className = 'panel';                    // a layout without sections: a panel at the end, as before
                (tab.querySelector('.settings-content') || tab).appendChild(sec);
            }
            sec.addEventListener('click', onPanelClick);
        }
        window.renderDeviceSecurityPanel = function () { injectPanel(); return renderPanel(); };
        function boot() {
            injectPanel();
            document.addEventListener('click', function (ev) {
                var t = ev.target.closest && ev.target.closest('[data-tab="settings-tab"]');
                if (t) setTimeout(function () { injectPanel(); var sec = document.getElementById('settings-section-devices'); if (sec && (sec.classList.contains('active') || sec.className === 'panel')) renderPanel(); }, 80);
            }, true);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
