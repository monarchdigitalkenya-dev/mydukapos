<script>
/* ===================================================================================================================
   SVC CATALOG (B3-C): the central Service Catalog (name, category, description, standard price, duration, inventory items consumed with default
   quantities, required staff type, active / inactive), price resolution per asset type (the catalog price is only the starting point: the job line
   keeps its own editable price), seeds, import of the inventory 'service' items, the Settings page and the Service picker for the job form.
   Records live in the synced list svcCatalog (merged per record by id) and are only ever written through svcCommit.
   =================================================================================================================== */
var SVC_CAT_MODES = ['fixed', 'from', 'variable'];
var SVC_CAT_ASSET_FIELDS = ['veh_type', 'dev_type', 'eq_type', 'tl_item'];
var SVC_CAT_UI = { q: '', cat: '', scope: 'type', archived: false, mount: null, editor: null };

/* ===== tiny private helpers ===== */
function svcCatNow() { try { return typeof svcNow === 'function' ? svcNow() : Date.now(); } catch (e) { return Date.now(); } }
function svcCatEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function svcCatNum(v) { var n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function svcCatR2(n) { n = svcCatNum(n); return Math.round((n + (n < 0 ? -1 : 1) * 1e-9) * 100) / 100; }
function svcCatQty(n) {                                 /* stock-style quantity: 3 decimals (0.001 is the smallest unit the inventory handles), finer figures cleaned to 6 */
  try { if (typeof stockRound3 === 'function') return stockRound3(n); } catch (e) { /* fall through */ }
  var x = svcCatNum(n), r3 = Math.round(x * 1000) / 1000;
  return Math.abs(x - r3) < 1e-6 ? r3 : Math.round(x * 1e6) / 1e6;
}
function svcCatClone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
function svcCatCan(perm) { try { return typeof svcCan === 'function' ? !!svcCan(perm) : true; } catch (e) { return true; } }
function svcCatActor() { try { if (typeof svcActor === 'function') { var a = svcActor(); if (a && a.name) return a; } } catch (e) { /* owner */ } return { id: 'owner', name: 'Owner' }; }
function svcCatToast(msg, isErr) { try { if (typeof showToast === 'function') showToast(String(msg), !!isErr); } catch (e) { /* toast is cosmetic */ } }
function svcCatMoney(n) { try { if (typeof svcFormatMoney === 'function') return svcFormatMoney(n); } catch (e) { /* fall through */ } return 'KSh ' + svcCatR2(n); }
function svcCatRows() { try { return Array.isArray(svcCatalog) ? svcCatalog : []; } catch (e) { return []; } }          /* TDZ-safe read of the store's list */
function svcCatInv() { try { return typeof inventory !== 'undefined' && Array.isArray(inventory) ? inventory : []; } catch (e) { return []; } }
function svcCatTypeValid(k) { try { return typeof SVC_TYPES === 'object' && !!SVC_TYPES && Object.prototype.hasOwnProperty.call(SVC_TYPES, k); } catch (e) { return false; } }
function svcCatBizType() { try { return typeof svcBusinessType === 'function' ? svcBusinessType() : 'other'; } catch (e) { return 'other'; } }
function svcCatTpl(type) { try { return typeof svcGetTemplate === 'function' ? svcGetTemplate(type) : null; } catch (e) { return null; } }
function svcCatStr(v, max) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, max || 200); }
function svcCatSlug(v) { try { if (typeof svcSlug === 'function') return svcSlug(v); } catch (e) { /* fall through */ } return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40); }

/* inventory helpers shared with the consumption rows (name <-> code) */
function svcCatInvItem(code, name) {
  var inv = svcCatInv(), i, p, nm = String(name == null ? '' : name).trim().toLowerCase();
  if (code != null && String(code) !== '') {
    for (i = 0; i < inv.length; i++) { p = inv[i]; if (p && !p._deleted && String(p.code) === String(code)) return p; }
  }
  if (nm) {
    var hit = null, n = 0;
    for (i = 0; i < inv.length; i++) { p = inv[i]; if (p && !p._deleted && p.type !== 'service' && String(p.name || '').trim().toLowerCase() === nm) { hit = p; n++; } }
    if (n === 1) return hit;                                   /* only an UNIQUE name match is trusted */
  }
  return null;
}

/* ===== normalisation (pure) ===== */
function svcCatNormConsumption(list, errors) {
  var out = [], i, r, code, name, qty;
  (Array.isArray(list) ? list : []).forEach(function (raw, idx) {
    r = raw || {}; code = svcCatStr(r.code, 60); name = svcCatStr(r.name, 80);
    if (!code && !name) return;
    qty = svcCatQty(r.qty == null || r.qty === '' ? 0 : r.qty);
    if (!(qty > 0)) { if (errors) errors.push({ id: 'consumption', msg: 'Enter a quantity above 0 for ' + (name || code) + '.' }); return; }
    out.push({ code: code, name: name, unit: svcCatStr(r.unit, 12), qty: qty });
  });
  for (i = 0; i < out.length; i++) { if (!out[i].name && out[i].code) { var it = svcCatInvItem(out[i].code, ''); if (it) out[i].name = svcCatStr(it.name, 80); } }
  return out;
}
/* svcCatalogNormalize(raw) -> {ok, rec, errors[]}: a sanitised catalog record body (no id / audit fields) */
function svcCatalogNormalize(raw) {
  raw = raw || {};
  var errors = [], out = {}, k;
  out.name = svcCatStr(raw.name, 80);
  if (!out.name) errors.push({ id: 'name', msg: 'Enter a service name.' });
  out.category = svcCatStr(raw.category, 40);
  out.description = svcCatStr(raw.description, 300);
  var price = raw.price === '' || raw.price == null ? 0 : svcCatNum(raw.price);
  if (price < 0) errors.push({ id: 'price', msg: 'The price cannot be negative.' });
  out.price = svcCatR2(Math.max(0, price));
  out.priceMode = SVC_CAT_MODES.indexOf(raw.priceMode) !== -1 ? raw.priceMode : 'fixed';
  var pba = null;
  if (raw.priceByAssetType && typeof raw.priceByAssetType === 'object') {
    for (k in raw.priceByAssetType) {
      if (!Object.prototype.hasOwnProperty.call(raw.priceByAssetType, k)) continue;
      var v = raw.priceByAssetType[k], key = svcCatSlug(k);
      if (!key || v === '' || v == null) continue;
      var pv = svcCatNum(v);
      if (pv < 0) { errors.push({ id: 'price', msg: 'Prices cannot be negative.' }); continue; }
      (pba = pba || {})[key] = svcCatR2(pv);
    }
  }
  out.priceByAssetType = pba;
  var dur = raw.durationMin === '' || raw.durationMin == null ? 0 : Math.round(svcCatNum(raw.durationMin));
  if (dur < 0 || dur > 10080) errors.push({ id: 'durationMin', msg: 'Enter the duration in minutes (0 to 10080).' });
  out.durationMin = Math.max(0, Math.min(10080, dur));
  out.staffRole = svcCatSlug(raw.staffRole);
  var types = [];
  (Array.isArray(raw.serviceTypes) ? raw.serviceTypes : []).forEach(function (t) { if (svcCatTypeValid(t) && types.indexOf(t) === -1) types.push(t); });
  out.serviceTypes = types;                                   /* [] = offered in every business type */
  out.consumption = svcCatNormConsumption(raw.consumption, errors);
  out.autoConsume = raw.autoConsume === true;
  out.invCode = svcCatStr(raw.invCode, 60);
  out.active = raw.active !== false;
  if (raw.sort != null && raw.sort !== '' && isFinite(Number(raw.sort))) out.sort = Number(raw.sort);
  return { ok: errors.length === 0, rec: out, errors: errors };
}

/* ===== read side ===== */
function svcCatOffered(r, type) { var t = r && r.serviceTypes; return !type || !Array.isArray(t) || !t.length || t.indexOf(type) !== -1; }
function svcCatIsArchived(r) { return !!r && r.active === false; }
function svcCatSortFn(a, b) { return ((Number(a.sort) || 0) - (Number(b.sort) || 0)) || String(a.name || '').localeCompare(String(b.name || '')); }
/* svcCatalogList({type, category, q, includeInactive, archived, sort}) -> records (copies: never mutate). Default: active entries only. */
function svcCatalogList(opts) {
  opts = opts || {};
  var q = String(opts.q == null ? '' : opts.q).trim().toLowerCase();
  var arr = svcCatRows().filter(function (r) {
    if (!r || r._deleted) return false;
    if (opts.archived === true) { if (!svcCatIsArchived(r)) return false; }
    else if (!opts.includeInactive && svcCatIsArchived(r)) return false;
    if (opts.type && !svcCatOffered(r, opts.type)) return false;
    if (opts.category && String(r.category || '') !== String(opts.category)) return false;
    if (q && (String(r.name || '') + ' ' + String(r.category || '') + ' ' + String(r.description || '')).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  arr.sort(svcCatSortFn);
  return arr.map(svcCatClone);
}
function svcCatalogGet(id, opts) {
  var rows = svcCatRows(), i; id = String(id == null ? '' : id);
  for (i = 0; i < rows.length; i++) { if (rows[i] && String(rows[i].id) === id && (!rows[i]._deleted || (opts && opts.includeDeleted))) return svcCatClone(rows[i]); }
  return null;
}
function svcCatalogCategories(type) {
  var seen = {}, out = [], tpl = type ? svcCatTpl(type) : null;
  ((tpl && tpl.catalog && tpl.catalog.categories) || []).forEach(function (c) { if (c && !seen[c]) { seen[c] = 1; out.push(c); } });
  svcCatRows().forEach(function (r) { if (r && !r._deleted && r.category && !seen[r.category]) { seen[r.category] = 1; out.push(r.category); } });
  return out;
}

/* ===== price resolution (pure): the catalog price is the STARTING point; a job line keeps its own (overridable) price ===== */
function svcCatalogAssetType(valuesOrAsset) {
  var v = valuesOrAsset, i, x;
  if (v == null) return '';
  if (typeof v === 'string') return svcCatSlug(v);
  if (typeof v !== 'object') return '';
  for (i = 0; i < SVC_CAT_ASSET_FIELDS.length; i++) { x = v[SVC_CAT_ASSET_FIELDS[i]]; if (x != null && x !== '') return svcCatSlug(x); }
  x = v.type || (v.attrs && v.attrs.type) || (v.assetSnap && v.assetSnap.type) || (v.asset && v.asset.attrs && v.asset.attrs.type) || '';
  return svcCatSlug(x);
}
function svcPriceInfo(service, asset) {
  if (!service) return { price: 0, basePrice: 0, byAsset: false, mode: 'fixed', key: '' };
  var base = svcCatR2(service.price != null ? service.price : (service.basePrice != null ? service.basePrice : 0));
  var key = svcCatalogAssetType(asset), m = service.priceByAssetType, price = base, by = false;
  if (key && m && typeof m === 'object' && Object.prototype.hasOwnProperty.call(m, key) && m[key] !== '' && m[key] !== null && isFinite(Number(m[key]))) { price = svcCatR2(m[key]); by = true; }
  return { price: price, basePrice: base, byAsset: by, mode: service.priceMode || 'fixed', key: key };
}
function svcPriceFor(service, asset) { return svcPriceInfo(service, asset).price; }
function svcCatPriceText(r) {
  var p = svcCatMoney(r.price || 0);
  if (r.priceMode === 'variable') return 'Price on the day';
  return (r.priceMode === 'from' ? 'from ' : '') + p;
}

/* ===== write side ===== */
function svcCatOverlap(a, b) { return !a.length || !b.length || a.some(function (t) { return b.indexOf(t) !== -1; }); }
function svcCatDuplicate(n, selfId) {
  var nm = n.name.toLowerCase(), rows = svcCatRows(), i, r;
  for (i = 0; i < rows.length; i++) {
    r = rows[i];
    if (!r || r._deleted || String(r.id) === String(selfId) || String(r.name || '').trim().toLowerCase() !== nm) continue;
    if (svcCatOverlap(r.serviceTypes || [], n.serviceTypes || [])) return r;
  }
  return null;
}
function svcCatNextSort() { var m = 0; svcCatRows().forEach(function (r) { if (r && Number(r.sort) > m) m = Number(r.sort); }); return m + 10; }
/* internal writer: normalised body -> committed record. extra = {seed, importedFrom, createdBy} */
function svcCatWrite(id, body, extra, existing) {
  var actor = svcCatActor(), now = svcCatNow();
  if (typeof svcCommit !== 'function') return { ok: false, code: 'store', error: 'The store is not available.' };
  return svcCommit(function (rec) {
    var r = rec || { id: id, createdAt: now, createdBy: (extra && extra.createdBy) || actor.name };
    var k; for (k in body) { if (Object.prototype.hasOwnProperty.call(body, k)) r[k] = body[k]; }
    if (!isFinite(Number(r.sort))) r.sort = svcCatNextSort();
    if (extra) { for (k in extra) { if (k !== 'createdBy' && Object.prototype.hasOwnProperty.call(extra, k)) r[k] = extra[k]; } }
    if (r.active === false) { if (!r.archivedAt) { r.archivedAt = now; r.archivedBy = actor.name; } } else { delete r.archivedAt; delete r.archivedBy; }
    r.updatedBy = actor.name;
    return r;
  }, { list: 'svcCatalog', id: id, create: true, noAudit: true, event: 'config:changed', payload: { kind: 'catalog', id: id } });
}
/* svcCatalogUpsert(input, opts) -> {ok, rec, created, errors[]}. input.id updates (only the keys given change); no id creates. Needs svc:manageServices. */
function svcCatalogUpsert(input, opts) {
  opts = opts || {}; input = input || {};
  if (!opts.force && !svcCatCan('svc:manageServices')) return { ok: false, code: 'perm', errors: [{ id: '', msg: 'You are not allowed to manage services.' }] };
  var id = input.id ? String(input.id) : '', existing = id ? svcCatalogGet(id, { includeDeleted: true }) : null;
  if (existing && existing._deleted) return { ok: false, code: 'deleted', errors: [{ id: '', msg: 'That service was removed.' }] };
  var src = Object.assign({}, existing || {}, input);
  var n = svcCatalogNormalize(src);
  if (!n.ok) return { ok: false, code: 'invalid', errors: n.errors };
  if (!opts.allowDuplicate) {
    var dup = svcCatDuplicate(n.rec, existing ? existing.id : id);

function svcCatReadEditor(ed) {

function svcCatCloseEditor() {

}
function svcCatShowErrors(ed, errors) {

  var general = [];
  (errors || []).forEach(function (er) {
    var t = er.id ? ed.el.querySelector('[data-err="' + er.id + '"]') : null;
    if (t) t.textContent = (t.textContent ? t.textContent + ' ' : '') + er.msg; else general.push(er.msg);

  g.textContent = general.join(' '); g.hidden = !general.length;
  var first = ed.el.querySelector('.err:not(:empty)'); if (first && first.scrollIntoView) { try { first.scrollIntoView({ block: 'center' }); } catch (e) { /* jsdom */ } }
}
function svcCatOpenEditor(idOrNull) {

  var rec = existing || { name: '', category: '', description: '', price: 0, priceMode: 'fixed', priceByAssetType: null, durationMin: 0, staffRole: '', serviceTypes: [], consumption: [], autoConsume: false, active: true };
  var ed = { id: existing ? existing.id : (typeof svcId === 'function' ? svcId('sc-') : 'sc-' + Date.now().toString(36)), existing: existing, saving: false, returnFocus: document.activeElement };

function svcCatConsItemChanged(input) {

function svcCatSaveEditor(ed) {
  if (ed.saving) return;                                      /* double tap: the id is minted once per editor, so a repeat only updates the same record */

  if (!res.ok) { svcCatShowErrors(ed, res.errors); return; }

}
function svcCatArchiveEditor(ed) {
  if (!ed.existing) return;
  var restore = ed.existing.active === false;
  var ok = true; try { if (!restore && typeof confirm === 'function') ok = confirm('Archive "' + ed.existing.name + '"?\n\nIt stays on old jobs and can be restored any time.'); } catch (e) { ok = true; }

  if (r.durationMin) tags += '<span class="svcc-tag">' + svcCatEsc(r.durationMin) + ' min</span>';

  if (r.staffRole) tags += '<span class="svcc-tag">' + svcCatEsc(String(r.staffRole).replace(/_/g, ' ')) + '</span>';

  if (r.active === false) tags += '<span class="svcc-tag warn">archived</span>';
  if (r.autoConsume) tags += '<span class="svcc-tag">auto-deduct</span>';

}
function svcCatRefreshPage() { if (SVC_CAT_UI.mount && SVC_CAT_UI.mount.isConnected !== false) svcCatalogRenderPage(SVC_CAT_UI.mount); }

    '<div class="svcc-bar">' + (canEdit ? '<button type="button" class="svcc-btn primary" data-act="add">+ Add service</button>' : '') +
    (importable ? '<button type="button" class="svcc-btn" data-act="import">Import ' + importable + ' from inventory</button>' : '') +
    (canSeed ? '<button type="button" class="svcc-btn" data-act="seed">Add starter ' + svcCatEsc(label) + ' services</button>' : '') + '</div>' +
    (!canEdit ? '<div class="svcc-note warn">Only people allowed to manage services can change the catalog.</div>' : '') +
    '<div class="svcc-filters"><input class="svcc-in" type="search" data-f="q" placeholder="Search services" aria-label="Search services" value="' + svcCatEsc(ui.q) + '">' +
    '<select class="svcc-in" data-f="cat" aria-label="Category"><option value="">All categories</option>' + cats.map(function (c) { return '<option value="' + svcCatEsc(c) + '"' + (ui.cat === c ? ' selected' : '') + '>' + svcCatEsc(c) + '</option>'; }).join('') + '</select>' +
    '<select class="svcc-in" data-f="scope" aria-label="Which business types"><option value="type"' + (ui.scope === 'type' ? ' selected' : '') + '>For ' + svcCatEsc(label) + '</option><option value="all"' + (ui.scope === 'all' ? ' selected' : '') + '>All business types</option></select>' +
