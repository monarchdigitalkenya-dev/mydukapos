<script id="hcat-js">
(function () {
    'use strict';
    if (window.__hcat) return; window.__hcat = true;
    function $(id) { return document.getElementById(id); }
    var CAT = {};
    try { CAT = JSON.parse(($('hcat-data') || {}).textContent || '{}'); } catch (e) { CAT = { m: [], s: [] }; }
    function pad(n) { return String(n).padStart(4, '0'); }
    function toast(m, bad) { try { showToast(m, !!bad); } catch (e) { /* none */ } }
    function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
    // Builds the item list. A medicine is stocked at quantity 0 with a selling price (the average) and a buying price of about 70% of it.
    // Codes are fixed (KM0001... / KS0001...), so loading twice - or on two devices - never creates duplicates.
    function build() {
        var items = [], now = Date.now();
        var consum = 'Consumables & Supplies';
        (CAT.m || []).forEach(function (r, i) {
            var cls = r[0], price = Number(r[3]) || 0;
            items.push({ type: 'item', code: 'KM' + pad(i + 1), name: r[1], price: price, wholesalePrice: Math.round(price * 0.7 * 100) / 100, minimumPrice: 0, adminFee: 0, qty: 0, unit: r[2] || 'pcs', location: '', category: cls, vatCategory: cls === consum ? 'A' : 'E', expiryDate: '', image: null, seeded: 'ke-2026', openingStock: { qty: 0, costPrice: Math.round(price * 0.7 * 100) / 100, date: '', setBy: 'Kenya starter catalogue' } });
        });
        (CAT.s || []).forEach(function (r, i) {
            items.push({ type: 'service', code: 'KS' + pad(i + 1), name: r[1], price: Number(r[2]) || 0, wholesalePrice: 0, minimumPrice: 0, unit: 'use', qty: null, location: '', category: r[0], vatCategory: 'E', image: null, seeded: 'ke-2026' });
        });
        return items;
    }
    function missing(items) {
        var have = {}, names = {};
        (typeof inventory !== 'undefined' ? inventory : []).forEach(function (p) { if (p) { have[p.code] = 1; names[(p.type === 'service' ? 's|' : 'i|') + norm(p.name)] = 1; } });
        var gone = {}; try { (JSON.parse(localStorage.getItem('pos_hcat_removed') || '[]') || []).forEach(function (c) { gone[c] = 1; }); } catch (e) { /* none */ }   // zip 363: starter items the hospital removed stay removed
        return items.filter(function (it) { return !have[it.code] && !gone[it.code] && !names[(it.type === 'service' ? 's|' : 'i|') + norm(it.name)]; });
    }
    function load(silent) {
        if (typeof inventory === 'undefined' || !Array.isArray(inventory)) return 0;
        var add = missing(build());
        if (!add.length) { if (!silent) toast('The Kenya starter catalogue is already loaded.'); return 0; }
        var d = new Date(); var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        add.forEach(function (it) { if (it.openingStock) it.openingStock.date = today; inventory.push(it); });
        try { safeSetItem('pos_inventory', JSON.stringify(inventory)); } catch (e) { toast('Storage is full - the catalogue could not be saved.', true); return 0; }
        try { localStorage.setItem('pos_hcat_done', '1'); localStorage.setItem('pos_hcat_ver', '368'); } catch (e2) { /* flag only */ }
        try { queuePush(); } catch (e3) { /* synced on the next change */ }
        ['renderInventoryTable', 'renderPharmacy', 'renderCounter'].forEach(function (fn) { try { if (typeof window[fn] === 'function') window[fn](); } catch (e4) { /* not on screen */ } });
        try { if (typeof renderInventoryTable === 'function') renderInventoryTable(); } catch (e5) { /* ignore */ }
        if (!silent) toast('Loaded ' + add.filter(function (x) { return x.type === 'item'; }).length + ' medicines and ' + add.filter(function (x) { return x.type === 'service'; }).length + ' services (quantities are 0).');
        return add.length;
    }
    window.hcatLoad = function () { return load(false); };
    window.hcatCounts = function () { return { medicines: (CAT.m || []).length, services: (CAT.s || []).length }; };

    // a button in the stock list so the catalogue can be (re)loaded at any time
    function addButton() {
        var host = $('inventory-list-tab'); if (!host || $('hcat-load-card')) return;
        var panel = host.querySelector('.panel') || host;
        var c = document.createElement('div'); c.id = 'hcat-load-card';
        c.style.cssText = 'border:1px solid var(--border,#dbe6e3);border-left:6px solid #1a66c4;border-radius:12px;padding:12px 16px;margin:0 0 14px;background:var(--tint-accent,#f1f8f6);display:flex;gap:12px;align-items:center;flex-wrap:wrap';
        var n = window.hcatCounts();
        c.innerHTML = '<div style="flex:1 1 260px"><b>🇰🇪 Kenya starter catalogue</b><div style="font-size:13px;color:var(--muted,#5d7378)">' + n.medicines + ' medicines &amp; supplies and ' + n.services + ' services, with average Kenyan prices. Quantities start at 0. Prices are averages - edit any of them.</div></div><button type="button" class="hrx-btn" style="border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:#1a66c4;color:#fff;cursor:pointer" id="hcat-load-btn">Load / refresh catalogue</button>';
        panel.insertBefore(c, panel.firstChild);
        $('hcat-load-btn').addEventListener('click', function () { load(false); });
    }
    // A brand-new system (empty stock list, never loaded) is filled automatically once the first sync has had time to bring in any existing stock.
    function auto() {
        try {
            if (localStorage.getItem('pos_hcat_done') === '1') {            // zip 366: a system that loaded the catalogue earlier gets the newly added items once (only codes it does not have; removed starter items stay removed; nothing is changed or repriced)
                if (localStorage.getItem('pos_hcat_ver') === '368') return;
                if (typeof inventory === 'undefined' || !Array.isArray(inventory)) return;
                var n = load(true); localStorage.setItem('pos_hcat_ver', '368');
                if (n) toast('Kenya catalogue topped up: ' + n + ' new medicines, supplies and services added (stock quantity 0). Your own items and prices were not touched.');
                return;
            }
            if (typeof inventory === 'undefined' || !Array.isArray(inventory) || inventory.some(function (i) { return i && String(i.code).indexOf('HM-') !== 0; })) return;   // the meal / nursing charges (HM-) do not count as stock
            load(true);
            toast('Kenya starter catalogue loaded: medicines and services with average prices (stock quantity 0).');
        } catch (e) { /* manual button remains */ }
    }
    setTimeout(addButton, 1200); setTimeout(addButton, 4000);
    setTimeout(auto, 9000);
})();
</script>
