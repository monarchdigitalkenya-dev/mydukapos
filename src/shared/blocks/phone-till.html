<!-- PHONE TILL ----------------------------------------------------------------
         zip 190. The Sales Counter on a PHONE (Chrome, ~390 px wide) without the scrolling. Everything below is phone-only (max-width 700 px) except the new
         Settings card; a tablet / computer is drawn exactly as before.
           1. CART LINES    - every line of the cart is one tidy card: the item name on its own line, then  [- qty +]  unit price  line total  [x]  - nothing is cut
                              off, nothing scrolls sideways (320 px wide works too). The cart's own buttons / boxes / onclick handlers are untouched: only CSS.
           2. CART SHEET    - the floating cart button (and a new "N items - KES total - View cart" bar at the bottom of the Sales Counter) opens the whole cart
                              panel as a full-screen sheet: order type, table / room, items, customer phone, payment buttons, total and Confirm. Total + Confirm
                              stay pinned at the bottom of the sheet. The sheet closes by itself when the sale is done / the cart is empty / another tab opens.
           3. HIDE OPTIONS  - Settings > Payment Methods > "Phone & till layout": show the customer phone box, show the Walk-In / Delivery choice, show the Table / Room
                              + Tabs row (shop settings: they travel with the payment methods through the same settings sync) and, on THIS phone only, which main tabs
                              show (the others wait in "More") and the search style.
           4. SEARCH STYLE  - "bar" (default): the search box is the panel header (no "Product Search" title; Bills / Sales shrink to icons beside it).
                              "icon": a compact magnifier in the header row opens the search box over it.
           5. PRODUCT AREA  - category chips are ONE sideways-scrolling row, the hint line is gone, 2 big photo tiles per row.
         Hooks (all wrapped, none replaced): scrollToCart, updateMobileCartFab, setOrderType, collapseTabsIfNeeded, posApplyPayMethods, extraSettingsCollect/Apply.
         Nothing here is needed for a sale: every entry point is guarded, a missing element only means that one feature is skipped (water has no product search box,
         production's cart card has another id, ...). Classes use the ptl- prefix. -->
    <style id="phone-till-css">
        /* ---- settings that apply on EVERY screen (a hidden box is hidden on a computer too) ---- */
        html.ptl-no-phone .ptl-phone-group { display: none !important; }
        html.ptl-no-phone:has(#pay-bill-btn.active) .ptl-phone-group { display: block !important; }   /* Pay Later saves the bill against this phone number: keep it while Bill is chosen */
        html.ptl-no-delivery #order-type-toggle, html.ptl-no-delivery #delivery-details-group { display: none !important; }
        /* zip 191: hiding the Table / Room picker keeps a 🧾 Tabs button (open / settle tabs) if the row has one; a row with no button goes entirely */
        html.ptl-no-loc .ptl-loc-group > label, html.ptl-no-loc .ptl-loc-group select { display: none !important; }
        html.ptl-no-loc .ptl-loc-group:not(:has(button)) { display: none !important; }
        /* new things that only exist on a phone */
        .ptl-bar, .ptl-back, .ptl-search-btn, .ptl-search-x { display: none; }

        /* ---- the new Settings card (same look as the payment methods card) ---- */
        #pos-phonetill-panel .ptl-sub { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #7f8c8d; margin: 14px 0 2px; }
        #pos-phonetill-panel .ptl-note { font-size: 12.5px; color: #7f8c8d; margin: 0 0 6px; line-height: 1.4; }
        #pos-phonetill-panel .ptl-sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 4px 0; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--border-color, #eef0f2); }
        #pos-phonetill-panel .ptl-sw > span { flex: 1 1 auto; min-width: 0; line-height: 1.3; }
        #pos-phonetill-panel .ptl-sw small { display: block; font-size: 12px; color: #7f8c8d; }
        #pos-phonetill-panel .ptl-sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        #pos-phonetill-panel .ptl-sw i { position: relative; flex: 0 0 auto; width: 48px; height: 28px; border-radius: 999px; background: #b9c2ca; transition: background .15s; }
        #pos-phonetill-panel .ptl-sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .15s; }
        #pos-phonetill-panel .ptl-sw input:checked + i { background: var(--success, #27ae60); }

        #pos-phonetill-panel .ptl-sw input:disabled + i { opacity: .55; }
        #pos-phonetill-panel .ptl-seg { display: flex; gap: 8px; margin: 6px 0 4px; flex-wrap: wrap; }
        #pos-phonetill-panel .ptl-seg label { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 12px; border: 1.5px solid var(--border-color, #dfe4ea); border-radius: 12px; cursor: pointer; font-size: 15px; background: var(--bg-surface, #fff); }
        #pos-phonetill-panel .ptl-seg input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent, #2980b9); }
        #pos-phonetill-panel .ptl-seg label:has(input:checked) { border-color: var(--accent, #2980b9); background: var(--bg-surface-alt, #eef4fa); font-weight: 700; }
        #pos-phonetill-panel .ptl-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 12px; }
        #pos-phonetill-panel .ptl-tabs label { display: flex; align-items: center; gap: 10px; min-height: 46px; font-size: 14.5px; cursor: pointer; }
        #pos-phonetill-panel .ptl-tabs input { width: 22px; height: 22px; margin: 0; flex: 0 0 auto; accent-color: var(--accent, #2980b9); }
        #pos-phonetill-panel .ptl-tabs label.ptl-locked { opacity: .6; cursor: default; }

        @media (max-width: 700px) {

            .ptl-cart .table-scroll { overflow: visible !important; }
            #cart-table, #cart-table tbody { display: block !important; width: 100% !important; min-width: 0 !important; max-width: 100% !important; border: 0 !important; }
            #cart-table thead { display: none !important; }
            #cart-table tbody tr { display: flex !important; flex-wrap: wrap; align-items: center; gap: 6px 8px; width: 100% !important; box-sizing: border-box; margin: 0 !important; padding: 10px 2px !important; border: 0 !important; border-bottom: 1px solid var(--border-color, #e5e8eb) !important; background: transparent; }
            #cart-table tbody tr:hover { background: transparent; }
            #cart-table tbody tr td { display: block !important; min-width: 0; width: auto !important; max-width: 100%; box-sizing: border-box; padding: 0 !important; border: 0 !important; text-align: left; white-space: normal; }
            /* line 1: the name (wraps) and the remove button at the right edge; line 2: [- qty +]  unit price  line total (the pieces wrap onto a third line on a very narrow screen instead of being cut off) */
            #cart-table tbody tr td:nth-child(1) { order: 1; flex: 1 1 calc(100% - 50px); max-width: calc(100% - 50px); font-size: 15.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; padding-top: 2px !important; }
            #cart-table tbody tr td:nth-child(5) { order: 2; flex: 0 0 auto; }

            #sales-tab .ptl-cart:not(.ptl-open) { display: none !important; }
            html.ptl-sheet-open, html.ptl-sheet-open body { overflow: hidden !important; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open { display: flex !important; flex-flow: row wrap; align-content: flex-start; position: fixed !important; inset: 0 !important; top: 0 !important; --ptl-dock-h: calc(66px + env(safe-area-inset-bottom, 0px)); width: auto !important; height: auto !important; max-height: none !important; margin: 0 !important; z-index: 9000; box-sizing: border-box; padding: 0 12px 0 !important; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--bg-surface, #fff); color: var(--dark, inherit); border-radius: 0 !important; box-shadow: none !important; border: 0 !important; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > * { flex: 0 0 100%; order: 10; max-width: 100%; min-width: 0; box-sizing: border-box; }

            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 { order: 0; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin: 0 -12px 8px !important; padding: 8px 12px calc(8px) !important; font-size: 0 !important; line-height: 1; background: var(--bg-surface, #fff); border-bottom: 1px solid var(--border-color, #e5e8eb) !important; }

            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 #pos-ck-count { display: none; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 .ptl-back .ptl-bk-n { font-weight: 600; opacity: .85; font-size: 13px; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 .pos-hold-mini { margin: 0 !important; order: 4; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 #held-sale-bar { margin: 0 !important; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open > h3 #held-sale-bar .settings-small-btn { min-height: 40px; }

            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar { display: contents !important; }

            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-offers-summary { order: 15; margin: 6px 0 0; }

            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #payment-toggle button { flex: 1 1 28%; min-height: 46px; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > .pos-pay-details { order: 30; max-height: none !important; overflow: visible !important; margin: 0 0 12px; padding: 0; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #add-order-to-tab-btn { order: 40; width: 100%; min-height: 46px; margin: 0 0 10px; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #cart-grand-total { order: 90; flex: 0 0 auto !important; width: calc(43% + 12px) !important; max-width: none; position: sticky; top: calc(100% - var(--ptl-dock-h)); bottom: 0; z-index: 15; height: var(--ptl-dock-h); box-sizing: border-box; display: flex; align-items: center; margin: 0 0 0 -12px !important; padding: 8px 6px 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); font-size: 16px; font-weight: 800; line-height: 1.2; background: var(--bg-surface, #fff); border: 0; border-top: 1px solid var(--border-color, #dfe6e9); box-shadow: 0 -6px 14px rgba(0,0,0,.10); border-radius: 0; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #cart-grand-total .cart-total-savings, html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #cart-grand-total span span { display: none; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open #cart-sticky-bar > #main-checkout-btn { order: 91; flex: 0 0 auto !important; width: calc(57% + 12px) !important; max-width: none; position: sticky; top: calc(100% - var(--ptl-dock-h)); bottom: 0; z-index: 15; box-sizing: border-box; height: var(--ptl-dock-h); margin: 0 -12px 0 0 !important; padding: 0 12px; font-size: 17px; font-weight: 800; border: 0; border-radius: 0; border-top: 8px solid var(--bg-surface, #fff); border-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) solid var(--bg-surface, #fff); border-right: 12px solid var(--bg-surface, #fff); border-left: 6px solid var(--bg-surface, #fff); background-clip: padding-box; box-shadow: none; }
            html.ptl-sheet-open #sales-tab .ptl-cart.ptl-open .order-type-toggle { margin-bottom: 10px; }
            html.ptl-sheet-open #mobile-cart-fab, html.ptl-sheet-open #floating-kb-toggle, html.ptl-sheet-open #scroll-to-top-btn { display: none !important; }
            /* the bottom bar: N items - total - View cart */
            .ptl-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9100; align-items: center; gap: 10px; box-sizing: border-box; height: calc(62px + env(safe-area-inset-bottom, 0px)); padding: 0 66px env(safe-area-inset-bottom, 0px) 14px; border: 0; border-top: 1px solid rgba(255,255,255,.18); border-radius: 0; background: var(--primary, #2c3e50); color: #fff; font: inherit; font-size: 15px; text-align: left; cursor: pointer; box-shadow: 0 -4px 16px rgba(0,0,0,.25); }
            .ptl-bar.on { display: flex; }
            .ptl-bar .ptl-bar-n { font-weight: 700; white-space: nowrap; }
            .ptl-bar .ptl-bar-t { flex: 1 1 auto; min-width: 0; font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .ptl-bar .ptl-bar-go { flex: 0 0 auto; font-weight: 700; opacity: .92; white-space: nowrap; }
            .ptl-bar .ptl-bar-n::after { content: ' \00B7'; opacity: .6; }
            @media (max-width: 340px) { .ptl-bar .ptl-bar-go { display: none; } }
            /* the round cart button: sits on the right end of the bar; the keyboard / scroll-up buttons sit above the bar on the left, smaller */
            html body #mobile-cart-fab { right: 8px !important; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px) !important; width: 46px; height: 46px; font-size: 21px; z-index: 10050; }
            html body #mobile-cart-fab .cart-fab-badge { top: -6px; right: -4px; }
            html body #floating-kb-toggle { left: 8px !important; bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important; width: 40px; height: 40px; font-size: 18px; opacity: .88; }

            /* while the bar is up they sit INSIDE it (keyboard at its left end, scroll-up beside the cart button) so they never cover a product or a line */

            html.ptl-bar-on body #scroll-to-top-btn { left: auto !important; right: 62px !important; bottom: calc(11px + env(safe-area-inset-bottom, 0px)) !important; opacity: .95; }
            html.ptl-bar-on .ptl-bar { padding-left: 56px; }
            html.ptl-bar-on:has(#scroll-to-top-btn.show) .ptl-bar { padding-right: 112px; }
            html.ptl-bar-on:has(#scroll-to-top-btn.show) .ptl-bar .ptl-bar-go { display: none; }
            html.ptl-bar-on body:has(#sales-tab.active) { padding-bottom: calc(var(--ptl-bar-h, 0px) + 70px) !important; }

            /* ================= 4 + 5. PRODUCT PANEL: search box as the header, ONE chip row, big 2-column tiles ================= */
            #sales-tab.tab-content { padding: 8px 8px 0 !important; }
            #sales-tab .pos-grid { gap: 8px; }
            #sales-tab .ptl-prod { display: grid !important; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 6px; padding: 8px !important; position: relative; }

            #sales-tab .ptl-prod > h3 button::before { content: attr(data-ptl-ic); font-size: 20px; line-height: 1; }
