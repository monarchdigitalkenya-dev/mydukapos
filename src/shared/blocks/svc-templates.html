function svcDefaultNotifyText(typeKey, eventKey) {
  var t = SVC_TYPES[svcTypeKeyOrOther(typeKey)], e = t.notify.events[eventKey];
  return e ? e.tpl : '';
}
function svcFillVars(text, vars) {
  vars = vars || {};
  return String(text == null ? '' : text).replace(/\{([a-z_]+)\}/g, function (m, k) { return vars[k] != null && vars[k] !== '' ? String(vars[k]) : m; });
}

/* ===== validation of the templates themselves (used by tests and by svcGetTemplate consumers that accept admin data) ===== */
function svcValidateTemplate(t) {
  var err = [];
  function bad(m) { err.push(m); }
  if (!t || typeof t !== 'object') return ['not an object'];
  ['key', 'label', 'icon', 'prefix', 'assetKind'].forEach(function (k) { if (!t[k] || typeof t[k] !== 'string') bad('missing ' + k); });
  if (typeof t.version !== 'number') bad('version');
  if (['phone', 'vehicle', 'equipment', 'garment', 'none'].indexOf(t.assetKind) === -1) bad('assetKind ' + t.assetKind);
  Object.keys(SVC_GENERIC_TERMS).forEach(function (k) { if (!t.terms || typeof t.terms[k] !== 'string' || !t.terms[k]) bad('term ' + k); });
  var ids = {}, sids = {};
  svcArr(t.sections).forEach(function (s) {
    if (!s.id || !s.title) bad('section without id/title');
    if (sids[s.id]) bad('duplicate section ' + s.id); sids[s.id] = 1;
    if (['intake', 'work', 'both'].indexOf(s.phase) === -1) bad('section phase ' + s.id);
    svcArr(s.fields).forEach(function (f) {
      if (!f.id || !/^[a-z][a-z0-9_]*$/.test(f.id)) bad('bad field id ' + f.id);
      if (ids[f.id]) bad('duplicate field id ' + f.id); ids[f.id] = f;
      if (SVC_FIELD_TYPES.indexOf(f.type) === -1) bad('field type ' + f.id + ':' + f.type);
      if (!f.label) bad('label ' + f.id);
      if (['data', 'customer', 'asset', 'job'].indexOf(f.storesIn) === -1) bad('storesIn ' + f.id);
      if (f.storesIn === 'asset' && !f.assetAttr) bad('assetAttr ' + f.id);
      if (f.type === 'widget' && SVC_WIDGETS_KNOWN.indexOf(f.widget) === -1) bad('widget ' + f.id);
      if (f.type === 'dropdown' && !f.options && !f.optionsFrom && f.id !== 'status') bad('dropdown without options ' + f.id);
      if (f.type === 'chips' && !svcArr(f.options).length) bad('chips without options ' + f.id);
      if (f.required !== true && f.required !== false && f.required !== 'quickOff') bad('required ' + f.id);
    });
  });
  function condRefs(c, where) {
    if (!c) return;
    if (c.all || c.any) { svcArr(c.all || c.any).forEach(function (x) { condRefs(x, where); }); return; }
    if (c.not) { condRefs(c.not, where); return; }
    if (!c.field || !ids[c.field]) bad('condition in ' + where + ' references unknown field ' + c.field);
  }
  Object.keys(ids).forEach(function (id) { condRefs(ids[id].visibleWhen, id); condRefs(ids[id].requiredWhen, id); });
  svcArr(t.sections).forEach(function (s) { condRefs(s.when, 'section ' + s.id); });
  if (t.quick) {
    svcArr(t.quick.fields).forEach(function (id) { if (!ids[id]) bad('quick field ' + id); });
    svcArr(t.quick.required).forEach(function (id) { if (!ids[id]) bad('quick required ' + id); else if (svcArr(t.quick.fields).indexOf(id) === -1) bad('quick required not shown ' + id); });
  } else bad('quick');
  var sk = {}, statuses = svcArr(t.statuses);
  if (!statuses.length) bad('statuses');
  statuses.forEach(function (s) {
    if (!/^[a-z][a-z0-9_]*$/.test(s.key || '')) bad('status key ' + s.key);
    if (sk[s.key]) bad('duplicate status ' + s.key); sk[s.key] = s;
    if ([0, 1, 2, 3, 4].indexOf(s.phase) === -1) bad('phase ' + s.key);
    if (['job', 'appt', 'both'].indexOf(s.scope) === -1) bad('scope ' + s.key);
    if (!s.label || !s.color) bad('status label/color ' + s.key);
  });
  statuses.forEach(function (s) { svcArr(s.next).forEach(function (n) { if (!sk[n]) bad('status ' + s.key + ' -> unknown ' + n); if (n === s.key) bad('self transition ' + s.key); }); svcArr(s.requires).forEach(function (r) { if (['assigned_staff', 'quote_approved', 'deposit', 'services', 'balance_zero'].indexOf(r) === -1) bad('requires ' + r); }); });
  ['initialStatus', 'appointmentInitialStatus'].forEach(function (k) { if (!sk[t[k]]) bad(k); });
  svcArr(t.createStatuses).forEach(function (k) { if (!sk[k]) bad('createStatuses ' + k); });
  if (!statuses.some(function (s) { return s.phase === 3; })) bad('no closed-success status');
  if (!statuses.some(function (s) { return s.phase === 4; })) bad('no closed-other status');
  var reach = {}; svcReachableStatuses(t).forEach(function (k) { reach[k] = 1; });
  statuses.forEach(function (s) { if (!reach[s.key]) bad('unreachable status ' + s.key); });
  var grouped = {};
  svcArr(t.queueGroups).forEach(function (g) { if (!g.key || !g.label) bad('queue group'); svcArr(g.statuses).forEach(function (k) { if (!sk[k]) bad('queue group status ' + k); grouped[k] = 1; }); });
  statuses.forEach(function (s) { if (!grouped[s.key]) bad('status not in a queue group ' + s.key); });
  var roles = {}; svcArr(t.staffRoles).forEach(function (r) { if (!r.key || !r.label) bad('staff role'); roles[r.key] = 1; });
  if (!t.staffAssignment || ['single', 'multi'].indexOf(t.staffAssignment.mode) === -1) bad('staffAssignment');
  var seedIds = {};
  svcArr(t.catalog && t.catalog.seeds).forEach(function (s) {
    if (!s.id || seedIds[s.id]) bad('seed id ' + s.id); seedIds[s.id] = 1;
    if (!s.name || typeof s.price !== 'number' || s.price < 0 || !(s.durationMin > 0)) bad('seed ' + s.name);
    if (s.staffRole && !roles[s.staffRole] && !SVC_SALON_SPECIALTIES.some(function (x) { return x.key === s.staffRole; })) bad('seed staffRole ' + s.name + ':' + s.staffRole);
    if (t.catalog.categories.indexOf(s.category) === -1) bad('seed category ' + s.name);
  });
  if (!svcArr(t.catalog && t.catalog.seeds).length) bad('no seeds');
  if (!t.inventory || ['optional', 'off', 'required'].indexOf(t.inventory.mode) === -1) bad('inventory.mode');
  if (!t.quote || ['off', 'optional', 'required'].indexOf(t.quote.mode) === -1) bad('quote.mode');
  if (!t.appointments || ['off', 'optional', 'primary'].indexOf(t.appointments.mode) === -1) bad('appointments.mode');
  if ((t.appointments && t.appointments.mode !== 'off') !== !!t.hasAppointments) bad('hasAppointments');
  var ev = t.notify && t.notify.events || {};
  SVC_NOTIFY_EVENTS.forEach(function (e) {
    if (!ev[e] || !ev[e].tpl) { bad('notify ' + e); return; }
    ev[e].tpl.replace(/\{([a-z_]+)\}/g, function (m, k) { if (SVC_NOTIFY_VARS.indexOf(k) === -1) bad('notify var ' + k + ' in ' + e); return m; });
  });
  svcArr(t.dashboard).forEach(function (d) {
    var m = String(d.metric || '');
    if (m.indexOf('group:') === 0) { if (!svcArr(t.queueGroups).some(function (g) { return g.key === m.slice(6); })) bad('dashboard group ' + m); }
    else if (m.indexOf('status:') === 0) { if (!sk[m.slice(7)]) bad('dashboard status ' + m); }
    else if (SVC_DASH_METRICS.indexOf(m) === -1) bad('dashboard metric ' + m);
    if (!d.id || !d.label) bad('dashboard card');
  });
  svcArr(t.reports).forEach(function (r) { if (SVC_REPORT_KEYS.indexOf(r) === -1) bad('report ' + r); });
  if (!svcArr(t.reports).length) bad('reports');
  if (!t.search || !Array.isArray(t.search.extraKeys)) bad('search');
  return err;
}
</script>
