function svcQtTimelineHtml(job, st) {

      (e.note ? '<div>' + svcQtEsc(e.note) + '</div>' : '') + (dt ? '<div class="w">' + svcQtEsc(dt) + '</div>' : '') +

function svcQtTotalsBoxHtml(job) {

  if (t.servicesTotal) rows += '<tr><td>Services</td><td>' + m(t.servicesTotal) + '</td></tr>';
  if (t.materialsTotal) rows += '<tr><td>Parts / materials</td><td>' + m(t.materialsTotal) + '</td></tr>';
  if (t.labour) rows += '<tr><td>Labour</td><td>' + m(t.labour) + '</td></tr>';
  if (t.additional) rows += '<tr><td>Additional charges</td><td>' + m(t.additional) + '</td></tr>';
  if (t.discount) rows += '<tr><td>Discount</td><td>-' + m(t.discount) + '</td></tr>';

  if (t.paid) rows += '<tr class="m"><td>Paid</td><td>' + m(t.paid) + '</td></tr>';
  rows += '<tr class="m"><td>Balance</td><td>' + m(t.balance) + '</td></tr>';
  var notes = '';
  if (sm.pendingCharges.length) notes += '<div class="sqt-note warn">' + sm.pendingCharges.length + ' charge(s) awaiting approval (' + m(Math.abs(sm.pendingAmount)) + ') are not in the total yet.</div>';

function svcQuoteTabHtml(job) {
  var st = svcQuoteState(job), canQuote = svcQtCan('svc:quote'), canApprove = svcQtCan('svc:approve'), closed = svcQtIsClosed(job), cfgQ = svcQuoteConfig(job), d = SVC_QT_UI.drafts[job.id];

  if (st.approval) html += '<div class="sqt-sub">Approved by ' + svcQtEsc(st.approval.approvedBy || 'customer') + ' (' + svcQtEsc(String(st.approval.method || '').replace('_', ' ')) + ') ' + svcQtEsc(svcQtWhen(st.approval.at)) + ' - recorded by ' + svcQtEsc(st.approval.by || '') + '</div>';
  if (st.rejection && st.rejection.note) html += '<div class="sqt-sub">Rejected: ' + svcQtEsc(st.rejection.note) + '</div>';
  if (st.priorApproval) html += '<div class="sqt-note warn">The earlier approval of ' + svcQtMoney(st.priorApproval.amount) + ' no longer applies to this version.</div>';
  if (cfgQ.requireApproval && st.state !== 'approved') html += '<div class="sqt-note warn">Customer approval is required before work starts on this job.</div>';
  if (closed) html += '<div class="sqt-note">This job is closed. The quote can no longer be changed.</div>';
  else if (!canQuote && !canApprove) html += '<div class="sqt-note">You can view the quote but not change it.</div>';

    if (canQuote && nx.indexOf('await') !== -1) acts += '<button type="button" class="sqt-btn" data-qt="await">Mark awaiting approval</button>';
    if (canApprove && nx.indexOf('approve') !== -1) acts += '<button type="button" class="sqt-btn good" data-qt="approve">Customer approved</button>';
    if (canApprove && nx.indexOf('reject') !== -1) acts += '<button type="button" class="sqt-btn" data-qt="reject">Customer rejected</button>';
    if (canQuote && nx.indexOf('revise') !== -1) acts += '<button type="button" class="sqt-btn" data-qt="edit">' + (st.state === 'approved' ? 'Change (new version)' : 'Edit (new version)') + '</button>';
    if (canQuote && st.state === 'approved') acts += '<button type="button" class="sqt-btn" data-qt="apply">Add quote lines to job</button>';
    if (acts) html += '<div class="sqt-actions">' + acts + '</div>';
    html += svcQtPanelHtml(job, st);
  }
  html += '</div>';
  if (!closed && canQuote && (d || st.state === 'none') && (st.state === 'none' || d)) { d = svcQtOpenDraft(job, st); html += svcQtEditorHtml(job, st, d); }

  return html + '</div>';
}
function svcQuoteRenderTab(job, el) {
  if (!el) return;
  el.__svcQtJob = job.id;
  if (!el.__svcQtBound) {
    el.__svcQtBound = true;
    el.addEventListener('click', svcQtOnClick);
    el.addEventListener('input', svcQtOnInput);
    el.addEventListener('change', svcQtOnInput);
  }
  el.innerHTML = svcQuoteTabHtml(job);
  if (SVC_QT_UI.panel && SVC_QT_UI.panel.jobId === job.id && SVC_QT_UI.panel.fresh) {
    SVC_QT_UI.panel.fresh = false;
    var pn = el.querySelector('[data-qt-panel]'); try { if (pn && pn.scrollIntoView) pn.scrollIntoView({ block: 'nearest' }); } catch (e) { /* cosmetic */ }
  }
}
function svcQtRerender(el) {
  var job = null; try { job = svcGetJob(el.__svcQtJob); } catch (e) { job = null; }
  if (job) svcQuoteRenderTab(job, el);
}
function svcQtVal(el, f) { var n = el.querySelector('[data-qt-f="' + f + '"]'); return n ? n.value : ''; }
function svcQtRowOf(d, node) { var r = node && node.closest ? node.closest('[data-qt-row]') : null; if (!r) return null; var id = r.getAttribute('data-qt-row'), i; for (i = 0; i < d.lines.length; i++) { if (d.lines[i].id === id) return d.lines[i]; } return null; }
function svcQtOnInput(ev) {
  var el = ev.currentTarget, t = ev.target, f = t && t.getAttribute ? t.getAttribute('data-qt-f') : null, jid = el.__svcQtJob, d = SVC_QT_UI.drafts[jid];
  if (!f || !d) return;
  var root = t.closest ? t.closest('[data-qt-editor]') : null; if (!root) return;

  var live = root.querySelector('.sqt-live'); if (live) live.innerHTML = svcQtTotalsHtml(svcQtDraftLines(d));

function svcQtFail(res) { svcQtToast(res && (res.why || res.error) ? (res.why || res.error) : 'That did not work (' + (res && res.code ? res.code : 'error') + ').', true); }
function svcQtOnClick(ev) {
  var el = ev.currentTarget, b = ev.target && ev.target.closest ? ev.target.closest('[data-qt]') : null;
  if (!b || !el.contains(b) || b.disabled) return;
  var act = b.getAttribute('data-qt'), jid = el.__svcQtJob, job = null;
  try { job = svcGetJob(jid); } catch (e) { job = null; }

  var reenable = function () { b.disabled = false; };

  if (act === 'canceledit') { delete SVC_QT_UI.drafts[jid]; svcQtRerender(el); return; }

  if (act === 'rowdel' && d) { var rl = svcQtRowOf(d, b); if (rl) d.lines = d.lines.filter(function (x) { return x !== rl; }); if (!d.lines.length) d.lines.push({ id: svcQtShortId('ql'), kind: 'service', name: '', qty: 1, price: '' }); svcQtRerender(el); return; }
  if (act === 'seed' && d) { d.lines = svcQuoteSeedLines(job); if (!d.lines.length) d.lines.push({ id: svcQtShortId('ql'), kind: 'service', name: '', qty: 1, price: '' }); svcQtRerender(el); return; }

    if (res.ok) { delete SVC_QT_UI.drafts[jid]; done(res.duplicate ? 'Already saved.' : 'Quote saved.'); } else { svcQtFail(res); reenable(); }

  if (act === 'await') { res = svcQuoteAwaitApproval(jid, { id: svcQtActId(jid, 'await') }); if (res.ok) { svcQtActDone(jid, 'await'); done('Waiting for the customer.'); } else { svcQtFail(res); reenable(); } return; }

    if (res.ok) { svcQtActDone(jid, 'charge'); done(res.pending ? 'Charge added - waiting for the customer to approve.' : 'Charge added.'); } else { svcQtFail(res); reenable(); }
    return;
  }
  if (act === 'charge-approve-go') { res = svcApproveCharge(jid, cid, { by: svcQtVal(el, 'cby'), method: svcQtVal(el, 'cmethod') }); if (res.ok) done('Charge approved.'); else { svcQtFail(res); reenable(); } return; }
  if (act === 'charge-reject-go') { res = svcRejectCharge(jid, cid, svcQtVal(el, 'creason')); if (res.ok) done('Decline recorded.'); else { svcQtFail(res); reenable(); } return; }

      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); svcQtToast('Quote text copied.'); reenable(); return; }

    reenable(); return;
  }

  reenable();
}

/* registration (cheap: two map assignments; svc-ui-home and svc-core are earlier blocks) */
try {
  if (typeof svcDrawerRegister === 'function') svcDrawerRegister('quote', { label: 'Quote', order: 30, render: svcQuoteRenderTab, visibleWhen: function (job) { return !!job && !job._legacy; } });
  if (typeof svcOn === 'function') svcOn('job:status', svcQuoteOnStatus);

</script>
