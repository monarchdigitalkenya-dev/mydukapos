<!-- DUPLICATE ITEM (zip 244) ------------------------------------------------------------------------------------------------------
         Add Item (one item) and Bulk Add (many rows) used to either refuse ("already exists - use a different name") or, in Bulk Add, quietly add a
         SECOND item with a new code. Now both stop and SAY the item is already there, and let the person choose:
           ✏️ Update the existing item   - new price(s) typed are applied, and the quantity typed is ADDED to its stock (or stock left alone)
           ➕ Add as a variant           - Shop / Pharmacy / Production / Services: the new size/colour/flavour becomes a variant of the existing item
                                           (an ordinary item is turned into a variants item: the old one becomes the first variant with its stock, under a new code of its own)
              ➕ Add as a version         - Hotel / Hospital have no variant type: it is saved as its own item named "Name - Version"
           ✖ Cancel / skip               - nothing changes
         The match is on the NAME ignoring capitals, spaces and punctuation ("Mango  shake" = "mango-shake"), and on the CODE.
         Nothing is ever deleted; an increase of stock is written to the stock history; a stock REDUCTION is never offered here (that needs the
         management password in Inventory). Hooks (per app): saveInventoryItem calls dupAskSingle(existing) where it used to show the error;
         saveBulkItems calls dupBulkCheck(rows, category, saveBulkItems) first and dupBulkSummary() for its message. Classes: dupi-*. -->

                    + '<label class="dupi-opt"><input type="radio" name="dupi-stock" value="keep"' + (M.stock === 'keep' ? ' checked' : '') + '><span>Leave the stock as it is</span></label>';
            }
            if (!priceBits.length && !(pos(e.qty) && !svc)) h += '<p class="dupi-sub" style="margin:0;">You did not type a price or quantity, so there is nothing to update. Cancel and fill them in, or choose another option.</p>';
            h += '<p class="dupi-err" id="dupi-err" role="alert">' + esc(err) + '</p><div class="dupi-row"><button type="button" class="dupi-go" data-act="do-upd"' + (!priceBits.length && !(pos(e.qty) && !svc) ? ' disabled' : '') + '>✓ Update item</button><button type="button" class="dupi-go sec" data-act="panel" data-p="">Back</button></div></div>';
        } else if (p === 'var') {
            h += '<div class="dupi-panel">';
            if (!vs) h += '<label for="dupi-first">What should the existing “' + esc(ex.name) + '” be called as a variant?</label><input type="text" id="dupi-first" maxlength="60" value="' + esc(M.first) + '" placeholder="Original">';
            h += '<label for="dupi-vname">Name of the NEW variant</label><input type="text" id="dupi-vname" maxlength="60" value="' + esc(M.vname) + '" placeholder="e.g. Large, Red, 500 ml, Size 30">'
                + '<p class="dupi-sub" style="margin:8px 0 0;">It gets the price' + (pos(e.price) ? ' ' + fmt(e.price) : '') + (pos(e.qty) ? ' and ' + qtyShow(e.qty, e.unit) + ' in stock' : '') + ' you typed. Its code is made from “' + esc(ex.code) + '”.</p>'
                + '<p class="dupi-err" id="dupi-err" role="alert">' + esc(err) + '</p><div class="dupi-row"><button type="button" class="dupi-go" data-act="do-var">✓ Add variant</button><button type="button" class="dupi-go sec" data-act="panel" data-p="">Back</button></div></div>';
        } else if (p === 'ver') {
            h += '<div class="dupi-panel"><label for="dupi-vname">Version name</label><input type="text" id="dupi-vname" maxlength="60" value="' + esc(M.vname) + '" placeholder="e.g. Large, Family, Double">'
                + '<p class="dupi-sub" style="margin:8px 0 0;">It will be saved as “' + esc(versionName(ex, M.vname || '…')) + '” with the details you typed.</p>'
                + '<p class="dupi-err" id="dupi-err" role="alert">' + esc(err) + '</p><div class="dupi-row"><button type="button" class="dupi-go" data-act="do-ver">✓ Save as new version</button><button type="button" class="dupi-go sec" data-act="panel" data-p="">Back</button></div></div>';
        }
        return h;
    }
    function bulkActions(c) {
        var cv = canVariants(), vs = hasVars(c.item), svc = c.item.type === 'service', a = [['upd', vs ? 'Update a variant of it' : 'Update the existing item']];
        if (!svc) { if (cv && (vs || canConvert(c.item))) a.push(['var', 'Add as a new variant']); else if (!cv) a.push(['ver', 'Add as another version']); }
        a.push(['skip', 'Skip this row']);
        return a;
    }
    function renderBulk() {
        var rows = M.conflicts.map(function (c, i) {
            var ex = c.item, vs = hasVars(ex), sel = '<select class="dupi-sel" data-act="bact" data-i="' + i + '">' + bulkActions(c).map(function (a) { return '<option value="' + a[0] + '"' + (c.action === a[0] ? ' selected' : '') + '>' + esc(a[1]) + '</option>'; }).join('') + '</select>';
            var extra = '';
            if (c.action === 'upd' && vs) extra = '<select class="dupi-sel" data-act="bvar" data-i="' + i + '" style="margin-top:6px;">' + ex.variants.map(function (v) { return '<option value="' + esc(v.id) + '"' + (v.id === c.vid ? ' selected' : '') + '>' + esc(v.name) + ' (' + qtyShow(v.qty, ex.unit) + ')</option>'; }).join('') + '</select>';
            else if (c.action === 'var') extra = (!vs ? '<input type="text" class="dupi-in" data-act="bfirst" data-i="' + i + '" maxlength="60" value="' + esc(c.first) + '" placeholder="Name for the existing one (Original)" style="margin-top:6px;">' : '') + '<input type="text" class="dupi-in" data-act="bname" data-i="' + i + '" maxlength="60" value="' + esc(c.vname) + '" placeholder="New variant name (e.g. Large)" style="margin-top:6px;">';
            else if (c.action === 'ver') extra = '<input type="text" class="dupi-in" data-act="bname" data-i="' + i + '" maxlength="60" value="' + esc(c.vname) + '" placeholder="Version name (e.g. Large)" style="margin-top:6px;">';
            return '<tr><td style="width:46%"><div class="nm">' + esc(c.name) + '</div><div class="mut">typed: ' + [pos(c.e.price) ? fmt(c.e.price) : '', pos(c.e.qty) ? 'qty ' + qtyShow(c.e.qty, c.e.unit) : ''].filter(Boolean).join(' · ') + (c.code ? ' · code ' + esc(c.code) : '') + '</div></td>'
                + '<td><div class="mut">Already: <b>' + esc(ex.name) + '</b> · ' + esc(ex.code) + ' · ' + fmt(ex.price) + (ex.type === 'service' ? '' : ' · ' + qtyShow(ex.qty, ex.unit) + ' in stock') + '</div>' + sel + extra + '</td></tr>';
        }).join('');
        var all = '<select class="dupi-sel" data-act="ball" style="margin:0 0 10px;"><option value="">Set every row to…</option><option value="upd">Update the existing items</option>' + (canVariants() ? '<option value="var">Add as variants</option>' : '<option value="ver">Add as versions</option>') + '<option value="skip">Skip all of them</option></select>';
        return '<button type="button" class="dupi-x" data-act="close" aria-label="Close">✕</button><h3 class="dupi-title">⚠️ ' + M.conflicts.length + (M.conflicts.length === 1 ? ' item already exists' : ' items already exist') + '</h3>'
            + '<p class="dupi-sub">Nothing has been saved yet. Choose what to do with each one — rows that are not listed here are added as new items.</p>' + (M.conflicts.length > 1 ? all : '')
            + '<table class="dupi-bulk"><tbody>' + rows + '</tbody></table><p class="dupi-err" id="dupi-err" role="alert">' + esc(M.err || '') + '</p>'
            + '<div class="dupi-row"><button type="button" class="dupi-go" data-act="do-bulk">✓ Continue</button><button type="button" class="dupi-go sec" data-act="close">Cancel</button></div>';
    }

    /* ---------- events ---------- */
    function setErr(t) { if (M) M.err = t; var el = $('dupi-err'); if (el) el.textContent = t || ''; }
    function onInput(ev) {
        var t = ev.target; if (!M || !t) return;
        if (t.id === 'dupi-vname') { M.vname = t.value; if (M.panel === 'ver') { var s = t.parentNode.querySelector('.dupi-sub'); if (s) s.innerHTML = 'It will be saved as “' + esc(versionName(M.existing, t.value || '…')) + '” with the details you typed.'; } }
        else if (t.id === 'dupi-first') M.first = t.value;
        else if (t.getAttribute && t.getAttribute('data-act') === 'bname') M.conflicts[+t.getAttribute('data-i')].vname = t.value;
        else if (t.getAttribute && t.getAttribute('data-act') === 'bfirst') M.conflicts[+t.getAttribute('data-i')].first = t.value;
    }
    function onChange(ev) {
        var t = ev.target; if (!M || !t) return;
        if (t.id === 'dupi-vsel') { M.vid = t.value; render(); }
        else if (t.id === 'dupi-prices') M.prices = !!t.checked;
        else if (t.name === 'dupi-stock') M.stock = t.value;
        else if (t.getAttribute && t.getAttribute('data-act') === 'bact') { var c = M.conflicts[+t.getAttribute('data-i')]; c.action = t.value; render(); }
        else if (t.getAttribute && t.getAttribute('data-act') === 'bvar') M.conflicts[+t.getAttribute('data-i')].vid = t.value;
        else if (t.getAttribute && t.getAttribute('data-act') === 'ball' && t.value) { M.conflicts.forEach(function (c) { if (bulkActions(c).some(function (a) { return a[0] === t.value; })) c.action = t.value; }); render(); }
    }
    function onClick(ev) {
        var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
        if (ev.target && ev.target.id === 'dupi-ov') { close(); return; }
        if (!el || !M || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
        var act = el.getAttribute('data-act');
        if (act === 'close') close();
        else if (act === 'panel') { M.panel = el.getAttribute('data-p') || ''; M.err = ''; render(); }
        else if (act === 'do-upd') doUpdate();
        else if (act === 'do-var') doVariant();
        else if (act === 'do-ver') doVersion();
        else if (act === 'do-bulk') doBulk();
    }
    function doUpdate() {
        var ex = M.existing, e = M.entered;
        if (hasVars(ex) && !M.vid) { setErr('Choose which variant this is.'); return; }
        var prices = $('dupi-prices') ? !!$('dupi-prices').checked : false;
        var stockEl = document.querySelector('input[name="dupi-stock"]:checked');
        var text = applyUpdate(ex, e, { prices: prices, stock: stockEl ? stockEl.value : 'keep', variantId: M.vid });
        persist(); close(); resetForm(); toast('Updated “' + ex.name + '”: ' + text + '.');
    }
    function doVariant() {
        var ex = M.existing, r = applyVariant(ex, M.entered, { variantName: M.vname, firstName: M.first });
        if (!r.ok) { setErr(r.error); return; }
        persist(); close(); resetForm(); toast(r.text + '.');
    }
    function doVersion() {
        var v = String(M.vname || '').trim();
        if (!v) { setErr('Type the version name (for example Large).'); return; }
        var nm = versionName(M.existing, v);
        if (!$('inv-name') || typeof saveInventoryItem !== 'function') { setErr('Cannot save a version from here.'); return; }
        close(); $('inv-name').value = nm; saveInventoryItem();      // the normal save, so category / VAT / photo / recipe all work; a code that is the same as the old item's still asks first
    }
    function doBulk() {
        var bad = '';
        M.conflicts.forEach(function (c) {
            if (bad) return;
            if ((c.action === 'var' || c.action === 'ver') && !String(c.vname || '').trim()) bad = 'Type a ' + (c.action === 'var' ? 'variant' : 'version') + ' name for “' + c.name + '”.';
        });
        if (bad) { setErr(bad); return; }
        if (!M.done) { M.done = { updated: 0, variants: 0, versions: 0, skipped: 0 }; M.handled = new Set(); }
        // rows are applied one after another (two rows can point at the same existing item). A row that is applied is taken OUT of the list at once, so if a
        // later row stops with a message, pressing Continue again can never apply the same row twice (stock would be added twice).
        var failed = '';
        while (M.conflicts.length && !failed) {
            var c = M.conflicts[0], ex = c.item;
            if (c.action === 'skip') { M.done.skipped++; }
            else if (c.action === 'upd') {
                if (hasVars(ex) && !c.vid) c.vid = ex.variants[0].id;
                applyUpdate(ex, c.e, { prices: true, stock: 'add', variantId: hasVars(ex) ? c.vid : '' }); M.done.updated++;
            } else if (c.action === 'var') {
                var r = applyVariant(ex, c.e, { variantName: c.vname, firstName: c.first });
                if (!r.ok) { failed = c.name + ': ' + r.error; break; }
                M.done.variants++;
            } else if (c.action === 'ver') {
                var nm = versionName(ex, c.vname);
                if (findMatch(nm, '')) { failed = '“' + nm + '” already exists too. Use a different version name.'; break; }
                var p = { type: ex.type === 'ingredient' || ex.type === 'service' ? ex.type : 'item', code: uniq(c.code || gid()), name: nm, price: pos(c.e.price) || Number(ex.price) || 0, wholesalePrice: pos(c.e.wholesalePrice) || Number(ex.wholesalePrice) || 0, unit: c.e.unit || ex.unit || 'pcs', qty: pos(c.e.qty) || 0, vatCategory: ex.vatCategory || 'A' };
                if (ex.category) p.category = ex.category; if (ex.categoryId) p.categoryId = ex.categoryId; if (ex.subCat) p.subCat = ex.subCat;
                inventory.push(p); M.done.versions++;
            }
            M.handled.add(c.row.id); M.conflicts.shift();
        }
        if (failed) { persist(); M.err = failed; render(); return; }
        lastSummary = M.done; var proceed = M.proceed, handled = M.handled; close(); persist();
        try { proceed(handled); } catch (e) { toast('Could not finish the bulk add: ' + (e && e.message || e), true); }
    }

    /* ---------- entry points the apps call ---------- */
    // Add Item (one): the existing item the typed name / code matched. Returns true when the window opened (the caller then stops).
    window.dupAskSingle = function (existing) {
        try {
            if (!existing) return false;
            var e = formValues(), sug = '';
            var by = e.code && String(existing.code || '').toLowerCase() === e.code.toLowerCase() ? 'code' : 'name';
            M = { kind: 'single', existing: existing, entered: e, by: by, panel: '', err: '', vid: hasVars(existing) ? existing.variants[0].id : '', prices: true, stock: pos(e.qty) ? 'add' : 'keep', vname: sug, first: 'Original' };
            open(); return true;
        } catch (er) { M = null; return false; }
    };
    // Bulk Add: rows = bulkAddRows; the rows that match an existing item get the window. proceed(handledRowIds) re-runs the app's own save for the rest.
    window.dupBulkCheck = function (rows, category, proceed) {
        try {
            var conflicts = [];
            (rows || []).forEach(function (row) {
                var code = String(row.code || '').trim(), name = '';
                try { name = buildInventoryItemName(row.name, category, code); } catch (e) { name = String(row.name || '').trim(); }
                if (!name) return;
                var m = findMatch(name, code);
                if (!m) return;
                conflicts.push({ row: row, name: name, code: code, item: m.item, by: m.by, e: rowValues(row), action: 'upd', vid: hasVars(m.item) ? m.item.variants[0].id : '', vname: '', first: 'Original' });
            });
            if (!conflicts.length) return false;
            M = { kind: 'bulk', conflicts: conflicts, rows: rows, proceed: proceed, err: '' };
            open(); return true;
        } catch (er) { M = null; return false; }
    };
    window.dupBulkSummary = function () {
        var s = lastSummary, b = [];
        if (s.updated) b.push(s.updated + ' existing updated'); if (s.variants) b.push(s.variants + ' added as variant' + (s.variants === 1 ? '' : 's')); if (s.versions) b.push(s.versions + ' added as version' + (s.versions === 1 ? '' : 's')); if (s.skipped) b.push(s.skipped + ' skipped');
        return b.length ? ', ' + b.join(', ') : '';
    };
    Object.assign(window.__dupItem, { norm: norm, findMatch: findMatch, applyUpdate: applyUpdate, applyVariant: applyVariant, canConvert: canConvert, close: close });
})();
</script>
