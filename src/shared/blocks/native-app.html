<!-- NATIVE APPS (zip 148) -----------------------------------------------------------------------------------------------------------
         The same web app runs in the browser, as an installed Web App, and inside the MyDukaPOS Android and Windows apps (native/).
           * window.nativeApp: which one this is ({ platform: 'web' | 'android' | 'windows', version … }) — read from the app itself.
           * Printers of the app (Settings ▸ Install App ▸ "This app's printers"): Android — a paired Bluetooth thermal printer
             (ESC/POS); Windows — any Windows printer without the print dialog, or a network thermal printer (IP, port 9100). Every
             status shown is the real answer of the device (connected / printed / the exact error) — never assumed.
             A chosen byte printer is used through the existing thermal-printer path (sendBytesViaBluetooth → nativeSendBytes), so
             every receipt, bill, ticket and report the app already prints on thermal printers works unchanged.
           * Settings ▸ Install App: the Web App (as before), and the Android / Windows app of THIS shop's module — offered only when
             the owner has published a real installer for it (/api/app-releases: the server checks the shop's own module).
           * A newer version of the Android / Windows app: a small notice (once per version), never a forced update.
           * The owner's messages (Owner Console ▸ 📣 Messages, /api/messages): fetched on start, every 10 minutes and when the connection
             comes back; the last list is kept on the device (offline); unread ones are shown one at a time; "Don't Show Again" sticks.
         Self-contained on purpose (same code in every app). -->
    <script>
    (function () {
        'use strict';
        if (window.__nativeAppInit) return;
        window.__nativeAppInit = true;
        var N = window.MyDukaNative || null;
        var info = { platform: 'web' };
        try { if (N && N.info) { var raw = N.info(); var o = typeof raw === 'string' ? JSON.parse(raw) : raw; if (o && o.platform) info = o; } } catch (e) { /* web */ }
        window.nativeApp = info;
        var LS = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* private */ } return null; };
        var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
        var api = function (p) { return typeof apiUrl === 'function' ? apiUrl(p) : p; };

        /* ---- calls into the app: Android answers through a callback, Windows with a promise ---- */
        var pending = {}, seq = 0;
        window.__myDukaNativeCb = function (id, r) { var p = pending[id]; if (p) { delete pending[id]; p(r); } };
        function androidCall(method, args) {
            return new Promise(function (resolve) {
                var id = 'n' + (++seq) + '_' + Date.now();
                pending[id] = resolve;
                setTimeout(function () { if (pending[id]) { delete pending[id]; resolve({ ok: false, error: 'The app did not answer.' }); } }, 60000);
                try { N[method].apply(N, args.concat([id])); } catch (e) { delete pending[id]; resolve({ ok: false, error: String(e && e.message || e) }); }
            });
        }
        function toB64(bytes) {
            var s = '', CH = 0x8000;
            for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
            return btoa(s);
        }

        /* ---- the printer chosen in this app ---- */
        var PKEY = 'pos_native_printer_v1';
        function saved() { try { var p = JSON.parse(LS(PKEY) || 'null'); return p && p.kind ? p : null; } catch (e) { return null; } }
        // a printer that takes ESC/POS bytes (Android Bluetooth, Windows network) — used by sendBytesViaBluetooth
        window.nativeBytePrinter = function () {
            var p = saved();
            if (!p || !N) return null;
            if (info.platform === 'android' && p.kind === 'android-bt' && N.btPrint) return p;
            if (info.platform === 'windows' && p.kind === 'windows-net' && N.netPrint) return p;
            return null;
        };
        window.nativeSendBytes = async function (bytes) {
            var p = window.nativeBytePrinter();
            if (!p) throw new Error('No app printer chosen.');
            var b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
            var r = p.kind === 'android-bt' ? await androidCall('btPrint', [p.address, toB64(b)]) : await N.netPrint(p.host, p.port || 9100, toB64(b));
            if (!r || !r.ok) throw new Error((r && r.error) || 'The printer did not answer.');
            return true;
        };
        // Windows: a Windows printer (with its driver) prints WITHOUT the dialog; the page's 'afterprint' comes after Windows' answer
        if (info.platform === 'windows' && N && N.print) {
            var origPrint = window.print ? window.print.bind(window) : null;
            // zip 192: what is being printed, and on what paper, is read from the page itself
            function pageMm() {
                try { var st = document.getElementById('print-page-style'); var m = st && /size:\s*([\d.]+)mm\s+([\d.]+)mm/.exec(st.textContent || ''); if (m) return { widthMm: Number(m[1]), heightMm: Number(m[2]) }; } catch (e) { /* none */ }
                return {};
            }
            function snapshotHtml() {
                var cls = document.body.className || '', id = /printing-receipt/.test(cls) ? 'receipt-modal' : /printing-kitchen-ticket/.test(cls) ? 'kitchen-ticket-modal' : '';
                var el = id && document.getElementById(id);
                if (!el) return '';
                var css = Array.prototype.map.call(document.querySelectorAll('style'), function (x) { return x.textContent; }).join('\n');
                var rootStyle = document.documentElement.getAttribute('style') || '', bodyStyle = document.body.getAttribute('style') || '';
                return '<!doctype html><html data-theme="' + (document.documentElement.getAttribute('data-theme') || 'light') + '" style="' + rootStyle.replace(/"/g, '&quot;') + '"><head><meta charset="utf-8"><style>' + css + '</style></head><body class="' + cls.replace(/"/g, '') + '" style="' + bodyStyle.replace(/"/g, '&quot;') + '">' + el.outerHTML + '</body></html>';
            }
            window.nativeSnapshotHtml = snapshotHtml;
            function settle() { return new Promise(function (res) { requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(res, 250); }); }); }); }
            window.nativePrintMethod = function (v) { if (v) LS('pos_native_print_method', v); return LS('pos_native_print_method') || 'snapshot'; };
            window.print = function () {
                var p = saved();
                if (!p || p.kind !== 'windows-driver') { if (origPrint) origPrint(); return; }
                var method = window.nativePrintMethod();
                if (method === 'dialog') { if (origPrint) origPrint(); return; }
                settle().then(function () {
                    var mm = pageMm(), html = (method === 'snapshot' && N.printHtml) ? snapshotHtml() : '';
                    return html ? N.printHtml({ deviceName: p.deviceName, html: html, widthMm: mm.widthMm, heightMm: mm.heightMm }) : N.print({ deviceName: p.deviceName, widthMm: mm.widthMm, heightMm: mm.heightMm });
                }).then(function (r) {
                    if (!r || !r.ok) { try { showToast('Printing on ' + p.deviceName + ' failed: ' + ((r && r.error) || 'no answer') + '.', true); } catch (e) {} }
                    window.dispatchEvent(new Event('afterprint'));
                });
            };
        }

        var ESC_TEST = function (lines) {
            var t = new TextEncoder().encode(lines.join('\n') + '\n\n\n\n');
            var out = new Uint8Array(2 + t.length + 4);
            out.set([0x1b, 0x40], 0); out.set(t, 2); out.set([0x1d, 0x56, 0x42, 0x00], 2 + t.length);   // init … text … feed + cut
            return out;
        };
        function useAsReceiptPrinter() {
            try { if (typeof setPrinterMode === 'function') setPrinterMode('bluetooth'); else LS('pos_printer_mode', 'bluetooth'); } catch (e) { /* the mode is also read on start */ }
        }

        /* ---- Settings ▸ Install App: this app, its printers, the installers ---- */
        var releases = null, relError = '';
        function fmtMB(n) { return (n / 1048576).toFixed(1) + ' MB'; }
        function osGuess() {
            var ua = navigator.userAgent || '';
            if (/Android/i.test(ua)) return 'android';
            if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
            if (/Windows/i.test(ua)) return 'windows';
            return 'other';
        }
        function loadReleases() {
            if (window.posNetOffline && window.posNetOffline()) { relError = 'offline'; return Promise.resolve(); }
            return fetch(api('/api/app-releases'), { cache: 'no-store' }).then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
                .then(function (x) { if (x.ok) { releases = x.b; relError = ''; } else relError = (x.b && x.b.error) || 'unavailable'; })
                .catch(function () { relError = 'unavailable'; });
        }
        function newest(platform, kind) {
            var list = (releases && releases.releases) || [];
            for (var i = 0; i < list.length; i++) if (list[i].platform === platform && (!kind || list[i].kind === kind)) return list[i];
            return null;
        }
        function cmpVer(a, b) { var x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (var i = 0; i < Math.max(x.length, y.length); i++) { var d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; } return 0; }

        function panelHost() {
            var sec = document.getElementById('settings-section-install');
            if (!sec) return null;
            var el = document.getElementById('native-apps-panel');
            if (!el) {
                el = document.createElement('div');
                el.id = 'native-apps-panel';
                var anchor = document.getElementById('install-app-btn');
                var row = anchor && anchor.closest ? anchor.closest('.settings-row') : null;
                if (row && row.parentNode) row.parentNode.insertBefore(el, row.nextSibling); else sec.appendChild(el);
            }
            return el;
        }
        function card(title, body) { return '<div style="border:1px solid #e1e6ea; border-radius:8px; padding:12px; margin:10px 0; background:#fff;"><div style="font-weight:700; margin-bottom:4px;">' + title + '</div>' + body + '</div>'; }
        function downloadHtml(r, label) {
            return '<a class="btn-main settings-small-btn" style="display:inline-block; text-decoration:none; margin-top:6px;" href="' + esc(api('/api/app-releases?download=' + encodeURIComponent(r.id))) + '" download="' + esc(r.file.name) + '">' + label + '</a>'
                + '<div style="font-size:12px; color:#7f8c8d; margin-top:6px;">Version ' + esc(r.version) + ' (build ' + esc(r.build) + ') · ' + fmtMB(r.file.size) + ' · ' + esc(r.releasedAt || '') + '<br>SHA-256: <code style="word-break:break-all;">' + esc(r.file.sha256) + '</code></div>'
                + (r.notes ? '<div style="font-size:12px; margin-top:6px; white-space:pre-wrap;">' + esc(r.notes) + '</div>' : '');
        }
        function renderPanel() {
            var el = panelHost();
            if (!el) return;
            var os = osGuess(), html = '<hr class="settings-divider"><h4>📦 Install options</h4>';
            if (info.platform !== 'web') {
                html += card('✅ You are using the ' + esc(info.appName || 'MyDukaPOS') + ' ' + (info.platform === 'android' ? 'Android' : 'Windows') + ' app',
                    '<div style="font-size:13px;">Version ' + esc(info.version) + (info.build ? ' (build ' + esc(info.build) + ')' : '') + '. Sales are kept on this device and synced automatically, like in the browser.</div>'
                    + '<button type="button" class="settings-small-btn" style="margin-top:8px;" onclick="nativeForgetShop()">Use another shop link</button>');
                html += '<div id="native-printers"></div>';
            } else {
                html += card('🌐 Web App', '<div style="font-size:13px;">Install MyDukaPOS as a Web App with the button above — on every phone, tablet and computer. It works offline once opened online.</div>');
            }
            var apk = newest('android', 'apk'), exe = newest('windows', 'exe'), msi = newest('windows', 'msi');
            var androidBody, windowsBody;
            if (releases) {
                androidBody = apk ? '<div style="font-size:13px;">The dedicated Android app: a paired Bluetooth thermal printer, Android printing, and the same offline sales and sync. Optional — the Web App keeps working.</div>'
                    + downloadHtml(apk, info.platform === 'android' ? '⬇️ Download version ' + esc(apk.version) : '⬇️ Download the Android app (APK)')
                    + '<div style="font-size:12px; color:#555; margin-top:6px; background:#f8f9fa; padding:8px; border-radius:6px;">After the download, open the file. The first time, Android asks to allow installing apps from your browser (<em>Install unknown apps</em>) — allow it for this one install; Android always asks you before installing.</div>'
                    : '<div style="font-size:13px; color:#7f8c8d;">Not available yet for this app.</div>';
                windowsBody = (exe || msi) ? '<div style="font-size:13px;">The dedicated Windows app: prints to any Windows printer without the print dialog, network thermal printers, and the same offline sales and sync. Optional.</div>'
                    + (exe ? downloadHtml(exe, '⬇️ Download the Windows installer (.exe)') : '') + (msi ? downloadHtml(msi, '⬇️ Windows installer for IT (.msi)') : '')
                    + '<div style="font-size:12px; color:#555; margin-top:6px; background:#f8f9fa; padding:8px; border-radius:6px;">Run the downloaded file. If Windows shows "Windows protected your PC", choose More info ▸ Run anyway only if the file came from here.</div>'
                    : '<div style="font-size:13px; color:#7f8c8d;">Not available yet for this app.</div>';
            } else {
                var why = relError === 'offline' ? 'Connect to the internet to see the Android and Windows apps.' : 'The list of apps could not be loaded right now.';
                androidBody = windowsBody = '<div style="font-size:13px; color:#7f8c8d;">' + why + '</div>';
            }
            var aCard = card('🤖 Android application', androidBody), wCard = card('🪟 Windows application', windowsBody);
            html += (os === 'windows') ? wCard + aCard : (os === 'ios' ? '' : aCard + wCard);
            if (os === 'ios') html += card('📱 iPhone / iPad', '<div style="font-size:13px;">Use the Web App (Share ▸ Add to Home Screen). There is no separate iPhone app.</div>');
            html += messagesCard();
            el.innerHTML = html;
            if (info.platform !== 'web') renderPrinters();
        }
        window.nativeForgetShop = function () {
            if (!confirm('Open another shop in this app? This shop\'s unsent sales stay on this device and are sent when you open it again.')) return;
            try { var r = N.forgetShop(); if (r && r.then) r.then(function () {}); } catch (e) { /* none */ }
        };

        function renderPrinters(msg) {
            var box = document.getElementById('native-printers');
            if (!box) return;
            var p = saved(), cur = p ? (p.kind === 'android-bt' ? 'Bluetooth: ' + esc(p.name) : p.kind === 'windows-net' ? 'Network printer ' + esc(p.host) + ':' + esc(p.port || 9100) : 'Windows printer: ' + esc(p.deviceName)) : 'none — receipts use the print dialog';
            var body = '<div style="font-size:13px;">Receipt printer: <strong id="native-printer-current">' + cur + '</strong></div>'
                + '<div id="native-printer-status" class="settings-msg" style="margin-top:6px;">' + (msg || '') + '</div>'
                + '<div id="native-printer-list" style="display:grid; gap:6px; margin-top:6px;"></div>'
                + '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">'
                + (info.platform === 'android' ? '<button type="button" class="btn-main settings-small-btn" onclick="nativePrinterScan()">🔎 Choose a Bluetooth printer</button>' : '<button type="button" class="btn-main settings-small-btn" onclick="nativePrinterScan()">🖨️ Choose a Windows printer</button><button type="button" class="settings-small-btn" onclick="nativeNetPrinterAsk()">🌐 Network thermal printer (IP)</button>')
                + (p && p.kind === 'windows-driver' ? '<div style="margin-top:10px; font-size:13px;">If the paper comes out empty: <select id="native-print-method" class="settings-small-btn" onchange="nativePrintMethod(this.value)"><option value="snapshot"' + (window.nativePrintMethod && window.nativePrintMethod() === 'snapshot' ? ' selected' : '') + '>Print method 1 (recommended)</option><option value="page"' + (window.nativePrintMethod && window.nativePrintMethod() === 'page' ? ' selected' : '') + '>Print method 2 (the page as shown)</option><option value="dialog"' + (window.nativePrintMethod && window.nativePrintMethod() === 'dialog' ? ' selected' : '') + '>Print method 3 (Windows print window)</option></select></div>' : '')
                + (p ? '<button type="button" class="settings-small-btn" onclick="nativePrinterTest()">🧾 Test print</button><button type="button" class="settings-small-btn" onclick="nativePrinterForget()">Remove</button>' : '')
                + '</div>'
                + (info.platform === 'android' ? '<div style="font-size:12px; color:#7f8c8d; margin-top:6px;">Pair a new printer once in Android Settings ▸ Bluetooth (PIN usually 0000 or 1234), then choose it here.</div>' : '');
            box.innerHTML = card('🖨️ This app\'s printers', body);
        }
        function status(t, kind) { var s = document.getElementById('native-printer-status'); if (s) { s.className = 'settings-msg' + (kind ? ' ' + kind : ''); s.textContent = t; } }
        window.nativePrinterScan = async function () {
            var list = document.getElementById('native-printer-list');
            status(info.platform === 'android' ? 'Looking for the Bluetooth printers paired with this phone…' : 'Asking Windows for its printers…');
            var r = info.platform === 'android' ? await androidCall('btList', []) : await N.printers();
            if (!r || !r.ok) { status((r && r.error) || 'No answer from the device.', 'error'); return; }
            var items = info.platform === 'android' ? r.devices : r.printers;
            if (!items.length) { status(info.platform === 'android' ? 'No paired Bluetooth devices. Pair the printer in Android Settings ▸ Bluetooth first.' : 'Windows has no printers installed.', 'error'); return; }
            status(info.platform === 'android' ? 'Choose the printer:' : 'Choose the printer (status as Windows reports it):');
            list.innerHTML = items.map(function (d, i) {
                var label = info.platform === 'android' ? esc(d.name) + ' <span style="color:#7f8c8d; font-size:12px;">' + esc(d.address) + '</span>' : esc(d.displayName || d.name) + (d.isDefault ? ' <span style="color:#7f8c8d; font-size:12px;">(default)</span>' : '');
                return '<button type="button" class="settings-small-btn" style="text-align:left;" onclick="nativePrinterPick(' + i + ')">' + label + '</button>';
            }).join('');
            window.__nativePrinterItems = items;
        };
        window.nativePrinterPick = async function (i) {
            var d = (window.__nativePrinterItems || [])[i];
            if (!d) return;
            if (info.platform === 'android') { LS(PKEY, JSON.stringify({ kind: 'android-bt', address: d.address, name: d.name })); useAsReceiptPrinter(); }
            else LS(PKEY, JSON.stringify({ kind: 'windows-driver', deviceName: d.name }));
            renderPrinters('Saved. Print a test to check it.');
            await window.nativePrinterTest();
        };
        window.nativeNetPrinterAsk = async function () {
            var v = prompt('The network thermal printer\'s IP address (and port, if not 9100), e.g. 192.168.1.50 or 192.168.1.50:9100');
            if (!v) return;
            var m = String(v).trim().match(/^([\w.-]+)(?::(\d{2,5}))?$/);
            if (!m) { status('That is not an IP address.', 'error'); return; }
            LS(PKEY, JSON.stringify({ kind: 'windows-net', host: m[1], port: Number(m[2] || 9100) }));
            useAsReceiptPrinter();
            renderPrinters('Saved. Printing a test…');
            await window.nativePrinterTest();
        };
        window.nativePrinterTest = async function () {
            var p = saved();
            if (!p) return;
            status('Printing a test page…');
            try {
                if (p.kind === 'windows-driver') {
                    var r = await N.print({ deviceName: p.deviceName });
                    if (!r || !r.ok) throw new Error((r && r.error) || 'no answer');
                    status('✓ Windows accepted the print job on ' + p.deviceName + '.', 'success');
                    return;
                }
                var biz = ''; try { biz = (typeof businessName !== 'undefined' && businessName) || ''; } catch (e) {}
                await window.nativeSendBytes(ESC_TEST(['MyDukaPOS — printer test', biz, new Date().toLocaleString('en-GB'), '--------------------------------', 'If you can read this, the printer', 'is set up for receipts.']));
                status('✓ Printed — the printer received the test page.', 'success');
            } catch (e) {
                status('✗ Not printed: ' + e.message, 'error');
            }
        };
        window.nativePrinterForget = function () {
            LS(PKEY, null);
            try { if (typeof setPrinterMode === 'function' && typeof printerMode !== 'undefined' && printerMode === 'bluetooth' && (typeof btPrinterCharacteristic === 'undefined' || !btPrinterCharacteristic)) setPrinterMode('system'); } catch (e) { /* none */ }
            renderPrinters('Removed — receipts use the print dialog.');
        };

        /* ---- a newer version of this native app: tell once per version, never force ---- */
        function updateNotice() {
            if (info.platform === 'web' || !releases) return;
            var r = newest(info.platform, info.platform === 'android' ? 'apk' : 'exe');
            if (!r || cmpVer(r.version, info.version) <= 0) return;
            var key = 'pos_app_update_seen_' + info.platform + '_' + r.version;
            if (LS(key)) return;
            var bar = document.createElement('div');
            bar.id = 'native-update-bar';
            bar.style.cssText = 'position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:100000; background:#2c3e50; color:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.3); font:14px system-ui,sans-serif; display:flex; gap:10px; align-items:center; max-width:calc(94vw / var(--pos-z,1));';
            bar.innerHTML = '<span>Version ' + esc(r.version) + ' of this app is available (Settings ▸ Install App). Your sales stay on this device.</span>';
            var ok = document.createElement('button'); ok.type = 'button'; ok.textContent = 'OK';
            ok.style.cssText = 'background:#27ae60; color:#fff; border:0; border-radius:6px; padding:6px 12px; font-weight:600;';
            ok.onclick = function () { LS(key, '1'); bar.remove(); };
            bar.appendChild(ok);
            document.body.appendChild(bar);
        }

        /* ---- the owner's messages (Owner Console ▸ 📣 Messages) — stored on the server, kept here for offline, unread shown one at a time ---- */
        var MKEY = 'pos_owner_msgs_v1', SKEY = 'pos_owner_msgs_seen_v1';
        function msgs() { try { var a = JSON.parse(LS(MKEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
        function seenMap() { try { return JSON.parse(LS(SKEY) || '{}') || {}; } catch (e) { return {}; } }
        function markSeen(id, until) { var m = seenMap(); m[id] = until || 'never'; LS(SKEY, JSON.stringify(m)); }
        function applies(m) {
            if (m.endsAt && m.endsAt < Date.now()) return false;
            if (m.platforms && m.platforms.length && m.platforms.indexOf(info.platform) === -1) return false;
            if (info.platform !== 'web' && ((m.minVersion && cmpVer(info.version, m.minVersion) < 0) || (m.maxVersion && cmpVer(info.version, m.maxVersion) > 0))) return false;
            // an offer to install the Android / Windows app is not shown inside that app
            if (m.kind === 'install' && m.installPlatform && m.installPlatform === info.platform) return false;
            return true;
        }
        function unread() {
            var seen = seenMap(), now = Date.now();
            return msgs().filter(function (m) { var s = seen[m.id]; return applies(m) && !(s === 'never' || (typeof s === 'number' && s > now)); });
        }
        window.ownerMessagesUnread = function () { return unread().length; };
        function fetchMessages() {
            if (window.posNetOffline && window.posNetOffline()) return Promise.resolve();
            return fetch(api('/api/messages'), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
                .then(function (b) { if (b && Array.isArray(b.messages)) { LS(MKEY, JSON.stringify(b.messages)); showNextMessage(); } })
                .catch(function () { /* kept from the last time; asked again when the connection is back */ });
        }
        function openInstallSettings() {
            try { var t = document.querySelector('.tab-link[data-tab="settings-tab"]'); if (t) t.click(); } catch (e) {}
            setTimeout(function () { try { var b = document.querySelector('[data-section="settings-section-install"]'); if (b) b.click(); } catch (e) {} }, 60);
        }
        window.openInstallSettings = openInstallSettings;
        var KIND_ICON = { announcement: '📣', install: '📦', update: '⬆️', maintenance: '🛠️', security: '🔐', sync: '🔄', printing: '🖨️' };
        function showNextMessage() {
            try {
                if (document.getElementById('owner-msg-bar')) return;
                var list = unread();
                if (!list.length || !document.body) return;
                var m = list[0];
                var bar = document.createElement('div');
                bar.id = 'owner-msg-bar';
                bar.setAttribute('role', 'status');
                bar.style.cssText = 'position:fixed; left:50%; top:10px; transform:translateX(-50%); z-index:2147482000; background:#fff; color:#2c3e50; border-left:5px solid #2980b9; padding:12px 14px; border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.25); font:14px system-ui,sans-serif; width:min(560px, calc(94vw / var(--pos-z,1)));';
                var more = list.length > 1 ? ' <span style="color:#7f8c8d; font-weight:400; font-size:12px;">(1 of ' + list.length + ' new)</span>' : '';
                bar.innerHTML = '<div style="font-weight:700; margin-bottom:4px;">' + (KIND_ICON[m.kind] || '📣') + ' ' + esc(m.title || 'Message from MyDukaPOS') + more + '</div>'
                    + '<div style="white-space:pre-wrap; line-height:1.45;">' + esc(m.body) + '</div><div class="owner-msg-actions" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;"></div>';
                var acts = bar.querySelector('.owner-msg-actions');
                var btn = function (label, primary, fn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.style.cssText = 'border:0; border-radius:6px; padding:8px 12px; font-weight:600; cursor:pointer; ' + (primary ? 'background:#27ae60; color:#fff;' : 'background:#ecf0f1; color:#2c3e50;'); b.onclick = function () { fn(); bar.remove(); setTimeout(showNextMessage, 400); }; acts.appendChild(b); };
                if (m.kind === 'install' && m.installPlatform) {
                    var pl = m.installPlatform === 'android' ? 'Android' : 'Windows';
                    btn('Install ' + pl + ' App', true, function () { markSeen(m.id, Date.now() + 86400000); openInstallSettings(); });
                    btn('Continue Using Web App', false, function () { markSeen(m.id, Date.now() + 7 * 86400000); });
                    btn("Don't Show Again", false, function () { markSeen(m.id, 'never'); });
                } else {
                    btn('OK', true, function () { markSeen(m.id, 'never'); });
                }
                document.body.appendChild(bar);
            } catch (e) { /* a message never breaks the app */ }
        }
        function messagesCard() {
            var list = msgs().filter(applies);
            if (!list.length) return '';
            return card('📣 Messages from MyDukaPOS', list.map(function (m) {
                return '<div style="border-top:1px solid #eee; padding:8px 0; font-size:13px;"><strong>' + (KIND_ICON[m.kind] || '📣') + ' ' + esc(m.title || '') + '</strong>'
                    + (m.publishedAt ? ' <span style="color:#95a5a6; font-size:12px;">' + esc(new Date(m.publishedAt).toLocaleDateString('en-GB')) + '</span>' : '')
                    + '<div style="white-space:pre-wrap; margin-top:3px;">' + esc(m.body) + '</div></div>';
            }).join(''));
        }

        function start() {
            if (info.platform !== 'web') { try { document.documentElement.classList.add('native-' + info.platform); } catch (e) {} }
            loadReleases().then(function () { renderPanel(); updateNotice(); });
            setTimeout(function () { showNextMessage(); fetchMessages(); }, 2500);           // the last ones kept on this device first, then the server's
            setInterval(fetchMessages, 10 * 60000);
            renderPanel();
            // the panel is redrawn whenever Settings ▸ Install App is opened
            document.addEventListener('click', function (ev) {
                var b = ev.target && ev.target.closest && ev.target.closest('[data-section="settings-section-install"]');
                if (b) setTimeout(function () { loadReleases().then(renderPanel); renderPanel(); }, 0);
            });
            try { if (window.PosNet && window.PosNet.subscribe) window.PosNet.subscribe(function (s) { if (s === 'online') { fetchMessages(); if (!releases) loadReleases().then(function () { renderPanel(); updateNotice(); }); } }); } catch (e) { /* optional */ }
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0);
    })();
    </script>
