<!-- HOTEL MOBILE (zip 339) ---------------------------------------------------------------------------------------------------------
     Phone layout for the hotel app (640 px and narrower). Layout only: no ids, handlers, prices or saves are touched.
       - A shorter top bar (the clock sits beside the menu button, the buttons are smaller and wrap in one tidy block).
       - Forms that were rows of small mismatched boxes (Bar "Set up a drink", Rooms reservation, Facilities, Service requests, Room types)
         become one clear column: each box full width, two short ones side by side, buttons full width.
       - Product tiles on the Sales counter: square pictures (zip 357; were 16:10 and looked squeezed).
       - The floating keyboard button no longer covers the page on a phone (the phone's own keyboard is used).
       - Tables never push the page sideways: they scroll inside their own box.
     Classes: hm-*. -->
<style id="hm-css">
@media (max-width: 640px) {
  html body > header { padding: 8px 10px !important; gap: 6px 8px !important; min-height: 0 !important; }
  html body > header .header-actions { gap: 6px !important; row-gap: 6px !important; flex-wrap: wrap; }
  html body > header .header-actions > button, html body > header .header-actions .server-btn, html body > header .header-actions .help-btn,
  html body > header .header-actions .theme-toggle-btn, html body > header .header-actions .notif-btn { min-height: 34px; padding: 4px 10px !important; font-size: 12.5px !important; }
  html body.snav-on > header #snav-burger { width: 38px; height: 38px; margin-right: 6px; }
  html body .floating-kb-btn { display: none !important; }
  /* forms that were rows of small boxes -> one column */
  html body .tab-content :is(.bar-cfg, .bar-cfg-row) { max-width: none !important; width: 100%; }
  html body .tab-content .bar-cfg > label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 100%; }
  html body .tab-content .bar-cfg-row { display: grid !important; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px !important; align-items: center; padding: 8px; border: 1px solid var(--border-color, #e1e6ea); border-radius: 10px; }
  html body .tab-content .bar-cfg-row > label { display: flex !important; align-items: center; gap: 4px; min-width: 0; width: auto !important; flex-wrap: nowrap !important; font-size: 12px; }
  html body .tab-content .bar-cfg-row > label input[type=checkbox] { flex: 0 0 auto; width: 20px !important; min-height: 20px; }
  html body .tab-content .bar-cfg-row > label input:not([type=checkbox]) { flex: 1 1 0 !important; width: 100% !important; min-width: 0 !important; padding-left: 6px; padding-right: 6px; }
  html body .tab-content .bar-cfg :is(input:not([type=checkbox]):not([type=radio]), select) { max-width: none !important; width: 100% !important; min-width: 0; box-sizing: border-box; flex: 1 1 120px; }
  html body .tab-content .bar-cfg button, html body .tab-content .bar-cfg-row button { width: 100%; min-height: 44px; }
  html body .tab-content div[style*="flex-wrap"] > :is(input:not([type=checkbox]):not([type=radio]), select, textarea) { max-width: none !important; flex: 1 1 calc(50% - 6px); min-width: 120px; width: auto; box-sizing: border-box; }
  html body .tab-content div[style*="flex-wrap"] > label:not(:has(input[type=checkbox])) { flex: 1 1 calc(50% - 6px); min-width: 120px; display: flex; flex-direction: column; gap: 3px; }
  html body .tab-content div[style*="flex-wrap"] > label:not(:has(input[type=checkbox])) > input { width: 100% !important; max-width: none !important; box-sizing: border-box; }
  html body .tab-content div[style*="flex-wrap"] > :is(input[type=tel], input[placeholder*="Rate"], input[placeholder*="Details"], input[placeholder*="Guest"], input[placeholder*="e.g."]) { flex-basis: 100%; }
  html body .tab-content div[style*="flex-wrap"]:not(#inv-cat-bar) > :is(button.btn-main, button:last-child:not(:first-child)) { flex: 1 1 100%; min-height: 44px; }
  html body .tab-content div[style*="display:flex"][style*="gap"]:not([style*="flex-wrap"]) > :is(input:not([type=checkbox]):not([type=radio]), select) { max-width: none !important; min-width: 0; flex: 1 1 0; }
  /* tiles */
  /* zip 357: square like every other screen - a 16:10 box showed each (square) photo shrunk in the middle with grey bands either side */
  html body #sales-tab .item-grid-cell img, html body #sales-tab .item-grid-cell .igc-noimg { aspect-ratio: 1 / 1 !important; width: 100% !important; height: auto !important; }
  html body #sales-tab .item-grid-cell .igc-noimg { font-size: 24px; }
  /* tables scroll inside their own box */
  html body .tab-content :is(.table-scroll, .tbl-wrap, .matrix-wrap) { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  html body .tab-content .panel { padding: 12px !important; }
  html body .tab-content :is(.panel > h3, .panel > h4) { overflow-wrap: anywhere; }
}
</style>
