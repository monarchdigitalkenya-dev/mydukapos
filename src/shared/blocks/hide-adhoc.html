<!-- HIDE UNLISTED (zip 208) ---------------------------------------------
         Settings > General: "Hide the Sell Unlisted Item button". Shop-wide: every device of the shop follows. Off by default = nothing changes.
         Only the button is hidden; an out-of-stock tile still offers its own "sell anyway" prompt, and nothing already sold changes. -->
<style>
    html.hide-adhoc button[onclick="openAdhocSaleModal()"] { display: none !important; }
</style>
<script>
(function () {
    var KEY = 'pos_hide_adhoc';
    function on() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
    function apply() { document.documentElement.classList.toggle('hide-adhoc', on()); }
    apply();
    function rec() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    /* zip 217: shop-wide - the choice travels to every device (see extraSettingsCollect / Apply) */
    window.__shopSwitches = window.__shopSwitches || {};
    window.__shopSwitches.hideAdhoc = { get: function () { var r = rec(); return r === null ? undefined : r === '1'; }, set: function (v) { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) { /* this visit only */ } apply(); var c = document.getElementById('hide-adhoc-toggle'); if (c) c.checked = !!v; } };
    window.setHideAdhoc = function (v) { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) { /* kept for this visit only */ } apply(); try { if (typeof rxPush === 'function') rxPush(); } catch (e) { /* the next change sends it */ } try { showToast(v ? 'The Sell Unlisted Item button is hidden.' : 'The Sell Unlisted Item button is back.'); } catch (e) { /* cosmetic */ } };
    function mount() {
        var sec = document.getElementById('settings-section-general');
        if (!sec || document.getElementById('hide-adhoc-card')) return;
        var d = document.createElement('div');
        d.id = 'hide-adhoc-card'; d.className = 'settings-row';
        d.style.cssText = 'flex-direction:column; align-items:stretch; gap:6px; margin:12px 0; padding:12px 14px; border-radius:12px; background:rgba(127,140,141,.12);';
        d.innerHTML = '<label style="display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; cursor:pointer;"><input type="checkbox" id="hide-adhoc-toggle" style="width:auto;" onchange="setHideAdhoc(this.checked)"> 🚫 Hide the "Sell Unlisted Item" button</label>'
            + '<p class="settings-hint" style="margin:0;">Tick this so cashiers can only sell items that are in your stock list. Applies to every device of this shop; untick to bring the button back.</p>';
        sec.insertBefore(d, sec.firstChild && sec.firstChild.nextSibling ? sec.firstChild.nextSibling : sec.firstChild);
        document.getElementById('hide-adhoc-toggle').checked = on();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
