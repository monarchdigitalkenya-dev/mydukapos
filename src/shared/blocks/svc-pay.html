<script>
/* ===== svc-pay: constants ===== */
var SVC_PAY_KINDS = ['deposit', 'partial', 'final', 'refund'];
var SVC_PAY_BASE_METHODS = [
  { key: 'cash', label: 'Cash', icon: '💵', ref: false },
  { key: 'mpesa', label: 'M-Pesa', icon: '📲', ref: true },
  { key: 'card', label: 'Card', icon: '💳', ref: true },
  { key: 'bank', label: 'Bank', icon: '🏦', ref: true }

var SVC_PAY_DUP_WINDOW_MS = 8000;     /* the same payment typed again within this window (no idempotency key given) is a double tap */
var SVC_PAY_BUSY = 0;                 /* >0 while this block itself writes: its own job commits must not trigger a second bill sync */

/* ===== small helpers ===== */
function svcPayEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function svcPayNowMs() { try { if (typeof svcNow === 'function') return svcNow(); } catch (e) { /* use the clock */ } return Date.now(); }
function svcPayIso(ms) { return new Date(ms).toISOString(); }
function svcPayMoney(n) { try { if (typeof svcFormatMoney === 'function') return svcFormatMoney(n); } catch (e) { /* fall through */ } return 'KSh ' + (Math.round((Number(n) || 0) * 100) / 100); }
function svcPayTol() { return typeof SVC_MONEY_TOL === 'number' ? SVC_MONEY_TOL : 0.005; }
function svcPayCan(perm) { try { if (typeof svcCan === 'function') return !!svcCan(perm); } catch (e) { /* no permission layer: allow */ } return true; }
function svcPayActor() { try { if (typeof svcActor === 'function') { var a = svcActor(); if (a && a.name) return a; } } catch (e) { /* fall through */ } return { id: 'owner', name: 'Owner' }; }
function svcPayNewId(prefix) {
  try { if (typeof svcStShortId === 'function') return svcStShortId(prefix); } catch (e) { /* fall through */ }
  try { if (typeof svcId === 'function') return svcId(prefix); } catch (e2) { /* fall through */ }
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function svcPaySaleId() { try { if (typeof genSaleId === 'function') return String(genSaleId()); } catch (e) { /* fall through */ } return svcPayNewId('s-'); }
function svcPayList(which) {
  try {
    if (which === 'bills') return typeof bills !== 'undefined' && Array.isArray(bills) ? bills : null;
    if (which === 'sales') return typeof salesLog !== 'undefined' && Array.isArray(salesLog) ? salesLog : null;
  } catch (e) { /* TDZ or absent */ }
  return null;
}
function svcPayKey(k) { try { if (typeof appStoreKey === 'function') return appStoreKey(k); } catch (e) { /* plain key */ } return k; }
function svcPaySave(which) {
  var arr = svcPayList(which); if (!arr) return false;
  var key = svcPayKey(which === 'bills' ? 'pos_bills' : 'pos_sales_log');
  try { var s = JSON.stringify(arr); if (typeof safeSetItem === 'function') safeSetItem(key, s); else localStorage.setItem(key, s); return true; } catch (e) { return false; }
}
function svcPayPush() { try { if (typeof queuePush === 'function') queuePush(); else if (typeof markLocalDirty === 'function') markLocalDirty(); } catch (e) { /* saved locally either way */ } }
function svcPayCleanKey(k) { var s = String(k == null ? '' : k).trim(); return /^[A-Za-z0-9_:.\-]{3,60}$/.test(s) ? s : ''; }
function svcPayServedBy() { try { if (typeof activeServerName === 'function') { var n = activeServerName(); if (n) return String(n); } } catch (e) { /* fall through */ } return svcPayActor().name; }

/* ===== payment methods (the shop's enabled ones; M-Pesa = manual code always, STK prompt when the gateway exists) ===== */
function svcPayMethods() {
  var out = SVC_PAY_BASE_METHODS.slice(), cfg = null, allow;
  try { if (typeof svcConfigGet === 'function') { var r = svcConfigGet('cfg-business'); cfg = r && (r.value && typeof r.value === 'object' ? r.value : r); } } catch (e) { cfg = null; }
  if (cfg && Array.isArray(cfg.payMethods) && cfg.payMethods.length) { allow = {}; cfg.payMethods.forEach(function (k) { allow[String(k)] = 1; }); out = out.filter(function (m) { return allow[m.key]; }); }
  if (cfg && Array.isArray(cfg.payMethodsExtra)) {
    cfg.payMethodsExtra.forEach(function (x) {
      if (!x || !x.label) return;
      var k = 'x_' + (typeof svcSlug === 'function' ? svcSlug(x.key || x.label) : String(x.key || x.label).toLowerCase().replace(/[^a-z0-9]+/g, '_'));
      if (!out.some(function (m) { return m.key === k; })) out.push({ key: k, label: String(x.label).slice(0, 24), icon: '🧾', ref: true, extra: true });
    });
  }
  if (!out.length) out = [SVC_PAY_BASE_METHODS[0]];
  return out;
}
function svcPayMethodDef(key) { var l = svcPayMethods(), i; for (i = 0; i < l.length; i++) { if (l[i].key === key) return l[i]; } return null; }
function svcPayMethodLabel(key) {
  var d = svcPayMethodDef(key); if (d) return d.label;
  var b = SVC_PAY_BASE_METHODS, i; for (i = 0; i < b.length; i++) { if (b[i].key === key) return b[i].label; }
  return String(key || '').replace(/^x_/, '').replace(/_/g, ' ');
}
function svcPayStkAvailable() { try { return typeof createMpesaStkFlow === 'function' && typeof MPESA_STK_URL !== 'undefined'; } catch (e) { return false; } }
/* the classic sale-record money fields for one payment (same shape confirmBillSettleImpl writes): amount is negative for a refund */
function svcPayMoneyFields(method, amount, ref, payer, tendered, change) {
  var f = { paymentMethod: method, cashAmount: 0, mpesaAmount: 0, cardAmount: 0, amountTendered: 0, change: 0 };
  if (method === 'cash') { f.cashAmount = amount; f.amountTendered = tendered != null ? tendered : amount; f.change = change || 0; }
  else if (method === 'mpesa') { f.mpesaAmount = amount; if (ref) f.mpesaReceiptNumber = ref; if (payer) f.mpesaPayerName = payer; }
  else { f.cardAmount = amount; if (ref) f.cardReference = ref; }
  return f;
}
function svcPayCleanRef(raw, method) {
  var s = String(raw == null ? '' : raw).trim();
  if (method === 'mpesa') s = s.replace(/\s+/g, '').toUpperCase();
  return s.slice(0, 40);
}

/* ===== job access ===== */
function svcPayJob(id) { var j = null; try { if (typeof svcGetJob === 'function') j = svcGetJob(id); } catch (e) { j = null; } return j; }
/* -> {job} or {err:{ok:false, code, why}} */
function svcPayCheck(id) {
  var j = svcPayJob(id);
  if (!j) return { err: { ok: false, code: 'notfound', why: 'That job could not be found.' } };
  if (j._legacy) return { err: { ok: false, code: 'legacy', action: 'promote', why: 'This is a classic job: take the payment in the classic counter, or upgrade it to a full job first.' } };
  if (j._deleted) return { err: { ok: false, code: 'deleted', why: 'This job was deleted.' } };
  return { job: j };
}
function svcPayCustomerName(job) { var n = job && job.customer && job.customer.name; return n ? String(n) : 'Walk-in customer'; }
function svcPayLivePayments(job) { return (Array.isArray(job && job.payments) ? job.payments : []).filter(function (p) { return p && !p.voidedAt; }); }
function svcPayFindPayment(job, id) { var l = Array.isArray(job && job.payments) ? job.payments : [], i; for (i = 0; i < l.length; i++) { if (l[i] && (l[i].id === id || l[i].billPayId === id)) return l[i]; } return null; }
function svcPayRefunded(job, payId) { var s = 0; svcPayLivePayments(job).forEach(function (p) { if (p.kind === 'refund' && p.refId === payId) s += Math.abs(Number(p.amount) || 0); }); return svcRound2(s); }
function svcPayRefundable(job, p) { return p && p.kind !== 'refund' && Number(p.amount) > 0 ? svcRound2(Number(p.amount) - svcPayRefunded(job, p.id)) : 0; }
function svcPayDupResult(job, row) {
  var t = svcTotals(job);
  return { ok: true, duplicate: true, payment: row, job: job, totals: t, bill: svcPayFindBill(job) };
}

/* ===== bill lines: the bill mirrors svcTotals(job).lines ===== */
function svcPayLineKey(l) { return [l.kind, l.name, svcRound2(l.qty), svcRound2(l.price)].join('|'); }
/* what the bill must add up to: the job total; a deposit taken before the work is priced is carried as one "on account" line until the quote exists */
function svcPayTarget(job, t) {
  var tol = svcPayTol(), lines = [];
  if (t.total <= tol && t.paid > tol) {
    lines.push({ kind: 'advance', name: 'Deposit on account (work not yet priced)', qty: 1, price: t.paid });
    lines[0].key = svcPayLineKey(lines[0]);
    return { lines: lines, total: t.paid, advance: true };
  }
  (t.lines || []).forEach(function (l) { var x = { kind: l.kind, name: l.name || 'Service', qty: l.qty == null ? 1 : l.qty, price: l.price }; x.key = svcPayLineKey(x); lines.push(x); });
  return { lines: lines, total: t.total, advance: false };
}
function svcPayItem(l) {
  return { code: 'SVCJOB-' + String(l.kind).toUpperCase(), name: String(l.name).slice(0, 120), qty: l.qty, price: l.price, wholesalePrice: 0, unit: l.kind === 'part' ? 'pcs' : 'service', isService: true, vatCategory: 'A', svcLine: l.key };
}
function svcPayBillTotal(bill) { var s = 0; (Array.isArray(bill && bill.items) ? bill.items : []).forEach(function (l) { if (l) s += (Number(l.price) || 0) * (Number(l.qty) || 0); }); return svcRound2(s); }
/* append-only: lines the job has and the bill lacks are appended; lines the bill has and the job no longer has are cancelled by a negative "Revision" line; earlier lines are never edited. -> {added, cancelled, adj} */
function svcPayDiffLines(bill, target) {
  var items = Array.isArray(bill.items) ? bill.items : (bill.items = []), have = {}, rep = {}, want = {}, wrep = {}, keys = {}, i, it, res = { added: 0, cancelled: 0, adj: false };
  for (i = 0; i < items.length; i++) {
    it = items[i]; if (!it) continue;
    if (it.svcLine) { have[it.svcLine] = (have[it.svcLine] || 0) + 1; if (!rep[it.svcLine]) rep[it.svcLine] = it; }
    if (it.svcCancels) have[it.svcCancels] = (have[it.svcCancels] || 0) - 1;
  }
  target.lines.forEach(function (l) { want[l.key] = (want[l.key] || 0) + 1; wrep[l.key] = l; });
  Object.keys(have).forEach(function (k) { keys[k] = 1; });
  Object.keys(want).forEach(function (k) { keys[k] = 1; });
  Object.keys(keys).forEach(function (k) {
    var d = (want[k] || 0) - (have[k] || 0), base;
    while (d > 0) { items.push(svcPayItem(wrep[k])); res.added++; d--; }
    while (d < 0) {
      base = rep[k]; if (!base) break;
      items.push({ code: base.code, name: 'Revision — removed: ' + String(base.name).slice(0, 100), qty: base.qty, price: -(Number(base.price) || 0), wholesalePrice: 0, unit: base.unit, isService: true, vatCategory: 'A', svcCancels: k });
      res.cancelled++; d++;
    }
  });
  var diff = svcRound2(target.total - svcPayBillTotal(bill));
  if (Math.abs(diff) > svcPayTol()) { items.push({ code: 'SVCJOB-ADJ', name: 'Revision — adjustment', qty: 1, price: diff, wholesalePrice: 0, unit: 'service', isService: true, vatCategory: 'A', svcAdj: true }); res.adj = true; }
  return res;
}
/* amountPaid / status / closed exactly as the Bills tab keeps them (recomputeBillStatus); a bill that gets a new charge after it was settled re-opens */
function svcPayRecompute(bill, now) {
  var before = bill.status + '|' + bill.closed;
  if (typeof recomputeBillStatus === 'function') { try { recomputeBillStatus(bill); } catch (e) { svcPayRecomputeLocal(bill); } }
  else svcPayRecomputeLocal(bill);
  if (!bill.closed) { if (bill.closedAt) delete bill.closedAt; }
  else if (!bill.closedAt) bill.closedAt = svcPayIso(now);
  return before !== bill.status + '|' + bill.closed;
}
function svcPayRecomputeLocal(bill) {
  var total = svcPayBillTotal(bill), out = svcRound2(Math.max(0, total - (Number(bill.amountPaid) || 0)));
  bill.status = out <= 0.005 ? 'fully_paid' : ((Number(bill.amountPaid) || 0) > 0 ? 'partially_paid' : 'unpaid');
  bill.closed = bill.status === 'fully_paid';
}

/* ===== bill lookup ===== */
function svcPayBillId(job) { return 'svcb-' + job.id; }
function svcPayFindBill(job) {
  var b = svcPayList('bills'); if (!b || !job) return null;
  var i, canon = svcPayBillId(job), byLink = null, byTag = null;
  for (i = 0; i < b.length; i++) {
    if (!b[i]) continue;
    if (String(b[i].id) === canon) return b[i];
    if (!byLink && job.billId && String(b[i].id) === String(job.billId)) byLink = b[i];
    if (!byTag && b[i].svcJobId === job.id) byTag = b[i];
  }

}
function svcPayNewBill(job, target, now) {
  var ref = ''; try { if (typeof generateReceiptRef === 'function') ref = generateReceiptRef(); } catch (e) { ref = ''; }
  var bill = {
    id: svcPayBillId(job), timestamp: svcPayIso(now), paymentMethod: 'bill', paid: false, cashAmount: 0, mpesaAmount: 0, cardAmount: 0, amountTendered: 0, change: 0,
    servedBy: svcPayServedBy(), customerName: svcPayCustomerName(job), customerPhone: (job.customer && job.customer.phone) || null, tableOrRoom: null, receivingAccount: null,
    items: [], amountPaid: 0, paymentHistory: [], fulfillmentType: 'carried_immediately', fulfillmentStatus: 'fulfilled', inventoryDeducted: true, dueDate: null,
    svcBill: true, svcJobId: job.id, svcJobNo: job.no || '', updatedAt: now

  if (ref) bill.refNumber = ref;
  target.lines.forEach(function (l) { bill.items.push(svcPayItem(l)); });
  return bill;
}

/* ===== bill <-> job synchronisation (idempotent; the job is the truth, the bill is the ledger the Bills / Debts screens read) ===== */
/* dir 1: a payment taken on the Bills tab (classic Settle) is mirrored into job.payments so the job's paid / balance stay right */
function svcPayMirrorToJob(job, bill) {
  var hist = Array.isArray(bill.paymentHistory) ? bill.paymentHistory : [], rows = [], i, h, sales = svcPayList('sales') || [];
  for (i = 0; i < hist.length; i++) {
    h = hist[i]; if (!h || h.id == null || !Number(h.amount)) continue;
    if (svcPayFindPayment(job, h.id)) continue;
    var at = Date.parse(h.timestamp) || svcPayNowMs(), line = null, k;
    for (k = 0; k < sales.length; k++) { var s = sales[k]; if (s && s.billId === bill.id && !s.svcPayId && Math.abs((Date.parse(s.timestamp) || 0) - at) < 5000 && Math.abs(svcRound2((s.items && s.items[0] && Number(s.items[0].price)) || 0) - svcRound2(h.amount)) < 0.01) { line = s; break; } }
    var amt = svcRound2(h.amount);
    rows.push({ id: String(h.id), at: at, amount: amt, method: h.method || 'cash', ref: h.reference || '', by: (line && line.servedBy) || 'Bills tab', byId: '', kind: amt > 0 ? 'partial' : 'refund', billPayId: String(h.id), saleId: line ? line.id : undefined, viaBills: true, rev: 0 });
  }

    var res = svcCommit(function (j) { j.payments = (Array.isArray(j.payments) ? j.payments : []).concat(rows); if (!j.billId) j.billId = bill.id; return j; },
      { list: 'svcJobs', id: job.id, audit: { act: 'payment.sync', note: rows.length + ' payment(s) taken on the Bills tab were added to this job' } });
    return res && res.ok ? rows.length : 0;

/* dir 2: every job payment has a paymentHistory entry on the bill; amountPaid = sum of the history (refunds are negative entries) */

    h += '<div data-svp-when="cash"><label for="svp-tend">Cash given (optional)</label><input id="svp-tend" type="text" inputmode="decimal" autocomplete="off" placeholder="to work out change"></div>';
    h += '<div data-svp-when="ref"><label for="svp-ref">Reference / M-Pesa code</label><input id="svp-ref" type="text" autocomplete="off" autocapitalize="characters" maxlength="40"></div>';
    h += '<div data-svp-when="mpesa"><label for="svp-payer">Payer name (optional)</label><input id="svp-payer" type="text" autocomplete="off" maxlength="60"></div>';
    if (svcPayStkAvailable()) h += '<div data-svp-when="mpesa"><label for="svp-stk-phone">Customer phone for an M-Pesa prompt</label><input id="svp-stk-phone" type="tel" inputmode="tel" autocomplete="off" value="' + svcPayEsc((job.customer && job.customer.phone) || '') + '"><div class="svp-row"><button type="button" id="svp-stk-btn" class="svp-btn" data-svp-act="stk">📲 Send STK prompt</button></div><div id="svp-stk-status" class="svp-info" aria-live="polite"></div></div>';
  }
  if (mode === 'refund') {
    h += '<label for="svp-reason">Reason (required)</label><input id="svp-reason" type="text" autocomplete="off" maxlength="160">';
    h += '<label for="svp-ref">Refund reference (optional)</label><input id="svp-ref" type="text" autocomplete="off" maxlength="40">';
  } else {
    h += '<label for="svp-note">Note (optional)</label><input id="svp-note" type="text" autocomplete="off" maxlength="160">';
  }
  if (mode === 'checkout' && t.balance > tol && canFin) {
    h += '<label class="svp-chk"><input type="checkbox" id="svp-release"> Release the item with the balance still owing (stays on the open bill)</label><div data-svp-when="release"><label for="svp-rel-reason">Reason (required)</label><input id="svp-rel-reason" type="text" autocomplete="off" maxlength="160"></div>';
  }
  if (mode !== 'refund') h += '<label class="svp-chk"><input type="checkbox" id="svp-print" checked> Open the receipt after saving</label>';
  h += '<div id="svp-info" class="svp-info" aria-live="polite"></div><div id="svp-err" class="svp-err" role="alert"></div>';
  h += '<div class="svp-row"><button type="button" class="svp-btn" data-svp-act="cancel">Cancel</button><button type="submit" class="svp-btn primary" data-svp-act="submit">' + svcPayEsc(mode === 'refund' ? 'Record refund' : (mode === 'checkout' ? 'Complete checkout' : 'Record payment')) + '</button></div></form>';
  return h;
}
function svcPaySyncSheet(el) {
  var st = svcPayUiState(el, el.getAttribute('data-svp-job')), m = svcPayMethodDef(st.method) || svcPayMethods()[0], rel = el.querySelector('#svp-release');
  if (m && st.method !== m.key) st.method = m.key;
  var blocks = el.querySelectorAll('[data-svp-when]'), i;
  for (i = 0; i < blocks.length; i++) {
    var w = blocks[i].getAttribute('data-svp-when'), show = false;
    if (w === 'cash') show = st.method === 'cash';
    else if (w === 'ref') show = !!(m && m.ref);
    else if (w === 'mpesa') show = st.method === 'mpesa';
    else if (w === 'release') show = !!(rel && rel.checked);
    blocks[i].style.display = show ? '' : 'none';
  }
  var btns = el.querySelectorAll('[data-svp-act="method"]');
  for (i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-m') === st.method ? 'true' : 'false');
  svcPaySheetInfo(el);
}
function svcPaySheetInfo(el) {
  var info = el.querySelector('#svp-info'); if (!info) return;
  var amt = svcNum(svcPayVal('svp-amt')), tend = svcPayVal('svp-tend'), rel = el.querySelector('#svp-release');
  if (rel && rel.checked) { info.textContent = 'The job is released with the balance still owing; it stays in Bills until it is paid.'; return; }
  if (svcPayVal('svp-tend') !== '' && amt > 0) { var ch = svcRound2(svcNum(tend) - amt); info.textContent = ch >= 0 ? 'Change to give: ' + svcPayMoney(ch) : 'The cash given is less than the amount.'; }
  else info.textContent = '';
}
function svcPayShowErr(el, msg) { var e = el.querySelector('#svp-err'); if (e) e.textContent = msg || ''; }
function svcPayAct(el, act, btn) {
  var jobId = el.getAttribute('data-svp-job'), st = svcPayUiState(el, jobId);
  if (act === 'open') {
    st.sheet = btn.getAttribute('data-mode'); st.key = svcPayNewId('pk-'); st.refId = btn.getAttribute('data-pay') || ''; st.busy = false;
    if (!svcPayMethodDef(st.method)) st.method = svcPayMethods()[0].key;
    svcPayRefreshTabLocal(el);
    try { var f = el.querySelector('#svp-amt'); if (f && !f.readOnly && f.focus) f.focus(); var sh = el.querySelector('.svp-sheet'); if (sh && sh.scrollIntoView) sh.scrollIntoView({ block: 'nearest' }); } catch (e) { /* focus is cosmetic */ }
    return;
  }
  if (act === 'cancel') { st.sheet = null; st.stk = null; svcPayRefreshTabLocal(el); return; }
  if (act === 'method') { st.method = btn.getAttribute('data-m'); svcPaySyncSheet(el); return; }
  if (act === 'quick') {
    var sum = svcPaySummary(jobId), q = btn.getAttribute('data-q'), f2 = el.querySelector('#svp-amt'); if (!sum || !f2) return;
    if (q === 'half') f2.value = String(svcRound2(sum.balance / 2)); else if (q === 'full') f2.value = String(sum.balance);
    else if (q === 'refundall') { var o = null; sum.payments.forEach(function (p) { if (p.id === st.refId) o = p; }); if (o) f2.value = String(o.refundable); }
    svcPaySheetInfo(el); return;
  }
  if (act === 'receipt') {
    var r = svcPayPrintReceipt(jobId, btn.getAttribute('data-pay') || null);
    if (!r.ok) svcPayToast(svcPayWhy(r), true);
    return;
  }
  if (act === 'stk') { svcPayStkSend(el, st); return; }
  if (act === 'submit') svcPaySubmit(el, st);
}
function svcPayRefreshTabLocal(el) { var id = el.getAttribute('data-svp-job'), job = id && svcPayJob(id); if (job) svcPayRenderTab(job, el); }
function svcPayStkSend(el, st) {
  if (!st.stk) {
    try {
      st.stk = createMpesaStkFlow({ phoneInputId: 'svp-stk-phone', codeInputId: 'svp-ref', statusElId: 'svp-stk-status', sendBtnId: 'svp-stk-btn', description: 'Service payment', sendLabel: '📲 Send STK prompt',
        amountFn: function () { return svcNum(svcPayVal('svp-amt')); }, onConfirmed: function () { svcPaySheetInfo(el); } });
    } catch (e) { st.stk = null; }
  }
  if (st.stk && st.stk.send) st.stk.send(); else svcPayShowErr(el, 'M-Pesa prompts are not available: type the M-Pesa code instead.');
}
function svcPaySubmit(el, st) {
  if (st.busy) return;
  var jobId = el.getAttribute('data-svp-job'), mode = st.sheet; if (!mode) return;
  st.busy = true;
  var btn = el.querySelector('[data-svp-act="submit"]'); if (btn) btn.disabled = true;
  var done = function () { st.busy = false; var b2 = el.querySelector('[data-svp-act="submit"]'); if (b2) b2.disabled = false; };
  var res;
  try {
    var base = { method: st.method, ref: svcPayVal('svp-ref'), payer: svcPayVal('svp-payer'), note: svcPayVal('svp-note'), tendered: svcPayVal('svp-tend') === '' ? undefined : svcPayVal('svp-tend') };
    var ropts = { idemKey: st.key };
    if (mode === 'refund') res = svcRefund(jobId, st.refId, svcPayVal('svp-amt'), svcPayVal('svp-reason'), { idemKey: st.key, ref: svcPayVal('svp-ref') });
    else if (mode === 'checkout') {
      var rel = el.querySelector('#svp-release'), co = { idemKey: st.key, note: base.note };
      if (rel && rel.checked) { co.releaseWithBalance = true; co.reason = svcPayVal('svp-rel-reason'); }
      else if (svcPayVal('svp-amt') !== '' || svcPaySummary(jobId).balance > svcPayTol()) { co.method = base.method; co.ref = base.ref; co.payer = base.payer; co.tendered = base.tendered; }
      res = svcCheckout(jobId, co);
      if (res && res.code === 'dup_ref') res = svcPayConfirmDup(res, function () { co.allowDuplicateRef = true; return svcCheckout(jobId, co); });
    } else {
      base.kind = mode === 'final' ? 'final' : mode; base.amount = svcPayVal('svp-amt');
      res = svcRecordPayment(jobId, base, ropts);
      if (res && res.code === 'dup_ref') res = svcPayConfirmDup(res, function () { ropts.allowDuplicateRef = true; return svcRecordPayment(jobId, base, ropts); });
    }
  } catch (e) { res = { ok: false, why: String((e && e.message) || e) }; }
  if (!res || !res.ok) { svcPayShowErr(el, svcPayWhy(res)); done(); return; }
  var wantPrint = !el.querySelector('#svp-print') || el.querySelector('#svp-print').checked;
  st.sheet = null; st.stk = null; st.key = ''; done();
  var msg = mode === 'refund' ? 'Refund recorded.' : (mode === 'checkout' ? (res.released ? 'Released with the balance on the open bill.' : 'Checkout complete.') : 'Payment recorded.');
  if (res.change > 0) msg += ' Change: ' + svcPayMoney(res.change) + '.';
  svcPayToast(msg);
  (res.warnings || []).forEach(function (w) { svcPayToast(w.msg, true); });
  svcPayRefreshTab(el);
  if (wantPrint && mode !== 'refund') svcPayPrintReceipt(jobId, mode === 'checkout' ? null : (res.payment && res.payment.id) || null);
}
function svcPayConfirmDup(res, retry) {
  var ok = false;
  try { ok = typeof confirm === 'function' && confirm(String(res.why || 'This reference was already used.') + '\n\nRecord it anyway?'); } catch (e) { ok = false; }
  return ok ? retry() : res;
}

/* ===== registration (registries + events only: no edits outside this block) ===== */
try {
  if (typeof svcDrawerRegister === 'function') {
    svcDrawerRegister('payments', { label: '💳 Payments', order: 60, render: svcPayRenderTab, visibleWhen: function (job) { return !!job && !job._legacy && (svcPayCan('svc:pay') || svcPayCan('svc:financials')); } });
  }
} catch (svcPayRegErr) { /* the drawer simply has no payments tab */ }
try {
  if (typeof svcOn === 'function') ['charge:added', 'material:used', 'quote:changed', 'job:updated'].forEach(function (ev) { svcOn(ev, svcPayOnJobEvent); });
} catch (svcPayEvErr) { /* the bill re-syncs whenever the payments tab opens or a payment is taken */ }
</script>
