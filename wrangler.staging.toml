# wrangler.staging.toml — the STAGING copy of the Pages project. Used ONLY by `npm run deploy:staging` (tools/deploy-staging.mjs), which
# swaps it in as wrangler.toml inside a temporary copy — so a staging deploy can never be bound to the live KV namespace.
#
# One-time setup (see STAGING_SETUP.md):
#   npx wrangler kv namespace create mydukapos_kv_staging     -> paste the id below
#   npm run deploy:router:staging                             -> registers the staging Durable Objects
name = "mydukapos-staging"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "mydukapos_kv"
id = "bae0a34b0dd14491a20b204ef9ffad97"

[[durable_objects.bindings]]
name = "SYNC_ROOM"
class_name = "SyncRoom"
script_name = "mydukapos-router-staging"

[[durable_objects.bindings]]
name = "SHOP_STORE"
class_name = "ShopStore"
script_name = "mydukapos-router-staging"

# Small limits so the automatic archive and the size guard can be seen working with a little test data:
# [vars]
# SYNC_MAX_BYTES = "200000"
